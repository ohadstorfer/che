# Hablar — the static content of the speaking tab (docs/hablar-hld.md §2.2, §6).
#
# Pancho is a friendly porteño. Everything he says, and every phrase we suggest
# the learner says, is rioplatense: voseo only, never tú or vosotros, and none
# of the words Appendix B of docs/course-spec.md sends elsewhere.
#
#   npm run hablar:validate   schema + the course's tuteo / regional denylists
#   npm run hablar:build      → src/lib/hablar.json and
#                               supabase/functions/_shared/hablar-content.json
#   npm run hablar:tts        records openers and key phrases in the tomas voice
#                             (only when the owner explicitly asks)
#
# Scenario fields
#   id              slug, stable forever (conversations.topic_id points at it)
#   title_es/en     what the card says
#   setting_es/en   one line, second person, voseo — the brief's first line
#   role_es         who Pancho is in this scene (goes into the prompt)
#   role_en         the same, in English — what the brief shows
#   keyterms        STT biasing for Scribe: scenario words + voseo forms,
#                   each ≤ 50 characters
#   versions        one per level it is written for — A1 (Tourist), A2
#                   (Newcomer), B1 (Neighbor), B2 (Local). A chat runs the
#                   version of its level (or the nearest one written).
#     setting_es/en   optional: this version's own scene
#     role_es/en      optional: this version's own Pancho
#     goals           2–3 {id, es, en}; `es` is a voseo imperative ("Pedí…")
#     key_phrases     3–4 {es, en} the learner could say; recorded with ▶️
#     opener          Pancho's first line; ends in a question
#     keyterms        optional: more STT words for this version
#
# openers.free      three per band, for free chat
# openers.culture   one per culture section slug (src/lib/culture.json);
#                   culture chats are closed to new starts, these keep old
#                   ones loading

scenarios:
  - id: cafe
    title_es: En el café
    title_en: At the café
    setting_es: Estás en un café de San Telmo y el mozo se acerca a tu mesa.
    setting_en: You're at a café in San Telmo and the waiter comes over to your table.
    role_es: el mozo del café
    role_en: the waiter at the café
    keyterms:
      - café con leche
      - medialunas
      - medialuna
      - cortado
      - tostado
      - tostados
      - jugo de naranja
      - la cuenta
      - me traés
      - querés
      - tenés
      - por favor
      - mozo
    versions:
      A1:
        goals:
          - { id: order, es: Pedí un café con leche y medialunas, en: Order a café con leche and medialunas }
          - { id: ask, es: Preguntá si tienen tostados, en: Ask if they have toasted sandwiches }
          - { id: check, es: Pedí la cuenta, en: Ask for the check }
        key_phrases:
          - { es: "Un café con leche, por favor.", en: "A café con leche, please." }
          - { es: "¿Me traés dos medialunas?", en: "Can you bring me two medialunas?" }
          - { es: "¿Tienen tostados?", en: "Do you have toasted sandwiches?" }
          - { es: "¿Me traés la cuenta, por favor?", en: "Can you bring me the check, please?" }
        opener:
          es: "¡Buenas! ¿Qué te traigo?"
          en: "Hi there! What can I get you?"
      A2:
        setting_es: Llegás a un café de San Telmo con una amiga que no habla español.
        setting_en: You arrive at a café in San Telmo with a friend who doesn't speak Spanish.
        goals:
          - { id: both, es: Pedí para vos y para tu amiga, en: Order for you and your friend }
          - { id: ask, es: Preguntá qué trae el tostado, en: Ask what comes in the toasted sandwich }
          - { id: card, es: Preguntá si podés pagar con tarjeta, en: Ask if you can pay by card }
        key_phrases:
          - { es: "Para mí un cortado y para ella un té.", en: "A cortado for me and a tea for her." }
          - { es: "¿Qué trae el tostado?", en: "What comes in the toasted sandwich?" }
          - { es: "¿Puedo pagar con tarjeta?", en: "Can I pay by card?" }
          - { es: "Estaba todo riquísimo, gracias.", en: "Everything was delicious, thanks." }
        opener:
          es: "¡Buenas! ¿Qué les traigo?"
          en: "Hi there! What can I get you two?"
        keyterms: [para mí, para ella, té, tarjeta, qué trae, riquísimo]
      B1:
        setting_es: Pediste un cortado y dos medialunas, pero el mozo te trae otra cosa.
        setting_en: You ordered a cortado and two medialunas, but the waiter brings you something else.
        goals:
          - { id: wrong, es: Explicá que te trajo otra cosa, en: Explain that he brought the wrong thing }
          - { id: swap, es: Pedí que te lo cambie sin enojarte, en: Ask him to change it without getting annoyed }
          - { id: togo, es: Pedí que te lo pongan para llevar, en: Ask for it to go }
        key_phrases:
          - { es: "Disculpá, pero yo había pedido un cortado.", en: "Sorry, but I'd ordered a cortado." }
          - { es: "No pasa nada, ¿me lo podrías cambiar?", en: "No worries, could you change it for me?" }
          - { es: "¿Me lo ponés para llevar?", en: "Can you make it to go?" }
          - { es: "Tengo que irme en diez minutos.", en: "I have to leave in ten minutes." }
        opener:
          es: "Acá tenés: un café con leche y un tostado. ¿Algo más?"
          en: "Here you go: a café con leche and a tostado. Anything else?"
        keyterms: [disculpá, había pedido, otra cosa, me lo podrías cambiar, para llevar, no pasa nada]
      B2:
        setting_es: Esperaste media hora, tu café llegó frío y el mozo parece apurado.
        setting_en: You waited half an hour, your coffee arrived cold and the waiter seems rushed.
        goals:
          - { id: complain, es: Quejate con buena onda, en: "Complain, but keep it friendly" }
          - { id: fix, es: Negociá cómo te lo compensan, en: Negotiate how they make it up to you }
          - { id: close, es: Cerrá la charla sin pelearte, en: Wrap up without a fight }
        key_phrases:
          - { es: "Mirá, no es por molestar, pero el café llegó frío.", en: "Look, I don't want to bother you, but the coffee came cold." }
          - { es: "Entiendo que están a full, pero esperé media hora.", en: "I understand you're very busy, but I waited half an hour." }
          - { es: "Si me lo cambiás, quedamos más que bien.", en: "If you swap it, we're more than fine." }
          - { es: "No te hagas problema, son cosas que pasan.", en: "Don't worry about it, these things happen." }
        opener:
          es: "Perdón por la demora, hoy estamos a full. ¿Todo bien con el café?"
          en: "Sorry for the wait, we're very busy today. Is the coffee all right?"
        keyterms: [frío, media hora, a full, no es por molestar, si me lo cambiás, demora, no te hagas problema]

  - id: kiosco
