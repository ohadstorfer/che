          - { es: "Si me lo preguntabas hace un año, te decía que sí.", en: "If you'd asked me a year ago, I'd have said yes." }
          - { es: "Bueno, voy a buscar algo para tomar. ¡Un gusto!", en: "Well, I'm going to grab a drink. Nice talking to you!" }
        opener:
          es: "¿Vos sos de la familia de la novia o del novio? ¿Cómo terminaste acá?"
          en: "Are you from the bride's side or the groom's? How did you end up here?"
        keyterms: [casamiento, la novia, el novio, anécdota, Bariloche, lo veo distinto, un gusto, no sabés]

  - id: verduleria
    title_es: En la verdulería
    title_en: "At the greengrocer's"
