    setting_en: "You go to the greengrocer's on the corner to buy fruit for the week."
    role_es: el verdulero
    role_en: the greengrocer
    keyterms:
      - verdulería
      - kilo
      - medio kilo
      - manzanas
      - bananas
      - frutillas
      - naranjas
      - tomates
      - paltas
      - lechuga
      - cuánto sale
      - me das
      - nada más
    versions:
      A1:
        goals:
          - { id: kilo, es: Pedí un kilo de fruta, en: Ask for a kilo of fruit }
          - { id: price, es: Preguntá cuánto sale, en: Ask how much it costs }
          - { id: best, es: Preguntá qué fruta está rica hoy, en: Ask which fruit is good today }
        key_phrases:
          - { es: "Quiero un kilo de manzanas.", en: "I want a kilo of apples." }
          - { es: "¿Me das medio kilo de frutillas?", en: "Can you give me half a kilo of strawberries?" }
          - { es: "¿Cuánto sale el kilo?", en: "How much is a kilo?" }
          - { es: "Nada más, gracias.", en: "That's all, thanks." }
        opener:
          es: "¡Buen día! ¿Qué te llevás hoy?"
          en: "Good morning! What would you like today?"
      A2:
        setting_es: Vas a la verdulería a comprar lo que necesitás para una ensalada.
        setting_en: "You go to the greengrocer's to buy what you need for a salad."
        goals:
          - { id: recipe, es: Contá qué vas a cocinar, en: "Say what you're going to make" }
          - { id: amounts, es: Pedí medio kilo de algo y un cuarto de otra cosa, en: Ask for half a kilo of one thing and a quarter kilo of another }
          - { id: bag, es: Pagá y pedí una bolsa, en: Pay and ask for a bag }
        key_phrases:
          - { es: "Voy a hacer una ensalada para cuatro.", en: "I'm going to make a salad for four." }
          - { es: "Dame medio kilo de tomates y un cuarto de cebolla.", en: "Give me half a kilo of tomatoes and a quarter kilo of onions." }
          - { es: "¿Me das una bolsa?", en: "Can I get a bag?" }
          - { es: "¿Cuánto es todo?", en: "How much is it all?" }
        opener:
          es: "¡Buen día! ¿Qué vas a cocinar hoy?"
          en: "Good morning! What are you cooking today?"
        keyterms: [ensalada, un cuarto, cebolla, zanahoria, bolsa, cuánto es todo, voy a hacer]
      B1:
        setting_es: Ayer compraste paltas en esta verdulería y estaban feas por dentro.
        setting_en: Yesterday you bought avocados here and they were bad inside.
        goals:
          - { id: problem, es: Explicá qué pasó con las paltas, en: Explain what happened with the avocados }
          - { id: choose, es: Pedile que te elija las mejores, en: Ask him to pick the best ones }
          - { id: deal, es: Pedí un descuento con buena onda, en: Ask nicely for a discount }
        key_phrases:
          - { es: "Ayer me llevé tres paltas y dos estaban negras.", en: "Yesterday I bought three avocados and two were black inside." }
          - { es: "¿Me elegís unas que estén para hoy?", en: "Can you pick me some that are ready for today?" }
          - { es: "¿No me hacés un precio?", en: "Can't you give me a better price?" }
          - { es: "Dale, no pasa nada, gracias.", en: "OK, no problem, thanks." }
        opener:
          es: "¡Hola de nuevo! ¿Cómo te fue con lo que llevaste ayer?"
          en: "Hi again! How did the stuff you bought yesterday turn out?"
