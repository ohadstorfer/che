      B1:
        setting_es: Querés un alfajor que viste en internet, pero no lo ves en el kiosco.
        setting_en: You want an alfajor you saw online, but you can't see it at the kiosco.
        goals:
          - { id: describe, es: Describí el alfajor que buscás, en: "Describe the alfajor you're looking for" }
          - { id: recommend, es: Pedile que te recomiende otro, en: Ask him to recommend another one }
          - { id: transfer, es: Explicá que la transferencia no te sale, en: "Explain that your transfer isn't going through" }
        key_phrases:
          - { es: "Busco uno de dulce de leche con coco, pero no me acuerdo la marca.", en: "I'm looking for one with dulce de leche and coconut, but I can't remember the brand." }
          - { es: "¿Cuál me recomendarías?", en: "Which one would you recommend?" }
          - { es: "Perdón, no me sale la transferencia.", en: "Sorry, the transfer isn't going through." }
          - { es: "¿Te molesta si te pago en efectivo?", en: "Do you mind if I pay cash?" }
        opener:
          es: "¡Buenas! ¿Buscabas algo en especial?"
          en: "Hi! Were you looking for anything in particular?"
        keyterms: [coco, la marca, no me acuerdo, recomendarías, no me sale, te molesta, en especial]
      B2:
        setting_es: Sos cliente del kiosco de siempre y el kiosquero tiene ganas de charlar sobre los precios.
        setting_en: "You're a regular at your usual kiosco, and the owner wants to chat about prices."
        goals:
          - { id: react, es: Opiná sobre los precios sin bajonearte, en: Give your view on prices and keep it light }
          - { id: compare, es: Compará con los precios de tu país, en: Compare with prices back home }
          - { id: joke, es: Despedite con un chiste, en: Leave with a joke }
        key_phrases:
          - { es: "Uh, la semana pasada estaba mucho más barato.", en: "Wow, last week it was way cheaper." }
          - { es: "En mi país también subió todo, no te creas.", en: "Everything went up in my country too, believe me." }
          - { es: "Si sigue así, voy a tener que dejar los alfajores.", en: "If it keeps up like this, I'll have to give up alfajores." }
          - { es: "Bueno, me voy antes de que suba otra vez.", en: "Well, I'm off before it goes up again." }
        opener:
          es: "¿Viste cómo aumentó todo esta semana? ¿En tu país también pasa?"
          en: "Did you see how everything went up this week? Does that happen in your country too?"
        keyterms: [aumentó, precios, subió todo, no te creas, si sigue así, antes de que suba, bajón]

  - id: conocer
