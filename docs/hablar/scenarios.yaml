        setting_en: You stop at the kiosco before a get-together and want to bring something for everyone.
        goals:
          - { id: several, es: Pedí dos cosas distintas, en: Ask for two different things }
          - { id: compare, es: Preguntá cuál es más barato, en: Ask which one is cheaper }
          - { id: change, es: Preguntá si tiene cambio, en: Ask if he has change }
