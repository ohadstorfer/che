          - { es: "¿Cuál es más barato, este o ese?", en: "Which one's cheaper, this one or that one?" }
          - { es: "¿Tenés cambio de diez mil?", en: "Do you have change for ten thousand?" }
          - { es: "Voy a una juntada con amigos.", en: "I'm going to a get-together with friends." }
        opener:
          es: "¡Hola! ¿Qué vas a llevar?"
          en: "Hi! What are you getting?"
