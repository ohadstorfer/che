          - { es: "¿Tenés alfajores?", en: "Do you have alfajores?" }
          - { es: "Un alfajor de chocolate, por favor.", en: "A chocolate alfajor, please." }
          - { es: "¿Cuánto sale?", en: "How much is it?" }
          - { es: "¿Puedo pagar con tarjeta?", en: "Can I pay by card?" }
        opener:
