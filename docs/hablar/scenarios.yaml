        setting_en: "At a get-together, a guy finds out you moved to Buenos Aires and has a thousand questions."
        role_es: un pibe en la juntada
        role_en: a guy at the get-together
        goals:
          - { id: why, es: Contá por qué te viniste a Buenos Aires, en: Say why you came to Buenos Aires }
          - { id: compare, es: Compará algo de acá con tu país, en: Compare something here with your country }
          - { id: again, es: Proponé volver a verse, en: Suggest meeting up again }
        key_phrases:
          - { es: "Me vine porque quería aprender español en serio.", en: "I came because I really wanted to learn Spanish." }
          - { es: "Lo que más me sorprendió es que acá se cena re tarde.", en: "What surprised me most is that people eat dinner really late here." }
          - { es: "Si querés, la semana que viene tomamos algo.", en: "If you want, we could grab a drink next week." }
          - { es: "¿Me pasás tu número?", en: "Can you give me your number?" }
        opener:
          es: "¿Así que te mudaste a Buenos Aires? ¿Y qué te trajo por acá?"
          en: "So you moved to Buenos Aires? What brought you here?"
        keyterms: [me mudé, me vine, te mudaste, me sorprendió, en serio, tomamos algo, tu número, me pasás]
      B2:
        setting_es: En un casamiento te sientan al lado de alguien que no conocés y la charla se pone interesante.
        setting_en: "At a wedding you're seated next to someone you don't know, and the conversation gets interesting."
        role_es: un invitado del casamiento
        role_en: a guest at the wedding
        goals:
          - { id: story, es: Contá una anécdota de un viaje, en: Tell a story from a trip }
          - { id: debate, es: Defendé tu opinión con humor, en: Defend your opinion with humor }
          - { id: exit, es: Salí de la charla con elegancia, en: Leave the conversation gracefully }
