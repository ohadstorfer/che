          - { es: "¿Qué está de estación ahora?", en: "What's in season now?" }
          - { es: "¿Me lo podrías mandar a casa mañana a la mañana?", en: "Could you send it to my place tomorrow morning?" }
          - { es: "Trato hecho, vengo seguido.", en: "Deal, I come here often." }
        opener:
          es: "¡Uy, cuánta cosa! ¿Es para una fiesta?"
          en: "Whoa, that's a lot! Is it for a party?"
        keyterms: [diez kilos, me lo dejás, de estación, esta época, mandar, a domicilio, trato hecho, conviene]

