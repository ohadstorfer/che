    en: a sure thing
    note: "\"Es fija\": it's certain, it'll happen for sure. From horse-racing slang. Informal."
    example:
      es: Si llueve, es fija que el subte se llena.
      en: If it rains, it's a sure thing the subway fills up.
    gap: fija
    theme: charla
    vulgar: false
    level: 2
  - es: guarangada
    pos: noun
    en: rude comment
    note: Something rude or vulgar said or done.
    example:
      es: Dejá de decir guarangadas delante de mi vieja.
      en: Stop saying rude things in front of my mom.
    gap: guarangadas
    theme: charla
    vulgar: false
    level: 2
  - es: improlijo
