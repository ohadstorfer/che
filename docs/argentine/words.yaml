# Argentine vocabulary — the Words tab's "Argentine" packs.
# Curated from English Wiktionary (Rioplatense / Argentine / Lunfardo senses),
# then extended with everyday slang and expressions Wiktionary lacks, by writer
# and judge agents; published without native review, edits welcome.
# After editing: npm run argentine:build  (checks every word, writes src/lib/argentine.json)
# Fields: scripts/argentine/check.mjs · themes: scripts/argentine/themes.mjs
words:
  - es: a full
    pos: phrase
    en: very busy
    note: 'Full on, all the way: "estoy a full con el laburo". Anglicism, very common and informal.'
    example:
      es: Esta semana estoy a full con los exámenes.
      en: This week I'm very busy with exams.
    gap: a full
    theme: charla
    vulgar: false
    level: 1
  - es: ahre
    pos: intj
    en: just kidding
    tag: Texting slang
    note: Internet and teen slang added at the end of a sentence to mark it as a joke or irony.
    example:
      es: Mañana renuncio y me voy a vivir a Bali, ahre.
      en: Tomorrow I quit and move to Bali, just kidding.
    gap: ahre
    theme: charla
    vulgar: false
    level: 1
  - es: al toque
    pos: phrase
    en: right away
    note: "Very common: \"voy al toque\", I'm coming right now. Informal."
    example:
      es: Esperame, que bajo al toque.
      en: Wait for me, I'll be right down.
    gap: al toque
    theme: charla
    vulgar: false
    level: 1
  - es: alto
    pos: adj
    en: a huge
    tag: Before a noun
    note: 'Placed before a noun for emphasis: "alto quilombo", "alta fiesta". Young, very informal.'
    example:
      es: Anoche fue alta fiesta en lo de Juli.
      en: Last night was a huge party at Juli's.
    gap: alta
    theme: charla
    vulgar: false
    level: 1
  - es: bárbaro
    pos: adj
    en: great
    note: 'Super common way to say great or fine: "¡Bárbaro!". Can also mean extreme.'
    example:
      es: ¡Bárbaro! Nos vemos a las ocho en la esquina.
      en: Great! See you at eight on the corner.
    gap: Bárbaro
    theme: charla
    vulgar: false
    level: 1
  - es: bardo
    pos: noun
    en: mess
    note: 'A mess, trouble or fight. "Se armó bardo": things got ugly. "¡Qué bardo!": what a hassle.'
    example:
      es: Se armó un bardo bárbaro en la salida del boliche.
      en: A huge mess broke out outside the club.
    gap: bardo
    theme: charla
    vulgar: false
    level: 1
  - es: berreta
    pos: adj
    en: cheap, bad quality
    note: Cheap, crappy, low quality. Works for objects, ideas or people.
    example:
      es: Me compré unos auriculares berretas y ya se rompieron.
      en: I bought some cheap headphones and they already broke.
    gap: berretas
    theme: charla
    vulgar: false
    level: 1
  - es: boludez
    pos: noun
    en: silly thing
    note: "Nonsense or a trivial thing. \"No digas boludeces\": don't talk nonsense. Informal."
    example:
      es: Nos peleamos por una boludez.
      en: We fought over a silly thing.
    gap: boludez
    theme: charla
    vulgar: false
    level: 1
  - es: buen día
    pos: intj
    en: good morning
    note: How Argentines say good morning, more than "buenos días".
    example:
      es: Buen día, ¿me da medio kilo de pan?
      en: Good morning, can I have half a kilo of bread?
    gap: Buen día
    theme: charla
    vulgar: false
    level: 1
  - es: buena onda
    pos: adj
    en: nice, friendly
    note: 'Describes a friendly, easygoing person or vibe: "es re buena onda". Opposite: "mala onda".'
    example:
      es: El profe nuevo es re buena onda.
      en: The new teacher is really nice.
    gap: buena onda
    theme: charla
    vulgar: false
    level: 1
  - es: bueno, nada
    pos: phrase
    en: well, anyway
    tag: Filler
    note: Filler to wrap up or change topic when there is nothing more to say. Very typical porteño rhythm.
    example:
      es: Bueno, nada, eso te quería contar. Hablamos después.
      en: Well, anyway, that's what I wanted to tell you. Talk later.
    gap: Bueno, nada
    theme: charla
    vulgar: false
    level: 1
  - es: calorón
    pos: noun
    en: very hot weather
    note: Informal for oppressive heat. Summer in Buenos Aires is famous for it.
    example:
      es: ¡Qué calorón! Vamos a buscar un aire acondicionado.
      en: It's so hot! Let's find some air conditioning.
    gap: calorón
    theme: charla
    vulgar: false
    level: 1
  - es: castellano
    pos: noun
    en: Spanish
    note: Argentines usually call their language "castellano" rather than "español".
    example:
      es: Mi amiga inglesa habla castellano mejor que yo.
      en: My English friend speaks Spanish better than I do.
    gap: castellano
    theme: charla
    vulgar: false
    level: 1
  - es: cero
    pos: adj
    en: zero
    tag: Before a noun
    note: 'Before a noun for emphasis: "cero ganas", "cero onda". Informal, very common.'
    example:
      es: Hoy tengo cero ganas de cocinar, pidamos algo.
      en: I have zero desire to cook today, let's order something.
    gap: cero
    theme: charla
    vulgar: false
    level: 1
  - es: chamuyo
    pos: noun
    en: lies, empty talk
    note: Flattery or made-up talk. "Es puro chamuyo" means it's all BS.
    example:
      es: Eso de que te llamó es puro chamuyo.
      en: That story about him calling you is all lies.
    gap: chamuyo
    theme: charla
    vulgar: false
    level: 1
  - es: che
    pos: intj
    en: hey
    note: The most Argentine word of all, used to get attention or like "man".
    example:
      es: Che, ¿me pasás la sal?
      en: Hey, can you pass me the salt?
    gap: Che
    theme: charla
    vulgar: false
    level: 1
  - es: chimento
    pos: noun
    en: celebrity gossip
    note: Gossip, especially about famous people. TV has whole "programas de chimentos".
    example:
      es: Mi vieja mira todos los programas de chimentos.
      en: My mom watches every celebrity gossip show.
    gap: chimentos
    theme: charla
    vulgar: false
    level: 1
  - es: cómo andás
    pos: phrase
    en: how's it going?
    note: 'The usual greeting with voseo. Reply: "bien, ¿y vos?".'
    example:
      es: Hola, Juli, ¿cómo andás? Tanto tiempo.
      en: Hi Juli, how's it going? Long time no see.
    gap: cómo andás
    theme: charla
    vulgar: false
    level: 1
  - es: copado
    pos: adj
    en: cool
    note: Nice, fun or kind. Used for people, places and plans.
    example:
      es: Tu amiga es re copada, invitala de nuevo.
      en: Your friend is really cool, invite her again.
    gap: copada
    theme: charla
    vulgar: false
    level: 1
  - es: coso
    pos: noun
    en: thing
    note: Used for anything whose name you forget. Also a mildly rude "that guy".
    example:
      es: Pasame el coso ese que está arriba de la mesa.
      en: Pass me that thing on the table.
    gap: coso
    theme: charla
    vulgar: false
    level: 1
  - es: cualquiera
    pos: phrase
    en: that's ridiculous!
    tag: Reaction
    note: "\"¡Cualquiera!\" or \"qué cualquiera\": that's ridiculous, makes no sense. Also \"hacer cualquiera\": act crazy."
    example:
      es: ¿Te cobraron diez lucas por un café? ¡Cualquiera!
      en: They charged you ten thousand pesos for a coffee? That's ridiculous!
    gap: Cualquiera
    theme: charla
    vulgar: false
    level: 1
  - es: dale
    pos: intj
    en: OK
    note: Means OK, sure, or come on! Probably the word you'll hear most.
    example:
      es: ¿Nos vemos a las ocho? Dale, perfecto.
      en: See you at eight? OK, perfect.
    gap: Dale
    theme: charla
    vulgar: false
    level: 1
  - es: de una
    pos: phrase
    en: sure, of course
    note: 'Enthusiastic yes: "¿Vamos? —¡De una!". Informal, very common among young people.'
    example:
      es: —¿Pedimos pizza? —¡De una, me muero de hambre!
      en: —Shall we order pizza? —Sure, I'm really hungry!
    gap: De una
    theme: charla
    vulgar: false
    level: 1
  - es: de vuelta
    pos: adv
    en: again
    note: Very common instead of "otra vez".
    example:
      es: No te entendí, ¿me lo decís de vuelta?
      en: I didn't get it, can you say it again?
    gap: de vuelta
    theme: charla
    vulgar: false
    level: 1
  - es: epa
    pos: intj
    en: wow, hey
    note: Surprise, a warning, or a playful compliment.
    example:
      es: ¡Epa, qué elegante que viniste hoy!
      en: Wow, you look so elegant today!
    gap: Epa
    theme: charla
    vulgar: false
    level: 1
  - es: flor de
    pos: phrase
    en: a great, a huge
    tag: Before a noun
    note: 'Intensifier before a noun: "flor de quilombo" is a huge mess, "flor de asado" a great barbecue.'
    example:
      es: Nos comimos flor de asado el domingo.
      en: We had a great barbecue on Sunday.
    gap: flor de
    theme: charla
    vulgar: false
    level: 1
  - es: garrón
    pos: noun
    en: bad luck, a shame
    note: A bad or annoying situation. "¡Qué garrón!" means what a drag.
    example:
      es: Qué garrón, se suspendió el recital.
      en: What a shame, the concert got canceled.
    gap: garrón
    theme: charla
    vulgar: false
    level: 1
  - es: golazo
    pos: noun
    en: great news
    tag: Celebration
    note: 'Literally a great goal. Used for any great news: "¡Golazo!".'
    example:
      es: ¿Conseguiste el laburo? ¡Golazo!
      en: You got the job? Awesome!
    gap: Golazo
    theme: charla
    vulgar: false
    level: 1
  - es: grupo
    pos: noun
    en: a lie, nonsense
    tag: Not 'group'
    note: "\"Es un grupo\" means it's made up. A \"grupero\" is someone who makes stuff up."
    example:
      es: Eso es puro grupo, no le creas.
      en: That's all lies, don't believe him.
    gap: grupo
    theme: charla
    vulgar: false
    level: 1
  - es: joya
    pos: adj
    en: great
    note: Means great or perfect. "Joya" alone answers "sounds good".
    example:
      es: —Nos vemos a las ocho. —¡Joya!
      en: '"See you at eight." "Great!"'
    gap: Joya
    theme: charla
    vulgar: false
    level: 1
  - es: listo
    pos: intj
    en: done, okay
    note: 'Closes a deal or topic: "listo, nos vemos mañana". Also "¿listo?" to check agreement. Everyday word.'
    example:
      es: Listo, entonces paso a buscarte a las siete.
      en: Okay, so I'll pick you up at seven.
    gap: Listo
    theme: charla
    vulgar: false
    level: 1
  - es: mirá vos
    pos: phrase
    en: well, look at that
    note: 'Reaction to news, real or feigned surprise: "¡Mirá vos!". Can sound ironic with a flat tone.'
    example:
      es: —Se casa Martín. —¡Mirá vos! No sabía que tenía novia.
      en: —Martín is getting married. —Well, look at that! I didn't know he had a girlfriend.
    gap: Mirá vos
    theme: charla
    vulgar: false
    level: 1
  - es: nada que ver
    pos: phrase
    en: not at all
    note: "That has nothing to do with it, or \"not at all\" as a reply. \"Es re nada que ver\": it's totally off."
    example:
      es: ¿Que yo estoy enojado? Nada que ver, estoy cansado.
      en: Me, angry? Not at all, I'm tired.
    gap: Nada que ver
    theme: charla
    vulgar: false
    level: 1
  - es: ni ahí
    pos: phrase
    en: no way
    note: 'Strong denial: no way, not even close. Also "ni ahí con eso": not into it. Informal.'
    example:
      es: Ni ahí voy a esa fiesta, no conozco a nadie.
      en: No way am I going to that party, I don't know anyone.
    gap: Ni ahí
    theme: charla
    vulgar: false
    level: 1
  - es: no da
    pos: phrase
    en: not okay, not cool
    note: "\"No da\" means it's not appropriate or not worth it: \"no da ir así vestido\". Informal."
    example:
      es: No da llegar tarde a la entrevista, salgamos ya.
      en: It's not cool to be late to the interview, let's leave.
    gap: No da
    theme: charla
    vulgar: false
    level: 1
  - es: obvio
    pos: intj
    en: of course
    note: 'The go-to "of course" in Argentina: "¡Obvio!" or "obvio que sí". Informal but used by everyone.'
    example:
      es: —¿Venís al asado? —¡Obvio! ¿Qué llevo?
      en: —Are you coming to the barbecue? —Of course! What should I bring?
    gap: Obvio
    theme: charla
    vulgar: false
    level: 1
  - es: paja
    pos: noun
    en: not feeling like it
    tag: Also vulgar
    note: "\"¡Qué paja!\" means what a drag; \"me da paja\" is I can't be bothered. Also slang for masturbation."
    example:
      es: Me da paja salir con este frío.
      en: I don't feel like going out in this cold.
    gap: paja
    theme: charla
    vulgar: false
    level: 1
  - es: pavada
    pos: noun
    en: silly thing
    note: Something silly or trivial. "¡No digas pavadas!" means don't talk nonsense.
    example:
      es: Se pelearon por una pavada.
      en: They fought over nothing.
    gap: pavada
    theme: charla
    vulgar: false
    level: 1
  - es: pedorro
    pos: adj
    en: bad, boring
    note: Low-quality or disappointing. From "pedo", fart, but used casually by everyone.
    example:
      es: La peli era re pedorra, me dormí.
      en: The movie was so bad, I fell asleep.
    gap: pedorra
    theme: charla
    vulgar: false
    level: 1
  - es: piola
    pos: adj
    en: cool, nice
    note: Cool, easygoing or clever. "Un tipo piola" is a good guy; "quedate piola" means keep quiet, lay low.
    example:
      es: Tu amigo es re piola, me cayó muy bien.
      en: Your friend is really cool, I liked him a lot.
    gap: piola
    theme: charla
    vulgar: false
    level: 1
  - es: ponele
    pos: adv
    en: like, let's say
    note: Filler meaning "let's say" or "sort of"; also "yeah, sure" when unconvinced.
    example:
      es: Llegamos a las nueve, ponele.
      en: We'll get there around nine, let's say.
    gap: ponele
    theme: charla
    vulgar: false
    level: 1
  - es: posta
    pos: adv
    en: for real, seriously
    note: '"Posta" means for real, truly. "¿Posta?" is really? "La posta" is the real deal.'
    example:
      es: ¿Posta que te vas a vivir a España?
      en: Are you seriously moving to Spain?
    gap: Posta
    theme: charla
    vulgar: false
    level: 1
  - es: pucha
    pos: intj
    en: oh no, damn
    note: Mild, polite way to show disappointment or sympathy. Often "¡la pucha!". A softened form of a ruder word, fine to say anywhere.
    example:
      es: Pucha, no llegué a tiempo para el colectivo.
      en: Oh no, I didn't make it in time for the bus.
    gap: Pucha
    theme: charla
    vulgar: false
    level: 1
  - es: qué onda
    pos: phrase
    en: what's up
    note: Casual greeting, or "¿qué onda con...?" to ask what's going on with something. Informal.
    example:
      es: ¿Qué onda, che? ¿Salimos esta noche?
      en: What's up? Are we going out tonight?
    gap: Qué onda
    theme: charla
    vulgar: false
    level: 1
  - es: qué sé yo
    pos: phrase
    en: I don't know
    tag: Filler
    note: 'Shrugging filler when unsure or vague. Often at the end: "...y qué sé yo". Neutral, everyone says it.'
    example:
      es: No sé, podemos ir al cine, al parque, qué sé yo.
      en: I don't know, we could go to the movies, the park, whatever.
    gap: qué sé yo
    theme: charla
    vulgar: false
    level: 1
  - es: re
    pos: adv
    en: really
    tag: Intensifier
    note: 'Everywhere in Argentine speech. Goes before adjectives and verbs: "re lindo", "me re gustó". "Re que sí" = totally.'
    example:
      es: La película estuvo re buena, te va a encantar.
      en: The movie was really good, you're going to love it.
    gap: re
    theme: charla
    vulgar: false
    level: 1
  - es: sí o sí
    pos: phrase
    en: no matter what
    note: 'Without fail, one way or another: "tenés que venir sí o sí". Neutral, everyone uses it.'
    example:
      es: El viernes tenemos que terminar esto sí o sí.
      en: We have to finish this by Friday no matter what.
    gap: sí o sí
    theme: charla
    vulgar: false
    level: 1
  - es: tal cual
    pos: phrase
    en: exactly
    note: "Total agreement: \"¡Tal cual!\", that's exactly it. Informal and very frequent."
    example:
      es: —Este país es una montaña rusa. —Tal cual.
      en: —This country is a roller coaster. —Exactly.
    gap: Tal cual
    theme: charla
    vulgar: false
    level: 1
  - es: tipo
    pos: adv
    en: like
    tag: Filler
    note: 'Filler like English "like": "tipo, no sé". Also means around with times: "tipo ocho", around eight.'
    example:
      es: Nos vemos tipo nueve en la puerta del bar.
      en: See you around nine at the bar door.
    gap: tipo
    theme: charla
    vulgar: false
    level: 1
  - es: todo bien
    pos: phrase
    en: all good
    note: "\"¿Todo bien?\" is a standard greeting; \"todo bien\" also means no problem or it's fine."
    example:
      es: Hola, che, ¿todo bien? Hace mil que no te veo.
      en: Hey, all good? I haven't seen you in ages.
    gap: todo bien
    theme: charla
    vulgar: false
    level: 1
  - es: ufa
    pos: intj
    en: ugh
    note: Shows annoyance or boredom, like a sigh. Kids say it a lot, adults too.
    example:
      es: ¡Ufa! Otra vez se cortó la luz.
      en: Ugh! The power went out again.
    gap: Ufa
    theme: charla
    vulgar: false
    level: 1
  - es: un toque
    pos: phrase
    en: a moment, a sec
    note: 'A little, briefly: "esperá un toque", "un toque de sal". Softens requests. Informal.'
    example:
      es: Esperame un toque que termino y salimos.
      en: Wait a sec, I'll finish and we'll head out.
    gap: un toque
    theme: charla
    vulgar: false
    level: 1
  - es: una banda
    pos: phrase
    en: a lot
    note: 'A lot: "te quiero una banda", "había una banda de gente". Informal, very common.'
    example:
      es: Había una banda de gente en la cancha.
      en: There were a lot of people at the stadium.
    gap: una banda
    theme: charla
    vulgar: false
    level: 1
  - es: viste
    pos: intj
    en: you know
    tag: Filler
    note: 'From "ver". Tag at the end or middle of a sentence: "¿viste?". Porteños use it constantly.'
    example:
      es: Estaba re cansado, ¿viste?, y me fui temprano.
      en: I was really tired, you know, so I left early.
    gap: viste
    theme: charla
    vulgar: false
    level: 1
  - es: ya fue
    pos: phrase
    en: forget it
    note: "Whatever, it's done, let it go. Also to decide on impulse: \"ya fue, me lo compro\"."
    example:
      es: Ya fue, no me contestó. Me voy a dormir.
      en: Forget it, he didn't answer. I'm going to bed.
    gap: Ya fue
    theme: charla
    vulgar: false
    level: 1
  - es: zarpado
    pos: adj
    en: rude, too much
    tag: "Also: awesome"
    note: 'Something or someone out of line or wild. Also "awesome": "un recital zarpado". Context tells you which.'
    example:
      es: Lo que dijo fue re zarpado, todos se quedaron callados.
      en: What he said was really rude, everyone went quiet.
    gap: zarpado
    theme: charla
    vulgar: false
    level: 1
  - es: arrorró
    pos: intj
    en: lullaby
    tag: Lullaby
    note: 'Opening word of the classic lullaby every Argentine knows: "Arrorró mi niño, arrorró mi sol".'
