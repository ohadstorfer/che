      en: If mom sees the car scratched, you're in big trouble.
    gap: boleta
    theme: charla
    vulgar: false
    level: 2
  - es: chorrera
    pos: noun
    en: a lot
    note: '"Una chorrera de" means loads of something.'
    example:
      es: Tengo una chorrera de mails sin contestar.
      en: I have a lot of unanswered emails.
    gap: chorrera
    theme: charla
    vulgar: false
    level: 2
  - es: de diez
    pos: phrase
    en: perfect
    note: 'Excellent, a ten out of ten: "quedó de diez". Casual and positive.'
    example:
      es: La comida estuvo de diez, gracias por invitarnos.
      en: The food was perfect, thanks for inviting us.
    gap: de diez
    theme: charla
    vulgar: false
    level: 2
  - es: de más
    pos: phrase
    en: sure, of course
    note: 'Enthusiastic agreement among young people: "—¿Vamos? —¡De más!". Informal.'
    example:
      es: —¿Te copa ir a la costa? —¡De más!
      en: —Want to go to the coast? —Of course!
    gap: De más
    theme: charla
    vulgar: false
    level: 2
  - es: espeso
