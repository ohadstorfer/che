section:
  slug: "naturaleza"
  title: "Animals"
  emoji: "🦫"
  summary: "The carpincho and the birds you'll see every day"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-carpincho"
    title: "The carpincho"
    summary: "The calm giant that took over a rich neighborhood"
    pages:
      - type: card
        text: "The **carpincho**, or capybara, is the biggest rodent in the world, a relative of mice and guinea pigs. An adult can weigh more than 60 kilos, like a very big dog."
      - type: card
        text: "Carpinchos live in groups near rivers and lakes, in the warm northeast and in the wetlands around Buenos Aires. They eat grass and sleep a lot."
      - type: choice
        prompt: "In 2021, carpinchos were in the news all over the world. Why?"
        options:
          - "One swam across the river to Uruguay"
          - "They walked into a rich private barrio and stayed"
          - "They ate a whole field of yerba"
        correct: 1
        explain: "**Nordelta**, a neighborhood of big houses, was built on the land where they lived. They came back, ate the gardens and crossed the streets. Most of the country was on their side."
      - type: card
        text: "They are calm with everyone. Birds stand on their backs and other animals sit next to them. On the internet they're called the friendliest animal in the world."
      - type: choice
        prompt: "Carpinchos are very good at one sport. Which one?"
        options:
          - "Running long distances"
          - "Jumping fences"
          - "Swimming"
        correct: 2
        explain: "Their feet are a bit like a duck's, and they can stay under water for minutes to hide from danger."
      - type: card
        text: "The best place to see hundreds of them is the **Esteros del Iberá**, in Corrientes: a huge wetland full of birds, deer and **yacarés**, small relatives of the crocodile."
      - type: card
        chip: "Did you know?"
        text: "That's why a carpincho is your guide in this app. Calm, friendly, good with everyone, and very Argentine."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "pajaros"
    title: "The national bird"
    summary: "A small brown builder, loud green parrots and a bird that lies"
    pages:
      - type: card
        text: "Argentina's national bird is not a great eagle. It's the **hornero**: small, brown, and living in every plaza and garden."
      - type: choice
        prompt: "**Hornero** comes from *horno*, oven. Why is the bird called that?"
        options:
          - "It builds a round nest of mud, like an old oven"
          - "It lives near kitchens and eats bread"
          - "Its chest is red like fire"
        correct: 0
        explain: "A pair builds the nest from mud and straw in about two weeks: on a pole, a traffic light, a statue's head. It's a symbol of home and hard work."
      - type: card
        text: "The noise in every park in Buenos Aires comes from **cotorras**: small green parrots. They build huge shared nests of sticks, high in the trees."
      - type: card
        text: "The **benteveo** has a yellow chest and shouts its own name. Many people hear something else in its call: **“¡bicho feo!”**, ugly bug."
      - type: choice
        prompt: "The **ñandú** is the big bird of the open country, as tall as a person. What can't it do?"
        options:
          - "Run fast"
          - "Fly"
          - "Swim"
        correct: 1
        explain: "It runs at up to 60 km/h but never leaves the ground. And the father sits on the eggs and raises the chicks, not the mother."
      - type: card
        text: "The **tero** screams when you come near its nest. But it screams far from the eggs, to send you the wrong way."
      - type: card
        chip: "Did you know?"
        text: "So there's a saying for someone who talks about one thing to hide another: he's **como el tero**. He shouts in one place and has his eggs in another."
    vocabulary: []
