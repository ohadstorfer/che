section:
  slug: "historia-moderna"
  title: "Historia: el siglo XX y hoy"
  emoji: "📜"
  summary: "Perón, the dictatorship, Malvinas, 2001 and why everyone thinks in dollars"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "golpes-peron-y-evita"
    title: "Coups, Perón and Evita"
    summary: "The man who still splits family asados, and the woman millions mourned"
    pages:
      - type: card
        text: "For half a century, the army overthrew governments again and again. The good news: since 1983 Argentina has had its longest run of democracy ever, and most Argentines guard it fiercely."
      - type: card
        text: "**Juan Domingo Perón** was a colonel in the government of the 1943 coup. As labor secretary he backed the unions: pensions, paid holidays, labor courts. Many workers felt they finally had a friend up high."
      - type: choice
        prompt: "In 1945 Perón's rivals forced him out and locked him up on an island. What got him out?"
        options:
          - "A mass march of workers"
          - "A secret deal with the navy"
          - "A ruling from the Supreme Court"
        correct: 0
        explain: "On **17 de octubre**, workers marched into the square and demanded him back. Some cooled their tired feet in the fountains, an image that became legend."
      - type: card
        text: "That night Perón spoke from the balcony of the Casa Rosada. Peronists still celebrate 17 October as the **Día de la Lealtad**, Loyalty Day."
      - type: card
        text: "**Evita**, a young actress from a small town, married Perón. Her foundation built hospitals and schools, and she pushed the law that gave women the vote. She died at 33. Millions queued for days to say goodbye."
      - type: card
        text: "Opponents sneered at Perón's supporters as **descamisados**, the shirtless ones. Perón and Evita turned the insult into a badge of pride."
      - type: choice
        prompt: "Peronists have an animal nickname for anti-Peronists. Which animal?"
        options:
          - "Gorila"
          - "Gallina"
          - "Cuervo"
        correct: 0
        explain: "**Gorila**. It's a jab, so keep it for when you know the room. Anti-Peronists have their own names for Peronists, too."
      - type: card
        text: "A 1955 coup threw Perón out and banned Peronism for almost two decades. He came back, won again and died in office. For fans, social justice. For critics, censorship and a personality cult."
      - type: card
        chip: "Pro tip"
        text: "The divide is **la grieta**, the crack, and it runs right through the family asado. Plenty of families have a no-politics rule at Sunday lunch. Respect it."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-ultima-dictadura"
    title: "The last dictatorship"
    summary: "1976–1983: the disappeared, the Madres and Abuelas, and “Nunca más”"
    pages:
      - type: card
        text: "After Perón died came chaos: guerrilla attacks, far-right death squads, a failing economy. On **24 de marzo de 1976** a military junta led by **Jorge Rafael Videla** seized power."
      - type: card
        text: "The regime hunted anyone it called “subversive”: guerrillas, but also union delegates, students, lawyers, teenagers. People were kidnapped, taken to secret centers like the **ESMA**, tortured, and most were murdered."
      - type: card
        text: "Families got no body and no answer. The victims became **los desaparecidos**, the disappeared. Human rights groups speak of 30,000. The regime destroyed its records, so a full count may never exist."
      - type: choice
        prompt: "In 1977, mothers of the disappeared met in Plaza de Mayo. Gatherings were banned, and police told them to move along. What did they do?"
        options:
          - "Kept walking in pairs around the monument"
          - "Moved their meetings into a church nearby"
          - "Went home and wrote letters abroad"
        correct: 0
        explain: "Standing still was a gathering. Walking wasn't. So they walked, with white headscarves on their heads."
      - type: card
        text: "They're the **Madres de Plaza de Mayo**, and they still walk there on Thursday afternoons. Their white **pañuelo** is painted on the ground around the square's monument."
      - type: card
        text: "Babies born to prisoners were handed to other families under false names. The **Abuelas de Plaza de Mayo**, the grandmothers, have searched for them ever since."
      - type: choice
        prompt: "With the parents gone, how could the Abuelas prove a young person was their grandchild?"
        options:
          - "A DNA test using the grandparents' blood"
          - "Matching old baby photos"
          - "Birth records kept secretly by nurses"
        correct: 0
        explain: "They helped push scientists to create a “grandparent” DNA test. Each **nieto restituido**, a grandchild who gets their identity back, makes national news."
      - type: card
        text: "In 1985 civilian judges put the junta leaders on trial. The prosecutor closed with **“Señores jueces: nunca más.”** Videla got life. The film *Argentina, 1985* tells that story."
      - type: card
        text: "Every 24 March, the **Día de la Memoria**, hundreds of thousands march to Plaza de Mayo with photos of the disappeared: **Memoria, Verdad y Justicia**."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "malvinas"
    title: "Malvinas"
    summary: "The 1982 war, the young soldiers, and a claim nearly every Argentine shares"
    pages:
      - type: card
        text: "The **Islas Malvinas** sit in the South Atlantic, off Patagonia. Britain has held them since 1833 and Argentina has claimed them ever since. Here, always say **Malvinas**, never Falklands."
      - type: card
        text: "In 1982 the dictatorship faced a collapsing economy and growing protests. On **2 de abril** its troops landed on the islands, and crowds cheered in Plaza de Mayo. Britain sent a fleet."
      - type: choice
        prompt: "Who made up most of Argentina's troops on the islands?"
        options:
          - "Conscripts doing military service"
          - "Career soldiers with years of training"
          - "Volunteers who signed up after the landing"
        correct: 0
        explain: "Most were **conscriptos** of 18 or 19, barely out of school, sent to freezing trenches, often underfed and badly equipped."
      - type: card
        text: "649 Argentines died. Almost half of them went down with one ship, the cruiser **General Belgrano**."
      - type: choice
        prompt: "During the war, what did most people at home hear from the news?"
        options:
          - "That Argentina was winning"
          - "Nothing until it was over"
          - "Daily counts of the dead"
        correct: 0
        explain: "Censored news and magazines kept saying **“estamos ganando”**, we're winning, almost until the surrender in June. The shock turned into fury, and the junta fell. Democracy came back in 1983."
      - type: card
        text: "Today 2 April is a national holiday for the **ex combatientes** and **los caídos**, the veterans and the fallen. For years many veterans felt forgotten, and the wounds are still an open subject."
      - type: card
        text: "You'll see **“Las Malvinas son argentinas”** on road signs, murals and buses. The claim is one of the few things almost everyone agrees on. The war is different: most see it as the dictatorship's doomed gamble."
      - type: card
        chip: "Pro tip"
        text: "If it comes up, listen more than you argue. Plenty of Argentines have a relative or neighbor who fought there."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "democracia-y-crisis"
    title: "Democracy, hyperinflation and 2001"
    summary: "From Alfonsín to “que se vayan todos”"
    pages:
      - type: card
        text: "In 1983 democracy returned with **Raúl Alfonsín**. His promise is still quoted: **“con la democracia se come, se cura y se educa”**. With democracy, people eat, heal and learn."
      - type: card
        text: "The economy didn't cooperate. By the end of the decade prices went wild: yearly inflation passed 3,000%. Supermarkets relabeled prices several times a day."
      - type: choice
        prompt: "It's 1989 and you just got paid. What's the smart move?"
        options:
          - "Spend it all that same day"
          - "Put it in a savings account"
          - "Keep it at home for next month"
        correct: 0
        explain: "Money lost value in your pocket by the hour. People ran to the supermarket on payday, a reflex some Argentines still have."
      - type: card
        text: "In 1991 a law fixed it: **one peso = one dollar**, the **convertibilidad**. Inflation fell to almost zero. The decade brought cheap imports and cheap trips abroad."
      - type: card
        text: "The hangover came later: factories closed, unemployment passed 18%, debt piled up to keep the peg alive. That decade still splits dinner tables."
      - type: card
        text: "December 2001: people rushed to pull out their savings, so the government capped withdrawals. That's the **corralito**. The middle class hit the streets banging pots: the **cacerolazo**."
      - type: choice
        prompt: "The protests brought down President De la Rúa, who fled the Casa Rosada by helicopter. How many presidents did Argentina have in about twelve days?"
        options:
          - "Five"
          - "Two"
          - "Three"
        correct: 0
        explain: "Five presidents came and went. The chant on every street was **“¡Que se vayan todos!”**: out with all of them."
      - type: card
        text: "Then the one-to-one peso ended, and the devaluation wiped out much of people's savings. A whole generation learned never to fully trust a bank again."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "pensar-en-dolares"
    title: "Money today: thinking in dollars"
    summary: "Inflation, the dólar blue, arbolitos and cash under the mattress"
    pages:
      - type: card
        text: "After all that, Argentines live by one rule: pesos to spend, dollars to save. Plenty of savings sit at home in cash, **bajo el colchón**, under the mattress."
      - type: choice
        prompt: "You're buying a flat in Palermo. How is it usually paid for?"
        options:
          - "In US dollars, often counted in cash"
          - "In pesos, by bank transfer"
          - "In monthly peso instalments"
        correct: 0
        explain: "Flats and cars are priced in dollars (**U$S**), and it's common for the notes to be counted on the spot at signing."
      - type: card
        text: "Inflation even ate the money itself. Your Argentine grandparents may have used five different currencies, each one born by chopping zeros off the last."
      - type: card
        text: "For years buying dollars was capped, so a parallel market boomed: the **dólar blue**. At one point there were over a dozen dollar rates, even a **dólar Coldplay** for concert tickets."
      - type: choice
        prompt: "On calle Florida, a man keeps muttering “Cambio, cambio.” Locals call him an **arbolito**, a little tree. Why, the story goes?"
        options:
          - "He stands in the same spot all day, like a tree"
          - "He hides behind street trees from the police"
          - "The first ones worked out of a city park"
        correct: 0
        explain: "He's a street money changer. He'll walk you to a **cueva**, a “cave”: the back office where the swap happens."
      - type: card
        text: "Since 2025 anyone can buy dollars freely again. The habit stays: **¿A cuánto está el dólar?** is small talk, like the weather."
      - type: card
        chip: "Pro tip"
        text: "Before you pay, ask. Many shops give a discount for **efectivo** (cash) or transfer. When they ask **“¿Efectivo o tarjeta?”**, the answer can change the price."
    vocabulary: []
