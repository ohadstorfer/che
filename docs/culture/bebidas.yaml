section:
  slug: "bebidas"
  title: "Drinks"
  emoji: "🍷"
  summary: "Wine with ice, one beer for the whole table, fernet and vermut"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-vino"
    title: "Wine, the easy way"
    summary: "How wine is really drunk at a family table, and how to toast"
    pages:
      - type: card
        text: "Wine is **vino**, and at a normal table it's red: **vino tinto**. Nobody smells it or talks about it for ten minutes. You pour and you eat."
      - type: choice
        prompt: "It's a hot day at a family [asado]. What do many people put in their glass of red wine?"
        options:
          - "A slice of orange"
          - "Ice and fizzy water"
          - "A spoon of sugar"
        correct: 1
        explain: "Wine with **soda** and **hielo**, ice. In an expensive restaurant people may look at you. At a family table it's the normal thing in summer."
      - type: card
        text: "The grape that made Argentina famous is **Malbec**. In the dry sun and high land of Mendoza it gives a dark, soft red wine."
      - type: card
        text: "Since 2013, wine is Argentina's national drink by law. [Mate] has a different title: the national infusion."
      - type: choice
        prompt: "In old neighborhood restaurants, house wine comes to the table in a ceramic jug. What shape is the jug?"
        options:
          - "A penguin"
          - "A cow"
          - "A football"
        correct: 0
        explain: "It's the **pingüino**, and the wine comes out of its beak. Nobody is sure why a penguin. Today people buy them as presents."
      - type: card
        text: "For a big party, wine is bought in a **damajuana**: a round glass bottle of five liters with a handle, often in a basket."
      - type: card
        chip: "Pro tip"
        text: "To toast, lift your glass and say **“¡Salud!”** Look the other person in the eyes. And don't toast with water: people say it brings bad luck."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-birra"
    title: "One beer, many glasses"
    summary: "How to order it, share it and buy it at the kiosco"
    pages:
      - type: card
        text: "Beer is **cerveza**, and between friends it's **birra**, from Italian. **“¿Tomamos una birra?”** is an invitation to talk, more than to drink."
      - type: choice
        prompt: "Four friends sit down at a bar and order beer. What usually comes to the table?"
        options:
          - "Four small bottles"
          - "One big bottle and four glasses"
          - "One very big glass with four straws"
        correct: 1
        explain: "The classic size is the liter bottle, and it's for sharing. You fill the others' glasses before your own."
      - type: card
        text: "The classic brand is **Quilmes**, with the colors of the flag on its label. It was born in 1888 in the city of Quilmes, just south of Buenos Aires."
      - type: card
        text: "A small bottle for one person is a **porrón**. Beer from the tap is **tirada**, and a tall glass of it is a **pinta**, from the English *pint*."
      - type: choice
        prompt: "You want to buy a liter of beer at the [kiosco] and the seller asks **“¿Tenés envase?”** What does he want?"
        options:
          - "Your ID, to see your age"
          - "A bag to carry it"
          - "An empty bottle to swap"
        correct: 2
        explain: "The glass bottle, the **envase**, is used again and again. You bring an empty one or you pay extra. That's why homes keep empty bottles by the door."
      - type: card
        text: "In the last ten years, small breweries opened in every barrio, selling their own beer: **cerveza artesanal**. The early evening, when it's cheaper, is the *happy hour*, said in English."
      - type: card
        text: "The usual thing to eat with it is a **picada**: a board of cheese, salami, olives and bread in the middle of the table. Everyone picks from it with their hands."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "fernet-y-vermut"
    title: "Fernet and vermut"
    summary: "A bitter black drink for parties, and an old custom that came back"
    pages:
      - type: card
        text: "**Fernet** is a black, bitter drink made from herbs. In Italy it's a small glass after dinner, for the stomach. In Argentina it's the drink of every party, mixed with cola and lots of ice: **fernet con coca**."
      - type: card
        text: "Argentina drinks about three quarters of all the [fernet] in the world. The only factory of the famous Italian brand outside Italy is here."
      - type: choice
        prompt: "At a party with no tall glasses, what do friends often mix the [fernet] in?"
        options:
          - "A cooking pot"
          - "A metal bucket"
          - "A big plastic bottle cut in half"
        correct: 2
        explain: "The bottom half of a cola bottle becomes one huge glass, and it goes from hand to hand, like a mate."
      - type: card
        text: "The home of [fernet] is **Córdoba**. People there drink more of it than anywhere else, and they will tell you so."
      - type: card
        text: "How much [fernet], how much cola, how much foam on top: everyone has their own rule, and everyone says the others do it wrong."
      - type: choice
        prompt: "The **hora del vermut** is an old custom: a drink and something small to eat. When is it?"
        options:
          - "Before lunch or dinner"
          - "After midnight"
          - "With breakfast"
        correct: 0
        explain: "**Vermut** is a wine with herbs, sweet and a little bitter, served with soda and ice. With it come olives, cheese and salami. Grandfathers did it; now young bars do too."
      - type: card
        text: "The fizzy water comes from a **sifón**: a thick bottle that shoots soda when you press a handle. For a century it has been on every table next to the wine."
      - type: card
        text: "In many barrios the **sodero** still comes by truck once a week. He leaves full sifones and takes the empty ones. Families keep the same [sodero] for decades."
    vocabulary: []
