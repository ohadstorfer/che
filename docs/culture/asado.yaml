section:
  slug: "asado"
  title: "Asado"
  emoji: "🥩"
  summary: "Fire, meat and a whole Sunday with your people"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-ritual"
    title: "More than a barbecue"
    summary: "Why an asado is a whole afternoon, not a meal"
    pages:
      - type: card
        text: "An **asado** is grilled meat, sure. But mostly it's an excuse to spend the whole day together. **¿Hacemos un asado?** really means: want to hang out?"
      - type: choice
        prompt: "The invite says **“Vení a la una.”** Come at one. When will you probably eat?"
        options:
          - "Right at one"
          - "An hour or two later"
          - "Around dinner time"
        correct: 1
        explain: "The fire is slow, and so is everything else. Have a drink by the grill and eat when the asador says so."
      - type: card
        text: "Every asado has one **asador**, in charge of the fire and the meat. It's a role with a lot of pride. Everyone else keeps them company by the grill, drink in hand."
      - type: card
        text: "An asado is also how Argentines celebrate almost anything: a birthday, a win, a new job, a Friday."
      - type: choice
        prompt: "Builders just poured the concrete roof of a new house. What does the owner traditionally pay for?"
        options:
          - "An asado for the whole crew"
          - "A day off for the whole crew"
          - "A cash bonus for the foreman"
        correct: 0
        explain: "The **asado de la losa**, for the finished roof slab. The crew grills right there on site, on bricks and a scrap of iron grate."
      - type: card
        text: "For lots of families it's a weekly date: **el asado del domingo**. Same backyard, same asador, same arguments."
      - type: card
        chip: "Did you know?"
        text: "**Asado** is also the name of a cut: the ribs. So yes, you can eat asado at an asado."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "el-fuego"
    title: "Playing with fire"
    summary: "Embers, firewood, salt and how you like it"
    pages:
      - type: card
        text: "The **parrilla** is the grill: an iron grate, often built into the backyard in brick. Plenty of city apartments have a little one on the balcony. Priorities."
      - type: card
        text: "No balcony? Lots of apartment buildings have a **quincho**: a shared room with a parrilla, often on the roof. Neighbors book it for the weekend."
      - type: choice
        prompt: "What's the secret of a good asado fire?"
        options:
          - "No flames under the meat at all"
          - "Tall flames, for a crispy outside"
          - "A lid on top, to trap the smoke"
        correct: 0
        explain: "You cook over **brasas**, embers. The asador burns wood off to one side and shovels embers under the grill, little by little. Flames burn the outside and leave the inside raw."
      - type: card
        text: "**Leña**, firewood, takes longer, but many swear it tastes better. **Carbón**, charcoal, is faster, so most city asados use it. Ask two Argentines which is best: three opinions."
      - type: choice
        prompt: "What does the asador put on the meat before it hits the grill?"
        options:
          - "Just coarse salt"
          - "A garlic and pepper rub"
          - "An overnight marinade"
        correct: 0
        explain: "Usually just **sal gruesa**, coarse salt. Good meat and good embers do the rest. Chimichurri waits at the table."
      - type: card
        text: "Then patience. The big cuts cook slowly, often for an hour and a half or more, and a good asador flips each one only once."
      - type: card
        text: "How do you like it? Most Argentines say **a punto**, medium, or **jugoso**, a bit pink. Ask for it very rare and you'll get a raised eyebrow."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "el-orden"
    title: "What comes off the grill, and when"
    summary: "Picada, sausages, achuras, then the big cuts"
    pages:
      - type: card
        text: "While the fire does its thing, there's a **picada**: cheese, salami, olives, bread. It keeps everyone alive. Don't fill up, though. There's a long way to go."
      - type: choice
        prompt: "How much meat does the host buy per person?"
        options:
          - "About 250 grams"
          - "About half a kilo"
          - "About a kilo"
        correct: 1
        explain: "Half a kilo each is the classic rule, bones included. Nobody wants to be the host who ran out."
      - type: card
        text: "First off the grill: **chorizo** and **morcilla**. They get cut up on a board and passed around, often on a piece of bread."
      - type: choice
        prompt: "The morcilla is dark, soft and a little sweet. What's it made with?"
        options:
          - "Pig's blood"
          - "Chicken liver"
          - "Black beans"
        correct: 0
        explain: "Blood sausage. Sounds scary, tastes amazing. Saying **no, gracias** is fine too."
      - type: card
        text: "Then the brave stuff, the **achuras**: **chinchulines**, crispy grilled intestines, and **mollejas**, sweetbreads, crispy outside and creamy inside. Try the mollejas with lemon."
      - type: card
        text: "Finally the main event: **asado de tira** (short ribs), **vacío** (flank) and **entraña** (skirt steak). The asador decides the order. Your job: eat, and say **¡qué rico!**"
      - type: card
        chip: "Did you know?"
        text: "**Matambre a la pizza**: a thin flat cut, grilled until tender, then topped with tomato sauce and cheese right on the grill. Yes, pizza on the parrilla."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "chori-y-salsas"
    title: "Choripán, provoleta and the sauces"
    summary: "The sandwich, the grilled cheese and what goes on top"
    pages:
      - type: card
        text: "**Choripán**: a grilled chorizo split open in a crusty roll. That's it, and it's perfect. Everyone calls it **chori**."
      - type: card
        text: "Ask for it **mariposa**, butterfly: the chorizo is split lengthwise and opened flat, so it cooks faster and crisps up."
      - type: choice
        prompt: "It's 5 a.m. and the boliche just closed. Where do porteños go for a chori?"
        options:
          - "A food stall by the river"
          - "A 24-hour kiosco"
          - "The bakery, just opening"
        correct: 0
        explain: "The **carritos de la Costanera**, grill stalls along the river that barely ever close. Smoke, a line, and chimichurri dripping everywhere."
      - type: card
        text: "Chori is street food everywhere: outside football stadiums, at every festival, and at political rallies."
      - type: choice
        prompt: "Critics sometimes call rally crowds **choripaneros**. What's the jab?"
        options:
          - "They only came for a free chori"
          - "The rally was held at a parrilla"
          - "The crowd sang about choripán"
        correct: 0
        explain: "The insult says people were brought in with a free sandwich, not real conviction. It's a political dig, so use it with care."
      - type: card
        text: "**Provoleta** is a thick round of provolone-style cheese, grilled crispy outside and melty inside, with oregano and chili. Eat it fast, before it turns to rubber."
      - type: card
        text: "Two sauces rule. **Chimichurri** is green: parsley, oregano, garlic, chili flakes, vinegar and oil. **Salsa criolla** is tomato, onion and bell pepper."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "sos-invitado"
    title: "You're invited. Now what?"
    summary: "What to bring, how not to annoy the asador, and the applause"
    pages:
      - type: card
        text: "The host buys the meat. Guests bring **vino**, drinks, dessert or **hielo**. Someone always forgets the ice."
      - type: choice
        prompt: "Before anything reaches the table, who gets the first bites?"
        options:
          - "Whoever keeps the asador company"
          - "The kids, so they stop asking"
          - "The host's parents, out of respect"
        correct: 0
        explain: "Hang out by the grill and the asador will pass you bits of chorizo or crackling on bread, straight off the fire. Company earns you snacks."
      - type: card
        text: "Golden rule: don't tell the asador how to cook. Not “it needs more heat”, not “in my country we…”. And never touch the tongs."
      - type: card
        text: "Want to help? Ask **“¿Te ayudo en algo?”** and do exactly what you're told. Or just bring the asador a glass of wine."
      - type: choice
        prompt: "The meat's done and everyone has eaten. What does someone always call out?"
        options:
          - "A round of applause for the asador"
          - "A short speech from the host"
          - "A group photo for the family chat"
        correct: 0
        explain: "**¡Un aplauso para el asador!** Everyone claps, even if the meat was a bit dry."
      - type: card
        text: "When the asador calls **“¡A la mesa!”**, go right away. Letting the meat go cold while you finish a story is the real insult."
      - type: card
        text: "The asador cooked, so the others clear the table and wash up. Offer to help with the dishes: that's how you get invited back."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "asados-del-pais"
    title: "Asados from the rest of the country"
    summary: "Lamb on a cross, beef in its hide and dinner in a plough disc"
    pages:
      - type: card
        text: "Down south the star isn't beef. It's **cordero patagónico**: a whole lamb opened flat, wired to an iron cross and stuck in the ground beside the fire for hours."
      - type: card
        text: "The big-party version is **asado con cuero**: beef cooked with its hide on. The hide works like a pot, holding in the juices and fat."
      - type: choice
        prompt: "A festival poster says the **vaquillona con cuero** is served at 1 p.m. When did the cooks light the fire?"
        options:
          - "The night before"
          - "Around ten that morning"
          - "Right at noon"
        correct: 0
        explain: "Twelve hours or more over the embers means starting the night before and taking turns. Someone always brings a guitar and a termo."
      - type: card
        chip: "Did you know?"
        text: "The town of **Viale**, in Entre Ríos, throws a national festival for asado con cuero every year."
      - type: card
        text: "In the west it's **chivito**: young goat, grilled slowly over the embers. Mendoza and Neuquén each swear theirs is the best."
      - type: choice
        prompt: "Out in the **campo** there's a giant pan for the fire called **el disco**. What was it originally?"
        options:
          - "A plough disc from the farm"
          - "The rim of a cart wheel"
          - "An old oil drum lid"
        correct: 0
        explain: "A worn-out **disco de arado**, plough disc, with legs and handles welded on. Instant giant wok."
      - type: card
        text: "Chicken, onions, peppers, chorizo and a splash of wine, all stewing together: **pollo al disco**. One disco feeds a crowd, everyone standing around it with bread."
    vocabulary: []
