section:
  slug: "asado"
  title: "Asado"
  emoji: "🥩"
  summary: "Fire, meat and a whole Sunday with your people"

classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-ritual"
    title: "More than a barbecue"
    summary: "Why an asado is a whole afternoon, not a meal"
    pages:
      - type: info
        title: "It's not just meat"
        emoji: "🔥"
        body: "An **asado** is grilled meat, sure. But mostly it's an excuse to spend hours together. Sunday lunch with the family, Friday night with friends, a birthday, a work thing — you name it, there's an asado. When someone says **¿hacemos un asado?** (shall we do an asado?), they're really asking: *wanna hang out all day?*"
        fun_fact: "Argentines also say **asado** for a specific cut: the ribs. Context tells you which one."

      - type: info
        title: "Clear your schedule"
        emoji: "⏳"
        body: "Nobody does a quick asado. Someone lights the fire late morning, the meat cooks slowly, you eat around two, and then comes the **sobremesa** — sitting at the table long after the food is gone, talking, joking, arguing about football. Getting up at five is totally normal. Leaving right after eating? A bit rude."

      - type: true_false
        statement: "At an asado, it's normal to eat and head home half an hour later."
        answer: false
        explain: "The **sobremesa** is half the point. Leaving right after the food looks like you only came to eat."

      - type: info
        title: "The asador"
        emoji: "👨‍🍳"
        body: "Every asado has one **asador**: the person in charge of the fire and the meat. Traditionally it's the dad, the uncle, the friend who \"knows\". It's a role with a lot of pride attached. People hang out next to the grill with a drink to keep the asador company — the grill is where the party starts."

      - type: choice
        scenario: "Everyone's finished eating. The meat was great. Someone at the table raises their glass and shouts something."
        prompt: "What do they probably shout?"
        options:
          - "¡Un aplauso para el asador!"
          - "¡La cuenta, por favor!"
          - "¡Buen provecho a todos!"
        correct: 0
        explain: "**¡Un aplauso para el asador!** — a round of applause for the grill master. Everyone claps. It's a must, even when the meat was a bit dry."

      - type: gap
        prompt: "Complete the classic toast"
        text: "¡Un aplauso para el ___!"
        options: ["asador", "mozo", "chef"]
        correct: 0
        translation: "A round of applause for the grill master!"
        explain: "Always **asador**. **Mozo** is a waiter, and nobody calls the uncle at the grill a *chef*."

      - type: choice
        scenario: "Your Argentine coworker texts you on Thursday: \"¿Hacemos un asado el domingo?\""
        prompt: "What should you plan for?"
        options:
          - "A quick lunch, back home by 2"
          - "Most of the afternoon"
          - "A dinner at a steakhouse"
        correct: 1
        explain: "An invitation to an asado is an invitation to the whole afternoon, at someone's house. Bring good vibes and no plans for later."

      - type: match
        prompt: "Match the word to its meaning"
        pairs:
          - ["asado", "grilled-meat gathering"]
          - ["asador", "the person grilling"]
          - ["sobremesa", "chatting at the table after eating"]
          - ["aplauso", "applause"]

    vocabulary:
      - es: "asado"
        en: "barbecue; the gathering around it"
        example: { es: "¿Hacemos un asado el domingo?", en: "Shall we do an asado on Sunday?" }
      - es: "asador"
        en: "grill master"
        example: { es: "¡Un aplauso para el asador!", en: "A round of applause for the grill master!" }
      - es: "sobremesa"
        en: "long chat at the table after the meal"
      - es: "aplauso"
        en: "applause"
      - es: "hacer un asado"
        en: "to have a barbecue"
        example: { es: "Mañana hacemos un asado en casa.", en: "Tomorrow we're having an asado at home." }
      - es: "domingo"
        en: "Sunday"

  # ─────────────────────────────────────────────────────────────
  - slug: "el-fuego"
    title: "Playing with fire"
    summary: "Parrilla, fogón, leña, carbón — and hands off"
    pages:
      - type: info
        title: "Parrilla or fogón?"
        emoji: "🔥"
        body: "The **parrilla** is the grill: an iron grate over the embers, often built into the backyard in brick. The **fogón** is an open fire on the ground — think countryside, camping, or a whole lamb on an iron cross leaning over the flames, called **asado a la cruz**. City asados are almost always on a parrilla."
        fun_fact: "Many Buenos Aires apartments have a small parrilla on the balcony or rooftop. Priorities."

      - type: info
        title: "Embers, not flames"
        emoji: "🪵"
        body: "Here's the secret: you don't cook over flames. You cook over **brasas** (embers). The asador burns wood or charcoal on the side, then shovels the glowing embers under the grill, little by little. Slow heat, lots of patience. If you see flames licking the meat, something went wrong."

      - type: true_false
        statement: "A good asado is cooked over big, tall flames so it's done fast."
        answer: false
        explain: "It's cooked slowly over **brasas** (embers). Flames burn the outside and leave the inside raw."

      - type: info
        title: "Leña vs carbón"
        emoji: "⚖️"
        body: "**Leña** is firewood — hardwoods like quebracho or algarrobo. It takes longer but many swear it gives better flavor. **Carbón** (charcoal) lights faster and is easier, so it's what most people use in the city. Which is better? Ask two Argentines and you'll get three opinions. It's a real, ongoing debate."

      - type: match
        prompt: "Match the fire words"
        pairs:
          - ["parrilla", "grill"]
          - ["fogón", "open fire on the ground"]
          - ["brasas", "embers"]
          - ["leña", "firewood"]
          - ["carbón", "charcoal"]

      - type: choice
        scenario: "You're keeping the asador company. The fire looks a bit weak and there's a pile of wood right next to you."
        prompt: "What do you do?"
        options:
          - "Throw a couple of logs on to help"
          - "Poke the embers around a bit"
          - "Nothing — the fire belongs to the asador"
        correct: 2
        explain: "Hands off. Only the asador touches the fire and the meat. If you want to help, ask **¿te ayudo en algo?** (can I help with anything?) and do what they say."

      - type: gap
        prompt: "Offer your help the right way"
        text: "¿Te ___ en algo?"
        options: ["ayudo", "ayudás", "ayudamos"]
        correct: 0
        translation: "Can I help you with anything?"
        explain: "**¿Te ayudo en algo?** — polite, friendly, and it leaves the asador in charge."

    vocabulary:
      - es: "parrilla"
        en: "grill"
        note: "Also a restaurant that serves grilled meat."
      - es: "fogón"
        en: "open fire, campfire"
      - es: "brasas"
        en: "embers"
        example: { es: "Poné más brasas debajo del vacío.", en: "Put more embers under the flank." }
      - es: "leña"
        en: "firewood"
      - es: "carbón"
        en: "charcoal"
      - es: "asado a la cruz"
        en: "whole animal roasted on an iron cross by the fire"
      - es: "¿te ayudo en algo?"
        en: "can I help with anything?"

  # ─────────────────────────────────────────────────────────────
  - slug: "el-orden"
    title: "What comes off the grill, and when"
    summary: "Picada, achuras, then the big cuts"
    pages:
      - type: info
        title: "First, the picada"
        word: { es: "picada", tag: "The opener", en: "snack board" }
        emoji: "🧀"
        body: "While the fire does its thing, there's a **picada**: a board with cheese, salami, olives, bread, maybe peanuts. It keeps everyone alive for the first couple of hours. Don't fill up on it, though — you've got a long way to go."

      - type: info
        title: "Then, the achuras"
        emoji: "🌭"
        body: "Next come the **achuras** (offal) and sausages: **chorizo** (pork-and-beef sausage), **morcilla** (blood sausage), **chinchulines** (crispy small intestines), **mollejas** (sweetbreads) and **riñones** (kidneys). They come off in waves, often cut up on a board and passed around. Try the mollejas with lemon. Thank me later."
        fun_fact: "Technically chorizo and morcilla are sausages, not offal, but at the grill everyone lumps them in with the achuras."

      - type: match
        prompt: "Match the achura to what it is"
        pairs:
          - ["chorizo", "pork-and-beef sausage"]
          - ["morcilla", "blood sausage"]
          - ["chinchulines", "small intestines"]
          - ["mollejas", "sweetbreads"]
          - ["riñones", "kidneys"]

      - type: info
        title: "Finally, the cuts"
        emoji: "🥩"
        body: "Then the main event, the **cortes** (cuts): **asado de tira** (short ribs cut across the bone), **vacío** (flank), **entraña** (skirt steak, juicy and loved), **matambre** (a thin cut between the skin and the ribs). The asador decides the order. Your job is to eat and say **¡qué rico!** (so good!)."

      - type: order
        prompt: "Put a classic asado in order"
        items:
          - "Picada while the fire gets going"
          - "Chorizo, morcilla and achuras"
          - "Vacío, entraña and asado de tira"
          - "Aplauso para el asador"
          - "Sobremesa"
        explain: "Every family does it a bit differently, but it goes: snacks, sausages and achuras, the big cuts, the applause, and then hours of chatting."

      - type: choice
        scenario: "Someone passes you a board with little golden, crispy spirals. They say: \"Probá los chinchulines.\""
        prompt: "What are you about to eat?"
        options:
          - "Fried onions"
          - "Grilled small intestines"
          - "Pork rinds"
        correct: 1
        explain: "**Chinchulines** are beef small intestines, grilled until crispy. Sounds scary, tastes amazing. Saying **no, gracias** is fine too."

      - type: info
        title: "How do you like it?"
        emoji: "🌡️"
        body: "The asador might ask how you want your meat. **Jugoso** means juicy, pink inside. **A punto** is medium. **Cocido** is well done. Most Argentines like it a punto or a bit jugoso. Asking for it very rare? You'll get a raised eyebrow."

      - type: gap
        prompt: "Ask for your meat medium"
        text: "Para mí, a ___, por favor."
        options: ["punto", "fuego", "gusto"]
        correct: 0
        translation: "Medium for me, please."
        explain: "**A punto** = medium. **Jugoso** if you want it pinker, **cocido** if you want it well done."

      - type: true_false
        statement: "Vacío and entraña are types of achuras."
        answer: false
        explain: "They're **cortes** (cuts of beef). Achuras are the offal: chinchulines, mollejas, riñones… plus the sausages."

    vocabulary:
      - es: "picada"
        en: "snack board (cheese, salami…)"
      - es: "achuras"
        en: "offal"
        example: { es: "Primero salen las achuras.", en: "The offal comes off first." }
      - es: "morcilla"
        en: "blood sausage"
      - es: "chinchulines"
        en: "grilled small intestines"
      - es: "mollejas"
        en: "sweetbreads"
      - es: "vacío"
        en: "flank"
      - es: "entraña"
        en: "skirt steak"
      - es: "a punto"
        en: "medium (meat)"
        example: { es: "Para mí, a punto, por favor.", en: "Medium for me, please." }
      - es: "¡qué rico!"
        en: "so good!"

  # ─────────────────────────────────────────────────────────────
  - slug: "chori-y-salsas"
    title: "Choripán, provoleta and the sauces"
    summary: "The sandwich, the grilled cheese and what goes on top"
    pages:
      - type: info
        title: "The choripán"
        word: { es: "choripán", tag: "Street food", en: "grilled sausage sandwich" }
        emoji: "🥖"
        body: "**Choripán** = **chorizo** + **pan** (bread). A grilled sausage, split open in a crusty roll. That's it, and it's perfect. It's the first thing out at many asados, and it's also street food: outside football stadiums, at protests, on the Costanera. Everyone calls it **chori**."

      - type: gap
        prompt: "What's a choripán made of?"
        text: "Un choripán es un chorizo en ___."
        options: ["pan", "plato", "pizza"]
        correct: 0
        translation: "A choripán is a chorizo in bread."
        explain: "**Chori** + **pan**. The name is the recipe."

      - type: info
        title: "The provoleta"
        emoji: "🧀"
        body: "**Provoleta** is a thick round of provolone-style cheese grilled until crispy outside and melty inside, with oregano and chili flakes on top. It's usually credited to Natalio Alba, an Italian immigrant in Córdoba, around 1940. Eat it hot and fast, straight from the little pan."

      - type: info
        title: "Chimichurri and salsa criolla"
        emoji: "🌿"
        body: "Two sauces rule. **Chimichurri**: parsley, oregano, garlic, chili flakes, vinegar and oil. **Salsa criolla**: chopped tomato, onion and bell pepper in vinegar and oil. Both go on the choripán and the meat. Where does the name chimichurri come from? Nobody knows for sure — Basque, Italian, even an Irishman called \"Jimmy\"… all unproven."

      - type: match
        prompt: "Match the thing to what's in it"
        pairs:
          - ["choripán", "sausage in a bread roll"]
          - ["provoleta", "grilled cheese round"]
          - ["chimichurri", "parsley, garlic, vinegar, oil"]
          - ["salsa criolla", "tomato, onion, bell pepper"]

      - type: true_false
        statement: "Historians agree that chimichurri was named after an Irishman called Jimmy McCurry."
        answer: false
        explain: "It's one popular story, but it's not proven. Others point to a Basque word or to Italian sauces. The origin is still disputed."

      - type: choice
        scenario: "You're at a football match in Buenos Aires. Outside the stadium, smoke everywhere and people lining up at a street grill."
        prompt: "What are they most likely selling?"
        options:
          - "Choripanes"
          - "Provoletas"
          - "Entrañas on a plate"
        correct: 0
        explain: "The **chori** is the king of street food at stadiums. Cheap, fast, and you eat it standing up with chimichurri dripping everywhere."

    vocabulary:
      - es: "choripán"
        en: "grilled sausage sandwich"
        note: "Short: chori."
        example: { es: "¿Te hago un chori?", en: "Shall I make you a chori?" }
      - es: "chorizo"
        en: "pork (and beef) sausage"
      - es: "pan"
        en: "bread"
      - es: "provoleta"
        en: "grilled provolone-style cheese"
      - es: "chimichurri"
        en: "herb, garlic and vinegar sauce"
      - es: "salsa criolla"
        en: "tomato, onion and pepper relish"

  # ─────────────────────────────────────────────────────────────
  - slug: "sos-invitado"
    title: "You're invited — now what?"
    summary: "What to bring and how not to annoy the asador"
    pages:
      - type: info
        title: "Never show up empty-handed"
        emoji: "🍷"
        body: "The host usually buys the meat. You bring something else: **vino** (wine, often a Malbec), **bebida** (drinks: soda, beer, fernet), **postre** (dessert — ice cream is a classic), or **hielo** (ice, and someone always forgets it). Just ask: **¿qué llevo?** (what should I bring?)."
        fun_fact: "With friends, it's common to split the cost of the meat. That's called **hacer una vaquita** — literally \"making a little cow\"."

      - type: choice
        scenario: "Your friend's family invited you to their Sunday asado. You ask what to bring and they say \"nada, vení\" (nothing, just come)."
        prompt: "What do you actually do?"
        options:
          - "Show up with nothing — they said so"
          - "Bring wine or dessert anyway"
          - "Bring a kilo of steak for yourself"
        correct: 1
        explain: "\"**Nada, vení**\" is being polite. A bottle of wine or some dessert is always welcome. Bringing your own meat can look like you don't trust the host."

      - type: gap
        prompt: "Ask what you should bring"
        text: "¿Qué ___ para el asado?"
        options: ["llevo", "traés", "comés"]
        correct: 0
        translation: "What should I bring to the asado?"
        explain: "**¿Qué llevo?** — the classic question. Argentines use **llevar** (take) from the guest's point of view."

      - type: info
        title: "The golden rule"
        emoji: "🤐"
        body: "Don't tell the asador how to cook. Not \"it needs more heat\", not \"I'd flip that now\", not \"in my country we…\". The grill is their territory. Keep them company, bring them a glass of wine, laugh at their jokes. Criticizing the asado is almost a personal insult."

      - type: choice
        scenario: "You think the vacío has been on too long. The asador turns and asks: \"¿Todo bien?\""
        prompt: "Best answer?"
        options:
          - "\"I think it's burning, you should take it off\""
          - "\"¡Todo bien! Huele bárbaro.\""
          - "Grab the tongs and take it off yourself"
        correct: 1
        explain: "**Huele bárbaro** = it smells amazing. Trust the asador — and never grab the tongs. The meat and the fire are theirs."

      - type: true_false
        statement: "Offering to help clear the table or wash up after the asado is a nice gesture."
        answer: true
        explain: "The asador cooked, so others often clean up. Offering to help with the dishes always earns points."

      - type: order
        prompt: "A perfect guest's afternoon"
        items:
          - "Ask ¿qué llevo?"
          - "Arrive with wine and ice"
          - "Keep the asador company at the grill"
          - "Eat everything and say ¡qué rico!"
          - "Aplauso para el asador"
          - "Stay for the sobremesa"
        explain: "Nail these and you'll be invited back next Sunday."

      - type: match
        prompt: "Match what you bring"
        pairs:
          - ["vino", "wine"]
          - ["bebida", "drinks"]
          - ["postre", "dessert"]
          - ["hielo", "ice"]

    vocabulary:
      - es: "vino"
        en: "wine"
      - es: "bebida"
        en: "drinks"
      - es: "postre"
        en: "dessert"
      - es: "hielo"
        en: "ice"
        example: { es: "¿Alguien trajo hielo?", en: "Did anyone bring ice?" }
      - es: "¿qué llevo?"
        en: "what should I bring?"
        example: { es: "¿Qué llevo el domingo?", en: "What should I bring on Sunday?" }
      - es: "hacer una vaquita"
        en: "to chip in money"
      - es: "bárbaro"
        en: "great, amazing"
        example: { es: "¡Huele bárbaro!", en: "It smells amazing!" }

  # ─────────────────────────────────────────────────────────────
  - slug: "asados-del-pais"
    title: "Asados from the rest of the country"
    summary: "Lamb on a cross, beef in its hide and dinner in a plough disc"
    pages:
      - type: info
        title: "Patagonian lamb"
        emoji: "🐑"
        body: "Down south the star isn't beef. It's **cordero patagónico al asador**: a whole lamb opened flat, wired to an iron cross (also called the **asador**, like the grill master) and stuck in the ground, leaning over the fire. It cooks slowly, for four hours or more, until the skin crackles. Every January, Puerto Madryn holds the Fiesta Nacional del Cordero."

      - type: choice
        scenario: "You're walking through El Calafate and see a restaurant window with lambs spread on iron crosses around a fire."
        prompt: "What are you looking at?"
        options: ["Cordero al asador", "Asado con cuero", "Pollo al disco"]
        correct: 0
        explain: "Lamb on the **asador** (the cross), Patagonia's signature. It's slow food in the most literal way: it was probably on the fire before lunch was even a thought."

      - type: true_false
        statement: "Cordero patagónico is a quick dish: twenty minutes on a hot grill."
        answer: false
        explain: "It's hours on the cross, far from the flames, so the heat is gentle and the fat melts slowly. Rushing it is a crime down south."

      - type: info
        title: "Asado con cuero"
        emoji: "🐄"
        body: "The big-party version: beef cooked **con cuero**, with its hide still on. The hide works like a pot, holding in the juices and fat. Usually it's a **vaquillona** (young heifer) in huge pieces, over steady embers for **12 hours or more**. It's festival food: Viale, in Entre Ríos, hosts the Fiesta Nacional del Asado con Cuero every year."

      - type: choice
        scenario: "A town festival poster says: \"Vaquillona con cuero, se sirve a las 13 hs.\""
        prompt: "When did the asadores probably start cooking?"
        options: ["Around noon", "The night before", "The week before"]
        correct: 1
        explain: "Twelve hours or more of fire means lighting up the night before and taking turns. Someone always brings a guitar and a termo."

      - type: info
        title: "The disco"
        emoji: "🍳"
        body: "Out in the **campo** (countryside), someone took a worn-out **disco de arado** (plough disc), welded on legs and handles, and got a giant wok for the fire. Now it's everywhere: **pollo al disco**, **carne al disco**, onions, peppers, chorizo and a splash of wine, all stewing together. One disco feeds a crowd, and everyone stands around it with a piece of bread."

      - type: match
        prompt: "Match the dish to how it's cooked"
        pairs:
          - ["cordero al asador", "whole lamb on an iron cross"]
          - ["asado con cuero", "beef cooked with its hide on"]
          - ["pollo al disco", "chicken stewed in a plough disc"]
          - ["vaquillona", "young heifer"]

      - type: gap
        prompt: "Your friend in the campo announces tonight's dinner"
        text: "Hoy hacemos pollo al ___."
        options: ["disco", "cuero", "horno de barro"]
        correct: 0
        translation: "Tonight we're making chicken in the disc."
        explain: "**Al disco** = cooked in the plough disc. **Con cuero** is for beef with the hide, and it would take you until tomorrow."

      - type: order
        prompt: "Cordero al asador, step by step"
        items:
          - "Open the lamb out flat"
          - "Wire it to the iron cross"
          - "Stick the cross in the ground, leaning over the fire"
          - "Cook it slowly for hours"
          - "Carve it right off the cross"
        explain: "No grill at all: just the cross, the fire and a lot of patience."

    vocabulary:
      - es: "cordero"
        en: "lamb"
        example: { es: "En el sur comimos cordero al asador.", en: "Down south we ate lamb on the cross." }
      - es: "al asador"
        en: "roasted on an iron cross by the fire"
      - es: "con cuero"
        en: "with the hide on"
      - es: "vaquillona"
        en: "young heifer"
      - es: "disco de arado"
        en: "plough disc used as a cooking pan"
      - es: "al disco"
        en: "cooked in the disc"
        example: { es: "¿Hacemos pollo al disco?", en: "Shall we make chicken in the disc?" }
      - es: "campo"
        en: "countryside, farm"
