section:
  slug: "costumbres"
  title: "Costumbres"
  emoji: "🤝"
  summary: "Kisses, late arrivals, long goodbyes and a very full calendar"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-beso"
    title: "Hello, with a kiss"
    summary: "One kiss, everybody, every time"
    pages:
      - type: card
        text: "In Argentina you say hi with **un beso**: one kiss, cheek to cheek, lips to the air. Not two like in Spain. Just one, and quick."
      - type: choice
        prompt: "Two Argentine guys, old friends, meet at a bar. How do they say hi?"
        options:
          - "A kiss on the cheek"
          - "A firm handshake"
          - "A quick nod and a smile"
        correct: 0
        explain: "Often a kiss plus a pat on the back. Brothers, fathers and sons too. A handshake between friends would feel oddly stiff."
      - type: card
        text: "Arrive at a party of twelve and you **saludás a todos**: you go around and kiss every single person, strangers included. A wave from the door feels cold."
      - type: choice
        prompt: "Your first week at a new job in Buenos Aires. How do your coworkers greet you in the morning?"
        options:
          - "A kiss on the cheek"
          - "A handshake"
          - "A wave from their desks"
        correct: 0
        explain: "In many offices it's a kiss, every morning, often even with the boss. Nobody thinks it's intimate. It's just hello."
      - type: card
        text: "The exception: a very formal first meeting, like a job interview. Then it's often a handshake. Watch what the other person does. By the second meeting, it's usually a kiss."
      - type: card
        text: "Then comes **¿Todo bien?** or **¿Qué hacés?** Not real questions, just hello. **“Todo bien, ¿vos?”** is the whole answer. The long version comes later, over a mate."
      - type: card
        chip: "Pro tip"
        text: "Meeting someone new at a party? Lean in, kiss, and say your name: **“Hola, soy Sam.”** That's all anyone expects."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-hora-argentina"
    title: "Argentine time"
    summary: "Late arrivals, loose plans and goodbyes that never end"
    pages:
      - type: card
        text: "Invited to dinner at someone's home **a las nueve**? Nobody expects you at nine. Twenty or thirty minutes late is normal. Arriving early is the real faux pas."
      - type: card
        text: "That's social life only. Work, classes and the doctor run on the clock. Be on time, or at least text."
      - type: choice
        prompt: "Your friend texts **“ya salgo”**: I'm leaving now. What's she most likely doing?"
        options:
          - "Still getting ready"
          - "Locking her front door"
          - "Already on the bus"
        correct: 0
        explain: "**Ya salgo** has padding built in, and **llego en cinco** means fifteen. Nobody's lying: everyone knows how to read it."
      - type: card
        text: "Plans live in the WhatsApp group, and the key phrase is **vamos viendo**: let's see. The plan is alive, but nothing's fixed until an hour before."
      - type: card
        text: "Never show up empty-handed. The host will say **“no traigas nada”**, don't bring anything. Bring wine or dessert anyway."
      - type: choice
        prompt: "You announce **“bueno, me voy yendo”**: well, I'm heading off. How long until you're out the door?"
        options:
          - "About half an hour"
          - "About two minutes"
          - "About ten minutes"
        correct: 0
        explain: "Another glass appears. Then a kiss for everyone. Then a chat at the door. Totally normal."
      - type: card
        text: "Slipping out without goodbyes is **irse a la francesa**: leaving French-style. People notice, and they'll bring it up next time."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "salir-de-noche"
    title: "Going out"
    summary: "The previa, the boliche and breakfast at sunrise"
    pages:
      - type: card
        text: "The **boliche**, the nightclub, opens around one. The dancing really starts at two or three. Getting home at six, with the sun up, is a normal Saturday."
      - type: choice
        prompt: "Your friends say: “Previa at Tomi's, then the boliche.” You get to Tomi's at nine. What do you find?"
        options:
          - "Tomi in pajamas, having dinner"
          - "The party already in full swing"
          - "Everyone leaving for the club"
        correct: 0
        explain: "At nine the night hasn't started. The previa gets going around midnight."
      - type: card
        text: "**La previa** is drinks at a friend's place before going out: cheaper, your own music, and you can hear each other. For plenty of people it's the best part. The boliche is just the excuse."
      - type: choice
        prompt: "It's 4 a.m. and the boliche is packed. Which of these will you almost never hear?"
        options:
          - "Tango"
          - "Cumbia"
          - "Reggaetón"
        correct: 0
        explain: "Tango lives in the **milongas**, with their own crowd. The boliche runs on cumbia, reggaetón and whatever everyone can shout along to."
      - type: card
        text: "And six a.m. isn't always the end. An **after** keeps the party going once the boliche closes."
      - type: card
        text: "Everyone else heads for **café con medialunas** as the cafés open, then bed until lunch."
      - type: card
        text: "Sunday afternoon exists mostly to recover: blinds down, a mate, and a group chat reconstructing what happened."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "sin-filtro"
    title: "No filter"
    summary: "Body comments, money talk, and the gauchada"
    pages:
      - type: card
        text: "Your aunt sees you after the holidays: **“¡Estás más gordito!”** You've put on a bit of weight. She means it warmly, like “you look well fed.”"
      - type: card
        text: "Couples call each other **gordo** and **gorda** as a pet name, whatever their size. It's the Argentine *honey*."
      - type: choice
        prompt: "A stranger on the street shouts **“¡Flaco!”** at you. Skinny! What does he want?"
        options:
          - "Your attention: it's just “hey, you”"
          - "To say you look too thin today"
          - "To warn you about a pickpocket"
        correct: 0
        explain: "**Flaco** is how you call out to a guy you don't know. **“¡Flaco, se te cayó esto!”** Hey, you dropped this."
      - type: card
        chip: "Pro tip"
        text: "Younger people are more careful with body comments. Laugh off grandma's, but don't start making your own."
      - type: choice
        prompt: "Someone you met ten minutes ago asks how much you pay in rent. How should you take it?"
        options:
          - "As normal small talk"
          - "As a rude question"
          - "As a sign she's flat hunting"
        correct: 0
        explain: "After decades of inflation, prices are everyone's favorite topic. **¿Cuánto pagaste?** is fair game, for your phone, your shoes, your rent."
      - type: card
        text: "One of the nicest questions in the language: **“¿Me hacés una gauchada?”** Can you do me a favor? A **gauchada** is a favor done for free, just because."
      - type: card
        text: "Lending your drill, a ride to the airport at dawn, a stranger helping push your stalled car: all gauchadas. Nobody keeps score."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "navidad-en-verano"
    title: "Christmas in summer"
    summary: "Cold vitel toné, fireworks at midnight, then the beach"
    pages:
      - type: card
        text: "Christmas in Argentina falls in summer. It can be scorching, and Papá Noel still wears his wool coat."
      - type: card
        text: "The **arbolito** goes up on **8 December**, a public holiday. The big night isn't the 25th: it's **Nochebuena**, the 24th, with a long dinner, often outdoors."
      - type: choice
        prompt: "It's Nochebuena. What's the classic star of the table?"
        options:
          - "Veal in a creamy tuna sauce"
          - "Roast turkey with gravy"
          - "Baked ham with pineapple"
        correct: 0
        explain: "**Vitel toné**, an Italian import, served cold. Plus **pan dulce**, **turrón** and **sidra**. And yes, often an asado too."
      - type: card
        text: "At midnight everyone stands for the **brindis**, the toast. The sky explodes with fireworks from every backyard and balcony."
      - type: choice
        prompt: "When do most families open the presents?"
        options:
          - "Right after the midnight toast"
          - "On the morning of the 25th"
          - "After lunch on the 25th"
        correct: 0
        explain: "Presents at midnight, with the fireworks still going. The 25th is for leftovers and naps."
      - type: card
        text: "New Year's repeats the formula: dinner, toast, fireworks. Then the city empties. January is holiday month, and everyone who can heads for the beach."
      - type: card
        chip: "Did you know?"
        text: "On 6 January, kids leave their shoes out with grass and water for the camels of the **Reyes Magos**, the Three Kings."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "el-calendario"
    title: "The calendar"
    summary: "Friends' Day, spring, long weekends and birthdays"
    pages:
      - type: card
        text: "On **20 de julio** Argentina celebrates **Día del Amigo**, Friends' Day. Restaurants are packed and your phone won't stop buzzing: **“¡Feliz Día del Amigo!”**"
      - type: choice
        prompt: "Why July 20?"
        options:
          - "It's the day humans first walked on the Moon"
          - "It's the birthday of a famous tango singer"
          - "It's the day Argentina's first club was founded"
        correct: 0
        explain: "An Argentine, **Enrique Febbraro**, watched the Moon landing and thought the whole world should celebrate friendship that day."
      - type: card
        text: "**21 de septiembre** is a double party: first day of spring and **Día del Estudiante**. Students fill the parks with picnics and guitars. Want a quiet walk? Not that day."
      - type: card
        text: "Argentines love a **finde largo**, a long weekend. Some years the government even adds a **feriado puente**: a bridge day off, just to join a holiday to the weekend."
      - type: card
        text: "The birthday song here is **“Que los cumplas feliz”**. Then your friends pull your ears: the **tirón de orejas**, one tug for each year."
      - type: choice
        prompt: "Your friend's birthday is tomorrow and you won't see her. When do you send your message?"
        options:
          - "Tomorrow, never today"
          - "Today, so you're first"
          - "Either day, it's fine"
        correct: 0
        explain: "Wishing **feliz cumple** early is **yeta**: bad luck. Even Pope Francis, a porteño, warned a crowd who greeted him early, before his 80th birthday."
      - type: card
        chip: "Pro tip"
        text: "Set an alarm. A message right at midnight is the classic move: the first one wins."
    vocabulary: []
