section:
  slug: "tango"
  title: "Tango"
  emoji: "💃"
  summary: "The sad, sexy music of the Río de la Plata, and how not to embarrass yourself at a milonga"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "nacido-en-el-arrabal"
    title: "Born on the edge of town"
    summary: "Two cities, one port, and a German squeezebox"
    pages:
      - type: card
        text: "Tango was born in the late 1800s in the **arrabal**, the rough edge of town: tenements, corner bars, the port. The music of immigrants, sailors and workers."
      - type: choice
        prompt: "Polite Buenos Aires society found tango scandalous. What finally changed their minds?"
        options:
          - "A president danced it in public"
          - "It became a craze in Paris"
          - "The Church gave it its blessing"
        correct: 1
        explain: "Once Paris loved it, the rich loved it too. Nothing like European approval to change a porteño's mind."
      - type: card
        text: "Around 1900, men far outnumbered women in the city. So men often practiced tango with each other until they were good enough to dance with a woman."
      - type: choice
        prompt: "The most famous tango ever, **La Cumparsita**, was written where?"
        options:
          - "In Montevideo, by a student"
          - "In Buenos Aires, by Gardel"
          - "In Paris, during the craze"
        correct: 0
        explain: "Gerardo Matos Rodríguez, a young Uruguayan, wrote it, and it premiered in a Montevideo café."
      - type: card
        text: "So tango isn't only Argentine. It's **rioplatense**, from both sides of the river. In 2009 UNESCO listed it as heritage of both countries, and Uruguayans will remind you."
      - type: card
        text: "The sound of tango is the **bandoneón**, and it's German. The story goes it was meant for small churches with no organ. Hymns to tango bars in one boat trip."
      - type: choice
        prompt: "Why is the bandoneón famously hard to play?"
        options:
          - "Each button plays two different notes"
          - "It's as heavy as a small piano"
          - "It only plays in a single key"
        correct: 0
        explain: "The note changes depending on whether the bellows open or close. Tangueros call it **el fueye**: the bellows."
      - type: card
        text: "Early tango was quick and playful, played on flute, violin and guitar. Many say the bandoneón slowed it down, and that's where tango got its famous sadness."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-milonga"
    title: "At the milonga"
    summary: "The unwritten rules of the dance floor"
    pages:
      - type: card
        text: "A **milonga** is a tango dance night: tables around a wooden floor, a DJ or a live orquesta, every age dancing until late. Buenos Aires has one every night of the week."
      - type: choice
        prompt: "At a traditional milonga, how do you ask someone to dance?"
        options:
          - "Walk to their table and offer your hand"
          - "Catch their eye across the room and nod"
          - "Ask the DJ to dedicate them a song"
        correct: 1
        explain: "That's the **cabeceo**: a look, a small nod. If they nod back, you go get them."
      - type: card
        text: "And if they look away? That's a no, and nobody got rejected in public. That's the whole point of the cabeceo."
      - type: card
        text: "Music comes in **tandas**, sets of 3 or 4 songs. Then a short non-tango **cortina** plays, the floor clears, and everyone changes partners."
      - type: choice
        prompt: "Your partner says **“gracias”** after the first song. What just happened?"
        options:
          - "They're being polite, keep dancing"
          - "They want a short break"
          - "They're done dancing with you"
        correct: 2
        explain: "**Gracias** mid-tanda means “thanks, that's enough”. Want to keep going? Just smile and wait for the next song."
      - type: card
        text: "Couples move counterclockwise in a **ronda**, like cars on a track. No passing, no big kicks, and never teach your partner on the floor."
      - type: card
        chip: "Did you know?"
        text: "The dinner shows with flying legs and a rose in someone's mouth? Porteños call that **tango for export**. At a milonga, the dance is small, close and improvised."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "gardel"
    title: "Gardel"
    summary: "The voice, the smile, and the question of where he was born"
    pages:
      - type: card
        text: "**Carlos Gardel** is *the* tango singer, and Argentina's first pop idol. Slicked-back hair, a movie-star smile, a voice people still call perfect."
      - type: choice
        prompt: "So where was Gardel born?"
        options:
          - "Abasto, Buenos Aires"
          - "Toulouse, France"
          - "Naples, Italy"
        correct: 1
        explain: "Most researchers say **Toulouse**. But Gardel once signed papers saying **Tacuarembó**, Uruguay, and many Uruguayans still claim him."
      - type: card
        text: "Argentines settle it simply: he grew up in **Abasto**, the market barrio, so he's porteño. They call him **el Morocho del Abasto**."
      - type: card
        text: "In 1935, at the peak of his fame, Gardel died in a plane crash in **Medellín**, Colombia, while on tour. The whole country went into mourning."
      - type: choice
        prompt: "At his tomb in Chacarita cemetery, what do fans leave in his bronze statue's hand?"
        options:
          - "A lit cigarette"
          - "A folded page of sheet music"
          - "A glass of wine"
        correct: 0
        explain: "A lit **pucho**. Legend says if it burns all the way down, your wish comes true."
      - type: card
        text: "His fans' favorite line: **cada día canta mejor**, he sings better every day. Dead since 1935, and still improving."
      - type: card
        chip: "Pro tip"
        text: "Friend whining about an ex for an hour? **Andá a cantarle a Gardel**: go sing it to Gardel. Cheeky, not rude."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "orquestas-y-piazzolla"
    title: "Big bands and a rebel"
    summary: "The golden age of the orquestas, and the rebel who broke the rules"
    pages:
      - type: card
        text: "In the **1940s**, tango was pop music. Every club and radio station had an **orquesta típica**, and people followed bandleaders like football teams."
      - type: card
        text: "Tango DJs still build whole nights around them: **D'Arienzo**, punchy and rhythmic. **Di Sarli**, smooth and elegant. **Pugliese**, dark and dramatic."
      - type: choice
        prompt: "Pugliese was a communist and was jailed more than once. What did his orquesta do while he was inside?"
        options:
          - "Cancelled every show until he was freed"
          - "Played on, with a red carnation on his piano"
          - "Hired a new pianist and never looked back"
        correct: 1
        explain: "A **clavel rojo** on the empty piano. Everyone in the room got the message."
      - type: card
        text: "Then came the rebel: **Astor Piazzolla**. He grew up in New York, where his dad gave him a bandoneón as a kid."
      - type: choice
        prompt: "At 13, Piazzolla played in a Gardel film in New York, and Gardel invited him on his 1935 tour. What happened?"
        options:
          - "His father said he was too young"
          - "He joined and played every show"
          - "He said no to keep studying piano"
        correct: 0
        explain: "Lucky boy. That was Gardel's last tour: it ended in the plane crash in Medellín."
      - type: card
        text: "Back in Buenos Aires he played in **Troilo**'s orquesta, then studied classical music in Paris with **Nadia Boulanger**. She told him to stop hiding his tango."
      - type: card
        text: "So he mixed tango with jazz and classical: **tango nuevo**. Think **Libertango** and **Adiós Nonino**."
      - type: card
        text: "Traditionalists called him **el asesino del tango**, and **“eso no es tango”** followed him for years. Today he's among the most played Argentine composers in the world."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "las-letras"
    title: "What tango sings about"
    summary: "Mom, the barrio, the woman who left, and a world gone wrong"
    pages:
      - type: card
        text: "Tango lyrics have favorite subjects: the woman who left (always her fault), mom (a saint), the old barrio, and nostalgia for everything."
      - type: card
        text: "Tango poet **Discépolo** summed it up: **el tango es un pensamiento triste que se baila**. A sad thought you can dance to."
      - type: choice
        prompt: "Gardel's **Volver** has tango's most quoted line. What does it claim?"
        options:
          - "Love always comes back"
          - "The barrio never changes"
          - "Twenty years is nothing"
        correct: 2
        explain: "**“Que veinte años no es nada.”** Heard at reunions and birthdays, anywhere time has passed and everyone pretends it hasn't."
      - type: card
        text: "**Mi Buenos Aires querido** is a man far away, dreaming of coming home. Ask any Argentine living abroad whether it makes them cry."
      - type: card
        text: "**Cambalache**, also by Discépolo, isn't about love. It says the world is a junk shop where a donkey and a great professor count the same."
      - type: choice
        prompt: "What happened to **Cambalache** in the 1940s?"
        options:
          - "It was banned from the radio"
          - "The national team adopted it"
          - "It won a national music prize"
        correct: 0
        explain: "The military government of the 1940s banned it, along with lots of lunfardo. Being banned only made it more famous. It still sounds like this morning's news."
      - type: card
        chip: "Pro tip"
        text: "Its name stuck, too. When something is a total, unfair mess, Argentines sigh: **“esto es un cambalache.”**"
    vocabulary: []
