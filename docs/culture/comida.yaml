section:
  slug: "comida"
  title: "La mesa argentina"
  emoji: "🥟"
  summary: "Empanadas, pizza, milanesas, and dinner at ten"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "horarios-y-mesa"
    title: "Dinner at ten"
    summary: "Late dinners, the merienda, and a bill that never comes"
    pages:
      - type: card
        text: "Argentines eat late. Breakfast is small and sweet, lunch is around one, dinner around **ten**. Book a restaurant for eight and you'll have the waiters all to yourself."
      - type: card
        text: "What gets everyone through? The **merienda**: around five, a small meal of [mate] or coffee with toast or **facturas**. Skip it and you'll be starving by eight."
      - type: choice
        prompt: "A friend texts: **“Che, ¿venís a tomar unos mates?”** What should you expect?"
        options:
          - "A full merienda and a long chat"
          - "Only mate, and nothing to eat"
          - "A quick drink before dinner"
        correct: 0
        explain: "It's an invitation to the merienda: mate, something sweet, and time to talk. The verb is **merendar**: **“¿Merendamos?”** (shall we have a merienda?)"
      - type: card
        text: "Kids keep the same hours. At eleven at night you still see families in restaurants, above all on weekends, with little ones running between the tables or asleep across two chairs."
      - type: choice
        prompt: "You finished eating an hour ago. Why hasn't the waiter brought the bill?"
        options:
          - "Bringing it unasked would be like kicking you out"
          - "Bills only come once the kitchen has closed"
          - "He's waiting for you to order a coffee first"
        correct: 0
        explain: "The table is yours until you ask: **“¿Me traés la cuenta?”** (can you bring me the bill?) Or catch the waiter's eye and pretend to write in the air."
      - type: card
        text: "The reason is the **sobremesa**: the long chat after the meal, over coffee. It often lasts longer than the meal itself, and nobody rushes you."
      - type: card
        text: "The tip, **la propina**, is about 10%, usually left in cash. It is not on the bill. The **cubierto** you see there is a table charge, not the tip."
      - type: choice
        prompt: "Six friends, one bill. You only had a salad, Tomi had the steak. How does the table usually pay?"
        options:
          - "Everyone pays the same share"
          - "Each person pays for their own dish"
          - "Whoever suggested the place pays"
        correct: 0
        explain: "Among friends, the bill usually gets split evenly. If the gap is big, someone may offer to split it by what each person had."
      - type: card
        chip: "Pro tip"
        text: "To split the bill evenly, say **“¿Dividimos?”** Putting money together to buy something, like the meat for an [asado] or a gift, is **hacer una vaquita**."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "empanadas"
    title: "Empanadas"
    summary: "A secret code in the fold, and a war between provinces"
    pages:
      - type: card
        text: "Party for twenty or a lazy Sunday night, the answer is the same: **empanadas**, ordered by the **docena**, the dozen. Half-moons of dough, baked or fried, a different filling in each."
      - type: choice
        prompt: "A dozen [empanadas] arrive: four fillings, nothing written on them. How do you tell them apart?"
        options:
          - "By the pattern folded into the edge"
          - "By a little dot of color on top"
          - "By a number stamped into the dough"
        correct: 0
        explain: "The braided edge, the **repulgue**, is a code. Each filling gets its own fold."
      - type: card
        text: "There's no national code, though. Every shop and every grandma has her own system. If it's not on the box, just ask: **“¿Cuál es cuál?”**"
      - type: card
        text: "The usual fillings: **carne** (beef, **suave** or **picante**), **pollo** (chicken), **jamón y queso**, **humita** (corn) and **verdura** (greens). To order: **“Una docena: seis de carne, tres de pollo y tres de humita.”**"
      - type: card
        text: "The northwest takes this very seriously. **Salta** and **Tucumán** each claim the best empanada in the country, and neither will ever back down."
      - type: choice
        prompt: "What is one famous difference between a salteña and a tucumana?"
        options:
          - "Only the salteña has potato"
          - "Only the tucumana is fried"
          - "Only the salteña has egg"
        correct: 0
        explain: "Salteñas get little cubes of **papa**. Put potato in a tucumana and someone from Tucumán will explain your mistake for twenty minutes."
      - type: card
        text: "On good menus you'll see **cortada a cuchillo**: beef chopped by hand, not ground. It keeps the filling juicy."
      - type: card
        chip: "Pro tip"
        text: "A good empanada is full of hot juice. Locals say you eat it **con las piernas abiertas**, legs apart, so the juice misses your pants. In Tucumán, many add a squeeze of lemon before each bite."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "pizza-portena"
    title: "Pizza porteña"
    summary: "Thick, cheesy, eaten standing up, with fainá on top"
    pages:
      - type: card
        text: "Buenos Aires pizza is its own thing. The classic is thick, fluffy dough under a huge amount of cheese. The default order is a **muzza**: tomato, cheese, a few green olives."
      - type: card
        text: "You choose the dough: **al molde** is the thick classic, **a la piedra** is thin and crisp, **media masa** is in between. Order **“una grande de muzza”**, or just **“dos porciones”**, two slices."
      - type: card
        text: "Then there's the **fugazzeta**: a mountain of onion over cheese. Order it **rellena** and the cheese comes inside the dough too. Careful: a **fugazza** is onion only, no cheese."
      - type: choice
        prompt: "[Porteños] often put something on top of their slice of pizza. What is it?"
        options:
          - "A slice of chickpea bread"
          - "A fried egg, runny yolk"
          - "A spoonful of chimichurri"
        correct: 0
        explain: "It's **fainá**, a chickpea flatbread brought by Genoese immigrants. Pizza with fainá on top is pizza **a caballo**: on horseback."
      - type: card
        text: "Add a glass of cheap, sweet **moscato** and you've got the old porteño trio: **moscato, pizza y fainá**."
      - type: card
        text: "**Avenida Corrientes**, the theater street, is also the pizza street. The famous pizzerías there stay packed until long after the last show."
      - type: choice
        prompt: "The play just ended and the pizzería is packed. What do [porteños] do?"
        options:
          - "Eat a slice standing at the counter"
          - "Take a number and wait an hour"
          - "Buy a pizza to eat in the theater"
        correct: 0
        explain: "Eating **de parado**, standing up, at the counter, a **porción** in your hand, is a classic. Faster, cheaper, and honestly more fun."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "herencia-italiana"
    title: "Nona's kitchen"
    summary: "Milanesas, Sunday pasta and ñoquis on the 29th"
    pages:
      - type: card
        text: "Italian cooking came with the immigrants and became the national kitchen. In many families, grandma and grandpa are still **la nona** and **el nono**."
      - type: card
        text: "The home-cooked star is the **milanesa**, or just **mila**: thin beef or chicken, breaded and fried or baked. Kids ask for it on their birthday, and the leftovers become tomorrow's **sánguche de milanesa**."
      - type: choice
        prompt: "The **milanesa a la napolitana** comes with ham, cheese and tomato sauce. Where was it born?"
        options:
          - "In Buenos Aires"
          - "In Naples, Italy"
          - "In Milan, Italy"
        correct: 0
        explain: "At a restaurant called **Nápoli**, near the Luna Park stadium. The story goes a cook burnt a milanesa and hid the damage under ham, cheese and sauce."
      - type: card
        text: "Sunday lunch at the grandparents' often means homemade pasta with **tuco**, a tomato sauce that simmers all morning. Nobody leaves before the second helping."
      - type: card
        text: "On the **29th** of every month, many families eat **ñoquis**. The ritual: a banknote under your plate while you eat, for money and luck."
      - type: choice
        prompt: "Why the 29th? Pick the practical explanation."
        options:
          - "By then the salary was gone, and gnocchi are cheap"
          - "Pasta factories gave away leftovers that day"
          - "Italian immigrants got their papers that day"
        correct: 0
        explain: "That's the practical explanation: potatoes and flour, the cheapest dinner before payday. There's also an Italian legend: a poor family fed San Pantaleón, and later found gold coins under their plates. Many keep the banknote in their wallet until next month."
      - type: card
        text: "So a **ñoqui** is also someone with a public job who never works and only shows up at the end of the month, to get paid. It is an insult."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "guisos-y-helado"
    title: "Stews and corn"
    summary: "Winter pots, patriotic locro and corn in its husk"
    pages:
      - type: card
        text: "When winter hits, Argentines go for a **guiso**, a hearty home stew. One pot, cheap cuts, whatever's in the fridge. The everyday classic is **guiso de lentejas**, lentil stew."
      - type: card
        text: "The king of them all is **locro**: white corn, beans, squash and several meats, cooked for hours until it's thick."
      - type: choice
        prompt: "When do whole neighborhoods cook giant pots of [locro]?"
        options:
          - "On national holidays like 25 de mayo"
          - "On the first frost of every winter"
          - "At the end of the corn harvest"
        correct: 0
        explain: "Locro is the patriotic dish on **25 de mayo** (the revolution of 1810) and **9 de julio** (independence, 1816). Many also cook it on May 1st."
      - type: card
        text: "Clubs, parishes and neighbors cook it in pots big enough to bathe in and sell it by the portion. Bring your own **tupper**, and come early."
      - type: card
        text: "[Locro] is no immigrant dish. It comes from the Andes, from long before Argentina existed. On the side comes a spicy red sauce of oil, paprika and green onion. Ask: **“¿Tenés picante?”**"
      - type: card
        text: "The **carbonada** is beef, squash, corn and sweet potato, often with dried peaches. The showstopper version is served inside a whole baked pumpkin."
      - type: choice
        prompt: "From the northwest comes **humita en chala**, a fresh corn paste. What is it wrapped in?"
        options:
          - "The corn's own husk"
          - "A banana leaf"
          - "Thin, flaky pastry"
        correct: 0
        explain: "Fresh corn grated into a paste, wrapped in the **chala**, the husk, tied up and boiled. You unwrap it at the table like a present."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "helado"
    title: "Helado"
    summary: "Italian roots, flavors called gustos, and ice cream by the kilo"
    pages:
      - type: card
        text: "**Helado** here has Italian roots, and Argentines will tell you it's the best outside Italy. Every neighborhood has a **heladería**, open late, and people eat [helado] even in winter."
      - type: card
        text: "Flavors are called **gustos**, and even the smallest cup gets two. Choosing them is serious business."
      - type: card
        text: "At the shop, you usually pay first at the **caja**, then take your ticket to the counter. You can ask to taste: **“¿Puedo probar?”** Then order: **“Un cuarto de dulce de leche granizado y limón.”**"
      - type: choice
        prompt: "Winter, 11 p.m., dinner at a friend's place is over. What does the host order?"
        options:
          - "A kilo of helado, delivered"
          - "Coffee and cake from a café"
          - "Hot chocolate from the corner"
        correct: 0
        explain: "Helado comes to your door in a foam tub: **un cuarto** (250 g), **medio kilo** or **un kilo**. Any night, any season."
      - type: card
        text: "A kilo takes up to four [gustos], and it's gone before anyone mentions dieting. **Un cuarto** is for one person with self-control."
      - type: card
        text: "A [heladería] lives or dies by its **dulce de leche**, and the best ones offer it in several versions. With chocolate flakes, it's **dulce de leche granizado**."
      - type: choice
        prompt: "**Sambayón**, a classic flavor, has a surprising ingredient. What is it?"
        options:
          - "Sweet wine"
          - "Black coffee"
          - "Cinnamon"
        correct: 0
        explain: "It's the Italian *zabaione*: egg yolks, sugar and sweet wine. A grown-up flavor."
      - type: card
        chip: "Pro tip"
        text: "Order a [dulce de leche], a [sambayón], and one fruit flavor so you can say you ate something healthy."
    vocabulary: []
