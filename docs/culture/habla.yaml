section:
  slug: "habla"
  title: "Cómo hablamos"
  emoji: "🗣️"
  summary: "Vos, the “sh” sound, lunfardo and talking with your hands"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "vos-sos-vos"
    title: "Vos, not tú"
    summary: "The little pronoun that makes you sound Argentine"
    pages:
      - type: card
        text: "Your textbook taught you **tú**. Forget it here. Argentines say **vos**: **vos sos**, **vos tenés**, **¿vos querés?** Say “tú tienes” and people understand you, then know at once that you learned from a textbook."
      - type: card
        text: "Why vos? It's old Spanish. The usual story: **tú** took over in the rich colonial capitals, Lima and Mexico City. The Río de la Plata was a poor, far-off corner, and nobody updated it."
      - type: choice
        prompt: "So what did Argentine schools teach kids for decades?"
        options:
          - "Vos, the way everyone spoke"
          - "Tú, which nobody said at home"
          - "Usted, to teach good manners"
        correct: 1
        explain: "Grammar books kept pushing **tú**. Only in 1982 did the Academia Argentina de Letras accept vos as correct, educated Spanish."
      - type: card
        text: "Plural “you” is always **ustedes**. **Vosotros** is for Spain. Here it survives mainly in the national anthem, which opens with **“Oíd, mortales”**."
      - type: choice
        prompt: "In Buenos Aires, who usually gets the formal **usted**?"
        options:
          - "Anyone older than you"
          - "Doctors, teachers and waiters"
          - "Few people, mostly in formal moments"
        correct: 2
        explain: "The waiter, the shop clerk, often even your friend's grandma: **vos**. Usted still shows up with older strangers and in formal settings, and more outside Buenos Aires, but vos is the normal default."
      - type: card
        text: "So politeness lives in the tone: **disculpá**, **¿me podrías…?**, **por favor**. A warm vos usually beats a stiff usted."
      - type: card
        chip: "Pro tip"
        text: "You don't even need to say vos. The ending does the work: **¿Tenés cambio?** is the whole sentence. Short, friendly, local."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "sho-y-che"
    title: "Sho, che and the melody"
    summary: "The sound, the word and the tune that give a porteño away"
    pages:
      - type: card
        text: "The quickest way to spot a porteño: **y** and **ll** sound like “sh”. **Yo** is “sho”, **calle** is “cashe”, **me llamo** is “me shamo”."
      - type: choice
        prompt: "A Buenos Aires grandma and her granddaughter both say **yo**. What's different?"
        options:
          - "Nothing: the sound hasn't changed in a century"
          - "Grandma buzzes “zho”, the girl says “sho”"
          - "Grandma says “yo”, just like in Madrid"
        correct: 1
        explain: "The older sound is a buzzing **zh**, like the s in *measure*. Younger porteños, led by women, pushed it to a crisp **sh**. Both are 100% porteño."
      - type: card
        text: "The sh isn't only Argentine, it's **rioplatense**: Montevideo says it too. And not all of Argentina does. Much of the interior, like Córdoba, Cuyo, the north and the northeast, keeps a softer y."
      - type: choice
        prompt: "Researchers compared the melody of Buenos Aires Spanish with other ways of speaking. Which was it closest to?"
        options:
          - "Spanish from Madrid"
          - "Brazilian Portuguese"
          - "Neapolitan Italian"
        correct: 2
        explain: "Researchers at CONICET, Argentina's science agency, found it closer to **Naples** than to Madrid. That's why foreigners say porteños sound a bit Italian."
      - type: card
        text: "The tune most likely arrived with the Italian immigrants around 1900. Their accents faded, but the melody stuck."
      - type: card
        text: "Then there's **che**: hey, dude, listen. Nobody knows for sure where it comes from. An old Spanish call for attention, **ce**? Guaraní? Mapudungun? Valencian? Pick a theory and defend it over a mate."
      - type: choice
        prompt: "Ernesto Guevara became world-famous as “Che”. Who gave him the nickname?"
        options:
          - "His Cuban comrades, because he said it constantly"
          - "His mother, who called him that as a baby"
          - "The press, after his first speech in Havana"
        correct: 0
        explain: "To the Cubans, **che** was the most Argentine thing about him. It became his name."
      - type: card
        chip: "Pro tip"
        text: "End a story with **¿viste?**, “you know?”, and you'll sound local instantly: **Hacía un frío, ¿viste?**"
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "lunfardo"
    title: "Lunfardo"
    summary: "The street slang born in the conventillos"
    pages:
      - type: card
        text: "Around 1900, Buenos Aires was packed with immigrants, mostly Italians and Spaniards, crammed into tenements called **conventillos**. Out of that mix came **lunfardo**, the city's street slang."
      - type: choice
        prompt: "Who were the first people to write lunfardo down, in the late 1800s?"
        options:
          - "Tango poets, for their lyrics"
          - "Police, who thought it was a thieves' code"
          - "Teachers, trying to stamp it out"
        correct: 1
        explain: "Police officers and criminologists. Then it turned out bakers, clerks and grandmas talked like that too."
      - type: card
        text: "Then **tango** carried it onto the radio, and lunfardo went from the tenement patio to every living room in the country."
      - type: card
        text: "It's no museum piece. Everyone, from teenagers to bank managers, says **me voy al laburo**, I'm off to work. It comes from the Italian of the immigrants: *lavoro*, work."
      - type: card
        text: "More lunfardo you'll hear every day: **guita**, money. **Pibe** and **piba**, a boy and a girl. **Morfar**, to eat. **Birra**, beer. **Fiaca**, the feeling of not wanting to do anything."
      - type: choice
        prompt: "The city bus is the **bondi**. According to the usual story, where does the word come from?"
        options:
          - "The name of an Italian bus company"
          - "A Guaraní word for a big box"
          - "English “bond”, via Rio's trams"
        correct: 2
        explain: "Brazilians called trams **bonde**, supposedly after the bonds sold as tickets. Buenos Aires borrowed it, and when the trams vanished, the name jumped onto the bus."
      - type: card
        text: "**Chamuyo** is smooth talk: half truth, all charm. You can **chamuyar** a date, a cop, your boss. And when a story sounds too good: **eso es puro chamuyo**."
      - type: card
        text: "One to hear, not say: **mina**, for a woman. Many people use it, women too, but it can sound macho, and from a foreigner it can sound rude."
      - type: card
        chip: "Did you know?"
        text: "Slang has its own academy here: the **Academia Porteña del Lunfardo**, founded in 1962. Scholars meet to study street words the way others study Cervantes."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "vesre-re-posta"
    title: "Vesre, re and posta"
    summary: "Words backwards, words turned up, and the truth"
    pages:
      - type: card
        text: "Porteños love flipping words. Swap the syllables of **revés**, backwards, and you get **vesre**: the name of the game, played on itself."
      - type: choice
        prompt: "Flipped words sound like a party game, but one of these is completely everyday. Which?"
        options:
          - "gotán, from tango"
          - "garpar, from pagar: to pay"
          - "dorima, from marido: husband"
        correct: 1
        explain: "**¿Quién garpa?**, who's paying?, ends plenty of dinners. **Gotán** and **dorima** mostly live in old tangos."
      - type: card
        text: "Another flip you'll hear constantly: **hotel** becomes **telo**. Remember that one. It matters."
      - type: choice
        prompt: "At a party you say you're staying at “un telo re lindo en Palermo”. Everyone bursts out laughing. Why?"
        options:
          - "A telo is a hotel rented by the hour"
          - "Telo is slang for a cheap hostel"
          - "Telo is what little kids call a hotel"
        correct: 0
        explain: "A **telo** is a love hotel: rooms by the hour, discreet entrance. Great story for the rest of the night, though."
      - type: card
        text: "Plenty of people live with their parents well into their twenties, so telos are a normal part of city life, used by couples of all ages. For your stay, just say **hotel**."
      - type: card
        text: "Want “very”? Put **re** in front: **re lindo**, **re lejos**. It even works alone: **—¿Te gustó? —¡Re!**"
      - type: card
        chip: "Did you know?"
        text: "**Posta** means “for real”. **¿Posta?** is “Seriously?”, and **la posta** is the real story. Now you know why this app is called Posta."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "manos-y-chat"
    title: "Hands and texts"
    summary: "Gestures you'll see and shortcuts you'll read"
    pages:
      - type: card
        text: "Porteños don't just talk, they perform. Watch two friends argue about football across the street and you'll get the gist without hearing a word."
      - type: choice
        prompt: "Someone cuts in the bus line. A lady pinches her fingertips together, pointing up, and bobs her wrist. What's she saying?"
        options:
          - "“Wait a second, please”"
          - "“That costs a lot”"
          - "“What's your problem?”"
        correct: 2
        explain: "That's the **montoncito**: **¿qué te pasa?** From friendly to threatening, depending on the face. It even has its own emoji: 🤌."
      - type: card
        text: "Two more you'll see daily. Flat hand rocking side to side: **más o menos**. Finger pulling down your lower eyelid: careful, **¡ojo!**"
      - type: choice
        prompt: "You ask a man where the bus stops. He brushes the back of his fingers forward from under his chin. What is he telling you?"
        options:
          - "“No idea”"
          - "“I don't care”"
          - "“Go away”"
        correct: 0
        explain: "It means **ni idea**, no idea. In Italy the same move means “I don't care”, but here it isn't rude."
      - type: card
        text: "Argentines love **audios**: WhatsApp voice notes instead of typing. A three-minute audio just to say you're running late? Completely normal."
      - type: card
        text: "When they do type, they cut words short: **q** is que, **xq** is porque, **tmb** is también, **dsp** is después. And **tqm**, te quiero mucho, closes many family chats."
      - type: choice
        prompt: "You suggest a 7 a.m. Sunday run. Your friend replies: **“bue”**. How excited are they?"
        options:
          - "Thrilled, can't wait"
          - "Going along, not happy"
          - "It's a firm no"
        correct: 1
        explain: "**Bue** is **bueno** with a sigh: fine, if we must. Stretched out, **bueee**, it means “oh, come on”."
      - type: card
        chip: "Pro tip"
        text: "**Dale** is the reply to almost everything: OK, sure, come on, go ahead. **—¿Vamos a las 8? —Dale.** In a chat, it often closes the conversation."
    vocabulary: []
