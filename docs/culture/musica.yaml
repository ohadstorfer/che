section:
  slug: "musica"
  title: "Música"
  emoji: "🎸"
  summary: "Rock nacional, folklore, cumbia, trap, and crowds louder than the band"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "rock-nacional"
    title: "Rock nacional"
    summary: "Rock in Spanish, born in a café bathroom and raised under a dictatorship"
    pages:
      - type: card
        text: "Before 1967, rock here meant copies: foreign hits, translated or sung in English. Then **Los Gatos** released **“La balsa”**, an original song in Spanish, and it sold. **Rock nacional** was born."
      - type: choice
        prompt: "The story goes that “La balsa” was started somewhere unusual. Where?"
        options:
          - "In the bathroom of an all-night café"
          - "In a police cell, after a noisy night out"
          - "On a ferry crossing the Río de la Plata"
        correct: 0
        explain: "**Tanguito** came up with the opening in the bathroom of **La Perla del Once**, an all-night café where young musicians met. **Litto Nebbia** finished the song. At least, that's the legend."
      - type: card
        text: "Two names you must know. **Luis Alberto Spinetta**, **el Flaco**, wrote dreamy, poetic songs like **“Muchacha (ojos de papel)”**. **Charly García** became the wild genius: brilliant, unpredictable, loved. Start with **“Los dinosaurios”**."
      - type: choice
        prompt: "Charly once made a famous exit from a ninth-floor hotel room in Mendoza. How?"
        options:
          - "He jumped out the window into the pool"
          - "He climbed down on knotted bedsheets"
          - "He slid down the laundry chute"
        correct: 0
        explain: "Ninth floor, into the pool, and he walked away. It's rock legend now, though it came from a rough time in his life."
      - type: card
        text: "Under the 1976–83 dictatorship, rock was censored and harassed, so musicians sang in metaphors. For many kids, a concert was the only place they could feel free together."
      - type: choice
        prompt: "Then came the 1982 [Malvinas] war against Britain. What happened to Argentine rock on the radio?"
        options:
          - "It took over, because English songs were pulled"
          - "It was banned completely until the war ended"
          - "Nothing changed: it stayed underground"
        correct: 0
        explain: "The regime that harassed rockers suddenly needed Spanish songs to fill the airwaves. Bands went from underground to mainstream almost overnight."
      - type: card
        text: "**Soda Stereo** took Argentine rock across Latin America. At their farewell show in 1997, **Gustavo Cerati** closed with **“¡Gracias… totales!”** People still say it, half joking, for a very big thank you."
      - type: card
        text: "More names you'll hear at every party: **Fito Páez**, **Andrés Calamaro**, **Los Fabulosos Cadillacs** and **Divididos**. Everyone in the room knows the words."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "folklore"
    title: "Folklore, peñas and pañuelos"
    summary: "Guitars, handkerchiefs and the voice of La Negra"
    pages:
      - type: card
        text: "In Argentina **folklore** isn't museum music. It's the living sound of the provinces: guitars, violins and the **bombo legüero**, a deep drum of wood and hide."
      - type: card
        text: "Its rhythms have names. **Zamba** and **chacarera** come from the northwest. **Chamamé**, played with accordion, comes from the northeast. Young people still sing them at parties."
      - type: card
        text: "**Mercedes Sosa**, from Tucumán, was **La Negra**, a nickname said with love. Her version of **“Gracias a la vida”**, by Chile's Violeta Parra, still makes whole rooms cry."
      - type: choice
        prompt: "During the dictatorship, where was Mercedes Sosa arrested?"
        options:
          - "On stage, in the middle of a concert"
          - "At the airport, back from a tour"
          - "At home, while writing a song"
        correct: 0
        explain: "She was arrested mid-concert in La Plata in 1979, along with the audience, and went into exile in Europe. She came back in 1982, still under the dictatorship, and packed theater after theater."
      - type: card
        text: "A **peña** is a folklore night: long tables, **empanadas**, wine and live music. Nobody just sits and watches. When a [chacarera] starts, people dance between the tables, then sit down and keep eating."
      - type: choice
        prompt: "The **zamba** is a slow dance for couples, with a white handkerchief. How do they use it?"
        options:
          - "They wave it while circling, never touching"
          - "They tie it around their partner's wrist"
          - "They drop it for the other to pick up"
        correct: 0
        explain: "The **pañuelo**, the handkerchief, turns the zamba into slow flirting. And no, it's not the Brazilian samba. The fast one, with stomping and finger snaps, is the **chacarera**."
      - type: card
        text: "Every January, the small town of **Cosquín**, in the Córdoba hills, hosts the national folk festival: nine nights, **las nueve lunas**. Each night opens with a shout: **“¡Aquí Cosquín!”**"
      - type: card
        chip: "Pro tip"
        text: "Invited to dance at a [peña]? Say **“¡Dale!”** and get up. Nobody expects a foreigner to dance well. Getting up is what counts."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "cumbia-y-cuarteto"
    title: "Cumbia and cuarteto"
    summary: "The bailanta, a cumbia saint, and the tunga tunga from Córdoba"
    pages:
      - type: card
        text: "Rock fills stadiums, but **cumbia** fills the dance floor. Born in Colombia, it became deeply Argentine in the dance halls of the suburbs: the **bailantas**."
      - type: card
        text: "At every wedding the DJ eventually puts on [cumbia], and even your serious uncle turns out to be a **cumbiero**. You don't have to like it. You just have to dance."
      - type: choice
        prompt: "**Gilda** became one of the biggest [cumbia] stars of the 90s. What was her job before?"
        options:
          - "Kindergarten teacher"
          - "Radio DJ"
          - "Hairdresser"
        correct: 0
        explain: "She was a **maestra jardinera**, a kindergarten teacher, and only became a star in her 30s, in a scene run by men. Her **“No me arrepiento de este amor”** is still sung everywhere."
      - type: card
        text: "In 1996 Gilda died when a truck hit her tour bus on **Ruta 12**, in Entre Ríos. People began asking her for miracles at a shrine by the road. The Church never made her a saint. The people did."
      - type: card
        text: "In the late 90s, with the economy collapsing, a rawer style grew in the poorest neighborhoods: **cumbia villera**. Critics hear crude lyrics. Fans hear the honest voice of the barrio."
      - type: card
        text: "In **Córdoba** the party sound is **cuarteto**, with a bouncy piano beat everyone calls **tunga tunga**. Its king, **La Mona Jiménez**, has played packed dances for decades."
      - type: choice
        prompt: "In 2025 [cuarteto] got an honor that tango got back in 2009. Which one?"
        options:
          - "A place on UNESCO's heritage list"
          - "Its own Latin Grammy category"
          - "A national day off in its name"
        correct: 0
        explain: "UNESCO added cuarteto to its list of Intangible Cultural Heritage. Not bad for music born in Córdoba's dance halls."
      - type: card
        text: "**Rodrigo**, **el Potro**, took [cuarteto] to Buenos Aires and filled the Luna Park. He died young, in a car crash after a show. **“Soy cordobés”** and **“La mano de Dios”**, his song for Maradona, still close every party."
      - type: card
        text: "And today? You'll hear **Los Palmeras**, from Santa Fe, with **“Bombón asesino”**, the [cumbia] of **Ke Personajes**, and the [cuarteto] of **La K'onga**."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "trap-y-rkt"
    title: "Trap, RKT and Bizarrap"
    summary: "From freestyle battles in a park to the biggest stages in the world"
    pages:
      - type: card
        text: "Argentine trap and rap fill stadiums now. Its big names, like **Duki**, **Trueno** and **Wos**, didn't come from music schools or record labels."
      - type: choice
        prompt: "So where did they learn?"
        options:
          - "Rap battles on the steps of a park"
          - "Singing in church choirs as kids"
          - "Busking for coins on the subte"
        correct: 0
        explain: "For years, kids met on the steps of **Parque Rivadavia** for **El Quinto Escalón**: free freestyle battles, and the crowd shouted for the winner."
      - type: card
        text: "**Bizarrap** is a producer who hides behind a cap and dark glasses. In his **BZRP Music Sessions**, one guest raps or sings over his beat in a tiny studio."
      - type: choice
        prompt: "Before producing, how did Bizarrap get known on YouTube?"
        options:
          - "Editing videos of freestyle battles"
          - "Posting football goal compilations"
          - "Reviewing video games live"
        correct: 0
        explain: "He cut and posted clips of battles like the Quinto Escalón. The scene that made Duki and Trueno made him too."
      - type: card
        text: "A session with **el Biza**, as everyone calls him, can launch a career overnight. In 2023 his session with **Shakira**, a song aimed at her ex, broke YouTube records."
      - type: card
        text: "Women run the charts too: **María Becerra** sold out River's stadium, **Tini** went from Disney star to pop queen, and **Nicki Nicole** broke out of Rosario."
      - type: choice
        prompt: "One big party sound of the 2020s is **RKT**. Where does the name come from?"
        options:
          - "A club called Rescate"
          - "A rapper called Rocket"
          - "A label called RocKTown"
        correct: 0
        explain: "DJs at **Rescate**, a club in San Martín, just outside the city, started mixing it. “RKT” is a short form of the club's name, and the sound kept it."
      - type: card
        text: "RKT is reggaetón plus [cumbia villera], with huge bass. **L-Gante** made it explode, recording his first hits on a laptop the government gave out to schoolkids. He calls his style **cumbia 420**."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "en-vivo"
    title: "Live: pogo, bengalas and misas"
    summary: "Why foreign bands leave Argentina a little shaken"
    pages:
      - type: card
        text: "At a **recital** here, the crowd doesn't just listen. It sings every word, often louder than the band. Foreign artists leave a little shaken."
      - type: choice
        prompt: "The Rolling Stones named a whole documentary after something Latin American crowds do. What?"
        options:
          - "The “Olé, olé, olé” chant"
          - "The way fans camp out for days"
          - "The flares they light in the stands"
        correct: 0
        explain: "*Olé, Olé, Olé!* Between songs, the stadium sings it football style, followed by the artist's name: **“Olé, olé, olé, olé… Charly, Charly!”**"
      - type: card
        text: "Argentina has so many Stones fans they have a name: **rollingas**. When a band walks off before the encore, the stadium shouts **“¡Otra, otra!”**, or sings **“una más, y no jodemos más”**: one more and we'll stop bothering you."
      - type: card
        text: "**Los Redondos**, led by singer **el Indio Solari**, barely talked to the press, yet fans crossed the country to see them. Fans didn't call the shows concerts. They called them **misas**: masses."
      - type: choice
        prompt: "Near the stage, hundreds of people jump and crash into each other: the **pogo**. What happens if someone falls?"
        options:
          - "The people closest pick them up"
          - "The band stops the song"
          - "Security pulls them out"
        correct: 0
        explain: "It looks like chaos, but it has a code: **si alguien se cae, se lo levanta**. Whoever falls gets picked up."
      - type: card
        text: "In the 90s, barrio rock crowds, **rock chabón**, brought the football stadium to gigs: banners, chants and **bengalas**, flares lit right in the crowd."
      - type: card
        text: "The flares had a dark side. On December 30, 2004, at a **Callejeros** show at **República Cromañón**, a flare set the ceiling on fire. The club was overcrowded, an exit was locked. **194 people died**, most of them young."
      - type: card
        text: "It changed live music forever: much stricter rules, and a flare indoors is now unthinkable. Every December 30, families still gather to remember."
    vocabulary: []
