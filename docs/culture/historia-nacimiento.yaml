section:
  slug: "historia-nacimiento"
  title: "Historia: el nacimiento de un país"
  emoji: "🇦🇷"
  summary: "From the first peoples to the granary of the world: how Argentina came to be, up to 1930"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "antes-de-buenos-aires"
    title: "Before Buenos Aires"
    summary: "The first peoples, a silver dream, and a city founded twice"
    pages:
      - type: card
        text: "Long before the Spanish, this land was full of peoples: **guaraníes** in the northeast, **diaguitas** in the northwest valleys, **tehuelches** in Patagonia, **querandíes** on the pampa. Argentines call them **pueblos originarios**."
      - type: card
        text: "Their descendants are still here. Today **12 de octubre** is no longer the “Día de la Raza” but the Day of Respect for Cultural Diversity."
      - type: choice
        prompt: "Buenos Aires means “good airs”. Where did the name really come from?"
        options:
          - "A Virgin that sailors prayed to"
          - "The mild climate the explorers found"
          - "A port town in southern Spain"
        correct: 0
        explain: "Sailors prayed to **Santa María del Buen Ayre** for good winds. The city kept the “good airs” and dropped the rest."
      - type: card
        text: "In 1536 **Pedro de Mendoza** founded that first **Buen Ayre** on the Río de la Plata. It went badly: hunger, disease and fights with the querandíes. The survivors gave up and left."
      - type: choice
        prompt: "So where did the Buenos Aires that lasted come from?"
        options:
          - "Settlers sailing down from Asunción"
          - "A new fleet sent from Spain"
          - "Portuguese traders from Brazil"
        correct: 0
        explain: "**Juan de Garay** came down the river from Asunción, in today's Paraguay, and founded the city again in 1580, this time for good."
      - type: card
        text: "Even the country's name is a hope. **Argentina** comes from the Latin for silver: the Spanish dreamed of silver mountains here."
      - type: card
        chip: "Did you know?"
        text: "The silver was real, but far away in **Potosí**, in today's Bolivia. For two centuries Buenos Aires stayed a small, muddy port, famous mostly for smuggling."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "virreinato-e-invasiones"
    title: "A viceroyalty and two British invasions"
    summary: "How a smuggling port became a capital, and threw out the British twice"
    pages:
      - type: card
        text: "In 1776 Spain made Buenos Aires the capital of a huge **Virreinato**: today's Argentina, Uruguay, Paraguay and Bolivia. Suddenly the smuggling port was a capital."
      - type: card
        text: "The viceroy ruled from the fort, where the [Casa Rosada] stands today. Across the square sat the **Cabildo**, the town council, the voice of the locals. Its white building with arches is still there, now a museum."
      - type: choice
        prompt: "Look closely at the [Cabildo] today. What happened to it?"
        options:
          - "It lost arches to make room for avenues"
          - "It was moved stone by stone from Córdoba"
          - "It was built as a church, then converted"
        correct: 0
        explain: "The city cut it twice to open new avenues. It went from eleven arches down to five."
      - type: card
        text: "In 1806 a British force sailed in and took Buenos Aires. Nobody expected it."
      - type: choice
        prompt: "The British march in. What does the Spanish viceroy do?"
        options:
          - "Flees the city with the treasury"
          - "Leads the defense street by street"
          - "Surrenders and swears loyalty to Britain"
        correct: 0
        explain: "Viceroy Sobremonte ran away, and people never forgave him. The British caught the treasure in Luján anyway, and he ended up in Córdoba. The locals had to fight on their own."
      - type: card
        text: "Locals organized under **Santiago de Liniers** and threw the British out. In 1807 the British came back, bigger. [Porteños] fought street by street, and won again. Argentines call the two attacks the **invasiones inglesas**."
      - type: card
        text: "The story every kid learns: neighbors poured boiling water and oil from the flat rooftops onto British soldiers. Some of it is polished legend. The street fighting was very real."
      - type: card
        chip: "Did you know?"
        text: "Two downtown streets remember it: **Reconquista** and **Defensa**. And [porteños] learned they could beat an empire without Spain. So why keep obeying a viceroy?"
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "mayo-y-julio"
    title: "May and July: the big dates"
    summary: "The Revolución de Mayo, independence in Tucumán, and the streets named after them"
    pages:
      - type: card
        text: "In 1808 Napoleon invaded Spain and locked up its king. In Buenos Aires a big question landed: if there's no king, who's in charge here?"
      - type: card
        text: "On **25 de mayo de 1810**, locals removed the viceroy and formed their own government, the **Primera Junta**. That's the **Revolución de Mayo**, and why the main square is **Plaza de Mayo**."
      - type: choice
        prompt: "Every school drawing of that day shows the crowd outside the [Cabildo] holding the same thing. What?"
        options:
          - "Umbrellas"
          - "Torches"
          - "Flags"
        correct: 0
        explain: "A sea of umbrellas, in the rain. Historians have doubts: umbrellas were a pricey import back then, so the picture is probably exaggerated."
      - type: card
        text: "Not quite independence yet: the Junta still ruled in the Spanish king's name, at least on paper. The formal break came six years later, and the war with Spain went on even longer."
      - type: choice
        prompt: "Where was independence finally declared?"
        options:
          - "In a family house in Tucumán"
          - "In the Cabildo of Buenos Aires"
          - "In a church in Córdoba"
        correct: 0
        explain: "Delegates from the provinces met in **San Miguel de Tucumán** and declared independence on **9 de julio de 1816**."
      - type: card
        text: "The house was rebuilt around the original room and is now the **Casa Histórica**, a museum and the classic school trip. Almost every Argentine kid has a photo in front of its door."
      - type: card
        text: "Both days are **feriados**. People pin a light-blue-and-white **escarapela** to their chest, and schoolkids act out 1810 in colonial costume, with mustaches drawn on in burnt cork."
      - type: card
        chip: "Did you know?"
        text: "The dates are on the map too. **Avenida 9 de Julio** is the huge one with the [Obelisco], and almost every town has a street called [25 de Mayo]."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "san-martin-y-belgrano"
    title: "San Martín, Belgrano and the flag"
    summary: "The man who made the flag and the general who crossed the Andes"
    pages:
      - type: card
        text: "**Manuel Belgrano** was a lawyer and economist who ended up a general. In 1812, by the river in **Rosario**, he raised a light blue and white flag. Buenos Aires wasn't thrilled: it looked too independent."
      - type: card
        text: "Kids learn the **celeste** and white come from the sky and its clouds. Some historians aren't so sure."
      - type: choice
        prompt: "What's the rival theory about the flag's colors?"
        options:
          - "They were the Spanish royal family's colors"
          - "They copied a British regiment's uniform"
          - "They came from the old Inca empire"
        correct: 0
        explain: "Some argue celeste and white were colors of the Borbón royal house. Others say they come from the Virgin Mary's robe. Nobody can prove any of the stories."
      - type: card
        text: "Belgrano gave nearly everything to the cause and died poor. The day he died, **20 de junio**, is now **Día de la Bandera**, Flag Day."
      - type: card
        text: "**José de San Martín** had a bold plan: beat Spain in Peru by going through Chile. In 1817, from **Mendoza**, he led an army over Andes passes more than 4,000 meters high."
      - type: card
        text: "With thousands of men, mules and horses, he crossed the **cordillera**, helped free Chile, then Peru. Argentines call him the **Padre de la Patria**."
      - type: choice
        prompt: "San Martín died in France. Where is he today?"
        options:
          - "In the Buenos Aires cathedral"
          - "Still buried in France"
          - "Under his monument in Mendoza"
        correct: 0
        explain: "His remains came home. His tomb in the **Catedral** on Plaza de Mayo is guarded by **Granaderos** in old blue uniforms, the regiment he founded. The day he died, **17 de agosto**, is a holiday too."
      - type: card
        chip: "Did you know?"
        text: "Every town has a San Martín street, square or statue, usually on horseback. If you're lost, head for the plaza: he's probably in the middle."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "unitarios-federales-y-gauchos"
    title: "Unitarios, federales and gauchos"
    summary: "Decades of civil war, Rosas, and the horsemen of the pampa"
    pages:
      - type: card
        text: "Winning independence was one thing. Agreeing on how to run the country was harder: decades of civil war followed. **Unitarios** wanted one strong government in Buenos Aires. **Federales** wanted the provinces to rule themselves, each under its own **caudillo**."
      - type: card
        text: "Behind it all: who keeps the money from the port? Buenos Aires had a clear answer: Buenos Aires."
      - type: card
        text: "**Juan Manuel de Rosas**, a rich landowner and a federal, ran Buenos Aires from 1829 to 1852, with one short break, and with near-total power."
      - type: choice
        prompt: "Under Rosas, one color was all but required. Which?"
        options:
          - "Red, the federal color"
          - "Celeste, like the flag"
          - "Black, for the fallen"
        correct: 0
        explain: "Wearing federal red was the safe choice. His enforcers, the **Mazorca**, terrorized anyone who looked like an opponent."
      - type: card
        text: "Argentines still argue about him. A bloody tyrant, said liberals like **Sarmiento**, a writer and later president. A defender of the country against British and French fleets, say others. Don't raise it at an [asado] unless you have time."
      - type: card
        text: "Out on the pampa lived the **gauchos**: expert horsemen who worked cattle, with knife, poncho, [mate] and guitar. Governments treated them as vagrants and forced many into the army."
      - type: choice
        prompt: "So what turned the gaucho into a national hero?"
        options:
          - "A long poem about one of them"
          - "A cavalry victory against Spain"
          - "A tango about life on the pampa"
        correct: 0
        explain: "**Martín Fierro** (1872), by **José Hernández**, tells of a gaucho dragged to the frontier who ends up an outlaw. Most kids meet it at school."
      - type: card
        text: "Hernández's birthday, **10 de noviembre**, is the **Día de la Tradición**. Towns like **San Antonio de Areco** fill with horses, ponchos and folk music."
      - type: card
        chip: "Pro tip"
        text: "The most quoted lines: **“Los hermanos sean unidos, porque esa es la ley primera.”** Brothers, stick together. Argentines still say it, usually in the middle of a family fight."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "desierto-e-inmigrantes"
    title: "The Campaña del Desierto"
    summary: "A plan to fill the country, and a war over land still argued about"
    pages:
      - type: card
        text: "After Rosas fell in 1852, a **Constitución** was written in 1853. The new leaders' motto: **gobernar es poblar**, to govern is to populate. Bring immigrants, railways and money."
      - type: card
        text: "And schools. **Domingo Faustino Sarmiento**, president from 1868, opened them all over the country, and an 1884 law made primary school free and compulsory. The day he died, **11 de septiembre**, is **Día del Maestro**, Teachers' Day."
      - type: card
        text: "The plan also meant taking land. Between 1878 and 1885, the army, first led by **Julio Argentino Roca**, took the pampa and Patagonia from the **mapuches**, **ranqueles**, **tehuelches** and other peoples."
      - type: choice
        prompt: "Official history called it the **Conquista del Desierto** or Campaña del Desierto: the conquest of the desert. Why “desert”?"
        options:
          - "It painted a lived-in land as empty"
          - "The land was mostly sand dunes"
          - "Nobody had mapped it yet"
        correct: 0
        explain: "Those lands were home to whole peoples. Calling them “desert” made taking them sound like settling nothing."
      - type: card
        text: "By the army's own count for 1879, over a thousand people were killed and over ten thousand taken prisoner. Families were split up and many forced to work as servants. The land went to a few big owners."
      - type: card
        text: "For a long time schools taught it as a heroic conquest. Today many historians and indigenous communities call it a **genocidio**. Others reject that word. Many now write the name in quotes."
      - type: card
        text: "Roca was on the old 100-peso bill, and his statues stand in many towns. Who should be on banknotes and statues is part of the same argument."
      - type: choice
        prompt: "In a town square you see a statue of Roca. What's likely to have happened to it lately?"
        options:
          - "Splashed with red paint, then cleaned again"
          - "Moved indoors to a history museum"
          - "Covered in flowers every Día de la Tradición"
        correct: 0
        explain: "His statues get painted, cleaned and painted again. Some want them gone, others want them kept. It's the same debate, in the street."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "los-barcos"
    title: "The boats: immigrants and conventillos"
    summary: "Millions of Europeans, one room per family, and the mix that made Buenos Aires"
    pages:
      - type: card
        text: "From the 1870s on, ships brought millions of Europeans, mostly **italianos** and **españoles**. For a while, around half of Buenos Aires was born abroad."
      - type: card
        text: "Hence the old joke: Mexicans descend from the Aztecs, Peruvians from the Incas, and Argentines… **from the boats**. It forgets the indigenous and Afro-Argentine people who were already here."
      - type: choice
        prompt: "In Buenos Aires, what nickname does a man from Madrid often get?"
        options:
          - "Gallego"
          - "Madrileño"
          - "Tano"
        correct: 0
        explain: "Galicia sent so many people that **gallego** came to mean any Spaniard. Italians are **tanos**. In the same way, Arabs were called **turcos** and Jews **rusos**, whatever country they came from. Among friends these are usually friendly."
      - type: card
        text: "New arrivals could sleep free for a few days at the **Hotel de Inmigrantes**, by the port, while they looked for work. Today it's a museum, and people search its records for their great-grandparents."
      - type: card
        text: "Many ended up in **conventillos**: old houses split into single rooms, one family per room, one patio and bathroom for dozens. Italians, Spaniards, Jews, Arabs and locals, all together."
      - type: choice
        prompt: "In 1907, tenants all over Buenos Aires went on a rent strike. What did women and kids march with?"
        options:
          - "Brooms"
          - "Pots and pans"
          - "Candles"
        correct: 0
        explain: "Brooms, to “sweep away” the landlords. That patio life, with its fights and its songs, fed the city's slang and its tango."
      - type: card
        text: "The boats still matter. For decades, Argentines hunted down a grandparent's or great-grandparent's papers to get an Italian or Spanish passport. Italy made its rules stricter in 2025, but a great many Argentines already have one."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "granero-del-mundo"
    title: "The granary of the world"
    summary: "Trains, wheat, the secret vote, rooftop radio, and the coup that ended it all"
    pages:
      - type: card
        text: "Around 1900 Argentina shipped wheat, corn and beef across the ocean, mostly to Britain. It proudly called itself **el granero del mundo**: the world's granary."
      - type: card
        text: "British money built the railways. Look at the map: the lines spread out from Buenos Aires like an open fan, all carrying grain and cattle to one port."
      - type: card
        text: "Around the 1910 centenary, many felt they lived in one of the richest countries on earth. The **Teatro Colón** opened. But the best land sat in a few hands."
      - type: choice
        prompt: "It's 1905 and you walk into a polling station. How do you vote?"
        options:
          - "Out loud, in front of everyone"
          - "Secretly, in a sealed envelope"
          - "By raising your hand in a hall"
        correct: 0
        explain: "The **voto cantado**, the sung vote: you said your choice aloud, with the local boss listening. Fraud was routine."
      - type: card
        text: "In 1912 the **Ley Sáenz Peña** made voting secret and compulsory for men. That's why voting is still compulsory in Argentina today. Women had to wait until 1947."
      - type: card
        text: "In 1916 the first presidential election under the new law was won by **Hipólito Yrigoyen**. He led the **radicales** (the UCR party), still one of the main parties today."
      - type: choice
        prompt: "In 1920, four friends climbed onto a theater roof in Buenos Aires. What did they do up there?"
        options:
          - "Broadcast an opera by radio"
          - "Filmed the first Argentine movie"
          - "Launched a hot-air balloon"
        correct: 0
        explain: "They broadcast Wagner's *Parsifal* to a few dozen homemade radio sets: one of the world's first public broadcasts. They're remembered as **los locos de la azotea**, the rooftop madmen."
      - type: card
        text: "Then came the 1929 crash, and grain and beef prices sank. In 1930 the army overthrew President **Yrigoyen**: the first of many coups, and the end of the granary years."
    vocabulary: []
