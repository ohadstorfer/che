  # ─────────────────────────────────────────────────────────────
  - slug: "granero-del-mundo"
    title: "The granary of the world"
    summary: "1880 to 1930: trains, wheat, the secret vote, and the coup that ended it"
    pages:
      - type: info
        title: "El granero del mundo"
        emoji: "🌾"
        body: "Around 1900 Argentina shipped wheat, corn and beef across the ocean, mostly to Britain. British money built the **trenes** (railways), which fan out from the port of Buenos Aires like the ribs of a hand fan: everything flowed to the port, so traveling between two provinces can still mean a long detour. **Frigoríficos** (meatpacking plants) sent chilled beef to Europe. The country called itself **el granero del mundo**, the world's granary."

      - type: true_false
        statement: "Argentina's old railways were built mainly to carry grain and beef to the port."
        answer: true
        explain: "Mostly British-built, they pointed at Buenos Aires to ship everything out. That's why, even today, going between two provinces can mean a long detour."

      - type: info
        title: "Rich, but for whom?"
        emoji: "🎩"
        body: "Around the **Centenario** of 1910, many Argentines felt they lived in one of the richest countries on earth, and some economic estimates agree. Buenos Aires got the Congreso and the **Teatro Colón**. But the best land was in a few hands, and many workers lived in crowded conventillos. That gap is why people still argue about how 'golden' those years were."

      - type: info
        title: "Ley Sáenz Peña, 1912"
        emoji: "🗳️"
        body: "Before this law, elections were a show: people voted out loud, the **voto cantado** (sung vote), and fraud was routine. The **Ley Sáenz Peña** made the vote for men **secreto** and **obligatorio**: the **voto secreto** (secret ballot) had arrived. **Hipólito Yrigoyen**, of the Unión Cívica Radical, won the first presidential election held that way. Women had to wait decades more."

      - type: choice
        scenario: "It's 1905 and you walk into a polling station in Buenos Aires."
        prompt: "How do you vote?"
        options: ["Out loud, in front of everyone", "Secretly, in an envelope", "By raising your hand"]
        correct: 0
        explain: "The **voto cantado**: you said your choice out loud, with the local boss listening. The secret ballot arrived in 1912."

      - type: info
        title: "Los locos de la azotea"
        emoji: "📻"
        body: "In 1920, Enrique Susini and three friends climbed onto the roof of the Teatro Coliseo and broadcast Wagner's opera *Parsifal* to a few dozen homemade radio sets. They were nicknamed **los locos de la azotea**, the rooftop madmen. Argentina counts it among the world's first public radio broadcasts, and still celebrates the date as Broadcasting Day."

      - type: gap
        prompt: "What were the radio pioneers called?"
        text: "Los locos de la ___."
        options: ["azotea", "cocina", "esquina"]
        correct: 0
        translation: "The rooftop madmen."
        explain: "**Azotea** is a flat roof terrace. In Buenos Aires they're everywhere, and now you know one made history."

      - type: info
        title: "The dark side: the Semana Trágica"
        emoji: "⚠️"
        body: "Not everyone shared in the boom. In January 1919 a **huelga** (strike) at the Vasena metal works in Buenos Aires turned into the **Semana Trágica** (Tragic Week). Under Yrigoyen's government, police, soldiers and armed civilian groups crushed it. Hundreds died (the estimates vary a lot) and thousands were arrested. Gangs also attacked the Jewish neighborhood of **Once**."

      - type: true_false
        statement: "During the Semana Trágica, the government sided with the striking workers."
        answer: false
        explain: "Police, the army and armed civilian groups crushed the strike. It's remembered as one of the worst episodes of repression of the era, and as a pogrom against Once's Jewish community."

      - type: info
        title: "1930: the end of an era"
        emoji: "🪖"
        body: "Then the world crashed. The 1929 crisis sank grain and beef prices, and Argentina's export boom stalled. In **1930** the army overthrew Yrigoyen, by then old and in his second term. It was the first of several military coups: for the next half century, elected governments and military ones would take turns. The granary years were over."

      - type: match
        prompt: "Match what happened then to what you'll still notice today"
        pairs:
          - ["Railways fanned out to the port", "long detours between provinces"]
          - ["The Ley Sáenz Peña", "voting is compulsory"]
          - ["The Centenario boom", "the Teatro Colón"]
          - ["The rooftop broadcast", "Broadcasting Day"]

