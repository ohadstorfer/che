  # ─────────────────────────────────────────────────────────────
  - slug: "messi-y-qatar"
    title: "Messi and Qatar"
    summary: "Heartbreak in Brazil, glory in Qatar"
    pages:
      - type: info
        title: "The quiet kid from Rosario"
        emoji: "🐐"
        body: "**Lionel Messi** grew up in **Rosario** and left for Barcelona as a kid. For years some Argentines grumbled that he didn't sing the anthem and only shone in Spain. He grew up a **Newell's** fan, and he's **la Pulga** (*the flea*) for being small. That grumbling is now very, very dead."

      - type: info
        title: "So close"
        emoji: "💔"
        body: "The **2014** World Cup final, in Brazil: Germany scored late in extra time and won 1–0. Messi, named best player of the tournament, walked past the trophy he couldn't touch, and that photo still hurts here. Two more lost Copa América finals followed, and Messi briefly quit **la Selección**, the national team."

      - type: true_false
        statement: "After those lost finals, Messi quit the national team for a while."
        answer: true
        explain: "Briefly. Half the country begged him to come back, and he did. Good call."

      - type: info
        title: "Qatar 2022"
        emoji: "🏆"
        body: "The final against France was madness: Argentina up 2–0, France levels, Messi scores in extra time, France levels again. Then **penales** (penalties). **Dibu Martínez**, the **arquero** (*goalkeeper*), saves one, and **Gonzalo Montiel** scores the last. Messi finally lifts the cup."
        fun_fact: "The celebration in Buenos Aires drew millions of people — the Obelisco disappeared under a sea of shirts."

      - type: true_false
        statement: "In the Qatar final, France came back from two goals down."
        answer: true
        explain: "Twice, in fact: from 2–0 and again from 3–2. Many Argentines say they didn't breathe for about three hours."

      - type: info
        title: "Muchachos"
        emoji: "🎶"
        body: "The soundtrack of Qatar was a cantito: **\"Muchachos, ahora nos volvimos a ilusionar\"** — *Guys, now we've got our hopes up again*. Fans wrote it to the tune of a song by the band La Mosca. It name-checks Malvinas, Diego and Leo. Sing it at any party and the whole room joins in."

      - type: gap
        prompt: "Start the Qatar song and see who joins in"
        text: "Muchachos, ahora nos volvimos a ___."
        options: ["ilusionar", "enojar", "dormir"]
        correct: 0
        translation: "Guys, now we've got our hopes up again."
        explain: "**Ilusionarse** = to get your hopes up. *Enojar* (get angry) and *dormir* (sleep) would make a very different World Cup."

      - type: info
        title: "Cábala and mufa"
        emoji: "🧦"
        body: "Argentines take luck seriously. A **cábala** is your lucky ritual: same seat, same socks, same mate. If the team wins, you change NOTHING. And the friend who always seems to be watching when we lose? He's **mufa**, a jinx. During a final, he may be politely sent to watch from the kitchen."

      - type: choice
        scenario: "Final, Argentina winning. Your friend's cousin walks in late, and France scores twice. Everyone turns to look at him."
        prompt: "What is everyone thinking?"
        options: ["¡Es mufa!", "¡Es cábala!", "¡Es penal!"]
        correct: 0
        explain: "He's the jinx. Next match he watches from the kitchen — and keeping him there becomes the new cábala."

      - type: gap
        prompt: "Your friend is scared to change his lucky socks. He says:"
        text: "No las lavo, es ___."
        options: ["cábala", "golazo", "penal"]
        correct: 0
        translation: "I'm not washing them, it's my lucky ritual."
        explain: "**Cábala**: the lucky ritual. The opposite is **mufa**, bad luck, or the person who brings it."
    vocabulary:
      - es: "la Pulga"
        en: "the Flea (Messi's nickname)"
      - es: "arquero"
        en: "goalkeeper"
        example: { es: "El Dibu es el mejor arquero.", en: "Dibu is the best goalkeeper." }
      - es: "penal"
        en: "penalty kick"
        note: "Plural: penales. \"Ir a penales\" = go to a shootout."
