section:
  slug: "futbol"
  title: "Fútbol"
  emoji: "⚽"
  summary: "Not a sport here. A religion with a fixture list."

classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "de-que-cuadro-sos"
    title: "¿De qué cuadro sos?"
    summary: "The five big clubs, the Superclásico and the question you can't dodge"
    pages:
      - type: info
        title: "The question"
        emoji: "🤝"
        body: "Meet someone new in Buenos Aires and within ten minutes you'll hear: **¿De qué cuadro sos?** — *Which team are you?* A **cuadro** is a club. It's not small talk: your club is inherited from your dad, your grandpa, your barrio. People change jobs, partners, even countries. Changing clubs? Never. **Cambiar de cuadro** is basically treason."
        fun_fact: "Plenty of babies are signed up as club members (**socios**) days after being born."

      - type: info
        title: "Los cinco grandes"
        emoji: "🏟️"
        body: "Five clubs are called **los cinco grandes** — *the big five*: **Boca Juniors**, **River Plate**, **Independiente**, **Racing Club** and **San Lorenzo**. They have the most fans and, historically, the most titles. Everyone else is a *chico* (small club) — though say that to a fan of Vélez or Estudiantes and you'll get a long lecture."

      - type: choice
        scenario: "A taxi driver asks: \"¿De qué cuadro sos?\" You don't follow football at all."
        prompt: "What's the smoothest answer?"
        options:
          - "\"Football is boring.\""
          - "\"No sé, ¿vos de cuál sos?\""
          - "\"Boca, obvio.\" and hope for the best"
        correct: 1
        explain: "Turning the question back is gold: he'll happily talk for the whole ride. Faking a team works until he asks for your favorite player, and \"football is boring\" kills the conversation."

      - type: info
        title: "El Superclásico"
        emoji: "🔵"
        body: "**Boca vs River** is the **Superclásico**. A **clásico** is any derby; this one gets the *super*. Boca, in blue and gold, plays at **La Bombonera** (*the chocolate box*), its **cancha** (stadium) in La Boca. River, white with a red sash, plays at **El Monumental** in Núñez. Funny detail: River was also born in La Boca and moved north later. Neighbors first, enemies forever. Golden rule: never wear one team's colors near the other's cancha."
        fun_fact: "They once met in a Copa Libertadores final so heated that the second leg had to be played in Madrid. River won."

      - type: true_false
        statement: "Boca and River were born in different parts of the city."
        answer: false
        explain: "Both started in La Boca. River only moved north to Núñez later, which is why the rivalry feels like a family feud."

      - type: info
        title: "Insults with pride"
        emoji: "🐔"
        body: "Rivals give each other nasty nicknames, and fans end up wearing them proudly. River fans call Boca fans **bosteros** (from **bosta**, *manure* — the story goes it was a dig at the smell by the Riachuelo). Boca fans call River fans **gallinas** (*chickens*, as in cowards), a name that stuck after River blew a big final. San Lorenzo fans are **cuervos** (*crows*), after the priest who founded the club."

      - type: true_false
        statement: "If a River fan calls you a \"bostero\", they think you support Boca."
        answer: true
        explain: "Exactly. And if you *do* support Boca, the correct reply is a proud smile. Being **bostero** is a badge of honor for them."

      - type: info
        title: "Avellaneda: two stadiums, one block"
        emoji: "😈"
        body: "Just south of the city, in **Avellaneda**, live **Racing** (light blue and white) and **Independiente** (red). Their stadiums are only a few hundred meters apart — you can see one from the other. That's the **clásico de Avellaneda**. Independiente fans are the **Diablos Rojos**, *Red Devils*. Imagine sharing a street with the one team you hate most."

      - type: match
        prompt: "Match the club to its shirt"
        pairs:
          - ["Boca", "blue and gold"]
          - ["River", "white with a red sash"]
          - ["Racing", "light blue and white"]
          - ["Independiente", "all red"]
        explain: "Handy on match day: now you know which shirt not to wear in which barrio."

      - type: choice
        scenario: "You're staying in La Boca and a friend lends you a red-and-white River shirt because it's cold. You're about to walk to the kiosk next to the Bombonera on match day."
        prompt: "What do you do?"
        options:
          - "Wear it, it's just a shirt"
          - "Change or cover it up"
          - "Wear it, but say you're a tourist"
        correct: 1
        explain: "Never wear the rival's colors in the wrong barrio, especially on match day. Best case: jokes and dirty looks. Worst case: you really don't want to find out."

      - type: gap
        prompt: "Ask your new friend which team they support"
        text: "¿De qué ___ sos?"
        options: ["cuadro", "cuadra", "cancha"]
        correct: 0
        translation: "Which team are you (a fan of)?"
        explain: "**Cuadro** is the everyday word for club. A **cuadra** is a city block, and the **cancha** is the stadium: useful words, but not here."
    vocabulary:
      - es: "cuadro"
        en: "club, team (colloquial)"
        example: { es: "¿De qué cuadro sos?", en: "Which team do you support?" }
      - es: "los cinco grandes"
        en: "the big five clubs"
        note: "Boca, River, Independiente, Racing, San Lorenzo."
      - es: "clásico"
        en: "any derby between local rivals"
      - es: "Superclásico"
        en: "THE derby: Boca vs River"
      - es: "bostero"
        en: "Boca fan (rivals' insult, worn with pride)"
      - es: "gallina"
        en: "River fan (literally \"chicken\")"
        note: "Don't say it to a River fan unless you're friends."
      - es: "cancha"
        en: "stadium, pitch"
        example: { es: "¿Vamos a la cancha el domingo?", en: "Shall we go to the match on Sunday?" }
    glossary:
      - es: "socios"
        en: "members (of a club)"
      - es: "bosta"
        en: "manure, dung"
      - es: "cuervos"
        en: "crows (San Lorenzo fans)"
      - es: "Diablos Rojos"
        en: "Red Devils (Independiente)"
      - es: "cuadra"
        en: "city block"

  # ─────────────────────────────────────────────────────────────
  - slug: "la-hinchada"
    title: "La hinchada"
    summary: "Chants, drums, the mysterious thing called aguante, and how to actually get in"
    pages:
      - type: info
        title: "Hincha, not fan"
        word: { es: "hincha", tag: "Not \"fan\"", en: "fan, supporter" }
        emoji: "📣"
        body: "A fan is a **hincha**, and all the fans together are **la hinchada**. The story goes that the word comes from a man in Montevideo who inflated (**hinchar**) the balls and shouted so hard he became famous. Whatever the origin: a hincha doesn't *watch* a match. A hincha *plays* it from the stands."
        fun_fact: "**Hinchar** also means to annoy. \"No me hinchés\" = \"Stop bugging me.\""

      - type: info
        title: "Cantitos and the bombo"
        emoji: "🥁"
        body: "The stands never go quiet. The hinchada sings **cantitos** (chants) for the whole match, often to the tune of old rock or cumbia songs, mixing love for the club with creative insults for the rival. The **bombo**, a big bass drum, keeps the beat, and **trapos** (banners) hang everywhere. The heart of it all is the **popular**: the cheap standing terraces."

      - type: true_false
        statement: "In the popular, most people watch the match from their seats."
        answer: false
        explain: "Seats? In the **popular** people stand, jump, sing and push for the whole match. Clapping politely is for tennis."

      - type: info
        title: "El aguante"
        emoji: "💪"
        body: "**Aguante** comes from **aguantar**, *to endure*. For a hincha it means loyalty that survives everything: rain, losses, even relegation. \"**¡Aguante Racing!**\" is roughly *Come on, Racing!* You also hear it outside football: \"**¡Aguante el asado!**\" The team can be losing 3–0 and the hinchada still sings — that's aguante."

      - type: gap
        prompt: "Cheer for your team, rioplatense style"
        text: "¡___ Boca!"
        options: ["Aguante", "Basta", "Cuidado"]
        correct: 0
        translation: "Come on, Boca! (lit. \"endurance, Boca!\")"
        explain: "**¡Aguante…!** + anything you love. *¡Basta, Boca!* means \"enough, Boca!\", and *¡Cuidado, Boca!* is a warning."

      - type: info
        title: "So you want to go to a match"
        emoji: "🎫"
        body: "Here's the catch: at the big clubs, most tickets go to **socios** (paying club members), and they sell out fast. Most visitors go with an official tour package: ticket, transport and a guide who knows which gate is yours. Skip the guys selling tickets outside the stadium, since fakes are common. And leave anything in rival colors at the hotel."

      - type: choice
        scenario: "You want to see Boca at La Bombonera, but the club's website says tickets are for socios only."
        prompt: "What's your best bet?"
        options:
          - "Buy from a guy outside the stadium"
          - "Book an official tour package"
          - "Show up and ask at the gate"
        correct: 1
        explain: "It costs more, but you get a real ticket and someone who knows the way in. Street tickets are often fake, and the gate won't sell you one."

      - type: info
        title: "The dark side: barras bravas"
        emoji: "⚠️"
        body: "Every big club has a **barra brava** (or just **la barra**): the organized hardcore group that leads the chants and carries the drums. Many are also tangled up in violence and shady business — ticket resale, parking, politics. After years of deaths, visiting fans were banned. Talk of bringing them back comes up again and again, but at most league games you'll still see only one hinchada."

      - type: choice
        scenario: "At the stadium, a guy from the barra walks past and tells your section to stand up and sing."
        prompt: "What's the smart move?"
        options:
          - "Explain that you paid for your seat"
          - "Stand up and at least pretend to sing"
          - "Tell him to sit down himself"
        correct: 1
        explain: "You're a guest in their church. Stand, clap, hum along. Arguing with the barra, or telling them off, is never a good plan."

      - type: match
        prompt: "Match the word to the thing"
        pairs:
          - ["bombo", "bass drum"]
          - ["trapo", "banner"]
          - ["cantito", "chant"]
          - ["popular", "standing terrace"]
        explain: "**Trapo** literally means *rag*. For the barras, losing your trapo to a rival is the ultimate humiliation."

      - type: true_false
        statement: "When a team gets relegated, its hinchada usually keeps filling the stadium in the lower division."
        answer: true
        explain: "That's aguante: the bad times are exactly when it counts. Relegated big clubs often sell out their stadiums a division below."
    vocabulary:
      - es: "hincha"
        en: "fan, supporter"
      - es: "hinchada"
        en: "a club's whole crowd in the stands"
      - es: "cantito"
        en: "stadium chant"
      - es: "bombo"
        en: "bass drum"
      - es: "aguante"
        en: "loyal support, endurance"
        example: { es: "¡Aguante Independiente!", en: "Come on Independiente!" }
      - es: "barra brava"
        en: "hardcore organized fan group"
        note: "Often just \"la barra\"."
      - es: "trapo"
        en: "banner (literally \"rag\")"
      - es: "hinchar"
        en: "to annoy, to bug"
        example: { es: "No me hinchés.", en: "Stop bugging me." }
    glossary:
      - es: "popular"
        en: "standing terraces, cheap stand"
      - es: "aguantar"
        en: "to endure, put up with"
      - es: "la barra"
        en: "the organized hardcore fan group"
      - es: "socios"
        en: "paying club members"

  # ─────────────────────────────────────────────────────────────
  - slug: "hablar-de-futbol"
    title: "Talk like a hincha"
    summary: "Golazos, gambetas, caños and the Sunday picado"
    pages:
      - type: info
        title: "Potrero and picado"
        word: { es: "potrero", tag: "Where it starts", en: "dirt lot for pickup games" }
        emoji: "🌱"
        body: "Argentines say their football was born in the **potrero** — a dirt lot where kids play with a ball, a couple of stones as goalposts and zero rules. A casual game with friends is a **picado**. \"¿Armamos un picado?\" = *Shall we get a game together?* Today it's usually **fútbol 5** on synthetic grass, then beers."
        fun_fact: "Calling a player \"**de potrero**\" is a big compliment: street-smart, creative, fearless."

      - type: info
        title: "Gambeta and caño"
        emoji: "🪄"
        body: "A **gambeta** is a dribble, the twisty, dancing kind Maradona and Messi made famous. A **caño** is a nutmeg: the ball between the defender's legs. Getting a caño in a picado means your friends will remind you for weeks. And a **golazo** is a stunning goal. The **-azo** ending makes anything bigger: **golazo**, **partidazo**."

      - type: match
        prompt: "Match the word to its meaning"
        pairs:
          - ["gambeta", "dribble"]
          - ["caño", "nutmeg"]
          - ["golazo", "amazing goal"]
          - ["picado", "casual pickup game"]
          - ["potrero", "dirt lot where kids play"]

      - type: choice
        scenario: "In a picado, you slip the ball between the legs of your friend Nacho and run past him. Everyone screams."
        prompt: "What did you just do?"
        options: ["Un caño", "Un golazo", "Un picado"]
        correct: 0
        explain: "**¡Caño!** No goal yet, and the picado is the whole game. Nacho will now be teased until the next one. Maybe longer."

      - type: info
        title: "El DT and the hachero"
        emoji: "📋"
        body: "The coach is **el DT** (*de-té*), short for **director técnico**. Every Argentine is secretly a DT: they all know who should play. Lionel Scaloni, the DT who won in Qatar, even gave the team its nickname: **la Scaloneta**. And the defender who kicks everything in sight, ball or ankles? A **hachero**, an *axe man*."

      - type: true_false
        statement: "In Argentina, \"el DT\" is the team's doctor."
        answer: false
        explain: "**DT** = **director técnico**, the coach. The doctor is just *el médico*, and nobody at the bar has opinions about him."

      - type: info
        title: "Hacer la previa"
        emoji: "🍻"
        body: "Before any big match you **hacer la previa**: meet up earlier to eat, drink, sing and get in the mood. The previa can last longer than the match itself. After the game, there's analysis at the bar until late. And on Monday comes the **gastada**: the teasing from rival fans if you lost. You take it, and you pay it back when you win. Watching football alone? Suspicious behavior."

      - type: gap
        prompt: "Invite your friends to meet up before the Superclásico"
        text: "¿Hacemos la ___ en casa?"
        options: ["previa", "gastada", "cancha"]
        correct: 0
        translation: "Shall we do the pre-match hangout at my place?"
        explain: "The **previa** is the before. The **gastada** is Monday's teasing, and the **cancha** is where the match is played."

      - type: true_false
        statement: "Calling a player \"de potrero\" is a dig: it means he never learned to play properly."
        answer: false
        explain: "It's a big compliment: street-smart, creative, fearless. For Argentines, the potrero is where the best ones learned."

      - type: choice
        scenario: "Your team lost 4–0. Your Argentine friend's phone keeps buzzing with memes from rival fans."
        prompt: "What's the local tradition here?"
        options:
          - "Mute the group and hide for a week"
          - "Take it, and pay it back when you win"
          - "Tell them it's only a game, relax"
        correct: 1
        explain: "The **gastada** is part of the deal. You take it, you keep a list, and you pay it back with interest. \"It's only a game\" is the one answer nobody here accepts."
    vocabulary:
      - es: "golazo"
        en: "amazing goal"
      - es: "gambeta"
        en: "dribble"
      - es: "caño"
        en: "nutmeg (ball between the legs)"
      - es: "picado"
        en: "casual pickup game"
        example: { es: "¿Armamos un picado?", en: "Shall we get a game together?" }
      - es: "potrero"
        en: "dirt lot where kids play football"
      - es: "DT"
        en: "coach (director técnico)"
      - es: "hacer la previa"
        en: "to hang out before an event"
        example: { es: "Hacemos la previa en lo de Juan.", en: "We're meeting at Juan's place first." }
      - es: "gastada"
        en: "teasing (after a loss)"
    glossary:
      - es: "fútbol 5"
        en: "five-a-side football"
      - es: "-azo"
        en: "augmentative suffix (big, great)"
      - es: "partidazo"
        en: "great match"
      - es: "el DT"
        en: "the coach"
      - es: "director técnico"
        en: "head coach"
      - es: "hachero"
        en: "brutal defender, \"axe man\""
      - es: "la Scaloneta"
        en: "the national team, after coach Scaloni"

  # ─────────────────────────────────────────────────────────────
  - slug: "la-tabla-y-el-descenso"
    title: "The table, the drop and the VAR"
    summary: "Promedios, irse a la B and everything you'll hear on TV"
    pages:
      - type: info
        title: "Fixture, fecha, tabla"
        emoji: "📺"
        body: "The season calendar is the **fixture** (say *fíxtur*), and each round is a **fecha**. After every fecha people check the **tabla** (league table): three points for a win, one for an **empate** (draw). A 5–0 is a **goleada** (thrashing). On Monday, the office talks about nothing else."

      - type: info
        title: "The nightmare: el descenso"
        word: { es: "descenso", tag: "The nightmare", en: "relegation" }
        emoji: "⬇️"
        body: "The worst thing that can happen to a club is the **descenso** (relegation), or **irse a la B**, going down to the B. The dream of the smaller clubs is the **ascenso** (promotion). Even giants fall: four of the big five have gone down, River most painfully, in 2011. **Boca** never has, and Boca fans never let anyone forget it."

      - type: true_false
        statement: "Of the big five, Boca is the only club that has never gone down."
        answer: true
        explain: "San Lorenzo, Racing, River and Independiente all went down at some point. It's Boca's favorite chant against every one of them."

      - type: info
        title: "Promedios"
        emoji: "🧮"
        body: "Here's a very Argentine twist: relegation isn't only about this season. Part of it depends on the **promedio**, your points per match averaged over the last three seasons. One great year can't save a struggling club, and one bad year rarely sinks a big one. Critics have long said that's exactly the point: to protect the big clubs. The rules change often; the promedios keep coming back."

      - type: choice
        scenario: "Your team is fifth this season, but your friend is still nervous about \"los promedios\"."
        prompt: "Why?"
        options: ["Bad past seasons still count", "Promedio means goal difference", "The VAR can take points away"]
        correct: 0
        explain: "Promedios drag the past along with you. A club that just came up is especially at risk: it has only a few matches to average, so every loss hurts."

      - type: info
        title: "¿Fue penal?"
        emoji: "🖥️"
        body: "Every tight call now goes to **el VAR** (say *el var*), and the debate lasts days: **¿fue penal?** (was it a penalty?), **¿estaba en offside?** Old-timers still say **orsai**, the way their grandparents pronounced offside. Some say the VAR killed the goal scream, since you wait before celebrating. Others say the ref was robbing us anyway, so at least now it's on camera."

      - type: match
        prompt: "Match the TV word to its meaning"
        pairs:
          - ["descenso", "relegation"]
          - ["ascenso", "promotion"]
          - ["empate", "draw"]
          - ["goleada", "thrashing, big win"]
          - ["fecha", "round of matches"]

      - type: gap
        prompt: "Your friend is worried before the last match of the season."
        text: "Si perdemos, nos vamos a la ___."
        options: ["B", "A", "tabla"]
        correct: 0
        translation: "If we lose, we go down."
        explain: "**Irse a la B** = get relegated. Said with real fear, even when the second division isn't literally called 'B' anymore. *La A* would be going up."

      - type: true_false
        statement: "If an old-timer yells \"¡orsai!\" at the TV, he wants a penalty."
        answer: false
        explain: "**Orsai** is offside, said the way his grandparents said it. For a penalty he'd yell **¡penal!**, and then argue about it until Thursday."

    vocabulary:
      - es: "fecha"
        en: "round of matches"
        example: { es: "¿Contra quién jugamos en la próxima fecha?", en: "Who do we play in the next round?" }
      - es: "tabla"
        en: "league table"
      - es: "empate"
        en: "draw, tie"
      - es: "goleada"
        en: "thrashing, big win"
      - es: "irse a la B"
        en: "to go down to the second division (lit. \"go to the B\")"
        example: { es: "Si perdemos, nos vamos a la B.", en: "If we lose, we go down." }
      - es: "promedio"
        en: "3-season points average"
      - es: "¿fue penal?"
        en: "was it a penalty?"
      - es: "orsai"
        en: "offside"
        note: "Old-fashioned; today most people say offside."
    glossary:
      - es: "descenso"
        en: "relegation"
      - es: "fixture"
        en: "season calendar of matches"
      - es: "ascenso"
        en: "promotion to a higher league"
      - es: "el VAR"
        en: "video assistant referee"
      - es: "¿estaba en offside?"
        en: "was he offside?"

  # ─────────────────────────────────────────────────────────────
  - slug: "el-diez"
    title: "Diego, 1986 and the pioneers"
    summary: "A World Cup with a shadow, the Hand of God, and the women who beat England first"
    pages:
      - type: info
        title: "La Selección"
        emoji: "🇦🇷"
        body: "When Argentina plays, the whole country stops. The national team is **la Selección**, or **la Albiceleste** (*the white and sky-blue*). Club rivalries freeze for ninety minutes: a Boca fan and a River fan hug when Argentina scores. The team has won three **Mundiales** (World Cups): **1978**, **1986** and **2022**."

      - type: info
        title: "1978: a cup with a shadow"
        emoji: "🏆"
        body: "Argentina hosted and won the **1978** Mundial. But the country was under a military dictatorship that used the cup as propaganda while people were disappearing. The players are respected; the cup itself still makes many Argentines uneasy, and some results remain under suspicion that was never proven. If it comes up, listen more than you talk."

      - type: true_false
        statement: "Most Argentines remember the 1978 win as a purely happy moment."
        answer: false
        explain: "The dictatorship makes 1978 a sore, debated topic. Plenty of people feel torn about celebrating it. Tread gently."

      - type: info
        title: "Diego"
        emoji: "🔟"
        body: "**Diego Armando Maradona** grew up poor in Villa Fiorito and became the greatest idol the country has ever had. He wore the **10**, so he's **el Diez**, or simply **el Diego**. You'll see his face on murals all over the city. Some fans even joke about the *Iglesia Maradoniana*, a fan \"church\" with its own Christmas on his birthday."

      - type: info
        title: "Mexico 1986 vs England"
        emoji: "✋"
        body: "Mexico, **1986**: a quarter-final against England, four years after the **Malvinas** (Falklands) war. Diego punches the ball in and the goal stands: **la Mano de Dios**, *the Hand of God*. Many call it **viveza criolla**, street-smart cunning. Minutes later he dribbles past half the English team: **el Gol del Siglo**, *the Goal of the Century*. Argentina then beat West Germany in the final."
        fun_fact: "Radio commentator Víctor Hugo Morales screamed \"¡Barrilete cósmico!\" — *cosmic kite* — and it became legend."

      - type: choice
        scenario: "An English friend at an asado says: \"Maradona cheated, that's it.\" Everyone goes quiet."
        prompt: "How do most Argentines see the Mano de Dios?"
        options:
          - "A shameful moment they'd rather forget"
          - "Viveza criolla, with a bit of revenge"
          - "A clean goal the referee got right"
        correct: 1
        explain: "For many it's cheeky cunning and a symbolic revenge after Malvinas. Plenty of people also admit it was a handball. Expect a passionate debate, not agreement."

      - type: gap
        prompt: "What's the famous handball called?"
        text: "La ___ de Dios"
        options: ["Mano", "Pie", "Cabeza"]
        correct: 0
        translation: "The Hand of God"
        explain: "**Mano** = hand. It's feminine even though it ends in -o: *la mano*. A foot (*pie*) or a head (*cabeza*) would have been legal."

      - type: true_false
        statement: "Argentina won the 1986 Mundial by beating West Germany in the final."
        answer: true
        explain: "3–2 at the Azteca. Jorge Burruchaga scored the winner, after a pass from — who else — Diego."

      - type: info
        title: "Same stadium, fifteen years earlier"
        emoji: "⚽"
        body: "Diego wasn't the first Argentine to shine against England at Mexico City's **Estadio Azteca**. In 1971, at an unofficial women's World Cup, Argentina's women beat England there, and **Elba Selva** scored all four goals. That match day, 21 August, is now the **Día de la Futbolista**, the Day of the Woman Footballer."

      - type: true_false
        statement: "At that 1971 match in Mexico, England's women beat Argentina."
        answer: false
