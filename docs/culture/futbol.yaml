section:
  slug: "futbol"
  title: "Fútbol"
  emoji: "⚽"
  summary: "Not a sport here. A religion with a fixture list."

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "de-que-cuadro-sos"
    title: "¿De qué cuadro sos?"
    summary: "The question you can't dodge, and the rivalries behind it"
    pages:
      - type: card
        text: "Meet someone in Argentina and within ten minutes you'll hear it: **¿De qué cuadro sos?** Which team are you? Here a club is a **cuadro**."
      - type: card
        text: "Five clubs are **los cinco grandes**: Boca, River, Independiente, Racing and San Lorenzo. Everyone else is a “small” club. Just don't say that to their fans."
      - type: card
        text: "The biggest match of all is **Boca vs River**: the **Superclásico**. Two clubs that hate each other more than anything."
      - type: choice
        prompt: "So where was River born?"
        options:
          - "In La Boca, right next to Boca"
          - "In Núñez, where it plays today"
          - "In England, founded by sailors"
        correct: 0
        explain: "Both clubs started in La Boca. River moved north later. Neighbors first, enemies forever."
      - type: card
        text: "In 2018 they met in the Copa Libertadores final. Boca's bus was attacked on the way to the second leg, so the final was moved to **Madrid**. River won."
      - type: choice
        prompt: "Racing and Independiente are fierce rivals. How far apart are their stadiums?"
        options:
          - "About three blocks"
          - "Across the city, 30 km"
          - "In different provinces"
        correct: 0
        explain: "You can see one stadium from the other. That's the **clásico de Avellaneda**: sharing a street with the team you hate most."
      - type: card
        text: "Golden rule: never wear one club's colors near the other's stadium. Especially on match day."
      - type: card
        chip: "Pro tip"
        text: "No team? Don't fake one. Say **“No sé, ¿vos de cuál sos?”** and enjoy the next half hour of stories."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-hinchada"
    title: "La hinchada"
    summary: "Jumping stadiums, rock-song chants, cábalas and mufas"
    pages:
      - type: card
        text: "A fan is a **hincha**. The whole crowd is **la hinchada**. They don't watch the match. They play it from the stands."
      - type: card
        text: "You don't pick a club. **You're born into it.** Lots of babies are signed up as club members before they can walk."
      - type: choice
        prompt: "Boca fans say their stadium, La Bombonera, “doesn't shake, it beats”, like a heart. Why?"
        options:
          - "The whole crowd jumps at the same time"
          - "It was built over an old stream"
          - "The club plays drums through the speakers"
        correct: 0
        explain: "When the whole stadium jumps together, the stands really move. **“La Bombonera no tiembla, late.”**"
      - type: card
        text: "The singing never stops, and lots of the songs are old rock hits with new words. **“Brasil, decime qué se siente”** is sung to *Bad Moon Rising*."
      - type: card
        text: "Every rival gets a nickname. River fans call Boca fans **bosteros** (bosta = dung). Boca fans call River fans **gallinas**: chickens."
      - type: choice
        prompt: "Why are River fans called “gallinas”?"
        options:
          - "River blew a 2–0 lead in a big final"
          - "Their first stadium was a chicken farm"
          - "Their old jersey had feathers on it"
        correct: 0
        explain: "In the 1966 Copa Libertadores final, River were winning 2–0 and lost 4–2. At the next match, rival fans threw a chicken onto the pitch. The name stuck."
      - type: card
        text: "Hinchas are superstitious. Same seat, same socks, the shirt you never wash: that's a **cábala**. And if your team loses every time you show up, you're **mufa**: bad luck."
      - type: choice
        prompt: "Your friend's team lost the last 3 matches you watched together. Tonight is the big one. What happens?"
        options:
          - "He saves you the best spot on the couch"
          - "He asks you to watch it at your place"
          - "He lends you his lucky shirt"
        correct: 1
        explain: "Nothing personal: you're **mufa**. Maybe you can come back next season."
      - type: card
        chip: "Did you know?"
        text: "When River got relegated in 2011, their stadium stayed full in the second division. Loyalty like that has a name: **aguante**."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "hablar-de-futbol"
    title: "Talk like a hincha"
    summary: "The potrero, the weekly picado, the previa and Monday's gastada"
    pages:
      - type: card
        text: "Argentines say their football was born in the **potrero**: a dirt lot, two stones for goals, no rules. Calling a player **“de potrero”** is a big compliment."
      - type: card
        text: "Today the potrero is **fútbol 5**. Plenty of adults play a **picado** every week, with the same friends for years. Then beers."
      - type: choice
        prompt: "In a picado, you play the ball past your friend Nacho and everyone screams **“¡Caño!”**. What did you just do?"
        options:
          - "Put the ball between his legs"
          - "Hit the post"
          - "Kicked him instead of the ball"
        correct: 0
        explain: "A **caño** is a nutmeg. No goal needed: Nacho will hear about it for weeks."
      - type: card
        text: "The coach is **el DT**, the director técnico. And every Argentine is secretly a DT: they all know who should have played."
      - type: card
        text: "Before a big match you **hacer la previa**: meet early to eat, drink and sing. The previa often lasts longer than the match."
      - type: choice
        prompt: "It's Monday. Your team lost 4–0 yesterday. What's waiting for you at the office?"
        options:
          - "Nobody mentions it, out of respect"
          - "Memes, jokes, and a rival's shirt on your chair"
          - "A calm chat about tactics"
        correct: 1
        explain: "Welcome to the **gastada**."
      - type: card
        text: "The **gastada** is the teasing after a loss. You take it, you save the memes, and you pay it back when you win. “It's only a game” is not an accepted answer."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-tabla-y-el-descenso"
    title: "The table, the drop and the VAR"
    summary: "Irse a la B, the promedios and endless penalty debates"
    pages:
      - type: card
        text: "Every club's nightmare is the **descenso**: relegation. Argentines call it **irse a la B**, going down to the B. Even giants fall."
      - type: choice
        prompt: "Four of the big five clubs have been relegated. Which one never has?"
        options:
          - "Boca"
          - "River"
          - "Racing"
        correct: 0
        explain: "Boca has never gone down. Their fans never let anyone forget it."
      - type: card
        text: "River's drop in 2011 was probably the biggest shock in Argentine football history. More than ten years later, Boca fans still sing about it."
      - type: choice
        prompt: "Your team finished fifth this season, but your friend is still scared of going down. How is that possible?"
        options:
          - "Bad seasons from years ago still count"
          - "The top five teams swap leagues"
          - "The VAR can take points away"
        correct: 0
        explain: "Relegation often uses the **promedio**, explained next."
      - type: card
        text: "The **promedio** is your points per match over the last three seasons. One great year can't save a small club, and one bad year rarely sinks a big one. Critics say that's the point."
      - type: card
        text: "Every close call goes to **el VAR**, and the debate lasts until Thursday: **¿fue penal?** Was it a penalty? Old-timers still yell **orsai**: offside, the way their grandparents said it."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "el-diez"
    title: "Diego, 1986 and the pioneers"
    summary: "A World Cup with a shadow, a church for Diego, and the women who beat England first"
    pages:
      - type: card
        text: "When **la Selección** plays, the country stops. Boca and River fans hug when Argentina scores. Three World Cups so far: 1978, 1986 and 2022."
      - type: card
        text: "1978 was won at home, under a military dictatorship that used the cup as propaganda. Many Argentines still feel uneasy celebrating it. If it comes up, listen more than you talk."
      - type: card
        text: "**Diego Maradona** grew up poor in Villa Fiorito and became the country's biggest idol. His face is painted on walls all over Buenos Aires."
      - type: choice
        prompt: "Some fans founded a “church” for Maradona. When do they celebrate Christmas?"
        options:
          - "October 30, Diego's birthday"
          - "December 25, like everyone else"
          - "June 22, the day he beat England"
        correct: 0
        explain: "The **Iglesia Maradoniana** counts its years from his birth, in 1960. Half joke, half not."
      - type: card
        text: "Mexico 1986, against England, four years after the **Malvinas** war. Diego scores with his hand, **la Mano de Dios**, then dribbles past half their team for the Goal of the Century."
      - type: choice
        prompt: "Diego wasn't the first Argentine to beat England at that same stadium. Who was?"
        options:
          - "Argentina's women's team"
          - "An Argentine boxer"
          - "A Boca youth team"
        correct: 0
        explain: "In 1971, at an unofficial women's World Cup, Argentina's women beat England 4–1 at the Azteca."
      - type: card
        text: "**Elba Selva** scored all four goals that day. August 21 is now the **Día de la Futbolista**, the Day of the Woman Footballer."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "messi-y-qatar"
    title: "Messi and Qatar"
    summary: "Heartbreak in Brazil, glory in Qatar"
    pages:
      - type: card
        text: "**Messi** grew up in Rosario and left for Barcelona at 13. For years, some Argentines grumbled that he only shone for Barça."
      - type: choice
        prompt: "Why did Messi move to Barcelona as a kid?"
        options:
          - "Barça paid for his growth treatment"
          - "His dad got a job in Spain"
          - "He won a TV talent contest"
        correct: 0
        explain: "He needed growth-hormone treatment his family couldn't afford. Barcelona paid for it."
      - type: card
        text: "2014 World Cup final, in Brazil: Germany scores in extra time. Messi walks past the trophy he couldn't touch. That photo still hurts."
      - type: card
        text: "After more lost finals, Messi quit the national team in 2016. Half the country begged him to come back. He did."
      - type: card
        text: "Qatar 2022, the final against France: 2–0, 2–2, 3–2, 3–3. Then penalties. **Dibu Martínez** saves one, **Montiel** scores the last. Messi finally lifts the cup."
      - type: choice
        prompt: "How many people filled Buenos Aires to welcome the team home?"
        options:
          - "Around 5 million"
          - "Around 50,000"
          - "Around 500,000"
        correct: 0
        explain: "Millions. The team bus couldn't get through, and the players finished the parade by helicopter."
      - type: card
        text: "The soundtrack of Qatar: **“Muchachos, ahora nos volvimos a ilusionar”**, a fan chant sung to a song by La Mosca. Start it at any party and the whole room joins in."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "mas-alla-de-buenos-aires"
    title: "Beyond Buenos Aires"
    summary: "Rosario, Córdoba and La Plata, where the local derby beats Boca-River"
    pages:
      - type: card
        text: "Outside the capital, the local **clásico** beats Boca–River. Ask someone from Rosario about Boca and River: a shrug. Ask about Newell's and Central: cancel your plans."
      - type: choice
        prompt: "Newell's fans are proudly called **leprosos**, lepers. Where does that come from?"
        options:
          - "They agreed to a charity match for leprosy patients"
          - "Their first stadium was an old hospital"
          - "Their founder was a doctor"
        correct: 0
        explain: "The story goes: around 1920, both Rosario clubs were invited to play a charity match for leprosy patients. Newell's said yes."
      - type: card
        text: "Legend says Rosario Central turned that match down, so they became the **canallas**: the scoundrels. Nobody can prove it, and both clubs wear the insults with pride."
      - type: card
        text: "Even the Selección splits: **Messi** grew up a Newell's kid, **Di María** is pure Central."
      - type: card
        text: "In La Plata it's **Estudiantes** against **Gimnasia**. Estudiantes fans are **pinchas**, Gimnasia fans are **triperos**. In Córdoba, it's **Belgrano** against **Talleres**."
      - type: choice
        prompt: "Gimnasia fans are called **triperos**, tripe people. Why?"
        options:
          - "Many early fans worked in meatpacking plants"
          - "They grill tripe outside every match"
          - "Their old shirt looked like tripe"
        correct: 0
        explain: "The meatpacking plants near La Plata employed thousands. Their workers followed Gimnasia."
    vocabulary: []
