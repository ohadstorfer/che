        en: "the national team"

  # ─────────────────────────────────────────────────────────────
  - slug: "mas-alla-de-buenos-aires"
    title: "Beyond Buenos Aires"
    summary: "Rosario, Córdoba and La Plata, where the local derby beats Boca-River"
    pages:
      - type: info
        title: "Not everything is Boca-River"
        emoji: "🧭"
        body: "Porteños forget it, but some of the fiercest rivalries are outside the capital. Argentines call the rest of the country **el interior**, and in cities like **Rosario**, **Córdoba** and **La Plata** the local **clásico** (derby) matters far more than the Superclásico. Ask a **rosarino** (someone from Rosario) about Boca and River and you'll get a shrug. Ask about Newell's and Central and cancel your plans."

      - type: info
        title: "Rosario: leprosos vs canallas"
        emoji: "🔴"
        body: "It's **Rosario Central** against **Newell's Old Boys**. The story goes that both were invited to a charity match for a leprosy clinic. Newell's said yes and became the **leprosos** (lepers); Central said no and became the **canallas** (scoundrels). Both wear the insults with pride. Even the national team splits: Messi grew up a Newell's kid, while Di María is pure Central."

      - type: true_false
        statement: "Messi and Di María are both from Rosario, but from rival clubs."
        answer: true
        explain: "Same city, opposite sides: Messi played in **Newell's** youth teams, Di María came up at **Central** and went back to play there. Rosario family dinners have survived worse."

      - type: choice
        scenario: "Your first night in Rosario. A new friend pours you a beer and asks: \"¿Sos leproso o canalla?\""
        prompt: "What are they asking?"
        options: ["Newell's or Central?", "Are you sick or rude?", "Rosario or Buenos Aires?"]
        correct: 0
        explain: "It's the Rosario version of **¿de qué cuadro sos?** If you don't have a team, say so with a smile. Picking one at random can cost you friends."

      - type: info
        title: "Córdoba and La Plata"
        emoji: "🏴‍☠️"
        body: "In **Córdoba**, the big one is **Belgrano** against **Talleres**, and Belgrano fans are the **piratas** (pirates). In **La Plata**, it's **Estudiantes** against **Gimnasia**: Estudiantes fans are **pinchas**, Gimnasia fans are **triperos**. Same rule everywhere: the local derby comes first, and Boca-River is something they watch on TV."

      - type: choice
        scenario: "A taxi driver proudly tells you he's a **pincha** and that the triperos had a terrible season."
        prompt: "Which city are you most likely in?"
        options: ["La Plata", "Rosario", "Córdoba"]
        correct: 0
        explain: "Pinchas (Estudiantes) and triperos (Gimnasia) are La Plata's two tribes. In Rosario it'd be leprosos and canallas; in Córdoba, piratas and Talleres."

      - type: true_false
        statement: "Most rosarinos care more about Boca-River than about their own clásico."
        answer: false
        explain: "Newell's-Central is the one that stops the city. Boca-River gets a shrug, at most."
    vocabulary:
      - es: "leproso"
        en: "Newell's fan (literally 'leper')"
      - es: "canalla"
        en: "Central fan (literally 'scoundrel')"
      - es: "rosarino"
        en: "from Rosario"
      - es: "pincha"
        en: "Estudiantes fan (La Plata)"
      - es: "tripero"
        en: "Gimnasia fan (La Plata)"
    glossary:
      - es: "el interior"
        en: "the rest of the country (outside Buenos Aires)"
      - es: "clásico"
        en: "derby, rivalry match"
      - es: "piratas"
        en: "Pirates (Belgrano fans)"
      - es: "¿de qué cuadro sos?"
        en: "which team are you (a fan of)?"
