section:
  slug: "regiones"
  title: "Las provincias"
  emoji: "🗺️"
  summary: "Argentina beyond Buenos Aires, from the salt flats to the end of the world"

classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-interior"
    title: "Buenos Aires is not Argentina"
    summary: "A huge country, 24 districts and one big word: el interior"
    pages:
      - type: info
        title: "Bigger than you think"
        emoji: "📏"
        body: "Argentina is huge: roughly five times France. From **La Quiaca**, on the Bolivian border, to **Ushuaia**, at the bottom of the map, you get high deserts, jungle, vineyards, the pampa and glaciers. The legendary **ruta 40** (Route 40) runs along the Andes almost the whole way. Pack a jacket *and* sunscreen, and never plan to \"pop over\" anywhere."

      - type: info
        title: "23 plus one"
        emoji: "🧩"
        body: "The country has **23 provincias** plus the **Ciudad Autónoma de Buenos Aires** (**CABA**), the capital, which is *not* a province. The confusing part: there's also a **provincia de Buenos Aires**, the biggest one, wrapped around the city. And its capital isn't Buenos Aires at all, it's **La Plata**, about an hour south."

      - type: true_false
        statement: "The city of Buenos Aires is the capital of the province of Buenos Aires."
        answer: false
        explain: "The city is its own district, CABA. The province's capital is **La Plata**. Plenty of Argentines mix this up too, don't worry."

      - type: info
        title: "El interior"
        emoji: "🧭"
        body: "In Buenos Aires, anything outside the city and its suburbs is **el interior**. The metro area holds about a third of all Argentines, so the capital tends to think it *is* the country. Someone from the provinces is a **provinciano**, and for many of them the big city is just **Capital**. They have opinions about it. Many who move there **extrañan** (miss) home forever."

      - type: choice
        scenario: "You meet a girl in Palermo. She tells you she's from Salta and just moved to Buenos Aires for university."
        prompt: "Which reply goes down best?"
        options: ["\"Oh, so you're porteña now!\"", "\"¿Y qué extrañás de Salta?\"", "\"Is Salta near Buenos Aires?\""]
        correct: 1
        explain: "Asking what she misses gets you twenty minutes about empanadas, family and the mountains. Calling her porteña is a quick way to get corrected: provincial identity runs deep."

      - type: info
        title: "The map in five pieces"
        emoji: "🗺️"
        body: "Argentines split the country into regions. The **Noroeste** (Salta, Jujuy): the Andes and salt flats. The **Litoral** (Misiones, Corrientes, Santa Fe): huge rivers and Iguazú. **Cuyo** (Mendoza): wine. The **Centro** (Buenos Aires, Córdoba): the flat pampa. And **Patagonia**, down south: lakes and glaciers. Each has its own accent, its own food and its own jokes about the others."
        fun_fact: "What you call people changes with every province: a **salteño**, a **mendocino**, a **cordobés**, a **tucumano**. There's no single rule; you just learn them."

      - type: match
        prompt: "You want to see this. Which region do you head for?"
        pairs:
          - ["Salt flats and Andean villages", "the Noroeste"]
          - ["Vineyards and wine", "Cuyo"]
          - ["Big rivers and waterfalls", "the Litoral"]
          - ["Glaciers and lakes", "Patagonia"]

      - type: match
        prompt: "Match the place to what you call someone from there"
        pairs:
          - ["Salta", "salteño"]
          - ["Mendoza", "mendocino"]
          - ["Córdoba", "cordobés"]
          - ["Tucumán", "tucumano"]
        explain: "-eño, -ino, -és, -ano: you just learn them. Getting it right earns you instant points."

      - type: gap
        prompt: "A friend in Buenos Aires tells you his sister left the city for good."
        text: "Mi hermana se fue a vivir al ___."
        options: ["interior", "exterior", "centro"]
        correct: 0
        translation: "My sister moved out to the provinces."
        explain: "**Al interior** means anywhere in the provinces. **Al exterior** would mean abroad, and **al centro** is just downtown."

    vocabulary:
      - es: "provincia"
        en: "province"
        example: { es: "¿De qué provincia sos?", en: "What province are you from?" }
      - es: "el interior"
        en: "everywhere outside BA, as the capital sees it"
        note: "Said mostly from Buenos Aires. Some provincianos find it a bit porteño-centric."
      - es: "provinciano"
        en: "someone from the provinces"
      - es: "salteño"
        en: "someone from Salta"
      - es: "extrañar"
        en: "to miss (someone or something)"
        example: { es: "Extraño mucho a mi vieja.", en: "I really miss my mum." }
      - es: "ruta"
        en: "highway, road"
        example: { es: "Nos vamos por la ruta 40.", en: "We're taking Route 40." }
    glossary:
      - es: "Noroeste"
        en: "northwest"
      - es: "Litoral"
        en: "coast (the river region)"
      - es: "Centro"
        en: "center (the central region)"
      - es: "Ciudad Autónoma de Buenos Aires"
        en: "Autonomous City of Buenos Aires"
      - es: "Capital"
        en: "the city of Buenos Aires, as the provinces call it"
      - es: "mendocino"
        en: "someone from Mendoza"
      - es: "cordobés"
        en: "someone from Córdoba"

  # ─────────────────────────────────────────────────────────────
  - slug: "noroeste"
    title: "The Noroeste: Andes, coca and Pachamama"
    summary: "Salta, Jujuy and the most Andean corner of the country"
    pages:
      - type: info
        title: "Another Argentina"
        emoji: "🏔️"
        body: "Fly two hours north of Buenos Aires and you land in the Andes. **Salta** (nicknamed **Salta la linda**, Salta the pretty) and **Jujuy** feel closer to Bolivia and Peru than to Palermo: adobe villages, llamas, **ponchos**, quinoa, and Quechua words in everyday Spanish. The **Quebrada de Humahuaca**, a long **quebrada** (gorge) in Jujuy, is a UNESCO World Heritage site."

      - type: info
        title: "The hill of seven colors"
        emoji: "🌈"
        body: "In the little town of **Purmamarca**, the **Cerro de los Siete Colores** looks hand-painted: stripes of red, purple, ochre and green, from different minerals laid down over millions of years. Further up, at around 3,450 m, the **Salinas Grandes** are a blinding white salt flat. Everyone takes the same fake-perspective photo. You will too."

      - type: true_false
        statement: "The Cerro de los Siete Colores gets its brightest stripes from paint touched up for tourists."
        answer: false
        explain: "It's all geology: layers of different minerals. The paint-brush look is completely natural."

      - type: info
        title: "Coquear"
        emoji: "🍃"
        body: "In the northwest, lots of people **coquean**: they tuck coca leaves into their cheek and keep a wad, the **acullico**, there for hours. It fights **la altura** (altitude), cold and tiredness. It's no scandal: national law says chewing coca leaves in their natural state is **not** drug use. A few leaves in your cheek are a world away from cocaine, which is very much illegal."
        fun_fact: "The odd bit: the leaves are legal to chew, but importing them isn't. Most come across the Bolivian border anyway."

      - type: choice
        scenario: "On a bus to Humahuaca, the man next to you has a bulging cheek and offers you some leaves from a little bag."
        prompt: "What's going on?"
        options: ["He's selling something illegal", "He's coqueando and sharing", "He's chewing tobacco"]
        correct: 1
        explain: "Coca leaf is shared like mate up there. Taking a few helps with the altitude. You can also just say **no, gracias**: nobody will be offended."

      - type: info
        title: "Feeding the Earth"
        emoji: "🌎"
        body: "Every **1 de agosto** the Andes celebrate the **Pachamama**, Mother Earth. Families dig a hole, the **boca**, and \"feed\" it with food, coca, **chicha** (corn beer) and wine, to thank her and ask for a good year. The ritual is the **corpachada**. Meanwhile, all over Argentina, people knock back **caña con ruda** (cane liquor steeped with rue) that morning to keep winter's bad luck away."

      - type: true_false
        statement: "On August 1st, many Argentines, even in Buenos Aires, drink a shot of caña con ruda."
        answer: true
        explain: "On an empty stomach, in one, three or seven sips. The tradition is Guaraní in origin but has spread everywhere."

      - type: info
        title: "Zambas and carnavalito"
        emoji: "🎶"
        body: "Salta is the home turf of the **zamba**, a slow, elegant folk dance where couples circle each other waving white **pañuelos** (handkerchiefs). Jujuy dances the **carnavalito**, in a line, to flutes and charangos. And Jujuy's **carnaval** starts with the **desentierro del diablo**: a cloth devil gets dug up from a pile of stones, and the whole town parties until he's buried again."
        fun_fact: "They say the red poncho with black stripes of Salta mourns General Güemes, the local independence hero."

      - type: match
        prompt: "Match the word to what it is"
        pairs:
          - ["Pachamama", "Mother Earth"]
          - ["acullico", "wad of coca leaves in the cheek"]
          - ["zamba", "slow dance with handkerchiefs"]
          - ["corpachada", "ritual of feeding the Earth"]
          - ["Salinas Grandes", "huge salt flat"]

      - type: gap
        prompt: "Your friend in Salta invites you to the Pachamama celebration."
        text: "El primero de agosto le damos de ___ a la Pachamama."
        options: ["comer", "dormir", "hablar"]
        correct: 0
        translation: "On August 1st we feed the Pachamama."
        explain: "**Darle de comer** means to feed. That's literally the idea of the corpachada."

    vocabulary:
      - es: "coquear"
        en: "to chew coca leaves"
        example: { es: "Coqueá un poco, que ayuda con la altura.", en: "Chew some coca, it helps with the altitude." }
      - es: "acullico"
        en: "wad of coca leaves held in the cheek"
        note: "Northwest word. In Buenos Aires few people know it."
      - es: "la Pachamama"
        en: "Mother Earth (Andean)"
      - es: "caña con ruda"
        en: "cane liquor with rue, drunk on August 1st"
      - es: "la altura"
        en: "altitude"
        example: { es: "Me pegó la altura.", en: "The altitude got to me." }
      - es: "pañuelo"
        en: "handkerchief, scarf"
      - es: "quebrada"
        en: "narrow mountain valley, gorge"
    glossary:
      - es: "Salta la linda"
        en: "Salta the pretty (nickname)"
      - es: "ponchos"
        en: "ponchos"
      - es: "Cerro de los Siete Colores"
        en: "Hill of Seven Colors"
      - es: "Salinas Grandes"
        en: "the Big Salt Flats"
      - es: "coquean"
        en: "they chew coca leaves"
      - es: "boca"
        en: "mouth (the offering hole)"
      - es: "chicha"
        en: "corn beer"
      - es: "corpachada"
        en: "Pachamama offering ritual"
      - es: "zamba"
        en: "zamba (folk dance)"
      - es: "pañuelos"
        en: "handkerchiefs"
      - es: "carnavalito"
        en: "carnavalito (Andean dance)"
      - es: "carnaval"
        en: "carnival"
      - es: "desentierro del diablo"
        en: "unburying of the devil"

  # ─────────────────────────────────────────────────────────────
  - slug: "cuyo"
    title: "Cuyo: wine, water and the siesta"
    summary: "Mendoza, Malbec and the highest mountain outside Asia"
    pages:
      - type: info
        title: "An oasis in the desert"
        emoji: "🌵"
        body: "**Cuyo** (Mendoza, San Juan, San Luis) is dry: the name is usually said to mean \"land of sands\". Mendoza lives on snowmelt from the Andes, channelled through **acequias**, open ditches along every street that water the trees. The system goes back to the **Huarpe** people, before the Spanish. Walk around at night and mind your step: falling into one is a rite of passage."

      - type: info
        title: "Malbec country"
        emoji: "🍷"
        body: "Mendoza makes most of Argentina's wine, and most of its **Malbec**. The grape came from France and found its real home here, in sun, altitude and dry air. A **bodega** is a winery, and touring them by bike is a local classic. At dinner, just order **un tinto** (a red): odds are it's a Malbec."

      - type: true_false
        statement: "Malbec is originally a French grape that did better in Mendoza than back home."
        answer: true
        explain: "It comes from southwest France, struggled there after frost and disease, and boomed in Mendoza. Argentines are not modest about this."

      - type: info
        title: "La Vendimia"
        emoji: "👑"
        body: "The grape harvest, the **vendimia**, ends with the **Fiesta Nacional de la Vendimia**. It peaks in early March, with parades, a giant open-air show in an amphitheater in the foothills, and the crowning of the **Reina de la Vendimia**. It's Mendoza's biggest night by far. If you're around, go, and book your bed early: hotels fill up fast."

      - type: info
        title: "El Aconcagua"
        emoji: "⛰️"
        body: "Right behind Mendoza stands the **Aconcagua**, at almost 7,000 m the highest mountain outside Asia, and the roof of the Americas. Thousands try to summit it each season; plenty turn back because of altitude and wind. You don't need to climb it: from the road to Chile you can see its snowy face from the Horcones lagoon."

      - type: true_false
        statement: "The Aconcagua, near Mendoza, is the highest mountain in the Americas."
        answer: true
        explain: "Almost 7,000 m, the highest point of both the western and southern hemispheres. It's entirely inside Argentina, near the Chilean border."

      - type: info
        title: "La siesta is real"
        emoji: "😴"
        body: "In Buenos Aires, **dormir la siesta** (napping after lunch) is a weekend luxury. In Cuyo and much of the interior it's a schedule. Shops work **horario cortado** (split hours): closed in the early afternoon, open again around five. In summer the streets go silent. Call someone at 3 p.m. and you'll get a sleepy voice, or no answer."

      - type: choice
        scenario: "It's 3 p.m. on a hot January weekday in San Juan. You need to buy a charger and the shop is shut."
        prompt: "What's the most likely explanation?"
        options: ["It's a public holiday today", "It's closed for the siesta", "The shop went out of business"]
        correct: 1
        explain: "Come back around five or six. The horario cortado is normal in many provinces."

      - type: gap
        prompt: "A mendocino invites you out for the afternoon."
        text: "¿Vamos a recorrer ___ en bici?"
        options: ["bodegas", "acequias", "siestas"]
        correct: 0
        translation: "Shall we tour the wineries by bike?"
        explain: "**Bodega** is a winery (in other contexts, a storeroom). Pedal slowly: the tasting is at every stop."

      - type: choice
        scenario: "You're walking back to your hostel in Mendoza after a long dinner with plenty of tinto."
        prompt: "What should you watch out for?"
        options: ["Stepping into an acequia", "Getting lost in a vineyard", "Llamas on the sidewalk"]
        correct: 0
        explain: "The acequias run along the curb, open and unlit. They're real irrigation channels, and without them the city's trees would die. Locals will laugh, kindly, when you fall in."

    vocabulary:
      - es: "bodega"
        en: "winery"
        example: { es: "Mañana vamos a una bodega en Luján de Cuyo.", en: "Tomorrow we're going to a winery in Luján de Cuyo." }
      - es: "vendimia"
        en: "grape harvest"
      - es: "acequia"
        en: "irrigation ditch along the street"
      - es: "dormir la siesta"
        en: "to take a nap after lunch"
        example: { es: "No me llames a las tres, que duermo la siesta.", en: "Don't call me at three, I'm napping." }
      - es: "horario cortado"
        en: "split opening hours (closed in the afternoon)"
      - es: "un tinto"
        en: "a red wine"
        example: { es: "¿Pedimos un tinto?", en: "Shall we order a red?" }

  # ─────────────────────────────────────────────────────────────
  - slug: "cordoba"
    title: "Córdoba: fernet, cuarteto and the tonada"
    summary: "The province that talks slower, parties harder and jokes about everything"
    pages:
      - type: info
        title: "La tonada"
        word: { es: "tonada", tag: "The Córdoba sound", en: "a sing-song accent" }
        emoji: "🗣️"
        body: "You'll hear a cordobés before you see one. The **tonada** (or **cantito**) stretches the syllable *before* the stressed one: **\"capiiital\"**, **\"cordoobés\"**, with a little sing-song on top. Some linguists think it's a trace of the **Comechingón** languages spoken there before Spanish. Porteños love imitating it. Cordobeses love telling them they do it badly."

      - type: info
        title: "La Docta"
        emoji: "🎓"
        body: "Córdoba's nickname is **La Docta**, \"the learned one\". Its university, founded by the Jesuits, is the oldest in the country, and for a long time it was the only one. Today the city is full of students from all over Argentina. The old Jesuit block downtown, the **Manzana Jesuítica**, is a UNESCO World Heritage site."

      - type: info
        title: "Fernet con coca"
        emoji: "🥤"
        body: "**Fernet** is a bitter Italian herbal liqueur. Argentina drinks most of the world's supply, and Córdoba drinks around **a third** of the country's. Mixed with Coca-Cola, lots of ice, and a proper foam on top, **fernet con coca** is the drink of every party. Some cordobeses pour it into a cut-off plastic bottle: the classic **fernet en bidón**."
        fun_fact: "Argentines also call it a **fernando**. Nobody knows who Fernando was."

      - type: choice
        scenario: "At a party in Córdoba someone hands you a big glass of something dark and fizzy with a thick foam."
        prompt: "What is it almost certainly?"
        options: ["A Malbec with soda", "Fernet con coca", "Cold mate", "A Guinness"]
        correct: 1
        explain: "The unofficial provincial drink. It's bitter the first time and addictive by the third. Pace yourself: fernet is strong stuff, the Coke just hides it."

      - type: info
        title: "Cuarteto"
        emoji: "🎤"
        body: "Córdoba's party music is **cuarteto**: a bouncy, piano-driven beat locals call **tunga-tunga**, made for packed dance halls. On a Saturday night, go to a **baile** (a cuarteto dance) and, if you can, see **La Mona Jiménez**, its king, live. Nobody cares if you know the steps. Grab a hand, follow the crowd round the floor, and bounce."

      - type: true_false
        statement: "If a cordobés invites you to a baile on Saturday night, expect to dance cuarteto."
        answer: true
        explain: "The baile is where cuarteto lives: big halls, late nights, everyone dancing. Wear comfortable shoes."

      - type: info
        title: "Culiado"
        emoji: "😂"
        body: "Cordobeses are famous for their humor: fast, cheeky, and full of **jodas** (teasing). Their signature word is **culiado** (said **culiao**). It's vulgar in origin, and still an insult if you say it angrily, but between friends it's closer to \"mate\" or \"dude\": \"¿Qué hacés, culiao?\" The story goes that even Paul McCartney greeted a Córdoba crowd with it."

      - type: choice
        scenario: "You've just met a group of cordobeses. One of them says to another, laughing: \"¡Qué hacés, culiao!\""
        prompt: "Should you greet them the same way?"
        options: ["Yes, it's the local hello", "Not yet, wait until you're friends", "Never, it's a terrible insult"]
        correct: 1
        explain: "Between friends it's affection. From a gringo they just met, it can land badly. Tone and trust are everything. Wait until they call *you* culiao."

      - type: match
        prompt: "Match the Córdoba word to what it is"
        pairs:
          - ["La Docta", "Córdoba's nickname"]
          - ["tonada", "the sing-song accent"]
          - ["fernet con coca", "the party drink"]
          - ["baile", "where you dance cuarteto"]
          - ["culiao", "\"dude\", among friends"]

      - type: gap
        prompt: "Your cordobés friend is organizing drinks."
        text: "Traé hielo, que hacemos un ___ con coca."
        options: ["fernet", "mate", "té"]
        correct: 0
        translation: "Bring ice, we're making fernet and coke."
        explain: "Fernet without ice is a crime in Córdoba. Somebody always forgets the ice anyway."

    vocabulary:
      - es: "tonada"
        en: "regional accent, like Córdoba's sing-song"
        example: { es: "Se le nota la tonada cordobesa.", en: "You can hear his Córdoba accent." }
      - es: "fernet con coca"
        en: "the party drink: bitter liqueur plus cola"
      - es: "cuarteto"
        en: "Córdoba's bouncy dance music"
      - es: "baile"
        en: "a night out dancing in a big hall"
      - es: "culiado / culiao"
        en: "dude, pal (between friends in Córdoba)"
        note: "Vulgar origin. Use only with friends, and only if they use it first."
      - es: "joda"
        en: "teasing, a joke; also a party"
        example: { es: "Era una joda, no te enojes.", en: "It was a joke, don't get mad." }
    glossary:
      - es: "cantito"
        en: "the Córdoba sing-song"
      - es: "culiado"
        en: "dude, pal (Córdoba slang, rude at face value)"
      - es: "culiao"
        en: "dude, pal (Córdoba slang, rude at face value)"
      - es: "\"capiiital\""
        en: "stretched-out \"capital\""
      - es: "\"cordoobés\""
        en: "stretched-out \"cordobés\""
      - es: "La Docta"
        en: "the learned one (Córdoba's nickname)"
      - es: "Manzana Jesuítica"
        en: "Jesuit Block"
      - es: "fernando"
        en: "fernet (slang)"
      - es: "fernet en bidón"
        en: "fernet in a big jug"
      - es: "tunga-tunga"
        en: "the cuarteto beat (onomatopoeia)"
      - es: "jodas"
        en: "parties, messing around (slang)"

  # ─────────────────────────────────────────────────────────────
  - slug: "litoral"
    title: "The Litoral: rivers, falls and chamamé"
    summary: "Iguazú, Guaraní, Rosario and a very loud yell"
    pages:
      - type: info
        title: "A coast with no sea"
        emoji: "🌊"
        body: "The **Litoral** (Santa Fe, Entre Ríos, Corrientes, Misiones…) means \"coast\", but none of it touches the ocean. The coasts are **río** banks: the huge **río Paraná** and **río Uruguay**. Up in the northeast the air is humid, **Misiones** grows the yerba for your mate in bright red soil (**tierra colorada**), and **siesta**, **tereré** and fishing are serious business."

      - type: info
        title: "Iguazú"
        emoji: "💦"
        body: "On the border with Brazil, the **Cataratas del Iguazú** are hundreds of waterfalls, about 80% of them on the Argentine side. The star is the **Garganta del Diablo** (Devil's Throat), a horseshoe of thundering water you reach on a walkway. The story goes that when **Eleanor Roosevelt** saw it, she sighed: **\"Poor Niagara!\"** Nobody has found proof she said it, but everyone repeats it."

      - type: true_false
        statement: "Most of the Iguazú waterfalls are on the Brazilian side."
        answer: false
        explain: "About 80% of the falls are in Argentina. Brazilians like to point out that their side has the better panoramic view. Do both if you can."

      - type: info
        title: "Guaraní is still here"
        emoji: "🗣️"
        body: "The northeast is Guaraní land, and you can hear it. In **Corrientes**, Guaraní is an official language alongside Spanish. Everyday speech is full of Guaraní words: **gurí** / **gurisa** (boy / girl), **mitaí** (child), **ñandú** (rhea). Many correntinos pepper their Spanish with it without even noticing."

      - type: info
        title: "Chamamé and the sapucai"
        word: { es: "chamamé", tag: "Music of the Litoral", en: "accordion folk music" }
        emoji: "🪗"
        body: "The Litoral's music is **chamamé**: accordion, guitar and couples dancing tightly embraced. Every January, **Corrientes** hosts the **Fiesta Nacional del Chamamé**. At the best moment of a song, someone lets out a **sapucai**: a long, high, piercing yell of joy (or grief, or bravery)."

      - type: choice
        scenario: "You're at a chamamé dance in Corrientes. Suddenly a man next to you throws his head back and lets out a long, piercing scream."
        prompt: "What's happening?"
        options: ["He's hurt and needs help", "It's a sapucai: pure emotion", "He's calling a friend over"]
        correct: 1
        explain: "The **sapucai** (from Guaraní) is how chamamé fans express emotion. Nobody will expect you to do one. But if you try, go loud."

      - type: info
        title: "Rosario"
        emoji: "🏙️"
        body: "**Rosario**, in Santa Fe, is Argentina's third city and a river town through and through. Walk the riverside, see the giant **Monumento a la Bandera** (where Belgrano first raised the flag), and order a **liso**: a draft beer in a straight glass. The **rosarinos** will remind you that Messi was born here. So was Che Guevara, who got his nickname in Cuba for saying **che** (hey!) all the time."

      - type: true_false
        statement: "Che Guevara's nickname comes from the Argentine way of saying \"hey\"."
        answer: true
        explain: "Born in Rosario, he kept saying **che**, and his Cuban comrades turned it into his name. It's still the most Argentine word there is."

      - type: match
        prompt: "Match the place to what you go there for"
        pairs:
