section:
  slug: "regiones"
  title: "Las provincias"
  emoji: "🗺️"
  summary: "Argentina beyond Buenos Aires, from the salt flats to the end of the world"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "el-interior"
    title: "Buenos Aires is not Argentina"
    summary: "A huge country, 23 provinces with their own pride, and a map that reaches Antarctica"
    pages:
      - type: card
        text: "Argentina is huge: roughly five times France. From **La Quiaca** on the Bolivian border down to **Ushuaia**, you get high desert, jungle, vineyards, the flat pampa and glaciers."
      - type: card
        text: "There are 23 **provincias**, plus the city of Buenos Aires. Each province has its own governor, constitution, police and flag."
      - type: choice
        prompt: "On the official map every Argentine kid learns at school, which province is the biggest?"
        options:
          - "Tierra del Fuego"
          - "Buenos Aires"
          - "Santa Cruz"
        correct: 0
        explain: "School maps include the slice of **Antarctica** that Argentina claims, and it belongs to Tierra del Fuego. Leave the ice out and Buenos Aires wins."
      - type: card
        text: "Getting around means the **micro**, the long-distance bus. Twenty hours overnight in a **coche cama**, a seat that folds almost flat, is completely normal."
      - type: choice
        prompt: "About how many Argentines live in and around the city of Buenos Aires?"
        options:
          - "About a third"
          - "About a tenth"
          - "About two thirds"
        correct: 0
        explain: "One in three, in one metro area. No wonder the capital sometimes thinks it *is* the country."
      - type: card
        text: "Nearly every town throws a **Fiesta Nacional** of something it's proud of: the Poncho in Catamarca, the Sun in San Juan, even the **Salame Quintero** in Mercedes."
      - type: card
        text: "Provincial pride runs deep. Tell a girl from Salta who moved to Buenos Aires that she's porteña now, and she'll correct you on the spot."
      - type: card
        chip: "Pro tip"
        text: "Meet someone from the provinces? Ask **“¿Y qué extrañás de allá?”**, what do you miss from back home. Then settle in for twenty minutes about the food, the family and the landscape."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "noroeste"
    title: "The Noroeste: Andes, coca and Pachamama"
    summary: "Salta, Jujuy and the most Andean corner of the country"
    pages:
      - type: card
        text: "Fly two hours north of Buenos Aires and you land in the Andes. **Salta** and **Jujuy** feel closer to Bolivia than to Palermo: adobe villages, llamas, ponchos and Quechua words in everyday Spanish."
      - type: card
        text: "In the little town of **Purmamarca** stands the **Cerro de los Siete Colores**, a hill striped red, purple, ochre and green. No paint involved: just layers of different minerals."
      - type: choice
        prompt: "On a bus to Humahuaca, the man next to you has a bulging cheek and offers you leaves from a little bag. What's going on?"
        options:
          - "He's sharing coca leaves for the altitude"
          - "He's offering you tobacco to chew"
          - "He's selling a herbal tea he grows"
        correct: 0
        explain: "Up here lots of people **coquean**: they keep a wad of coca leaves in their cheek for hours against altitude, cold and tiredness. Taking a few is fine. So is **no, gracias**."
      - type: card
        text: "It's no scandal: Argentine law says chewing coca leaves is not drug use. A few leaves in your cheek are a world away from cocaine, which is very much illegal."
      - type: card
        text: "Every **1 de agosto** the Andes honor the **Pachamama**, Mother Earth. Families dig a hole and “feed” it with food, coca, corn beer and wine, to thank her and ask for a good year."
      - type: choice
        prompt: "That same morning, all over Argentina, even in Buenos Aires, many people take a shot of something on an empty stomach. What?"
        options:
          - "Caña with rue, against winter's bad luck"
          - "Hot mate with salt, against the flu"
          - "Red wine with honey, for money"
        correct: 0
        explain: "**Caña con ruda**: cane liquor steeped with rue, the herb. One shot on 1 August keeps the bad luck of winter away, or so they say."
      - type: card
        chip: "Did you know?"
        text: "Jujuy's carnival starts by digging up a cloth devil from a pile of stones: the **desentierro del diablo**. The whole town parties until he's buried again."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "cuyo"
    title: "Cuyo: wine, water and the siesta"
    summary: "Mendoza, Malbec and the highest mountain outside Asia"
    pages:
      - type: card
        text: "**Cuyo** is Mendoza, San Juan and San Luis: dry land at the foot of the Andes. It barely rains. Yet Mendoza's streets are lined with huge, shady trees."
      - type: choice
        prompt: "How does a desert city keep all those trees alive?"
        options:
          - "Open ditches carry snowmelt to every street"
          - "Trucks water them every night"
          - "They're desert trees that need no water"
        correct: 0
        explain: "Water from the Andes runs through **acequias**, open channels along the curb. The system goes back to the **Huarpe** people, before the Spanish."
      - type: card
        text: "Walking home at night, mind your step. Falling into an acequia is a rite of passage, and the locals will laugh, kindly."
      - type: card
        text: "Mendoza makes most of Argentina's wine. Touring **bodegas** (wineries) by bike is a local classic. At dinner just order **un tinto**, a red: odds are it's Malbec."
      - type: choice
        prompt: "Malbec is Argentina's flagship grape. Where does it originally come from?"
        options:
          - "France"
          - "Italy"
          - "Spain"
        correct: 0
        explain: "From southwest France. It struggled back home and found its real home here, in sun, altitude and dry air."
      - type: card
        text: "The grape harvest ends with the **Fiesta de la Vendimia**, in early March: parades, a huge show in the hills, and a harvest queen chosen from the queens of the province's 18 departments."
      - type: card
        text: "Behind the city stands the **Aconcagua**: almost 7,000 meters, the highest mountain outside Asia. You don't need to climb it. On the road to Chile you can see its snowy face."
      - type: card
        text: "In Buenos Aires the **siesta** is a weekend luxury. Here it's the schedule: shops shut after lunch and reopen late in the afternoon, and the summer streets go silent."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "cordoba"
    title: "Córdoba: fernet, cuarteto and the tonada"
    summary: "The province that talks slower, parties harder and jokes about everything"
    pages:
      - type: card
        text: "You'll hear a cordobés before you see one. The **tonada** stretches the syllable before the stressed one: **“cordoobés”**. Porteños love imitating it. Cordobeses love telling them they do it badly."
      - type: card
        text: "Córdoba's nickname is **La Docta**, the learned one. The Jesuits founded the country's oldest university here, and the city is still full of students from all over Argentina."
      - type: choice
        prompt: "In Italy, fernet is a bitter shot after dinner. How does Córdoba drink it?"
        options:
          - "With Coca-Cola, in a tall glass"
          - "Frozen, in tiny shot glasses"
          - "Hot, with honey and lemon"
        correct: 0
        explain: "**Fernet con coca**, lots of ice and a proper foam on top: the drink of every party. Bitter the first time, addictive by the third."
      - type: card
        text: "Argentina drinks more fernet than any other country, and Córdoba leads the way: the province is said to drink around a third of it. Pace yourself."
      - type: card
        text: "Saturday night means a **baile de cuarteto**, Córdoba's own party music. The crowd dances in a giant circle round the floor, and you just follow it."
      - type: choice
        prompt: "Up in Córdoba's hills, **Villa General Belgrano** throws Argentina's big Oktoberfest. Who helped make it a German town?"
        options:
          - "Sailors from a German warship"
          - "Brewers hired by the province"
          - "Monks from a Bavarian abbey"
        correct: 0
        explain: "In 1939 the warship **Graf Spee** was scuttled off Montevideo. Its crew was interned in Argentina, and some sailors settled in these hills for good."
      - type: card
        text: "Cordobeses are famous for their humor. Their signature word is **culiao**. Vulgar and an insult when angry, between friends it means “dude”. Wait until they call *you* culiao before you try it."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "litoral"
    title: "The Litoral: rivers, falls and chamamé"
    summary: "Iguazú, Guaraní, Rosario and a very loud yell"
    pages:
      - type: card
        text: "**Litoral** means coast, but none of it touches the sea. Its coasts are the banks of huge rivers: the **Paraná** and the **Uruguay**."
      - type: card
        text: "Up in **Misiones** the soil is bright red and the air is thick and humid. In the jungle stand the stone ruins of **Jesuit missions**, where thousands of Guaraní once lived."
      - type: choice
        prompt: "Iguazú's falls sit on the border with Brazil. What share of them is on the Argentine side?"
        options:
          - "Most of them"
          - "About half"
          - "Only a few"
        correct: 0
        explain: "Roughly 80% of the falls are Argentine. Brazilians will point out that their side has the better panoramic view. Both are right."
      - type: card
        text: "The star is the **Garganta del Diablo**, a horseshoe of thundering water. The story goes that Eleanor Roosevelt saw Iguazú and sighed: “Poor Niagara!”"
      - type: card
        text: "The northeast is Guaraní land, and you can hear it. In **Corrientes**, Guaraní is an official language next to Spanish. A kid there is a **gurí**, not a pibe."
      - type: card
        text: "The Litoral's music is **chamamé**: accordion, guitar, and couples dancing in a tight embrace. Every January, Corrientes throws a huge national chamamé festival."
      - type: choice
        prompt: "At a chamamé dance, the man next to you throws his head back and lets out a long, piercing scream. What's happening?"
        options:
          - "He's letting out a yell of joy"
          - "He's calling his friends over to dance"
          - "He's telling the band to play faster"
        correct: 0
        explain: "It's a **sapucai**, a Guaraní yell of joy, grief or courage. Nobody expects you to do one. But if you try, go loud."
      - type: card
        text: "**Rosario**, Argentina's third city, lives by the Paraná. Walk the riverfront and order a **liso**, a draft beer in a straight glass. Rosarinos will remind you that Messi was born here."
      - type: choice
        prompt: "Rosario is hundreds of kilometers from the sea. Where do rosarinos go to the beach on a hot Sunday?"
        options:
          - "Sandy islands across the Paraná"
          - "A lagoon in the pampa nearby"
          - "Public pools in every barrio"
        correct: 0
        explain: "Little boats cross the river to the islands opposite the city, with sand, trees and a grill. And there are river beaches right in town."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "patagonia"
    title: "Patagonia: ice, wind and Welsh tea"
    summary: "Glaciers, Welsh tea, chocolate and the end of the world"
    pages:
      - type: card
        text: "**Patagonia** covers more than a quarter of Argentina, yet hardly anyone lives there. Steppe, lakes, mountains and a wind that never stops. The tourists are the ones chasing their hats."
      - type: card
        text: "Near **El Calafate**, the **Perito Moreno** glacier ends in a towering wall of ice. For years it kept building an ice bridge across the lake, and each collapse was broadcast live on TV."
      - type: choice
        prompt: "For decades, what made the Perito Moreno famous among glaciers?"
        options:
          - "It wasn't shrinking, unlike most others"
          - "It was the fastest-growing in the world"
          - "Its ice was bright pink in summer"
        correct: 0
        explain: "It stayed stable while others melted. Bad news: since 2019 it has been retreating fast, and scientists doubt it will ever build that ice bridge again."
      - type: card
        text: "In 1865 a small ship brought a group of **Welsh** settlers to the Chubut valley. Their towns, chapels and tea houses are still there."
      - type: choice
        prompt: "Why did those Welsh families sail all the way to Patagonia?"
        options:
          - "To keep their language alive"
          - "To dig for gold in the rivers"
          - "To escape a famine back home"
        correct: 0
        explain: "At home, English was pushing Welsh aside. Here they could live, pray and teach in Welsh. Some families still speak it."
      - type: card
        text: "In towns like **Gaiman**, a **té galés** is a meal, not a snack: pots of tea, scones, jams and **torta negra**, a dense fruit cake made to last the winter. Go hungry."
      - type: card
        text: "**Bariloche** looks like the Alps, with chocolate shops on every corner. It's also where teens go on their end-of-school trip, the **viaje de egresados**. Every adult has stories. Few will tell you all of them."
      - type: card
        text: "At the very bottom of the map, **Ushuaia** calls itself **el fin del mundo**, the end of the world. From here, ships leave for Antarctica."
      - type: choice
        prompt: "Ushuaia has a little steam train, the **Tren del Fin del Mundo**. What was it first built for?"
        options:
          - "Taking prisoners out to cut wood"
          - "Carrying tourists to the glaciers"
          - "Hauling gold down from the mines"
        correct: 0
        explain: "Ushuaia began as a prison town. The train carried inmates to the forest to cut timber. Today it carries tourists along the same valley."
    vocabulary: []
