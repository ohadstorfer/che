  # ─────────────────────────────────────────────────────────────
  - slug: "patagonia"
    title: "Patagonia: ice, wind and Welsh tea"
    summary: "Glaciers, whales, chocolate and the end of the world"
    pages:
      - type: info
        title: "Big and empty"
        emoji: "🌬️"
        body: "**Patagonia** (Neuquén, Río Negro, Chubut, Santa Cruz, Tierra del Fuego) covers more than a quarter of Argentina, but only about 1 in 20 Argentines live there. It's steppe, lakes, the Andes and a **viento** (wind) that never stops. You'll spot the tourists: they're the ones chasing their hats."

      - type: info
        title: "The Perito Moreno"
        emoji: "🧊"
        body: "Near **El Calafate**, the **glaciar Perito Moreno** ends in a towering wall of ice. Every few years it pushes across the lake, builds an ice bridge, and the bridge collapses on live TV. For decades it was famous for being stable while other glaciers shrank. Bad news: studies now show it has been retreating since around 2020."
        fun_fact: "Legend says whoever eats a **calafate** berry will come back to Patagonia."

      - type: true_false
        statement: "The Perito Moreno glacier is still stable today."
        answer: false
        explain: "That used to be true. Recent studies show it started retreating around 2020, and the loss is speeding up."

      - type: info
        title: "Te galés"
        emoji: "🫖"
        body: "In 1865, a ship dropped about 150 **Welsh** settlers in what's now **Puerto Madryn**. They wanted a place to keep their language and chapels. They founded towns in the Chubut valley, like **Gaiman**, where today you can have a **té galés**: pots of tea, scones, jams and the **torta negra**, a dense fruit cake built to last through winter."

      - type: true_false
        statement: "Gaiman's tea houses go back to English settlers who came for the sheep farms."
        answer: false
        explain: "They were **Welsh**, and they came to keep their language alive. Some families in the valley still speak it. Go hungry: a té galés is a meal, not a snack."

      - type: info
        title: "Bariloche and the viaje de egresados"
        emoji: "🍫"
        body: "**Bariloche** looks like the Alps: lakes, wooden chalets, ski slopes and **chocolate** shops on every corner. It's also where Argentine teens go on their **viaje de egresados**, the end-of-high-school trip, with tour-company **coordinadores** trying to keep them alive and sober. Almost every adult has stories. Few will tell you all of them."

      - type: choice
        scenario: "Your Argentine coworker, 35, shows you a photo of a bunch of teens in matching jackets in the snow."
        prompt: "What's the photo almost certainly from?"
        options: ["A school ski team", "Their viaje de egresados", "A family trip to Europe"]
        correct: 1
        explain: "The group jacket, the snow, the embarrassing haircuts: classic Bariloche trip. Ask about it and enjoy the story (the censored version)."

      - type: info
        title: "Whales and the end of the world"
        emoji: "🐋"
        body: "From about June to December, **ballenas** (southern right whales) come to **Península Valdés** to mate and give birth, sometimes a few meters from the shore. Way further south, **Ushuaia** calls itself **el fin del mundo**, the end of the world. Its little **Tren del Fin del Mundo** was once used to take prisoners from the old jail out to cut wood."

      - type: info
        title: "Cordero al asador"
        emoji: "🔥"
        body: "Patagonia's great feast is **cordero patagónico al asador**: a whole lamb opened flat on an iron cross, stuck in the ground leaning over the fire, and cooked slowly for hours. The sheep graze wild on the steppe, so the meat tastes different. It's the southern cousin of the asado, and the waiting, with wine and conversation, is part of the plan."

      - type: match
        prompt: "Match the place to what you go there for"
        pairs:
          - ["Gaiman", "Welsh tea"]
          - ["Península Valdés", "whales"]
          - ["El Calafate", "the Perito Moreno glacier"]
          - ["Ushuaia", "the end of the world"]
          - ["Bariloche", "chocolate and school trips"]

      - type: gap
        prompt: "Your host in El Calafate tells you what's for dinner."
        text: "Hoy hacemos ___ al asador."
        options: ["cordero", "helado", "flan"]
        correct: 0
        translation: "Today we're roasting lamb on the cross."
        explain: "**Cordero al asador**: bring an appetite and patience. It takes hours."

