section:
  slug: "iconos"
  title: "Íconos e inventos"
  emoji: "🌟"
  summary: "Mafalda, Borges, the birome and a Pope from Flores"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "mafalda"
    title: "Mafalda and her gang"
    summary: "The six-year-old who worried about the whole world"
    pages:
      - type: card
        text: "**Mafalda** is a little girl with a big bow and bigger questions: world peace, the Beatles, and why grown-ups run things so badly. **Quino** drew her from 1964 to 1973."
      - type: choice
        prompt: "Why does Mafalda's name start with M?"
        options:
          - "She was first drawn for an appliance ad"
          - "Quino named her after his mother"
          - "It's borrowed from an old tango title"
        correct: 0
        explain: "Her name had to echo **Mansfield**, a brand of home appliances. The ad never ran, so she got her own comic strip instead."
      - type: card
        text: "Her mortal enemy? **La sopa**. Mafalda hates soup almost more than war. Lots of readers saw politics in that bowl: everything you're forced to swallow."
      - type: card
        text: "Her gang: **Manolito**, obsessed with money at his dad's shop. **Susanita**, who dreams only of a husband and kids. Dreamy **Felipe**. Tiny, political **Libertad**. Every Argentine knows a Susanita."
      - type: card
        text: "She's loved far beyond Argentina. In Italy, the novelist **Umberto Eco** introduced her first book and called her an angry little heroine who rejects the world as it is."
      - type: choice
        prompt: "Mafalda has a statue in Buenos Aires. Where?"
        options:
          - "On a bench, on the corner where Quino lived"
          - "Outside the Casa Rosada, on Plaza de Mayo"
          - "In the lobby of the Teatro Colón"
        correct: 0
        explain: "In **San Telmo**, at Chile and Defensa, right by the building where Quino lived. There's always a line for a photo on the bench next to her."
      - type: card
        chip: "Did you know?"
        text: "Quino died in 2020, one day after Mafalda's birthday. Fans filled her bench in San Telmo with flowers and notes."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "historietas-y-pantallas"
    title: "Comics, cartoons and snow"
    summary: "The first animated film ever, a bird with no wings, and El Eternauta"
    pages:
      - type: card
        text: "Argentines call cartoons **dibujitos**. And this country made the world's first animated feature film, **El Apóstol**, in 1917: long before *Snow White*."
      - type: choice
        prompt: "What was El Apóstol about?"
        options:
          - "The president setting fire to Buenos Aires"
          - "A gaucho crossing the pampa on foot"
          - "A talking condor looking for its family"
        correct: 0
        explain: "It mocked President Yrigoyen, who flies up to the gods and burns the city to clean out corruption. Sadly, the only copy burned in a studio fire, so nobody can watch it today."
      - type: card
        text: "**Clemente** is a striped bird with no wings, drawn by **Caloi**. During the 1978 World Cup, he picked a fight with the country's most famous radio commentator."
      - type: choice
        prompt: "What was the fight about?"
        options:
          - "Whether fans should throw paper in the stadiums"
          - "Whether the dictator should hand out the cup"
          - "Which club Clemente secretly supported"
        correct: 0
        explain: "The commentator asked fans not to throw **papelitos**, so the country wouldn't look messy. Clemente said **“¡Tiren papelitos, muchachos!”** The stadiums ended up covered in paper."
      - type: card
        text: "**El Eternauta** began as a comic in 1957. A deadly snowfall covers Buenos Aires, and anyone it touches dies. In 2025 Netflix made it a hit series with **Ricardo Darín**."
      - type: card
        text: "The hero isn't one man, it's the group. Its motto, **nadie se salva solo**, nobody saves themselves alone, is quoted at marches and whenever a neighbor needs a hand."
      - type: card
        text: "Its writer, **Héctor Oesterheld**, was kidnapped by the dictatorship and never seen again. So were his four daughters. That's why the Eternauta's silhouette appears at human-rights marches."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "escritores"
    title: "The writers"
    summary: "Borges, Cortázar, Alfonsina and the songs every kid sings"
    pages:
      - type: card
        text: "The writer every Argentine name-drops is **Jorge Luis Borges**: short, dizzying stories about labyrinths, mirrors and infinite libraries."
      - type: choice
        prompt: "Borges went almost blind. What job did he get around the same time?"
        options:
          - "Director of the National Library"
          - "Film critic for a big newspaper"
          - "Head of a school for painters"
        correct: 0
        explain: "He called it an irony: all those books, and no eyes to read them. He kept writing by dictating."
      - type: card
        chip: "Did you know?"
        text: "Borges was nominated for the Nobel again and again, and never won. He's said to have joked that not giving it to him had become a Scandinavian tradition."
      - type: card
        text: "**Julio Cortázar**'s novel **Rayuela**, Hopscotch, can be read straight through, or by jumping between chapters along a map he gives you. It made him an idol for students."
      - type: card
        text: "**Alfonsina Storni** was a feminist poet of the 1920s. She died in the sea at Mar del Plata, and the song **“Alfonsina y el mar”** keeps her alive."
      - type: choice
        prompt: "**María Elena Walsh** wrote the songs every Argentine kid sings. Her most famous is about Manuelita. Who's Manuelita?"
        options:
          - "A turtle who travels to Paris"
          - "A cow who dreams of tango"
          - "A girl who talks to the moon"
        correct: 0
        explain: "Parents who sang **“Manuelita vivía en Pehuajó…”** as kids now sing it to theirs, word for word. At a kids' party, the adults sing loudest."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "inventos-y-nobeles"
    title: "Inventions and Nobels"
    summary: "A Hungarian's pen, a murder in Necochea, a Nobel's sauce and a heart surgeon"
    pages:
      - type: card
        text: "In Argentina a ballpoint pen is a **birome**. **László Bíró**, a Hungarian journalist, patented it here in the 1940s with his partner **Juan Jorge Meyne**. Bi-ró plus Me-yne: birome."
      - type: choice
        prompt: "Who was the birome's first big customer?"
        options:
          - "The British air force"
          - "The Argentine post office"
          - "A chain of Buenos Aires banks"
        correct: 0
        explain: "Unlike fountain pens, it didn't leak at high altitude. Argentina is so proud that Bíró's birthday is the **Día del Inventor**."
      - type: card
        text: "In 1892, in the town of **Necochea**, two children were murdered. Their mother blamed a neighbor."
      - type: choice
        prompt: "How did the police crack the case?"
        options:
          - "A bloody fingerprint on a door"
          - "A letter in the mother's handwriting"
          - "A neighbor who saw her at the window"
        correct: 0
        explain: "Using the new system of **Juan Vucetich**, a Croatian immigrant at the La Plata police, the print matched the mother. The first crime in the world solved with fingerprints."
      - type: card
        text: "In 1914 a Buenos Aires doctor, **Luis Agote**, did one of the first transfusions with blood kept in a flask, not straight from the donor's arm. A pinch of sodium citrate stopped it from clotting."
      - type: card
        text: "Argentina has five Nobel prizes. **Luis Leloir** won chemistry for his work on how the body handles sugars."
      - type: choice
        prompt: "The story goes that young Leloir also invented something now on every Argentine table. What?"
        options:
          - "Salsa golf: mayo mixed with ketchup"
          - "Dulce de leche sold in a jar"
          - "The classic chimichurri recipe"
        correct: 0
        explain: "At a golf club in Mar del Plata, so the legend says. Nobody can prove it, and everyone loves telling it."
      - type: card
        text: "**René Favaloro** spent years as a country doctor in La Pampa. Then, in Cleveland, he helped pioneer the heart **bypass**, now used worldwide. Back home, he built one of the country's top heart hospitals."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "iconos-de-hoy"
    title: "Modern icons"
    summary: "A Pope who rode the subte, the Generación Dorada, Vilas and two Oscars"
    pages:
      - type: card
        text: "**Jorge Bergoglio** grew up in **Flores**, Buenos Aires, and as archbishop rode the subte. In 2013 he became **Pope Francis**, the first Pope from the Americas."
      - type: choice
        prompt: "Pope Francis was a card-carrying member of something very Argentine. What?"
        options:
          - "The San Lorenzo football club"
          - "A tango orchestra in Flores"
          - "The national chess federation"
        correct: 0
        explain: "A paying **socio** of San Lorenzo, and he kept his membership as Pope."
      - type: card
        text: "At home he divided people: many adored him, others disliked his politics. And as Pope he never came back to visit. People still argue about why."
      - type: card
        text: "**Manu Ginóbili**, from **Bahía Blanca**, won four NBA titles with San Antonio and led the **Generación Dorada** to Olympic gold, beating the USA on the way. In a football country, nobody saw it coming."
      - type: card
        text: "In 1977 **Guillermo Vilas** had a magical tennis season and won almost everything. He made tennis popular in Argentina."
      - type: choice
        prompt: "So where did the official ranking put Vilas that year?"
        options:
          - "Number 2"
          - "Number 1"
          - "Outside the top 10"
        correct: 0
        explain: "The computer kept him behind Jimmy Connors. Plenty of Argentines never accepted it, and a Netflix documentary reopened the fight."
      - type: card
        text: "Argentina has two Oscars for foreign-language film: **La historia oficial** and **El secreto de sus ojos**. The second stars **Ricardo Darín**, the face of Argentine cinema."
      - type: card
        chip: "Pro tip"
        text: "A friend says **“¿Vemos una peli de Darín?”** Say yes. *Nueve reinas*, *Relatos salvajes*, *Argentina, 1985*: you're in safe hands."
    vocabulary: []
