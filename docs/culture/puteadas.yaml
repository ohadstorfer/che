section:
  slug: "puteadas"
  title: "Puteadas"
  emoji: "🤬"
  summary: "Argentine swearing: what it means, and when to keep your mouth shut"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "boludo"
    title: "Boludo, the word that does everything"
    summary: "Greeting, insult, punctuation: one word, many jobs"
    pages:
      - type: card
        text: "A **puteada** is a swear or an insult. Argentines swear a lot, and often with love. The goal here: understand them, and know when to keep quiet."
      - type: choice
        prompt: "First week at a new job. A coworker your age says: **“Che, boludo, ¿venís a almorzar?”** What does it tell you?"
        options:
          - "He thinks you messed something up"
          - "He's already treating you as a friend"
          - "He's testing whether you'll push back"
        correct: 1
        explain: "Between people who get along, **boludo** is closer to “dude” than to “idiot”. Here's how that happened."
      - type: card
        text: "**Boludo** literally means big-balled: an idiot. But between friends it softened into “dude”. **¿Qué hacés, boludo?** is just “What's up, man?”"
      - type: card
        chip: "Did you know?"
        text: "Some porteños use it like a comma: **“Fui al súper, boludo, y no había nada, boludo.”**"
      - type: card
        text: "Same word, said slowly with a stare, is still an insult. From a local friend it's warm. From a stranger with an accent, it can land like a slap."
      - type: choice
        prompt: "Boludo has a longer cousin: **pelotudo**. Compared with boludo, how does it land?"
        options:
          - "Softer, almost cute"
          - "Harsher, rarely friendly"
          - "Exactly the same"
        correct: 1
        explain: "**Boludo** can be love. **Pelotudo** rarely is."
      - type: card
        text: "**¡Qué pelotudo!** means “What an idiot!”, and it's meant. Understand it, never say it."
      - type: card
        chip: "Pro tip"
        text: "Say boludo only once your friends say it to you. Never to a waiter, a driver or someone you just met."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "gil-forro-chanta"
    title: "Gil, forro, chanta: the cast of characters"
    summary: "The people Argentines love to complain about"
    pages:
      - type: card
        text: "Argentines love complaining about certain kinds of people, and each kind has a name. Meet the cast."
      - type: choice
        prompt: "A taxi driver charges you triple because you're a tourist, and you pay. What does your Argentine friend call you, lovingly?"
        options:
          - "Chanta"
          - "Forro"
          - "Gil"
        correct: 2
        explain: "You got fooled, so you're the **gil**: the sucker. **No seas gil** means don't be a sucker."
      - type: card
        text: "It's old tango slang: the gil got scammed, the **vivo** did the scamming. Rude, but mild enough to tease friends with."
      - type: card
        text: "The **chanta** is all talk: brags, promises, never delivers. The plumber who says **“mañana vengo”** for three weeks? Chanta."
      - type: choice
        prompt: "Of these three, which one hurts most when said to someone's face?"
        options:
          - "Forro"
          - "Gil"
          - "Chanta"
        correct: 0
        explain: "**Forro**, by far. Here's why."
      - type: card
        text: "**Forro** means lining, and it's slang for condom. Said to a person, it means mean or disloyal. It's about character, not brains. Understand it, never say it."
      - type: card
        text: "The friend who won't stop bugging you is a **rompebolas**: a ball-breaker. Between friends it's a jokey complaint, not a war."
      - type: card
        chip: "Pro tip"
        text: "With a stranger, none of these. When in doubt, laugh and keep quiet: you'll sound more local than any puteada."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "la-puta-madre"
    title: "La puta madre: pure frustration"
    summary: "The exclamations for when everything goes wrong"
    pages:
      - type: card
        text: "Stub your toe, miss the bus, see the inflation numbers: **¡La puta madre!** Nobody's mother is involved. It's just “damn it!”, aimed at the universe."
      - type: card
        text: "It comes in levels: **la puta que lo parió**, then the maximum, **la re puta que lo parió**. Or just a long, tired **“la puta…”**"
      - type: choice
        prompt: "You tell your friend you met Messi at the airport. She laughs: **“¡Andá a cagar!”**, literally “go take a shit”. What does she mean?"
        options:
          - "“Get lost, I'm done with you”"
          - "“No way, you're kidding!”"
          - "“Stop bragging, it's rude”"
        correct: 1
        explain: "Laughing plus big news means disbelief. Said cold, with a door closing, the same words mean “get lost”."
      - type: card
        text: "**La concha de tu madre** is the heavy one, very vulgar. Shouted at nobody after your phone hits the floor, it's frustration. Aimed at a person, it's a serious insult."
      - type: card
        chip: "Did you know?"
        text: "**Me chupa un huevo** (egg = testicle) means “I couldn't care less”. Really don't care? **Me chupa un huevo y la mitad del otro.**"
      - type: choice
        prompt: "Around kids and grandmas, Argentines swap **mierda** for a harmless word that sounds similar. Which one?"
        options:
          - "¡Mercado!"
          - "¡Mirá vos!"
          - "¡Miércoles!"
        correct: 2
        explain: "**¡Miércoles!** Wednesday. Everyone knows what you meant, and nobody's offended."
      - type: card
        chip: "Pro tip"
        text: "Same trick for la puta: **¡la pucha!** Safe with kids, bosses and grandmas, and it still sounds like you mean it."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "leer-el-contexto"
    title: "Reading the room"
    summary: "The stadium, the traffic, and your partner's grandma"
    pages:
      - type: card
        text: "At **la cancha**, swearing is a sport. The referee hears **“¡Cobrá, referí!”** plus a few mothers. Some fans joke it's part of the ticket price."
      - type: card
        text: "Careful with the chants, though. Many carry slurs about gay people or other nationalities, and the pushback is growing. Clap and jump; the words can wait."
      - type: choice
        prompt: "In Qatar, shy, polite Messi snapped at a Dutch player on live TV: **“¿Qué mirás, bobo?”** What happened next?"
        options:
          - "It ended up on T-shirts and mugs"
          - "FIFA banned him for a match"
          - "He apologized on Dutch TV"
        correct: 0
        explain: "**Bobo** is mild, almost childish, which made it even funnier. Within days it was a national catchphrase."
      - type: card
        text: "Buenos Aires traffic turns saints into sailors. Green light, one second: **¡Dale, boludo!** Cut off: **¿Quién te dio el registro?**, who gave you a license? Usually it's just venting."
      - type: card
        text: "Before you swear, ask: would I say this in front of my partner's grandma? With close friends, go ahead. With your boss, a cop or a stranger, keep it clean."
      - type: choice
        prompt: "In 2009, right after qualifying for the World Cup, coach Maradona told journalists on live TV: **“que la chupen”**, suck it. What happened?"
        options:
          - "FIFA banned him for two months"
          - "He was fired the next week"
          - "Nothing: nobody even blinked"
        correct: 0
        explain: "FIFA suspended him and fined him. Argentines, meanwhile, turned the line into a classic."
      - type: card
        chip: "Pro tip"
        text: "Swearing badly makes you sound rude. Swearing well makes you sound local. It's all in the timing."
    vocabulary: []
