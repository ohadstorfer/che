section:
  slug: "alfajores"
  title: "Alfajores y dulces"
  emoji: "🍪"
  summary: "Dulce de leche, facturas and what to buy at the kiosco"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "dulce-de-leche"
    title: "Dulce de leche and friends"
    summary: "The spread on everything, and the sweets it hangs out with"
    pages:
      - type: card
        text: "**Dulce de leche** is milk and sugar cooked slowly for hours until thick and brown. On toast, in cakes, straight from the jar with a spoon at midnight."
      - type: card
        text: "Just don't call it caramel. Caramel is cooked sugar. [Dulce de leche] is mostly milk, and Argentines will correct you."
      - type: choice
        prompt: "Legend says [dulce de leche] was invented by accident in 1829. How?"
        options:
          - "A maid forgot the milk on the stove"
          - "A soldier left sugar in his canteen"
          - "A baker burned a batch of flan"
        correct: 0
        explain: "The story goes: a ranch in Cañuelas, the future governor Rosas meeting his rival Lavalle to sign a truce, and a maid so caught up in the drama she forgot the pot."
      - type: card
        text: "Cute story, almost certainly a legend. Uruguay, Chile, France and others claim [dulce de leche] too. Uruguay, loudly."
      - type: card
        text: "At the supermarket, **clásico** is soft, for toast and the spoon. **Repostero** is firmer, for baking: it holds its shape inside alfajores without dripping."
      - type: choice
        prompt: "The **chocotorta** is the classic birthday cake. How long does it spend in the oven?"
        options:
          - "No time at all"
          - "About forty minutes"
          - "Two hours, slowly"
        correct: 0
        explain: "Zero. Chocolinas cookies dipped in milk or coffee, layered with dulce de leche mixed with cream cheese. Into the fridge, done."
      - type: card
        text: "Two more to know: **pastafrola**, a lattice tart filled with quince or sweet potato paste, and **Mantecol**, a crumbly peanut sweet, a bit like halva, that is on the table every Christmas."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "que-es-un-alfajor"
    title: "What is an alfajor?"
    summary: "Two cookies, dulce de leche in the middle, and a very long trip"
    pages:
      - type: card
        text: "An **alfajor** is two soft cookies stuck together with a filling, usually [dulce de leche], often dipped in chocolate. That's all it is, and the whole country loves it."
      - type: choice
        prompt: "Where do the [alfajor]'s name and ancestor come from?"
        options:
          - "Muslim Spain"
          - "Colonial Peru"
          - "Southern Italy"
        correct: 0
        explain: "The name comes from Andalusian Arabic. In al-Ándalus it was a honey, almond and spice sweet, and Andalucía still makes it today. The cookie sandwich came later, in the Americas."
      - type: card
        text: "The Spanish brought the name across the ocean, and here it became cookies plus [dulce de leche]. Argentina just, humbly, perfected it."
      - type: card
        text: "Every region has its own. **De maicena** is the one your [abuela] makes: crumbly cornstarch cookies, [dulce de leche], edges rolled in grated coconut."
      - type: card
        text: "**Marplatense**: dipped in chocolate, the [kiosco] classic. **Santafesino**: crunchy layers, white sugar glaze. **Cordobés**: soft, glazed, often filled with fruit jam."
      - type: choice
        prompt: "Industry estimates count how many alfajores Argentines eat. How many a day?"
        options:
          - "Six million or more"
          - "Around sixty thousand"
          - "Around six hundred thousand"
        correct: 0
        explain: "Estimates start at about six million a day, and some recent ones are much higher. That's at least one for every eight people, every single day."
      - type: card
        chip: "Pro tip"
        text: "Skipped lunch? Ask for a **triple**: three cookies, two layers of [dulce de leche]. More [alfajor] per [alfajor]."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "marcas-y-kioscos"
    title: "Brands, kioscos and the eternal debate"
    summary: "Havanna or Jorgito? Pick a side at the kiosco on the corner"
    pages:
      - type: card
        text: "Every block has a **kiosco**: a tiny shop selling candy, drinks, phone credit and, above all, alfajores. Many stay open late, some never close: look for **24 hs**."
      - type: choice
        prompt: "For years, kioscos often had no coins for your change. What did you get instead?"
        options:
          - "A few candies"
          - "A note saying they owe you"
          - "A bus token"
        correct: 0
        explain: "During years of coin shortages, **caramelos**, candies, became the unofficial small change. Today coins are almost gone, and most people pay with a QR code or a card."
      - type: card
        text: "Late at night, many kioscos serve through a small window or a grille, **la reja**. Ask, pay, done."
      - type: card
        text: "To buy one, say **“¿Me das un alfajor?”** To ask the price: **“¿Cuánto sale?”** You may get a question back: **“¿Negro o blanco?”**, dark or white chocolate."
      - type: choice
        prompt: "You're meeting your partner's family for the first time. Which alfajores do you bring?"
        options:
          - "A box of Havanna"
          - "A box of Guaymallén"
          - "A box of Jorgitos"
        correct: 0
        explain: "**Havanna**, from Mar del Plata, is the expensive one: the box you bring as a gift."
      - type: card
        text: "**Jorgito** and **Guaymallén** are the everyday [kiosco] alfajores: cheap and much loved. Ask a table which [alfajor] is the best and the argument can last all afternoon."
      - type: card
        chip: "Did you know?"
        text: "There's even a **Mundial del Alfajor**, held in Buenos Aires. A “world” championship for a snack that almost only Argentina eats. Very Argentine."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "facturas"
    title: "Facturas: anarchy at the bakery"
    summary: "Medialunas, bolas de fraile and the rebel bakers who named them"
    pages:
      - type: card
        text: "**Facturas** are the sweet pastries from the **panadería**, bought by the dozen and wrapped in paper. Everyone mixes their own dozen, and everyone has a favorite."
      - type: card
        text: "You choose one by one, pointing. Or say **“una docena surtida”**, a mixed dozen, or **“media docena”**, half a dozen. In a busy bakery, take a number at the door first."
      - type: choice
        prompt: "The queen is the **medialuna**, a small croissant. There are two kinds. How do you tell them apart at a glance?"
        options:
          - "Butter ones are plump and shiny"
          - "Butter ones are straight, not curved"
          - "Fat ones have sesame on top"
        correct: 0
        explain: "**De manteca**, with butter: plump, soft and shiny with syrup. **De grasa**, with beef fat: thinner, flakier, no shine."
      - type: card
        text: "**De manteca** is the sweet one. **De grasa** is drier and a little salty. Which is better is a national debate."
      - type: choice
        prompt: "Pastries here have names like “friar's balls”, “sacraments” and “little cannons”. Who named them, the story goes?"
        options:
          - "Anarchist bakers"
          - "Nuns selling for charity"
          - "A radio comedian"
        correct: 0
        explain: "In 1887 Buenos Aires bakers, many of them Italian and Spanish anarchists, founded their first union. The story goes that during a strike in 1888 they named pastries to mock the Church, the army and the police."
      - type: card
        text: "The **vigilante**, the cop, is long like a police baton. **Bolas de fraile** and **sacramentos** tease the Church. **Cañoncitos**, little cannons, go after the army."
      - type: card
        chip: "Did you know?"
        text: "Historians debate how much of this story is documented. But it's the one every baker will tell you."
      - type: card
        chip: "Pro tip"
        text: "Going to a friend's for [mate] in the afternoon? Stop at the [panadería] for **una docena de facturas**. Nobody has ever said no."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "postres-caseros"
    title: "¿Qué hay de postre?"
    summary: "Flan mixto, a cop's dessert and the other homemade classics"
    pages:
      - type: card
        text: "Sunday lunch is over and someone asks the big one: **¿qué hay de postre?** At home or at a **bodegón**, an old-school restaurant, the answer is a homemade classic."
      - type: card
        text: "**Flan** is egg custard with caramel. Here it rarely comes alone: with [dulce de leche], with whipped cream, or both. Both is **mixto**: **“Un flan mixto, por favor.”**"
      - type: choice
        prompt: "The [bodegón] menu offers **postre vigilante**. What arrives?"
        options:
          - "Cheese with quince paste"
          - "The long pastry from the bakery"
          - "Ice cream with dulce de leche"
        correct: 0
        explain: "Also called **queso y dulce**: a slice of cheese with quince or sweet potato paste. The story goes police from a station in Palermo ordered it in the 1920s: cheap, quick, and easy to eat with one hand."
      - type: card
        text: "**Budín de pan** is bread pudding made from yesterday's bread, milk, eggs and caramel. Immigrant thrift turned into dessert."
      - type: card
        text: "**Arroz con leche** is rice slowly cooked in milk with sugar, lemon peel and cinnamon. It's also the name of a song every kid knows."
      - type: choice
        prompt: "What's the kids' song **“Arroz con leche”** actually about?"
        options:
          - "Wanting to get married"
          - "A grandma's secret recipe"
          - "A kid sent to buy milk"
        correct: 0
        explain: "**“Arroz con leche, me quiero casar…”**: rice pudding, I want to get married. It's a circle game. The pudding just opens the song."
      - type: card
        text: "**Panqueques** here are thin crêpes rolled around [dulce de leche]. Some parrillas serve them **quemados**, with the sugar burnt crunchy on top."
      - type: card
        chip: "Pro tip"
        text: "Too full for your host's flan? Say **“un poquito nomás”**, just a little bit. Saying no is not an option."
    vocabulary: []
