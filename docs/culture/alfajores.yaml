section:
  slug: "alfajores"
  title: "Alfajores y dulces"
  emoji: "🍪"
  summary: "Dulce de leche, kioscos and the snack that runs on sugar"

# Card classes (docs/culture-spec.md, "Card classes"): one idea per big card,
# 2–3 guess-first questions, no word review.
classes:
  # ─────────────────────────────────────────────────────────────
  - slug: "dulce-de-leche"
    title: "Dulce de leche and friends"
    summary: "The spread on everything, and the sweets it hangs out with"
    pages:
      - type: card
        text: "**Dulce de leche** is milk and sugar cooked slowly for hours until thick and brown. On toast, in cakes, straight from the jar with a spoon at midnight."
      - type: card
        text: "Just don't call it caramel. Say that to an Argentine and watch their face fall."
      - type: choice
        prompt: "Legend says dulce de leche was invented by accident in 1829. How?"
        options:
          - "A maid forgot the milk on the stove"
          - "A soldier left sugar in his canteen"
          - "A baker burned a batch of flan"
        correct: 0
        explain: "The story goes: a ranch in Cañuelas, the governor Rosas meeting his rival Lavalle to sign a truce, and a maid so caught up in the drama she forgot the pot."
      - type: card
        text: "Cute story, almost certainly a legend. Uruguay, Chile, France and others claim dulce de leche too. Uruguay, loudly."
      - type: card
        text: "At the supermarket, **clásico** is soft, for toast and the spoon. **Repostero** is firmer, for baking: it holds its shape inside alfajores without dripping."
      - type: choice
        prompt: "The **chocotorta** is the classic birthday cake. How long does it spend in the oven?"
        options:
          - "No time at all"
          - "About forty minutes"
          - "Two hours, slowly"
        correct: 0
        explain: "Zero. Chocolinas cookies dipped in milk, layered with dulce de leche mixed with cream cheese. Into the fridge, done."
      - type: card
        text: "Two more to know: **pastafrola**, a lattice tart with quince or sweet potato jam, and **Mantecol**, a peanut nougat bar people get weirdly emotional about."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "que-es-un-alfajor"
    title: "What is an alfajor?"
    summary: "Two cookies, dulce de leche in the middle, and a very long trip"
    pages:
      - type: card
        text: "An **alfajor** is two soft cookies stuck together with a filling, usually dulce de leche, often dipped in chocolate. That's it. That's the whole religion."
      - type: choice
        prompt: "Where was the alfajor born?"
        options:
          - "In Muslim Spain"
          - "In colonial Peru"
          - "In southern Italy"
        correct: 0
        explain: "The name comes from Andalusian Arabic. In al-Ándalus it was a honey, almond and spice sweet, and Andalucía still makes it today."
      - type: card
        text: "The Spanish brought the name across the ocean, and here it became cookies plus dulce de leche. Argentina just, humbly, perfected it."
      - type: card
        text: "Every region has its own. **De maicena** is the one your abuela makes: crumbly cornstarch cookies, dulce de leche, edges rolled in grated coconut."
      - type: card
        text: "**Marplatense**: dipped in chocolate, the kiosco classic. **Santafesino**: crunchy layers, white sugar glaze. **Cordobés**: soft, glazed, often filled with fruit jam."
      - type: choice
        prompt: "Industry estimates count how many alfajores Argentines eat. How many a day?"
        options:
          - "Around six million"
          - "Around sixty thousand"
          - "Around six hundred thousand"
        correct: 0
        explain: "About six million a day, by the industry's own estimate. That's roughly one for every eight people, every single day."
      - type: card
        chip: "Pro tip"
        text: "Skipped lunch? Ask for a **triple**: three cookies, two layers of dulce de leche. More alfajor per alfajor."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "marcas-y-kioscos"
    title: "Brands, kioscos and the eternal debate"
    summary: "Havanna or Jorgito? Pick a side at the kiosco on the corner"
    pages:
      - type: card
        text: "Every block has a **kiosco**: a tiny shop selling candy, drinks, phone credit and, above all, alfajores. Many stay open late, some never close: look for **24 hs**."
      - type: choice
        prompt: "The kiosco has no coins for your change. What might you get instead?"
        options:
          - "A few candies"
          - "An IOU on a napkin"
          - "A bus token"
        correct: 0
        explain: "During years of coin shortages, **caramelos** became the unofficial small change. Some kioscos still do it."
      - type: card
        text: "Some kioscos are literally a **ventanita**, a little window in someone's house. Knock, ask, pay, done."
      - type: choice
        prompt: "You're meeting your partner's family for the first time. Which alfajores do you bring?"
        options:
          - "A box of Havanna"
          - "A box of Guaymallén"
          - "A box of Jorgitos"
        correct: 0
        explain: "**Havanna**, from Mar del Plata, is the fancy one: the box you bring as a gift."
      - type: card
        text: "**Jorgito** and **Guaymallén** are the everyday kiosco heroes: cheap, humble, legendary. Beloved, but a coins-in-your-pocket snack, not a meet-the-parents gift."
      - type: card
        text: "Ask a table “which is the best alfajor?” and clear your afternoon. Some swear by Havanna. Others call it overpriced and grab a humble **Guaymallén**."
      - type: card
        chip: "Did you know?"
        text: "There's even a **Mundial del Alfajor**, held in Buenos Aires. A “world” championship for our own snack: peak Argentina."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "facturas"
    title: "Facturas: anarchy at the bakery"
    summary: "Medialunas, bolas de fraile and the rebel bakers who named them"
    pages:
      - type: card
        text: "**Facturas** are the sweet pastries from the **panadería**, bought by the dozen in a paper bag. Everyone mixes their own dozen, and everyone has a favorite."
      - type: choice
        prompt: "The queen is the **medialuna**, a small croissant. There are two kinds. How do you tell them apart at a glance?"
        options:
          - "Butter ones curve, fat ones are straight"
          - "Butter ones are twice as big"
          - "Fat ones have sesame on top"
        correct: 0
        explain: "The old rule: **manteca curva, grasa recta**. Lots of bakeries still shape them that way."
      - type: card
        text: "**De manteca**, with butter, is sweet and glazed. **De grasa**, with beef fat, is drier and a little salty. Which is better is a national debate."
      - type: choice
        prompt: "Pastries here have names like “friar's balls” and “nun's sighs”. Who named them, the story goes?"
        options:
          - "Anarchist bakers"
          - "Nuns selling for charity"
          - "A radio comedian"
        correct: 0
        explain: "In 1887 Buenos Aires bakers, many of them Italian and Spanish anarchists, founded their first union. The story goes they named pastries to mock the Church, the army and the police."
      - type: card
        text: "The **vigilante**, the cop, is long like a police baton. **Bolas de fraile** and **suspiros de monja** tease the Church. **Cañoncitos**, little cannons, go after the army."
      - type: card
        chip: "Did you know?"
        text: "Historians debate how much of this story is documented. But it's the one every baker will tell you."
      - type: card
        chip: "Pro tip"
        text: "Going to a friend's for mate in the afternoon? Stop at the panadería for **una docena de facturas**. Nobody has ever said no."
    vocabulary: []

  # ─────────────────────────────────────────────────────────────
  - slug: "postres-caseros"
    title: "¿Qué hay de postre?"
    summary: "Flan mixto, a cop's dessert and the rest of the abuela's menu"
    pages:
      - type: card
        text: "Sunday lunch is over and someone asks the big one: **¿qué hay de postre?** At home or at a **bodegón**, an old-school restaurant, the answer is a homemade classic."
      - type: card
        text: "**Flan** is egg custard with caramel. Here it rarely comes alone: with dulce de leche, with whipped cream, or both. Both is **mixto**, and it's the right answer."
      - type: choice
        prompt: "The bodegón menu offers **postre vigilante**. What arrives?"
        options:
          - "Cheese with quince paste"
          - "The long pastry from the bakery"
          - "Ice cream with dulce de leche"
        correct: 0
        explain: "Also called **queso y dulce**: a slice of cheese with quince or sweet potato paste. The story goes police ordered it because it cost almost nothing."
      - type: card
        text: "**Budín de pan** is bread pudding made from yesterday's bread, milk, eggs and caramel. Immigrant thrift turned into dessert."
      - type: card
        text: "**Arroz con leche** is rice slowly cooked in milk with sugar, lemon peel and cinnamon. It's also the name of a song every kid knows."
      - type: choice
        prompt: "What's the kids' song **“Arroz con leche”** actually about?"
        options:
          - "Wanting to get married"
          - "A grandma's secret recipe"
          - "A kid sent to buy milk"
        correct: 0
        explain: "**“Arroz con leche, me quiero casar…”**: rice pudding, I want to get married. It's a circle game. The pudding just opens the song."
      - type: card
        text: "**Panqueques** here are thin crêpes rolled around dulce de leche. Some parrillas serve them **quemados**, with the sugar burnt crunchy on top."
      - type: card
        chip: "Pro tip"
        text: "Too full for the abuela's flan? Say **“un poquito nomás”**, just a little bit. Saying no is not an option."
    vocabulary: []
