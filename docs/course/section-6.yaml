# ---------------------------------------------------------------------------
# Che — Section 6 outline: "Plans and favours" (A2.3)
#
# The last stretch of A2: getting things done with other people. Asking a
# favour (¿me pasás la sal? ¿podrías…?), saying what has to be done (hay que,
# no hace falta), the verdulería by the kilo, the phone that dies at the worst
# moment, lending and giving back, a new job, going out with someone, the
# future the way Buenos Aires really uses it — to guess (¿dónde estará?) — and
# the doctor. The checkpoint is thanking and owing: te debo una.
#
# Plan: docs/course/roadmap.md §Section 6. New feature tags: `fut`, `cond`.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 6
  slug: "plans-and-favours"
  title: "Plans and favours"
  cefr: "A2.3"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "me-olvide"
    title: "Say what went wrong and how you felt"
    summary: "Me olvidé de su cumple"
    grammar:
      - "ponerse.pret"
      - "pronominales.pret"
    register_max: "informal"
    sample:
      es: "Me olvidé de su cumple y se enojó."
      en: "I forgot his birthday and he got angry."
    tips:
      - title: "Me olvidé de…"
        body: "**Me olvidé de su cumple** — *I forgot his birthday*. Like *me enojé* it keeps its
          pronoun, and takes **de** before what you forgot. Same shape: **me aburrí**, **me calmé**,
          **me enamoré** — of Buenos Aires, of course. For the others: **¿te olvidaste las
          llaves?**, **se olvidó de llamar**, **nos olvidamos de reservar**."
      - title: "Estaba or me puse?"
        body: "**Estaba nervioso** is how you were; **me puse nervioso** is the moment it hit you.
          **Me sentí re mal** — *I felt awful* — is one moment too. For *us*: **nos pusimos
          contentos**; and **me puse colorado** is *I blushed*. About someone else: **¿cómo se
          sintió tu vieja?**"
