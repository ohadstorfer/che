            en: "rented, used to rent"
            f: "sg.impf.ind"
          - form: "alquilar"
            f: "inf"
      - lemma: "pintar"
        pos: "verb"
        en: "to paint"
        forms:
          - form: "pintamos"
            en: "we painted"
            f: "1pl.pret.ind"
          - form: "pintar"
            f: "inf"
      - lemma: "dueño"
        pos: "noun"
        en: "owner, landlord"
        forms:
          - form: "dueño"
            f: "m.sg"
          - form: "dueña"
            f: "f.sg"
      - lemma: "inmobiliaria"
        pos: "noun"
        en: "real estate agency"
      - lemma: "alquiler"
        pos: "noun"
        en: "rent"
      - lemma: "flete"
        pos: "noun"
        en: "moving van"
      - lemma: "mueble"
        pos: "noun"
        en: "piece of furniture"
        forms:
          - form: "mueble"
            f: "m.sg"
          - form: "muebles"
            en: "furniture"
            f: "m.pl"
