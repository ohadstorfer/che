  - ordinal: 4
    slug: "hay-que-sacar-turno"
    title: "Find out what you need to bring"
    summary: "Tenés que llevar una fotocopia"
    grammar:
      - "obligacion.hay-que"
      - "necesitar"
      - "no-hace-falta"
    register_max: "informal"
    sample:
      es: "Hay que sacar turno por internet y tenés que llevar una fotocopia."
      en: "You have to book an appointment online, and you need to bring a photocopy."
    tips:
      - title: "Tenés que, tiene que, tienen que"
        body: "**Tener que** changes with the person: **tenés que firmar** — *you have to sign*; **tiene
          que venir ella** — *she has to come*; **tienen que esperar** — *they have to wait*. **Hay
          que** stays the same for everyone: **hay que hacer la fila**."
      - title: "Hace falta"
        body: "Drop the *no* and **hace falta** says what's needed: **hace falta una fotocopia**. **¿Es
          obligatorio?** — *is it required?* — is the question every porteño asks at the counter."
      - title: "Sacar turno"
        body: "Nothing happens in Buenos Aires without **sacar turno** — *booking an appointment*, almost
          always **por internet**. Then they **piden** things: **te piden una fotocopia**, **completá
          esto**."
    words:
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenés que"
            en: "you've got to"
            f: "2sg.pres.ind.vos"
          - form: "tiene que"
            en: "has to (he/she has to)"
            f: "3sg.pres.ind"
          - form: "tienen que"
            en: "they have to"
            f: "3pl.pres.ind"
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevar"
            en: "to take (along)"
            f: "inf"
      - lemma: "pedir"
        pos: "verb"
        forms:
          - form: "piden"
            en: "they ask for"
            f: "3pl.pres.ind.irregular"
      - lemma: "hace falta"
        pos: "phrase"
        en: "it's needed, is needed"
      - lemma: "obligatorio"
        pos: "adj"
        en: "mandatory, required"
        forms:
          - form: "obligatorio"
            f: "m.sg"
          - form: "obligatoria"
            f: "f.sg"
      - lemma: "fila"
        pos: "noun"
        en: "line, queue"
      - lemma: "firmar"
        pos: "verb"
        en: "to sign"
        forms:
          - form: "firmar"
            f: "inf"
          - form: "firmá"
            en: "sign"
            f: "2sg.imp.vos"
      - lemma: "completar"
        pos: "verb"
        en: "to fill in"
        forms:
          - form: "completar"
            f: "inf"
          - form: "completá"
            en: "fill in"
            f: "2sg.imp.vos"
      - lemma: "fotocopia"
