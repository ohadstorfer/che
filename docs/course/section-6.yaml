      - title: "Any verb can wonder"
        body: "**¿Qué hará?** — *I wonder what he's up to*; **¿cuánto costará?** — *I wonder how much it
          is*; **vendrá más tarde** — *she'll probably come later*. For a group: **estarán en el bar**,
          **serán las ocho**. To vos: **¿estarás cansado?** — *you must be tired*."
      - title: "Hará, vendrá, podrá"
        body: "The irregular ones squeeze the verb: *hacer* → **hará**, *venir* → **vendrá**, *poder* →
          **podrá**, *querer* → **querrá**. The ending is always **-á** for él and ella."
      - title: "A lo mejor, supongo"
        body: "The same guess in the present: **a lo mejor** — *maybe*; **supongo que sí** — *I suppose
          so*; **probablemente** — *probably*."
