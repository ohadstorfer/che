    sample:
      es: "¿Me acompañás? Esperame un toque."
      en: "Will you come with me? Wait a sec."
    tips:
      - title: "More favours, same question"
        body: "Still a plain question in the present with **me** in front: **¿me acompañás?** — *will
          you come with me?*; **¿me llevás?** — *can you give me a lift?*; **¿me regás las plantas?** —
          *can you water my plants?* Asking for two of you? Swap *me* for **nos**: **¿nos sacás una
          foto?**"
      - title: "Prendé, apagá"
        body: "Between friends a bare vos command is polite enough: **prendé la luz**, **apagá la tele**.
          With a pronoun it joins the end, like *ayudame*: **acompañame**, **llevame**."
      - title: "Un toque, de paso"
