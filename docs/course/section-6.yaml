  - ordinal: 8
    slug: "donde-estara"
    title: "Guess and wonder"
    summary: "¿Dónde estará?"
    grammar:
      - "futuro.conjetura"
      - "futuro.ser-estar-tener"
    register_max: "informal"
    sample:
      es: "¿Dónde estará Juan? Estará en el laburo."
      en: "Where can Juan be? He's probably at work."
    tips:
      - title: "The future that guesses"
        body: "For plans porteños say *voy a*. The future tense is for **guessing**: **¿dónde estará?** —
          *where can he be?*; **estará en el laburo** — *he's probably at work*."
      - title: "Será"
        body: "**¿Qué hora será?** — *I wonder what time it is*. **Será** on its own shrugs: *could be*."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estará"
            en: "will be, is probably"
            f: "3sg.fut.ind"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "será"
            en: "will be, can be"
            f: "3sg.fut.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tendrá"
            en: "will have, probably has"
            f: "3sg.fut.ind.irregular"
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "habrá"
            en: "there will be, there's probably"
            f: "3sg.fut.ind.irregular"
      - lemma: "capaz"
        pos: "adv"
        en: "maybe"
      - lemma: "quizás"
        pos: "adv"
        en: "perhaps"
      - lemma: "seguro que"
        pos: "phrase"
        en: "I bet, surely"

  - ordinal: 9
    slug: "me-siento-mal"
    title: "See the doctor"
    summary: "Me siento mal"
    grammar:
      - "sentirse"
      - "salud.receta-obra-social"
    register_max: "informal"
    sample:
      es: "Me siento mal, tengo tos y fiebre."
      en: "I feel ill, I've got a cough and a temperature."
    tips:
      - title: "Me siento"
        body: "**Me siento mal** — *I feel ill*; **¿cómo te sentís?** — *how do you feel?* On its own,
          **lo siento** is *I'm sorry*."
      - title: "La obra social"
        body: "Your health insurance is your **obra social**; the doctor writes a **receta** and you take
          the **pastillas** **cada ocho horas**."
