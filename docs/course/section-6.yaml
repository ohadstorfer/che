    register_max: "informal"
    sample:
      es: "Estoy saliendo con alguien del laburo."
      en: "I'm seeing someone from work."
    tips:
      - title: "Salir con"
        body: "**Estoy saliendo con alguien** — *I'm seeing someone*. When it ends, porteños **cortan**:
          **cortamos** — *we broke up*."
      - title: "Alguien, nadie"
        body: "**Alguien** is *someone*, **nadie** is *nobody* — and Spanish keeps the *no* as well: **no
          vino nadie**."
