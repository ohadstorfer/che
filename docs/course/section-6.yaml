      - lemma: "olvidarse"
        pos: "verb"
        en: "to forget"
        forms:
          - form: "me olvidé"
            en: "I forgot"
            f: "1sg.pret.ind.clitic"
          - form: "olvidé"
            f: "1sg.pret.ind"
            bound: true
          - form: "te olvidaste"
            en: "you forgot"
            f: "2sg.pret.ind.vos.clitic"
          - form: "se olvidó"
            en: "he forgot, she forgot"
            f: "3sg.pret.ind.clitic"
          - form: "nos olvidamos"
            en: "we forgot"
            f: "1pl.pret.ind.clitic"
          - form: "olvidaste"
            f: "2sg.pret.ind.vos"
            bound: true
