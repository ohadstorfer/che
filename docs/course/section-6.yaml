  - ordinal: 6
    slug: "cien-gramos-de-jamon"
    title: "Shop at the feria and the deli"
    summary: "Cien gramos de jamón"
    grammar:
      - "cantidades.kilo-docena"
      - "precio.cuanto-esta"
    register_max: "informal"
    sample:
      es: "Dame cien gramos de jamón y medio kilo de naranjas."
      en: "Give me a hundred grams of ham and half a kilo of oranges."
    tips:
      - title: "Gramos, litros"
        body: "At the fiambrería you buy by the **gramo**: **cien gramos de jamón**, cut in **fetas** —
          *slices*. Milk comes by the **litro**. At the **feria**, the street market, it's still the
          kilo: **medio kilo de frutillas**."
      - title: "¿Algo más?"
        body: "The vendor always asks **¿algo más?** — *anything else?* You answer **nada más,
          gracias**, or keep going: **y un kilo de naranjas**."
      - title: "Palta, frutilla"
        body: "Buenos Aires has its own names: **palta** is avocado, **frutilla** is strawberry. Before
          you buy, ask **¿están maduras?** — *are they ripe?*"
    words:
