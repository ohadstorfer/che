  - ordinal: 9
    slug: "las-figuritas"
    title: "Share childhood memories"
    summary: "No me acordaba de la calesita"
    grammar:
      - "acordarse"
      - "repaso.imperfecto-preterito"
    register_max: "informal"
    sample:
      es: "No me acordaba de la calesita de la plaza."
      en: "I'd forgotten about the merry-go-round in the square."
    tips:
      - title: "Acordarse de"
        body: "What you remember takes **de**: **mi abuela se acuerda de todo**; **nos acordamos de esa
          época**. **No me acordaba** — *I'd forgotten* — is imperfect: the not-remembering went on
          until someone brought it up."
      - title: "Every porteño childhood"
        body: "The **calesita** in the plaza, **golosinas** from the kiosco, a **barrilete** on a windy day,
          and the **álbum** of **figuritas** you filled for every **Mundial** — **lo llenábamos
          entre todos**."
