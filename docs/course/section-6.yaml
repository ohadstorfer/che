  - ordinal: 13
    slug: "un-ratito"
    title: "Soften it with -ito"
    summary: "Esperame un ratito"
    grammar:
      - "diminutivo"
    register_max: "informal"
    sample:
      es: "Esperame un ratito."
      en: "Wait for me a moment."
    tips:
      - title: "-ito, -ita"
        body: "**-ito** makes things small, and requests smaller: **un ratito** — *a sec*; **un
          cafecito**; **un poquito**. It sounds kind rather than childish. It softens bad news and
          favours too: **tengo un problemita**, **una preguntita**."
      - title: "Cerquita, despacito"
        body: "It works on adverbs too: **cerquita** — *really close*; **despacito** — *nice and
          slow*. **Chiquito** — *tiny*. Careful: **hablá más despacito** usually means *keep your
          voice down*, not *slow down*."
