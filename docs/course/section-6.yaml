  - ordinal: 7
    slug: "donde-queda"
    title: "Talk about the barrios"
    summary: "¿Dónde queda Palermo?"
    grammar:
      - "quedar.ubicacion"
      - "barrios"
    register_max: "informal"
    sample:
      es: "¿Dónde queda San Telmo?"
      en: "Where's San Telmo?"
    tips:
      - title: "¿Dónde queda?"
        body: "For where a place *is*, porteños say **queda**: **¿dónde queda la farmacia?** — *where's the
          chemist?* — and **me queda cerca** — *it's close to me*."
      - title: "Capital y provincia"
        body: "The city is **la Capital**; the ring of towns around it, in the province, is **el
          conurbano**. Palermo, San Telmo and La Boca are all barrios of the Capital. Each barrio
          has its thing: **Palermo está lleno de bares**, **en San Telmo hay una feria los
          domingos**, **La Boca es re turística**. The first question to any porteño: **¿en qué
          barrio vivís?**"
    words:
