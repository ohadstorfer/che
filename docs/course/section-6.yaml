# ---------------------------------------------------------------------------
# Che — Section 6 outline: "Plans and favours" (A2.3)
#
# The last stretch of A2: getting things done with other people. Asking a
# favour (¿me pasás la sal? ¿podrías…?), saying what has to be done (hay que,
# no hace falta), the verdulería by the kilo, the phone that dies at the worst
# moment, lending and giving back, a new job, going out with someone, the
# future the way Buenos Aires really uses it — to guess (¿dónde estará?) — and
# the doctor. The checkpoint is thanking and owing: te debo una.
#
# Plan: docs/course/roadmap.md §Section 6. New feature tags: `fut`, `cond`.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

