    title: "Deal with your phone"
    summary: "Me quedé sin batería"
    grammar:
      - "tecnologia"
      - "se-corto"
    register_max: "informal"
    sample:
      es: "Me quedé sin batería, te llamo después."
      en: "My battery died, I'll call you later."
    tips:
      - title: "El celu"
        body: "The phone is **el celu** (short for *celular*). **Me quedé sin batería** — *my battery
          died*; **se cortó** — *it cut out*; **mandame la ubicación** — *send me your location*."
      - title: "La SUBE"
        body: "The card for the bus and the subte is **la SUBE**, and you **cargás** it at a kiosco — the
          same verb as charging a phone."
