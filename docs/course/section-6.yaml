  - ordinal: 7
    slug: "practica-los-mandados"
    title: "Practice: favors and errands"
    summary: "¿Me pasás la sal?"
    grammar:
      - "repaso.pedidos"
      - "repaso.obligacion"
    register_max: "informal"
    sample:
      es: "¿Me podrías ayudar? Hay que lavar los platos."
      en: "Could you help me? The dishes need washing."
    tips:
      - title: "Asking nicely"
        body: "**¿Me pasás la sal?** is how you ask at the table — a question in the present. **¿Podrías…?** is softer, for a bigger favor."
      - title: "Hay que, tenés que, no hace falta"
        body: "**Hay que** is *it has to be done* — nobody in particular. **Tenés que** is *you have to*. **No hace falta** is *there's no need*."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "pasame"
      - "ayudame"
      - "podrías"
      - "hay que"
      - "necesito"
      - "no hace falta"
      - "tenemos que"
      - "kilo"
      - "docena"
      - "pedí"
      - "iba"
      - "estaba"

  - ordinal: 8
    slug: "practica-la-feria"
    title: "Practice: favours, forms and the market"
    summary: "¿Me acompañás a la feria?"
    grammar:
      - "repaso.pedidos"
      - "repaso.obligacion"
      - "repaso.cantidades"
    register_max: "informal"
    sample:
      es: "¿Me acompañás a la feria? Necesito frutillas."
      en: "Will you come with me to the market? I need strawberries."
    tips:
      - title: "Me, nos"
        body: "**¿Me acompañás?** asks for you; **¿nos sacás una foto?** asks for the two of you. It stays
          a question in the present — the tone does the asking."
      - title: "Tenés que, hace falta"
        body: "**Tenés que llevar una fotocopia** — someone has to; **hace falta una fotocopia** —
          something is needed; **no hace falta** — relax."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
