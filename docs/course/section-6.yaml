  - ordinal: 22
    slug: "se-aceptan-tarjetas"
    title: "Read the signs in shop windows"
    summary: "Se aceptan tarjetas, se hacen envíos"
    grammar:
      - "se-pasiva"
      - "carteles"
    register_max: "informal"
    sample:
      es: "Se aceptan tarjetas, pero no se hacen envíos."
      en: "Cards accepted, but no deliveries."
    tips:
      - title: "Se aceptan, se hacen"
        body: "Plural things take the plural verb: **se aceptan tarjetas**, **se hacen envíos**, **se
          arreglan bicis**. One thing, the singular: **se busca perro** — with a **recompensa** if
          you're lucky."
      - title: "No se permite"
        body: "The building speaks the same way: **no se permiten mascotas**, **se prohíbe hacer ruido
          después de las diez**. On the shop door: **horario de atención** — and the **local** is
          often **cerrado** at lunchtime."
      - title: "Out loud: ¿se puede?"
        body: "**Se permite** and **se prohíbe** are sign language. Out loud people say **se puede** / **no
          se puede**: *acá no se puede estacionar*; *¿se puede pagar con tarjeta?* Other signs
          you'll meet every day: **abierto / cerrado**, **no funciona** — *out of order*,
          **liquidación** — *sale*, **solo efectivo** — *cash only*, **cuidado con el perro**. And
          to ask a shop: **¿hacen envíos?** — *do you deliver?*"
