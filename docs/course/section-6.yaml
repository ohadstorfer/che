  practice: 2
units:
  - ordinal: 1
    slug: "la-semana-que-viene"
    title: "Make plans for next week"
    summary: "La semana que viene"
    grammar:
      - "ir-a-infinitivo"
      - "pensar-tener-ganas"
      - "que-viene"
      - "voy-a-tener-que"
    register_max: "informal"
    sample:
      es: "La semana que viene voy a viajar a Córdoba."
      en: "Next week I'm going to travel to Córdoba."
    tips:
      - title: "Voy a…"
        body: "Porteños talk about the future with **ir a**: **voy a laburar**, **vamos a comer**. *Next
          week* is **la semana que viene**, *next year* **el año que viene**."
      - title: "Tengo ganas"
        body: "**Tengo ganas de ir a la playa** — *I feel like going to the beach*. **Pienso ir** — *I'm
          planning to go*."
      - title: "Voy a tener que"
        body: "**Tengo que** is *I have to*; put **voy a** in front for later: **voy a tener que laburar** —
          *I'm going to have to work*. It works for everyone: **vas a tener que**, **vamos a tener
          que**."
      - title: "Some day, soon"
        body: "**Pronto** — *soon*; **a fin de año** — *at the end of the year*; **algún día** — *some day*.
          **¿Qué piensan hacer?** — **Pensamos juntar plata para viajar.** And the classic January
          promise: **me anoté en el gimnasio**."
