      es: "¿Me acompañás a la feria? Necesito frutillas."
      en: "Will you come with me to the market? I need strawberries."
    tips:
      - title: "Me, nos"
        body: "**¿Me acompañás?** asks for you; **¿nos sacás una foto?** asks for the two of you. It stays a
          question in the present — the tone does the asking."
      - title: "Tenés que, hace falta"
        body: "**Tenés que llevar una fotocopia** — someone has to; **hace falta una fotocopia** — something
          is needed; **no hace falta** — relax."
