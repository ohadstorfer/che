  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "me-haces-un-favor"
    title: "Ask for a favour"
    summary: "¿Me hacés un favor?"
    grammar:
      - "pedidos.me-pasas"
      - "condicional.podrias"
    register_max: "informal"
    sample:
      es: "¿Me pasás la sal?"
      en: "Can you pass me the salt?"
    tips:
      - title: "Asking with the present"
        body: "A porteño asks with a plain question in the present: **¿me pasás la sal?**, **¿me ayudás?**
          — the *can you* is in the tone. **¿Podrías…?** is the extra-polite version."
      - title: "Ayudame"
        body: "With a vos command the pronoun joins the end: **ayudame**, **alcanzame** — *help me*, *hand
          me*."
    words:
      - lemma: "favor"
        pos: "noun"
        en: "favor"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "me pasás"
            en: "you pass me"
            f: "2sg.pres.ind.vos.clitic"
          - form: "pasás"
            f: "2sg.pres.ind.vos"
            bound: true
          - form: "pasame"
            en: "pass me"
            f: "2sg.imp.vos.clitic"
      - lemma: "alcanzar"
        pos: "verb"
        en: "to hand, to reach"
        forms:
