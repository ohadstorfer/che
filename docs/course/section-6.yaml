  - ordinal: 8
    slug: "practica-antes-y-ahora"
    title: "Practice: then, now and next"
    summary: "Antes alquilaba, ahora me mudo"
    grammar:
      - "repaso.ponerse"
      - "repaso.ir-a"
      - "repaso.imperfecto-preterito"
    register_max: "informal"
    sample:
      es: "Antes alquilaba en el centro y el año que viene voy a mudarme."
      en: "I used to rent downtown, and next year I'm going to move."
    tips:
      - title: "Three times in one breath"
        body: "**Antes alquilaba** — how it was; **me mudé** — what happened; **voy a pintar** — what's
          next. A porteño story moves through all three without stopping."
      - title: "Me sentí, me olvidé"
        body: "The moment a feeling hit, or a thing slipped your mind, is preterite with its pronoun:
          **me sentí re mal**, **me olvidé de avisarte**, **nos pusimos contentos**."
      - title: "Ponerse a"
        body: "**Ponerse a** + a verb is *to start doing*: **nos pusimos a bailar** — *we started
          dancing*; **me puse a laburar** — *I got down to work*."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "me olvidé"
      - "me sentí"
      - "nos pusimos"
      - "me enamoré"
      - "tener"
      - "pronto"
      - "algún día"
      - "se mudaron"
      - "extrañaba"
      - "alquilaba"
      - "vivía"
      - "estaba"
      - "fui"

  - ordinal: 9
    slug: "las-figuritas"
    title: "Share childhood memories"
    summary: "No me acordaba de la calesita"
    grammar:
      - "acordarse"
      - "repaso.imperfecto-preterito"
    register_max: "informal"
    sample:
      es: "No me acordaba de la calesita de la plaza."
      en: "I'd forgotten about the merry-go-round in the square."
    tips:
      - title: "Acordarse de"
        body: "What you remember takes **de**: **mi abuela se acuerda de todo**; **nos acordamos de
          esa época**. **No me acordaba** — *I'd forgotten* — is imperfect: the not-remembering went
          on until someone brought it up."
      - title: "Every porteño childhood"
        body: "The **calesita** in the plaza, **golosinas** from the kiosco, a **barrilete** on a windy
          day, and the **álbum** of **figuritas** you filled for every **Mundial** — **lo
          llenábamos entre todos**."
    words:
      - lemma: "acordarse"
        pos: "verb"
        en: "to remember"
        forms:
          - form: "se acuerda"
            en: "remembers (he/she remembers)"
            f: "3sg.pres.ind.clitic.irregular"
          - form: "nos acordamos"
            en: "we remember"
            f: "1pl.pres.ind.clitic"
          - form: "me acordaba"
            en: "I remembered, I used to remember"
            f: "1sg.impf.ind.clitic"
          - form: "acuerda"
            f: "3sg.pres.ind.irregular"
            bound: true
          - form: "acordamos"
            f: "1pl.pres.ind"
            bound: true
          - form: "acordaba"
            f: "sg.impf.ind"
            bound: true
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "veíamos"
            en: "we saw, we used to see"
            f: "1pl.impf.ind.irregular"
      - lemma: "llenar"
        pos: "verb"
        en: "to fill"
        forms:
          - form: "llenábamos"
            en: "we used to fill"
