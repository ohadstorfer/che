  - ordinal: 20
    slug: "migraciones"
    title: "Sort out your residency"
    summary: "Una consulta: ¿qué requisitos hay?"
    grammar:
      - "tramites"
      - "vencido"
    register_max: "informal"
    sample:
      es: "En Migraciones me pidieron una copia del pasaporte."
      en: "At the immigration office they asked me for a copy of my passport."
    tips:
      - title: "Una consulta"
        body: "At any **ventanilla**, open with **una consulta** — *a quick question* — and ask for the
          **requisitos**, *what they need*. They'll say **el original y una copia**, and they mean
          both."
      - title: "¿Cuánto demora?"
        body: "Porteños say **demorar** for how long a trámite takes: **¿cuánto demora la residencia?** The
          honest answer is *depende*. For a person or a bus they say **tardar**: *Lucía tardó media
          hora*, *el bondi tardó un montón*. You **presentás** the papers, and when they finally
          **atienden** you, it's over in five minutes."
      - title: "What Migraciones asks for"
        body: "For the **residencia** you need your **antecedentes penales** — *criminal record* — with the
          **apostilla**, the stamp that makes a foreign paper valid here, and a **certificado de
          domicilio** — *proof of address*. While you wait they give you the **precaria**, a
          temporary permit you can already work and travel with."
    words:
