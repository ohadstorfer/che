      - "precio.cuanto-esta"
    register_max: "informal"
    sample:
      es: "Dame un kilo de tomates, por favor."
      en: "Give me a kilo of tomatoes, please."
    tips:
      - title: "¿A cuánto está?"
        body: "At the verdulería the price moves, so it's **¿a cuánto está el kilo?** — *how much is it
          a kilo today?* You buy **un kilo**, **medio kilo** or **una docena**."
      - title: "Dame"
        body: "Nobody says *quisiera*: **dame un kilo de papas** — *give me a kilo of potatoes* — is
          polite enough with a *por favor*."
