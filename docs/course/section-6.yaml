  - ordinal: 2
    slug: "la-semana-que-viene"
    title: "Make plans for next week"
    summary: "La semana que viene"
    grammar:
      - "ir-a-infinitivo"
      - "pensar-tener-ganas"
      - "que-viene"
    register_max: "informal"
    sample:
      es: "La semana que viene voy a viajar a Córdoba."
      en: "Next week I'm going to travel to Córdoba."
    tips:
      - title: "Voy a…"
        body: "Porteños talk about the future with **ir a**: **voy a laburar**, **vamos a comer**. *Next
          week* is **la semana que viene**, *next year* **el año que viene**."
      - title: "Tengo ganas"
        body: "**Tengo ganas de ir a la playa** — *I feel like going to the beach*. **Pienso ir** — *I'm
          planning to go*."
    words:
      - lemma: "ganas"
        pos: "noun"
        en: "wish, urge (to feel like)"
      - lemma: "que viene"
        pos: "phrase"
        en: "next"
      - lemma: "viajar"
        pos: "verb"
        forms:
          - form: "viajamos"
            en: "we travel, we're traveling"
            f: "1pl.pres.ind"
      - lemma: "mudarse"
        pos: "verb"
        en: "to move (house)"
        forms:
          - form: "mudarme"
            en: "to move (myself)"
            f: "inf.clitic"
      - lemma: "descansar"
        pos: "verb"
        forms:
          - form: "descanso"
            en: "I rest"
            f: "1sg.pres.ind"
      - lemma: "seguro"
        pos: "adv"
        en: "for sure, definitely"

  - ordinal: 3
    slug: "voy-a-tener-que"
    title: "Say what you're going to have to do"
    summary: "Voy a tener que laburar"
    grammar:
      - "ir-a-infinitivo"
      - "pensar-tener-ganas"
      - "que-viene"
      - "voy-a-tener-que"
    register_max: "informal"
    sample:
      es: "El mes que viene voy a tener que laburar mucho."
      en: "Next month I'm going to have to work a lot."
    tips:
      - title: "Voy a tener que"
        body: "**Tengo que** is *I have to*; put **voy a** in front for later: **voy a tener que
          laburar** — *I'm going to have to work*. It works for everyone: **vas a tener que**,
          **vamos a tener que**."
      - title: "Some day, soon"
        body: "**Pronto** — *soon*; **a fin de año** — *at the end of the year*; **algún día** —
          *some day*. **¿Qué piensan hacer?** — **Pensamos juntar plata para viajar.** And the
          classic January promise: **me anoté en el gimnasio**."
    words:
      - lemma: "pensar"
        pos: "verb"
        forms:
          - form: "pensamos"
            en: "we think, we plan to"
            f: "1pl.pres.ind"
      - lemma: "visitar"
        pos: "verb"
        en: "to visit"
        forms:
          - form: "visitar"
            f: "inf"
      - lemma: "juntar"
        pos: "verb"
        en: "to save up, to collect"
        forms:
