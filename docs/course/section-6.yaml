    register_max: "informal"
    sample:
      es: "Capaz que Juan está engripado."
      en: "Maybe Juan has the flu."
    tips:
      - title: "Guessing with the future"
        body: "**¿Dónde estará?** is not about tomorrow: it is *I wonder where he is*. The future guesses; **capaz** and **seguro que** do it in the present."
      - title: "Me siento, lo siento"
        body: "**Me siento mal** — *I feel bad*. **Lo siento** — *I'm sorry*, for real bad news. For bumping into someone, say **perdón**."
