  - ordinal: 3
    slug: "hay-que"
    title: "Say what has to be done"
    summary: "Hay que ir temprano"
    grammar:
      - "obligacion.hay-que"
      - "necesitar"
      - "no-hace-falta"
    register_max: "informal"
    sample:
      es: "Hay que llegar temprano."
      en: "You have to get there early."
    tips:
      - title: "Tengo que, hay que"
        body: "**Tengo que laburar** is *I have to work*; **hay que** is the same for everyone: **hay que
          sacar la basura** — *the rubbish has to go out*."
      - title: "No hace falta"
        body: "**No hace falta** — *there's no need*. **Conviene** is the advice: **conviene ir
          temprano** — *it's best to go early*."
    words:
      - lemma: "hay que"
        pos: "phrase"
        en: "you have to, one has to"
      - lemma: "no hace falta"
