            en: "I help"
            f: "1sg.pres.ind"
          - form: "ayudás"
            en: "you help"
            f: "2sg.pres.ind.vos"
          - form: "ayudame"
            en: "help me"
            f: "2sg.imp.vos.clitic"
          - form: "ayudar"
            f: "inf"
