  - ordinal: 10
    slug: "no-tengo-senal"
    title: "Sort out tech trouble"
    summary: "No tengo señal"
    grammar:
      - "tecnologia"
      - "se-corto"
    register_max: "informal"
    sample:
      es: "No tengo señal y se apagó el celu."
      en: "I've got no signal and my phone died."
    tips:
      - title: "Se apagó, se colgó"
        body: "A machine that fails on its own takes **se** and the preterite, like **se cortó**: **se
          apagó** — *it switched off*; **se colgó** — *it froze*. Your friend **se quedó sin batería**?
