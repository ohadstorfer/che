    register_max: "informal"
    sample:
      es: "Conseguí laburo en una empresa del centro."
      en: "I got a job at a company downtown."
    tips:
      - title: "Conseguir"
        body: "**Conseguí laburo** — *I got a job*. *Conseguir* is the porteño verb for getting anything
          that took effort: a *turno*, a table, a flat."
      - title: "Home office"
        body: "Working from home is **hacer home office**, in English, and said the Spanish way."
    words:
