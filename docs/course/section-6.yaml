  - ordinal: 10
    slug: "te-debo-una"
    title: "Thank someone properly"
    summary: "Te debo una"
    grammar:
      - "agradecer"
      - "repaso.a2"
    register_max: "informal"
    sample:
      es: "Mil gracias, te debo una."
      en: "Thanks a million, I owe you one."
    tips:
      - title: "Te debo una"
        body: "**Te debo una** — *I owe you one*. The answer is **de nada**, or, more porteño, **no pasa
          nada**."
      - title: "Un montón"
        body: "**Gracias por todo**, **mil gracias**, **gracias un montón** — the thanks gets bigger, the
          grammar doesn't change."
    words:
      - lemma: "deber"
        pos: "verb"
        en: "to owe"
        forms:
