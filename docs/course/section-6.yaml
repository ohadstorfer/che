      es: "¿Te acordás cuando íbamos a la playa?"
      en: "Do you remember when we used to go to the beach?"
    tips:
      - title: "¿Te acordás?"
        body: "**¿Te acordás cuando…?** opens every memory at a family asado. **Me acuerdo** — *I
          remember*; **no me acuerdo** — *I don't remember*. The moment it comes back is the past:
          **¡ah, ahora me acordé!**; **¿te acordaste de llamar?** — *did you remember to call?*"
      - title: "Antes era distinto"
        body: "**Antes era distinto** — *it used to be different*. **¡Qué épocas!** — *those were
          the days!* — closes it. With *ser* it is a different kind of thing: **el barrio era
          distinto**. With *estar* it has changed: **estás distinta** — *you look different*."
