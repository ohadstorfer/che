  - ordinal: 5
    slug: "te-lo-devuelvo"
    title: "Lend, borrow and give back"
    summary: "Mañana te lo devuelvo"
    grammar:
      - "pronombres.dobles"
      - "devolver-dejar"
    register_max: "informal"
    sample:
      es: "Mañana te lo devuelvo."
      en: "I'll give it back to you tomorrow."
    tips:
      - title: "Te lo, se lo"
        body: "Two pronouns go person first, thing second: **te lo devuelvo** — *I'll give it back to
          you*. *Le lo* never happens: it turns into **se lo**."
      - title: "Dejar"
        body: "**Dejame las llaves** — *leave me the keys*; **te dejo** — *I'll leave you (to it)*, the
          porteño way of hanging up."
    words:
      - lemma: "devolver"
        pos: "verb"
        en: "to give back"
        forms:
