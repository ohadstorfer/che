  - ordinal: 5
    slug: "acampamos-en-el-sur"
    title: "Tell about a trip south"
    summary: "Acampamos al lado de un lago en el sur"
    grammar:
      - "viaje.argentina"
    register_max: "informal"
    sample:
      es: "Hicimos dedo hasta Bariloche y acampamos al lado de un lago."
      en: "We hitchhiked to Bariloche and camped next to a lake."
    tips:
      - title: "Acampamos, recorrieron"
        body: "Travel stories run on the preterite: **acampamos** — *we camped* — **hicimos dedo** — *we
          hitchhiked* — **¿recorriste el norte?**, **mis viejos recorrieron la costa**. Distances are in
          **kilómetros**, and in the south there are always more than you thought."
      - title: "La cordillera"
        body: "The **cordillera** — *the Andes range* — runs down the whole west: **lagos** and **nieve**
          in the south, **bodegas** — *wineries* — in Mendoza, red **valles** in Jujuy. A **mochilero**
          does it all with a backpack and a carpa, down to Ushuaia."
    words:
      - lemma: "recorrer"
        pos: "verb"
        forms:
          - form: "recorriste"
            en: "you travelled around"
            f: "2sg.pret.ind.vos"
          - form: "recorrieron"
            en: "they travelled around"
            f: "3pl.pret.ind"
