  - ordinal: 8
    slug: "zona-norte"
    title: "Pick a barrio to live in"
    summary: "Belgrano queda en zona norte"
    grammar:
      - "quedar.ubicacion"
      - "barrios"
    register_max: "informal"
    sample:
      es: "Belgrano queda en zona norte, lejos del centro."
      en: "Belgrano is up north, far from downtown."
    tips:
      - title: "Quedan, te queda"
        body: "Two places: **quedan** — *Recoleta y Belgrano quedan en zona norte*. For you: **¿te queda
          cerca?** — *is it close for you?*. It's the same *queda*, with whoever it's for in front."
      - title: "Norte y sur"
        body: "**Zona norte** — Recoleta, Belgrano, and the suburbs past the General Paz — has the money and
          the **árboles**; **zona sur** — La Boca, and the conurbano to the south — is cheaper.
          Caballito, Almagro and Villa Crespo sit in the middle."
      - title: "Al lado de"
        body: "**Al lado de** — *next to*: **Almagro queda al lado de Caballito**. Before *el* it shrinks:
          **al lado del parque**."
    words:
