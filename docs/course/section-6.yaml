  - ordinal: 7
    slug: "el-depto-nuevo"
    title: "Rent and set up a new place"
    summary: "Pintamos el depto nuevo"
    grammar:
      - "mudarse.pret"
      - "extrañar"
      - "vecinos"
    register_max: "informal"
    sample:
      es: "Nos mudamos con un flete y pintamos el depto."
      en: "We moved with a van and painted the flat."
    tips:
      - title: "Before and after the move"
        body: "The old place is imperfect, the move is preterite: **antes alquilaba en el centro** —
          how it was; **me mudé a Palermo** — what happened. **Extrañaba** is missing that went on:
          *los primeros meses extrañaba mi barrio*."
      - title: "The move itself"
        body: "You rent through an **inmobiliaria** or straight from the **dueño**, and pay the
          **alquiler** every month. A **flete** takes the **muebles** and the **colchón**, and
          before unpacking, **pintamos**. The neighbours say it of you: **se mudaron**. On top of
          the rent come the **expensas** — *the building fees* — and to move in you leave a
          **depósito**. The dream is the **casa propia** — *a place of your own*."
    words:
      - lemma: "mudarse"
        pos: "verb"
        forms:
          - form: "se mudaron"
            en: "they moved (house)"
            f: "3pl.pret.ind.clitic"
          - form: "mudaron"
            f: "3pl.pret.ind"
            bound: true
      - lemma: "extrañar"
        pos: "verb"
        forms:
          - form: "extrañaba"
            en: "missed, used to miss"
            f: "sg.impf.ind"
      - lemma: "alquilar"
        pos: "verb"
        forms:
