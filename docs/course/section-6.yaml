            en: "you hand"
            f: "2sg.pres.ind.vos"
          - form: "alcanzame"
            en: "hand me"
            f: "2sg.imp.vos.clitic"
      - lemma: "ayudar"
        pos: "verb"
        en: "to help"
        forms:
