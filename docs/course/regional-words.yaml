# Words from other Spanishes the course never uses, and the word a porteño
# says instead (course-spec Appendix B, "Lexicon"). A sentence or a lexicon
# entry with any form of a word on the left fails the linter and is told the
# word on the right, so the generator rewrites it — nothing is swapped blindly,
# because "el ordenador" → "la computadora" changes the article too.
#
# Mined from Wiktionary's regional tags (English and Spanish editions, via
# kaikki.org) and reviewed by hand. Only words that mean nothing else in
# Argentina belong here: `falda` is a cut of beef, `piña` a punch, `metro` a
# metre, `plátano` the street tree — blocking those would reject real Argentine.
# A false block is worse than a miss. `camiseta` is not here: a T-shirt is a
# `remera`, but a team's jersey is `la camiseta` — SENSES in rules.ts checks
# which one the English means.
#
# Edit this file, then `npm run course:regional` to rebuild every inflected
# form into src/lib/course-rules/regional-words.ts.
#
#   es:  the lemma to block (singular / infinitive); several words = a phrase
#   ar:  what to say instead
#   pos: noun | verb | adj | adv | interj | phrase
#   src: wiktionary | reviewer | hand
