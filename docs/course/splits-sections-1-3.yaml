# Units too big for the fixed unit shape (scripts/course/lib/template.mjs),
# split into two or three. A unit holds at most 12 new words, and no more than
# its three teaching lessons can teach (a word's first form costs 3 screens,
# each further form 2; a lesson holds 12, 13 at a push).
#
#   npm run course:split -- --list            the units that still want splitting
#   npm run course:split -- --check           what each split below does
#   npm run course:split -- --sql <file>      the migration that makes them
#
# Each entry is a unit's parts, in order. The first part keeps the unit (its
# slug, its lessons, what a learner did in it) and gives a title or summary
# only when the old one no longer fits. Every later part is a new unit, right
# after it. `words` are lemmas in teaching order; `tips` are the titles of the
# unit's existing tips that go with that part; `new_tips` are written for a
# part that has none. Once a split is in the database this file is history:
# the units are edited in the admin like any other.

# --- Section 1 · A1.1 First words --------------------------------------------
otro-cafe:
  - words: [ otro, té, cerveza, gaseosa, licuado, tostada, tostado ]
    title: "Order another drink and some toast"
    tips: [ "Otro, never un otro", "Tostadas, un tostado" ]
  - slug: "una-pizza-y-un-helado"
    title: "Order something to eat"
    summary: "Una pizza y un helado"
    words: [ pan, sándwich, pizza, helado, torta, comida ]
