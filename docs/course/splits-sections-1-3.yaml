    new_tips:
      - title: "Una peli"
        body: "**Peli** is short for **película**, and it is what people really say: *¿Querés mirar una peli?* A show with many episodes is a **serie**: *Me encantan las series.*"
    sample: { es: "Me encanta escuchar música y mirar una peli.", en: "I love listening to music and watching a movie." }

me-interesa:
  - words: [interesar, odiar, deporte, tenis, gimnasio]
    summary: "Me interesa el tenis, odio el gimnasio"
    tips: ["Le gusta, les interesa"]
  - slug: "me-encanta-viajar"
    title: "Say what you love doing on vacation"
    summary: "Me encanta viajar, a él le gusta nadar"
    words: [viajar, nadar, cantar, pasear, playa]
    new_tips:
      - title: "Salir a pasear"
        body: "**Pasear** is to go out with no hurry and no plan, just to walk around and look: *Los domingos salimos a pasear.* With a dog it means to walk it: *Voy a pasear al perro.*"
    sample: { es: "Me encanta viajar y pasear por la playa.", en: "I love travelling and strolling along the beach." }

pasame-tu-numero:
