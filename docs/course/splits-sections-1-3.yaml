    tips: ["Chip y datos"]
    sample: { es: "No tengo datos, ¿me pasás el wifi?", en: "I have no data, can you give me the wifi?" }

clima:
  - words: [sol, viento, lluvia, nublado, llover, paraguas, bárbaro]
    tips: ["Weather with hacer"]
  - slug: "en-verano"
    title: "Talk about the seasons"
    summary: "En enero es verano y hace calor"
    words: [verano, invierno, otoño, primavera, enero, julio]
    new_tips:
      - title: "Seasons are flipped"
        body: "Argentina is in the south, so the seasons are the other way round. **El verano** runs from late December to March, and **julio** is the middle of **el invierno**: *En enero hace calor.* Months have no capital letter."
    sample: { es: "En julio es invierno y hace frío.", en: "In July it's winter and it's cold." }

