cuantos-anos-tenes:
  - words: [ tener, cuánto, año, uno, dos, tres, cuatro, cinco ]
    title: "Ask how old someone is"
    tips: [ "Tengo, tenés, tiene" ]
    sample: { es: "Mi hijo tiene cinco años. ¿Cuántos años tenés vos?", en: "My son is five. How old are you?" }
  - slug: "tiene-ocho-anos"
    title: "Count to ten"
    summary: "Mi hijo tiene ocho años"
    words: [ seis, siete, ocho, nueve, diez, cero ]
    new_tips:
      - title: "Cero to diez"
        body: "With **seis**, **siete**, **ocho**, **nueve** and **diez** you can count to ten. **Cero** is zero. The number goes before **años**: *Mi hijo tiene ocho años.*"
    sample: { es: "Mi hijo tiene ocho años y mi hija tiene diez.", en: "My son is eight and my daughter is ten." }
  - slug: "tengo-veinte-anos"
    title: "Count to twenty"
    summary: "Tengo veinte años"
    words: [ once, doce, trece, catorce, quince, dieciséis, diecisiete, dieciocho, diecinueve, veinte ]
    new_tips:
      - title: "Eleven to twenty"
        body: "**Once**, **doce**, **trece**, **catorce** and **quince** are words to learn one by one. After that it gets easy: **dieci** plus the number, as one word: *dieciséis*, *diecisiete*. Then comes **veinte**: *Tengo veinte años.*"
    sample: { es: "Tengo veinte años y mi hermana tiene diecisiete.", en: "I'm twenty and my sister is seventeen." }

treinta-y-cuatro:
  - words: [ veintiuno, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve, treinta ]
    title: "Count from twenty-one to thirty-nine"
    tips: [ "Veinticinco, treinta y cuatro" ]
  - slug: "cuarenta-y-cinco"
    title: "Count to a hundred"
    summary: "Mi papá tiene sesenta y dos años"
    words: [ cuarenta, cincuenta, sesenta, setenta, ochenta, noventa, cien ]
    tips: [ "Sesenta or setenta?" ]
    sample: { es: "Mi mamá tiene sesenta años y mi abuela tiene noventa.", en: "My mom is sixty and my grandmother is ninety." }

cuanto-sale:
  - words: [ pagar, comprar, efectivo, tarjeta, mango ]
    tips: [ "Pago, pagás, paga" ]
  - slug: "quinientos-pesos"
    title: "Say prices in the hundreds"
    summary: "Sale quinientos pesos"
    words: [ ciento, doscientos, trescientos, cuatrocientos, quinientos, seiscientos, setecientos, ochocientos, novecientos ]
    tips: [ "Hundreds" ]
    sample: { es: "¿Cuánto sale? —Sale ochocientos pesos.", en: "How much is it? —It's eight hundred pesos." }

