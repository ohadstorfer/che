  - ordinal: 6
    slug: "cenamos-afuera"
    title: "Say what you all did last night"
    summary: "Anoche cenamos afuera"
    grammar:
      - "preterito.ar.singular"
      - "tiempo.ayer-anoche-pasado"
      - "preterito.ar.plural"
    register_max: "informal"
    sample:
      es: "Anoche cenamos afuera y pagué yo."
      en: "We ate out last night and I paid."
    tips:
      - title: "Nosotros and ellos"
        body: "The past has an ending for everyone: **cenamos** (we had dinner), **llegaron** (they arrived,
          you all arrived). *-amos* looks like the present — **anoche cenamos** tells you when — and
          *-aron* is only ever the past."
      - title: "Pagué, llegué"
        body: "In *yo* the spelling bends to keep the sound: *pagar* → **pagué**, *llegar* → **llegué**. At
          the end of the night someone says **pago yo** — and the next day, **ayer pagué yo, hoy te
          toca a vos**."
    words:
      - lemma: "cenar"
        pos: "verb"
        forms:
          - form: "cené"
            en: "I had dinner"
            f: "1sg.pret.ind"
          - form: "cenaste"
            en: "you had dinner"
            f: "2sg.pret.ind.vos"
          - form: "cenamos"
            en: "we had dinner, we have dinner"
            f: "1pl.pret.ind"
