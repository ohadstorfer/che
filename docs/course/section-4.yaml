    sample:
      es: "Vinieron todos, pero nadie trajo el postre."
      en: "Everyone came, but nobody brought dessert."
    tips:
      - title: "Traje, quise"
        body: "Two more with their own stem and no accent: **traje, trajiste, trajo** (brought) and **quise,
          quisiste, quiso** (wanted, tried). **Quise** is about one moment: *I wanted to* (and
          tried). **No quise**: *I didn't want to* (and didn't). **Quise venir, pero no pude** — *I
          wanted to come but couldn't* — is the porteño apology for a missed asado."
      - title: "Vinieron, hicieron, dijeron"
        body: "For *ellos* the irregular ones end in **-ieron**: **vinieron**, **hicieron**, **pudieron** —
          and after a *j* just **-eron**: **dijeron**, **trajeron**. **No vino nadie** — *nobody
          came*: after the verb, *nadie* still needs the *no*."
