      en: "I sent you the photos from the trip: we swam in the river every day."
    tips:
      - title: "Lo mandé, la vi"
        body: "The pronoun works the same in the past: **¿Las fotos? Ya las mandé.** **¿El video? Lo
          vi anoche.** **¿A Sofi? La llamé ayer.** Before the verb, always — only a command takes it
          on the end."
