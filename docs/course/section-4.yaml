# ---------------------------------------------------------------------------
# Che — Section 4 outline: "What happened" (A2.1)
#
# The past arrives. Buenos Aires tells anything finished in the simple past —
# "hoy comí", "¿viste?" — never "he comido" (Appendix B; the linter rejects the
# compound past), so the preterite is the one past this section teaches, one
# person at a time the way the present was: yo and vos first, then él/ella,
# then nosotros. Around it: telling a weekend, comparing, saying what hurts,
# the object pronouns that make answers short ("¿Lo tenés?" "Sí, lo tengo"),
# chores, and a trip. Unit 10 is the checkpoint: telling a story end to end.
#
# Plan and reasoning: docs/course/roadmap.md §Section 4.
# Conventions: see section-1.yaml. New feature tag: `pret` (pretérito).
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 4
  slug: "what-happened"
  title: "What happened"
  cefr: "A2.1"
units:
  - ordinal: 1
    slug: "ayer-labure"
    title: "Say what you did yesterday"
    summary: "Ayer laburé"
    grammar:
      - "preterito.ar.singular"
      - "tiempo.ayer-anoche-pasado"
    register_max: "informal"
    sample:
      es: "Ayer laburé mucho."
      en: "I worked a lot yesterday."
    tips:
      - title: "The past, one person at a time"
        body: "For anything finished, Buenos Aires uses one past: *laburé* (I worked), *laburaste* (you
          worked), *laburó* (he/she worked). The stress is what tells *laburo* (I work) from *laburó*
          (he worked) — the accent is not decoration."
      - title: "Not \"he trabajado\""
        body: "Spain says *hoy he trabajado*; a porteño says **hoy laburé**. Even for today, even for
          something that just happened: **¿Llegaste?** — *Did you get here?*"
    words:
      - lemma: "laburar"
        pos: "verb"
        forms:
          - form: "laburé"
            en: "I worked"
            f: "1sg.pret.ind"
          - form: "laburaste"
            en: "you worked"
            f: "2sg.pret.ind.vos"
          - form: "laburó"
            en: "worked (he/she worked)"
            f: "3sg.pret.ind"
      - lemma: "estudiar"
        pos: "verb"
        forms:
          - form: "estudié"
            en: "I studied"
            f: "1sg.pret.ind"
          - form: "estudiaste"
            en: "you studied"
            f: "2sg.pret.ind.vos"
          - form: "estudió"
            en: "studied (he/she studied)"
            f: "3sg.pret.ind"
      - lemma: "hablar"
        pos: "verb"
        forms:
          - form: "hablé"
            en: "I spoke, I talked"
            f: "1sg.pret.ind"
          - form: "hablaste"
            en: "you spoke, you talked"
            f: "2sg.pret.ind.vos"
          - form: "habló"
            en: "spoke (he/she spoke)"
            f: "3sg.pret.ind"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegué"
            en: "I arrived, I got here"
            f: "1sg.pret.ind"
          - form: "llegaste"
            en: "you arrived, you got here"
            f: "2sg.pret.ind.vos"
          - form: "llegó"
            en: "arrived (he/she arrived)"
            f: "3sg.pret.ind"
      - lemma: "tomar"
        pos: "verb"
        forms:
          - form: "tomé"
            en: "I drank, I took"
            f: "1sg.pret.ind"
          - form: "tomaste"
            en: "you drank, you took"
            f: "2sg.pret.ind.vos"
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "compré"
            en: "I bought"
            f: "1sg.pret.ind"
          - form: "compraste"
            en: "you bought"
            f: "2sg.pret.ind.vos"
          - form: "compró"
            en: "bought (he/she bought)"
            f: "3sg.pret.ind"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasó"
            en: "happened"
            f: "3sg.pret.ind"
      - lemma: "ayer"
        pos: "adv"
        en: "yesterday"
      - lemma: "anoche"
        pos: "adv"
        en: "last night"
      - lemma: "pasado"
        pos: "adj"
        en: "last"
        forms:
          - form: "pasado"
            f: "m.sg"
          - form: "pasada"
            f: "f.sg"

  - ordinal: 2
    slug: "comi-y-sali"
    title: "Say what you ate and where you went out"
    summary: "Anoche salí"
    grammar:
      - "preterito.er-ir.singular"
      - "preterito.nosotros"
      - "recien"
    register_max: "informal"
    sample:
      es: "Anoche salí con mis amigos."
      en: "I went out with my friends last night."
    tips:
      - title: "-er and -ir share one past"
        body: "*Comer* and *salir* take the same endings: **comí, comiste, comió**; **salí, saliste,
          salió**. For *nosotros* the past looks like the present — *salimos* — and *anoche* or
          *ayer* says which one it is."
      - title: "Recién"
        body: "**Recién llegué** — *I just got here*. A porteño uses *recién* with the plain past where
          English says *just*."
    words:
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "comí"
            en: "I ate"
            f: "1sg.pret.ind"
          - form: "comiste"
            en: "you ate"
            f: "2sg.pret.ind.vos"
          - form: "comió"
            en: "ate (he/she ate)"
            f: "3sg.pret.ind"
          - form: "comimos"
            en: "we ate"
            f: "1pl.pret.ind"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salí"
            en: "I went out, I left"
            f: "1sg.pret.ind"
          - form: "saliste"
            en: "you went out, you left"
            f: "2sg.pret.ind.vos"
          - form: "salió"
            en: "went out (he/she went out)"
            f: "3sg.pret.ind"
      - lemma: "escribir"
        pos: "verb"
        forms:
          - form: "escribí"
            en: "I wrote"
            f: "1sg.pret.ind"
          - form: "escribiste"
            en: "you wrote"
            f: "2sg.pret.ind.vos"
      - lemma: "aprender"
        pos: "verb"
        forms:
          - form: "aprendí"
            en: "I learned"
            f: "1sg.pret.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viví"
            en: "I lived"
            f: "1sg.pret.ind"
      - lemma: "conocer"
        pos: "verb"
        en: "to know (a person, a place), to meet"
        forms:
          - form: "conozco"
            en: "I know"
            f: "1sg.pres.ind.irregular"
          - form: "conocés"
            en: "you know"
            f: "2sg.pres.ind.vos"
          - form: "conocí"
            en: "I met"
            f: "1sg.pret.ind"
          - form: "conociste"
            en: "you met"
            f: "2sg.pret.ind.vos"
      - lemma: "recién"
        pos: "adv"
        en: "just (a moment ago)"

  - ordinal: 3
    slug: "fui-a-la-cancha"
    title: "Say where you went and how it was"
    summary: "¿Cómo te fue?"
    grammar:
      - "preterito.ir-ser"
      - "preterito.estar-tener"
      - "como-te-fue"
    register_max: "informal"
    sample:
      es: "El sábado fui a la cancha con mi viejo."
      en: "On Saturday I went to the stadium with my dad."
    tips:
      - title: "Fui: went, and was"
        body: "*Ir* and *ser* share their past: **fui, fuiste, fue**. *Fui a la cancha* — *I went to
          the stadium*; *fue bárbaro* — *it was great*. The rest of the sentence tells which."
      - title: "¿Cómo te fue?"
        body: "The porteño *how did it go?* is **¿Cómo te fue?**, and the answer is **Me fue bien** or
          **Me fue re mal**."
    words:
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "fui"
            en: "I went"
            f: "1sg.pret.ind.irregular"
          - form: "fuiste"
            en: "you went"
            f: "2sg.pret.ind.vos.irregular"
          - form: "fue"
            en: "went (he/she went)"
            f: "3sg.pret.ind.irregular"
          - form: "fuimos"
            en: "we went"
            f: "1pl.pret.ind.irregular"
          - form: "fueron"
            en: "they went"
            f: "3pl.pret.ind.irregular"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "fue"
            en: "was (it was)"
            f: "3sg.pret.ind.irregular"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estuve"
            en: "I was (somewhere)"
            f: "1sg.pret.ind.irregular"
          - form: "estuviste"
            en: "you were (somewhere)"
            f: "2sg.pret.ind.vos.irregular"
          - form: "estuvo"
            en: "was (somewhere)"
            f: "3sg.pret.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tuve"
            en: "I had"
            f: "1sg.pret.ind.irregular"
          - form: "tuviste"
            en: "you had"
            f: "2sg.pret.ind.vos.irregular"
          - form: "tuvo"
            en: "had (he/she had)"
            f: "3sg.pret.ind.irregular"
      - lemma: "partido"
        pos: "noun"
        en: "match, game"
      - lemma: "recital"
        pos: "noun"
        en: "concert, gig"

  - ordinal: 4
    slug: "el-finde"
    title: "Tell a friend about your weekend"
    summary: "¿Qué hiciste el finde?"
    grammar:
      - "preterito.hacer-ver-decir"
      - "preterito.venir-poder"
      - "relato.primero-entonces"
    register_max: "informal"
    sample:
      es: "El finde vi una película con Sofi."
      en: "At the weekend I watched a film with Sofi."
    tips:
      - title: "The irregular ones"
        body: "The verbs you use most have their own past: **hice** (I did), **vi** (I saw), **dije**
          (I said), **vine** (I came), **pude** (I could). No accent on any of them."
      - title: "¿Viste?"
        body: "*¿Viste?* is also just *you saw*: **¿Viste el partido?** — *Did you see the game?* — the
          same word porteños drop into every story to mean *you know?*"
    words:
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hice"
            en: "I did, I made"
            f: "1sg.pret.ind.irregular"
          - form: "hiciste"
            en: "you did, you made"
            f: "2sg.pret.ind.vos.irregular"
          - form: "hizo"
            en: "did, made (he/she did)"
            f: "3sg.pret.ind.irregular"
          - form: "hicimos"
            en: "we did, we made"
            f: "1pl.pret.ind.irregular"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "vi"
            en: "I saw, I watched"
            f: "1sg.pret.ind.irregular"
          - form: "viste"
            en: "you saw, you watched"
            f: "2sg.pret.ind.vos.irregular"
          - form: "vio"
            en: "saw (he/she saw)"
            f: "3sg.pret.ind.irregular"
          - form: "vimos"
            en: "we saw, we watched"
            f: "1pl.pret.ind.irregular"
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "dije"
            en: "I said, I told"
            f: "1sg.pret.ind.irregular"
          - form: "dijiste"
            en: "you said, you told"
            f: "2sg.pret.ind.vos.irregular"
          - form: "dijo"
            en: "said (he/she said)"
            f: "3sg.pret.ind.irregular"
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vine"
            en: "I came"
            f: "1sg.pret.ind.irregular"
          - form: "viniste"
            en: "you came"
            f: "2sg.pret.ind.vos.irregular"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "pude"
            en: "I could, I managed to"
            f: "1sg.pret.ind.irregular"
          - form: "pudiste"
            en: "you could, you managed to"
            f: "2sg.pret.ind.vos.irregular"
      - lemma: "primero"
        pos: "adv"
        en: "first"
      - lemma: "entonces"
        pos: "adv"
        en: "then, and then"
      - lemma: "al final"
        pos: "phrase"
        en: "in the end"

  - ordinal: 5
    slug: "mas-alto-que"
    title: "Compare people and things"
    summary: "Más alto que yo"
    grammar:
      - "comparativo.mas-menos-que"
      - "comparativo.tan-como"
      - "comparativo.mejor-peor"
      - "superlativo.isimo"
    register_max: "informal"
    sample:
      es: "Mi hermana es más alta que yo."
      en: "My sister is taller than me."
    tips:
      - title: "Más… que, menos… que"
        body: "**Más caro que**, **menos lejos que** — *more expensive than*, *less far than*. **Tan
          lindo como** is *as nice as*. *Better* and *worse* have their own words: **mejor**,
          **peor**."
      - title: "Older and younger"
        body: "A porteño's older sister is *mi hermana **más grande***, the younger one *mi hermano
          **más chico***. And *-ísimo* turns anything up: **riquísimo**, **carísimo**."
    words:
      - lemma: "menos"
        pos: "adv"
        en: "less, fewer"
      - lemma: "tan"
        pos: "adv"
        en: "as, so"
      - lemma: "como"
        pos: "conj"
        en: "as, like"
        glue: true
      - lemma: "mejor"
        pos: "adj"
        en: "better, best"
      - lemma: "peor"
        pos: "adj"
        en: "worse, worst"
      - lemma: "bueno"
        pos: "adj"
        en: "good"
        forms:
          - form: "buena"
            en: "good"
            f: "f.sg"
          - form: "buenos"
            en: "good"
            f: "m.pl"
          - form: "buenísimo"
            en: "really good, great"
            f: "m.sg"
      - lemma: "rico"
        pos: "adj"
        forms:
          - form: "riquísimo"
            en: "delicious, really tasty"
            f: "m.sg"
          - form: "riquísima"
            en: "delicious, really tasty"
            f: "f.sg"
      - lemma: "caro"
        pos: "adj"
        forms:
          - form: "carísimo"
            en: "really expensive"
            f: "m.sg"
      - lemma: "alto"
        pos: "adj"
        en: "tall"
        forms:
          - form: "alto"
            f: "m.sg"
          - form: "alta"
            f: "f.sg"
      - lemma: "petiso"
        pos: "adj"
        en: "short (not tall)"
        register: "informal"
        forms:
          - form: "petiso"
            f: "m.sg"
          - form: "petisa"
            f: "f.sg"
      - lemma: "grande"
        pos: "adj"
        forms:
          - form: "más grande"
            en: "older, bigger"
            f: "sg"
      - lemma: "chico"
        pos: "adj"
        forms:
          - form: "más chico"
            en: "younger, smaller"
            f: "m.sg"
          - form: "más chica"
            en: "younger, smaller"
            f: "f.sg"

  - ordinal: 6
    slug: "me-duele"
    title: "Say what hurts"
    summary: "Me duele la cabeza"
    grammar:
      - "doler.me-duele"
      - "cuerpo"
      - "salud.turno-guardia"
    register_max: "informal"
    sample:
      es: "Me duele la cabeza."
      en: "My head hurts."
    tips:
      - title: "Doler works like gustar"
        body: "The thing that hurts is the subject: **me duele la cabeza** — *my head hurts*, **me duelen
          los pies** — *my feet hurt*. The *me* says whose, so Spanish uses *la*, not *mi*."
      - title: "At the doctor's"
        body: "You ask for a **turno** (an appointment); the **guardia** is the emergency room. **Estoy
          engripado** — *I've got the flu* — is what gets you the day off."
    words:
      # The chunk is the form, as with me llamo: "duele" on its own never
      # says whose. docs/course-spec.md §1.5.
      - lemma: "doler"
        pos: "verb"
        en: "to hurt"
        forms:
          - form: "me duele"
            en: "hurts me"
            f: "3sg.pres.ind.clitic"
          - form: "me duelen"
            en: "hurt me"
            f: "3pl.pres.ind.clitic"
          - form: "te duele"
            en: "hurts you"
            f: "3sg.pres.ind.clitic"
          - form: "le duele"
            en: "hurts him, hurts her"
            f: "3sg.pres.ind.clitic"
          - form: "duele"
            f: "3sg.pres.ind"
            bound: true
          - form: "duelen"
            f: "3pl.pres.ind"
            bound: true
      - lemma: "cabeza"
        pos: "noun"
        en: "head"
      - lemma: "panza"
        pos: "noun"
        en: "belly, stomach"
      - lemma: "espalda"
        pos: "noun"
        en: "back"
      - lemma: "garganta"
        pos: "noun"
        en: "throat"
      - lemma: "muela"
        pos: "noun"
        en: "tooth (back tooth)"
      - lemma: "pierna"
        pos: "noun"
        en: "leg"
        forms:
          - form: "pierna"
            f: "f.sg"
          - form: "piernas"
            f: "f.pl"
      - lemma: "pie"
        pos: "noun"
        en: "foot"
        forms:
          - form: "pie"
            f: "m.sg"
          - form: "pies"
            en: "feet"
            f: "m.pl"
      - lemma: "mano"
        pos: "noun"
        en: "hand"
      - lemma: "fiebre"
        pos: "noun"
        en: "fever, temperature"
      - lemma: "remedio"
        pos: "noun"
        en: "medicine"
      - lemma: "turno"
        pos: "noun"
        en: "appointment"
      - lemma: "guardia"
        pos: "noun"
        en: "emergency room, ER"
      - lemma: "engripado"
        pos: "adj"
        en: "down with the flu"
        forms:
          - form: "engripado"
            f: "m.sg"
          - form: "engripada"
            f: "f.sg"
      - lemma: "descansar"
        pos: "verb"
        en: "to rest"
        forms:
          - form: "descansar"
            f: "inf"
          - form: "descansá"
            en: "rest"
            f: "2sg.imp.vos"

  - ordinal: 7
    slug: "te-llamo"
    title: "Keep it short with lo, la, le"
    summary: "Te llamo mañana"
    grammar:
      - "pronombres.objeto-directo"
      - "pronombres.objeto-indirecto"
      - "imperativo.vos.clitico"
    register_max: "informal"
    sample:
      es: "Te llamo mañana."
      en: "I'll call you tomorrow."
    tips:
      - title: "Lo, la, los, las"
        body: "**¿Tenés la tarjeta? Sí, la tengo.** The pronoun stands for the thing and goes before
          the verb: *lo* and *los* for masculine words, *la* and *las* for feminine ones."
      - title: "Stuck onto a command"
        body: "With a vos command the pronoun joins the end, and there is no accent: **llamame**,
          **mandame un audio**, **dame**, **prestame**. *Le* and *les* are *to him, to her, to them*."
    words:
      - lemma: "lo"
        pos: "pron"
        en: "it, him"
        glue: true
        forms:
          - form: "lo"
            f: "m.sg"
          - form: "la"
            en: "it, her"
            f: "f.sg"
          - form: "los"
            en: "them"
            f: "m.pl"
          - form: "las"
            en: "them"
            f: "f.pl"
      - lemma: "les"
        pos: "pron"
        en: "to them, them"
        glue: true
      - lemma: "llamar"
        pos: "verb"
        en: "to call"
        forms:
          - form: "llamo"
            en: "I call, I'll call"
            f: "1sg.pres.ind"
          - form: "llamás"
            en: "you call, you'll call"
            f: "2sg.pres.ind.vos"
          - form: "llama"
            en: "calls (he/she calls)"
            f: "3sg.pres.ind"
          - form: "llamar"
            f: "inf"
          - form: "llamame"
            en: "call me"
            f: "2sg.imp.vos.clitic"
      - lemma: "mandar"
        pos: "verb"
        en: "to send"
        forms:
          - form: "mando"
            en: "I send, I'll send"
            f: "1sg.pres.ind"
          - form: "mandás"
            en: "you send"
            f: "2sg.pres.ind.vos"
          - form: "mandame"
            en: "send me"
            f: "2sg.imp.vos.clitic"
      - lemma: "audio"
        pos: "noun"
        en: "voice message"
      - lemma: "buscar"
        pos: "verb"
        en: "to look for, to pick up"
        forms:
          - form: "busco"
            en: "I look for, I pick up"
            f: "1sg.pres.ind"
          - form: "buscás"
            en: "you look for, you pick up"
            f: "2sg.pres.ind.vos"
          - form: "buscar"
            f: "inf"
      - lemma: "dar"
        pos: "verb"
        en: "to give"
        forms:
          - form: "doy"
            en: "I give"
            f: "1sg.pres.ind.irregular"
          - form: "das"
            en: "you give"
            f: "2sg.pres.ind.vos"
          - form: "da"
            en: "gives (he/she gives)"
            f: "3sg.pres.ind"
          - form: "dame"
            en: "give me"
            f: "2sg.imp.vos.clitic"
      - lemma: "encontrar"
        pos: "verb"
        en: "to find"
        forms:
          - form: "encuentro"
            en: "I find"
            f: "1sg.pres.ind.irregular"
          - form: "encontrás"
            en: "you find"
            f: "2sg.pres.ind.vos"
      - lemma: "prestar"
