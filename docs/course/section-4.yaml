        en: "to invite, to treat (pay for someone)"
        forms:
          - form: "invitar"
            f: "inf"
          - form: "invito"
            en: "I invite"
            f: "1sg.pres.ind"
        note: "'Te invito' / 'invito yo' usually means I'm paying for you."
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "traer"
            f: "inf"
          - form: "traigo"
            en: "I bring"
            f: "1sg.pres.ind"
      - lemma: "asado"
        pos: "noun"
        en: "asado"
        note: "The Argentine barbecue: meat grilled slowly over coals, and the get-together around it."
      - lemma: "juntada"
        pos: "noun"
        en: "get-together"
        register: "informal"
      - lemma: "vino"
        pos: "noun"
        en: "wine"
      - lemma: "próximo"
        pos: "adj"
        en: "next"
        forms:
          - form: "próximo"
            f: "m.sg"
      - lemma: "copado"
        pos: "adj"
        en: "cool, great"
        register: "informal"
        forms:
          - form: "copado"
            f: "m.sg"
          - form: "copada"
            f: "f.sg"
      - lemma: "viste"
        pos: "interj"
        en: "you know?, see?"
        register: "informal"
      - lemma: "quilombo"
        pos: "noun"
        en: "mess, chaos"
        register: "lunfardo"
        note: "Very common but informal; avoid it in formal settings. Also used for a big problem or
          fuss."
      - lemma: "boludo"
