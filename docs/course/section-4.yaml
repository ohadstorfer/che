  - ordinal: 11
    slug: "practica-como-estuvo"
    title: "Practice: how it all went"
    summary: "¿Y? ¿Cómo estuvo?"
    grammar:
      - "repaso.preterito"
      - "repaso.preterito.plural"
    register_max: "informal"
    sample:
      es: "Anoche cenamos afuera y la pasamos bárbaro."
      en: "We ate out last night and had a great time."
    tips:
      - title: "One past for everyone"
        body: "**Cené, cenaste, cenó, cenamos, cenaron**; **viví, viviste, vivió, vivimos, vivieron**. Two
          sets of endings, and every regular verb takes one of them: -ar verbs go like *cenar*; -er
          and -ir verbs go like *vivir*."
      - title: "We: now or then?"
        body: "**Cenamos** and **salimos** look the same in the present and the past: *we have dinner* or
          *we had dinner*, *we go out* or *we went out*. Only -ar and -ir verbs do this; -er verbs
          change: **comemos** (now), **comimos** (then). A porteño never gets lost: **anoche**,
          **ayer**, **el sábado** — the time word does the work."
    review:
      - "cenamos"
      - "pagué"
      - "llegaron"
      - "invitaste"
      - "nací"
      - "volví"
      - "vivieron"
      - "entendí"
      - "estuvimos"
      - "tuvieron"
      - "ganamos"
      - "la pasé"
      - "compré"
      - "saliste"
  - ordinal: 12
