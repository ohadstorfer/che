  - ordinal: 9
    slug: "de-viaje"
    title: "Talk about a trip"
    summary: "Me voy de viaje"
    grammar:
      - "viajes"
      - "preterito.viajar"
    register_max: "informal"
    sample:
      es: "En enero viajé a Mar del Plata."
      en: "In January I went to Mar del Plata."
    tips:
      - title: "Micro, not colectivo"
        body: "The *colectivo* crosses the city; to go to another city you take the **micro** (the
          coach). You buy the **pasaje** at the terminal or online."
      - title: "Summer is in January"
        body: "Porteños go on **vacaciones** in January and February, and *la costa* — Mar del Plata,
          Pinamar — is where half of Buenos Aires ends up."
