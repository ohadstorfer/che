            en: "I wash"
            f: "1sg.pres.ind"
          - form: "lavás"
            en: "you wash"
            f: "2sg.pres.ind.vos"
          - form: "lavar"
            f: "inf"
      - lemma: "ordenar"
        pos: "verb"
        en: "to tidy"
        forms:
