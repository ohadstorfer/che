  - ordinal: 26
    slug: "practica-las-vacaciones"
    title: "Practice: calls, chores and the holidays"
    summary: "Te mandé las fotos"
    grammar:
      - "repaso.pronombres.preterito"
      - "repaso.preterito"
    register_max: "informal"
    sample:
      es: "Te mandé las fotos del viaje: nadamos en el río todos los días."
      en: "I sent you the photos from the trip: we swam in the river every day."
    tips:
      - title: "Lo mandé, la vi"
        body: "The pronoun works the same in the past: **¿Las fotos? Ya las mandé.** **¿El video? Lo vi
          anoche.** **¿A Sofi? La llamé ayer.** Before the verb, always — only a command takes it on
          the end."
      - title: "Me tocó, llovió"
        body: "**Me tocó** works like *gustar*: the thing is the subject, so with two things it is **me
          tocaron**: *me tocaron los platos y el baño*. **Llovió** has no person at all — just *it
          rained*."
    review:
