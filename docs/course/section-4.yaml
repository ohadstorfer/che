            en: "you arrive"
            f: "2sg.pres.ind.vos"
          - form: "llega"
            en: "arrives (he/she arrives)"
            f: "3sg.pres.ind"
          - form: "llegar"
            f: "inf"
          - form: "llegando"
            en: "arriving"
            f: "ger"
