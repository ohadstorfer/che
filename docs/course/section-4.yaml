  - ordinal: 3
    slug: "ahora-y-planes"
    title: "Make plans with friends"
    summary: "¿Qué llevo al asado?"
    grammar:
      - "estar.gerundio"
      - "ir-a.infinitivo"
      - "la-semana-que-viene"
      - "registro.informal"
    register_max: "lunfardo"
    sample:
      es: "¿Qué llevo al asado?"
      en: "What should I bring to the asado?"
    tips:
      - title: "Llevar or traer"
        body: "English *bring* is two verbs here. **Llevar** is to a place where you are not yet: *¿Qué
          llevo al asado?* **Traer** is to the place where you are now: *¿Podés traer hielo?* Going
          to a friend's place, always ask **¿qué llevo?** **Venir** works like *traer*: on your way
          to someone, say **ya voy**, not *vengo*."
      - title: "El próximo, la próxima"
        body: "**El próximo viernes** is *next Friday* — the same as *el viernes que viene*; **el próximo
          finde** is *next weekend*. **La próxima** alone is *next time*: *La próxima invito yo.*
          **La semana que viene** — *next week*, the week that comes — is the form you will hear
          most."
      - title: "Boludo and quilombo"
        body: "**Boludo** is common between close friends and an insult to anyone else — say it only to
          friends you know well. **Quilombo** means a mess; it's informal, not rude, but keep it out
          of formal settings."
    words:
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vengo"
            en: "I come"
            f: "1sg.pres.ind"
          - form: "venís"
            en: "you come"
            f: "2sg.pres.ind.vos"
          - form: "viene"
            en: "comes (he/she comes)"
            f: "3sg.pres.ind"
      - lemma: "quedar"
        pos: "verb"
        en: "to arrange, to agree"
        forms:
