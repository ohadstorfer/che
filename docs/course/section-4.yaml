  - ordinal: 24
    slug: "de-viaje"
    title: "Talk about a trip"
    summary: "Me voy de viaje"
    grammar:
      - "viajes"
      - "preterito.viajar"
    register_max: "informal"
    sample:
      es: "En enero viajé a Mar del Plata."
      en: "In January I went to Mar del Plata."
    tips:
      - title: "Micro, not colectivo"
        body: "The *colectivo* crosses the city; to go to another city you take the **micro** (the
          long-distance bus). You buy the **pasaje** at the terminal or online. A round-trip ticket
          is **ida y vuelta**. In Buenos Aires the micros leave from the **terminal** of Retiro, and
          the airports are Ezeiza (international) and Aeroparque (in the city)."
      - title: "January, and e for y"
        body: "Porteños go on **vacaciones** in January and February, and *la costa* — Mar del Plata,
          Pinamar — is where half of Buenos Aires ends up. A small detail: **y** turns into **e**
          before an *i* sound — *fuimos a la montaña e hizo mucho frío*."
      - title: "Fui a, me fui a"
        body: "For where you went, porteños say **fui a** or **me fui a**: *me fui a Bariloche*, *¿adónde te
          fuiste en enero?* **Viajar** is for the trip itself: *viajé en micro*, *viajé sola*,
          *viajo mañana*."
    words:
