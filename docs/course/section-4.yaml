            f: "1sg.pret.ind"
          - form: "estudiaste"
            en: "you studied"
            f: "2sg.pret.ind.vos"
          - form: "estudió"
            en: "studied (he/she studied)"
            f: "3sg.pret.ind"
      - lemma: "hablar"
