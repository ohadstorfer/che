  - ordinal: 10
    slug: "contame"
    title: "Tell the whole story"
    summary: "Contame todo"
    grammar:
      - "repaso.preterito"
      - "relato.conectores"
    register_max: "informal"
    sample:
      es: "Contame qué pasó."
      en: "Tell me what happened."
    tips:
      - title: "How a porteño tells it"
        body: "**Contame** opens it; **de repente** is the twist, **por suerte** the relief, **al
          final** the end. **Igual** — *anyway* — goes almost anywhere, and **o sea** is *I mean*."
      - title: "¡Qué garrón!"
        body: "When the story ends badly, the answer is **¡Qué garrón!** — *what a drag!* Informal,
          and everywhere."
    words:
      - lemma: "contar"
        pos: "verb"
        en: "to tell"
        forms:
          - form: "contame"
            en: "tell me"
            f: "2sg.imp.vos.clitic"
          - form: "contás"
            en: "you tell"
            f: "2sg.pres.ind.vos"
          - form: "cuento"
            en: "I tell"
            f: "1sg.pres.ind.irregular"
      - lemma: "de repente"
        pos: "phrase"
        en: "suddenly"
      - lemma: "por suerte"
        pos: "phrase"
        en: "luckily"
      - lemma: "igual"
        pos: "adv"
        en: "anyway"
      - lemma: "o sea"
        pos: "phrase"
        en: "I mean"
      - lemma: "garrón"
        pos: "noun"
        en: "drag, bummer"
        register: "informal"
