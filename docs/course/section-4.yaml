    sample:
      es: "El finde vi una película con Sofi."
      en: "At the weekend I watched a film with Sofi."
    tips:
      - title: "The irregular ones"
        body: "The verbs you use most have their own past: **hice** (I did), **vi** (I saw), **dije** (I
          said), **vine** (I came), **pude** (I could). No accent on any of them."
      - title: "¿Viste?"
        body: "**Viste** is *you saw*: **¿Viste el partido?** — *Did you see the game?* Porteños also add
          **¿viste?** at the end of a sentence to mean *you know?*: *Es re caro, ¿viste?*"
      - title: "Después, entonces"
        body: "Tell a story in order with **primero**, **después**, **al final**: *Primero comimos, después
          vimos una película.* **Entonces** is mostly *so*: *No pude ir, entonces vi el partido en
          casa.*"
