  - ordinal: 8
    slug: "las-tareas"
    title: "Split the chores"
    summary: "Hoy te toca a vos"
    grammar:
      - "tareas.de-la-casa"
      - "me-toca"
    register_max: "informal"
    sample:
      es: "Hoy te toca lavar los platos."
      en: "It's your turn to do the dishes today."
    tips:
      - title: "Me toca"
        body: "**Me toca a mí** — *it's my turn*. **¿A quién le toca?** — *whose turn is it?* The
          chore follows as it is: **te toca lavar los platos**."
      - title: "Las compras"
        body: "**Hacer las compras** is doing the food shopping; **sacar la basura** is taking the
          rubbish out."
    words:
      - lemma: "limpiar"
        pos: "verb"
        en: "to clean"
        forms:
          - form: "limpio"
            en: "I clean"
            f: "1sg.pres.ind"
          - form: "limpiás"
            en: "you clean"
            f: "2sg.pres.ind.vos"
          - form: "limpiar"
            f: "inf"
      - lemma: "lavar"
