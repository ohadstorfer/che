      en: "I'll call you tomorrow."
    tips:
      - title: "Lo, la, los, las"
        body: "**¿Tenés la tarjeta? Sí, la tengo.** The pronoun stands for the thing and goes before the
          verb: *lo* and *los* for masculine words, *la* and *las* for feminine ones."
      - title: "Stuck onto a command"
        body: "With a vos command the pronoun joins the end, and there is no accent: **llamame**, **mandame
          un audio**, **dame**, **prestame**. *Le* and *les* are *to him, to her, to them*. To pick
          someone up, porteños say **pasar a buscar**: *te paso a buscar a las ocho*, *pasame a
          buscar*."
      - title: "Se lo, se la"
        body: "Two pronouns together go person first, thing second: **me lo** mandás, **te la** doy. And
          *le* or *les* in front of *lo, la, los, las* turns into **se**: *¿le mandás el audio?* →
          **¿se lo mandás?**; *le doy la llave* → **se la doy**."
