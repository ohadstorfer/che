    slug: "el-cumple"
    title: "Get ready for a birthday"
    summary: "Estoy preparando la torta para el cumple"
    grammar:
      - "estar.gerundio"
      - "ir-a.infinitivo"
      - "la-semana-que-viene"
      - "registro.informal"
    register_max: "informal"
    sample:
      es: "Estoy preparando la torta para el cumple de Sofi."
      en: "I'm making the cake for Sofi's birthday."
    tips:
      - title: "-ando, -iendo"
        body: "Right now: **estar** + the verb in *-ando* (for -ar verbs) or *-iendo* (for -er and -ir):
          *estoy cocin**ando***, *está escrib**iendo***. Two to learn by ear: **leyendo**,
          **durmiendo**."
      - title: "El cumple"
        body: "Nobody says *cumpleaños* in a hurry: it's **el cumple** — *¡Feliz cumple!* The verb is
          **cumplir**, to turn an age: *¿Cuántos años cumplís?* — *Cumplo treinta.* And *cumplís
          años el domingo* means your birthday is on Sunday."
      - title: "Te voy a esperar"
        body: "With two verbs, the little word goes before the first one or on the end of the second — never
          in between: **te voy a esperar** = **voy a esperarte**; **¿me vas a ayudar?** = **¿vas a
          ayudarme?** Porteños mostly put it first."
