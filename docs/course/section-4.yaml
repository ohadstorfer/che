        body: "**Me toca a mí** — *it's my turn*. **¿A quién le toca?** — *whose turn is it?* The chore
          follows in its basic form (*lavar*, *sacar*, *limpiar*): **te toca lavar los platos**. Add
          *a mí* / *a vos* for stress: **hoy te toca a vos**."
      - title: "Las compras"
        body: "**Hacer las compras** is doing the food shopping; **sacar la basura** is taking the trash
          out."
      - title: "Limpio, limpia"
        body: "**Limpio** is *I clean* — and also *clean*, the opposite of *sucio*: *limpio el baño* — *el
          baño está limpio*, *la cocina está limpia*."
