  - ordinal: 23
    slug: "quien-lavo"
    title: "Say who did which chore"
    summary: "Ayer me tocó a mí"
    grammar:
      - "tareas.de-la-casa"
      - "me-toca"
      - "preterito.tareas"
    register_max: "informal"
    sample:
      es: "Ayer me tocó a mí: lavé los platos y saqué la basura."
      en: "Yesterday it was my turn: I did the dishes and took out the rubbish."
    tips:
      - title: "Me tocó"
        body: "The turn has a past: **ayer me tocó a mí, hoy te toca a vos**. **¿A quién le tocó?** Most
          chores are plain -ar verbs: **lavé, limpiaste, lavó**. *Sacar* changes in *yo*: **saqué**
          (like *busqué*). *Barrer* is an -er verb: **barrí, barriste**."
      - title: "El lavarropas"
        body: "Clothes go in the **lavarropas**; to **planchar** them is optional for most porteños. The
          floor: **barrer** with the **escoba**, then you **pasás el trapo** — the wet *trapo de
          piso*."
      - title: "Me tocó: I got"
        body: "**Me tocó** is also what you *got* without choosing: **me tocó el baño** — *I got the
          bathroom*; **me tocó laburar el domingo** — *I had to work on Sunday*; **me tocó un profe
          re copado** — *I got a really cool teacher*."
    words:
