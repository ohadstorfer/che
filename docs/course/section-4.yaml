  - ordinal: 2
    slug: "estoy-llegando"
    title: "Say what you're doing right now"
    summary: "Ya estoy llegando"
    grammar:
      - "estar.gerundio"
      - "ya-todavia"
    register_max: "informal"
    sample:
      es: "Ya estoy llegando"
      en: "I'm almost there"
    tips:
      - title: "-ando, -iendo"
        body: "Verbs in *-ar* take **-ando**: **laburando**, **esperando**, **tomando**. Verbs in *-er* and
          *-ir* take **-iendo**: **comiendo**, **haciendo**. That ending never changes — only
          *estar* does: *Estoy comiendo.* *Está tomando un café.*"
      - title: "Ya, todavía, casi"
        body: "**Ya** is *already* or *right now*; **todavía** is *still*: *Todavía estoy laburando.*
          *Todavía no* is *not yet*. **Casi** is *almost*. One warning: in Buenos Aires **ya estoy
          llegando** can mean you are still ten minutes away."
    words:
