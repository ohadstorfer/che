  - ordinal: 14
    slug: "mas-alto-que"
    title: "Compare people and things"
    summary: "Más alto que yo"
    grammar:
      - "comparativo.mas-menos-que"
      - "comparativo.tan-como"
      - "comparativo.mejor-peor"
      - "superlativo.isimo"
    register_max: "informal"
    sample:
      es: "Mi hermana es más alta que yo."
      en: "My sister is taller than me."
    tips:
      - title: "Más… que, menos… que"
        body: "**Más caro que**, **menos lejos que** — *more expensive than*, *less far than*. **Tan lindo
          como** is *as nice as*. *Better* and *worse* have their own words: **mejor**, **peor**."
      - title: "Older and younger"
        body: "A porteño's older sister is *mi hermana **más grande***, the younger one *mi hermano **más
          chico***. And *-ísimo* turns anything up: **riquísimo**, **carísimo**."
    words:
      - lemma: "tan"
        pos: "adv"
        en: "as, so"
      - lemma: "como"
        pos: "conj"
        en: "as, like"
        glue: true
      - lemma: "mejor"
