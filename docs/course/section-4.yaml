          duele el oído** — and you leave with **una curita** or **unas pastillas**. To ask:
          **¿Tenés algo para la alergia?** — **Necesito algo para la garganta.** A broken bone is
          **quebrado**: *tiene el brazo quebrado*. And when you hurt yourself: **me lastimé la
          rodilla**."
