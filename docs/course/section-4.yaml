  - ordinal: 4
    slug: "que-decis"
    title: "Say, see and put: three everyday verbs"
    summary: "¿Qué decís? No veo nada"
    grammar:
      - "decir.pres"
      - "ver.pres"
      - "poner.pres"
    register_max: "informal"
    sample:
      es: "¿Qué decís? No veo nada"
      en: "What are you saying? I can't see anything"
    tips:
      - title: "Digo, pongo, veo"
        body: "Like *vengo* and *traigo*, these verbs have an odd *I* form: **digo**, **pongo** and **veo**.
          With vos they are regular: **decís**, **ponés**, **ves**. *Decir* also changes **e** to
          **i** in **dice** and **dicen**. *—¿Qué decís? —Yo no digo nada.* To tell someone, add
          **le**: *¿Qué le digo a Ana?*"
      - title: "No veo nada"
        body: "English says *I can't see anything*; Spanish just says **no veo nada** — no word for *can*.
          The same with **ves**: *¿Ves?* is *can you see?* And the double negative is correct
          Spanish: *no* before the verb, *nada* after it."
    words:
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "digo"
            en: "I say"
            f: "1sg.pres.ind.irregular"
          - form: "decís"
            en: "you say"
            f: "2sg.pres.ind.vos"
          - form: "dice"
            en: "says (he/she says)"
            f: "3sg.pres.ind.irregular"
          - form: "dicen"
            en: "they say, people say"
            f: "3pl.pres.ind.irregular"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "veo"
            en: "I see"
            f: "1sg.pres.ind.irregular"
          - form: "ves"
            en: "you see"
            f: "2sg.pres.ind.vos"
      - lemma: "poner"
        pos: "verb"
        en: "to put"
        forms:
          - form: "pongo"
            en: "I put"
            f: "1sg.pres.ind.irregular"
          - form: "pone"
            en: "puts, sets; gets (+ feeling)"
            f: "3sg.pres.ind.irregular"
      - lemma: "poner"
        pos: "verb"
        en: "to put"
        forms:
          - form: "ponés"
            en: "you put"
          - form: "poner"
            en: "to put"
  - ordinal: 5
    slug: "ayer-labure"
    title: "Say what you did yesterday"
    summary: "Ayer laburé"
    grammar:
      - "preterito.ar.singular"
      - "tiempo.ayer-anoche-pasado"
    register_max: "informal"
    sample:
      es: "Ayer laburé mucho."
      en: "I worked a lot yesterday."
    tips:
      - title: "The past, one person at a time"
        body: "For anything finished, Buenos Aires uses one past: *laburé* (I worked), *laburaste* (you
          worked), *laburó* (he/she worked). The stress is what tells *laburo* (I work) from
          *laburó* (he worked) — the accent is not decoration."
      - title: "Not \"he trabajado\""
        body: "Spain says *hoy he trabajado*; a porteño says **hoy laburé**. Even for today, even for
          something that just happened: **¿Llegaste?** — *Did you get here?*"
      - title: "Hace = ago"
        body: "**Hace** + a time is *ago*: **llegué hace una hora** — *I got here an hour ago*; **hablé con
          Juan hace dos días**. *Not long ago* is **hace poco**, and the question is **¿hace
          cuánto?** — *how long ago?*"
    words:
      - lemma: "laburar"
        pos: "verb"
        forms:
          - form: "laburé"
            en: "I worked"
            f: "1sg.pret.ind"
          - form: "laburaste"
            en: "you worked"
            f: "2sg.pret.ind.vos"
          - form: "laburó"
            en: "worked (he/she worked)"
            f: "3sg.pret.ind"
