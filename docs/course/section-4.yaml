            en: "I take out"
            f: "1sg.pres.ind"
          - form: "sacás"
            en: "you take out"
            f: "2sg.pres.ind.vos"
          - form: "sacar"
            f: "inf"
      # "Toca" on its own is "touches" or "plays"; the turn is only ever the
      # chunk. docs/course-spec.md §1.5.
      - lemma: "tocar"
        pos: "verb"
        en: "to be someone's turn"
        forms:
