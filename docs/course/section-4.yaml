            en: "it's my turn"
            f: "3sg.pres.ind.clitic"
          - form: "te toca"
            en: "it's your turn"
            f: "3sg.pres.ind.clitic"
          - form: "le toca"
            en: "it's his turn, it's her turn"
            f: "3sg.pres.ind.clitic"
          - form: "toca"
            f: "3sg.pres.ind"
