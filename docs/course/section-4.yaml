        body: "Tell your life story with the past you already know: **nací** (*I was born*), **viví**,
          **volví**. **Me crié** is *I grew up*, and it always takes **me**: *Nací en Italia, pero
          me crié en Buenos Aires.* To ask: *¿Te criaste acá?*"
      - title: "¿Dónde naciste?"
        body: "It comes right after *¿de dónde sos?*: **¿Dónde naciste?** — **Nací en Rosario, pero vivo
          acá.** And when you didn't catch what someone said, it's the past too: **perdón, no
          entendí**. Where you grew up is **me crié**: *Nací en Rosario, pero me crié en Córdoba.* —
          *¿Dónde te criaste?*"
