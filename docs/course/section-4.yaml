      es: "El sábado fui a la cancha con mi viejo."
      en: "On Saturday I went to the stadium with my dad."
    tips:
      - title: "Fui: went, and was"
        body: "*Ir* and *ser* share their past: **fui, fuiste, fue**. *Fui a la cancha* — *I went to the
          stadium*; *fue bárbaro* — *it was great*. The rest of the sentence tells which."
      - title: "¿Cómo te fue?"
        body: "The porteño *how did it go?* is **¿Cómo te fue?**, and the answer is **Me fue bien** or **Me
          fue re mal**."
      - title: "¿Cómo estuvo?"
        body: "To say how something was, porteños mostly use **estuvo**: *¿Cómo estuvo el partido? Estuvo
          bárbaro.* **Fue** works too, for events: *el recital fue bárbaro*."
