# ---------------------------------------------------------------------------
# Che — Section 4 outline: "What happened" (A2.1)
#
# The past arrives. Buenos Aires tells anything finished in the simple past —
# "hoy comí", "¿viste?" — never "he comido" (Appendix B; the linter rejects the
# compound past), so the preterite is the one past this section teaches, one
# person at a time the way the present was: yo and vos first, then él/ella,
# then nosotros. Around it: telling a weekend, comparing, saying what hurts,
# the object pronouns that make answers short ("¿Lo tenés?" "Sí, lo tengo"),
# chores, and a trip. Unit 10 is the checkpoint: telling a story end to end.
#
# Plan and reasoning: docs/course/roadmap.md §Section 4.
# Conventions: see section-1.yaml. New feature tag: `pret` (pretérito).
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 4
  slug: "what-happened"
  title: "What happened"
  cefr: "A2.1"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "ayer-labure"
    title: "Say what you did yesterday"
    summary: "Ayer laburé"
    grammar:
      - "preterito.ar.singular"
      - "tiempo.ayer-anoche-pasado"
    register_max: "informal"
    sample:
      es: "Ayer laburé mucho."
      en: "I worked a lot yesterday."
    tips:
      - title: "The past, one person at a time"
        body: "For anything finished, Buenos Aires uses one past: *laburé* (I worked), *laburaste* (you
          worked), *laburó* (he/she worked). The stress is what tells *laburo* (I work) from *laburó*
          (he worked) — the accent is not decoration."
      - title: "Not \"he trabajado\""
        body: "Spain says *hoy he trabajado*; a porteño says **hoy laburé**. Even for today, even for
          something that just happened: **¿Llegaste?** — *Did you get here?*"
    words:
      - lemma: "laburar"
        pos: "verb"
        forms:
          - form: "laburé"
            en: "I worked"
            f: "1sg.pret.ind"
          - form: "laburaste"
            en: "you worked"
            f: "2sg.pret.ind.vos"
          - form: "laburó"
            en: "worked (he/she worked)"
            f: "3sg.pret.ind"
      - lemma: "estudiar"
        pos: "verb"
        forms:
          - form: "estudié"
            en: "I studied"
            f: "1sg.pret.ind"
          - form: "estudiaste"
            en: "you studied"
            f: "2sg.pret.ind.vos"
          - form: "estudió"
            en: "studied (he/she studied)"
            f: "3sg.pret.ind"
      - lemma: "hablar"
        pos: "verb"
        forms:
          - form: "hablé"
            en: "I spoke, I talked"
            f: "1sg.pret.ind"
          - form: "hablaste"
            en: "you spoke, you talked"
            f: "2sg.pret.ind.vos"
          - form: "habló"
            en: "spoke (he/she spoke)"
            f: "3sg.pret.ind"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegué"
            en: "I arrived, I got here"
            f: "1sg.pret.ind"
          - form: "llegaste"
            en: "you arrived, you got here"
            f: "2sg.pret.ind.vos"
          - form: "llegó"
            en: "arrived (he/she arrived)"
            f: "3sg.pret.ind"
      - lemma: "tomar"
        pos: "verb"
        forms:
          - form: "tomé"
            en: "I drank, I took"
            f: "1sg.pret.ind"
          - form: "tomaste"
            en: "you drank, you took"
            f: "2sg.pret.ind.vos"
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "compré"
            en: "I bought"
            f: "1sg.pret.ind"
          - form: "compraste"
            en: "you bought"
            f: "2sg.pret.ind.vos"
          - form: "compró"
            en: "bought (he/she bought)"
            f: "3sg.pret.ind"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasó"
            en: "happened"
            f: "3sg.pret.ind"
      - lemma: "ayer"
        pos: "adv"
        en: "yesterday"
      - lemma: "anoche"
        pos: "adv"
        en: "last night"
      - lemma: "pasado"
        pos: "adj"
        en: "last"
        forms:
          - form: "pasado"
            f: "m.sg"
          - form: "pasada"
            f: "f.sg"

  - ordinal: 2
    slug: "cenamos-afuera"
    title: "Say what you all did last night"
    summary: "Anoche cenamos afuera"
    grammar:
      - "preterito.ar.singular"
      - "tiempo.ayer-anoche-pasado"
      - "preterito.ar.plural"
    register_max: "informal"
    sample:
      es: "Anoche cenamos afuera y pagué yo."
      en: "We ate out last night and I paid."
    tips:
      - title: "Nosotros and ellos"
        body: "The past has an ending for everyone: **cenamos** (we had dinner), **llegaron** (they
          arrived, you all arrived). *-amos* looks like the present — **anoche cenamos** tells you
          when — and *-aron* is only ever the past."
      - title: "Pagué, llegué"
        body: "In *yo* the spelling bends to keep the sound: *pagar* → **pagué**, *llegar* →
          **llegué**. At the end of the night someone says **pago yo** — and the next day, **ayer
          pagué yo, hoy te toca a vos**."
    words:
      - lemma: "cenar"
        pos: "verb"
        forms:
          - form: "cené"
            en: "I had dinner"
            f: "1sg.pret.ind"
          - form: "cenaste"
            en: "you had dinner"
            f: "2sg.pret.ind.vos"
          - form: "cenamos"
            en: "we had dinner"
            f: "1pl.pret.ind"
      - lemma: "pagar"
        pos: "verb"
        forms:
          - form: "pagué"
            en: "I paid"
            f: "1sg.pret.ind"
          - form: "pagaste"
            en: "you paid"
            f: "2sg.pret.ind.vos"
          - form: "pagó"
            en: "paid (he/she paid)"
            f: "3sg.pret.ind"
      - lemma: "invitar"
        pos: "verb"
        forms:
          - form: "invité"
            en: "I invited, I treated"
            f: "1sg.pret.ind"
          - form: "invitaste"
            en: "you invited, you treated"
            f: "2sg.pret.ind.vos"
          - form: "invitó"
            en: "invited, treated (he/she invited)"
            f: "3sg.pret.ind"
      - lemma: "cocinar"
        pos: "verb"
        forms:
          - form: "cociné"
            en: "I cooked"
            f: "1sg.pret.ind"
          - form: "cocinaste"
            en: "you cooked"
            f: "2sg.pret.ind.vos"
          - form: "cocinó"
            en: "cooked (he/she cooked)"
            f: "3sg.pret.ind"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperé"
            en: "I waited"
            f: "1sg.pret.ind"
          - form: "esperaste"
            en: "you waited"
            f: "2sg.pret.ind.vos"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegamos"
            en: "we arrived, we got there"
            f: "1pl.pret.ind"
          - form: "llegaron"
            en: "they arrived"
            f: "3pl.pret.ind"
      - lemma: "tomar"
        pos: "verb"
        forms:
          - form: "tomó"
            en: "drank, took (he/she drank)"
            f: "3sg.pret.ind"
          - form: "tomaron"
            en: "they drank, they took"
            f: "3pl.pret.ind"
      - lemma: "hablar"
        pos: "verb"
        forms:
          - form: "hablaron"
            en: "they talked"
            f: "3pl.pret.ind"
      - lemma: "caminar"
        pos: "verb"
        forms:
          - form: "caminé"
            en: "I walked"
            f: "1sg.pret.ind"
          - form: "caminamos"
            en: "we walked"
            f: "1pl.pret.ind"
      - lemma: "gastar"
        pos: "verb"
        en: "to spend"
        forms:
          - form: "gasté"
            en: "I spent"
            f: "1sg.pret.ind"
          - form: "gastaste"
            en: "you spent"
            f: "2sg.pret.ind.vos"

  - ordinal: 3
    slug: "comi-y-sali"
    title: "Say what you ate and where you went out"
    summary: "Anoche salí"
    grammar:
      - "preterito.er-ir.singular"
      - "preterito.nosotros"
      - "recien"
    register_max: "informal"
    sample:
      es: "Anoche salí con mis amigos."
      en: "I went out with my friends last night."
    tips:
      - title: "-er and -ir share one past"
        body: "*Comer* and *salir* take the same endings: **comí, comiste, comió**; **salí, saliste,
          salió**. For *nosotros* the past looks like the present — *salimos* — and *anoche* or
          *ayer* says which one it is."
      - title: "Recién"
        body: "**Recién llegué** — *I just got here*. A porteño uses *recién* with the plain past where
          English says *just*."
    words:
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "comí"
            en: "I ate"
            f: "1sg.pret.ind"
          - form: "comiste"
            en: "you ate"
            f: "2sg.pret.ind.vos"
          - form: "comió"
            en: "ate (he/she ate)"
            f: "3sg.pret.ind"
          - form: "comimos"
            en: "we ate"
            f: "1pl.pret.ind"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salí"
            en: "I went out, I left"
            f: "1sg.pret.ind"
          - form: "saliste"
            en: "you went out, you left"
            f: "2sg.pret.ind.vos"
          - form: "salió"
            en: "went out (he/she went out)"
            f: "3sg.pret.ind"
      - lemma: "escribir"
        pos: "verb"
        forms:
          - form: "escribí"
            en: "I wrote"
            f: "1sg.pret.ind"
          - form: "escribiste"
            en: "you wrote"
            f: "2sg.pret.ind.vos"
      - lemma: "aprender"
        pos: "verb"
        forms:
          - form: "aprendí"
            en: "I learned"
            f: "1sg.pret.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viví"
            en: "I lived"
            f: "1sg.pret.ind"
      - lemma: "conocer"
        pos: "verb"
        en: "to know (a person, a place), to meet"
        forms:
          - form: "conozco"
            en: "I know"
            f: "1sg.pres.ind.irregular"
          - form: "conocés"
            en: "you know"
            f: "2sg.pres.ind.vos"
          - form: "conocí"
            en: "I met"
            f: "1sg.pret.ind"
          - form: "conociste"
            en: "you met"
            f: "2sg.pret.ind.vos"
          - form: "conocer"
            en: "to see, to get to know"
            f: "inf"
      - lemma: "recién"
        pos: "adv"
        en: "just (a moment ago)"

  - ordinal: 4
    slug: "naci-en"
    title: "Tell where you were born and where you've lived"
    summary: "Nací en Rosario"
    grammar:
      - "preterito.er-ir.singular"
      - "preterito.nosotros"
      - "recien"
      - "preterito.er-ir.plural"
    register_max: "informal"
    sample:
      es: "Nací en Córdoba, pero viví diez años en Rosario."
      en: "I was born in Córdoba, but I lived in Rosario for ten years."
    tips:
      - title: "Your story in -í, -iste, -ió"
        body: "**Nací**, **viví**, **volví** — the -er and -ir past you already know tells a whole life.
          For *ellos* it ends in **-ieron**: *mis viejos **vivieron** en Brasil*, ***salieron**
          temprano*."
      - title: "¿Dónde naciste?"
        body: "It comes right after *¿de dónde sos?*: **¿Dónde naciste?** — **Nací en Rosario, pero
          vivo acá.** And when you didn't catch what someone said, it's the past too: **perdón, no
          entendí**."
    words:
      - lemma: "nacer"
        pos: "verb"
        en: "to be born"
        forms:
          - form: "nací"
            en: "I was born"
            f: "1sg.pret.ind"
          - form: "naciste"
            en: "you were born"
            f: "2sg.pret.ind.vos"
          - form: "nació"
            en: "was born"
            f: "3sg.pret.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viviste"
            en: "you lived"
            f: "2sg.pret.ind.vos"
          - form: "vivió"
            en: "lived (he/she lived)"
            f: "3sg.pret.ind"
          - form: "vivieron"
            en: "they lived"
            f: "3pl.pret.ind"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volví"
            en: "I came back"
            f: "1sg.pret.ind"
          - form: "volviste"
            en: "you came back"
            f: "2sg.pret.ind.vos"
          - form: "volvió"
            en: "came back (he/she came back)"
            f: "3sg.pret.ind"
      - lemma: "entender"
        pos: "verb"
        forms:
          - form: "entendí"
            en: "I understood, I got it"
            f: "1sg.pret.ind"
          - form: "entendiste"
            en: "you understood, you got it"
            f: "2sg.pret.ind.vos"
      - lemma: "aprender"
        pos: "verb"
        forms:
          - form: "aprendiste"
            en: "you learned"
            f: "2sg.pret.ind.vos"
          - form: "aprendió"
            en: "learned (he/she learned)"
            f: "3sg.pret.ind"
      - lemma: "conocer"
        pos: "verb"
        forms:
          - form: "conoció"
            en: "met (he/she met)"
            f: "3sg.pret.ind"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salieron"
            en: "they went out, they left"
            f: "3pl.pret.ind"
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "comieron"
            en: "they ate"
            f: "3pl.pret.ind"
      - lemma: "vida"
        pos: "noun"
        en: "life"
      - lemma: "donde"
        pos: "adv"
        en: "where (the place where)"

  - ordinal: 5
    slug: "fui-a-la-cancha"
    title: "Say where you went and how it was"
    summary: "¿Cómo te fue?"
    grammar:
      - "preterito.ir-ser"
      - "preterito.estar-tener"
      - "como-te-fue"
    register_max: "informal"
    sample:
      es: "El sábado fui a la cancha con mi viejo."
      en: "On Saturday I went to the stadium with my dad."
    tips:
      - title: "Fui: went, and was"
        body: "*Ir* and *ser* share their past: **fui, fuiste, fue**. *Fui a la cancha* — *I went to
          the stadium*; *fue bárbaro* — *it was great*. The rest of the sentence tells which."
      - title: "¿Cómo te fue?"
        body: "The porteño *how did it go?* is **¿Cómo te fue?**, and the answer is **Me fue bien** or
          **Me fue re mal**."
    words:
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "fui"
            en: "I went"
            f: "1sg.pret.ind.irregular"
          - form: "fuiste"
            en: "you went"
            f: "2sg.pret.ind.vos.irregular"
          - form: "fue"
            en: "went (he/she went)"
            f: "3sg.pret.ind.irregular"
          - form: "fuimos"
            en: "we went"
            f: "1pl.pret.ind.irregular"
          - form: "fueron"
            en: "they went"
            f: "3pl.pret.ind.irregular"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "fue"
            en: "was (it was)"
            f: "3sg.pret.ind.irregular"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estuve"
            en: "I was (somewhere)"
            f: "1sg.pret.ind.irregular"
          - form: "estuviste"
            en: "you were (somewhere)"
            f: "2sg.pret.ind.vos.irregular"
          - form: "estuvo"
            en: "was (somewhere)"
            f: "3sg.pret.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tuve"
            en: "I had"
            f: "1sg.pret.ind.irregular"
          - form: "tuviste"
            en: "you had"
            f: "2sg.pret.ind.vos.irregular"
          - form: "tuvo"
            en: "had (he/she had)"
            f: "3sg.pret.ind.irregular"
      - lemma: "partido"
        pos: "noun"
        en: "match, game"
      - lemma: "recital"
        pos: "noun"
        en: "concert, gig"

  - ordinal: 6
    slug: "la-pasamos-barbaro"
    title: "Say how the game and the night went"
    summary: "La pasamos bárbaro"
    grammar:
      - "preterito.ir-ser"
      - "preterito.estar-tener"
      - "como-te-fue"
      - "pasarla"
    register_max: "informal"
    sample:
      es: "Ganamos el partido y la pasamos bárbaro."
      en: "We won the game and had a great time."
    tips:
      - title: "Estuvimos, tuvimos"
        body: "*Estar* and *tener* keep their odd stem for everyone: **estuvimos**, **estuvieron**;
          **tuvimos**, **tuvieron**. And a night, a party or a gig **estuvo** good or bad: **¿Cómo
          estuvo el recital? Estuvo increíble.**"
      - title: "La pasé bárbaro"
        body: "A porteño doesn't *have fun*, he **la pasa**: **la pasé bárbaro**, **la pasamos re
          bien**, **¿la pasaste bien?** The *la* never changes and never means anything — it's just
          part of the phrase."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estuvimos"
            en: "we were (somewhere)"
            f: "1pl.pret.ind.irregular"
          - form: "estuvieron"
            en: "they were (somewhere)"
            f: "3pl.pret.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tuvimos"
            en: "we had"
            f: "1pl.pret.ind.irregular"
          - form: "tuvieron"
            en: "they had (it)"
            f: "3pl.pret.ind.irregular"
      # Like "me duele": "pasé" alone is "I passed"; the good time is only
      # ever the chunk. docs/course-spec.md §1.5.
      - lemma: "pasarla"
        pos: "verb"
        en: "to have a time (good or bad)"
        forms:
          - form: "la pasé"
            en: "I had (a time)"
            f: "1sg.pret.ind.clitic"
          - form: "la pasaste"
            en: "you had (a time)"
            f: "2sg.pret.ind.vos.clitic"
          - form: "la pasamos"
            en: "we had (a time)"
            f: "1pl.pret.ind.clitic"
          - form: "pasé"
            f: "1sg.pret.ind"
            bound: true
          - form: "pasaste"
            f: "2sg.pret.ind.vos"
            bound: true
          - form: "pasamos"
            f: "1pl.pret.ind"
            bound: true
      - lemma: "ganar"
        pos: "verb"
        en: "to win, to earn"
        forms:
          - form: "ganamos"
            en: "we won"
            f: "1pl.pret.ind"
          - form: "ganó"
            en: "won (he/she won)"
            f: "3sg.pret.ind"
      - lemma: "perder"
        pos: "verb"
        en: "to lose, to miss"
        forms:
          - form: "perdí"
            en: "I lost"
            f: "1sg.pret.ind"
          - form: "perdiste"
            en: "you lost"
            f: "2sg.pret.ind.vos"
          - form: "perdimos"
            en: "we lost"
            f: "1pl.pret.ind"
      - lemma: "equipo"
        pos: "noun"
        en: "team"
      - lemma: "banda"
        pos: "noun"
        en: "band"
      - lemma: "divertido"
        pos: "adj"
        en: "fun, funny"
        forms:
          - form: "divertido"
            f: "m.sg"
          - form: "divertida"
            f: "f.sg"
      - lemma: "increíble"
        pos: "adj"
        en: "amazing, incredible"

  - ordinal: 7
    slug: "practica-que-hiciste"
    title: "Practice: what you did"
    summary: "¿Qué hiciste ayer?"
    grammar:
      - "repaso.preterito"
      - "presente-vs-preterito"
    register_max: "informal"
    sample:
      es: "Ayer fui a la cancha y después comí con Juan."
      en: "Yesterday I went to the game and then I ate with Juan."
    tips:
      - title: "Today or yesterday: the stress tells"
        body: "**Hoy laburo**, **ayer laburé**. The same verb, and only the stress moves: *LA-bu-ro* is now, *la-bu-RÉ* is done. Say it out loud and the past is already right."
      - title: "Fui: two verbs, one word"
        body: "**Fui** is both *I went* (ir) and *I was* (ser). **Fui a la cancha** — *I went to the game*; **fue re lindo** — *it was really nice*. The sentence always tells you which."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "laburé"
      - "laburaste"
      - "comí"
      - "comiste"
      - "salí"
      - "saliste"
      - "fui"
      - "fuiste"
      - "estuve"
      - "tuve"
      - "llegué"
      - "llegaste"

  - ordinal: 8
    slug: "practica-como-estuvo"
    title: "Practice: how it all went"
    summary: "¿Y? ¿Cómo estuvo?"
    grammar:
      - "repaso.preterito"
      - "repaso.preterito.plural"
    register_max: "informal"
    sample:
      es: "Anoche cenamos afuera y la pasamos bárbaro."
      en: "We ate out last night and had a great time."
    tips:
      - title: "One past for everyone"
        body: "**Cené, cenaste, cenó, cenamos, cenaron**; **viví, viviste, vivió, vivimos, vivieron**.
          Two sets of endings, and every regular verb takes one of them."
      - title: "We: now or then?"
        body: "**Cenamos** and **salimos** are both *today* and *yesterday*. A porteño never gets
          lost: **anoche**, **ayer**, **el sábado** — the time word does the work."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "cenamos"
      - "pagué"
      - "llegaron"
      - "invitaste"
      - "nací"
      - "volví"
