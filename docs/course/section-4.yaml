    register_max: "informal"
    sample:
      es: "Te llamé anoche y te mandé las fotos."
      en: "I called you last night and sent you the photos."
    tips:
      - title: "Di, busqué"
        body: "**Dar** has a short past with no accents: **di, diste, dio** — *le di la llave*. And *buscar*
          bends in *yo* to keep the hard *c* sound: **busqué** (not *buscé*). **Buscar** is *to look
          for* and also *to pick someone up*: *busqué la billetera*, *la busqué a Mica en la
          estación*."
      - title: "Mostrame"
        body: "On a command it goes on the end, as before: **mostrame las fotos**, **buscame a las ocho**.
          The stress doesn't move: *MOS-tra-me*, *BUS-ca-me*."
      - title: "Le dije a Juan"
        body: "Even when you name the person, the **le** stays: **le dije a Juan que no**, **le di la llave
          a Sofi**, **les mandé las fotos a mis viejos**. English says it once; a porteño says it
          twice. And a message is not *received*, it *reaches* you: **¿Te llegó mi audio?** — **Sí,
          me llegó.**"
