            f: "1sg.pret.ind"
          - form: "hablaste"
            en: "you spoke, you talked"
            f: "2sg.pret.ind.vos"
          - form: "habló"
            en: "spoke (he/she spoke)"
            f: "3sg.pret.ind"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegué"
            en: "I arrived, I got here"
            f: "1sg.pret.ind"
          - form: "llegaste"
            en: "you arrived, you got here"
            f: "2sg.pret.ind.vos"
          - form: "llegó"
            en: "arrived (he/she arrived)"
