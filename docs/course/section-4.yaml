  - ordinal: 25
    slug: "las-vacaciones"
    title: "Tell what you did on holiday"
    summary: "Alquilamos una carpa"
    grammar:
      - "viajes"
      - "preterito.viajar"
      - "preterito.nosotros"
    register_max: "informal"
    sample:
      es: "En el verano alquilamos una carpa en la costa."
      en: "In the summer we rented a beach tent on the coast."
    tips:
      - title: "The holiday is a we"
        body: "Holidays are told in *nosotros*: **alquilamos**, **nadamos**, **paseamos**, **sacamos mil
          fotos**. And the weather that ruined it: **llovió toda la semana**. In -ar verbs
          *nosotros* is the same now and in the past: **nadamos** is *we swim* or *we swam*; *ayer*
          or *en enero* tells you which."
      - title: "La costa, las sierras"
        body: "For a porteño **la costa** is the Atlantic beaches south of the city, where you rent a
          **carpa** — a beach tent by the day. The other classic is **las sierras** of Córdoba: a
          **río** instead of the sea. A **carpa** is also a normal camping tent: *me fui al río con
          la carpa*."
      - title: "Con Juan fuimos"
        body: "**Con Juan fuimos a la costa** means *Juan and I went to the coast* — two people, not three.
          Argentines say *with Juan we…* where English says *Juan and I*: **con Sofi alquilamos una
          carpa**."
    words:
      - lemma: "viajar"
        pos: "verb"
        forms:
          - form: "viajó"
            en: "traveled (he/she traveled)"
            f: "3sg.pret.ind"
          - form: "viajaron"
            en: "they traveled"
            f: "3pl.pret.ind"
