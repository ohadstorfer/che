  - ordinal: 21
    slug: "no-se"
    title: "Say what you know and understand"
    summary: "Ni idea"
    grammar:
      - "saber"
      - "entender"
      - "explicar"
    register_max: "informal"
    sample:
      es: "No sé, ni idea."
      en: "I don't know, no idea."
    tips:
      - title: "Ni idea"
        body: "**Ni idea** — *no idea* — is the everyday short answer when you don't know: *—¿Dónde está
          Nico? —Ni idea.* The full form is **no tengo idea** or **no tengo ni idea**. To say what
          about: *Ni idea de dónde está el cargador.*"
      - title: "No entiendo"
        body: "**No entiendo** — *I don't understand*. **¿Me explicás?** or **explicame** — *can you
          explain?*"
      - title: "Saber or conocer?"
        body: "**Saber** + a verb is *to know how to*: **¿sabés cocinar?** For people and places use
          **conocer**: **conozco a Juan**, **¿conocés Palermo?** And **qué sé yo** is the porteño
          shrug — *who knows*."
    words:
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sabemos"
            en: "we know"
            f: "1pl.pres.ind"
      - lemma: "explicar"
        pos: "verb"
        en: "to explain"
        forms:
          - form: "explicás"
            en: "you explain"
            f: "2sg.pres.ind.vos"
          - form: "explicame"
            en: "explain to me"
            f: "2sg.imp.vos.clitic"
      - lemma: "pregunta"
        pos: "noun"
        en: "question"
      - lemma: "ni idea"
        pos: "phrase"
        en: "no idea"
      - lemma: "idea"
        pos: "noun"
        en: "idea"
