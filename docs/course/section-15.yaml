  - ordinal: 7
    slug: "cuanto-antes-lleguemos"
    title: "Plan it: the sooner, the better"
    summary: "Cuanto antes lleguemos, mejor"
    grammar:
      - "cuanto-mas"
      - "a-medida-que"
      - "cuanto-mas.subjuntivo"
    register_max: "informal"
    sample:
      es: "Cuanto antes lleguemos al recital, mejor."
      en: "The sooner we get to the concert, the better."
    tips:
      - title: "Cuanto antes lleguemos"
        body: "About what hasn't happened yet, the verb after **cuanto** goes subjunctive: **cuanto antes
          lleguemos, mejor**; **cuanto antes reservemos, más barato**; **cuanto más temprano
          empecemos, antes terminamos**. About what always happens, the normal verb: **cuanto más
          ganás, más gastás**."
      - title: "Mejor todavía"
        body: "**Mejor todavía** — *even better*: **¿es gratis? Mejor todavía**; also **mejor así** —
          *better this way*. *Tanto mejor* says the same but sounds bookish. To **evitar** the
          **hora pico**, you go early; the place **se llena** fast; and leaving early, the day
          **rinde** — *goes further*. **Ganar tiempo** is *to save time*: **con el subte ganás
          tiempo**."
