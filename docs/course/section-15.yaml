  - ordinal: 9
    slug: "sin-ofender"
    title: "Give honest feedback"
    summary: "Te lo digo con cariño, sin ofender"
    grammar:
      - "tacto"
      - "repaso.c1"
    register_max: "informal"
    sample:
      es: "Te lo digo con cariño, sin ofender."
      en: "I'm telling you this with love, no offense."
    tips:
      - title: "Sin ofender"
        body: "Porteños are direct, but they soften it first: **sin ofender** — *no offense*; **te lo digo
          con cariño**; **no es nada personal**. A **crítica** goes down better that way, above all
          on a **tema delicado**."
      - title: "Perdoname, quise decir…"
        body: "When it lands badly: **perdoname, me expresé mal** — *I put it badly*; **quise decir otra
          cosa** — *I meant something else*; **no fue mi intención lastimarte**."
