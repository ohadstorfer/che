            en: "was born"
            f: "3sg.pret.ind"
          - form: "naciste"
            en: "you were born"
            f: "2sg.pret.ind.vos"
          - form: "nací"
            en: "I was born"
            f: "1sg.pret.ind"
      - lemma: "embarazada"
        pos: "adj"
        en: "pregnant"
        forms:
