  - ordinal: 11
    slug: "me-cayo-la-ficha"
    title: "Name the feelings porteños name"
    summary: "Recién ahora me cayó la ficha"
    grammar:
      - "sentimientos.expresiones"
    register_max: "informal"
    sample:
      es: "Recién ahora me cayó la ficha."
      en: "It only just clicked."
    tips:
      - title: "Me cayó la ficha"
        body: "**Me cayó la ficha** — *I finally understood* — comes from the old phone tokens that fell
          when the call went through. **Recién ahora me cayó la ficha** — *it only just sank in*."
      - title: "Me da cosa"
        body: "**Me da cosa** has two uses. Doing something feels awkward: **me da cosa pedirle plata** — *I
          feel awkward asking him for money*. Or a thing gives you a bad feeling: **ese perro me da
          cosa** — *that dog makes me uneasy*. **Me pone mal** — *it makes me sad*. **Me quedé con
          las ganas** — *I missed out, and I still want to*."
    words:
      - lemma: "me cayó la ficha"
        pos: "phrase"
        en: "it clicked, it sank in"
        register: "informal"
      - lemma: "me da cosa"
        pos: "phrase"
        en: "it makes me uneasy, I feel awkward about it"
        register: "informal"
      - lemma: "me pone mal"
        pos: "phrase"
        en: "it upsets me, it gets me down"
      - lemma: "me quedé con las ganas"
        pos: "phrase"
        en: "I missed out (and still want to)"
