            f: "inf"
          - form: "recorrimos"
            en: "we travelled around"
            f: "1pl.pret.ind"
      - lemma: "ruta"
        pos: "noun"
        en: "highway, route"
      - lemma: "paisaje"
        pos: "noun"
        en: "landscape, scenery"
      - lemma: "glaciar"
        pos: "noun"
        en: "glacier"
      - lemma: "cataratas"
        pos: "noun"
        en: "waterfalls"
        forms:
          - form: "cataratas"
            f: "f.pl"
      - lemma: "Patagonia"
        pos: "propn"
        en: "Patagonia"
      - lemma: "Iguazú"
        pos: "propn"
        en: "Iguazú"
      - lemma: "Salta"
        pos: "propn"
        en: "Salta"

  - ordinal: 6
    slug: "quien-ceba"
    title: "Join the mate round"
    summary: "¿Quién ceba?"
    grammar:
      - "cultura.mate"
    register_max: "informal"
    sample:
      es: "¿Quién ceba?"
      en: "Who's making the mate?"
    tips:
      - title: "Cebar"
        body: "One person **ceba** — pours the water from the **termo** — and passes the mate around the
          **ronda**. You drink it all, through the **bombilla**, and hand it back to the one who ceba."
      - title: "Gracias"
        body: "Saying **gracias** when you hand the mate back means *I'm done*. Say it on the first one
          and that's your last."
    words:
      - lemma: "cebar"
        pos: "verb"
        en: "to make and pour (mate)"
        forms:
          - form: "cebar"
            f: "inf"
          - form: "ceba"
            en: "pours (the mate)"
            f: "3sg.pres.ind"
          - form: "cebás"
            en: "you pour (the mate)"
            f: "2sg.pres.ind.vos"
      - lemma: "ronda"
        pos: "noun"
        en: "round, circle"
      - lemma: "yerba"
        pos: "noun"
        en: "mate leaves"
      - lemma: "termo"
        pos: "noun"
        en: "thermos"
      - lemma: "bombilla"
        pos: "noun"
        en: "metal straw (for mate)"

  - ordinal: 7
    slug: "mis-abuelos-italianos"
    title: "Tell where your family came from"
    summary: "Mis abuelos llegaron en barco"
    grammar:
      - "historia.inmigracion"
    register_max: "informal"
    sample:
      es: "Mis abuelos llegaron de Italia en barco."
      en: "My grandparents came from Italy by boat."
    tips:
      - title: "Llegaron en barco"
        body: "Most porteños have an **abuelo** or **bisabuelo** who **llegó en barco** from Italy or Spain.
          That's why a porteño talks with his hands and eats ñoquis on the 29th."
      - title: "Otra época"
        body: "**Era otra época** — *it was a different time*. The **inmigrantes** of the early 20th
          century built the city's **conventillos**, its tango and its accent."
    words:
      - lemma: "llegar"
        pos: "verb"
        forms:
