  - ordinal: 8
    slug: "practica-me-mori-de-risa"
    title: "Practice: barrio slang, laughs and plans"
    summary: "Estoy manija: cuanto antes, mejor"
    grammar:
      - "repaso.lunfardo"
      - "repaso.causativo"
      - "repaso.cuanto-mas"
    register_max: "lunfardo"
    sample:
      es: "Estoy manija: cuanto antes lleguemos, mejor."
      en: "I'm so hyped: the sooner we get there, the better."
    tips:
      - title: "Al horno, manija"
        body: "**Al horno** — *in trouble*; **qué bajón** — *what a shame*; **ni en pedo** — *no way*;
          **rata** — *stingy*; **manija** — *very excited*; **guita** — *money*; **hacer la gamba**
          — *to help someone out or keep them company*. All among friends."
      - title: "Me morí de risa"
        body: "**Me morí de risa**, **¿de qué te reís?**, **me hizo sentir…** — and **cuanto antes
          lleguemos, mejor**. **A la larga** — *in the long run*: **a la larga, el esfuerzo
          rinde**."
