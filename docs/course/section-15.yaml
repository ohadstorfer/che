    register_max: "informal"
    sample:
      es: "Al principio me costó, pero ahora me siento como en casa."
      en: "It was hard at first, but now I feel at home."
    tips:
      - title: "Al principio me costó"
        body: "Looking back, a finished thing takes the preterite: **al principio me costó** — *it was hard
          at first* — **pero me adapté** — *I adapted*. How things were takes the imperfect: *al
          principio era raro*. Now **me siento como en casa**. Say it **de corazón**."
      - title: "Brindemos"
        body: "A porteño **despedida** — *farewell party* — ends with a toast, a **brindis**:
          **¡brindemos!**, **brindo por ustedes**, **¡salud!** Then **gracias por todo**, **fue un
          placer**, **los voy a extrañar** — and never *adiós*: you say **chau** or **hasta la
          próxima**, because here nobody really leaves. To leave, people say **bueno, me voy yendo**
          or **los dejo**; **me despido** sounds like a letter, though *me despedí de todos* — *I
          said goodbye to everyone* — is fine."
