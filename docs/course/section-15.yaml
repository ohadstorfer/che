            en: "he got married, she got married"
            f: "3sg.pret.ind.clitic"
          - form: "nos casamos"
            en: "we got married, we're getting married"
            f: "1pl.pret.ind.clitic"
          - form: "casó"
            f: "3sg.pret.ind"
            bound: true
          - form: "casamos"
            f: "1pl.pret.ind"
            bound: true
      - lemma: "casamiento"
        pos: "noun"
        en: "wedding"
      - lemma: "nacer"
