  - ordinal: 9
    slug: "me-estas-cargando"
    title: "Tease and be teased"
    summary: "¿Me estás cargando?"
    grammar:
      - "humor"
    register_max: "informal"
    sample:
      es: "¿Me estás cargando?"
      en: "Are you kidding me?"
    tips:
      - title: "¿Me estás cargando?"
        body: "**Cargar** someone is *to tease, to wind up*: **¿me estás cargando?** — *are you pulling my
          leg?* Porteños **cargan** the people they like; being left alone is the bad sign."
      - title: "En joda"
        body: "**Lo dije en joda** — *I was joking*. A **chiste** is a joke you tell; if it lands, it's
          **gracioso**."
    words:
      - lemma: "cargar"
        pos: "verb"
        forms:
          - form: "cargando"
            en: "teasing, kidding"
            f: "ger"
      - lemma: "en joda"
        pos: "phrase"
        en: "jokingly, as a joke"
        register: "informal"
      - lemma: "chiste"
        pos: "noun"
        en: "joke"
        forms:
