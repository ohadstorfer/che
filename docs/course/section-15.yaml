        body: "The joke only works if you don't **picarse** — *get touchy*: **se picó** is the worst
          thing to say about someone at an asado. Everybody has an **apodo** — *a nickname* — and a
          **broma** — *a prank* — is a sign of affection. **No te hagas el vivo**, though: **te hacés el
          vivo** is *you're acting smart*."
