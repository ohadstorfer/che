# ---------------------------------------------------------------------------
# Che — Section 15 outline: "Like a local" (C1.4)
#
# The last section: a deadline at work and asking for a raise, the feelings
# porteños have their own words for (me cayó la ficha, me da cosa), the
# country beyond the city, the rules of the mate round, the grandparents who
# came by boat, teasing (¿me estás cargando?), weddings and births, being
# moved and proud — and a checkpoint that tells her she's from here now.
#
# Plan: docs/course/roadmap.md §Section 15.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 15
  slug: "like-a-local"
