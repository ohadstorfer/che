      - "lo que quiero decir es que"
      - "lo tuyo"
      - "lo que sea"
      - "en el fondo"
      - "malentendido"
      - "cada loco con su tema"
      - "no hay dos sin tres"
      - "hablando del rey de Roma"
      - "un toque"
      - "lo mismo"
      - "o sea"
  - ordinal: 4
    slug: "me-hizo-reir"
    title: "Say what made you laugh or cry"
    summary: "Me hizo reír un montón"
    grammar:
      - "hacer.causativo"
      - "reirse"
    register_max: "informal"
    sample:
      es: "Me hizo reír un montón."
      en: "It made me laugh so much."
    tips:
      - title: "Me hizo reír"
        body: "**Hacer** + infinitive is *to make someone do*: **me hizo reír**, **me hizo llorar**, **nos
          hizo esperar**. **Me hace acordar** — *it reminds me*: *esta canción me hace acordar a
          vos*."
      - title: "Me río, te reíste"
        body: "**Reírse** is *to laugh*: **me río mucho con vos** — *I laugh a lot with you*. You already
          know **me reí** and **nos reímos**; with *vos* in the past it is **te reíste**: **¿de qué
          te reíste?** **Llorar** is *to cry*: **lloré con esa película**."
    words:
      - lemma: "reír"
        pos: "verb"
        en: "to laugh"
        forms:
          - form: "reír"
            f: "inf"
      - lemma: "reírse"
        pos: "verb"
        en: "to laugh"
        forms:
          - form: "me río"
            en: "I laugh"
            f: "1sg.pres.ind.clitic.irregular"
          - form: "te reíste"
            en: "you laughed"
            f: "2sg.pret.ind.vos.clitic"
          - form: "río"
            f: "1sg.pres.ind.irregular"
            bound: true
          - form: "reíste"
            f: "2sg.pret.ind.vos"
            bound: true
      - lemma: "llorar"
        pos: "verb"
        en: "to cry"
        forms:
          - form: "llorar"
            f: "inf"
          - form: "lloré"
            en: "I cried"
            f: "1sg.pret.ind"
      - lemma: "hacer acordar"
        pos: "phrase"
        en: "to remind"
        forms:
          - form: "me hace acordar"
            en: "it reminds me"
            f: "3sg.pres.ind"
        note: "Argentines say 'me hace acordar a…' (with 'a') for 'reminds me of'."
      - lemma: "canción"
        pos: "noun"
        en: "song"
  - ordinal: 5
    slug: "me-mori-de-risa"
    title: "Tell what cracked you up"
    summary: "Me morí de risa con esa comedia"
    grammar:
      - "hacer.causativo"
      - "reirse"
    register_max: "informal"
    sample:
      es: "Me morí de risa con esa comedia."
      en: "I died laughing at that comedy."
    tips:
      - title: "Me hizo sentir…"
        body: "**Hacer** + infinitive works with any verb: **me hizo sentir como en casa**, **te hace
          pensar**, **nos hizo llorar a todos**. And people too: **vos me hacés reír**."
      - title: "¿De qué te reís?"
        body: "**Reírse** with *vos*: **¿de qué te reís?**; with *him*: **se ríe de todo**; in the past,
          **se rió** — *he laughed*. **¿Lloraste?** For the big laugh: **me morí de risa** — *I died
          laughing*. A **comedia** gets a **sonrisa**; a sad scene, **lágrimas** and **tristeza**.
          And people with **sentido del humor** laugh at themselves."
    words:
      - lemma: "reírse"
        pos: "verb"
        forms:
          - form: "te reís"
            en: "you laugh"
            f: "2sg.pres.ind.vos.clitic"
          - form: "se rió"
            en: "he laughed, she laughed"
            f: "3sg.pret.ind.clitic"
