      - "a-medida-que"
    register_max: "informal"
    sample:
      es: "Cuanto más practicás, mejor hablás."
      en: "The more you practice, the better you speak."
    tips:
      - title: "Cuanto más…"
        body: "**Cuanto más** — *the more*: **cuanto más practicás, mejor hablás**. **Cuanto menos** — *the
          less*. And **cuanto antes** — *the sooner the better*: **avisame cuanto antes**."
      - title: "A medida que"
        body: "**A medida que** — *as*, for two things changing together: **a medida que pasa el tiempo, te
          vas acostumbrando**."
