  - ordinal: 5
    slug: "recorrer-el-pais"
    title: "Travel the country"
    summary: "Recorrimos la Patagonia en auto"
    grammar:
      - "viaje.argentina"
    register_max: "informal"
    sample:
      es: "Recorrimos la Patagonia en auto."
      en: "We drove around Patagonia."
    tips:
      - title: "Recorrer"
        body: "**Recorrer** is *to travel around, to go all over*: **recorrimos la Patagonia**. The road
          is the **ruta** — *la ruta 40* runs the length of the country."
      - title: "Glaciares y cataratas"
        body: "In the south, **glaciares**; in the north-east, the **cataratas** of Iguazú; in the
          north-west, Salta's **paisaje** of red hills."
    words:
      - lemma: "recorrer"
        pos: "verb"
        en: "to travel around, to go all over"
        forms:
