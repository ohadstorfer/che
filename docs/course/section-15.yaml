  practice: 2
units:
  - ordinal: 1
    slug: "como-dice-el-dicho"
    title: "Use the sayings"
    summary: "Más vale tarde que nunca"
    grammar:
      - "refranes"
    register_max: "informal"
    sample:
      es: "Más vale tarde que nunca."
      en: "Better late than never."
    tips:
      - title: "Como dice el dicho"
        body: "A **dicho** is a saying, and porteños drop one to close an argument: **más vale tarde que
          nunca**; **no hay mal que por bien no venga** — *something good can come from something
          bad*."
      - title: "El que avisa no traiciona"
        body: "**El que avisa no traiciona** — *don't say I didn't warn you*. You say it while you give the
          warning. Literally: *the one who warns you doesn't betray you*. Two more you'll hear in
          Buenos Aires: **sobre gustos no hay nada escrito** — *everyone has their own taste*; **el
          que quiere celeste, que le cueste** — *if you want something good, you have to work for
          it*."
    words:
      - lemma: "dicho"
        pos: "noun"
        en: "proverb, saying (noun)"
      - lemma: "más vale tarde que nunca"
        pos: "phrase"
        en: "better late than never"
      - lemma: "no hay mal que por bien no venga"
        pos: "phrase"
        en: "every cloud has a silver lining"
        note: "Literally: there's no bad thing that doesn't bring something good."
      - lemma: "el que avisa no traiciona"
        pos: "phrase"
        en: "don't say I didn't warn you"
      - lemma: "sobre gustos no hay nada escrito"
        pos: "phrase"
        en: "there's no accounting for taste"
      - lemma: "el que quiere celeste, que le cueste"
        pos: "phrase"
        en: "if you want something good, it will cost you"
  - ordinal: 2
    slug: "cada-loco-con-su-tema"
    title: "Close an argument with a saying"
    summary: "Como dice el dicho: cada loco con su tema"
    grammar:
      - "refranes"
    register_max: "informal"
    sample:
      es: "Como dice el dicho: cada loco con su tema."
      en: "As the saying goes: to each their own."
    tips:
      - title: "Como dice el dicho…"
        body: "**Como dice el dicho** — *as the saying goes* — and then the one that fits: **cada loco con
          su tema** — *to each their own*; **no hay dos sin tres** — *there's always a third time*;
          **el que no llora no mama** — *if you don't ask, you don't get*."
      - title: "The ones grandma says"
        body: "**Más vale pájaro en mano que cien volando** — *one sure thing is better than a hundred
          possible ones*; **a caballo regalado no se le miran los dientes** — *you don't complain
          about a gift*; **ojos que no ven, corazón que no siente** — *what you don't know can't
          hurt you*; **del dicho al hecho hay mucho trecho** — *easier said than done*. **El que se
          quema con leche, ve una vaca y llora** — *after a bad experience, you're scared of
          anything similar*. For someone who complicates everything: **buscarle la quinta pata al
          gato** — *to look for the cat's fifth leg*. And when someone walks in: **hablando del rey
          de Roma…** — *we were just talking about you*."
    words:
      - lemma: "como dice el dicho"
        pos: "phrase"
        en: "as the saying goes"
      - lemma: "cada loco con su tema"
        pos: "phrase"
        en: "to each their own"
      - lemma: "no hay dos sin tres"
        pos: "phrase"
        en: "what happens twice will happen a third time"
      - lemma: "el que no llora no mama"
        pos: "phrase"
        en: "if you don't ask, you don't get"
        note: "Literally: the baby who doesn't cry doesn't get fed."
      - lemma: "más vale pájaro en mano que cien volando"
        pos: "phrase"
        en: "a bird in the hand is worth two in the bush"
      - lemma: "a caballo regalado no se le miran los dientes"
        pos: "phrase"
        en: "don't look a gift horse in the mouth"
        note: "Don't complain about something you got for free."
      - lemma: "ojos que no ven, corazón que no siente"
        pos: "phrase"
        en: "what you don't know can't hurt you"
      - lemma: "del dicho al hecho hay mucho trecho"
        pos: "phrase"
        en: "easier said than done"
      - lemma: "el que se quema con leche, ve una vaca y llora"
        pos: "phrase"
        en: "once bitten, twice shy"
        note: "Literally: whoever gets burned by milk cries when they see a cow."
      - lemma: "hablando del rey de Roma"
        pos: "phrase"
        en: "speak of the devil"
      - lemma: "buscarle la quinta pata al gato"
        pos: "phrase"
        en: "to look for problems where there are none"
  - ordinal: 3
    slug: "practica-cada-loco-con-su-tema"
    title: "Practice: -ito, what happened, more sayings"
    summary: "Lo que pasó fue que hacía fresquito"
    grammar:
      - "repaso.diminutivo"
      - "repaso.lo"
      - "repaso.refranes"
    register_max: "informal"
    sample:
      es: "Lo mío es un cafecito calentito y un pedacito de torta."
      en: "My thing is a nice hot coffee and a little piece of cake."
    tips:
      - title: "Fresquito, calentito"
        body: "**-ito** and **-cito**: **fresquito**, **solcito**, **calentito**, **igualito**, **una
          cosita**."
      - title: "Lo que pasó fue que…"
        body: "**Lo que pasó fue que**, **lo que quiero decir es que**, **lo tuyo**, **lo que sea**, **en el
          fondo**. And three sayings: **cada loco con su tema** — *to each their own*; **no hay dos
          sin tres** — *there's always a third time*; **hablando del rey de Roma** — *we were just
          talking about you*."
    review:
