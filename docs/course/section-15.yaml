  - ordinal: 25
    slug: "gracias-por-todo"
    title: "Say goodbye like a porteño"
    summary: "Gracias por todo: me siento como en casa"
    grammar:
      - "despedida"
      - "repaso.c1"
    register_max: "informal"
    sample:
      es: "Al principio me costó, pero ahora me siento como en casa."
      en: "It was hard at first, but now I feel at home."
    tips:
      - title: "Al principio me costó"
        body: "Looking back is the preterite: **al principio me costó** — *it was hard at first* — **pero
          me adapté** — *I adapted*. Now **me siento como en casa**. Say it **de corazón**."
      - title: "Brindemos"
        body: "A porteño **despedida** — *farewell party* — ends with a toast: **¡brindemos!**, **brindo
          por ustedes**. Then **gracias por todo**, **fue un placer**, and never *adiós*: **me despido**
          with **hasta la próxima**, because here nobody really leaves."
    words:
      - lemma: "al principio"
        pos: "phrase"
        en: "at first"
      - lemma: "costar"
        pos: "verb"
        forms:
          - form: "me costó"
            en: "it was hard for me"
            f: "3sg.pret.ind.clitic"
      - lemma: "adaptarse"
        pos: "verb"
        en: "to adapt, to settle in"
        forms:
          - form: "me adapté"
            en: "I adapted"
            f: "1sg.pret.ind.clitic"
          - form: "adapté"
            f: "1sg.pret.ind"
            bound: true
      - lemma: "como en casa"
        pos: "phrase"
        en: "at home (feeling welcome)"
      - lemma: "de corazón"
        pos: "phrase"
        en: "from the heart"
      - lemma: "despedida"
        pos: "noun"
        en: "farewell party, send-off"
      - lemma: "despedirse"
        pos: "verb"
        en: "to say goodbye"
        forms:
          - form: "me despido"
            en: "I say goodbye"
            f: "1sg.pres.ind.clitic.irregular"
          - form: "despido"
            f: "1sg.pres.ind.irregular"
            bound: true
      - lemma: "brindar"
        pos: "verb"
        forms:
          - form: "brindemos"
            en: "let's toast"
            f: "1pl.pres.subj"
          - form: "brindo"
            en: "I toast"
            f: "1sg.pres.ind"
      - lemma: "gracias por todo"
        pos: "phrase"
        en: "thanks for everything"
      - lemma: "fue un placer"
        pos: "phrase"
