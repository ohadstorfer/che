      - "repaso.eventos"
      - "repaso.emocionarse"
    register_max: "informal"
    sample:
      es: "Mi hermana se recibió y nos emocionamos todos."
      en: "My sister graduated and we all got emotional."
    tips:
      - title: "¡Caíste!"
        body: "**Te estaba tomando el pelo**, **¡caíste!**, **no te piques** — the wind-up, in porteño."
      - title: "Se recibió, se emocionó"
        body: "**Se recibió**, **se comprometieron**, **se jubiló** — and **se emocionó**, **nos
          emocionamos**, **me llegó**."
