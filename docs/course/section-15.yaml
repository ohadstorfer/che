# ---------------------------------------------------------------------------
# Che — Section 15 outline: "Like a local" (C1.4)
#
# The last section: a deadline at work and asking for a raise, the feelings
# porteños have their own words for (me cayó la ficha, me da cosa), the
# country beyond the city, the rules of the mate round, the grandparents who
# came by boat, teasing (¿me estás cargando?), weddings and births, being
# moved and proud — and a checkpoint that tells her she's from here now.
#
# Plan: docs/course/roadmap.md §Section 15.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 15
  slug: "like-a-local"
  title: "Like a local"
  cefr: "C1.4"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "la-entrega"
    title: "Meet a deadline"
    summary: "Tenemos que entregar el proyecto el viernes"
    grammar:
      - "laburo.proyecto"
    register_max: "informal"
    sample:
      es: "Tenemos que entregar el proyecto el viernes."
      en: "We have to hand in the project on Friday."
    tips:
      - title: "El plazo"
        body: "At work, a **proyecto** has a **plazo** — *a deadline* — and a **presupuesto** — *a budget*.
          You **entregás** it to the **cliente**, ideally before you're **atrasado**."
      - title: "Estamos atrasados"
        body: "**Estamos atrasados** — *we're behind*. The porteño answer: **no pasa nada, lo sacamos**."
    words:
      - lemma: "proyecto"
        pos: "noun"
        en: "project"
      - lemma: "plazo"
        pos: "noun"
        en: "deadline, time limit"
      - lemma: "presupuesto"
        pos: "noun"
        en: "budget; quote"
      - lemma: "cliente"
        pos: "noun"
        en: "client, customer"
        forms:
          - form: "cliente"
            f: "sg"
          - form: "clientes"
            f: "pl"
      - lemma: "entregar"
        pos: "verb"
        en: "to hand in, to deliver"
        forms:
          - form: "entregar"
            f: "inf"
          - form: "entregué"
            en: "I handed in"
            f: "1sg.pret.ind"
      - lemma: "atrasado"
        pos: "adj"
        en: "behind schedule"
        forms:
          - form: "atrasado"
            f: "m.sg"
          - form: "atrasados"
            f: "m.pl"

  - ordinal: 2
    slug: "merezco-un-aumento"
    title: "Ask for a raise"
    summary: "Me merezco un aumento"
    grammar:
      - "laburo.negociar"
    register_max: "informal"
    sample:
      es: "Creo que me merezco un aumento."
      en: "I think I deserve a raise."
    tips:
      - title: "Plantear"
        body: "You don't just ask, you **plantear** it — *raise it, put it on the table*: **le planteé lo
          del aumento a mi jefa**. Then you **negociar** the **condiciones**."
      - title: "Merezco"
        body: "**Merecerse** — *to deserve* — comes with its pronoun: **me merezco un aumento**, **te lo merecés**. And a boss who
          **valora** your work says so with the sueldo."
    words:
      - lemma: "plantear"
        pos: "verb"
        en: "to raise, to bring up"
        forms:
          - form: "plantear"
            f: "inf"
          - form: "planteé"
            en: "I raised, I brought up"
            f: "1sg.pret.ind"
      - lemma: "negociar"
        pos: "verb"
        en: "to negotiate"
        forms:
          - form: "negociar"
            f: "inf"
      - lemma: "merecer"
        pos: "verb"
        en: "to deserve"
        forms:
          - form: "me merezco"
            en: "I deserve"
            f: "1sg.pres.ind.clitic.irregular"
          - form: "te merecés"
            en: "you deserve"
            f: "2sg.pres.ind.vos.clitic"
          - form: "me lo merezco"
            en: "I deserve it"
            f: "1sg.pres.ind.clitic.irregular"
          - form: "te lo merecés"
            en: "you deserve it"
            f: "2sg.pres.ind.vos.clitic"
          - form: "merezco"
            f: "1sg.pres.ind.irregular"
            bound: true
          - form: "merecés"
            f: "2sg.pres.ind.vos"
            bound: true
      - lemma: "valorar"
        pos: "verb"
        en: "to value, to appreciate"
        forms:
          - form: "valoran"
            en: "they value"
            f: "3pl.pres.ind"
      - lemma: "condición"
        pos: "noun"
        en: "condition, term"
        forms:
          - form: "condiciones"
            f: "f.pl"

  - ordinal: 3
    slug: "me-cayo-la-ficha"
    title: "Name the feelings porteños name"
    summary: "Recién ahora me cayó la ficha"
    grammar:
      - "sentimientos.expresiones"
    register_max: "informal"
    sample:
      es: "Recién ahora me cayó la ficha."
      en: "It only just clicked."
    tips:
      - title: "Me cayó la ficha"
        body: "**Me cayó la ficha** — *the penny dropped* — comes from the old phone tokens that fell when
          the call went through. **Recién ahora me cayó la ficha** — *it only just sank in*."
      - title: "Me da cosa"
        body: "**Me da cosa** — *it makes me uneasy, I don't feel right about it*. **Me pone mal** — *it
          gets me down*. **Me quedé con las ganas** — *I missed out, and I still want to*."
    words:
      - lemma: "me cayó la ficha"
        pos: "phrase"
        en: "it clicked, it sank in"
        register: "informal"
      - lemma: "me da cosa"
        pos: "phrase"
        en: "it makes me uneasy"
        register: "informal"
      - lemma: "me pone mal"
        pos: "phrase"
        en: "it gets me down"
      - lemma: "me quedé con las ganas"
        pos: "phrase"
        en: "I missed out (and still want to)"

  - ordinal: 4
    slug: "practica-la-entrega"
    title: "Practice: work and feelings"
    summary: "Me da cosa plantear lo del aumento"
    grammar:
