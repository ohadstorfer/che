            f: "f.pl"

  - ordinal: 4
    slug: "se-merece-el-ascenso"
    title: "Back a colleague for a promotion"
    summary: "Mi compañera se merece el ascenso"
    grammar:
      - "laburo.negociar"
    register_max: "informal"
    sample:
      es: "Mi compañera se merece el ascenso."
      en: "My coworker deserves the promotion."
    tips:
      - title: "Se lo merece, nos lo merecemos"
        body: "**Merecerse** keeps its pronoun for every person: **me lo merezco**, **te lo merecés**, **se
          lo merece** — *she deserves it* — **nos lo merecemos** — *we deserve it*. A **gerente** who
          sees your **responsabilidad** grow should hear it: **se merece el ascenso**."
      - title: "En blanco, en negro"
        body: "Before you **negociar**, know what you're owed. A job **en blanco** is *on the books*,
          with aguinaldo and obra social; **en negro** is *off the books*. And with inflation, the
          yearly **ajuste** — *the pay adjustment* — is the first thing you **exigir**."
    words:
      - lemma: "merecer"
        pos: "verb"
        forms:
          - form: "se lo merece"
            en: "he deserves it, she deserves it"
            f: "3sg.pres.ind.clitic"
          - form: "se merece"
            en: "he deserves, she deserves"
            f: "3sg.pres.ind.clitic"
          - form: "nos lo merecemos"
            en: "we deserve it"
            f: "1pl.pres.ind.clitic"
          - form: "merece"
            f: "3sg.pres.ind"
            bound: true
          - form: "merecemos"
            f: "1pl.pres.ind"
            bound: true
      - lemma: "negociar"
        pos: "verb"
        forms:
          - form: "negocié"
            en: "I negotiated"
            f: "1sg.pret.ind"
      - lemma: "ascenso"
        pos: "noun"
        en: "promotion"
      - lemma: "gerente"
        pos: "noun"
        en: "manager"
      - lemma: "responsabilidad"
        pos: "noun"
        en: "responsibility"
        forms:
          - form: "responsabilidad"
            f: "f.sg"
          - form: "responsabilidades"
            f: "f.pl"
      - lemma: "objetivo"
        pos: "noun"
        en: "target, aim"
        forms:
          - form: "objetivo"
            f: "m.sg"
          - form: "objetivos"
            f: "m.pl"
      - lemma: "evaluación"
        pos: "noun"
        en: "evaluation, appraisal"
      - lemma: "exigir"
        pos: "verb"
        en: "to demand"
        forms:
          - form: "exigir"
            f: "inf"
          - form: "exige"
            en: "demands"
            f: "3sg.pres.ind"
      - lemma: "ajuste"
        pos: "noun"
        en: "pay adjustment (for inflation)"
      - lemma: "en blanco"
        pos: "phrase"
        en: "on the books (a job)"
      - lemma: "en negro"
        pos: "phrase"
        en: "off the books (a job)"
        register: "informal"

  - ordinal: 5
    slug: "me-cayo-la-ficha"
    title: "Name the feelings porteños name"
    summary: "Recién ahora me cayó la ficha"
    grammar:
      - "sentimientos.expresiones"
    register_max: "informal"
    sample:
      es: "Recién ahora me cayó la ficha."
      en: "It only just clicked."
    tips:
      - title: "Me cayó la ficha"
        body: "**Me cayó la ficha** — *the penny dropped* — comes from the old phone tokens that fell when
          the call went through. **Recién ahora me cayó la ficha** — *it only just sank in*."
      - title: "Me da cosa"
        body: "**Me da cosa** — *it makes me uneasy, I don't feel right about it*. **Me pone mal** — *it
          gets me down*. **Me quedé con las ganas** — *I missed out, and I still want to*."
    words:
      - lemma: "me cayó la ficha"
        pos: "phrase"
        en: "it clicked, it sank in"
        register: "informal"
      - lemma: "me da cosa"
        pos: "phrase"
        en: "it makes me uneasy"
        register: "informal"
      - lemma: "me pone mal"
        pos: "phrase"
        en: "it gets me down"
      - lemma: "me quedé con las ganas"
        pos: "phrase"
        en: "I missed out (and still want to)"

  - ordinal: 6
    slug: "me-hace-ruido"
    title: "Put a gut feeling into words"
    summary: "Algo de todo esto me hace ruido"
    grammar:
      - "sentimientos.expresiones"
    register_max: "informal"
    sample:
      es: "Me quedé helado cuando me enteré."
      en: "I was stunned when I found out."
    tips:
      - title: "Me hace ruido"
        body: "When something doesn't sit right: **me hace ruido** — *something's off about it* — and
          **no me cierra** — *it doesn't add up*. Porteños say both about a deal, a story, or a new
          boyfriend."
      - title: "Me quedé helado"
        body: "The same shape as **me cayó la ficha** — the feeling happens *to* you: **me quedé helado**
          — *I froze, I was stunned*; **me dejó pensando** — *it got me thinking*; **me partió el alma**
          — *it broke my heart*. The good ones: **me hace bien**, **me da ternura**, and **¡qué
          alivio!**"
    words:
      - lemma: "me hace ruido"
        pos: "phrase"
        en: "something's off about it"
        register: "informal"
      - lemma: "no me cierra"
        pos: "phrase"
        en: "it doesn't add up"
        register: "informal"
      - lemma: "me quedé helado"
        pos: "phrase"
        en: "I froze, I was stunned"
      - lemma: "me dejó pensando"
        pos: "phrase"
        en: "it got me thinking"
      - lemma: "me partió el alma"
        pos: "phrase"
        en: "it broke my heart"
      - lemma: "me hace bien"
        pos: "phrase"
        en: "it does me good"
      - lemma: "me da ternura"
        pos: "phrase"
