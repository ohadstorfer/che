  - ordinal: 11
    slug: "me-emocione"
    title: "Say you were moved"
    summary: "Me emocioné un montón"
    grammar:
      - "emocionarse"
      - "orgullo"
    register_max: "informal"
    sample:
      es: "Me emocioné un montón."
      en: "I got really emotional."
    tips:
      - title: "Me emocioné"
        body: "**Emocionarse** is *to be moved, to get emotional* — never just *excited*: **me emocioné en
          el casamiento**. **Se me puso la piel de gallina** — *I got goosebumps*."
      - title: "Orgulloso"
        body: "**Estoy orgulloso de vos** — *I'm proud of you*. **Agradecido** — *grateful*: **estoy muy
          agradecida**."
    words:
      - lemma: "emocionarse"
        pos: "verb"
        en: "to be moved, to get emotional"
        forms:
          - form: "me emocioné"
            en: "I got emotional, I was moved"
            f: "1sg.pret.ind.clitic"
          - form: "me emociono"
            en: "I get emotional"
            f: "1sg.pres.ind.clitic"
          - form: "emocioné"
            f: "1sg.pret.ind"
            bound: true
          - form: "emociono"
            f: "1sg.pres.ind"
            bound: true
      - lemma: "orgulloso"
