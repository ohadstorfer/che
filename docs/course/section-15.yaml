  - ordinal: 11
    slug: "quien-ceba"
    title: "Join the mate round"
    summary: "¿Quién ceba?"
    grammar:
      - "cultura.mate"
    register_max: "informal"
    sample:
      es: "¿Quién ceba?"
      en: "Who's making the mate?"
    tips:
      - title: "Cebar"
        body: "One person **ceba** — pours the water from the **termo** — and passes the mate around the
          **ronda**. You drink it all, through the **bombilla**, and hand it back to the one who ceba."
      - title: "Gracias"
        body: "Saying **gracias** when you hand the mate back means *I'm done*. Say it on the first one
          and that's your last."
    words:
      - lemma: "cebar"
        pos: "verb"
        en: "to make and pour (mate)"
        forms:
          - form: "cebar"
            f: "inf"
          - form: "ceba"
            en: "pours (the mate)"
            f: "3sg.pres.ind"
          - form: "cebás"
            en: "you pour (the mate)"
            f: "2sg.pres.ind.vos"
      - lemma: "ronda"
        pos: "noun"
        en: "round, circle"
      - lemma: "yerba"
