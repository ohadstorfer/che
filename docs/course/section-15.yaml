          friendly, but some Spaniards do not like it; the neutral word is **español**. And the
          great-grandparents still pay off: half of Buenos Aires is getting Italian or Spanish
          citizenship — **sacar la ciudadanía**. Your **raíces** — *roots* — come with a passport."
