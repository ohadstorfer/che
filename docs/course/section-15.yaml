        en: "metal straw (for mate)"

  - ordinal: 12
    slug: "te-convido-un-mate"
    title: "Make mate the right way"
    summary: "¿Te convido un mate? Está recién hecho"
    grammar:
      - "cultura.mate"
    register_max: "informal"
    sample:
      es: "¿Te convido un mate con bizcochitos?"
      en: "Can I offer you a mate with some biscuits?"
    tips:
      - title: "Calentá el agua, no la hiervas"
        body: "The rules of the one who ceba: **calentá el agua** in the pava — *heat the water* — but
          **no la hiervas**: water that **hierve** burns the yerba. **Yo cebo**, you drink. When there's
          no taste left, **el mate está lavado** — *washed out* — and it's time to change the yerba."
      - title: "¿Te convido?"
        body: "**Convidar** is *to offer, to share what's yours*: **¿te convido un mate?**, **convidame
          uno**. Afternoon **merienda** means mate with **bizcochitos**, or **tortas fritas** when it
          rains. A **matero** drinks it all day; kids get **mate cocido**, the tea-bag version."
    words:
      - lemma: "cebar"
        pos: "verb"
        forms:
          - form: "cebo"
            en: "I pour (the mate)"
            f: "1sg.pres.ind"
      - lemma: "calentar"
        pos: "verb"
        en: "to heat, to warm up"
        forms:
          - form: "calentar"
            f: "inf"
