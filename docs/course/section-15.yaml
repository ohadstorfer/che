            f: "m.sg"
          - form: "graciosa"
            f: "f.sg"

  - ordinal: 10
    slug: "se-caso"
    title: "Share family news"
    summary: "Mi prima se casó el sábado"
    grammar:
      - "vida.eventos"
      - "casarse"
    register_max: "informal"
    sample:
      es: "Mi prima se casó el sábado."
      en: "My cousin got married on Saturday."
    tips:
      - title: "Se casó"
        body: "**Casarse** is *to get married*: **se casó**, **nos casamos en marzo**. The wedding is a
          **casamiento**, and porteño ones end at six in the morning."
      - title: "Nació"
        body: "**Nacer** — *to be born*: **¿dónde naciste?**, **el bebé nació ayer**. **Está
          embarazada** — *she's pregnant*."
    words:
      - lemma: "casarse"
        pos: "verb"
        en: "to get married"
        forms:
