  - ordinal: 26
    slug: "ya-sos-de-aca"
    title: "You're from here now"
    summary: "¡Lo lograste! Ya sos de acá"
    grammar:
      - "despedida"
      - "repaso.c1"
    register_max: "informal"
    sample:
      es: "¡Lo lograste! Ya sos de acá."
      en: "You did it! You're a local now."
    tips:
      - title: "Lo lograste"
        body: "**Lograr** — *to manage, to pull off*: **¡lo lograste!** — *you did it!* **Felicitaciones**
          is how the course says it; **¡grande!** is how a porteño would."
      - title: "Ya sos de acá"
        body: "When your **acento** gives you away less and less, someone will say **ya sos de acá** —
          *you're one of us now*. Take it: it's the highest praise the city has."
    words:
      - lemma: "lograr"
        pos: "verb"
        en: "to manage, to achieve"
        forms:
          - form: "lograste"
            en: "you managed, you did it"
            f: "2sg.pret.ind.vos"
          - form: "lograr"
            f: "inf"
      - lemma: "felicitaciones"
        pos: "noun"
        en: "congratulations"
        forms:
          - form: "felicitaciones"
            f: "f.pl"
      - lemma: "acento"
        pos: "noun"
        en: "accent"
