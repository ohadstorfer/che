            f: "m.sg"
          - form: "bisabuela"
            en: "great-grandmother"
            f: "f.sg"
      - lemma: "Italia"
        pos: "propn"
        en: "Italy"
      - lemma: "España"
        pos: "propn"
        en: "Spain"

