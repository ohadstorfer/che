        pos: "adv"
        en: "how"
      - lemma: "mucho gusto"
        pos: "phrase"
        en: "nice to meet you"
  - ordinal: 9
    slug: "no-entiendo"
    title: "Say you don't understand"
    summary: "No entiendo. ¿Hablás inglés?"
    grammar:
      - "pres.1sg-2sg.vos"
      - "frases.supervivencia"
    register_max: "informal"
    sample:
      es: "No entiendo. ¿Hablás inglés?"
      en: "I don't understand. Do you speak English?"
    tips:
      - title: "Hablo, hablás"
        body: "The *I* form ends in **-o**: **hablo**, **entiendo**. The vos form is stressed on the end:
          **hablás**, **entendés**, **repetís**. One verb is different: *I know* is just **sé**, and
          the vos form is **sabés**. **Me** (*me*) and **te** (*you*) go before the verb: *No te
          entiendo. ¿Me entendés?* *No entiendo. ¿Hablás inglés?* — *No sé.*"
      - title: "Ask for help"
        body: "Stuck on a word: **¿cómo se dice…?** — *how do you say…?* — and **¿qué significa?** — *what
          does it mean?* Too fast: **más despacio, por favor**. And the line that makes people slow
          down and help: **hablo un poco** — *I speak a little*. Argentines call the language
          **castellano**."
    words:
      - lemma: "hablar"
        pos: "verb"
        en: "to speak, to talk"
        forms:
          - form: "hablo"
            en: "I speak"
            f: "1sg.pres.ind"
          - form: "hablás"
            en: "you speak"
            f: "2sg.pres.ind.vos"
      - lemma: "inglés"
        pos: "noun"
        en: "English (the language)"
      - lemma: "castellano"
        pos: "noun"
        en: "Spanish"
        note: "Argentines usually call Spanish 'castellano'; 'español' is also understood and used."
