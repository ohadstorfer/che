  - ordinal: 2
    slug: de-donde-sos
    title: ¿De dónde sos?
    summary: Where you're from, and who else is
    grammar: [ser.pres.3sg, ser.de.origen, adj.nacionalidad.genero, pron.sujeto.el-ella]
    register_max: informal
    sample: {es: "Soy de Buenos Aires. ¿Y vos de dónde sos?", en: "I'm from Buenos Aires. And where are you from?"}
    tips:
      - title: Ser de
        body: >-
          To say where someone is from, use **ser de**: *Soy de Rosario.*
          Nationalities change with gender: *argentino* for a man,
          *argentina* for a woman.
