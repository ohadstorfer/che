          *¿Cómo se llama él?* — *Se llama Juan.*"
      - title: "¿Quién es?"
        body: "**Quién** asks *who*: *¿Quién es él?* The answer drops the pronoun: *Es Martín, un
          vecino.* A **pibe** is a guy and a **piba** a girl — any age, very porteño."
      - title: "También, tampoco"
        body: "**Tampoco** is the *no* version of *también*: *Él no es de acá, y ella tampoco.* —
          *He's not from here, and neither is she.*"
