            en: "costs; goes out"
            f: "3sg.pres.ind"
          - form: "salen"
            en: "cost; they go out"
            f: "3pl.pres.ind"
        note: "Also used for prices (¿Cuánto sale? = How much is it?) and dating (salir con alguien)."
      - lemma: "costar"
        pos: "verb"
        en: "to cost, to be hard"
        forms:
