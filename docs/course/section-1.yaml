            f: "m.sg"
          - form: "bienvenida"
            f: "f.sg"
      - lemma: "turista"
        pos: "noun"
        en: "tourist"
      - lemma: "estudiante"
        pos: "noun"
        en: "student"
      - lemma: "profe"
        pos: "noun"
        en: "teacher"
        note: "short for profesor or profesora"
        register: "informal"
      - lemma: "extranjero"
        pos: "adj"
        en: "foreign, a foreigner"
        forms:
