      es: "Una docena de alfajores y dos paquetes de galletitas, por favor."
      en: "A dozen alfajores and two packets of cookies, please."
    tips:
      - title: "-s or -es"
        body: "A word ending in a vowel adds **-s**: *galletita → galletitas*, *chicle → chicles*. One
          ending in a consonant adds **-es**: *alfajor → **alfajores***. With a number, *un* and
          *una* drop out: *dos paquetes*. Containers take **de**: *una botella de agua*, *un paquete
          de chicles*."
      - title: "Tu, tus — mi, mis"
        body: "*Your* is **tu**, and it takes an *-s* with more than one: **tu** hermano, **tus** hermanos.
          *My* works the same way: *mi* gato, **mis** gatos."
      - title: "Alfajores"
        body: "An **alfajor** is two soft cookies stuck together with *dulce de leche*, often dipped in
          chocolate. Every kiosco (the corner shop) sells them, and every porteño has a favorite."
