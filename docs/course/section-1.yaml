            f: "m.sg"
          - form: "vieja"
            en: "mom (informal)"
            f: "f.sg"
      - lemma: "perro"
        pos: "noun"
        en: "dog"
  - ordinal: 9
    slug: "cuantos-anos-tenes"
    title: "Say your age"
    summary: "¿Cuántos años tenés?"
    grammar:
      - "tener.pres.1sg-3sg"
      - "numeros.0-20"
    register_max: "informal"
    sample:
      es: "Tengo veinte años y mi hermana tiene diecisiete."
      en: "I'm twenty and my sister is seventeen."
    tips:
      - title: "You have your age"
        body: "Spanish says you *have* years: **Tengo veinte años** — I'm twenty. *Tenés* is the vos form,
          *tiene* is for him or her."
    words:
      - lemma: "tener"
        pos: "verb"
        en: "to have"
        forms:
          - form: "tengo"
            en: "I have"
            f: "1sg.pres.ind"
          - form: "tenés"
            en: "you have"
            f: "2sg.pres.ind.vos"
          - form: "tiene"
            en: "has (he/she has)"
            f: "3sg.pres.ind"
