# ===========================================================================
# ALREADY IN THE DATABASE. Do not edit what exists here: edit it in
# /admin/words. New units can still be added (npm run course:seed), and a new
# section goes in a new file (section-N.yaml). docs/superplan-admin-palabras.md §7.2
# ===========================================================================
# ---------------------------------------------------------------------------
# Che — Section 1 outline
#
# The curriculum everything downstream is generated against: which units exist,
# in what order, what grammar each one teaches, and every form it introduces.
# A form that appears nowhere in this file does not exist in the course, and a
# sentence may only use forms introduced in its own unit or an earlier one.
#
# Status: DRAFT — not yet reviewed by a native speaker (Phase 0).
#
# Validate:  npm run course:validate
#
# Conventions
#   words:     one entry per lemma the unit introduces or extends. A lemma is
#              defined (pos, en) the first time it appears; later units list
#              only the new forms.
#   forms:     omitted → the lemma itself is the only form.
#   f:         grammatical features, dot-separated:
#                person/number  1sg 2sg 3sg 1pl 3pl
#                tense/mood     pres ind imp
#                non-finite     inf ger
#                               vos (voseo form) · clitic (pronoun attached)
#                nominal        m f sg pl
#   register:  neutral (default) · informal · lunfardo. A unit may only use
#              lemmas up to its register_max in sentences.
#   glue:      function words (articles, prepositions, clitics). They are
#              taught, but not drilled on their own or scheduled by SRS.
#   propn:     proper nouns. Free in sentences, never drilled.
#   sample:    one sentence the unit must be able to say, checked against the
#              forms available by then.
# ---------------------------------------------------------------------------

section:
  id: 1
  slug: "first-words"
  title: "First words"
  cefr: "A1.1"
units:
  - ordinal: 1
    slug: "un-cafe-por-favor"
    title: "Order at a café"
    summary: "Un café, por favor"
    grammar:
      - "pedido.por-favor"
      - "articulo.indefinido"
      - "conj.y-o"
    register_max: "informal"
    sample:
      es: "Un café y una medialuna, por favor."
      en: "A coffee and a medialuna, please."
    tips:
      - title: "Un café, por favor"
        body: "The shortest way to order anything: name it and add **por favor**. *Un café, por favor.* *Una
          medialuna, por favor.* No verb needed."
      - title: "Facturas"
        body: "**Facturas** are the pastries you buy by the dozen at the bakery — *medialunas* are the best
          known. Nothing to do with bills."
    words:
      - lemma: "un"
        pos: "det"
        en: "a, an"
        glue: true
        forms:
          - form: "un"
            f: "m.sg"
          - form: "una"
            f: "f.sg"
      - lemma: "por favor"
        pos: "phrase"
        en: "please"
      - lemma: "gracias"
        pos: "interj"
        en: "thanks, thank you"
      - lemma: "y"
        pos: "conj"
        en: "and"
        glue: true
      - lemma: "o"
        pos: "conj"
        en: "or"
        glue: true
      - lemma: "café"
        pos: "noun"
        en: "coffee"
      - lemma: "cortado"
        pos: "noun"
        en: "cortado"
        note: "espresso with a little milk"
      - lemma: "mate"
        pos: "noun"
        en: "mate"
        note: "the drink"
      - lemma: "medialuna"
        pos: "noun"
        en: "medialuna"
        forms:
          - form: "medialuna"
            f: "f.sg"
      - lemma: "factura"
        pos: "noun"
        en: "pastry"
        forms:
          - form: "factura"
            f: "f.sg"
      - lemma: "agua"
        pos: "noun"
        en: "water"
      - lemma: "jugo"
        pos: "noun"
        en: "juice"

  - ordinal: 2
    slug: "otro-cafe"
    title: "Order something to eat"
    summary: "Otro café y una tostada"
    grammar:
      - "pedido.por-favor"
      - "articulo.indefinido"
      - "conj.y-o"
    register_max: "informal"
    sample:
      es: "Otro café y una tostada, por favor."
      en: "Another coffee and some toast, please."
    tips:
      - title: "Otro, never un otro"
        body: "To order the same again, say **otro**: *Otro café, por favor.* For a word that takes
          *una*, it's **otra**: *Otra cerveza.* It already means \"another\", so nothing goes in front."
      - title: "Un or una"
        body: "The little word matches the thing, not you: **un** té, **un** helado, but **una** torta,
          **una** pizza. Learn each new word with its *un* or *una* and you'll never have to guess."
      - title: "Tostadas, un tostado"
        body: "In a café nobody orders one slice: ask for **tostadas** — *Un café y tostadas, por favor.* **Un tostado** is something else: a toasted ham-and-cheese sandwich, the classic café lunch. *Una tostada* is one slice, at home: *¿Otra tostada?*"
    words:
      - lemma: "otro"
        pos: "det"
        en: "another, other"
        forms:
          - form: "otro"
            f: "m.sg"
          - form: "otra"
            f: "f.sg"
      - lemma: "té"
        pos: "noun"
        en: "tea"
      - lemma: "cerveza"
        pos: "noun"
        en: "beer"
        forms:
          - form: "cerveza"
            f: "f.sg"
      - lemma: "gaseosa"
        pos: "noun"
        en: "soft drink, soda"
        forms:
          - form: "gaseosa"
            f: "f.sg"
      - lemma: "licuado"
        pos: "noun"
        en: "smoothie"
        note: "fruit blended with milk or water"
      - lemma: "pan"
        pos: "noun"
        en: "bread"
      - lemma: "tostada"
        pos: "noun"
        en: "toast"
        note: "a slice of toast"
        forms:
          - form: "tostada"
            f: "f.sg"
          - form: "tostadas"
            en: "toast"
            note: "ordered in the plural: café con tostadas"
            f: "f.pl"
      - lemma: "sándwich"
        pos: "noun"
        en: "sandwich"
      - lemma: "pizza"
        pos: "noun"
        en: "pizza"
        forms:
          - form: "pizza"
            f: "f.sg"
      - lemma: "helado"
        pos: "noun"
        en: "ice cream"
      - lemma: "torta"
        pos: "noun"
        en: "cake"
        forms:
          - form: "torta"
            f: "f.sg"
      - lemma: "comida"
        pos: "noun"
        en: "the food, a meal"
      - lemma: "tostado"
        pos: "noun"
        en: "toasted sandwich"
        note: "a toasted ham-and-cheese sandwich, the classic café order"

  - ordinal: 3
    slug: "hola-che"
    title: "Greet people"
    summary: "Hola, che"
    grammar:
      - "saludos"
      - "ser.pres.1sg"
    register_max: "informal"
    sample:
      es: "Hola, che. Todo bien."
      en: "Hi there. All good."
    tips:
      - title: "Che"
        body: "**Che** is how people in Buenos Aires get someone's attention — like \"hey\". It goes in
          front, where \"hey\" goes: *Che, ¿todo bien?* Only a greeting comes before it — *Hola, che.*
          It is never the English \"man\" on the end. It's friendly, never rude."
      - title: "Soy"
        body: "To say who you are, use **soy**: *Soy Sofi.* One word carries \"I am\" — Spanish has no
          separate word for \"I\" here."
      - title: "¿Cómo andás?"
        body: "**¿Cómo andás?** is the everyday porteño *how are you?* — you will hear it all day. The answer is short: *Bien.* or *Todo bien.* **¿Qué onda?** gets the same answer: *¿Qué onda? — Todo bien.*"
    words:
      - lemma: "hola"
        pos: "interj"
        en: "hi, hello"
      - lemma: "chau"
        pos: "interj"
        en: "bye"
      - lemma: "che"
        pos: "interj"
        en: "hey"
        note: "to get attention"
        register: "informal"
      - lemma: "dale"
        pos: "interj"
        en: "OK, sure, go ahead"
        register: "informal"
      - lemma: "bueno"
        pos: "interj"
        en: "well, OK"
      - lemma: "bien"
        pos: "adv"
        en: "well, fine, good"
      - lemma: "mal"
        pos: "adv"
        en: "bad, badly"
      - lemma: "sí"
        pos: "adv"
        en: "yes"
      - lemma: "no"
        pos: "adv"
        en: "no, not"
      - lemma: "todo bien"
        pos: "phrase"
        en: "all good"
        note: "also the question: ¿Todo bien?"
      # "qué tal" was retired here: it is Spanish from Spain in a porteño's
      # mouth. The greeting is "¿Qué onda?", and "¿Todo bien?" asks as well as
      # answers. Retiring happens in the admin; the YAML only adds (§7.2).
      - lemma: "qué onda"
        pos: "phrase"
        en: "what's up"
        register: "informal"
      - lemma: "yo"
        pos: "pron"
        en: "I"
      - lemma: "ser"
        pos: "verb"
        en: "to be"
        forms:
          - form: "soy"
            en: "I am"
            f: "1sg.pres.ind"
      - lemma: "Sofi"
        pos: "propn"
        en: "Sofi"
      - lemma: "Juan"
        pos: "propn"
        en: "Juan"
      - lemma: "Martín"
        pos: "propn"
        en: "Martín"
      - lemma: "Lucía"
        pos: "propn"
        en: "Lucía"
      - lemma: "Nico"
        pos: "propn"
        en: "Nico"
      - lemma: "Fede"
        pos: "propn"
        en: "Fede"
      - lemma: "Mati"
        pos: "propn"
        en: "Mati"
      - lemma: "Pablo"
        pos: "propn"
        en: "Pablo"
      - lemma: "Diego"
        pos: "propn"
        en: "Diego"
      - lemma: "Santi"
        pos: "propn"
        en: "Santi"
      - lemma: "Cami"
        pos: "propn"
        en: "Cami"
      - lemma: "Juli"
        pos: "propn"
        en: "Juli"
      - lemma: "Mica"
        pos: "propn"
        en: "Mica"
      - lemma: "Belén"
        pos: "propn"
        en: "Belén"
      - lemma: "Rocío"
        pos: "propn"
        en: "Rocío"
      - lemma: "Ana"
        pos: "propn"
        en: "Ana"
      - lemma: "cómo andás"
        pos: "phrase"
        en: "how are you doing"
        note: "the everyday porteño greeting: ¿Cómo andás?"

  - ordinal: 4
    slug: "buen-dia"
    title: "Say hello and goodbye"
    summary: "Buen día, buenas tardes"
    grammar:
      - "saludos"
      - "ser.pres.1sg"
    register_max: "informal"
    sample:
      es: "Buenas tardes, soy Martín."
      en: "Good afternoon, I'm Martín."
    tips:
      - title: "Buen día"
        body: "In Buenos Aires the morning greeting is **buen día**, until lunch. After that it's
          **buenas tardes**, and once it's dark **buenas noches** — hello *and* goodbye. Short for any
          of them: **buenas**."
      - title: "Gracias, de nada"
        body: "When someone says *gracias*, answer **de nada**. *Of course* is **claro**. And when
          something's sorted, porteños say **¡joya!** — *¿Todo bien? — ¡Joya!*"
    words:
      - lemma: "buen día"
        pos: "phrase"
        en: "good morning"
      - lemma: "buenas tardes"
        pos: "phrase"
        en: "good afternoon"
      - lemma: "buenas noches"
        pos: "phrase"
        en: "good evening, good night"
      - lemma: "buenas"
        pos: "interj"
        en: "hi there"
        note: "short for any greeting, any time of day"
        register: "informal"
      - lemma: "hasta luego"
        pos: "phrase"
        en: "see you later"
      - lemma: "hasta mañana"
        pos: "phrase"
        en: "see you tomorrow"
      - lemma: "de nada"
        pos: "phrase"
        en: "you're welcome"
      - lemma: "claro"
        pos: "adv"
        en: "sure, of course"
      - lemma: "genial"
        pos: "adj"
        en: "brilliant"
      - lemma: "joya"
        pos: "adj"
        en: "perfect, all set"
        note: "¡Joya! — great, sorted"
        register: "informal"

  - ordinal: 5
    slug: "vos-y-sos"
    title: "Talk to someone as vos"
    summary: "¿Sos vos?"
    grammar:
      - "pron.sujeto.vos"
      - "ser.pres.2sg.vos"
    register_max: "informal"
    sample:
      es: "¿Vos sos Juan?"
      en: "Are you Juan?"
    tips:
      - title: "Vos, not tú"
        body: "In Argentina the everyday word for \"you\" is **vos**, and it has its own verb forms: *vos
          sos* (you are). You'll hear *tú* in other countries. This course never uses it."
    words:
      - lemma: "vos"
        pos: "pron"
        en: "you (informal)"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "sos"
            en: "you are"
            f: "2sg.pres.ind.vos"

  - ordinal: 6
    slug: "sos-turista"
    title: "Find the person you're meeting"
    summary: "¿Sos turista? No, soy estudiante"
    grammar:
      - "pron.sujeto.vos"
      - "ser.pres.2sg.vos"
      - "ser.rol.sin-articulo"
    register_max: "informal"
    sample:
      es: "Perdón, ¿vos sos turista? No, soy estudiante."
      en: "Sorry, are you a tourist? No, I'm a student."
    tips:
      - title: "Soy turista — no un"
        body: "With *ser*, a role goes straight after the verb: **Soy estudiante.** **¿Sos turista?**
          English says *a student*; Spanish leaves the *un* out."
      - title: "¿Sos vos?"
        body: "**Vos** can come after the verb when you're checking who someone is: *Ah, ¿sos vos?* —
          *Oh, it's you?* The answer: **Sí, soy yo.** Can't believe it? **¿Posta?** — *for real?*"
      - title: "Bienvenido, bienvenida"
        body: "Someone new in town gets a **¡bienvenido!** — or **¡bienvenida!** for a woman. The end of
          the word matches the person."
      - title: "Disculpá, permiso"
        body: "**Disculpá** gets a stranger's attention: *Disculpá, ¿sos Martín?* **Permiso** is what
          you say to get past someone, on a full bus or in a doorway."
    words:
      - lemma: "perdón"
        pos: "interj"
        en: "sorry"
      - lemma: "ah"
        pos: "interj"
        en: "oh, ah"
      - lemma: "posta"
        pos: "adv"
        en: "for real, honestly"
        register: "informal"
      - lemma: "bienvenido"
        pos: "adj"
        en: "welcome"
        forms:
          - form: "bienvenido"
            f: "m.sg"
          - form: "bienvenida"
            f: "f.sg"
      - lemma: "turista"
        pos: "noun"
        en: "tourist"
      - lemma: "estudiante"
        pos: "noun"
        en: "student"
      - lemma: "profe"
        pos: "noun"
        en: "teacher"
        note: "short for profesor or profesora"
        register: "informal"
      - lemma: "extranjero"
        pos: "adj"
        en: "foreign, a foreigner"
        forms:
          - form: "extranjero"
            f: "m.sg"
          - form: "extranjera"
            f: "f.sg"
      # Moved up from usted, which keeps "disculpame".
      - lemma: "disculpar"
        pos: "verb"
        en: "to excuse"
        forms:
          - form: "disculpá"
            en: "excuse me"
            f: "2sg.imp.vos"
      # What you say to get past. "permiso" the noun (permission) is
      # mis-viejos-querian's, and "con permiso" is como-no-dona-rosa's.
      - lemma: "permiso"
        pos: "interj"
        en: "let me through"
        note: "said to get past someone, where English says excuse me"

  - ordinal: 7
    slug: "practica-hola"
    title: "Practice: first meetings"
    summary: "Buenas, ¿vos sos Juan?"
    grammar:
      - "repaso.ser.soy-sos"
      - "repaso.saludos"
    register_max: "informal"
    sample:
      es: "Buen día. ¿Vos sos Martín? Sí, soy yo."
      en: "Good morning. Are you Martín? Yes, it's me."
    tips:
      - title: "Soy, sos"
        body: "Two forms of *ser* so far: **soy** for yourself, **sos** for the person in front of you.
          *Soy Lucía, ¿y vos?* — *¿Sos turista?* The pronoun is optional; the verb already says who."
      - title: "The right hello"
        body: "**Buen día** in the morning, **buenas tardes** later, **buenas** any time. To leave:
          **chau** or **hasta luego**. And after every *gracias*, a **de nada**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "otro"
      - "tostada"
      - "cerveza"
      - "buen día"
      - "de nada"
      - "claro"
      - "perdón"
      - "turista"
      - "estudiante"
      - "sos"
      - "soy"
      - "medialuna"

  - ordinal: 8
    slug: "como-te-llamas"
    title: "Ask someone's name"
    summary: "¿Cómo te llamás?"
    grammar:
      - "llamarse.pres.1sg-2sg.vos"
    register_max: "informal"
    sample:
      es: "¿Cómo te llamás? Me llamo Sofi."
      en: "What's your name? My name is Sofi."
    tips:
      - title: "Me llamo, te llamás"
        body: "Spanish says you *call yourself*: **me llamo Sofi** — my name is Sofi. Asking someone else:
          **¿cómo te llamás?**"
    words:
      - lemma: "me"
        pos: "pron"
        en: "me, myself"
        glue: true
      - lemma: "te"
        pos: "pron"
        en: "you, yourself"
        glue: true
      - lemma: "llamarse"
        pos: "verb"
        en: "to be called"
        forms:
          # What the learner meets is the chunk. "llamo" is never said without
          # "me" in front of it — nineteen sentences in the course contain it
          # and every one says "me llamo" — so a card for the bare form asks a
          # question with no answer, and its English can only be written by
          # smuggling the missing word into a parenthesis: "(my name) is".
          # The two bare forms stay below, marked `bound`: sentences still
          # resolve through them and the dictionary still has the conjugation,
          # but nothing drills them. docs/course-spec.md §1.5.
          - form: "me llamo"
            en: "my name is"
            f: "1sg.pres.ind.clitic"
          - form: "te llamás"
            en: "your name is"
            f: "2sg.pres.ind.vos.clitic"
          - form: "llamo"
            f: "1sg.pres.ind"
            bound: true
          - form: "llamás"
            f: "2sg.pres.ind.vos"
            bound: true
      - lemma: "cómo"
        pos: "adv"
        en: "how"
      # "qué" is not here: at this point the course has no verb for it to
      # question, so every sentence it can appear in is a bare "¿Qué?" asking
      # for a repeat — which is curt in Buenos Aires. "¿Cómo?", taught just
      # above, is the neutral way to ask that. It arrives in the next unit,
      # with "¿qué significa?".
      - lemma: "mucho gusto"
        pos: "phrase"
        en: "nice to meet you"

  - ordinal: 9
    slug: "encantado"
    title: "Get to know someone"
    summary: "Encantado. ¿Hablás inglés?"
    grammar:
      - "llamarse.pres.1sg-2sg.vos"
      - "pres.1sg-2sg.vos"
    register_max: "informal"
    sample:
      es: "Me llamo Martín, encantado. ¿Hablás inglés?"
      en: "My name is Martín, nice to meet you. Do you speak English?"
    tips:
      - title: "Encantado, encantada"
        body: "**Encantado** — *delighted* — is what you say when you meet someone, and it matches whoever is speaking: a man says *encantado*, a woman **encantada**. The reply: **igualmente** — *likewise*. Day to day, most porteños just say **un gusto** or *mucho gusto*: *Soy Sofi.* — *Un gusto, Sofi.*"
      - title: "-o for me, -ás or -és for vos"
        body: "Other verbs work like *me llamo, te llamás*: **hablo**, **¿hablás?** — **entiendo**,
          **¿entendés?** The *I* form ends in **-o**; the vos form is stressed on the end. Lost?
          *Perdón, no entiendo. **Despacio**, por favor.*"
      - title: "Nombre y apellido"
        body: "At any counter in Buenos Aires you'll hear *nombre y apellido, por favor* — your first
          name and your surname."
      - title: "When you get lost"
        body: "Stuck on a word: **¿cómo se dice…?** — *how do you say…?* — and **¿qué significa?** —
          *what does it mean?* Too fast: **¿me repetís?** or **más despacio, por favor**. **No
          entendí** is *I didn't get that*. And the line that buys you patience: **hablo un poco de
          castellano** — Argentines call the language *castellano*."
    words:
      - lemma: "nombre"
        pos: "noun"
        en: "name, first name"
      - lemma: "apellido"
        pos: "noun"
        en: "surname, last name"
      - lemma: "encantado"
        pos: "adj"
        en: "delighted"
        note: "said when you meet someone"
        forms:
          - form: "encantado"
            f: "m.sg"
          - form: "encantada"
            f: "f.sg"
      - lemma: "igualmente"
        pos: "adv"
        en: "likewise, same to you"
      - lemma: "hablar"
        pos: "verb"
        en: "to speak, to talk"
        forms:
          - form: "hablo"
            en: "I speak"
            f: "1sg.pres.ind"
          - form: "hablás"
            en: "you speak"
            f: "2sg.pres.ind.vos"
      - lemma: "inglés"
        pos: "noun"
        en: "English (the language)"
      - lemma: "entender"
        pos: "verb"
        en: "to understand"
        forms:
          - form: "entiendo"
            en: "I understand"
            f: "1sg.pres.ind.irregular"
          - form: "entendés"
            en: "you understand"
            f: "2sg.pres.ind.vos"
          # A past form, learnt whole in "no entendí": the preterite starts in
          # section 4, and naci-en teaches "entendiste".
          - form: "entendí"
            en: "I understood, I got it"
            f: "1sg.pret.ind"
      - lemma: "despacio"
        pos: "adv"
        en: "slowly"
      - lemma: "saber"
        pos: "verb"
        en: "to know"
        forms:
          - form: "sé"
            en: "I know"
            f: "1sg.pres.ind.irregular"
          - form: "sabés"
            en: "you know"
            f: "2sg.pres.ind.vos"
          - form: "sabe"
            en: "knows (he/she knows)"
            f: "3sg.pres.ind"
      # The survival phrases, moved up from the units that taught them (que-haces,
      # me-traes-un-cafe, de-donde-sos, que-significa), so a beginner can ask for
      # help from the first week.
      - lemma: "cómo se dice"
        pos: "phrase"
        en: "how do you say"
      - lemma: "qué"
        pos: "pron"
        en: "what"
