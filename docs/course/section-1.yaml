    register_max: "informal"
    sample:
      es: "¿Cuánto sale?"
      en: "How much is it?"
    tips:
      - title: "¿Cuánto sale?"
        body: "**¿Cuánto sale?** is the everyday Argentine way to ask a price — **¿cuánto cuesta?** works
          too and means the same. For more than one thing the verb changes: **¿cuánto salen?**,
          **¿cuánto cuestan?**"
      - title: "Mil, never un mil"
        body: "Argentine prices run into the thousands, so you will say **mil** all day. One thousand is
          just **mil** — never *un mil* — and the word does not change: *Sale mil pesos.* *¿Mil
          pesos? Es caro.* **Caro** and **barato** end in **-a** for a *la* word: *una gaseosa no es
          cara*. **¡Qué caro!** — *How expensive!*"
    words:
      - lemma: "cuánto"
        pos: "adj"
        forms:
          - form: "cuánto"
            en: "how much"
            f: "m.sg"
