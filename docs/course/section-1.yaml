    tips:
      - title: "Encantado, encantada"
        body: "**Encantado** — *delighted* — is what you say when you meet someone, and it matches whoever
          is speaking: a man says *encantado*, a woman **encantada**. The reply: **igualmente** —
          *likewise*. Day to day, most porteños just say **un gusto** or *mucho gusto*: *Soy Sofi.*
          — *Un gusto, Sofi.*"
      - title: "-o for me, -ás or -és for vos"
        body: "Other verbs work like *me llamo, te llamás*: **hablo**, **¿hablás?** — **entiendo**,
          **¿entendés?** The *I* form ends in **-o**; the vos form is stressed on the end. Lost?
          *Perdón, no entiendo. **Despacio**, por favor.*"
      - title: "De"
        body: "Spanish has no *'s*. Say the thing, then **de**, then the person: *Juan's teacher* is **profe
          de Juan**, *Marta's student* is **estudiante de Marta**. **De** also comes after *un
          poco*: *un poco de inglés* — *a little English*."
      - title: "When you get lost"
        body: "Stuck on a word: **¿cómo se dice…?** — *how do you say…?* — and **¿qué significa?** — *what
          does it mean?* Too fast: **¿me repetís?** or **más despacio, por favor**. **No entendí**
          is *I didn't get that*. And the line that buys you patience: **hablo un poco de
          castellano** — Argentines call the language *castellano*."
    words:
      - lemma: "nombre"
        pos: "noun"
        en: "name, first name"
      - lemma: "apellido"
        pos: "noun"
        en: "surname, last name"
      - lemma: "encantado"
        pos: "adj"
        en: "delighted; nice to meet you"
        note: "said when you meet someone"
