            f: "m.sg"
          - form: "extranjera"
            f: "f.sg"
      - lemma: "disculpar"
        pos: "verb"
        en: "to excuse"
        forms:
          - form: "disculpá"
            en: "excuse me"
            f: "2sg.imp.vos"
      - lemma: "permiso"
        pos: "interj"
        en: "let me through"
        note: "said to get past someone, where English says excuse me"
  - ordinal: 7
    slug: "practica-hola"
    title: "Practice: first meetings"
    summary: "Buenas, ¿vos sos Juan?"
    grammar:
      - "repaso.ser.soy-sos"
      - "repaso.saludos"
    register_max: "informal"
    sample:
      es: "Buen día. ¿Vos sos Martín? Sí, soy yo."
      en: "Good morning. Are you Martín? Yes, it's me."
    tips:
      - title: "Soy, sos"
        body: "Two forms of *ser* so far: **soy** for yourself, **sos** for the person in front of you. *Soy
          Lucía, ¿y vos?* — *¿Sos turista?* The words *yo* and *vos* are optional; the verb already
          says who."
      - title: "The right hello"
        body: "**Buen día** in the morning, **buenas tardes** later, **buenas** any time. To leave: **chau**
          or **hasta luego**. And after every *gracias*, a **de nada**."
    review:
