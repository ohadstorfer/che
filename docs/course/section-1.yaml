  # ==========================================================================
  - ordinal: 6
    slug: el-bondi
    title: El bondi
    summary: Getting around, and where things are
    grammar: [estar.pres.1sg-3sg, estar.ubicacion, hay, contraccion.del-al]
    register_max: informal
    sample: {es: "La parada del bondi está en la esquina.", en: "The bus stop is on the corner."}
    tips:
      - title: Hay or está
        body: >-
          **Hay** introduces something: *Hay un kiosco* — there's a kiosk.
          **Está** says where something you already know about is: *El kiosco
          está en la esquina.*
      - title: Del and al
        body: >-
          *de + el* always becomes **del**, and *a + el* becomes **al**:
          *la parada del bondi*, *voy al centro*.
    words:
      - lemma: estar
        pos: verb
        en: "to be (location, state)"
        forms:
          - {form: estoy, en: "I am", f: 1sg.pres.ind}
          - {form: estás, en: "you are", f: 2sg.pres.ind.vos}
          - {form: está, en: "is (he/she/it is)", f: 3sg.pres.ind}
      - lemma: haber
        pos: verb
        en: "there to be"
        forms:
          - {form: hay, en: "there is, there are", f: 3sg.pres.ind}
      - {lemma: en, pos: prep, en: "in, on, at", glue: true}
      - {lemma: del, pos: det, en: "of the", glue: true}
      - {lemma: al, pos: det, en: "to the", glue: true}
      - {lemma: bondi, pos: noun, en: "bus", register: informal}
      - {lemma: colectivo, pos: noun, en: "bus"}
      - {lemma: subte, pos: noun, en: "subway, metro"}
      - {lemma: parada, pos: noun, en: "stop (bus stop)"}
      - {lemma: kiosco, pos: noun, en: "kiosk, corner shop"}
      - lemma: cuadra
        pos: noun
        en: "block (street)"
        forms:
          - {form: cuadra, f: f.sg}
          - {form: cuadras, en: "blocks", f: f.pl}
      - {lemma: esquina, pos: noun, en: "corner"}
      - {lemma: calle, pos: noun, en: "street"}
      - {lemma: cerca, pos: adv, en: "near, close"}
      - {lemma: lejos, pos: adv, en: "far"}
      - {lemma: allá, pos: adv, en: "over there"}
      - {lemma: ahí, pos: adv, en: "there"}

