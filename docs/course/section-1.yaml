      - title: "¿Quién es?"
        body: "**Quién** asks *who*: *¿Quién es él?* The answer drops *él* or *ella*: *Es Martín, un
          vecino.* Whose? Use **de**: *una amiga de Juan* — *a friend of Juan's*. A **pibe** is a
          young guy and a **piba** a young woman — very porteño."
      - title: "También, tampoco"
        body: "**Tampoco** is the *no* version of *también*: *Él no es de acá, y ella tampoco.* — *He's not
          from here, and neither is she.*"
