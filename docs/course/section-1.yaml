# ---------------------------------------------------------------------------
# Che — Section 1 outline
#
# The curriculum everything downstream is generated against: which units exist,
# in what order, what grammar each one teaches, and every form it introduces.
# A form that appears nowhere in this file does not exist in the course, and a
# sentence may only use forms introduced in its own unit or an earlier one.
#
# Status: DRAFT — not yet reviewed by a native speaker (Phase 0).
#
# Validate:  npm run course:validate
#
# Conventions
#   words:     one entry per lemma the unit introduces or extends. A lemma is
#              defined (pos, en) the first time it appears; later units list
#              only the new forms.
#   forms:     omitted → the lemma itself is the only form.
#   f:         grammatical features, dot-separated:
#                person/number  1sg 2sg 3sg 1pl 3pl
#                tense/mood     pres ind imp
#                non-finite     inf ger
#                               vos (voseo form) · clitic (pronoun attached)
#                nominal        m f sg pl
#   register:  neutral (default) · informal · lunfardo. A unit may only use
#              lemmas up to its register_max in sentences.
#   glue:      function words (articles, prepositions, clitics). They are
#              taught, but not drilled on their own or scheduled by SRS.
#   propn:     proper nouns. Free in sentences, never drilled.
#   sample:    one sentence the unit must be able to say, checked against the
#              forms available by then.
# ---------------------------------------------------------------------------

section:
  id: 1
  slug: "first-words"
  title: "First words"
  cefr: "A1.1"
units:
  - ordinal: 1
    slug: "un-cafe-por-favor"
    title: "Order at a café"
    summary: "Un café, por favor"
    grammar:
      - "pedido.por-favor"
      - "articulo.indefinido"
      - "conj.y-o"
    register_max: "informal"
    sample:
      es: "Un café y una medialuna, por favor."
      en: "A coffee and a medialuna, please."
    tips:
      - title: "Un café, por favor"
        body: "The shortest way to order anything: name it and add **por favor**. *Un café, por favor.* *Una
          medialuna, por favor.* No verb needed."
      - title: "Facturas"
        body: "**Facturas** are the pastries you buy by the dozen at the bakery — *medialunas* are the best
          known. The same word also means *invoice*, but at the bakery it's always pastries."
    words:
      - lemma: "un"
        pos: "det"
        en: "a, an"
        glue: true
        forms:
          - form: "un"
            f: "m.sg"
          - form: "una"
            f: "f.sg"
      - lemma: "por favor"
        pos: "phrase"
        en: "please"
      - lemma: "gracias"
        pos: "interj"
        en: "thanks, thank you"
      - lemma: "y"
        pos: "conj"
        en: "and"
        glue: true
        note: "Argentines often start an answer with 'Y...' meaning 'well...': Y, depende."
      - lemma: "o"
        pos: "conj"
        en: "or"
        glue: true
      - lemma: "café"
        pos: "noun"
        en: "coffee"
      - lemma: "cortado"
        pos: "noun"
        en: "cortado"
        note: "espresso with a little milk"
      - lemma: "mate"
        pos: "noun"
        en: "mate, herbal tea"
        note: "Bitter yerba tea sipped through a metal straw (bombilla) from a gourd, shared around a
          circle."
      - lemma: "medialuna"
        pos: "noun"
        en: "medialuna"
        forms:
          - form: "medialuna"
            f: "f.sg"
        note: "Small sweet croissant: de manteca (butter, glazed) or de grasa (plainer). Breakfast staple."
      - lemma: "factura"
        pos: "noun"
        en: "pastry"
        forms:
          - form: "factura"
            f: "f.sg"
        note: "Sweet bakery pastries (medialunas, vigilantes, bolas de fraile), bought by the dozen. Also
          means invoice."
      - lemma: "agua"
        pos: "noun"
        en: "water"
      - lemma: "jugo"
        pos: "noun"
        en: "juice"
      - lemma: "café con leche"
        pos: "phrase"
        en: "coffee with milk"
  - ordinal: 2
    slug: "otro-cafe"
    title: "Order something to eat"
    summary: "Otro café y una tostada"
    grammar:
      - "pedido.por-favor"
      - "articulo.indefinido"
      - "conj.y-o"
    register_max: "informal"
    sample:
      es: "Otro café y una tostada, por favor."
      en: "Another coffee and some toast, please."
    tips:
      - title: "Otro, never un otro"
        body: "To order the same again, say **otro**: *Otro café, por favor.* For a word that takes *una*,
          it's **otra**: *Otra cerveza.* It already means \"another\", so nothing goes in front."
      - title: "Un or una"
        body: "The little word matches the thing, not you: **un** té, **un** helado, but **una** torta,
          **una** pizza. Learn each new word with its *un* or *una* and you'll never have to guess.
          One twist: *agua* takes **un** — *un agua*. It is still an *una* word, though: *otra
          agua*."
      - title: "Tostadas, un tostado"
        body: "In a café nobody orders one slice: ask for **tostadas** — *Un café y tostadas, por favor.*
          **Un tostado** is something else: a toasted ham-and-cheese sandwich, the classic café
          lunch. *Una tostada* is one slice, at home: *¿Otra tostada?*"
    words:
      - lemma: "otro"
        pos: "det"
        en: "another, other"
        forms:
          - form: "otro"
            f: "m.sg"
          - form: "otra"
            f: "f.sg"
      - lemma: "té"
        pos: "noun"
        en: "tea"
      - lemma: "cerveza"
        pos: "noun"
        en: "beer"
