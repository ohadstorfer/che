  - ordinal: 20
    slug: "tengo-hambre"
    title: "Say you're hungry, cold or sleepy"
    summary: "Tengo hambre y tengo frío"
    grammar:
      - "tener.pres.1sg-3sg"
      - "tener.expresiones"
    register_max: "informal"
    sample:
      es: "Tengo hambre. ¿Vos tenés frío?"
      en: "I'm hungry. Are you cold?"
    tips:
      - title: "You have hunger"
        body: "Where English *is*, Spanish *has*: **tengo hambre** (I'm hungry), **tengo sed**
          (thirsty), **tengo frío**, **tengo calor**, **tengo sueño** (sleepy), **tengo miedo**
          (scared). The same *tener* as your age."
      - title: "Tenés razón"
        body: "**Tenés razón** — *you're right*, literally *you have reason*. **No tengo tiempo** —
          *I don't have time*. **Tiene suerte** — *he's lucky*."
    words:
      - lemma: "hambre"
        pos: "noun"
        en: "hunger"
        note: "tengo hambre: I'm hungry"
      - lemma: "sed"
        pos: "noun"
        en: "thirst"
        note: "tengo sed: I'm thirsty"
      - lemma: "frío"
        pos: "noun"
        en: "cold"
      - lemma: "calor"
        pos: "noun"
        en: "heat"
      - lemma: "sueño"
        pos: "noun"
        en: "sleepiness, dream"
        note: "tengo sueño: I'm sleepy"
      - lemma: "miedo"
        pos: "noun"
        en: "fear"
      - lemma: "razón"
        pos: "noun"
        en: "reason, right"
      - lemma: "suerte"
        pos: "noun"
        en: "luck"
      - lemma: "tiempo"
        pos: "noun"
        en: "time"

  - ordinal: 21
    slug: "practica-tengo-hambre"
    title: "Practice: people and how they are"
    summary: "Mi tía es italiana y tiene frío"
    grammar:
      - "repaso.tener"
      - "repaso.genero"
    register_max: "informal"
    sample:
      es: "Mi hermana tiene hambre y mi tío tiene sueño."
      en: "My sister is hungry and my uncle is sleepy."
    tips:
      - title: "Tengo, tenés, tiene"
        body: "One verb for your age and for how you feel: **tengo** veinte años, **¿tenés** frío?,
          mi tío **tiene** sueño."
      - title: "-o, -a, or no change"
        body: "Words for people follow the person: *mi tío, mi tía*; *brasileño, brasileña*. A word in
          *-e* stays put: *canadiense*."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
