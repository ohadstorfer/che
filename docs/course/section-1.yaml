    register_max: "informal"
    sample:
      es: "Mi hermana tiene hambre y mi tío tiene sueño."
      en: "My sister is hungry and my uncle is sleepy."
    tips:
      - title: "Tengo, tenés, tiene"
        body: "One verb for your age and for how you feel: **tengo** veinte años, **¿tenés** frío?, mi tío
          **tiene** sueño."
      - title: "-o, -a, or no change"
        body: "Words for people follow the person: *mi tío, mi tía*; *brasileño, brasileña*. A word in *-e*
          stays put: *canadiense*. A nationality ending in a consonant adds *-a*, and any accent
          mark goes: *francés → francesa*, *español → española*."
    review:
