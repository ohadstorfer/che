  - ordinal: 5
    slug: mate-y-facturas
    title: Mate y facturas
    summary: What you like to eat and drink
    grammar: [gustar.me-te-le, articulo.definido, conj.o]
    register_max: informal
    sample: {es: "¿Te gusta el mate amargo o dulce?", en: "Do you like your mate bitter or sweet?"}
    tips:
      - title: Gustar works backwards
        body: >-
          **Me gusta el mate** means "mate pleases me". The verb matches the
          thing you like: *me gusta el café*, but *me gustan las facturas*.
      - title: Facturas
        body: >-
          **Facturas** are the pastries you buy by the dozen at the bakery —
          *medialunas* are the best known. Nothing to do with bills.
    words:
      - lemma: gustar
        pos: verb
        en: "to please, to like"
        forms:
          - {form: gusta, en: "likes (one thing)", f: 3sg.pres.ind}
          - {form: gustan, en: "likes (several things)", f: 3pl.pres.ind}
      - {lemma: le, pos: pron, en: "(to) him, her", glue: true}
