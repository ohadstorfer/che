            f: "1sg.pres.ind.clitic"
          - form: "te llamás"
            en: "your name is"
            f: "2sg.pres.ind.vos.clitic"
          - form: "llamo"
            f: "1sg.pres.ind"
            bound: true
          - form: "llamás"
            f: "2sg.pres.ind.vos"
            bound: true
