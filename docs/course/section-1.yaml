# ---------------------------------------------------------------------------
# Che — Section 1 outline
#
# The curriculum everything downstream is generated against: which units exist,
# in what order, what grammar each one teaches, and every form it introduces.
# A form that appears nowhere in this file does not exist in the course, and a
# sentence may only use forms introduced in its own unit or an earlier one.
#
# Status: DRAFT — not yet reviewed by a native speaker (Phase 0).
#
# Validate:  npm run course:validate
#
# Conventions
#   words:     one entry per lemma the unit introduces or extends. A lemma is
#              defined (pos, en) the first time it appears; later units list
#              only the new forms.
#   forms:     omitted → the lemma itself is the only form.
#   f:         grammatical features, dot-separated:
#                person/number  1sg 2sg 3sg 1pl 3pl
#                tense/mood     pres ind imp
#                non-finite     inf ger
#                               vos (voseo form) · clitic (pronoun attached)
#                nominal        m f sg pl
#   register:  neutral (default) · informal · lunfardo. A unit may only use
#              lemmas up to its register_max in sentences.
#   glue:      function words (articles, prepositions, clitics). They are
#              taught, but not drilled on their own or scheduled by SRS.
#   propn:     proper nouns. Free in sentences, never drilled.
#   sample:    one sentence the unit must be able to say, checked against the
#              forms available by then.
# ---------------------------------------------------------------------------

section:
  id: 1
  slug: first-words
  title: First words
  cefr: A1.1

units:
  # ==========================================================================
  - ordinal: 1
    slug: hola-che
    title: Hola, che
    summary: Say hi, say who you are, ask how someone is
    grammar: [saludos, pron.sujeto.yo, pron.sujeto.vos, ser.pres.1sg, ser.pres.2sg.vos, llamarse.pres.1sg, llamarse.pres.2sg.vos]
    register_max: informal
    sample: {es: "¿Todo bien, che? Todo bien, ¿y vos?", en: "All good? All good, and you?"}
    tips:
      - title: Vos, not tú
        body: >-
          In Argentina the everyday word for "you" is **vos**, and it has its
          own verb forms: *vos sos* (you are), *vos te llamás* (your name is).
          You'll hear *tú* in other countries. This course never uses it.
      - title: Che
        body: >-
          **Che** is how people in Buenos Aires get someone's attention — like
          "hey" or "mate". It's friendly, never rude.
    words:
      - {lemma: hola, pos: interj, en: "hi, hello"}
      - {lemma: chau, pos: interj, en: "bye"}
      - {lemma: che, pos: interj, en: "hey (to get attention)", register: informal}
      - {lemma: dale, pos: interj, en: "OK, sure, go ahead", register: informal}
      - {lemma: bueno, pos: interj, en: "well, OK"}
      - {lemma: gracias, pos: interj, en: "thanks, thank you"}
      - {lemma: sí, pos: adv, en: "yes"}
      - {lemma: "no", pos: adv, en: "no, not"}
      - {lemma: bien, pos: adv, en: "well, fine, good"}
      - {lemma: mal, pos: adv, en: "badly, not well"}
      - {lemma: todo bien, pos: phrase, en: "all good"}
      - {lemma: qué tal, pos: phrase, en: "how's it going"}
      - {lemma: mucho gusto, pos: phrase, en: "nice to meet you"}
      - {lemma: cómo, pos: adv, en: "how"}
      - {lemma: qué, pos: pron, en: "what"}
      - {lemma: yo, pos: pron, en: "I"}
      - {lemma: vos, pos: pron, en: "you (informal)"}
      - {lemma: y, pos: conj, en: "and", glue: true}
      - {lemma: me, pos: pron, en: "me, myself", glue: true}
      - {lemma: te, pos: pron, en: "you, yourself", glue: true}
      - lemma: ser
        pos: verb
        en: "to be"
        forms:
          - {form: soy, en: "I am", f: 1sg.pres.ind}
          - {form: sos, en: "you are", f: 2sg.pres.ind.vos}
      - lemma: llamarse
        pos: verb
        en: "to be called"
        forms:
          - {form: llamo, en: "(my name) is, I'm called", f: 1sg.pres.ind}
          - {form: llamás, en: "(your name) is, you're called", f: 2sg.pres.ind.vos}
      - {lemma: Sofi, pos: propn, en: "Sofi"}
      - {lemma: Juan, pos: propn, en: "Juan"}
      - {lemma: Martín, pos: propn, en: "Martín"}
      - {lemma: Lucía, pos: propn, en: "Lucía"}

