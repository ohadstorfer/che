  - ordinal: 21
    slug: "treinta-y-cuatro"
    title: "Count to a hundred and say your real age"
    summary: "Tengo treinta y cuatro años"
    grammar:
      - "numeros.21-100"
      - "tener.pres.1sg-3sg"
    register_max: "informal"
    sample:
      es: "Tengo treinta y cuatro años"
      en: "I'm thirty-four"
    tips:
      - title: "Veinticinco, treinta y cuatro"
        body: "From 21 to 29 the number is one word: **veintiuno**, **veintidós**, **veinticinco**. From
          **treinta** on it is three words joined by **y**: *Tengo treinta y cuatro años.* The same
          pattern works for **cuarenta**, **cincuenta** and all the way up to **noventa**. Before
          *años*, **uno** becomes **un**: *veintiún años*, *treinta y un años*."
      - title: "Sesenta or setenta?"
        body: "**Sesenta** (60) and **setenta** (70) are the pair everyone mixes up: **sesenta** has the
          **s** of *six*, **setenta** has the **t** of *seven*. And a round hundred is just **cien**
          — never *un cien*."
    words:
