            f: "f.sg"
          - form: "tostadas"
            en: "toast"
            note: "ordered in the plural: café con tostadas"
            f: "f.pl"
      - lemma: "sándwich"
        pos: "noun"
        en: "sandwich"
      - lemma: "pizza"
        pos: "noun"
        en: "pizza"
        forms:
          - form: "pizza"
            f: "f.sg"
      - lemma: "helado"
        pos: "noun"
        en: "ice cream"
      - lemma: "torta"
        pos: "noun"
        en: "cake"
        forms:
          - form: "torta"
            f: "f.sg"
      - lemma: "comida"
        pos: "noun"
        en: "food, meal"
      - lemma: "tostado"
        pos: "noun"
        en: "toasted sandwich"
        note: "Usually ham and cheese on thin crustless bread (pan de miga), toasted. A café classic."
  - ordinal: 3
    slug: "hola-che"
    title: "Greet people"
    summary: "Che, ¿todo bien?"
    grammar:
      - "saludos"
      - "ser.pres.1sg"
    register_max: "informal"
    sample:
      es: "Che, ¿todo bien?"
      en: "Hey, all good?"
    tips:
      - title: "Che"
        body: "**Che** is how people in Buenos Aires get someone's attention — like \"hey\": *Che, ¿todo
          bien?* It comes first, often with a name: *Che, Juan, ¿un mate?* It's friendly and
          casual — not for formal moments."
      - title: "Soy"
        body: "To say who you are, use **soy**: *Soy Sofi.* One word carries \"I am\". The word for \"I\"
          (**yo**) is usually left out; add it only to stress or contrast: *Yo soy Martín.*"
      - title: "¿Cómo andás?"
        body: "**¿Cómo andás?** is the everyday porteño *how are you?* — you will hear it all day. The
          answer is short: *Bien.* or *Todo bien.* **¿Qué onda?** gets the same answer: *¿Qué onda?
          — Todo bien.*"
