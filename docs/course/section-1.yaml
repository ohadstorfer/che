  # ==========================================================================
  - ordinal: 4
    slug: la-familia
    title: La familia
    summary: Family, plurals, and whose is whose
    grammar: [posesivos.tu-su, plural.-s-es, tener.pres.1pl-3pl, ser.pres.1pl-3pl, pron.sujeto.plural]
    register_max: informal
    sample: {es: "Mis viejos son de Rosario.", en: "My parents are from Rosario."}
    tips:
      - title: Mis viejos
        body: >-
          **Mis viejos** — literally "my old ones" — is how Argentines say *my
          parents*. It's affectionate. Plurals add **-s** after a vowel
          (*hermanos*) and **-es** after a consonant.
      - title: Ustedes
        body: >-
          For more than one person, Argentina uses **ustedes** with the same
          verb form as *ellos*: *ustedes son*, *ellos son*.
    words:
      - lemma: mi
        pos: det
        forms:
          - {form: mis, en: "my (plural)", f: pl}
      - lemma: tu
        pos: det
        en: "your"
        glue: true
        forms:
          - {form: tu, f: sg}
          - {form: tus, f: pl}
      - lemma: su
        pos: det
        en: "his, her, their"
        glue: true
        forms:
          - {form: su, f: sg}
          - {form: sus, f: pl}
      - lemma: tener
        pos: verb
        forms:
          - {form: tenemos, en: "we have", f: 1pl.pres.ind}
          - {form: tienen, en: "they have, you (pl.) have", f: 3pl.pres.ind}
      - lemma: ser
        pos: verb
        forms:
