  - ordinal: 10
    slug: "en-el-kiosco"
    title: "Buy at the kiosco"
    summary: "Dos medialunas"
    grammar:
      - "plural.-s-es"
      - "posesivo.tu"
    register_max: "informal"
    sample:
      es: "Dos medialunas y dos empanadas, por favor."
      en: "Two croissants and two empanadas, please."
    tips:
      - title: "More than one"
        body: "Add **-s** after a vowel (*medialuna → medialunas*) and **-es** after a consonant. The word
          for \"a\" disappears: *una empanada*, but *dos empanadas*."
      - title: "El kiosco"
        body: "A **kiosco** is the corner shop that sells drinks, sweets and bus cards, often through a
          window onto the street. Many never close."
    words:
      - lemma: "mi"
        pos: "det"
        forms:
          - form: "mis"
            en: "my (plural)"
            f: "pl"
      - lemma: "tu"
        pos: "det"
        en: "your"
        glue: true
        forms:
          - form: "tu"
            f: "sg"
          - form: "tus"
            f: "pl"
      - lemma: "kiosco"
        pos: "noun"
        en: "kiosk, corner shop"
      - lemma: "empanada"
        pos: "noun"
        en: "empanada"
        forms:
