# ---------------------------------------------------------------------------
# Che — Section 1 outline
#
# The curriculum everything downstream is generated against: which units exist,
# in what order, what grammar each one teaches, and every form it introduces.
# A form that appears nowhere in this file does not exist in the course, and a
# sentence may only use forms introduced in its own unit or an earlier one.
#
# Status: DRAFT — not yet reviewed by a native speaker (Phase 0).
#
# Validate:  npm run course:validate
#
# Conventions
#   words:     one entry per lemma the unit introduces or extends. A lemma is
#              defined (pos, en) the first time it appears; later units list
#              only the new forms.
#   forms:     omitted → the lemma itself is the only form.
#   f:         grammatical features, dot-separated:
#                person/number  1sg 2sg 3sg 1pl 3pl
#                tense/mood     pres ind imp
#                non-finite     inf ger
#                               vos (voseo form) · clitic (pronoun attached)
#                nominal        m f sg pl
#   register:  neutral (default) · informal · lunfardo. A unit may only use
#              lemmas up to its register_max in sentences.
#   glue:      function words (articles, prepositions, clitics). They are
#              taught, but not drilled on their own or scheduled by SRS.
#   propn:     proper nouns. Free in sentences, never drilled.
#   sample:    one sentence the unit must be able to say, checked against the
#              forms available by then.
# ---------------------------------------------------------------------------

section:
  id: 1
  slug: "first-words"
  title: "First words"
  cefr: "A1.1"
units:
  - ordinal: 1
    slug: "un-cafe-por-favor"
    title: "Order at a café"
    summary: "Un café, por favor"
    grammar:
      - "pedido.por-favor"
      - "articulo.indefinido"
      - "conj.y-o"
    register_max: "informal"
    sample:
      es: "Un café y una medialuna, por favor."
      en: "A coffee and a croissant, please."
    tips:
      - title: "Un café, por favor"
        body: "The shortest way to order anything: name it and add **por favor**. *Un café, por favor.* *Una
          medialuna, por favor.* No verb needed."
      - title: "Facturas"
        body: "**Facturas** are the pastries you buy by the dozen at the bakery — *medialunas* are the best
          known. Nothing to do with bills."
    words:
      - lemma: "un"
        pos: "det"
        en: "a, an"
        glue: true
        forms:
          - form: "un"
            f: "m.sg"
          - form: "una"
            f: "f.sg"
      - lemma: "por favor"
        pos: "phrase"
        en: "please"
      - lemma: "gracias"
        pos: "interj"
        en: "thanks, thank you"
      - lemma: "y"
        pos: "conj"
        en: "and"
        glue: true
      - lemma: "o"
        pos: "conj"
        en: "or"
        glue: true
      - lemma: "café"
        pos: "noun"
        en: "coffee"
      - lemma: "cortado"
        pos: "noun"
        en: "cortado (espresso with a little milk)"
      - lemma: "mate"
        pos: "noun"
        en: "mate (the drink)"
      - lemma: "medialuna"
        pos: "noun"
        en: "croissant"
        forms:
          - form: "medialuna"
            f: "f.sg"
      - lemma: "factura"
        pos: "noun"
        en: "pastry"
        forms:
          - form: "factura"
            f: "f.sg"
      - lemma: "agua"
        pos: "noun"
        en: "water"
      - lemma: "jugo"
        pos: "noun"
        en: "juice"
  - ordinal: 2
    slug: "hola-che"
    title: "Greet people"
    summary: "Hola, che"
    grammar:
      - "saludos"
      - "ser.pres.1sg"
    register_max: "informal"
    sample:
      es: "Hola, che. Todo bien."
      en: "Hi there. All good."
    tips:
      - title: "Che"
        body: "**Che** is how people in Buenos Aires get someone's attention — like \"hey\" or \"mate\".
          It's friendly, never rude."
      - title: "Soy"
        body: "To say who you are, use **soy**: *Soy Sofi.* One word carries \"I am\" — Spanish has no
          separate word for \"I\" here."
    words:
      - lemma: "hola"
        pos: "interj"
        en: "hi, hello"
      - lemma: "chau"
        pos: "interj"
        en: "bye"
      - lemma: "che"
        pos: "interj"
        en: "hey (to get attention)"
        register: "informal"
      - lemma: "dale"
        pos: "interj"
        en: "OK, sure, go ahead"
        register: "informal"
      - lemma: "bueno"
        pos: "interj"
        en: "well, OK"
      - lemma: "bien"
        pos: "adv"
        en: "well, fine, good"
      - lemma: "mal"
        pos: "adv"
        en: "badly, not well"
      - lemma: "sí"
        pos: "adv"
        en: "yes"
      - lemma: "no"
        pos: "adv"
        en: "no, not"
      - lemma: "todo bien"
        pos: "phrase"
        en: "all good"
      - lemma: "qué tal"
        pos: "phrase"
        en: "how's it going"
      - lemma: "yo"
        pos: "pron"
        en: "I"
      - lemma: "ser"
        pos: "verb"
        en: "to be"
        forms:
          - form: "soy"
            en: "I am"
            f: "1sg.pres.ind"
      - lemma: "Sofi"
        pos: "propn"
        en: "Sofi"
      - lemma: "Juan"
        pos: "propn"
        en: "Juan"
      - lemma: "Martín"
        pos: "propn"
        en: "Martín"
      - lemma: "Lucía"
        pos: "propn"
        en: "Lucía"
  - ordinal: 3
    slug: "vos-y-sos"
    title: "Talk to someone as vos"
    summary: "¿Sos vos?"
    grammar:
      - "pron.sujeto.vos"
      - "ser.pres.2sg.vos"
    register_max: "informal"
    sample:
      es: "¿Vos sos Juan?"
      en: "Are you Juan?"
    tips:
      - title: "Vos, not tú"
        body: "In Argentina the everyday word for \"you\" is **vos**, and it has its own verb forms: *vos
          sos* (you are). You'll hear *tú* in other countries. This course never uses it."
    words:
      - lemma: "vos"
        pos: "pron"
        en: "you (informal)"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "sos"
            en: "you are"
            f: "2sg.pres.ind.vos"
  - ordinal: 4
    slug: "como-te-llamas"
    title: "Ask someone's name"
    summary: "¿Cómo te llamás?"
    grammar:
      - "llamarse.pres.1sg-2sg.vos"
    register_max: "informal"
    sample:
      es: "¿Cómo te llamás? Me llamo Sofi."
      en: "What's your name? My name is Sofi."
    tips:
      - title: "Me llamo, te llamás"
        body: "Spanish says you *call yourself*: **me llamo Sofi** — my name is Sofi. Asking someone else:
          **¿cómo te llamás?**"
    words:
      - lemma: "me"
        pos: "pron"
        en: "me, myself"
        glue: true
      - lemma: "te"
        pos: "pron"
        en: "you, yourself"
        glue: true
      - lemma: "llamarse"
        pos: "verb"
        en: "to be called"
        forms:
          - form: "llamo"
            en: "(my name) is, I'm called"
            f: "1sg.pres.ind"
          - form: "llamás"
            en: "(your name) is, you're called"
            f: "2sg.pres.ind.vos"
      - lemma: "cómo"
        pos: "adv"
        en: "how"
      - lemma: "qué"
        pos: "pron"
        en: "what"
      - lemma: "mucho gusto"
        pos: "phrase"
        en: "nice to meet you"
  - ordinal: 5
    slug: "de-donde-sos"
    title: "Say where you're from"
    summary: "¿De dónde sos?"
    grammar:
      - "ser.de.origen"
    register_max: "informal"
    sample:
      es: "¿De dónde sos? Soy de Rosario."
      en: "Where are you from? I am from Rosario."
    tips:
      - title: "Ser de"
        body: "To say where someone is from, put **de** after the verb: *Soy de Rosario.* *¿De dónde sos?*"
    words:
      - lemma: "de"
        pos: "prep"
        en: "from, of"
        glue: true
      - lemma: "dónde"
        pos: "adv"
        en: "where"
      - lemma: "acá"
        pos: "adv"
        en: "here"
      - lemma: "Argentina"
        pos: "propn"
        en: "Argentina"
      - lemma: "Uruguay"
        pos: "propn"
        en: "Uruguay"
      - lemma: "Buenos Aires"
        pos: "propn"
        en: "Buenos Aires"
      - lemma: "Rosario"
        pos: "propn"
        en: "Rosario"
      - lemma: "Córdoba"
        pos: "propn"
        en: "Córdoba"
      - lemma: "Montevideo"
        pos: "propn"
        en: "Montevideo"
  - ordinal: 6
    slug: "el-y-ella"
    title: "Talk about someone else"
    summary: "Él es de acá"
    grammar:
      - "ser.pres.3sg"
      - "pron.sujeto.el-ella"
    register_max: "informal"
    sample:
      es: "Ella es de Córdoba, pero él es de acá."
      en: "She is from Córdoba, but he is from here."
    tips:
      - title: "Es"
        body: "One form covers both: **él es** and **ella es**. It also works for a name: *Juan es de
          Rosario.*"
      - title: "You can drop the pronoun"
        body: "The verb already says who: *soy* is only ever \"I am\", *sos* only \"you are\". So **Soy de
          acá** and *Yo soy de acá* are both right, and the short one is what people say."
    words:
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "es"
            en: "is (he/she is)"
            f: "3sg.pres.ind"
      - lemma: "él"
        pos: "pron"
        en: "he"
      - lemma: "ella"
        pos: "pron"
        en: "she"
      - lemma: "también"
        pos: "adv"
        en: "also, too"
      - lemma: "pero"
        pos: "conj"
        en: "but"
  - ordinal: 7
    slug: "argentino-argentina"
    title: "Say what people are"
    summary: "Es argentino, es argentina"
    grammar:
      - "adj.nacionalidad.genero"
    register_max: "informal"
    sample:
      es: "Ella es argentina y él es uruguayo."
      en: "She is Argentinian and he is Uruguayan."
    tips:
      - title: "Argentino or argentina"
        body: "These words change with the person: **argentino** for a man, **argentina** for a woman. Same
          for *uruguayo / uruguaya*, *chileno / chilena*."
      - title: "Porteño"
        body: "Someone from the city of Buenos Aires is **porteño** or **porteña** — from *puerto*, the
          port. People from the rest of the country are not."
    words:
      - lemma: "argentino"
        pos: "adj"
        en: "Argentinian"
        forms:
          - form: "argentino"
            f: "m.sg"
          - form: "argentina"
            f: "f.sg"
      - lemma: "uruguayo"
        pos: "adj"
        en: "Uruguayan"
        forms:
          - form: "uruguayo"
            f: "m.sg"
          - form: "uruguaya"
            f: "f.sg"
      - lemma: "chileno"
        pos: "adj"
        en: "Chilean"
        forms:
          - form: "chileno"
            f: "m.sg"
          - form: "chilena"
            f: "f.sg"
      - lemma: "inglés"
        pos: "adj"
        en: "English"
        forms:
          - form: "inglés"
            f: "m.sg"
          - form: "inglesa"
            f: "f.sg"
      - lemma: "porteño"
        pos: "adj"
        en: "from Buenos Aires"
        forms:
          - form: "porteño"
            f: "m.sg"
          - form: "porteña"
            f: "f.sg"
  - ordinal: 8
    slug: "la-familia"
    title: "Introduce your family"
    summary: "Mi familia"
    grammar:
      - "sustantivo.genero"
      - "posesivo.mi"
    register_max: "informal"
    sample:
      es: "Mi hermana es porteña."
      en: "My sister is from Buenos Aires."
    tips:
      - title: "Words are masculine or feminine"
        body: "A word ending in **-o** is usually masculine and takes *un*: *un hermano*. One ending in
          **-a** is usually feminine and takes *una*: *una hermana*."
      - title: "Mis viejos"
        body: "**Mi viejo** and **mi vieja** — literally \"my old one\" — are affectionate Argentine words
          for *my dad* and *my mum*."
    words:
      - lemma: "mi"
        pos: "det"
        en: "my"
        glue: true
        forms:
