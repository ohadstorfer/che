  - ordinal: 4
    slug: "buen-dia"
    title: "Say hello and goodbye"
    summary: "Buen día, buenas tardes"
    grammar:
      - "saludos"
      - "ser.pres.1sg"
    register_max: "informal"
    sample:
      es: "Buenas tardes, soy Martín."
      en: "Good afternoon, I'm Martín."
    tips:
      - title: "Buen día"
        body: "In Buenos Aires the morning greeting is **buen día**, until lunch. After that it's **buenas
          tardes**, and once it's dark **buenas noches** — hello *and* goodbye. Short for any of
          them: **buenas**."
      - title: "Gracias, de nada"
        body: "When someone says *gracias*, answer **de nada**. *Of course* is **claro**. And when
          everything is fine or agreed, porteños say **¡joya!** — *¿Todo bien? — ¡Joya!*"
    words:
      - lemma: "buen día"
        pos: "phrase"
        en: "good morning"
        note: "Argentines usually say buen día (singular), not buenos días."
      - lemma: "buenas tardes"
        pos: "phrase"
        en: "good afternoon"
      - lemma: "buenas noches"
        pos: "phrase"
        en: "good evening, good night"
      - lemma: "buenas"
        pos: "interj"
        en: "hi there"
        note: "short for any greeting, any time of day"
        register: "informal"
      - lemma: "hasta luego"
        pos: "phrase"
        en: "see you later"
      - lemma: "hasta mañana"
        pos: "phrase"
        en: "see you tomorrow"
      - lemma: "de nada"
        pos: "phrase"
        en: "you're welcome"
      - lemma: "claro"
        pos: "adv"
        en: "sure, of course"
      - lemma: "genial"
        pos: "adj"
        en: "great, awesome"
      - lemma: "joya"
        pos: "adj"
        en: "great, perfect"
        note: "Literally 'jewel'. Very common casual way to say great or perfect."
        register: "informal"
      - lemma: "muy"
        pos: "adv"
        en: "very"
  - ordinal: 5
    slug: "vos-y-sos"
    title: "Talk to someone as vos"
    summary: "¿Sos vos?"
    grammar:
      - "pron.sujeto.vos"
      - "ser.pres.2sg.vos"
    register_max: "informal"
    sample:
      es: "¿Vos sos Juan?"
      en: "Are you Juan?"
    tips:
      - title: "Vos, not tú"
        body: "In Argentina the everyday word for \"you\" is **vos**, and it has its own verb forms: *vos
          sos* (you are). You'll hear *tú* in other countries. This course never uses it."
    words:
      - lemma: "vos"
        pos: "pron"
        en: "you"
        note: "Argentina's 'you' for everyone, instead of tú, with its own verb forms: vos sos, vos tenés."
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "sos"
            en: "you are"
            f: "2sg.pres.ind.vos"
  - ordinal: 6
    slug: "sos-turista"
    title: "Say what you are: tourist, student"
    summary: "¿Sos turista? No, soy estudiante"
    grammar:
      - "pron.sujeto.vos"
      - "ser.pres.2sg.vos"
      - "ser.rol.sin-articulo"
    register_max: "informal"
    sample:
      es: "Perdón, ¿vos sos turista? No, soy estudiante."
      en: "Sorry, are you a tourist? No, I'm a student."
    tips:
      - title: "Soy turista — no un"
        body: "With *ser*, a role goes straight after the verb: **Soy estudiante.** **¿Sos turista?**
          English says *a student*; Spanish leaves the *un* out."
      - title: "¿Sos vos?"
        body: "**Vos** can come after the verb when you're checking who someone is: *Ah, ¿sos vos?* — *Oh,
          it's you?* The answer: **Sí, soy yo.** Can't believe it? **¿Posta?** — *for real?*"
      - title: "Bienvenido, bienvenida"
        body: "Someone new in town gets a **¡bienvenido!** — or **¡bienvenida!** for a woman. The end of the
          word matches the person."
      - title: "Disculpá, permiso"
        body: "**Disculpá** gets a stranger's attention: *Disculpá, ¿sos Martín?* **Permiso** is what you
          say to get past someone, on a full bus or in a doorway."
    words:
      - lemma: "perdón"
        pos: "interj"
        en: "sorry"
      - lemma: "ah"
        pos: "interj"
        en: "oh, ah"
      - lemma: "posta"
        pos: "adv"
        en: "for real, honestly"
        register: "informal"
      - lemma: "bienvenido"
        pos: "adj"
        en: "welcome"
        forms:
