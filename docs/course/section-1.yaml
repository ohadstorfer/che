  - ordinal: 22
    slug: "alfajores-y-chicles"
    title: "Buy snacks by the dozen"
    summary: "Una docena de alfajores"
    grammar:
      - "plural.-s-es"
      - "posesivo.tu"
    register_max: "informal"
    sample:
      es: "Una docena de alfajores y dos paquetes de galletitas, por favor."
      en: "A dozen alfajores and two packets of cookies, please."
    tips:
      - title: "-s or -es"
        body: "A word ending in a vowel adds **-s**: *galletita → galletitas*, *chicle → chicles*. One
          ending in a consonant adds **-es**: *alfajor → **alfajores***. With a number, *un* and
          *una* drop out: *dos paquetes*."
      - title: "Tu, tus — mi, mis"
        body: "*Your* is **tu**, and it takes an *-s* with more than one: **tu** hermano, **tus**
          hermanos. *My* works the same way: *mi* gato, **mis** gatos."
      - title: "Alfajores"
        body: "An **alfajor** is two soft biscuits stuck together with *dulce de leche*, often dipped
          in chocolate. Every kiosco sells them, and every porteño has a favourite."
    words:
      - lemma: "tu"
        pos: "det"
        en: "your"
        glue: true
        forms:
          - form: "tu"
            f: "sg"
          - form: "tus"
            f: "pl"
      - lemma: "mi"
        pos: "det"
        forms:
          - form: "mis"
            en: "my (plural)"
            f: "pl"
      - lemma: "alfajor"
