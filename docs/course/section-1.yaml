  - ordinal: 20
    slug: repaso
    title: Repaso
    summary: Checkpoint — everything in section one
    grammar: [repaso, registro.informal]
    register_max: informal
    lessons: 3
    sample: {es: "Posta, este barrio es re copado.", en: "Honestly, this neighbourhood is really cool."}
    tips:
      - title: Boludo and quilombo
        body: >-
          **Boludo** is common between close friends and an insult to anyone
          else — understand it, don't use it yet. **Quilombo** means a mess;
          it's informal, not rude, but keep it out of formal settings.
      - title: Sharing mate
        body: >-
          Mate goes around the circle and always comes back to whoever is
          serving it. Saying **gracias** means *I'm done* — only say it when you
          don't want another round.
    words:
      - {lemma: posta, pos: adv, en: "for real, honestly", register: informal}
      - lemma: copado
        pos: adj
        en: "cool, great"
        register: informal
        forms:
          - {form: copado, f: m.sg}
          - {form: copada, f: f.sg}
      - lemma: pibe
        pos: noun
        en: "guy, kid"
        register: informal
        forms:
          - {form: pibe, f: m.sg}
          - {form: piba, en: "girl", f: f.sg}
          - {form: pibes, en: "guys, kids", f: m.pl}
