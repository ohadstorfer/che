  - ordinal: 22
    slug: "tengo-hambre"
    title: "Say you're hungry, cold or sleepy"
    summary: "Tengo hambre y tengo frío"
    grammar:
      - "tener.pres.1sg-3sg"
      - "tener.expresiones"
    register_max: "informal"
    sample:
      es: "Tengo hambre. ¿Vos tenés frío?"
      en: "I'm hungry. Are you cold?"
    tips:
      - title: "You have hunger"
        body: "Where English *is*, Spanish *has*: **tengo hambre** (I'm hungry), **tengo sed** (thirsty),
          **tengo frío**, **tengo calor**, **tengo sueño** (sleepy), **tengo miedo** (scared). The
          same *tener* as your age."
      - title: "Tenés razón"
        body: "**Tenés razón** — *you're right*, literally *you have reason*. **No tengo tiempo** — *I don't
          have time*. **Tiene suerte** — *he's lucky*."
