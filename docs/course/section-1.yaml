  # ==========================================================================
  - ordinal: 8
    slug: comes-vivis
    title: Comés, vivís
    summary: Eating, living, reading and writing
    grammar: [verbos.-er.pres, verbos.-ir.pres]
    register_max: informal
    sample: {es: "¿Vivís solo o con tu familia?", en: "Do you live alone or with your family?"}
    tips:
      - title: -er and -ir verbs with vos
        body: >-
          Vos keeps the vowel of the infinitive and stresses it: *comer* →
          **comés**, *vivir* → **vivís**, *leer* → **leés**.
    words:
      - lemma: comer
        pos: verb
        en: "to eat"
        forms:
          - {form: como, en: "I eat", f: 1sg.pres.ind}
          - {form: comés, en: "you eat", f: 2sg.pres.ind.vos}
          - {form: come, en: "eats (he/she eats)", f: 3sg.pres.ind}
          - {form: comemos, en: "we eat", f: 1pl.pres.ind}
          - {form: comen, en: "they eat", f: 3pl.pres.ind}
