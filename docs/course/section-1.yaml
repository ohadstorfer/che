  - ordinal: 7
    slug: que-haces
    title: ¿Qué hacés?
    summary: Work, study, and what you do all day
    grammar: [verbos.-ar.pres, hacer.pres.1sg-3sg, a-la-noche]
    register_max: informal
    sample: {es: "Laburo en el centro y estudio a la noche.", en: "I work downtown and study at night."}
    tips:
      - title: -ar verbs with vos
        body: >-
          Regular **-ar** verbs: *laburo, laburás, labura, laburamos, laburan*.
          The vos form stresses the last syllable and carries an accent:
          *hablás*, *estudiás*.
      - title: Laburar
        body: >-
          **Laburar** is the everyday Argentine word for *to work* — from the
          Italian *lavorare*. *Trabajar* is understood everywhere and fine too.
    words:
      - lemma: laburar
        pos: verb
        en: "to work"
        register: informal
        forms:
          - {form: laburo, en: "I work", f: 1sg.pres.ind}
          - {form: laburás, en: "you work", f: 2sg.pres.ind.vos}
          - {form: labura, en: "works (he/she works)", f: 3sg.pres.ind}
          - {form: laburamos, en: "we work", f: 1pl.pres.ind}
          - {form: laburan, en: "they work", f: 3pl.pres.ind}
      - lemma: trabajar
        pos: verb
        en: "to work"
        forms:
