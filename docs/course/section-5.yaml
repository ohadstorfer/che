# ---------------------------------------------------------------------------
# Che — Section 5 outline: "When I was a kid" (A2.2)
#
# The second past. Section 4 taught what happened (fui, comí); this one teaches
# what was going on and what used to happen (era, iba, comíamos), and the story
# that needs both: "estaba lloviendo cuando llegué". Around it: the restaurant,
# arranging to meet the porteño way ("tipo ocho"), the holidays that fall in
# summer, feelings in the past, plans with "voy a", moving house, and the
# checkpoint — "¿te acordás cuando…?".
#
# Plan: docs/course/roadmap.md §Section 5. New feature tag: `impf`.
# An imperfect form that is the same word for yo and él/ella (era, tenía) is
# listed once, tagged `sg`, with both readings in its gloss.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 5
  slug: "when-i-was-a-kid"
  title: "Stories and going out"
  cefr: "A2.2"
  practice: 2
units:
  - ordinal: 1
    slug: "menos-mal"
    title: "Tell what happened to you"
    summary: "¿Qué te pasó?"
    grammar:
      - "repaso.preterito"
      - "relato.conectores"
    register_max: "informal"
    sample:
      es: "Perdí el bondi, así que llegué tarde."
      en: "I missed the bus, so I got there late."
    tips:
      - title: "Así que, por eso"
        body: "The story moves on with **así que** — *so* — and explains itself with **por eso** — *that's
          why*: **Perdí el bondi, así que llegué tarde.** **Llovió; por eso no fui.**"
      - title: "¡Menos mal!"
        body: "When the story ends well, the listener says **¡menos mal!** — *thank goodness!* — and **¡por
          fin!** when it took forever. **¿En serio?** keeps you talking: *really?*"
    words:
      - lemma: "contar"
        pos: "verb"
        en: "to tell; to count"
        forms:
          - form: "conté"
            en: "I told (a story)"
            f: "1sg.pret.ind"
          - form: "contaste"
            en: "you told (a story)"
            f: "2sg.pret.ind.vos"
          - form: "contó"
            en: "told (he/she told a story)"
            f: "3sg.pret.ind"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "me pasó"
            en: "happened to me"
            f: "3sg.pret.ind.clitic"
          - form: "te pasó"
            en: "happened to you"
            f: "3sg.pret.ind.clitic"
          - form: "le pasó"
            en: "happened to him, happened to her"
            f: "3sg.pret.ind.clitic"
      - lemma: "así que"
        pos: "phrase"
        en: "so (as a result)"
      - lemma: "por eso"
        pos: "phrase"
        en: "that's why"
      - lemma: "menos mal"
        pos: "phrase"
        en: "thank goodness"
      - lemma: "por fin"
        pos: "phrase"
        en: "finally, at last"
      - lemma: "en serio"
        pos: "phrase"
        en: "seriously, really"
      - lemma: "enseguida"
        pos: "adv"
        en: "straight away, in a minute"
      - lemma: "historia"
        pos: "noun"
        en: "story; history"
      - lemma: "un montón"
        pos: "phrase"
        en: "a lot"
      - lemma: "uy"
        pos: "interj"
        en: "oh no, whoa"
      - lemma: "no te puedo creer"
        pos: "phrase"
        en: "I can't believe it"
  - ordinal: 2
    slug: "contame"
    title: "Tell the whole story"
    summary: "Contame todo"
    grammar:
      - "repaso.preterito"
      - "relato.conectores"
    register_max: "informal"
    sample:
      es: "Contame qué pasó."
      en: "Tell me what happened."
    tips:
      - title: "How a porteño tells it"
        body: "**Contame** opens it; **de repente** is the twist, **por suerte** the relief, **al final**
          the end. **Igual** is *anyway*, *still*: *estoy cansada, pero igual voy*. **O sea** is *I
          mean* or *so*. **¿Qué contás?** is just a greeting: *what's new?*"
      - title: "¡Qué garrón!"
        body: "When the story ends badly, the answer is **¡Qué garrón!** — *how annoying!* Informal, and
          everywhere."
    words:
      - lemma: "contar"
        pos: "verb"
        en: "to tell"
        forms:
          - form: "contame"
            en: "tell me"
            f: "2sg.imp.vos.clitic"
          - form: "contás"
            en: "you tell"
            f: "2sg.pres.ind.vos"
          - form: "cuento"
            en: "I tell"
            f: "1sg.pres.ind.irregular"
      - lemma: "de repente"
        pos: "phrase"
        en: "suddenly"
      - lemma: "por suerte"
        pos: "phrase"
        en: "luckily"
      - lemma: "igual"
        pos: "adv"
        en: "anyway; the same"
      - lemma: "o sea"
        pos: "phrase"
        en: "I mean"
      - lemma: "garrón"
        pos: "noun"
        en: "annoying situation, bad luck"
        register: "informal"
      - lemma: "además"
        pos: "adv"
        en: "besides, as well"
      - lemma: "chiste"
        pos: "noun"
        en: "joke"
        forms:
          - form: "chiste"
            f: "m.sg"
          - form: "chistes"
            en: "jokes"
            f: "m.pl"
      - lemma: "gracioso"
        pos: "adj"
        en: "amusing, funny (a joke)"
        forms:
          - form: "gracioso"
            f: "m.sg"
          - form: "graciosa"
            f: "f.sg"
      - lemma: "reírse"
        pos: "verb"
        en: "to laugh"
        forms:
          - form: "me reí"
            en: "I laughed"
            f: "1sg.pret.ind.clitic"
          - form: "reí"
            f: "1sg.pret.ind"
            bound: true
          - form: "nos reímos"
            en: "we laugh, we laughed"
            f: "1pl.pres.ind.clitic"
          - form: "reímos"
            f: "1pl.pres.ind"
            bound: true
  - ordinal: 3
    slug: "cuando-era-chico"
    title: "Talk about when you were a kid"
    summary: "Cuando era chico"
    grammar:
      - "imperfecto.ser-tener-vivir-ir"
      - "cuando"
      - "de-chico"
    register_max: "informal"
    sample:
      es: "Cuando era chico vivía en Rosario."
      en: "When I was a kid I lived in Rosario."
    tips:
      - title: "The past that describes"
        body: "The preterite says what happened; the **imperfect** says what things were like: **era** (I
          was / he was), **tenía** (I had), **vivía** (I lived), **iba** (I went, I used to go).
          *Cuando era chico vivía en Rosario* — both verbs describe, nothing *happens*."
      - title: "Yo and él share a form"
        body: "In the imperfect, *yo* and *él/ella* are the same word: **era** is *I was* and *he was*. The
          subject — or the story — tells you which. **De chico** is *as a kid*."
      - title: "Colegio"
        body: "Porteños mostly say **colegio** for school, primary or secondary: **¿A qué colegio ibas?** —
          *Iba a un colegio de mi barrio.* *Escuela* is understood and used too, mostly for state
          primary schools."
    words:
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "era"
            en: "was"
            f: "sg.impf.ind.irregular"
          - form: "eras"
            en: "you were"
            f: "2sg.impf.ind.vos.irregular"
          - form: "éramos"
            en: "we were"
            f: "1pl.impf.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenía"
            en: "had"
            f: "sg.impf.ind"
          - form: "tenías"
            en: "you had"
            f: "2sg.impf.ind.vos"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "vivía"
            en: "lived"
            f: "sg.impf.ind"
          - form: "vivías"
            en: "you lived"
            f: "2sg.impf.ind.vos"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "iba"
            en: "went, used to go"
            f: "sg.impf.ind.irregular"
          - form: "ibas"
            en: "you went, you used to go"
            f: "2sg.impf.ind.vos.irregular"
          - form: "íbamos"
            en: "we went, we used to go"
            f: "1pl.impf.ind.irregular"
      - lemma: "cuando"
        pos: "conj"
        en: "when"
      - lemma: "de chico"
        pos: "phrase"
        en: "as a kid"
      - lemma: "escuela"
        pos: "noun"
        forms:
          - form: "escuelas"
            en: "schools"
            f: "f.pl"
      - lemma: "colegio"
        pos: "noun"
        en: "school"
        note: "what porteños usually call any school, primary or secondary"
  - ordinal: 4
    slug: "en-la-primaria"
    title: "Talk about your school days"
    summary: "En la primaria quería ser maestra"
    grammar:
      - "imperfecto.ser-tener-vivir-ir"
      - "cuando"
      - "de-chico"
      - "imperfecto.plural"
    register_max: "informal"
    sample:
      es: "En la primaria quería ser maestra."
      en: "In primary school I wanted to be a teacher."
    tips:
      - title: "They and we"
        body: "For *ellos* and *ustedes* the imperfect just adds an **-n**: **eran**, **tenían**,
          **vivían**, **iban**. For *nosotros* it's **-íamos**: **teníamos**, **vivíamos**. *Mis
          abuelos vivían en el campo y nosotros íbamos en enero.*"
      - title: "Quería, podía"
        body: "Wanting and being able are states, so back then they take the imperfect: **De chico quería
          ser maestro** — *as a kid I wanted to be a teacher*; **no podía salir solo** — *I wasn't
          allowed out on my own*. **En esa época** — *back then* — sets the whole scene. At a
          counter, **quería un cortado** is just a polite *I'd like a cortado*. With a person,
          **querer a** is *to love*: *quería mucho a mi maestra*."
      - title: "La primaria"
        body: "School here is **la primaria** (six to twelve) and then **la secundaria**. In a state primary
          school everyone wears a white **guardapolvo** over their clothes, and the best part of the
          day is the **recreo**. In primaria the teacher is **la maestra** or **el maestro**; from
          secundaria on it is **el profesor**, **la profe**. Each year of primaria is a **grado**:
          *primer grado*."
    words:
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "eran"
            en: "they were"
            f: "3pl.impf.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenían"
            en: "they had, you guys had"
            f: "3pl.impf.ind"
          - form: "teníamos"
            en: "we had"
            f: "1pl.impf.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "vivían"
            en: "they lived"
            f: "3pl.impf.ind"
          - form: "vivíamos"
            en: "we lived"
            f: "1pl.impf.ind"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "iban"
            en: "they went, they used to go"
            f: "3pl.impf.ind.irregular"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quería"
            en: "I wanted, he wanted, she wanted"
            f: "sg.impf.ind"
          - form: "querías"
            en: "you wanted"
            f: "2sg.impf.ind.vos"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "podía"
            en: "I could, he could, she could"
            f: "sg.impf.ind"
          - form: "podíamos"
            en: "we could"
            f: "1pl.impf.ind"
      - lemma: "primaria"
        pos: "noun"
        en: "primary school"
      - lemma: "secundaria"
        pos: "noun"
        en: "high school"
      - lemma: "maestro"
        pos: "noun"
        en: "teacher, schoolteacher"
        forms:
          - form: "maestro"
            f: "m.sg"
          - form: "maestra"
            f: "f.sg"
      - lemma: "recreo"
        pos: "noun"
        en: "break, recess"
      - lemma: "guardapolvo"
        pos: "noun"
        en: "school smock"
        note: "The white smock kids wear over their clothes in Argentine public schools."
      - lemma: "época"
        pos: "noun"
        en: "time, era"
  - ordinal: 5
    slug: "siempre-jugabamos"
    title: "Say what you used to do"
    summary: "Siempre jugábamos"
    grammar:
      - "imperfecto.regular"
      - "habitos.pasado"
      - "a-veces"
    register_max: "informal"
    sample:
      es: "De chico jugaba al fútbol todos los sábados."
      en: "As a kid I played football every Saturday."
    tips:
      - title: "-aba and -ía"
        body: "Regular verbs make the imperfect with **-aba** (*jugaba, laburaba*) or **-ía** (*comía,
          salía*). Only *nosotros* takes an accent: **jugábamos**, **salíamos**."
      - title: "Used to"
        body: "Where English says *used to*, Spanish just uses the imperfect: **Siempre tomaba mate con mi
          abuela** — *I always used to have mate with my grandma*."
    words:
      - lemma: "jugar"
        pos: "verb"
        forms:
          - form: "jugaba"
            en: "played, used to play"
            f: "sg.impf.ind"
          - form: "jugabas"
            en: "you played, you used to play"
            f: "2sg.impf.ind.vos"
          - form: "jugábamos"
            en: "we played, we used to play"
            f: "1pl.impf.ind"
      - lemma: "laburar"
        pos: "verb"
        forms:
          - form: "laburaba"
            en: "worked, used to work"
            f: "sg.impf.ind"
      - lemma: "tomar"
        pos: "verb"
        forms:
          - form: "tomaba"
            en: "drank, used to drink"
            f: "sg.impf.ind"
            note: "tomar also means 'to take' (a bus, a train, a pill). Never use coger for 'take': it
              is vulgar here."
          - form: "tomábamos"
            en: "we drank, we used to drink"
            f: "1pl.impf.ind"
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "comía"
            en: "ate, used to eat"
            f: "sg.impf.ind"
          - form: "comías"
            en: "you ate, you used to eat"
            f: "2sg.impf.ind.vos"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salía"
            en: "went out, used to go out"
            f: "sg.impf.ind"
          - form: "salíamos"
            en: "we went out, we used to go out"
            f: "1pl.impf.ind"
      - lemma: "cada"
        pos: "det"
        en: "every, each"
        glue: true
  - ordinal: 6
    slug: "me-encantaba"
    title: "Say what you loved as a kid"
    summary: "Me encantaba andar en bici"
    grammar:
      - "imperfecto.regular"
      - "habitos.pasado"
      - "a-veces"
      - "antes-ahora"
    register_max: "informal"
    sample:
      es: "De chico me encantaba andar en bici."
      en: "As a kid I loved riding my bike."
    tips:
      - title: "Me gustaba, me encantaba"
        body: "In the past, *gustar* and *encantar* work like any -ar verb: **me gustaba**, **me encantaba**
          — *I liked*, *I loved*. Several things take an **-n**: **me gustaban los dibujitos**. The
          same **-n** makes the *they* form of any verb: **los pibes jugaban a la pelota en la
          vereda**."
      - title: "Ver keeps its e"
        body: "Only three verbs break the pattern: *ser* (**era**), *ir* (**iba**) and *ver*, which keeps
          its *e*: **veía**, **veías**. Set **antes** against **ahora** and the imperfect does the
          rest: *antes veía dibujitos, ahora veo series.*"
    words:
      - lemma: "gustar"
        pos: "verb"
        forms:
          - form: "gustaba"
            en: "liked (one thing)"
            f: "3sg.impf.ind"
          - form: "gustaban"
            en: "liked (several things)"
            f: "3pl.impf.ind"
      - lemma: "encantar"
        pos: "verb"
        forms:
          - form: "encantaba"
            en: "loved (one thing)"
            f: "3sg.impf.ind"
      - lemma: "mirar"
        pos: "verb"
        forms:
          - form: "miraba"
            en: "watched, used to watch"
            f: "sg.impf.ind"
          - form: "mirábamos"
            en: "we used to watch"
            f: "1pl.impf.ind"
      - lemma: "andar"
        pos: "verb"
        forms:
          - form: "andar"
            en: "to ride, to go around"
            f: "inf"
          - form: "andaba"
            en: "was working (it); was (lately); rode, used to ride"
            f: "sg.impf.ind"
      - lemma: "bici"
        pos: "noun"
        en: "bike"
        forms:
          - form: "bici"
            f: "f.sg"
          - form: "bicis"
            en: "bikes"
            f: "f.pl"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "veía"
            en: "saw, used to see"
            f: "sg.impf.ind.irregular"
          - form: "veías"
            en: "you saw, you used to see"
            f: "2sg.impf.ind.vos.irregular"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasábamos"
            en: "we spent (time), we used to spend"
            f: "1pl.impf.ind"
      - lemma: "dormir"
        pos: "verb"
        forms:
          - form: "dormía"
            en: "slept, used to sleep"
            f: "sg.impf.ind"
      - lemma: "jugar"
        pos: "verb"
        forms:
          - form: "jugaban"
            en: "they played, they used to play"
            f: "3pl.impf.ind"
      - lemma: "dibujitos"
        pos: "noun"
        en: "cartoons"
      - lemma: "pelota"
        pos: "noun"
        en: "ball"
      - lemma: "escondidas"
        pos: "noun"
        en: "hide-and-seek"
      - lemma: "hamaca"
        pos: "noun"
        en: "swing"
        note: "In Argentina a hamaca is a swing; a hammock is a hamaca paraguaya."
  - ordinal: 7
    slug: "estaba-lloviendo"
    title: "Set the scene of a story"
    summary: "Estaba lloviendo cuando…"
    grammar:
      - "imperfecto.escena"
      - "imperfecto-vs-preterito"
      - "mientras"
    register_max: "informal"
    sample:
      es: "Estaba lloviendo cuando llegué."
      en: "It was raining when I got there."
    tips:
      - title: "The scene and the event"
        body: "The imperfect paints the scene, the preterite is what happens in it: **Estaba en el subte
          cuando me llamó Sofi** — *I was on the subway when Sofi called me*."
      - title: "Había, hacía"
        body: "**Había** is *there was, there were*; **hacía calor** is *it was hot*. **Estaba lloviendo** —
          *it was raining* — puts you in the middle of it; **llovía** says the same, and can also
          mean *it used to rain*. **Mientras** — *while* — joins two things going on at once."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estaba"
            en: "was"
            f: "sg.impf.ind"
          - form: "estabas"
            en: "you were"
            f: "2sg.impf.ind.vos"
          - form: "estábamos"
            en: "we were"
            f: "1pl.impf.ind"
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "había"
            en: "there was, there were"
            f: "3sg.impf.ind"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hacía"
            en: "I used to do/make, he/she used to do/make; it was (weather)"
            f: "3sg.impf.ind"
      - lemma: "llover"
        pos: "verb"
        forms:
          - form: "llovía"
            en: "it was raining"
            f: "3sg.impf.ind"
          - form: "lloviendo"
            en: "raining"
            f: "ger"
      - lemma: "mientras"
        pos: "conj"
        en: "while"
      - lemma: "vacío"
        pos: "adj"
        en: "empty"
        forms:
          - form: "vacío"
            f: "m.sg"
          - form: "vacía"
            f: "f.sg"
  - ordinal: 8
    slug: "sono-el-timbre"
    title: "Tell what interrupted you"
    summary: "Estaba en la ducha cuando sonó el timbre"
    grammar:
      - "imperfecto.escena"
      - "imperfecto-vs-preterito"
      - "mientras"
      - "estaba-gerundio"
    register_max: "informal"
    sample:
      es: "Estaba en la ducha cuando sonó el timbre."
      en: "I was in the shower when the doorbell rang."
    tips:
      - title: "Right in the middle"
        body: "**Estaba** + *-ando, -iendo* puts you in the middle of something: **estaba durmiendo**,
          **estábamos cocinando**. Then the preterite cuts in: **cuando sonó el celu**, **cuando
          entró Juan**."
      - title: "Era la una, eran las tres"
        body: "The time in a story is always imperfect: **era la una**, **eran las tres**. The scene keeps
          going — **no había luz**, **hacía un calor bárbaro** — until something happens: **empezó a
          llover** and **llegué mojado**."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estaban"
            en: "they were"
            f: "3pl.impf.ind"
      - lemma: "sonar"
        pos: "verb"
        en: "to ring, to go off"
        forms:
          - form: "sonó"
            en: "rang, went off"
            f: "3sg.pret.ind"
          - form: "sonaba"
            en: "was ringing"
            f: "3sg.impf.ind"
          - form: "sonar"
            f: "inf"
      - lemma: "entrar"
        pos: "verb"
        en: "to go in, to come in"
        forms:
          - form: "entré"
            en: "I went in, I came in"
            f: "1sg.pret.ind"
          - form: "entró"
            en: "went in, came in (he/she)"
            f: "3sg.pret.ind"
          - form: "entrar"
            f: "inf"
      - lemma: "empezar"
        pos: "verb"
        forms:
          - form: "empezó"
            en: "started (he/she/it started)"
            f: "3sg.pret.ind"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volvía"
            en: "was coming back, used to come back"
            f: "sg.impf.ind"
      - lemma: "caminar"
        pos: "verb"
        forms:
          - form: "caminaba"
