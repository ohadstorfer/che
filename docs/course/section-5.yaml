        en: "medium (meat)"
  - ordinal: 16
    slug: "la-parrillada"
    title: "Share a parrillada"
    summary: "Una parrillada para dos"
    grammar:
      - "comida.parrilla"
    register_max: "informal"
    sample:
      es: "Una parrillada para dos, con chimichurri."
      en: "A mixed grill for two, with chimichurri."
    tips:
      - title: "La parrillada"
        body: "For the table there's the **parrillada** — *a mixed grill* on its own little grill: chorizo,
          morcilla, **mollejas** — *sweetbreads: a soft gland, not bread* — **chinchulines** and a
          **tira de asado**. On your own: a **bife de chorizo** or an **entraña**. The classic start
          is a **provoleta para compartir**; the prized cuts are **ojo de bife** and **lomo**, with
          *papas fritas* or *ensalada* on the side."
      - title: "¿Y la salsa?"
        body: "On the table: **chimichurri** — oil, garlic, parsley, chili — and **salsa criolla** — onion,
          tomato, pepper. Ketchup is a crime. The meat is cooked **a la leña** at the good places."
      - title: "Bien cocido"
        body: "A bife comes jugoso, a punto, or **bien cocido** — *well done*; **vuelta y vuelta** is seared
          on each side and almost raw inside. The bill has a line for the **cubierto** — *the cover
          charge*: the bread and the cutlery."
    words:
