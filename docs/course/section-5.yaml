  - ordinal: 9
    slug: "practica-en-esa-epoca"
    title: "Practice: back in the day"
    summary: "En esa época íbamos a la plaza"
    grammar:
      - "repaso.imperfecto"
      - "imperfecto-vs-preterito"
    register_max: "informal"
    sample:
      es: "En esa época vivíamos en Rosario y me encantaba la escuela."
      en: "Back then we lived in Rosario and I loved school."
    tips:
      - title: "Everyone, back then"
        body: "**Era, eras, éramos, eran**; **tenía, tenías, teníamos, tenían**; **jugaba, jugabas,
          jugábamos, jugaban**. One set of endings for *-ar*, one for *-er* and *-ir*, and *yo* and
          *él* always share."
      - title: "The scene, then the event"
        body: "**Estaba en la ducha** — the scene; **cuando sonó el timbre** — the event. If you could add
          *was …-ing* or *used to* in English, it's the imperfect; if it happened once and ended,
          it's the preterite."
    review:
      - "tenían"
      - "iban"
      - "quería"
      - "podía"
