      - "íbamos"
  - ordinal: 10
    slug: "el-partido"
    title: "Talk about soccer"
    summary: "¿Viste el partido?"
    grammar:
      - "deportes"
      - "preterito.ganar-perder"
    register_max: "informal"
    sample:
      es: "Ganamos dos a uno, ¡qué partido!"
      en: "We won two–one, what a game!"
    tips:
      - title: "Ganamos, perdimos"
        body: "After a game it's **ganamos**, **perdimos** or **empatamos** — *we* won, even if you were on
          the sofa. Fans always talk as part of the team: *Anoche ganamos tres a uno.*"
      - title: "El hincha"
        body: "A fan is **un hincha** or **una hincha**: the word is the same for a man or a woman. Say who
          you support with **ser hincha de**: *Mi papá es re hincha de la selección* — my dad is a
          huge fan of the national team."
      - title: "Dos a uno"
        body: "Scores are said with **a**: **ganamos dos a uno**, *empatamos cero a cero*. To score is
          **hacer un gol**: *Juan hizo dos goles*. And the pitch — and the whole stadium — is **la
          cancha**."
