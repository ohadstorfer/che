    tips:
      - title: "Me olvidé de…"
        body: "**Me olvidé de su cumple** — *I forgot his birthday*. Like *me enojé* it keeps its pronoun,
          and takes **de** before what you forgot. Left something behind? No *de*: **me olvidé las
          llaves en casa**. For the others: **¿te olvidaste las llaves?**, **se olvidó de llamar**,
          **nos olvidamos de reservar**. Same shape: **me aburrí**, **me calmé**, **me enamoré** —
          of Buenos Aires, of course."
      - title: "Estaba or me puse?"
        body: "**Estaba nervioso** is how you were; **me puse nervioso** is the moment it hit you. **Me
          sentí re mal** — *I felt awful* — is one moment too. For *us*: **nos pusimos contentos**;
          and **me puse colorado** is *I blushed*. About someone else: **¿cómo se sintió tu
          vieja?**"
