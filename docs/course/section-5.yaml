# ---------------------------------------------------------------------------
# Che — Section 5 outline: "When I was a kid" (A2.2)
#
# The second past. Section 4 taught what happened (fui, comí); this one teaches
# what was going on and what used to happen (era, iba, comíamos), and the story
# that needs both: "estaba lloviendo cuando llegué". Around it: the restaurant,
# arranging to meet the porteño way ("tipo ocho"), the holidays that fall in
# summer, feelings in the past, plans with "voy a", moving house, and the
# checkpoint — "¿te acordás cuando…?".
#
# Plan: docs/course/roadmap.md §Section 5. New feature tag: `impf`.
# An imperfect form that is the same word for yo and él/ella (era, tenía) is
# listed once, tagged `sg`, with both readings in its gloss.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 5
  slug: "when-i-was-a-kid"
  title: "When I was a kid"
  cefr: "A2.2"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "cuando-era-chico"
    title: "Talk about when you were a kid"
    summary: "Cuando era chico"
    grammar:
      - "imperfecto.ser-tener-vivir-ir"
      - "cuando"
      - "de-chico"
    register_max: "informal"
    sample:
      es: "Cuando era chico vivía en Rosario."
      en: "When I was a kid I lived in Rosario."
    tips:
      - title: "The past that describes"
        body: "The preterite says what happened; the **imperfect** says what things were like: **era**
          (I was / he was), **tenía** (I had), **vivía** (I lived), **iba** (I went, I used to go).
          *Cuando era chico vivía en Rosario* — both verbs describe, nothing *happens*."
      - title: "Yo and él share a form"
        body: "In the imperfect, *yo* and *él/ella* are the same word: **era** is *I was* and *he was*.
          The subject — or the story — tells you which. **De chico** is *as a kid*."
    words:
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "era"
            en: "was"
            f: "sg.impf.ind.irregular"
          - form: "eras"
            en: "you were"
            f: "2sg.impf.ind.vos.irregular"
          - form: "éramos"
            en: "we were"
            f: "1pl.impf.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenía"
            en: "had"
            f: "sg.impf.ind"
          - form: "tenías"
            en: "you had"
            f: "2sg.impf.ind.vos"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "vivía"
            en: "lived"
            f: "sg.impf.ind"
          - form: "vivías"
            en: "you lived"
            f: "2sg.impf.ind.vos"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "iba"
            en: "went, used to go"
            f: "sg.impf.ind.irregular"
          - form: "ibas"
            en: "you went, you used to go"
            f: "2sg.impf.ind.vos.irregular"
          - form: "íbamos"
            en: "we went, we used to go"
            f: "1pl.impf.ind.irregular"
      - lemma: "cuando"
        pos: "conj"
        en: "when"
      - lemma: "de chico"
        pos: "phrase"
        en: "as a kid"
      - lemma: "escuela"
        pos: "noun"
        forms:
          - form: "escuelas"
            en: "schools"
            f: "f.pl"

  - ordinal: 2
    slug: "en-la-primaria"
    title: "Talk about your school days"
    summary: "En la primaria quería ser maestra"
    grammar:
      - "imperfecto.ser-tener-vivir-ir"
      - "cuando"
      - "de-chico"
      - "imperfecto.plural"
    register_max: "informal"
    sample:
      es: "En la primaria quería ser maestra."
      en: "In primary school I wanted to be a teacher."
    tips:
      - title: "They and we"
        body: "For *ellos* and *ustedes* the imperfect just adds an **-n**: **eran**, **tenían**,
          **vivían**, **iban**. For *nosotros* it's **-íamos**: **teníamos**, **vivíamos**. *Mis
          abuelos vivían en el campo y nosotros íbamos en enero.*"
      - title: "Quería, podía"
        body: "Wanting and being able are states, so back then they take the imperfect: **De chico
          quería ser maestro** — *as a kid I wanted to be a teacher*; **no podía salir solo** — *I
          wasn't allowed out on my own*. **En esa época** — *back then* — sets the whole scene."
      - title: "La primaria"
        body: "School here is **la primaria** (six to twelve) and then **la secundaria**. In a state
          school everyone wears a white **guardapolvo** over their clothes, and the best part of the
          day is the **recreo**."
    words:
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "eran"
            en: "they were"
            f: "3pl.impf.ind.irregular"
          - form: "ser"
            en: "to be"
            f: "inf"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenían"
            en: "they had"
            f: "3pl.impf.ind"
          - form: "teníamos"
            en: "we had"
            f: "1pl.impf.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "vivían"
            en: "they lived"
            f: "3pl.impf.ind"
          - form: "vivíamos"
            en: "we lived"
            f: "1pl.impf.ind"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "iban"
            en: "they went, they used to go"
            f: "3pl.impf.ind.irregular"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quería"
            en: "I wanted, he wanted, she wanted"
            f: "sg.impf.ind"
          - form: "querías"
            en: "you wanted"
            f: "2sg.impf.ind.vos"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "podía"
            en: "I could, he could, she could"
            f: "sg.impf.ind"
          - form: "podíamos"
            en: "we could"
            f: "1pl.impf.ind"
      - lemma: "primaria"
        pos: "noun"
        en: "primary school"
      - lemma: "secundaria"
        pos: "noun"
        en: "high school"
      - lemma: "maestro"
        pos: "noun"
        en: "schoolteacher"
        forms:
          - form: "maestro"
            f: "m.sg"
          - form: "maestra"
            f: "f.sg"
      - lemma: "recreo"
        pos: "noun"
        en: "break, recess"
      - lemma: "guardapolvo"
        pos: "noun"
        en: "school smock"
      - lemma: "época"
        pos: "noun"
        en: "era, period"

  - ordinal: 3
    slug: "siempre-jugabamos"
    title: "Say what you used to do"
    summary: "Siempre jugábamos"
    grammar:
      - "imperfecto.regular"
      - "habitos.pasado"
      - "a-veces"
    register_max: "informal"
    sample:
      es: "De chico jugaba al fútbol todos los sábados."
      en: "As a kid I played football every Saturday."
    tips:
      - title: "-aba and -ía"
        body: "Regular verbs make the imperfect with **-aba** (*jugaba, laburaba*) or **-ía** (*comía,
          salía*). Only *nosotros* takes an accent: **jugábamos**, **salíamos**."
      - title: "Used to"
        body: "Where English says *used to*, Spanish just uses the imperfect: **Siempre tomaba mate con
          mi abuela** — *I always used to have mate with my grandma*."
    words:
      - lemma: "jugar"
        pos: "verb"
        forms:
          - form: "jugaba"
            en: "played, used to play"
            f: "sg.impf.ind"
          - form: "jugabas"
            en: "you played, you used to play"
            f: "2sg.impf.ind.vos"
          - form: "jugábamos"
            en: "we played, we used to play"
            f: "1pl.impf.ind"
      - lemma: "laburar"
        pos: "verb"
        forms:
          - form: "laburaba"
            en: "worked, used to work"
            f: "sg.impf.ind"
      - lemma: "tomar"
        pos: "verb"
        forms:
          - form: "tomaba"
            en: "drank, used to drink"
            f: "sg.impf.ind"
          - form: "tomábamos"
            en: "we drank, we used to drink"
            f: "1pl.impf.ind"
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "comía"
            en: "ate, used to eat"
            f: "sg.impf.ind"
          - form: "comías"
            en: "you ate, you used to eat"
            f: "2sg.impf.ind.vos"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salía"
            en: "went out, used to go out"
            f: "sg.impf.ind"
          - form: "salíamos"
            en: "we went out, we used to go out"
            f: "1pl.impf.ind"
      - lemma: "cada"
        pos: "det"
        en: "every, each"
        glue: true

  - ordinal: 4
    slug: "me-encantaba"
    title: "Say what you loved as a kid"
    summary: "Me encantaba andar en bici"
    grammar:
      - "imperfecto.regular"
      - "habitos.pasado"
      - "a-veces"
      - "antes-ahora"
    register_max: "informal"
    sample:
      es: "De chico me encantaba andar en bici."
      en: "As a kid I loved riding my bike."
    tips:
      - title: "Me gustaba, me encantaba"
        body: "*Gustar* and *encantar* go back like any -ar verb: **me gustaba**, **me encantaba** —
          *I liked*, *I loved*. Several things take an **-n**: **me gustaban los dibujitos**. *Ellos*
          too: **los pibes jugaban a la pelota en la vereda**."
      - title: "Ver keeps its e"
        body: "Only three verbs break the pattern: *ser* (**era**), *ir* (**iba**) and *ver*, which
          keeps its *e*: **veía**, **veías**. Set **antes** against **ahora** and the imperfect does
          the rest: *antes veía dibujitos, ahora veo series.*"
    words:
      - lemma: "gustar"
        pos: "verb"
        forms:
          - form: "gustaba"
            en: "liked (one thing)"
            f: "3sg.impf.ind"
          - form: "gustaban"
            en: "liked (several things)"
            f: "3pl.impf.ind"
      - lemma: "encantar"
        pos: "verb"
        forms:
          - form: "encantaba"
            en: "loved (one thing)"
            f: "3sg.impf.ind"
      - lemma: "mirar"
        pos: "verb"
        forms:
          - form: "miraba"
            en: "watched, used to watch"
            f: "sg.impf.ind"
          - form: "mirábamos"
            en: "we used to watch"
            f: "1pl.impf.ind"
      - lemma: "andar"
        pos: "verb"
        forms:
          - form: "andar"
            en: "to ride, to go around"
            f: "inf"
          - form: "andaba"
            en: "rode, used to ride, went around"
            f: "sg.impf.ind"
      - lemma: "bici"
        pos: "noun"
        en: "bike"
        forms:
          - form: "bici"
            f: "f.sg"
          - form: "bicis"
            f: "f.pl"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "veía"
            en: "saw, used to see"
            f: "sg.impf.ind.irregular"
          - form: "veías"
            en: "you saw, you used to see"
            f: "2sg.impf.ind.vos.irregular"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasábamos"
            en: "we spent (time), we used to spend"
            f: "1pl.impf.ind"
      - lemma: "dormir"
        pos: "verb"
        forms:
          - form: "dormía"
            en: "slept, used to sleep"
            f: "sg.impf.ind"
      - lemma: "jugar"
        pos: "verb"
        forms:
          - form: "jugaban"
            en: "they played, they used to play"
            f: "3pl.impf.ind"
      - lemma: "dibujitos"
        pos: "noun"
        en: "cartoons"
      - lemma: "pelota"
        pos: "noun"
        en: "ball"
      - lemma: "escondidas"
        pos: "noun"
        en: "hide-and-seek"
      - lemma: "hamaca"
        pos: "noun"
        en: "swing"

  - ordinal: 5
    slug: "estaba-lloviendo"
    title: "Set the scene of a story"
    summary: "Estaba lloviendo cuando…"
    grammar:
      - "imperfecto.escena"
      - "imperfecto-vs-preterito"
      - "mientras"
    register_max: "informal"
    sample:
      es: "Estaba lloviendo cuando llegué."
      en: "It was raining when I got there."
    tips:
      - title: "The scene and the event"
        body: "The imperfect paints the scene, the preterite is what happens in it: **Estaba en el
          subte cuando me llamó Sofi** — *I was on the subway when Sofi called me*."
      - title: "Había, hacía"
        body: "**Había** is *there was, there were*; **hacía calor** is *it was hot*. **Mientras** —
          *while* — joins two things going on at once."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estaba"
            en: "was"
            f: "sg.impf.ind"
          - form: "estabas"
            en: "you were"
            f: "2sg.impf.ind.vos"
          - form: "estábamos"
            en: "we were"
            f: "1pl.impf.ind"
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "había"
            en: "there was, there were"
            f: "3sg.impf.ind"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hacía"
            en: "it was (weather)"
            f: "3sg.impf.ind"
      - lemma: "llover"
        pos: "verb"
        forms:
          - form: "llovía"
            en: "it was raining"
            f: "3sg.impf.ind"
          - form: "lloviendo"
            en: "raining"
            f: "ger"
      - lemma: "mientras"
        pos: "conj"
        en: "while"

  - ordinal: 6
    slug: "sono-el-timbre"
    title: "Tell what interrupted you"
    summary: "Estaba en la ducha cuando sonó el timbre"
    grammar:
      - "imperfecto.escena"
      - "imperfecto-vs-preterito"
      - "mientras"
      - "estaba-gerundio"
    register_max: "informal"
    sample:
      es: "Estaba en la ducha cuando sonó el timbre."
      en: "I was in the shower when the doorbell rang."
    tips:
      - title: "Right in the middle"
        body: "**Estaba** + *-ando, -iendo* puts you in the middle of something: **estaba durmiendo**,
          **estábamos cocinando**. Then the preterite cuts in: **cuando sonó el celu**, **cuando entró
          Juan**."
      - title: "Era la una, eran las tres"
        body: "The time in a story is always imperfect: **era la una**, **eran las tres**. The scene
          keeps going — **no había luz**, **hacía un calor bárbaro** — until something happens:
          **empezó a llover** and **llegué mojado**."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estaban"
            en: "they were"
            f: "3pl.impf.ind"
      - lemma: "sonar"
        pos: "verb"
        en: "to ring, to go off"
        forms:
          - form: "sonó"
            en: "rang, went off"
            f: "3sg.pret.ind"
          - form: "sonaba"
            en: "was ringing"
            f: "3sg.impf.ind"
      - lemma: "entrar"
        pos: "verb"
        en: "to go in, to come in"
        forms:
          - form: "entré"
            en: "I went in, I came in"
            f: "1sg.pret.ind"
          - form: "entró"
            en: "went in, came in (he/she)"
            f: "3sg.pret.ind"
          - form: "entrar"
            f: "inf"
      - lemma: "empezar"
        pos: "verb"
        forms:
          - form: "empezó"
            en: "started (he/she/it started)"
            f: "3sg.pret.ind"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volvía"
            en: "was coming back, used to come back"
            f: "sg.impf.ind"
      - lemma: "caminar"
        pos: "verb"
        forms:
          - form: "caminaba"
            en: "was walking, used to walk"
            f: "sg.impf.ind"
      - lemma: "cocinar"
        pos: "verb"
        forms:
          - form: "cocinaba"
            en: "was cooking, used to cook"
            f: "sg.impf.ind"
      - lemma: "luz"
        pos: "noun"
        en: "power, electricity, light"
      - lemma: "ducha"
        pos: "noun"
        en: "shower"
      - lemma: "mojado"
        pos: "adj"
        en: "wet"
        forms:
          - form: "mojado"
            f: "m.sg"
          - form: "mojada"
            f: "f.sg"

  - ordinal: 7
    slug: "practica-de-chico"
    title: "Practice: back then"
    summary: "De chico jugaba en la calle"
    grammar:
      - "repaso.imperfecto"
      - "imperfecto-vs-preterito"
    register_max: "informal"
    sample:
      es: "De chico vivía en Rosario y jugaba en la plaza."
      en: "As a kid I lived in Rosario and played in the park."
    tips:
      - title: "The scene and the event"
        body: "**Era**, **tenía**, **estaba** paint the scene — how things were. **Fui**, **tuve**, **llegó** are what happened in it. **Estaba lloviendo cuando llegó Juan.**"
      - title: "Used to"
        body: "English says *used to*; Spanish just uses the imperfect. **Jugábamos en la calle** — *we used to play in the street*. **Siempre**, **a veces** and **de chico** go with it."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "era"
      - "tenía"
      - "vivía"
      - "iba"
      - "jugaba"
      - "jugábamos"
      - "comía"
      - "salía"
      - "estaba"
      - "llovía"
      - "fui"
      - "tuve"
      - "llegó"

  - ordinal: 8
    slug: "practica-en-esa-epoca"
    title: "Practice: back in the day"
    summary: "En esa época íbamos a la plaza"
    grammar:
      - "repaso.imperfecto"
      - "imperfecto-vs-preterito"
    register_max: "informal"
    sample:
      es: "En esa época vivíamos en Rosario y me encantaba la escuela."
      en: "Back then we lived in Rosario and I loved school."
    tips:
      - title: "Everyone, back then"
        body: "**Era, eras, éramos, eran**; **tenía, tenías, teníamos, tenían**; **jugaba, jugabas,
          jugábamos, jugaban**. One set of endings for *-ar*, one for *-er* and *-ir*, and *yo* and
          *él* always share."
      - title: "The scene, then the event"
        body: "**Estaba en la ducha** — the scene; **cuando sonó el timbre** — the event. If you could
          add *was …-ing* or *used to* in English, it's the imperfect; if it happened once and ended,
          it's the preterite."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "tenían"
      - "iban"
      - "quería"
      - "podía"
      - "gustaba"
      - "veía"
      - "estaban"
      - "sonó"
      - "volvía"
      - "fuimos"
      - "llegué"
      - "vino/venir"
      - "dijo"

  - ordinal: 9
    slug: "en-el-restaurante"
    title: "Eat out"
    summary: "¿Me traés la carta?"
    grammar:
      - "pedir.pres-pret"
      - "restaurante"
    register_max: "informal"
    sample:
      es: "Pedí un bife con papas fritas."
      en: "I ordered a steak with fries."
    tips:
      - title: "Pedir"
        body: "**Pido** (I order), **pedís** (you order); in the past **pedí**, **pediste**, and — with
          an *i* — **pidió**. At the table: **¿Me traés la carta?** and, at the end, **la cuenta**."
      - title: "Propina"
        body: "The tip is **la propina**, usually ten per cent and in cash. **¿Compartimos?** — *shall we
          share?* — is how two people order one enormous *bife*."
    words:
      - lemma: "pedir"
        pos: "verb"
        en: "to order, to ask for"
        forms:
          - form: "pido"
            en: "I order, I ask for"
            f: "1sg.pres.ind.irregular"
          - form: "pedís"
            en: "you order, you ask for"
            f: "2sg.pres.ind.vos"
          - form: "pedí"
            en: "I ordered, I asked for"
            f: "1sg.pret.ind"
          - form: "pediste"
            en: "you ordered, you asked for"
            f: "2sg.pret.ind.vos"
          - form: "pidió"
            en: "ordered, asked (he/she)"
            f: "3sg.pret.ind.irregular"
          - form: "pedir"
            f: "inf"
      - lemma: "compartir"
        pos: "verb"
        forms:
          - form: "compartir"
            f: "inf"
      - lemma: "propina"
        pos: "noun"
        en: "tip"
      - lemma: "bife"
        pos: "noun"
        en: "steak"
      - lemma: "papas fritas"
        pos: "phrase"
        en: "fries, chips"
      - lemma: "flan"
        pos: "noun"
        en: "flan, crème caramel"
      - lemma: "restaurante"
        pos: "noun"
        en: "restaurant"

  - ordinal: 10
    slug: "una-grande-de-muzza"
    title: "Order at the pizzería"
    summary: "Una grande de muzza, por favor"
    grammar:
      - "pedir.pres-pret"
      - "restaurante"
    register_max: "informal"
    sample:
      es: "Pedimos una grande de muzza para compartir."
      en: "We ordered a large mozzarella pizza to share."
    tips:
      - title: "Pide, pidieron"
        body: "The *e* of *pedir* turns into *i* in **pido**, **pide**, and in the past for *él* and
          *ellos*: **pidió**, **pidieron**. *Nosotros* keeps its *e* — and **pedimos** is both *we
          order* and *we ordered*: **anoche pedimos empanadas**."
      - title: "La pizzería"
        body: "Porteño pizza is its own religion: **una grande de muzza**, eaten standing up by the
          **porción**, or **mitad y mitad** for the undecided. At a parrilla, start with a
          **provoleta** and a **choripán**. **Reservé para las diez** — dinner starts late."
    words:
      - lemma: "pedir"
        pos: "verb"
        forms:
          - form: "pedimos"
            en: "we ordered, we order"
            f: "1pl.pret.ind"
          - form: "pidieron"
            en: "they ordered, they asked for"
            f: "3pl.pret.ind.irregular"
