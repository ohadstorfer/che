        en: "blood sausage"
      - lemma: "vacío"
        pos: "noun"
        en: "flank steak"
      - lemma: "achuras"
        pos: "noun"
        en: "offal, grilled organ meat"
        forms:
          - form: "achuras"
            f: "f.pl"
        note: "At an asado: chinchulines, mollejas, riñones, often eaten first."
      - lemma: "jugoso"
        pos: "adj"
        en: "juicy, rare"
        forms:
          - form: "jugoso"
            f: "m.sg"
          - form: "jugosa"
            f: "f.sg"
        note: "Steak order: vuelta y vuelta (very rare), jugoso (rare), a punto (medium), cocido (well
          done)."
      - lemma: "a punto"
