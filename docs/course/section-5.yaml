  - ordinal: 12
    slug: "de-que-cuadro-sos"
    title: "Say which team you root for"
    summary: "¿De qué cuadro sos?"
    grammar:
      - "futbol.hinchada"
      - "hinchar"
    register_max: "informal"
    sample:
      es: "¿De qué cuadro sos?"
      en: "Which team do you root for?"
    tips:
      - title: "¿De qué cuadro sos?"
        body: "The first question in a new friendship. A team is a **cuadro**, and you inherit it: *Soy de
          Independiente, el cuadro de mi abuelo.* Answer with **soy de** or **soy hincha de**.
          **Hinchar por** is for one game or the national team: *Hincho por la selección.*"
      - title: "El superclásico"
        body: "**Boca** against **River** is **el superclásico**; any other big rivalry game is a
          **clásico**. Boca fans are called *bosteros* and River fans *gallinas*: they say it about
          themselves with pride, but from you it can be an insult. Which side you're on, the course
          leaves to you."
      - title: "Hinchamos por el mismo"
        body: "**Hinchar por** runs in the family: **en casa hinchamos todos por el mismo cuadro**; **de
          chico hinchaba por otro, pero mi viejo no me dejó**. A fan **de toda la vida** never
          changes club — changing wife is easier, they say. Day to day, people simply say **somos
          del mismo cuadro**."
      - title: "Ser socio"
        body: "To go to **la cancha** — *estadio* is for signs and maps — you are usually **socio** — *a
          member* — of the **club**, and pay the cuota. Tickets are *entradas*: the **popular** is
          the cheap standing end, the **platea** the seats. The **hinchada** sings its **cantitos**
          for ninety minutes, under the **banderas**. Away fans? Banned for years: you only go **de
          visitante** on TV."
      - title: "El ídolo"
        body: "Every club has its **ídolo**, the **jugador** whose shirt the kids wear. And every fan fears
          one word: the **descenso** — *relegation*."
    words:
      - lemma: "cuadro"
        pos: "noun"
        en: "team (soccer)"
        note: "Usually means 'painting, picture'; in soccer talk it means a team."
      - lemma: "hinchar"
