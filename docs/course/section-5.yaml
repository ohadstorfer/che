      es: "Perdón, el bondi tardó mucho y no te avisé."
      en: "Sorry, the bus took ages and I didn't let you know."
    tips:
      - title: "¿Por qué no me avisaste?"
        body: "*Avisar* in the past is plain -ar: **avisé**, **avisaste**, **avisó**. The text at
          eight-forty: **¿Dónde estás? Te esperaba a las ocho.** And the answer, always: **ya
          salgo**. The other classics: **estoy llegando** (still ten minutes away), **estoy en
          camino** — *I'm on my way* — and **llego en diez**."
      - title: "Tardar"
        body: "**Tardar** is *to take (time)*: **¿cuánto tardás?** — *how long will you be?*; **el bondi
          tardó una hora**. Porteños are rarely **puntuales**, so *tipo ocho* already has the delay
          built in."
