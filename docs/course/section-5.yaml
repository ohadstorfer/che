    register_max: "informal"
    sample:
      es: "Pedí un bife con papas fritas."
      en: "I ordered a steak with fries."
    tips:
      - title: "Pedir"
        body: "**Pido** (I order), **pedís** (you order); in the past **pedí**, **pediste**, and — with an
          *i* — **pidió**. At the table: **¿Me traés la carta?** and, at the end, **la cuenta**. To
          get in: **Una mesa para dos, por favor.** And water is **con gas** or **sin gas**: *Para
          tomar, un agua sin gas.*"
      - title: "Propina"
        body: "The tip is **la propina**, usually 10 percent and in cash. The bill may also have a small
          charge per person, the *cubierto*: it is not the tip. **¿Compartimos?** — *shall we
          share?* — is how two people order one enormous *bife*."
    words:
