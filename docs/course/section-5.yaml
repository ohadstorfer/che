  - ordinal: 23
    slug: "practica-me-mude"
    title: "Practice: feelings, plans and moving"
    summary: "Me puse re contento"
    grammar:
      - "repaso.ponerse"
      - "repaso.ir-a"
      - "repaso.imperfecto-preterito"
    register_max: "informal"
    sample:
      es: "Me mudé a Córdoba y extraño mucho a mis viejos."
      en: "I moved to Córdoba and I miss my parents a lot."
    tips:
      - title: "Me puse: it happened to you"
        body: "**Me puse nervioso**, **me enojé**, **me asusté** — a feeling that came over you at one moment is the preterite. **Estaba nervioso** is the state you were in."
      - title: "Plans with voy a"
        body: "For plans, porteños use **voy a** + verb far more than the future: **la semana que viene voy a descansar**. **Pienso** and **tengo ganas de** do the same job."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "me puse"
