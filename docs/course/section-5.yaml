      en: "We won the final on penalties!"
    tips:
      - title: "Ellos ganaron"
        body: "The other team is *they*: **ganaron**, **perdieron**, **empataron**. Yours is usually *we*,
          from the bar or the sofa: **¡salimos campeones!** About your own team you can say either:
          **ganamos** (we, the fans) or **ganaron** (they, the players)."
      - title: "Penales"
        body: "A **final** that ends in a tie goes to the **alargue** — *extra time* — and then to
          **penales**: the **arquero atajó** one and somebody **metió** the last. **Salir campeón**
          is *to win the title*. **¡Aguante!** shows love for your team, win or lose: *¡Aguante
          Argentina!*"
