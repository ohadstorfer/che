        body: "The *e* of *pedir* turns into *i* in **pido**, **pide**, and in the past for *él* and
          *ellos*: **pidió**, **pidieron**. *Nosotros* keeps its *e* — and **pedimos** is both *we
          order* and *we ordered*: **anoche pedimos empanadas**."
      - title: "La pizzería"
        body: "Porteño pizza is its own religion: **una grande de muzza**, eaten standing up by the
          **porción**, or **mitad y mitad** for the undecided. At a parrilla, start with a
          **provoleta** and a **choripán**. **Reservé para las diez** — dinner starts late."
