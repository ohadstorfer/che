  - ordinal: 15
    slug: "la-parrilla"
    title: "Order at the parrilla"
    summary: "Un choripán, por favor"
    grammar:
      - "comida.parrilla"
    register_max: "informal"
    sample:
      es: "Un choripán, por favor."
      en: "A choripán, please."
    tips:
      - title: "El asado"
        body: "An asado comes in order: first **chorizo** and **morcilla**, the **achuras**, then the cuts —
          **vacío**, tira de asado. A **choripán** is a chorizo in bread, the food of every
          stadium."
      - title: "¿Cómo la querés?"
        body: "Meat comes **jugosa** — *rare* — **a punto** — *medium* — or well done. The **parrilla** is
          both the grill and the restaurant."
    words:
      - lemma: "parrilla"
        pos: "noun"
        en: "grill; steakhouse"
      - lemma: "morcilla"
