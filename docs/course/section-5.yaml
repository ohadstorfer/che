      es: "El mes que viene voy a tener que laburar mucho."
      en: "Next month I'm going to have to work a lot."
    tips:
      - title: "Voy a tener que"
        body: "**Tengo que** is *I have to*; put **voy a** in front for later: **voy a tener que
