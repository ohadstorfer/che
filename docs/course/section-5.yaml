      es: "Nos mudamos con un flete y pintamos el depto."
      en: "We moved with a van and painted the flat."
    tips:
      - title: "Before and after the move"
        body: "The old place is imperfect, the move is preterite: **antes alquilaba en el centro** —
          how it was; **me mudé a Palermo** — what happened. **Extrañaba** is missing that went on:
          *los primeros meses extrañaba mi barrio*."
      - title: "The move itself"
        body: "You rent through an **inmobiliaria** or straight from the **dueño**, and pay the
          **alquiler** every month. A **flete** takes the **muebles** and the **colchón**, and
          before unpacking, **pintamos**. The neighbours say it of you: **se mudaron**."
