    tips:
      - title: "Tipo ocho"
        body: "**Tipo** before a time is *around*: **tipo ocho** — *around eight*, which in Buenos Aires
          means eight-fifteen at the earliest. **En punto** is *on the dot*, and rarer."
      - title: "Avisame"
        body: "**Avisame** — *let me know*: **dale, avisame mañana**. **Te aviso** — *I'll let you know*. To
          meet up: **¿nos encontramos en la esquina?** — *should we meet on the corner?* — and **te
          espero** — *I'll wait for you*."
      - title: "¿Cómo quedamos?"
        body: "A plan is closed with **¿Cómo quedamos?** — *so what's the plan?* The answer fixes the time
          and the place: **Quedamos tipo ocho en la esquina.** Or ask straight: *¿A qué hora nos
          juntamos?*"
    words:
