        body: "**Estoy al horno** — *I'm in trouble, I'm toast*. **Qué bajón** — *what a downer*. **Al
          pedo** — *for nothing, doing nothing*: **fui al pedo**, **estoy al pedo**. And the flat
          *no way*: **ni en pedo**. The other *pedo* phrases: **estar en pedo** — *to be drunk*;
          **de pedo** — *by pure luck*: *llegué de pedo*; **a los pedos** — *very fast*. Among
          friends only."
      - title: "Rata, careta, grasa"
        body: "People get labels: a **rata** never pays; a **careta** is a square (or sober, or a phony);
          **grasa** is tacky. A **manija** is wound up about something: **estoy manija con el
          recital**. The **cana** is the police. A friend who backs you **te hace la gamba**; one
          who talks nonsense **manda fruta**."
