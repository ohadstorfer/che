  - ordinal: 20
    slug: "caiste"
    title: "Fall for a wind-up"
    summary: "¡Caíste! Te estaba tomando el pelo"
    grammar:
      - "humor"
    register_max: "informal"
    sample:
      es: "¡Caíste! Te estaba tomando el pelo."
      en: "Got you! I was pulling your leg."
    tips:
      - title: "Te estaba tomando el pelo"
        body: "**Estar** + the **-ando / -iendo** form is how you catch a joke in progress: **me estás
          tomando el pelo** — *you're pulling my leg*; **¿me estás jodiendo?** — *you're kidding
          me*; **estás exagerando**. And when you believed it: **¡caíste!** — *got you!* — **qué
          inocente**."
      - title: "Se calentó"
        body: "The joke only works if nobody takes it badly: **se calentó** — *he got mad* — and **se
          ofendió** — *he took offense* — are the worst things to say about someone at an asado.
          **Se picó** is what porteños say when a match or an argument got heated: *se picó el
          partido*. Everybody has an **apodo** — *a nickname*: **el Flaco**, **el Gordo**, **el
          Negro**, **el Pelado**, **el Colo** (the redhead). They are friendly, not insults: *le
          dicen el Flaco*. A **broma** — *a prank* — is a sign of affection too. **No te hagas el
          vivo**, though: **te hacés el vivo** is *you're acting smart*."
    words:
      - lemma: "caer"
        pos: "verb"
        forms:
          - form: "caíste"
            en: "you fell for it"
            f: "2sg.pret.ind.vos"
