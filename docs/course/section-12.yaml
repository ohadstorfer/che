# ---------------------------------------------------------------------------
# Che — Section 11 outline: "Between the lines" (B2.2)
#
# Saying what you mean without saying it outright: the subjunctive for what
# you're looking for but haven't found (un depto que tenga balcón), feelings
# that "give" you something (me da bronca que…), tactful advice (deberías,
# estaría bueno), what someone said they'd do (dijo que vendría), conditions
# (a menos que, por si), the signs on every door (se alquila), money in an
# inflationary city, things happening little by little (voy entendiendo),
# who you get along with (me cae bien), and a checkpoint of porteño irony.
#
# Plan: docs/course/roadmap.md §Section 11.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 12
  slug: "between-the-lines"
  title: "Between the lines"
