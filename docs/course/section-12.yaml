  - ordinal: 10
    slug: "practica-se-aceptan-tarjetas"
    title: "Practice: broken promises, lending and shop signs"
    summary: "Me aseguró que me lo devolvería"
    grammar:
      - "repaso.discurso-referido"
      - "repaso.a-menos-que"
      - "repaso.se-pasiva"
    register_max: "informal"
    sample:
      es: "Me aseguró que me lo devolvería."
      en: "He assured me he'd give it back."
    tips:
      - title: "Pasaría, devolvería"
        body: "What he swore he'd do, told later — the everyday way: **dijo que iba a pasar**, **me aseguró
