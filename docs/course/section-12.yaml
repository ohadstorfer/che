  - ordinal: 6
    slug: "dijo-que-vendria"
    title: "Say what someone said they'd do"
    summary: "Dijo que vendría"
    grammar:
      - "discurso-referido.condicional"
      - "prometer"
    register_max: "informal"
    sample:
      es: "Juan dijo que vendría, pero no vino."
      en: "Juan said he'd come, but he didn't."
    tips:
      - title: "Dijo que iba a venir"
        body: "Reporting a promise: «voy» → **dijo que iba a venir**; «te llamo» → **dijo que me iba a
          llamar**. That is what porteños say day to day. In writing and in careful speech the same
          thing goes into *would*: **dijo que vendría**, **dijo que me llamaría** — learn to
          recognise it."
      - title: "Me prometiste"
        body: "**Me prometiste que ibas a venir** — *you promised me you'd come* (more careful: *que
          vendrías*). And the classic ending: **al final no vino**."
    words:
      - lemma: "ir a"
        pos: "phrase"
        en: "to be going to (do)"
        forms:
