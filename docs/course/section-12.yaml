# ---------------------------------------------------------------------------
# Che — Section 12 outline: "In other words" (C1.1)
#
# Passing on what other people said and asked (me pidió que le trajera algo,
# me preguntó si venía), asking strangers and older neighbours politely in vos,
# writing the email that goes with it, telling how a story turned out
# (resulta que, encima), the porteño "la" expressions (se la cree, me la
# banco), what just happened and what usually does (acabo de, suelo), how the
# city has changed, being fed up, and a checkpoint that tells the whole story
# short.
#
# Plan: docs/course/roadmap.md §Section 12.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 12
  slug: "in-other-words"
  title: "In other words"
  cefr: "C1.1"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "me-pidio-que"
    title: "Pass on what someone asked"
    summary: "Me pidió que le trajera algo"
    grammar:
      - "discurso-referido.pedido"
      - "subjuntivo.imperfecto"
    register_max: "informal"
    sample:
      es: "Me pidió que le trajera algo."
      en: "She asked me to bring her something."
    tips:
      - title: "Me pidió que…"
        body: "A request told later takes the past subjunctive: «Traeme pan» → **me pidió que le trajera
          pan**; «Esperen» → **nos dijo que esperáramos**. *Dijo que* + subjunctive is an order;
          *dijo que* + indicative is news."
      - title: "Insistió, sugirió"
        body: "**Insistió en que fuera** — *she insisted I go*. **Me sugirió que la llamara** — *he
          suggested I call her*. Same pattern: the verb after **que** in the past subjunctive."
    words:
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "trajera"
            en: "(that) I brought, (that) he brought; (to) bring"
            f: "sg.impf.subj.irregular"
          - form: "trajeras"
            en: "(that) you brought; (to) bring"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejara"
            en: "(that) I left, (that) he let; (to) leave, (to) let"
            f: "sg.impf.subj"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperáramos"
            en: "(that) we waited; (to) wait"
            f: "1pl.impf.subj"
      - lemma: "insistir"
        pos: "verb"
        en: "to insist"
        forms:
          - form: "insistió"
            en: "he insisted, she insisted"
            f: "3sg.pret.ind"
          - form: "insisto"
            en: "I insist"
            f: "1sg.pres.ind"
      - lemma: "sugerir"
        pos: "verb"
        en: "to suggest"
        forms:
          - form: "sugirió"
            en: "he suggested, she suggested"
            f: "3sg.pret.ind.irregular"
          - form: "sugiero"
            en: "I suggest"
            f: "1sg.pres.ind.irregular"
      - lemma: "aclarar"
        pos: "verb"
        en: "to make clear, to clarify"
        forms:
          - form: "aclaró"
            en: "he made clear, she made clear"
            f: "3sg.pret.ind"
          - form: "aclarar"
            f: "inf"

  - ordinal: 2
    slug: "me-encargo-que"
    title: "Pass on a list of errands"
    summary: "Mi vieja me pidió que comprara pan"
    grammar:
      - "discurso-referido.pedido"
      - "subjuntivo.imperfecto"
    register_max: "informal"
    sample:
      es: "Mi vieja me pidió que comprara pan y que sacara la basura."
      en: "My mum asked me to buy bread and take out the trash."
    tips:
      - title: "Comprara, sacara, cerrara"
        body: "Any *-ar* verb works the same way: take the *ellos* past (*compraron*), swap **-ron** for
          **-ra**. «Comprá pan» → **me pidió que comprara pan**; «Cerrá la puerta» → **me dijo que
          cerrara la puerta**; «Apagá la luz» → **que apagara la luz**."
      - title: "Llegáramos, trajeran"
        body: "The other persons follow: **nos pidió que llegáramos temprano** — *she asked us to get there
          early*; **les dijo que trajeran algo** — *he told them to bring something*. **Me encargó que
          le llevara** is the errand version: *she asked me to take her…*"
      - title: "De parte de…"
        body: "Passing on a message ends with who it's from: **saludos de parte de mi vieja**. And the
          classic order from home, told later: «Portate bien» → **me dijo que me portara bien**."
    words:
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "comprara"
            en: "(that) I bought, (that) he bought; (to) buy"
            f: "sg.impf.subj"
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevara"
            en: "(that) I took, (that) he took; (to) take"
            f: "sg.impf.subj"
      - lemma: "sacar"
        pos: "verb"
        forms:
          - form: "sacara"
            en: "(that) I took out, (that) he took out; (to) take out"
            f: "sg.impf.subj"
      - lemma: "apagar"
        pos: "verb"
        forms:
          - form: "apagara"
            en: "(that) I turned off, (that) he turned off; (to) turn off"
            f: "sg.impf.subj"
      - lemma: "cerrar"
        pos: "verb"
        forms:
          - form: "cerrara"
            en: "(that) I closed, (that) he closed; (to) close"
            f: "sg.impf.subj.irregular"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegáramos"
            en: "(that) we arrived; (to) get there"
            f: "1pl.impf.subj"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "trajeran"
            en: "(that) they brought; (to) bring"
            f: "3pl.impf.subj.irregular"
      - lemma: "encargar"
        pos: "verb"
        en: "to ask (someone) to get or do something, to order"
        forms:
          - form: "encargó"
            en: "he asked (me) to get, she asked (me) to do"
            f: "3sg.pret.ind"
          - form: "encargar"
            f: "inf"
      - lemma: "acordarse"
        pos: "verb"
        forms:
          - form: "acordate"
            en: "remember, don't forget"
            f: "2sg.imp.vos.clitic"
      - lemma: "portarse"
        pos: "verb"
        en: "to behave"
        forms:
          - form: "portate"
            en: "behave"
            f: "2sg.imp.vos.clitic"
          - form: "me portara"
            en: "(that) I behaved; (to) behave"
            f: "sg.impf.subj.clitic"
          - form: "portara"
            f: "sg.impf.subj"
            bound: true
      - lemma: "de parte de"
        pos: "phrase"
        en: "on behalf of"

  - ordinal: 3
    slug: "me-pregunto-si"
    title: "Ask whether"
    summary: "Me preguntó si venía"
    grammar:
      - "discurso-referido.pregunta"
      - "si.interrogativo"
    register_max: "informal"
    sample:
      es: "Me preguntó si venía."
      en: "He asked me if I was coming."
    tips:
      - title: "Si = whether"
        body: "A yes-or-no question told later hangs on **si**: «¿Venís?» → **me preguntó si venía**.
          *No sé si abre hoy* — *I don't know if it's open today*. **Dudo** — *I doubt it*."
      - title: "A ver si…"
        body: "**A ver si** is *let's see if* — and, just as often, a hope: **a ver si nos juntamos** —
          *we should get together sometime*. To find something out, porteños **averiguan**."
    words:
      - lemma: "a ver si"
        pos: "phrase"
        en: "let's see if"
      - lemma: "averiguar"
        pos: "verb"
        en: "to find out, to look into"
        forms:
          - form: "averiguar"
            f: "inf"
          - form: "averiguo"
            en: "I'll find out, I find out"
            f: "1sg.pres.ind"
          - form: "averiguá"
            en: "find out"
            f: "2sg.imp.vos"
      - lemma: "dudar"
        pos: "verb"
        en: "to doubt"
        forms:
          - form: "dudo"
            en: "I doubt"
            f: "1sg.pres.ind"
          - form: "dudás"
            en: "you doubt"
            f: "2sg.pres.ind.vos"

  - ordinal: 4
    slug: "fijate-si-tienen"
    title: "Check before you go"
    summary: "Fijate si tienen stock"
    grammar:
      - "discurso-referido.pregunta"
      - "si.interrogativo"
    register_max: "informal"
    sample:
      es: "Preguntale si tienen stock antes de ir."
      en: "Ask them if they have it in stock before we go."
    tips:
      - title: "Fijate si…"
        body: "Before you cross the city, you check: **fijate si abren el feriado**, **me fijo si hay
          turno**, **preguntale si tienen stock**. The **si** is *whether*; the verb after it stays
          normal."
      - title: "Me preguntaron si…"
        body: "Told later, the question moves into the past with its **si**: «¿Tenés turno?» → **me
          preguntaron si tenía turno**."
    words:
      - lemma: "preguntar"
        pos: "verb"
        forms:
          - form: "preguntale"
            en: "ask him, ask her, ask them"
            f: "2sg.imp.vos.clitic"
          - form: "preguntaron"
            en: "they asked"
            f: "3pl.pret.ind"
      - lemma: "fijarse"
        pos: "verb"
        forms:
          - form: "me fijo"
            en: "I'll check, I'll have a look"
            f: "1sg.pres.ind.clitic"
          - form: "te fijás"
            en: "you check, you have a look"
            f: "2sg.pres.ind.vos.clitic"
      - lemma: "averiguar"
        pos: "verb"
        forms:
          - form: "averiguaste"
            en: "you looked into it"
            f: "2sg.pret.ind.vos"
          - form: "averigüé"
            en: "I looked into it"
            f: "1sg.pret.ind"
      - lemma: "consultar"
        pos: "verb"
        en: "to ask about, to check with"
        forms:
          - form: "consultar"
            f: "inf"
          - form: "consulté"
            en: "I consulted, I checked with"
            f: "1sg.pret.ind"
      - lemma: "chequear"
        pos: "verb"
        en: "to double-check"
        forms:
          - form: "chequear"
            f: "inf"
          - form: "chequeá"
            en: "double-check"
            f: "2sg.imp.vos"
      - lemma: "disponible"
        pos: "adj"
        en: "available"
      - lemma: "stock"
        pos: "noun"
        en: "goods on hand, inventory"
      - lemma: "en persona"
        pos: "phrase"
        en: "in person"

  - ordinal: 5
    # The slug stays "usted" because every id hangs off it; the unit teaches
    # politeness in vos — Argentina doesn't use usted.
    slug: "usted"
    title: "Ask a stranger politely"
    summary: "Disculpá que te moleste, ¿no tendrás cambio?"
    grammar:
      - "cortesia"
      - "futuro.cortesia"
      - "subjuntivo.disculpa-que"
    register_max: "informal"
    sample:
      es: "Disculpá que te moleste, ¿no tendrás cambio?"
      en: "Sorry to bother you, you wouldn't have change, would you?"
    tips:
      - title: "Polite, still vos"
        body: "Porteños say **vos** to everyone: the shop owner, a doctor, an old man on the bus.
          The politeness lives in the words around it: **disculpá que te moleste**, **perdón por la
          molestia**, **muy amable**."
      - title: "Quisiera, ¿no tendrás…?"
        body: "The politest way to ask is **quisiera** — *I'd like*: **quisiera un turno**. To ask a
          stranger for something, add **no** and the future: **¿no tendrás hora?** — *you wouldn't
          have the time?*"
    words:
      - lemma: "disculpar"
        pos: "verb"
        en: "to excuse"
        forms:
          - form: "disculpá"
            en: "excuse me"
            f: "2sg.imp.vos"
          - form: "disculpame"
            en: "excuse me, sorry"
            f: "2sg.imp.vos.clitic"
      - lemma: "molestar"
        pos: "verb"
        en: "to bother"
        forms:
          - form: "moleste"
            en: "(that) I bother"
            f: "1sg.pres.subj"
      - lemma: "molestia"
        pos: "noun"
        en: "bother, trouble"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tendrás"
            en: "you'd have (polite ¿no tendrás…?)"
            f: "2sg.fut.ind.vos.irregular"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sabrás"
            en: "you'd know (polite ¿no sabrás…?)"
            f: "2sg.fut.ind.vos.irregular"
      - lemma: "muy amable"
        pos: "phrase"
        en: "very kind of you"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quisiera"
            en: "I'd like"
            f: "sg.impf.subj.irregular"

  - ordinal: 6
    slug: "como-no-dona-rosa"
    title: "Talk to your older neighbours"
    summary: "Cómo no, doña Rosa, te doy una mano"
    grammar:
      - "cortesia"
      - "imperativo.vos"
    register_max: "informal"
    sample:
      es: "Dejá, don Juan, te doy una mano con la bolsa."
      en: "Let me, Don Juan, I'll give you a hand with the bag."
    tips:
      - title: "Don, doña"
        body: "The old neighbour is **don José** or **doña Rosa** — first name, with respect. A **persona
          mayor**, a **jubilado**, still gets **vos**, plus a **cómo no** (*of course*) and a **con
          permiso** as you squeeze past."
      - title: "Dejá, faltaba más"
        body: "Offer help with **te doy una mano**. If they try to carry the bags themselves: **dejá,
          dejá**. When they thank you: **no es nada** or **faltaba más** (*don't mention it*). And
          they may call you **querido** or **querida**."
    words:
      - lemma: "don"
        pos: "noun"
        en: "Mr. (before a first name)"
      - lemma: "doña"
        pos: "noun"
        en: "Mrs. (before a first name)"
      - lemma: "mayor"
        pos: "adj"
        en: "elderly"
        forms:
          - form: "mayor"
            f: "sg"
          - form: "mayores"
            f: "pl"
      - lemma: "jubilado"
        pos: "noun"
        en: "retiree, pensioner"
        forms:
          - form: "jubilado"
            f: "m.sg"
          - form: "jubilada"
            f: "f.sg"
          - form: "jubilados"
            en: "retirees, pensioners"
            f: "m.pl"
      - lemma: "cómo no"
        pos: "phrase"
        en: "certainly, by all means"
      - lemma: "con permiso"
        pos: "phrase"
        en: "excuse me (to get past)"
      - lemma: "faltaba más"
        pos: "phrase"
        en: "don't mention it, of course"
      - lemma: "no es nada"
        pos: "phrase"
        en: "it's nothing"
      - lemma: "dar una mano"
        pos: "phrase"
        en: "to give a hand"
        forms:
          - form: "te doy una mano"
            en: "I'll give you a hand"
            f: "1sg.pres.ind"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejá"
            en: "leave it, let me"
            f: "2sg.imp.vos"
      - lemma: "querido"
        pos: "noun"
        en: "dear (as a form of address)"
        forms:
          - form: "querido"
            f: "m.sg"
          - form: "querida"
            f: "f.sg"
      - lemma: "atender"
        pos: "verb"
        forms:
          - form: "atiende"
            en: "he serves, she sees (patients)"
            f: "3sg.pres.ind.irregular"

  - ordinal: 7
    slug: "practica-me-pidio"
    title: "Practice: requests, questions and asking nicely"
    summary: "Me pidió que esperáramos"
    grammar:
      - "repaso.discurso-referido"
      - "repaso.cortesia"
    register_max: "informal"
    sample:
      es: "Me pidió que esperáramos."
      en: "She asked us to wait."
    tips:
      - title: "Me pidió que, me preguntó si"
        body: "A request told later: **me pidió que le trajera algo**. A question: **me preguntó si venía**."
      - title: "Asking nicely"
        body: "**Disculpá que te moleste**, **¿no tendrás…?**, **quisiera** — polite without leaving vos."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "trajera"
      - "dejara"
      - "esperáramos"
      - "insistió"
      - "sugirió"
      - "a ver si"
      - "averiguar"
      - "dudo"
      - "abre"
      - "moleste"
      - "señora"
      - "tendrás"
      - "quisiera"
      - "agradezco"
      - "viniera"
      - "hubiera"

  - ordinal: 8
    slug: "practica-como-no"
    title: "Practice: errands, checking and don José"
    summary: "Me preguntaron si tenía turno"
    grammar:
      - "repaso.discurso-referido"
      - "repaso.cortesia"
    register_max: "informal"
    sample:
      es: "Mi vieja me encargó que comprara pan."
      en: "My mum asked me to buy bread."
    tips:
      - title: "Comprara, llegáramos, trajeran"
        body: "The errand told later: **me pidió que comprara pan**, **nos dijo que llegáramos
          temprano**, **les pidió que trajeran algo**. The question: **preguntale si tienen stock**."
      - title: "Cómo no, faltaba más"
        body: "With **don José** and **doña Rosa**: **te doy una mano**, **dejá**, **cómo no**, **faltaba más** — vos, said warmly."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "comprara"
      - "llegáramos"
      - "trajeran"
      - "encargó"
      - "portate"
      - "preguntale"
      - "me fijo"
      - "averigüé"
      - "disponible"
      - "te doy una mano"
      - "faltaba más"
      - "cómo no"
      - "jubilado"
      - "pidió"
      - "dijera"

  - ordinal: 9
    slug: "cualquier-cosa-avisame"
    title: "Write a work email"
    summary: "Te adjunto el contrato"
    grammar:
      - "registro.escrito"
      - "mail"
    register_max: "informal"
    sample:
      es: "Te adjunto el contrato."
      en: "I'm attaching the contract."
    tips:
      - title: "Estimado…"
        body: "A work email opens with **Estimado Juan** or **Estimada Sofi** and ends with **Saludos**.
          **Te adjunto** is *I'm attaching*; **desde ya, gracias** is *thanks in advance*."
      - title: "Cualquier cosa, avisame"
        body: "The porteño sign-off, in emails and out of them: **cualquier cosa, avisame** — *if anything
          comes up, let me know*. A **consulta** is a question you send; a **respuesta**, the reply."
    words:
      - lemma: "adjuntar"
        pos: "verb"
        en: "to attach"
        forms:
          - form: "adjunto"
            en: "I'm attaching"
            f: "1sg.pres.ind"
          - form: "adjunté"
            en: "I attached"
            f: "1sg.pret.ind"
      - lemma: "estimado"
        pos: "adj"
        en: "dear (in a letter)"
        forms:
          - form: "estimado"
            f: "m.sg"
          - form: "estimada"
            f: "f.sg"
      - lemma: "desde ya"
        pos: "phrase"
        en: "in advance"
      - lemma: "enviar"
        pos: "verb"
        en: "to send"
        forms:
          - form: "envié"
            en: "I sent"
            f: "1sg.pret.ind"
          - form: "enviás"
            en: "you send (formal)"
            f: "2sg.pres.ind.vos"
      - lemma: "cualquier cosa"
        pos: "phrase"
        en: "if anything comes up"

  - ordinal: 10
    slug: "te-reenvio-el-archivo"
    title: "Answer a work email"
    summary: "Te reenvío el archivo que me pediste"
    grammar:
      - "registro.escrito"
      - "mail"
    register_max: "informal"
    sample:
      es: "Te reenvío el archivo. Cualquier cosa, avisame."
      en: "I'm forwarding you the file. If anything comes up, let me know."
    tips:
      - title: "Te reenvío, te paso"
        body: "The reply has its own verbs: **te reenvío el mail** — *I'm forwarding you the email*; **te
          paso el link**; **te pongo en copia** — *I'm cc'ing you*. **Revisé la planilla** — *I went
          through the spreadsheet*."
      - title: "Cualquier duda…"
        body: "**Cualquier duda, avisame** — *any questions, let me know* — closes half the emails in
          Buenos Aires. What's still to do is **pendiente**: **me quedó pendiente el archivo**. And if
          it needs a meeting, you **agendás** it."
    words:
      - lemma: "reenviar"
        pos: "verb"
        en: "to forward"
        forms:
          - form: "reenvío"
            en: "I'm forwarding"
            f: "1sg.pres.ind"
          - form: "reenviame"
            en: "forward me"
            f: "2sg.imp.vos.clitic"
      - lemma: "archivo"
        pos: "noun"
        en: "file"
        forms:
          - form: "archivo"
            f: "sg"
          - form: "archivos"
            en: "files"
            f: "pl"
      - lemma: "asunto"
        pos: "noun"
        en: "subject line, matter"
      - lemma: "duda"
        pos: "noun"
        en: "doubt, query"
        forms:
          - form: "duda"
            f: "sg"
          - form: "dudas"
            en: "doubts; questions"
            f: "pl"
      - lemma: "revisar"
        pos: "verb"
        en: "to go over, to review"
        forms:
          - form: "revisar"
            f: "inf"
          - form: "revisé"
            en: "I went over, I reviewed"
            f: "1sg.pret.ind"
          - form: "revisá"
            en: "go over, review"
            f: "2sg.imp.vos"
      - lemma: "pendiente"
        pos: "adj"
        en: "still to do, outstanding"
        forms:
          - form: "pendiente"
            f: "sg"
          - form: "pendientes"
            f: "pl"
      - lemma: "planilla"
        pos: "noun"
        en: "spreadsheet, form"
      - lemma: "link"
        pos: "noun"
        en: "link"
      - lemma: "agendar"
        pos: "verb"
        en: "to schedule, to put in the calendar"
        forms:
          - form: "agendar"
            f: "inf"
          - form: "agendé"
