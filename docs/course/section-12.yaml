  - ordinal: 3
    slug: "deberias"
    title: "Give advice gently"
    summary: "Deberías descansar"
    grammar:
      - "deber.condicional"
      - "estaria-bueno"
    register_max: "informal"
    sample:
      es: "Deberías descansar un poco."
      en: "You should rest a little."
    tips:
      - title: "Deberías"
        body: "**Deberías** — *you should* — is advice with the edges sanded off: **deberías descansar**.
          **Debería** is *I should* or *he should*: *debería llamar a mi vieja*."
      - title: "Estaría bueno"
        body: "The softest porteño suggestion is **estaría bueno** — *it would be nice*: **estaría bueno
          juntarnos**, **estaría bueno que vengas**. **Habría que** is *we ought to*: *habría que
          avisarle*."
      - title: "Tendrías que, yo que vos"
        body: "Day to day porteños give advice with **tendrías que** more than with *deberías*: **tendrías
          que descansar**. Also **yo que vos** — *if I were you*: *yo que vos, iría al médico*; or a
          question: **¿por qué no vas al médico?**"
    words:
      - lemma: "deber"
        pos: "verb"
        forms:
          - form: "deberías"
            en: "you should"
            f: "2sg.cond.ind.vos"
          - form: "debería"
            en: "I should, he should, she should"
            f: "sg.cond.ind"
      - lemma: "estaría bueno"
        pos: "phrase"
        en: "it would be nice, it would be good"
      - lemma: "habría que"
        pos: "phrase"
        en: "we ought to, someone should"
      - lemma: "consejo"
        pos: "noun"
        en: "piece of advice"
      - lemma: "cuidar"
        pos: "verb"
        forms:
          - form: "cuidar"
            f: "inf"
          - form: "cuido"
            en: "I take care of"
            f: "1sg.pres.ind"
  - ordinal: 4
    slug: "deberias-tomarte-unos-dias"
    title: "Talk a stressed friend down"
    summary: "Deberías tomarte unos días"
    grammar:
      - "deber.condicional"
      - "estaria-bueno"
      - "deber.condicional.personas"
    register_max: "informal"
    sample:
      es: "Deberías tomarte unos días, estás re quemado."
      en: "You should take a few days off, you're totally burnt out."
    tips:
      - title: "Deberíamos, deberían"
        body: "The whole family of soft advice: **deberíamos juntarnos más** — *we should get together
          more*; **deberían pagarte más** — *they ought to pay you more*. Advice to *us* is the
          gentlest of all."
      - title: "Estaría bueno que…"
        body: "With a person after it, **que** + subjunctive: **estaría bueno que te tomes unos días**.
          Without one, the infinitive: *estaría bueno **descansar***. And the push: **¡animate!** —
          *go for it!*"
      - title: "Terapia"
        body: "Buenos Aires has more psychologists per person than almost anywhere, so **deberías ir a
          terapia** isn't an insult — it's what a good friend says."
    words:
      - lemma: "deber"
        pos: "verb"
        forms:
          - form: "deberíamos"
            en: "we should"
            f: "1pl.cond.ind"
          - form: "deberían"
            en: "they should, you all should"
            f: "3pl.cond.ind"
