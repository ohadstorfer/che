  practice: 2
units:
  - ordinal: 1
    slug: "me-da-bronca"
    title: "Say what gets to you"
    summary: "Me da bronca que no avise"
    grammar:
      - "me-da.emocion"
      - "subjuntivo.emocion"
    register_max: "informal"
    sample:
      es: "Me da bronca que no avise."
      en: "It makes me mad that he doesn't let us know."
    tips:
      - title: "Me da bronca"
        body: "Porteños say a feeling *gives* them something: **me da bronca** — *it makes me mad*; **me da
          vergüenza** — *I'm embarrassed*; **me da lástima** — *I feel sorry*; **me da igual** — *I
          don't care*."
      - title: "Que + subjunctive"
        body: "What causes the feeling follows **que** in the subjunctive: **me da bronca que no conteste**,
          **me da vergüenza que me vean así**."
    words:
      - lemma: "me da igual"
        pos: "phrase"
        en: "I don't care, it's all the same to me"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avise"
            en: "(that) he lets know, (that) I let know"
            f: "sg.pres.subj"
      - lemma: "contestar"
        pos: "verb"
        forms:
          - form: "conteste"
            en: "(that) he answers, (that) I answer"
            f: "sg.pres.subj"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "vean"
            en: "(that) they see"
            f: "3pl.pres.subj.irregular"
  - ordinal: 2
    slug: "me-pone-nervioso-que"
    title: "Say what drives you up the wall"
    summary: "Me pone nervioso que llegue tarde"
    grammar:
      - "me-da.emocion"
      - "subjuntivo.emocion"
      - "poner.emocion"
    register_max: "informal"
    sample:
      es: "Me pone nervioso que cancele a último momento."
      en: "It drives me crazy that he cancels at the last minute."
    tips:
      - title: "Me pone nervioso"
        body: "**Poner** makes feelings too: **me pone nervioso que llegue tarde**, **me pone de mal humor
          que cancele**. Same shape as *me da bronca*: the feeling, then **que** + subjunctive."
      - title: "Me enoja, me alegra"
        body: "They work like *gustar*: **me enoja que me mienta**, **me alegra que vengas**. If you're the
          one doing it, no *que*, just the infinitive: *me enoja **llegar** tarde*."
      - title: "Me clavó el visto"
        body: "The porteño complaint of the WhatsApp age: **me clavó el visto** — *he left me on read*. And
          the friend who forgets everything is **re colgado**."
