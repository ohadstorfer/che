    tips:
      - title: "Te la hago corta"
        body: "**Te la hago corta** — *long story short* — is usually followed by a long story. **La
          cuestión es que** — *the thing is* — brings it back on track; **en fin** closes it."
      - title: "Y nada"
        body: "**Y nada** is the porteño *so, yeah*: it fills the pause at the end of a story. **Al
          toque** — *right away*: **me contestó al toque**."
