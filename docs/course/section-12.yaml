        en: "promise"
      - lemma: "cumplir"
        pos: "verb"
        en: "to keep (a promise), to fulfil"
        forms:
          - form: "cumplió"
            en: "he kept (his word)"
            f: "3sg.pret.ind"
          - form: "cumplir"
            f: "inf"
  - ordinal: 7
    slug: "dijo-que-pasaria"
    title: "Chase a promise that didn't happen"
    summary: "El técnico dijo que pasaría el martes"
    grammar:
      - "discurso-referido.condicional"
      - "prometer"
      - "asegurar"
    register_max: "informal"
    sample:
      es: "El técnico dijo que pasaría el martes, pero al final no vino."
      en: "The repairman said he'd come by on Tuesday, but in the end he didn't come."
    tips:
      - title: "Pasaría, traería, devolvería"
        body: "Any verb goes into *would* the same way — the infinitive plus **-ía**: *pasar* → **dijo que
          pasaría**; *devolver* → **me juró que me la devolvería**. A few change the stem: *poner* →
          **pondría**, like *tener* → *tendría*. Out loud, porteños mostly say **iba a** +
          infinitive instead: *dijo que iba a pasar el martes*, *dijeron que iban a venir*."
      - title: "Me aseguró que…"
        body: "Porteños rarely just *say* a promise: **me aseguró que**, **me juró que**. Then comes the
          **excusa** — and you learn not to **confiar** in the **mentiroso**."
    words:
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasaría"
            en: "I would come by, he would come by"
            f: "sg.cond.ind"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "traería"
            en: "I would bring, he would bring"
            f: "sg.cond.ind"
      - lemma: "devolver"
        pos: "verb"
        forms:
          - form: "devolvería"
            en: "I would give back, he would give back"
            f: "sg.cond.ind"
      - lemma: "poner"
        pos: "verb"
        forms:
          - form: "pondría"
            en: "I would put, he would put"
            f: "sg.cond.ind.irregular"
      - lemma: "arreglar"
        pos: "verb"
        forms:
          - form: "arreglaría"
            en: "I would fix, he would fix"
            f: "sg.cond.ind"
      - lemma: "asegurar"
        pos: "verb"
        en: "to assure, to swear (to someone)"
        forms:
          - form: "aseguró"
            en: "he assured, she assured"
            f: "3sg.pret.ind"
      - lemma: "respuesta"
        pos: "noun"
        en: "answer, reply"
      - lemma: "excusa"
        pos: "noun"
        en: "excuse"
      - lemma: "mentiroso"
        pos: "adj"
        en: "liar, lying"
        forms:
