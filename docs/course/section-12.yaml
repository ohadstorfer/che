  - ordinal: 5
    slug: "practica-alguien-que-sepa"
    title: "Practice: someone who can, what drives you mad, advice"
    summary: "Estaría bueno que te animes"
    grammar:
      - "repaso.subjuntivo.relativo"
      - "repaso.me-da"
      - "repaso.deberias"
    register_max: "informal"
    sample:
      es: "No conozco a nadie que cocine como mi vieja."
      en: "I don't know anyone who cooks like my mum."
    tips:
      - title: "Alguien que, nadie que"
        body: "**¿Conocés a alguien que arregle bicis?** — don't know if they exist, subjunctive. **No hay
          nadie que cocine así** — they don't, subjunctive again. **Me pone nervioso que cancele** —
          a feeling about it, subjunctive too."
      - title: "Deberíamos, estaría bueno que"
        body: "**Deberíamos juntarnos**, **deberían pagarte más**, **estaría bueno que te tomes unos días**.
          And when they're scared: **¡animate!**"
