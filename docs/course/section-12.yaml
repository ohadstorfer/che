  - ordinal: 25
    slug: "como-te-decia"
    title: "Keep a story on track"
    summary: "Como te decía, el tema es que no vino"
    grammar:
      - "narracion.muletillas"
      - "repaso.c1"
    register_max: "informal"
    sample:
      es: "Como te decía, el tema es que no vino."
      en: "Like I was saying, the thing is he didn't come."
    tips:
      - title: "Como te decía"
        body: "A porteño story wanders, so it has signposts: **como te decía** — *like I was saying* —
          brings it back; **el tema es que** — *the thing is* — gets to the point; **a todo esto** —
          *by the way* — goes off on a side road; **hablando de** jumps to the next story."
      - title: "Y bueno"
        body: "**Y bueno** is the porteño shrug — *oh well, what can you do*: **y bueno, así es**. **Ah,
          me olvidaba** — *oh, I forgot to say* — adds the best part at the end. A story can be
          **larga** or **corta**; this one never is."
    words:
      - lemma: "como te decía"
        pos: "phrase"
        en: "like I was saying"
      - lemma: "el tema es que"
        pos: "phrase"
        en: "the thing is"
        register: "informal"
      - lemma: "a todo esto"
        pos: "phrase"
        en: "by the way, meanwhile"
      - lemma: "hablando de"
        pos: "phrase"
        en: "speaking of"
