  - ordinal: 18
    slug: "puteadas"
    title: "Understand the swearing"
    summary: "¡Qué cagada, la puta madre!"
    grammar:
      - "registro"
      - "puteadas"
    register_max: "vulgar"
    sample:
      es: "¡La puta madre! Me olvidé las llaves, qué cagada."
      en: "Damn it! I forgot my keys, what a pain."
    tips:
      - title: "Understand first"
        body: "You will hear these words every day — in traffic, at the football, between friends. Learn to
          understand them first. Say them only with close friends who already swear with you. Never
          to a stranger, at work, to someone older or to the police."
      - title: "Swearing at things"
        body: "Most swearing is aimed at the situation, not at a person: **¡la puta madre!**, **¡mierda!**,
          **¡carajo!**, **¡qué cagada!** A bad day is *un día de mierda*. Two are harmless: **una
          boludez** is something silly or small, and **me cagué de risa** means *I laughed a lot*."
      - title: "Swearing at people"
        body: "These hurt. **Pelotudo** is stronger than *boludo* and rarely friendly. A **forro** is a
          nasty person. An **hinchapelotas** won't stop bothering you: *¡no rompas las bolas!* —
          often just *¡no rompas!* **Andá a cagar** is *get lost*: a joke between friends, a fight
          with a stranger."
    words:
