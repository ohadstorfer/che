  - ordinal: 8
    slug: "a-menos-que"
    title: "Set conditions"
    summary: "Voy, a menos que llueva"
    grammar:
      - "a-menos-que"
      - "siempre-y-cuando"
      - "por-si"
    register_max: "informal"
    sample:
      es: "Voy, a menos que llueva."
      en: "I'll go, unless it rains."
    tips:
      - title: "A menos que, siempre y cuando"
        body: "Conditions that haven't happened take the subjunctive: **a menos que llueva** — *unless it
          rains*; **siempre y cuando vengas** — *as long as you come*. **En caso de que** — *if, in
          the event that* — is the formal one: *en caso de que haya un problema, llamame*."
      - title: "Por si"
        body: "**Por si** — *just in case* — is what people say for everyday precautions, and it keeps the
          normal verb: **llevá paraguas por si llueve**; *te dejo las llaves por si llegás antes*.
          Short version: **por las dudas** — *llevá paraguas, por las dudas*."
    words:
      - lemma: "a menos que"
        pos: "phrase"
        en: "unless"
      - lemma: "siempre y cuando"
        pos: "phrase"
        en: "as long as, provided that"
      - lemma: "en caso de que"
        pos: "phrase"
        en: "in the event that"
        note: "formal; for everyday precautions say por si"
      - lemma: "por si"
        pos: "phrase"
        en: "just in case, in case"
      - lemma: "pagar"
        pos: "verb"
        forms:
          - form: "pague"
            en: "(that) he pays, (that) I pay"
            f: "sg.pres.subj"
  - ordinal: 9
    slug: "con-tal-de-que"
    title: "Lend something, with conditions"
    summary: "Te lo presto, con tal de que lo cuides"
    grammar:
      - "a-menos-que"
      - "siempre-y-cuando"
      - "por-si"
      - "con-tal-de-que"
    register_max: "informal"
    sample:
      es: "Te presto el auto, con tal de que me lo devuelvas con el tanque lleno."
      en: "I'll lend you the car, as long as you bring it back with a full tank."
    tips:
      - title: "Con tal de que, salvo que"
        body: "Two more conditions that take the subjunctive: **con tal de que me lo devuelvas** — *on
          condition you give it back*; **salvo que lo necesite** — *unless I need it*. Lending to a
          friend in Buenos Aires comes with both."
      - title: "Que no lo choques"
        body: "The *vos* subjunctive is the one you hear on the way out the door: *te lo presto, siempre y
          cuando no lo **choques**, lo **cuides** y me lo **devuelvas entero***. The last word: **si
          no**, *no te presto nada más*."
    words:
