  - ordinal: 7
    slug: "me-traes-un-cafe"
    title: "Ask for what you want"
    summary: "¿Me traés un café?"
    grammar:
      - "querer.pres.1sg-2sg.pedido"
      - "traer.pres.2sg.vos.pedido"
      - "para"
      - "sin"
    register_max: "informal"
    sample:
      es: "Hola, ¿me traés un café con leche, por favor?"
      en: "Hi, can I have a coffee with milk, please?"
    tips:
      - title: "¿Me traés…?"
        body: "The easy way to order is to ask the waiter to bring it: **¿Me traés un café?** — literally
          \"do you bring me a coffee?\". *Quiero un café* works too. Add **por favor**."
      - title: "El mozo"
        body: "In Argentina the waiter is **el mozo** (or *la moza*). When you're done, ask for **la
          cuenta**. A **cortado** is an espresso with a dash of milk."
    words:
      - lemma: "querer"
        pos: "verb"
        en: "to want"
        forms:
          - form: "quiero"
            en: "I want, I'd like"
            f: "1sg.pres.ind"
          - form: "querés"
            en: "you want"
            f: "2sg.pres.ind.vos"
      - lemma: "traer"
        pos: "verb"
        en: "to bring"
        forms:
