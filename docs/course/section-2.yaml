  - ordinal: 5
    slug: "que-haces"
    title: "Talk about what you do"
    summary: "¿Qué hacés?"
    grammar:
      - "verbos.-ar.pres"
      - "hacer.pres.1sg-3sg"
      - "a-la-noche"
    register_max: "informal"
    sample:
      es: "Laburo en el centro y estudio a la noche."
      en: "I work downtown and study at night."
    tips:
      - title: "-ar verbs with vos"
        body: "Regular **-ar** verbs: *laburo, laburás, labura, laburamos, laburan*. The vos form stresses
          the last syllable and carries an accent: *hablás*, *estudiás*."
      - title: "Laburar"
        body: "**Laburar** is the everyday Argentine word for *to work* — from the Italian *lavorare*.
          *Trabajar* is understood everywhere and fine too."
    words:
      - lemma: "laburar"
        pos: "verb"
        en: "to work"
        register: "informal"
        forms:
          - form: "laburo"
            en: "I work"
            f: "1sg.pres.ind"
          - form: "laburás"
            en: "you work"
            f: "2sg.pres.ind.vos"
          - form: "labura"
            en: "works (he/she works)"
            f: "3sg.pres.ind"
          - form: "laburamos"
            en: "we work"
            f: "1pl.pres.ind"
          - form: "laburan"
            en: "they work"
            f: "3pl.pres.ind"
      - lemma: "trabajar"
        pos: "verb"
        en: "to work"
        forms:
          - form: "trabajo"
            en: "I work"
            f: "1sg.pres.ind"
          - form: "trabajás"
            en: "you work"
            f: "2sg.pres.ind.vos"
          - form: "trabaja"
            en: "works (he/she works)"
            f: "3sg.pres.ind"
      - lemma: "estudiar"
        pos: "verb"
        en: "to study"
        forms:
          - form: "estudio"
            en: "I study"
            f: "1sg.pres.ind"
          - form: "estudiás"
            en: "you study"
            f: "2sg.pres.ind.vos"
          - form: "estudia"
            en: "studies (he/she studies)"
            f: "3sg.pres.ind"
          - form: "estudiamos"
            en: "we study"
            f: "1pl.pres.ind"
          - form: "estudian"
            en: "they study"
            f: "3pl.pres.ind"
      - lemma: "tomar"
        pos: "verb"
        en: "to drink, to have"
        forms:
          - form: "tomo"
            en: "I drink"
            f: "1sg.pres.ind"
          - form: "tomás"
            en: "you drink"
            f: "2sg.pres.ind.vos"
          - form: "toma"
            en: "drinks (he/she drinks)"
            f: "3sg.pres.ind"
          - form: "tomamos"
            en: "we drink"
            f: "1pl.pres.ind"
          - form: "toman"
            en: "they drink"
            f: "3pl.pres.ind"
      - lemma: "hablar"
        pos: "verb"
        en: "to speak, to talk"
        forms:
          - form: "hablo"
            en: "I speak"
            f: "1sg.pres.ind"
          - form: "hablás"
            en: "you speak"
            f: "2sg.pres.ind.vos"
          - form: "habla"
            en: "speaks (he/she speaks)"
            f: "3sg.pres.ind"
          - form: "hablamos"
            en: "we speak"
            f: "1pl.pres.ind"
          - form: "hablan"
            en: "they speak"
            f: "3pl.pres.ind"
      - lemma: "caminar"
        pos: "verb"
