  - ordinal: 13
    slug: "hoy-y-manana"
    title: "Say when: today, tomorrow, now"
    summary: "Hoy laburo, mañana no"
    grammar:
      - "tiempo.hoy-manana-ahora"
      - "a-la-noche"
    register_max: "informal"
    sample:
      es: "Hoy laburo, mañana no"
      en: "I'm working today, not tomorrow"
    tips:
      - title: "Two mañanas"
        body: "**Mañana** on its own is *tomorrow*: *Hoy laburo, mañana no.* With **la** it is *the
          morning*, and porteños say **a la mañana** for *in the morning*. So *tomorrow morning* is
          **mañana a la mañana**."
      - title: "Tarde: afternoon or late"
        body: "**Tarde** works the same way. **A la tarde** is *in the afternoon*; on its own **tarde**
          means *late*: *Es tarde.* Its opposite is **temprano** — *early*: *Es temprano.*"
    words:
      - lemma: "hoy"
        pos: "adv"
        en: "today"
      - lemma: "mañana"
        pos: "noun"
        en: "morning"
      - lemma: "mañana"
        pos: "adv"
        en: "tomorrow"
      - lemma: "tarde"
        pos: "noun"
        en: "afternoon, evening"
      - lemma: "tarde"
        pos: "adv"
        en: "late"
      - lemma: "temprano"
        pos: "adv"
        en: "early"
      - lemma: "ahora"
        pos: "adv"
        en: "now"
