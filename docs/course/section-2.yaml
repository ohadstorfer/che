      en: "My building has a lift, but it doesn't have a roof terrace."
    tips:
      - title: "Tiene ascensor"
        body: "When you just say whether it has one, no *un*: *mi edificio **tiene** ascensor*, *no
          **tiene** terraza*. **Hay** for what's there: *en la planta baja **hay** un patio*."
      - title: "El encargado"
        body: "Most buildings have an **encargado** who lives in the building, keeps it clean and takes in
          your packages. He knows everything that happens on every **piso**."
      - title: "Planta baja y pisos"
        body: "The ground floor is **la planta baja**; above it comes *el **primer** piso* (*primero* loses
          its *-o* before a noun). Then **segundo, tercero, cuarto, quinto**. Higher up, people
          often just say the number: *piso doce*. On the **timbre**, *4° B* is read **cuarto B**.
          **Piso** is also the floor you walk on."
