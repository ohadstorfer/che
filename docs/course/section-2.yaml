        pos: "noun"
        en: "downtown, city centre"
      - lemma: "noche"
        pos: "noun"
        en: "night"
      - lemma: "castellano"
        pos: "noun"
        en: "Spanish"
        note: "Argentines say castellano, not español"
      - lemma: "inglés"
        pos: "noun"
