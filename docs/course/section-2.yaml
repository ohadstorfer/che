  - ordinal: 9
    slug: "esta-cerrado"
    title: "Say how things are"
    summary: "El bar está lleno"
    grammar:
      - "estar.estado"
      - "estar.pres.1pl-3pl"
      - "adj.estado.genero"
      - "porque"
      - "medio.atenuador"
    register_max: "informal"
    sample:
      es: "El bar está lleno y la cerveza está caliente."
      en: "The bar is packed and the beer is warm."
    tips:
      - title: "Estar for how things are"
        body: "*Estar* isn't only for people: things have a state right now too. **El bar está
          cerrado**, **el bondi está lleno**, **la cerveza está caliente**. The word matches the thing:
          *el bar* está llen**o**, *la plaza* está llen**a**."
      - title: "¿Listo? Listo."
        body: "**Listo** is *ready* — *¿estás lista?* — and on its own it closes any deal: *Listo,
          dale.* **Apurado** is *in a hurry*, the normal state of anyone in the centro."
      - title: "Caliente"
        body: "**Caliente** is for things: *el café está caliente*. Said about a person it means angry
          — or something ruder — so for the weather or yourself, use *tengo calor*."
    words:
      - lemma: "abierto"
        pos: "adj"
        en: "open (not closed)"
        forms:
          - form: "abierto"
            f: "m.sg"
          - form: "abierta"
            f: "f.sg"
          - form: "abiertos"
            f: "m.pl"
      - lemma: "cerrado"
        pos: "adj"
        en: "closed"
