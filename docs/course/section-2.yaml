    register_max: "informal"
    sample:
      es: "Estamos cansados, pero nos gusta tomar mate."
      en: "We're tired, but we like drinking mate."
    tips:
      - title: "Three verbs, three rules"
        body: "*Estar* and its word match the person: *estamos cansad**os***. An -ar verb takes the
          person's ending: *practic**amos***. *Gustar* matches the thing: *nos gust**an** los fideos*."
      - title: "Me, te, le, nos, les"
        body: "With *gustar* the person goes in front: **me** gusta, **te** gusta, **le** gusta, **nos**
          gusta, **les** gusta. Only *gusta* or *gustan* ever changes after it."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
