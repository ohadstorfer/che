  - ordinal: 6
    slug: "mate-y-facturas"
    title: "Say what you like"
    summary: "Me gusta el mate"
    grammar:
      - "gustar.me-te-le"
    register_max: "informal"
    sample:
      es: "¿Te gusta el mate amargo o dulce?"
      en: "Do you like your mate bitter or sweet?"
    tips:
      - title: "Gustar works backwards"
        body: "**Me gusta el mate** means \"mate pleases me\". The verb matches the thing you like: *me
          gusta el café*, but *me gustan las facturas*."
    words:
      - lemma: "gustar"
        pos: "verb"
        en: "to please, to like"
        forms:
