    tips:
      - title: "Quiere, queremos, quieren"
        body: "Ordering for more than one: **queremos** dos cafés. The mozo asks the table **¿qué quieren?**
          And for someone else: *ella **quiere** un té*. The *ie* is everywhere except *querés* and
          *queremos*."
      - title: "¿Nos traés…?"
        body: "Swap *me* for **nos** and the whole table orders at once: **¿Nos traés la carta?** — *¿Nos
          traés dos vasos, por favor?*"
      - title: "Soda y picada"
        body: "**Soda** is fizzy water, still served from a siphon in the old cafés. It is not a soft drink
          — that is **gaseosa**. On a menu you will see **agua con gas** (sparkling) and **agua sin
          gas** (still). A **picada** is a board of cheese and cold cuts to share before dinner."
