        body: "**Listo** is *ready* — *¿estás lista?* — and on its own it closes any deal: *Listo, dale.*
          **Apurado** is *in a hurry*, the normal state of anyone downtown."
      - title: "Caliente"
        body: "**Caliente** is for things: *el café está caliente*. Said about a person it means angry — or
