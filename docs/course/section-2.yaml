      - "dias.semana"
    register_max: "informal"
    sample:
      es: "Nos vemos a las siete y media."
      en: "See you at half past seven."
    tips:
      - title: "Telling the time"
        body: "*Es la una* (one o'clock), but *son las dos*, *son las siete*. Add **y media** for half past
          and **y cuarto** for quarter past. Other minutes go the same way: *las siete y veinte*.
          Past the half hour people often drop the **y**: *las ocho cuarenta*. To ask: *¿Qué hora
          es?* or *¿Tenés hora?* *At* a time is **a las**: *¿A qué hora?* — *A las nueve y media.*
          After a clock time say **de la mañana / de la tarde / de la noche**: *a las dos de la
          tarde*. With no clock time: **a la mañana**, *a la tarde*, *a la noche*."
    words:
