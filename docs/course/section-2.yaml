  - ordinal: 23
    slug: "practica-el-vecino"
    title: "Practice: ordering, jobs and the barrio"
    summary: "Somos cocineros y vendemos empanadas"
    grammar:
      - "repaso.querer"
      - "repaso.verbos-er-ir"
      - "repaso.profesiones"
    register_max: "informal"
    sample:
      es: "Somos cocineros y vendemos empanadas."
      en: "We're cooks and we sell empanadas."
    tips:
      - title: "Everyone ends in -n"
        body: "The *ellos* and *ustedes* form of every verb you have ends in **-n**: *quieren, tienen,
          laburan, viven, escriben*. *¿Quieren café?* — do you guys want coffee? Hear the *-n* and
          you know it's more than one."
      - title: "Es cocinero"
        body: "Jobs take no *un*: **es cocinero**, **soy contadora**. The word changes for a woman —
          *cocinera* — except the *-ista* ones: *periodista*."
