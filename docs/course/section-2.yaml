        body: "*¿Qué hacés?* is mostly just *hi*. To ask about someone's job, say **¿De qué laburás?** or
          **¿De qué trabajás?** The answer takes *de* too: *Laburo de mozo.* Or with *ser*: *Soy
          abogada.*"
