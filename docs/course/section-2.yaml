          *querés* and *queremos*."
      - title: "¿Nos traés…?"
        body: "Swap *me* for **nos** and the whole table orders at once: **¿Nos traés la carta?** —
          *¿Nos traés dos vasos, por favor?*"
      - title: "Soda y picada"
        body: "**Soda** is fizzy water, still served from a siphon in the old cafés. A **picada** is a
          board of cheese and cold cuts to share before dinner."
