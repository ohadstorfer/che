    summary: "Nos gustan los fideos"
    grammar:
      - "gustar.me-te-le"
      - "gustar.nos-les"
    register_max: "informal"
    sample:
      es: "A nosotros nos gustan los fideos con queso."
      en: "We like pasta with cheese."
    tips:
      - title: "Nos gusta, les gusta"
        body: "The little word changes with the people who like it: **nos** gusta — we like it; **les**
          gusta — they like it, or you all do. The verb still matches the food: *nos gusta el
          pollo*, *nos gust**an** los fideos*."
      - title: "A ellos les gusta"
        body: "*Les* can be *them* or *you all*, so porteños often say who: **a ellos** les gusta, **a
          ustedes** les gusta. The same with *le*: *a ella le gusta el pescado*."
      - title: "Los fideos, la verdura"
        body: "Pasta is **los fideos**, always plural. Vegetables are **la verdura** or **las verduras** —
          both are everyday: *no le gusta la verdura*, *me gustan las verduras*."
    words:
      - lemma: "nos"
        pos: "pron"
        en: "us, each other"
        glue: true
