    register_max: "informal"
    sample:
      es: "Estamos cansados, pero nos gusta tomar mate."
      en: "We're tired, but we like drinking mate."
    tips:
      - title: "Three verbs, three rules"
        body: "*Estar* and the describing word after it match the person: *estamos cansad**os***. An -ar
          verb takes the person's ending: *practic**amos***. *Gustar* matches the thing: *nos
          gust**an** los fideos*."
      - title: "Who likes it"
        body: "The little word in front says who likes it: **me**, **te**, **le**, **nos**, **les**. The
          verb is only ever *gusta* (one thing) or *gustan* (several): *le gust**a** el pollo*, *me
          gust**an** las medialunas*."
