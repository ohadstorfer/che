          - form: "aburrida"
            f: "f.sg"
      - lemma: "enojado"
        pos: "adj"
        en: "angry"
        forms:
          - form: "enojado"
            f: "m.sg"
          - form: "enojada"
            f: "f.sg"
      - lemma: "ocupado"
        pos: "adj"
        en: "busy"
        forms:
          - form: "ocupado"
            f: "m.sg"
          - form: "ocupada"
            f: "f.sg"
      - lemma: "enfermo"
        pos: "adj"
        en: "sick, ill"
        forms:
          - form: "enfermo"
            f: "m.sg"
          - form: "enferma"
            f: "f.sg"
      - lemma: "triste"
        pos: "adj"
        en: "sad"
        forms:
          - form: "triste"
            f: "sg"
          - form: "tristes"
