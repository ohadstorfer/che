# ===========================================================================
# ---------------------------------------------------------------------------
# Che — Section 1 outline
#
# The curriculum everything downstream is generated against: which units exist,
# in what order, what grammar each one teaches, and every form it introduces.
# A form that appears nowhere in this file does not exist in the course, and a
# sentence may only use forms introduced in its own unit or an earlier one.
#
# Status: DRAFT — not yet reviewed by a native speaker (Phase 0).
#
# Validate:  npm run course:validate
#
# Conventions
#   words:     one entry per lemma the unit introduces or extends. A lemma is
#              defined (pos, en) the first time it appears; later units list
#              only the new forms.
#   forms:     omitted → the lemma itself is the only form.
#   f:         grammatical features, dot-separated:
#                person/number  1sg 2sg 3sg 1pl 3pl
#                tense/mood     pres ind imp
#                non-finite     inf ger
#                               vos (voseo form) · clitic (pronoun attached)
#                nominal        m f sg pl
#   register:  neutral (default) · informal · lunfardo. A unit may only use
#              lemmas up to its register_max in sentences.
#   glue:      function words (articles, prepositions, clitics). They are
#              taught, but not drilled on their own or scheduled by SRS.
#   propn:     proper nouns. Free in sentences, never drilled.
#   sample:    one sentence the unit must be able to say, checked against the
#              forms available by then.
# ---------------------------------------------------------------------------

section:
  id: 2
  slug: "everyday-things"
  title: "Everyday things"
  cefr: "A1.2"
units:
  - ordinal: 1
    slug: "la-gente"
    title: "Talk about more than one person"
    summary: "Nosotros, ustedes, ellos"
    grammar:
      - "pron.sujeto.plural"
      - "ser.pres.1pl-3pl"
      - "tener.pres.1pl-3pl"
      - "posesivo.su"
    register_max: "informal"
    sample:
      es: "Nosotros somos de Córdoba."
      en: "We are from Córdoba."
    tips:
      - title: "Ustedes"
        body: "For more than one person, Argentina uses **ustedes** with the same verb form as *ellos*:
          *ustedes son*, *ellos son*."
    words:
      - lemma: "nosotros"
        pos: "pron"
        en: "we"
        forms:
          - form: "nosotros"
            f: "m.pl"
          - form: "nosotras"
            f: "f.pl"
      - lemma: "ustedes"
        pos: "pron"
        en: "you (plural)"
      - lemma: "ellos"
        pos: "pron"
        en: "they"
        forms:
          - form: "ellos"
            f: "m.pl"
          - form: "ellas"
            f: "f.pl"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "somos"
            en: "we are"
            f: "1pl.pres.ind"
          - form: "son"
            en: "they are, you (pl.) are"
            f: "3pl.pres.ind"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenemos"
            en: "we have"
            f: "1pl.pres.ind"
          - form: "tienen"
            en: "they have, you (pl.) have"
            f: "3pl.pres.ind"
      - lemma: "su"
        pos: "det"
        en: "his, her, their"
        glue: true
        forms:
          - form: "su"
            f: "sg"
          - form: "sus"
            f: "pl"
  - ordinal: 2
    slug: "donde-esta"
    title: "Say where something is"
    summary: "¿Dónde está?"
    grammar:
      - "estar.pres.1sg-3sg"
      - "estar.ubicacion"
      - "articulo.definido"
    register_max: "informal"
    sample:
      es: "El kiosco está acá cerca."
      en: "The kiosco is near here."
    tips:
      - title: "Estar for where things are"
        body: "Use **estar** for where someone or something is: *¿Dónde estás?* *El kiosco está acá.* It is
          a different verb from *ser*, which says what something is."
      - title: "El, la, los, las"
        body: "The word for \"the\" matches its noun: **el** kiosco, **la** esquina, **los** kioscos,
          **las** esquinas."
    words:
      - lemma: "estar"
        pos: "verb"
        en: "to be (location, state)"
        forms:
          - form: "estoy"
            en: "I am"
            f: "1sg.pres.ind"
          - form: "estás"
            en: "you are"
            f: "2sg.pres.ind.vos"
          - form: "está"
            en: "is (he/she/it is)"
            f: "3sg.pres.ind"
      - lemma: "el"
        pos: "det"
        en: "the"
        glue: true
        forms:
          - form: "el"
            f: "m.sg"
          - form: "la"
            f: "f.sg"
          - form: "los"
            f: "m.pl"
          - form: "las"
            f: "f.pl"
      - lemma: "en"
        pos: "prep"
        en: "in, on, at"
        glue: true
      - lemma: "a"
        pos: "prep"
        en: "to, at"
        glue: true
      - lemma: "allá"
        pos: "adv"
        en: "over there"
      - lemma: "ahí"
        pos: "adv"
        en: "there"
      - lemma: "cerca"
        pos: "adv"
        en: "near, close"
      - lemma: "lejos"
        pos: "adv"
        en: "far"
  - ordinal: 3
    slug: "hay-un-kiosco"
    title: "Say what there is around you"
    summary: "Hay un kiosco"
    grammar:
      - "hay"
      - "contraccion.del-al"
    register_max: "informal"
    sample:
      es: "Hay una parada del bondi en la esquina."
      en: "There is a bus stop on the corner."
    tips:
      - title: "Hay or está"
        body: "**Hay** introduces something: *Hay un kiosco* — there's a kiosco. **Está** says where
          something you already know about is: *El kiosco está en la esquina.*"
      - title: "Del and al"
        body: "*de + el* always becomes **del**, and *a + el* becomes **al**: *la parada del bondi*, *voy al
          centro*."
      - title: "El bondi"
        body: "**Bondi** is the everyday word for the city bus; *colectivo* is the neutral one. The
          **subte** is the Buenos Aires underground."
    words:
      - lemma: "haber"
        pos: "verb"
        en: "there to be"
        forms:
          - form: "hay"
            en: "there is, there are"
            f: "3sg.pres.ind"
      - lemma: "del"
        pos: "det"
        en: "of the"
        glue: true
      - lemma: "al"
        pos: "det"
        en: "to the"
        glue: true
      - lemma: "bondi"
        pos: "noun"
        en: "bus"
        register: "informal"
      - lemma: "colectivo"
        pos: "noun"
        en: "bus"
      - lemma: "subte"
        pos: "noun"
        en: "subway, metro"
      - lemma: "parada"
        pos: "noun"
        en: "bus stop"
      - lemma: "cuadra"
        pos: "noun"
        en: "city block"
        forms:
          - form: "cuadra"
            f: "f.sg"
          - form: "cuadras"
            en: "blocks"
            f: "f.pl"
      - lemma: "esquina"
        pos: "noun"
        en: "corner"
      - lemma: "calle"
        pos: "noun"
        en: "street"
  - ordinal: 4
    slug: "como-estas"
    title: "Say how you feel"
    summary: "¿Cómo estás?"
    grammar:
      - "estar.estado"
      - "estar.pres.1pl-3pl"
      - "adj.estado.genero"
      - "porque"
      - "medio.atenuador"
    register_max: "informal"
    sample:
      es: "¿Cómo estás? Medio cansada, pero bien."
      en: "How are you? Kind of tired, but OK."
    tips:
      - title: "Estar for how you feel"
        body: "Use **estar** for how you are right now: *estoy cansado*, *¿estás nerviosa?* The adjective
          matches the person: *cansado* for a man, *cansada* for a woman."
      - title: "Medio"
        body: "**Medio** in front of an adjective softens it — *estoy medio cansado*, I'm kind of tired. It
          never changes: *medio cansada* too."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estamos"
            en: "we are"
            f: "1pl.pres.ind"
          - form: "están"
            en: "they are, you (pl.) are"
            f: "3pl.pres.ind"
      - lemma: "cansado"
        pos: "adj"
        en: "tired"
        forms:
          - form: "cansado"
            f: "m.sg"
          - form: "cansada"
            f: "f.sg"
          - form: "cansados"
            f: "m.pl"
          - form: "cansadas"
            f: "f.pl"
      - lemma: "contento"
