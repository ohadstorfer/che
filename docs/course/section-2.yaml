      es: "Laburo en el centro y estudio a la noche."
      en: "I work downtown and study at night."
    tips:
      - title: "A la noche, ¿qué hacés?"
        body: "Porteños say **a la noche** for *at night* or *tonight*: *A la noche estudio inglés.*
          *Hablamos a la noche* — we'll talk tonight. **De noche** is at night in general: *laburo
          de noche* (I work nights). And **¿qué hacés?** — literally *what are you doing?* — is also
          the everyday *how's it going?*: *Hola, ¿qué hacés?*"
      - title: "Laburar"
        body: "**Laburar** is the everyday Argentine word for *to work* — from the Italian *lavorare*.
