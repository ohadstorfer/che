            f: "sg"
          - form: "jóvenes"
            f: "pl"
      - lemma: "lindo"
        pos: "adj"
        en: "nice, pretty"
        forms:
          - form: "lindo"
            f: "m.sg"
          - form: "linda"
            f: "f.sg"
          - form: "lindos"
            f: "m.pl"
          - form: "lindas"
            f: "f.pl"
      - lemma: "simpático"
        pos: "adj"
        en: "friendly, likeable"
        forms:
          - form: "simpático"
            f: "m.sg"
          - form: "simpática"
            f: "f.sg"
          - form: "simpáticos"
            f: "m.pl"
      - lemma: "casado"
