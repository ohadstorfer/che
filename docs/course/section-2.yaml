        body: "The easy way to order is to ask the waiter to bring it: **¿Me traés un café?** — literally
          \"do you bring me a coffee?\". *Quiero un café* works too: **quiero**, **¿querés?** — no
          *ie* in the vos form. Or just name it: *Para mí, un té.* Add **por favor**."
      - title: "El mozo"
        body: "In Argentina the waiter is **el mozo** (or *la moza*). To call one over, *perdón* is the
          gentle way; *¡mozo!* is heard too. When you're done, ask for **la cuenta**. "
