    register_max: "informal"
    sample:
      es: "Practico castellano y mi vecina me ayuda."
      en: "I practise Spanish and my neighbour helps me."
    tips:
      - title: "The same five endings"
        body: "Every new verb here is a regular -ar verb, so you already know them: *practic**o**,
          practic**ás**, practic**a**, practic**amos***. Learn the infinitive and the rest comes free:
          *necesito, usás, ayuda, enseñan*."
      - title: "Buscar, preguntar"
        body: "**Buscar** is *to look for* — no *for* needed: *busco una palabra*. **Preguntar** is *to
          ask* a question: *pregunto por qué*. Neither takes an extra word in front of the thing."
      - title: "Más despacio"
        body: "Porteños talk **rápido**. The line that saves you: *¿Podés hablar más despacio?* — and
          most people will happily slow down and **ayudar**."
