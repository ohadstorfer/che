      en: "My building has a lift, but it doesn't have a roof terrace."
    tips:
      - title: "Tiene ascensor"
        body: "When you just say whether it has one, no *un*: *mi edificio **tiene** ascensor*, *no
          **tiene** terraza*. **Hay** for what's there: *en la planta baja **hay** un patio*."
      - title: "El encargado"
        body: "Most buildings have an **encargado** who lives in, keeps it clean and takes in your
          packages. He knows everything that happens on every **piso**."
      - title: "Planta baja"
        body: "The ground floor is **la planta baja**; the one above it is *el primer piso*. Ringing from the street, you press the **timbre** with the floor and the letter: *4° B*. Out loud, *4° B* is **cuarto B**: *vivo en el cuarto B*. The first five floors: **primero, segundo, tercero, cuarto, quinto** — and *primero* loses its *-o* before a noun: *el **primer** piso*."
