  - ordinal: 3
    slug: "donde-esta"
    title: "Say where something is"
    summary: "¿Dónde está?"
    grammar:
      - "estar.pres.1sg-3sg"
      - "estar.ubicacion"
      - "articulo.definido"
    register_max: "informal"
    sample:
      es: "El kiosco está acá cerca."
      en: "The kiosco is near here."
    tips:
      - title: "Estar for where things are"
        body: "Use **estar** for where someone or something is: *¿Dónde estás?* *El kiosco está acá.* It is
          a different verb from *ser*, which says what something is."
      - title: "El, la, los, las"
        body: "The word for \"the\" matches its noun: **el** kiosco, **la** esquina, **los** kioscos,
          **las** esquinas."
    words:
      - lemma: "estar"
        pos: "verb"
        en: "to be (location, state)"
        forms:
          - form: "estoy"
            en: "I am"
            f: "1sg.pres.ind"
          - form: "estás"
            en: "you are"
            f: "2sg.pres.ind.vos"
          - form: "está"
            en: "is (he/she/it is)"
            f: "3sg.pres.ind"
      - lemma: "el"
        pos: "det"
        en: "the"
        glue: true
        forms:
          - form: "el"
            f: "m.sg"
          - form: "la"
            f: "f.sg"
          - form: "los"
            f: "m.pl"
          - form: "las"
            f: "f.pl"
      - lemma: "en"
        pos: "prep"
        en: "in, on, at"
        glue: true
      - lemma: "a"
        pos: "prep"
        en: "to, at"
        glue: true
      - lemma: "allá"
        pos: "adv"
        en: "over there"
      - lemma: "ahí"
        pos: "adv"
        en: "there"
      - lemma: "cerca"
        pos: "adv"
        en: "near, close"
      - lemma: "lejos"
        pos: "adv"
        en: "far"

  - ordinal: 4
    slug: "donde-estan-las-llaves"
    title: "Find your things"
    summary: "¿Dónde están mis llaves?"
    grammar:
      - "estar.pres.1sg-3sg"
      - "estar.ubicacion"
      - "articulo.definido"
      - "estar.pres.3pl"
    register_max: "informal"
    sample:
      es: "¿Dónde están mis llaves? Están en la mochila."
      en: "Where are my keys? They're in the backpack."
    tips:
      - title: "Está, están"
        body: "One thing **está**, more than one **están**: *¿Dónde está mi celu?* — *¿Dónde están mis
          anteojos?* The answer drops the thing you're looking for: **Están en la mochila.**"
      - title: "Arriba, abajo, adentro"
        body: "Three words that need nothing after them: **arriba** (up, upstairs), **abajo** (down, downstairs), **adentro** (inside). *Estoy abajo* is what a porteño texts from the street when they're at your door. The fourth one is **afuera** — *outside*: *mi auto está afuera*."
      - title: "En casa"
        body: "No *la* before home: **estoy en casa**, *I'm at home*. With anything else the little word
          comes back: *en la mochila*, *en el auto*."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "están"
            en: "they are, you (pl.) are"
            f: "3pl.pres.ind"
      - lemma: "casa"
        pos: "noun"
        en: "house, home"
      - lemma: "celu"
        pos: "noun"
        en: "phone, cell phone"
        register: "informal"
      - lemma: "llave"
        pos: "noun"
        en: "key"
        forms:
          - form: "llave"
            f: "f.sg"
          - form: "llaves"
            en: "keys"
            f: "f.pl"
      - lemma: "anteojos"
        pos: "noun"
        en: "eyeglasses"
      - lemma: "billetera"
        pos: "noun"
        en: "wallet"
      - lemma: "mochila"
        pos: "noun"
        en: "backpack"
      - lemma: "compu"
        pos: "noun"
        en: "computer, laptop"
        note: "short for computadora"
        register: "informal"
      - lemma: "auto"
        pos: "noun"
        en: "car"
      - lemma: "arriba"
        pos: "adv"
        en: "up, upstairs"
      - lemma: "abajo"
        pos: "adv"
        en: "down, downstairs"
      - lemma: "adentro"
        pos: "adv"
        en: "inside"

  - ordinal: 5
    slug: "hay-un-kiosco"
    title: "Say what there is around you"
    summary: "Hay un kiosco"
    grammar:
      - "hay"
      - "contraccion.del-al"
    register_max: "informal"
    sample:
      es: "Hay una parada del bondi en la esquina."
      en: "There is a bus stop on the corner."
    tips:
      - title: "Hay or está"
        body: "**Hay** introduces something: *Hay un kiosco* — there's a kiosco. **Está** says where
          something you already know about is: *El kiosco está en la esquina.*"
      - title: "Del and al"
        body: "*de + el* always becomes **del**, and *a + el* becomes **al**: *la parada del bondi*, *voy al
          centro*."
      - title: "El bondi"
        body: "**Bondi** is the everyday word for the city bus; *colectivo* is the neutral one. The
          **subte** is the Buenos Aires underground."
    words:
      - lemma: "haber"
        pos: "verb"
        en: "there to be"
        forms:
          - form: "hay"
            en: "there is, there are"
            f: "3sg.pres.ind"
      - lemma: "del"
        pos: "det"
        en: "of the"
        glue: true
      - lemma: "al"
        pos: "det"
        en: "to the"
        glue: true
      - lemma: "bondi"
        pos: "noun"
        en: "bus"
        register: "informal"
      - lemma: "colectivo"
        pos: "noun"
        en: "bus"
      - lemma: "subte"
        pos: "noun"
        en: "subway, metro"
      - lemma: "parada"
        pos: "noun"
        en: "bus stop"
      - lemma: "cuadra"
        pos: "noun"
        en: "city block"
        forms:
          - form: "cuadra"
            f: "f.sg"
          - form: "cuadras"
            en: "blocks"
            f: "f.pl"
      - lemma: "esquina"
        pos: "noun"
        en: "corner"
      - lemma: "calle"
        pos: "noun"
        en: "street"

  - ordinal: 6
    slug: "hay-un-tren"
    title: "Find your way around the city"
    summary: "¿Hay una estación por acá?"
    grammar:
      - "hay"
      - "contraccion.del-al"
    register_max: "informal"
    sample:
      es: "¿Hay una estación de tren por acá?"
      en: "Is there a train station around here?"
    tips:
      - title: "Por acá"
        body: "**Por acá** is *around here*, the end of every question on the street: *¿Hay un bar por
          acá?* *¿Hay un taxi por acá?* The answer is usually a finger and *a dos cuadras*."
      - title: "Hay gente"
        body: "**Hay** works for things you can't count, too: **hay gente** — there are people. *Gente*
          is singular in Spanish: *la gente está en la plaza*."
      - title: "Al parque, del subte"
        body: "The same two joins as before: *a la plaza* but **al** parque, **al** hospital; *la
          estación **del** subte*, *la parada **del** bondi*."
    words:
      - lemma: "tren"
        pos: "noun"
        en: "train"
      - lemma: "estación"
        pos: "noun"
        en: "station"
      - lemma: "línea"
        pos: "noun"
        en: "subway line, bus route"
        note: "la línea B, la línea 60"
      - lemma: "taxi"
        pos: "noun"
        en: "taxi"
      - lemma: "avenida"
        pos: "noun"
        en: "avenue"
      - lemma: "plaza"
        pos: "noun"
        en: "square"
        note: "a green city square, with trees and benches"
      - lemma: "parque"
        pos: "noun"
        en: "park"
      - lemma: "hospital"
        pos: "noun"
        en: "hospital"
      - lemma: "bar"
        pos: "noun"
        en: "bar, café"
      - lemma: "gente"
        pos: "noun"
        en: "people"
        note: "singular in Spanish: la gente es…"
      - lemma: "por acá"
        pos: "phrase"
        en: "around here"

  - ordinal: 7
    slug: "practica-por-aca"
    title: "Practice: people and places"
    summary: "Mis hermanos están en la plaza"
    grammar:
      - "repaso.ser-estar"
      - "repaso.hay"
    register_max: "informal"
    sample:
      es: "Mis hermanos son simpáticos y están en la plaza."
      en: "My brothers are nice and they're in the square."
    tips:
      - title: "Son or están"
        body: "**Son** says what people are like: *son altos*, *son simpáticos*. **Están** says where
          they are: *están en la plaza*. The same people, two verbs."
      - title: "Hay or está"
        body: "**Hay** for something new: *hay una estación por acá*. **Está** for the one you already
          mean: *la estación está en la avenida*."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
