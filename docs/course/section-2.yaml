# ---------------------------------------------------------------------------
# Che — Section 1 outline
#
# The curriculum everything downstream is generated against: which units exist,
# in what order, what grammar each one teaches, and every form it introduces.
# A form that appears nowhere in this file does not exist in the course, and a
# sentence may only use forms introduced in its own unit or an earlier one.
#
# Status: DRAFT — not yet reviewed by a native speaker (Phase 0).
#
# Validate:  npm run course:validate
#
# Conventions
#   words:     one entry per lemma the unit introduces or extends. A lemma is
#              defined (pos, en) the first time it appears; later units list
#              only the new forms.
#   forms:     omitted → the lemma itself is the only form.
#   f:         grammatical features, dot-separated:
#                person/number  1sg 2sg 3sg 1pl 3pl
#                tense/mood     pres ind imp
#                non-finite     inf ger
#                               vos (voseo form) · clitic (pronoun attached)
#                nominal        m f sg pl
#   register:  neutral (default) · informal · lunfardo. A unit may only use
#              lemmas up to its register_max in sentences.
#   glue:      function words (articles, prepositions, clitics). They are
#              taught, but not drilled on their own or scheduled by SRS.
#   propn:     proper nouns. Free in sentences, never drilled.
#   sample:    one sentence the unit must be able to say, checked against the
#              forms available by then.
# ---------------------------------------------------------------------------

section:
  id: 2
  slug: "everyday-things"
  title: "Everyday things"
  cefr: "A1.2"
units:
  - ordinal: 1
    slug: "la-gente"
    title: "Talk about more than one person"
    summary: "Nosotros, ustedes, ellos"
    grammar:
      - "pron.sujeto.plural"
      - "ser.pres.1pl-3pl"
      - "tener.pres.1pl-3pl"
      - "posesivo.su"
    register_max: "informal"
    sample:
      es: "Nosotros somos de Córdoba."
      en: "We are from Córdoba."
    tips:
      - title: "Su and nuestro"
        body: "**Su** is *his*, *her* or *their* (and *your* for *ustedes*); with more than one it is
          **sus**: *su mamá*, *sus hijos*. *Our* matches the thing, not the people: **nuestro**
          papá, **nuestra** familia, **nuestros** abuelos, **nuestras** hermanas."
      - title: "Nosotras, ellas"
        body: "**Nosotras** and **ellas** are for groups of women only. One man in the group makes it
          **nosotros** and **ellos**."
      - title: "Nuestro, nuestra"
        body: "*Our* matches the thing, not the people: **nuestro** país, **nuestra** familia, **nuestros**
          hijos, **nuestras** hermanas. *Their* is still **su**: *su familia*, *sus hijos*."
    words:
      - lemma: "nosotros"
        pos: "pron"
        en: "we"
        forms:
          - form: "nosotros"
            f: "m.pl"
          - form: "nosotras"
            f: "f.pl"
      - lemma: "ustedes"
        pos: "pron"
        en: "you (plural)"
      - lemma: "ellos"
        pos: "pron"
        en: "they"
        forms:
          - form: "ellos"
            f: "m.pl"
          - form: "ellas"
            f: "f.pl"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "somos"
            en: "we are"
            f: "1pl.pres.ind"
          - form: "son"
            en: "they are, you (pl.) are"
            f: "3pl.pres.ind"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenemos"
            en: "we have"
            f: "1pl.pres.ind"
          - form: "tienen"
            en: "they have, you (pl.) have"
            f: "3pl.pres.ind"
      - lemma: "su"
        pos: "det"
        en: "his, her, their, your (plural)"
        glue: true
        forms:
          - form: "su"
            f: "sg"
          - form: "sus"
            f: "pl"
      - lemma: "nuestro"
        pos: "det"
        en: "our"
        glue: true
        forms:
          - form: "nuestro"
            f: "m.sg"
          - form: "nuestra"
            f: "f.sg"
          - form: "nuestros"
            f: "m.pl"
          - form: "nuestras"
            f: "f.pl"
  - ordinal: 2
    slug: "altos-y-morochos"
    title: "Describe the people in your life"
    summary: "Son altos y morochos"
    grammar:
      - "pron.sujeto.plural"
      - "ser.pres.1pl-3pl"
      - "tener.pres.1pl-3pl"
      - "posesivo.su"
      - "adj.descripcion"
    register_max: "informal"
    sample:
      es: "Mis hermanos son altos y morochos."
      en: "My brothers are tall and dark-haired."
    tips:
      - title: "Son altos"
        body: "What people are like goes with *ser*: **somos altos**, **son morochos**. The word takes an
          *-s* for more than one, and *-os* covers a mixed group: *mis hermanos son altos*, even if
          one of them is a sister."
      - title: "Morocho, rubio, flaco"
        body: "Porteños describe people by the obvious and nobody minds: **morocho** is dark-haired,
          **rubio** fair, **flaco** thin, **petiso** short. *Flaco* is even a nickname: *¿Todo bien,
          flaco?*"
      - title: "Soy soltero, son casados"
        body: "Single or married goes with *ser* too: **soy soltera**, **son casados**. You'll also hear
          *estoy casado* — both are everyday Buenos Aires."
    words:
      - lemma: "alto"
        pos: "adj"
        en: "tall"
        forms:
          - form: "alto"
            f: "m.sg"
          - form: "alta"
            f: "f.sg"
          - form: "altos"
            f: "m.pl"
          - form: "altas"
            f: "f.pl"
      - lemma: "petiso"
        pos: "adj"
        en: "short (not tall)"
        register: "informal"
        forms:
          - form: "petiso"
            f: "m.sg"
          - form: "petisa"
            f: "f.sg"
          - form: "petisos"
            f: "m.pl"
      - lemma: "rubio"
        pos: "adj"
        en: "blond, fair-haired"
        forms:
          - form: "rubio"
            f: "m.sg"
          - form: "rubia"
            f: "f.sg"
          - form: "rubios"
            f: "m.pl"
      - lemma: "morocho"
        pos: "adj"
        en: "dark-haired"
        note: "also dark-skinned; said with affection"
        forms:
          - form: "morocho"
            f: "m.sg"
          - form: "morocha"
            f: "f.sg"
          - form: "morochos"
            f: "m.pl"
      - lemma: "flaco"
        pos: "adj"
        en: "thin, skinny"
        forms:
          - form: "flaco"
            f: "m.sg"
          - form: "flaca"
            f: "f.sg"
          - form: "flacos"
            f: "m.pl"
        note: "Also used to call someone: '¿Qué hacés, flaco?' = hey, man (even if he isn't thin)."
      - lemma: "joven"
        pos: "adj"
        en: "young"
        forms:
          - form: "joven"
            f: "sg"
          - form: "jóvenes"
            f: "pl"
      - lemma: "lindo"
        pos: "adj"
        en: "nice, pretty"
        forms:
          - form: "lindo"
            f: "m.sg"
          - form: "linda"
            f: "f.sg"
          - form: "lindos"
            f: "m.pl"
          - form: "lindas"
            f: "f.pl"
      - lemma: "simpático"
        pos: "adj"
        en: "friendly, likeable"
        forms:
          - form: "simpático"
            f: "m.sg"
          - form: "simpática"
            f: "f.sg"
          - form: "simpáticos"
            f: "m.pl"
        note: "False friend: means friendly or likeable, not 'sympathetic'."
      - lemma: "casado"
        pos: "adj"
        en: "married"
        forms:
          - form: "casado"
            f: "m.sg"
          - form: "casada"
            f: "f.sg"
          - form: "casados"
            f: "m.pl"
      - lemma: "soltero"
        pos: "adj"
        en: "single, unmarried"
        forms:
          - form: "soltero"
            f: "m.sg"
          - form: "soltera"
            f: "f.sg"
          - form: "solteros"
            f: "m.pl"
      - lemma: "mellizo"
        pos: "noun"
        en: "twin"
        note: "Argentines say mellizos for twins in general; gemelos is used mostly for identical twins."
        forms:
          - form: "mellizo"
            f: "m.sg"
          - form: "melliza"
            f: "f.sg"
          - form: "mellizos"
            en: "twins"
            f: "m.pl"
  - ordinal: 3
    slug: "donde-esta"
    title: "Say where something is"
    summary: "¿Dónde está?"
    grammar:
      - "estar.pres.1sg-3sg"
      - "estar.ubicacion"
      - "articulo.definido"
    register_max: "informal"
    sample:
      es: "El kiosco está acá cerca."
      en: "The kiosco is near here."
    tips:
      - title: "Estar for where things are"
        body: "Use **estar** for where someone or something is: *¿Dónde estás?* *El kiosco está acá.* It is
          a different verb from *ser*, which says what something is."
      - title: "El, la, los, las"
        body: "The word for \"the\" matches its noun: **el** kiosco, **la** empanada, **los** kioscos,
          **las** empanadas."
    words:
      - lemma: "estar"
        pos: "verb"
        en: "to be (location, state)"
        forms:
          - form: "estoy"
            en: "I am"
            f: "1sg.pres.ind"
          - form: "estás"
            en: "you are"
            f: "2sg.pres.ind.vos"
          - form: "está"
            en: "is (he/she/it is)"
            f: "3sg.pres.ind"
      - lemma: "el"
        pos: "det"
        en: "the"
        glue: true
        forms:
          - form: "el"
            f: "m.sg"
          - form: "la"
            f: "f.sg"
          - form: "los"
            f: "m.pl"
          - form: "las"
            f: "f.pl"
      - lemma: "en"
        pos: "prep"
        en: "in, on, at"
        glue: true
      - lemma: "a"
        pos: "prep"
        en: "to, at"
        glue: true
      - lemma: "allá"
        pos: "adv"
        en: "over there"
      - lemma: "ahí"
        pos: "adv"
        en: "there"
      - lemma: "cerca"
        pos: "adv"
        en: "near, close"
      - lemma: "lejos"
        pos: "adv"
        en: "far"
  - ordinal: 4
    slug: "donde-estan-las-llaves"
    title: "Find your things"
    summary: "¿Dónde están mis llaves?"
    grammar:
      - "estar.pres.1sg-3sg"
      - "estar.ubicacion"
      - "articulo.definido"
      - "estar.pres.3pl"
    register_max: "informal"
    sample:
      es: "¿Dónde están mis llaves? Están en la mochila."
      en: "Where are my keys? They're in the backpack."
    tips:
      - title: "Está, están"
        body: "One thing **está**, more than one **están**: *¿Dónde está mi celu?* — *¿Dónde están mis
          anteojos?* The answer drops the thing you're looking for: **Están en la mochila.**"
      - title: "Arriba, abajo, adentro"
        body: "Three words that need nothing after them: **arriba** (up, upstairs), **abajo** (down,
          downstairs), **adentro** (inside). *Estoy abajo* is what a porteño texts from the street
          when they're at your door. The fourth one is **afuera** — *outside*: *mi auto está
          afuera*."
      - title: "En casa"
        body: "No *la* before home: **estoy en casa**, *I'm at home*. With anything else you need *el* or
          *la*: *en la mochila*, *en el auto*."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "están"
            en: "they are, you (pl.) are"
            f: "3pl.pres.ind"
      - lemma: "casa"
        pos: "noun"
        en: "house, home"
      - lemma: "celu"
        pos: "noun"
        en: "phone, cell phone"
        register: "informal"
      - lemma: "llave"
        pos: "noun"
        en: "key"
        forms:
          - form: "llave"
            f: "f.sg"
          - form: "llaves"
            en: "keys"
            f: "f.pl"
      - lemma: "anteojos"
        pos: "noun"
        en: "glasses"
      - lemma: "billetera"
        pos: "noun"
        en: "wallet"
      - lemma: "mochila"
        pos: "noun"
        en: "backpack"
      - lemma: "compu"
        pos: "noun"
        en: "computer, laptop"
        note: "short for computadora"
        register: "informal"
      - lemma: "auto"
        pos: "noun"
        en: "car"
      - lemma: "arriba"
        pos: "adv"
        en: "up, upstairs"
      - lemma: "abajo"
        pos: "adv"
        en: "down, downstairs"
      - lemma: "adentro"
        pos: "adv"
        en: "inside"
      - lemma: "cargador"
        pos: "noun"
        en: "charger"
        forms:
          - form: "cargador"
          - form: "cargadores"
            en: "chargers"
            f: "m.pl"
      - lemma: "mío"
        pos: "adj"
        en: "mine"
        forms:
          - form: "mío"
            en: "mine"
          - form: "mía"
            en: "mine"
      - lemma: "tuyo"
        pos: "adj"
        en: "yours"
        forms:
          - form: "tuyo"
            en: "yours"
          - form: "tuya"
            en: "yours"
  - ordinal: 5
    slug: "hay-un-kiosco"
    title: "Say what there is around you"
    summary: "Hay un kiosco"
    grammar:
      - "hay"
      - "contraccion.del-al"
    register_max: "informal"
    sample:
      es: "Hay una parada del bondi en la esquina."
      en: "There is a bus stop on the corner."
    tips:
      - title: "Hay or está"
        body: "**Hay** introduces something: *Hay un kiosco* — there's a kiosco. **Está** says where
          something you already know about is: *El kiosco está en la esquina.*"
      - title: "Del and al"
        body: "*de + el* always becomes **del**, and *a + el* becomes **al**: *la parada del bondi*, *de acá
          al kiosco*. With *la* nothing joins: *a la parada*."
      - title: "El bondi"
        body: "**Bondi** is the everyday word for the city bus; *colectivo* is the neutral one. The
          **subte** is the Buenos Aires underground."
    words:
      - lemma: "haber"
        pos: "verb"
        en: "to have (+ past participle); there to be (hay)"
        forms:
          - form: "hay"
            en: "there is, there are"
            f: "3sg.pres.ind"
      - lemma: "del"
        pos: "det"
        en: "of the"
        glue: true
      - lemma: "al"
        pos: "det"
        en: "to the"
        glue: true
      - lemma: "bondi"
        pos: "noun"
        en: "bus"
        register: "informal"
      - lemma: "colectivo"
        pos: "noun"
        en: "bus"
      - lemma: "subte"
        pos: "noun"
        en: "subway, metro"
        note: "Short for subterráneo. Only Buenos Aires has a subte; lines are letters (A, B, C...)."
      - lemma: "parada"
        pos: "noun"
        en: "bus stop"
      - lemma: "cuadra"
        pos: "noun"
        en: "city block"
        forms:
          - form: "cuadra"
            f: "f.sg"
          - form: "cuadras"
            en: "blocks"
            f: "f.pl"
        note: "Argentines give directions and distances in cuadras (about 100 m each)."
      - lemma: "esquina"
        pos: "noun"
        en: "corner"
      - lemma: "calle"
        pos: "noun"
        en: "street"
  - ordinal: 6
    slug: "hay-un-tren"
    title: "Find your way around the city"
    summary: "¿Hay una estación por acá?"
    grammar:
      - "hay"
      - "contraccion.del-al"
    register_max: "informal"
    sample:
      es: "¿Hay una estación de tren por acá?"
      en: "Is there a train station around here?"
    tips:
      - title: "Por acá"
        body: "**Por acá** is *around here*, the end of every question on the street: *¿Hay un bar por acá?*
          *¿Hay un taxi por acá?* The answer is usually a finger and *a dos cuadras*."
      - title: "Hay gente"
        body: "**Hay** works for things you can't count, too: **hay gente** — there are people. *Gente* is
          singular in Spanish: *la gente está en la plaza*."
      - title: "Al parque, del subte"
        body: "The same two joins as before: *a la plaza* but **al** parque, **al** hospital; *la estación
          **del** subte*, *la parada **del** bondi*."
    words:
      - lemma: "tren"
        pos: "noun"
        en: "train"
      - lemma: "estación"
        pos: "noun"
        en: "station"
      - lemma: "línea"
        pos: "noun"
        en: "subway line, bus route"
        note: "Subte lines are letters (la línea B); buses are numbers (la línea 60, or just 'el 60')."
      - lemma: "taxi"
        pos: "noun"
        en: "taxi"
      - lemma: "avenida"
        pos: "noun"
        en: "avenue"
      - lemma: "plaza"
        pos: "noun"
        en: "park, square"
        note: "A plaza is usually a green block with trees, benches and a playground, more like a small
          park."
      - lemma: "parque"
        pos: "noun"
        en: "park"
      - lemma: "hospital"
        pos: "noun"
        en: "hospital"
      - lemma: "bar"
        pos: "noun"
        en: "bar, café"
        note: "An Argentine bar is often a café: coffee, medialunas and food all day, not just drinks."
      - lemma: "gente"
        pos: "noun"
        en: "people"
      - lemma: "por acá"
        pos: "phrase"
        en: "around here"
      - lemma: "malo"
        pos: "adj"
        en: "bad"
        forms:
          - form: "malo"
            f: "m.sg"
          - form: "mala"
            f: "f.sg"
      - lemma: "bueno"
        pos: "adj"
        en: "good"
        forms:
          - form: "buena"
            en: "good"
            f: "f.sg"
          - form: "buenos"
            en: "good"
            f: "m.pl"
  - ordinal: 7
    slug: "adonde-vas"
    title: "Say where you're going"
    summary: "¿Adónde vas? Voy a la plaza"
    grammar:
      - "ir.pres"
      - "ir-a.lugar"
      - "contraccion.del-al"
    register_max: "informal"
    sample:
      es: "¿Adónde vas? Voy a la plaza"
      en: "Where are you going? I'm going to the square."
    tips:
      - title: "Voy, vas, va"
        body: "**Ir** — *to go* — looks nothing like its forms: **voy**, **vas**, **va**, **vamos**,
          **van**. Spanish uses one form for *I go* and *I'm going*: *Voy a la plaza* is both. And
          **vamos** on its own also means *let's go*."
      - title: "Always with a"
        body: "Going somewhere takes **a** — *to* — every time: *Voy a la plaza.* The question word has that
          **a** built in: **¿adónde vas?** is *where are you going to?* English often drops the
          *to*; Spanish never drops the **a**. **A + el** becomes **al**: *voy al kiosco*, but *vas
          a la estación*."
    words:
      - lemma: "ir"
        pos: "verb"
        en: "to go"
        forms:
          - form: "ir"
            f: "inf"
          - form: "voy"
            en: "I go, I'm going"
            f: "1sg.pres.ind"
          - form: "vas"
            en: "you go, you're going"
            f: "2sg.pres.ind.vos"
          - form: "va"
            en: "goes (he/she goes)"
            f: "3sg.pres.ind"
          - form: "vamos"
            en: "we go, let's go"
            f: "1pl.pres.ind"
          - form: "van"
            en: "they go"
            f: "3pl.pres.ind"
      - lemma: "adónde"
        pos: "adv"
        en: "where (to)"
  - ordinal: 8
    slug: "practica-por-aca"
    title: "Practice: people and places"
    summary: "Mis hermanos están en la plaza"
    grammar:
      - "repaso.ser-estar"
      - "repaso.hay"
    register_max: "informal"
    sample:
      es: "Mis hermanos son simpáticos y están en la plaza."
      en: "My brothers are nice and they're in the square."
    tips:
      - title: "Son or están"
        body: "**Son** says what people are like: *son altos*, *son simpáticos*. **Están** says where they
          are: *están en la plaza*. The same people, two verbs."
      - title: "Hay or está"
        body: "**Hay** for something new: *hay una estación por acá*. **Está** for the one you already mean:
          *la estación está en la avenida*."
    review:
      - "rubia"
      - "simpáticos"
      - "altos"
      - "llaves"
      - "mochila"
      - "arriba"
      - "estación"
      - "tren"
      - "somos"
      - "tienen"
      - "esquina"
      - "lejos"
  - ordinal: 9
    slug: "como-estas"
    title: "Say how you feel"
    summary: "¿Cómo estás?"
    grammar:
      - "estar.estado"
      - "estar.pres.1pl-3pl"
      - "adj.estado.genero"
      - "porque"
      - "medio.atenuador"
    register_max: "informal"
    sample:
      es: "¿Cómo estás? Medio cansada, pero bien."
      en: "How are you? Kind of tired, but OK."
    tips:
      - title: "Estar, and ¿por qué?"
        body: "Use **estar** for how you are right now: *estoy cansado*, *¿estás nerviosa?* To ask why:
          **¿por qué?** — two words. The answer is **porque**, one word: *Porque Sofi está
          enferma.*"
      - title: "Medio"
        body: "**Medio** in front of an adjective softens it — *estoy medio cansado*, I'm kind of tired. It
          never changes: *medio cansada* too."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estamos"
            en: "we are"
            f: "1pl.pres.ind"
      - lemma: "cansado"
        pos: "adj"
        en: "tired"
        forms:
          - form: "cansado"
            f: "m.sg"
          - form: "cansada"
            f: "f.sg"
          - form: "cansados"
            f: "m.pl"
          - form: "cansadas"
            f: "f.pl"
      - lemma: "contento"
        pos: "adj"
        en: "happy, glad"
        forms:
          - form: "contento"
