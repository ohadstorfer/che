      en: "I sell newspapers and magazines in my dad's shop."
    tips:
      - title: "-er or -ir: two places to tell"
        body: "-er and -ir verbs only differ for **vos** and **nosotros**: *vendés, vendemos* but
          *compartís, compartimos*. Everywhere else they match: *come, comparte*; *comen, leen,
          escriben*."
      - title: "Abre, recibe"
        body: "**Abrir** and **recibir** are regular: *abro, abrís, abre*; *recibo, recibís, recibe*. *¿El
          negocio abre a la noche?* **Recibir a** someone is to have them over: *recibo a mi
          suegra*."
      - title: "El negocio"
        body: "**Negocio** is any shop, not just a business: *el negocio de la esquina*. And porteños
          **comparten** everything, from an apartment to a mate. *Con mi hermano vendemos empanadas*
          means *my brother and I sell* — two people, not three."
