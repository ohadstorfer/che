    register_max: "informal"
    sample:
      es: "¿Cuándo cierra el kiosco? A las ocho menos cuarto."
      en: "When does the kiosco close? At a quarter to eight."
    tips:
      - title: "Menos cuarto"
        body: "After half past, porteños count down to the next hour: **las ocho menos cuarto** is *7:45*,
          *las nueve menos diez* is *8:50*. On the hour exactly: **a las diez en punto**."
      - title: "Desde las nueve hasta las seis"
        body: "Opening hours are **desde** … **hasta**: *abre desde las nueve hasta las seis*. Shorter, and
          more common: *abre **de** nueve **a** seis*. At twelve it's **el mediodía** — and plenty
          of small shops **cierran** for a while right after it. With **desde**, Spanish uses the
          present: *estoy acá desde las ocho* = I've been here since eight."
    words:
