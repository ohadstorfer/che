  - ordinal: 2
    slug: "el-barrio"
    title: "Find your way around the barrio"
    summary: "El barrio"
    grammar:
      - "preposiciones.lugar"
      - "al-lado-de"
      - "enfrente-de"
      - "entre"
    register_max: "informal"
    sample:
      es: "Hay una panadería al lado de la farmacia."
      en: "There's a bakery next to the pharmacy."
    tips:
      - title: "Where things are"
        body: "**al lado de** (next to), **enfrente de** (across from), **atrás de** (behind), **adelante
          de** (in front of), **entre** (between). Careful: *enfrente* is across the street, not *in
          front*. Remember *de + el* = *del*: *al lado del kiosco*. With no place after them, drop
          the *de*: *está enfrente*, *vivo al lado*."
