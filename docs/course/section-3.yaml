      es: "Ese buzo gris es re cómodo."
      en: "That grey sweatshirt is really comfortable."
    tips:
      - title: "Colors that don't change"
        body: "*Amarillo* works like *rojo*: **amarilla, amarillos**. But **gris** and **marrón** are the
          same for *el* and *la* — *un buzo gris*, *una campera gris* — and only add *-es* for more
          than one: *unas zapatillas grises*."
      - title: "Me queda bien"
        body: "To say how clothes fit, use **me queda**: *Esta camisa me queda bien* — *this shirt fits me
          well*. *Me queda chico* — *it's too small for me*. *El vestido me queda grande* — *the
          dress is too big for me*."
      - title: "Talle"
        body: "Your clothing size is your **talle**: *¿Qué talle usás?* (you'll also hear *¿Qué talle sos?*)
          Argentine sizes run small, so ask to try it on before you pay: **¿Puedo probarme esto?**"
