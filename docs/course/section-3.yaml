    register_max: "informal"
    sample:
      es: "Esta campera es nueva"
      en: "This jacket is new"
    tips:
      - title: "Un pantalón, un jean"
        body: "One pair of pants is **un pantalón** — singular: *Mi pantalón es nuevo.* *Los pantalones*
          works too. The same goes for **un jean**. And **ropa** — *clothes* — is always singular:
          *Mi ropa es nueva.*"
      - title: "Nuevo, nueva"
        body: "The adjective copies its noun: *una campera nueva*, *un jean nuevo*, *los pantalones chicos*.
          **Grande** has one form for both: *una remera grande*, *las zapatillas grandes*.
          Adjectives usually come after the noun, not before as in English. With *¡Qué…!* both
          orders work: *¡Qué linda remera!*, *¡Qué campera fea!*"
    words:
