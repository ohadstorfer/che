  - ordinal: 5
    slug: "preferis-salir"
    title: "Choose where to go out"
    summary: "¿Preferís el teatro o el cine?"
    grammar:
      - "querer.pres"
      - "poder.pres"
      - "ir.pres"
      - "ir-a.lugar"
      - "salir.pres"
      - "diptongo.e-ie.o-ue"
    register_max: "informal"
    sample:
      es: "¿Preferís ir al teatro o al cine?"
      en: "Would you rather go to the theatre or the cinema?"
    tips:
      - title: "Prefiero, preferís"
        body: "Same trick as *quiero, querés*: the stem stretches in most forms — **prefiero**, **vuelvo**,
          **empieza** — but vos keeps it short: **preferís**, **volvés**, **empezás**."
      - title: "Pienso ir, creo que…"
        body: "**Pienso** + verb is *I plan to*: *pienso ir al cine*, *¿pensás salir hoy?* **Creo que** … is
          *I think that* …: *creo que está cerrado*, *¿creés que abre hoy?* And **no creo** is *I
          don't think so*."
    words:
      - lemma: "preferir"
        pos: "verb"
        en: "to prefer"
        forms:
          - form: "prefiero"
            en: "I prefer"
            f: "1sg.pres.ind.irregular"
          - form: "preferís"
            en: "you prefer"
            f: "2sg.pres.ind.vos"
          - form: "prefiere"
            en: "prefers (he/she prefers)"
            f: "3sg.pres.ind.irregular"
      - lemma: "volver"
        pos: "verb"
        en: "to come back, to go back"
        forms:
          - form: "vuelvo"
            en: "I come back"
            f: "1sg.pres.ind.irregular"
          - form: "volvés"
            en: "you come back"
            f: "2sg.pres.ind.vos"
          - form: "vuelve"
            en: "comes back (he/she comes back)"
            f: "3sg.pres.ind.irregular"
          - form: "volver"
            en: "to come back, to go back"
            f: "inf"
            note: "volver a + verb = to do again: vuelvo a llamar = I'll call again."
        note: "volver a + verb = to do again: volvió a llover = it rained again."
      - lemma: "empezar"
        pos: "verb"
        en: "to start"
        forms:
