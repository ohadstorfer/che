  - ordinal: 9
    slug: "tomar-el-bondi"
    title: "Take the bondi and the subte"
    summary: "Cargo la SUBE y me bajo en la próxima"
    grammar:
      - "ir-a.lugar"
      - "bajarse.pres.1sg"
      - "faltar.pres.3"
    register_max: "informal"
    sample:
      es: "¿Dónde cargo la SUBE? No tengo saldo."
      en: "Where do I top up my SUBE? I'm out of credit."
    tips:
      - title: "No cash on the bondi"
        body: "You can't pay the driver in cash. You tap a **SUBE** card on the reader — on buses, the subte
          and trains (many now take a bank card or phone too). You load it at a kiosco or a subte
          station: *¿Me cargás la SUBE?* When the **saldo** runs out, load it again."
      - title: "Tell the driver where you're going"
        body: "On a colectivo the **boleto** — the fare — depends on how far you go, so you tell the driver
          first (*hasta Palermo*) and then tap. Not sure it's the right bus? *¿Va a Palermo?*"
      - title: "Me bajo en la próxima"
        body: "**Me bajo en la próxima** — *I'm getting off at the next stop*. Don't know the stop?
          *¿Cuántas paradas faltan?* or simply *¿Me avisás?* In the subte, changing lines is a
          **combinación**, and you wait on the **andén**."
