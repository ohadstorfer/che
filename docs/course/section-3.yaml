  - ordinal: 1
    slug: "tengo-una-reserva"
    title: "Check in at a hotel or hostel"
    summary: "Tengo una reserva"
    grammar:
      - "tener.pres.1sg"
      - "hay"
      - "a-nombre-de"
    register_max: "informal"
    sample:
      es: "Hola, tengo una reserva a nombre de Lucía."
      en: "Hi, I have a booking under the name Lucía."
    tips:
      - title: "Tengo una reserva"
        body: "At the front desk one line does it: **tengo una reserva a nombre de** … and your name. They
          will ask for your **pasaporte**. Staying two nights? *Dos noches.*"
      - title: "Check-in, check-out"
        body: "Hotels and hostels use the English words: **el check-in** and **el check-out**. To ask the
          time: *¿A qué hora es el check-out?*"
      - title: "¿Está incluido?"
        body: "Ask before you pay: *¿El desayuno está incluido?* *¿Hay wifi?* *¿Hay toallas?* An **alquiler
          temporario** is an apartment you rent for a few days or weeks — what the booking apps
          offer all over Buenos Aires."
