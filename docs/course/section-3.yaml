    title: "Say what color things are"
    summary: "¿De qué color es la campera?"
    grammar:
      - "adj.concordancia"
      - "ser.descripcion"
      - "demostrativos.este-ese"
      - "re.intensificador"
    register_max: "informal"
    sample:
      es: "¿De qué color es la campera?"
      en: "What colour is the jacket?"
    tips:
      - title: "Colors match the noun"
        body: "Colors match their noun like any adjective: *un pantalón negro*, *una remera negra*,
          *zapatillas negras*. Ones ending in *-e* or a consonant only change for more than one:
          *verde* → **verdes**, *azul* → **azules**. The color comes after the noun."
      - title: "The black one"
        body: "To say *the black one*, drop the noun and keep **el** or **la**: *¿El negro o el azul?* —
          *the black one or the blue one?* *Quiero la roja* — *I want the red one*. The same works
          with *este* and *ese*: *Quiero este* — *I want this one*."
      - title: "Es lindo, está lindo"
        body: "With **ser** an adjective says what something is like; with **estar**, how it is right now.
          *Esa remera **es** linda* — it is a nice T-shirt. *¡**Estás** linda!* — you look nice
          today. *El café de acá **es** rico* — *este café **está** rico*. And **ser listo** is *to
          be clever*, while **estar listo** is *to be ready*."
    words:
