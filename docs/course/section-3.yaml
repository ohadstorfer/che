  - ordinal: 24
    slug: "clima"
    title: "Talk about the weather"
    summary: "Hace calor y hay mucho sol"
    grammar:
      - "hace-calor-frio"
      - "esta-nublado"
      - "llueve"
      - "estaciones"
    register_max: "informal"
    sample:
      es: "Hace un calor bárbaro hoy."
      en: "It's really hot today."
    tips:
      - title: "Weather with hacer"
        body: "**Hace calor**, **hace frío** — it's hot, it's cold. But **hay sol**, **hay viento**, **está
          nublado**, and **llueve** alone (for right now you'll also hear *está lloviendo*). You
          yourself **tenés frío**. Seasons are flipped: *el verano* runs from late December to
          March. **Bárbaro** means *great*, not barbaric: *¡Bárbaro!* — Great! *Hay un sol bárbaro*
          — it's really sunny."
    words:
