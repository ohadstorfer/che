    register_max: "informal"
    sample:
      es: "Voy a Thames y Gorriti. Dejame en la esquina."
      en: "I'm going to Thames and Gorriti. Drop me at the corner."
    tips:
      - title: "Two streets, not a number"
        body: "Porteños give the driver a corner, not a house number: *Voy a Thames y Gorriti.* Near the end
          you guide: *acá a la derecha*, **dejame acá**, *en la esquina está bien*."
      - title: "Taxi, remis, app"
        body: "A taxi is black and yellow; you stop it in the street when the red *libre* sign is lit:
          *¿Está libre?* A **remis** is a car you book by phone at a fixed price. Most people now
          use an app: *pido un auto por la app*. A taxi driver is a **tachero**."
      - title: "¿Cuánto sale hasta…?"
        body: "With a remis, ask the price before you get in: *¿Cuánto sale hasta el aeropuerto?* In a taxi
          the meter decides. Paying cash, people round up: **quedate con el vuelto** — *keep the
          change*."
