  - ordinal: 23
    slug: "pasame-tu-numero"
    title: "Swap numbers and WhatsApp"
    summary: "¿Me pasás tu número? Te escribo"
    grammar:
      - "enclitico.me-te"
      - "imperativo.vos.afirmativo"
    register_max: "informal"
    sample:
      es: "¿Me pasás tu número? Te mando un mensaje."
      en: "Can you give me your number? I'll send you a message."
    tips:
      - title: "¿Me pasás tu número?"
        body: "This is the normal way to ask for someone's number — friendly, not pushy. They may say
          **agendame** — *save my number* — and read it out. You answer: *te agendo*."
      - title: "Te escribo"
        body: "Everything runs on WhatsApp: plans, shops, even the doctor. **Te escribo** — *I'll text you*;
          **mandame un mensaje**; **llamame**. On Instagram: **seguime** — *follow me*."
      - title: "Chip y datos"
        body: "For a local number you buy a **chip** — a SIM card — at a phone shop or a kiosco (take your
          passport: they may ask for it), and then you load **datos**: *cargar datos*, the same verb
          as loading the SUBE. *No tengo datos* means no internet until the next wifi."
    words:
      - lemma: "teléfono"
        pos: "noun"
        en: "telephone, phone number"
      - lemma: "WhatsApp"
        pos: "propn"
        en: "WhatsApp"
      - lemma: "pasar"
        pos: "verb"
        en: "to pass, to come in"
        forms:
          - form: "me pasás"
