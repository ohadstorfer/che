  - ordinal: 4
    slug: "queres-podes-vas"
    title: "Say what you can and want to do"
    summary: "¿Querés salir? Hoy no puedo."
    grammar:
      - "querer.pres"
      - "poder.pres"
      - "ir.pres"
      - "ir-a.lugar"
      - "salir.pres"
    register_max: "informal"
    sample:
      es: "¿Querés salir? Hoy no puedo."
      en: "Do you want to go out? I can't today."
    tips:
      - title: "No stem change with vos"
        body: "*Querer* and *poder* change their stem in most forms (*quiero*, *puede*) — but not with vos:
          **querés**, **podés**. *Ir* is fully irregular: *voy, vas, va, vamos, van*."
      - title: "Voy a + verb"
        body: "For a plan, use **ir a** + the verb as it is: **voy a salir**, **¿qué vas a hacer?**, **vamos
          a comer**. It is how porteños talk about the future almost all the time."
      - title: "Si"
        body: "**Si** is *if* — no accent, unlike *sí*. After it comes the plain present: **Si querés, vamos
          al cine.** **Si podés, salimos a la noche.**"
    words:
      - lemma: "poder"
        pos: "verb"
        en: "to be able to, can"
        forms:
