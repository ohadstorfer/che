  - ordinal: 12
    slug: "este-y-ese"
    title: "Point at things: this one, that one"
    summary: "Esa mochila es re linda"
    grammar:
      - "demostrativos.este-ese"
      - "demostrativos.neutro"
      - "re.intensificador"
    register_max: "informal"
    sample:
      es: "Esa mochila es re linda"
      en: "That backpack is really nice"
    tips:
      - title: "Este here, ese there"
        body: "**Este** is *this*, near you; **ese** is *that*, further away. Both match the noun: **este**
          café, **esa** mochila, and **estos**, **estas**, **esos**, **esas** for more than one.
          *Esa mochila es re linda* — **re** before an adjective is the porteño *really*."
      - title: "Esto and eso"
        body: "When you don't know the word — or don't need it — use **esto** (this thing here) and **eso**
          (that thing there). They never change and no noun comes after them: *Quiero eso, por
          favor.*"
