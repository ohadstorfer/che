      en: "Help! Call an ambulance, please."
    tips:
      - title: "The numbers to call"
        body: "In Buenos Aires **911** is the police and **107** is the ambulance. In the street, shout
          **¡ayuda!** and tell someone what to do: **llamá a la policía**, *llamá una ambulancia*.
          *Es urgente.*"
      - title: "Me perdí, me robaron"
        body: "Learn these two whole — they are in the past, which the course teaches later. **Me perdí** —
          *I got lost*; right now you are **perdido** or **perdida**. **Me robaron** — *I got
          robbed*: *me robaron el celu*."
      - title: "¡Cuidado!"
        body: "**¡Cuidado!** is *watch out!* — a car, a step, a wet floor. To get help fast, say what you
          need: *necesito un médico*, *¿hay un hospital cerca?*"
