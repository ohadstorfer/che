  - ordinal: 2
    slug: "a-que-hora-abre"
    title: "Ask when places open"
    summary: "¿A qué hora abre?"
    grammar:
      - "hora.es-la-son-las"
      - "hora.y-media-y-cuarto"
      - "numeros.21-100"
      - "dias.semana"
      - "hora.desde-hasta"
    register_max: "informal"
    sample:
      es: "¿Cuándo cierra el kiosco? A las ocho menos cuarto."
      en: "When does the kiosco close? At a quarter to eight."
    tips:
      - title: "Menos cuarto"
        body: "After half past, porteños count down to the next hour: **las ocho menos cuarto** is
          *7:45*, *las nueve menos diez* is *8:50*. On the hour exactly: **a las diez en punto**."
      - title: "Desde las nueve hasta las seis"
        body: "Opening hours are **desde** … **hasta**: *abre desde las nueve hasta las seis*. At twelve
          it's **el mediodía** — and plenty of small shops **cierran** for a while right after it."
    words:
