    register_max: "informal"
    sample:
      es: "¿Me cobrás? No tengo cambio, pago con tarjeta."
      en: "Can I pay? I don't have change, I'll pay by card."
    tips:
      - title: "¿Me cobrás?"
        body: "To pay, you don't say *I want to pay*: you ask them to charge you — **¿me cobrás?** The
          change they give back is **el vuelto**; small coins and bills are **cambio**. **Cobrar**
          is also *to get paid*: *¿Cuándo cobrás?* — *when do you get paid?*"
      - title: "Thousands"
        body: "Prices in Argentina run to thousands: **dos mil**, **quince mil**, **cien mil** — *mil* never
          takes an *s*. A **millón** does: *dos millones* — and takes **de** before the thing: *un
          millón de pesos*."
