    register_max: "informal"
    sample:
      es: "No tengo efectivo. ¿Te transfiero o pago con QR?"
      en: "I don't have cash. Shall I transfer it to you or pay by QR?"
    tips:
      - title: "¿Débito o crédito?"
        body: "The question at every till. With **crédito** comes a second one: *¿en cuántas cuotas?* — how
          many monthly payments. *En una cuota* is all at once; **sin interés** means no extra
          charge. Not sure they take cards? *¿Puedo pagar con tarjeta?*"
      - title: "Te transfiero"
        body: "Paying by bank transfer is normal, in shops and between friends: **te transfiero**. You ask
          for the **alias**, the short name of the other person's account. Or you scan a **QR** with
          your phone — most people use the Mercado Pago app for it."
      - title: "Lucas and dólares"
        body: "Prices run to thousands, so a thousand pesos has a short name: **una luca**, *diez lucas*. To
          **cambiar dólares**, first ask the rate: *¿A cuánto está el dólar?* And cash often gets a
          better price: *¿Hay descuento en efectivo?*"
