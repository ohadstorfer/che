  - ordinal: 7
    slug: "practica-a-la-vuelta"
    title: "Practice: times, places and plans"
    summary: "Abre a las diez y está a la vuelta"
    grammar:
      - "repaso.hora"
      - "repaso.preposiciones.lugar"
      - "repaso.querer-poder-ir"
    register_max: "informal"
    sample:
      es: "¿Querés ir al museo? Abre a las diez y está a la vuelta."
      en: "Do you want to go to the museum? It opens at ten and it's around the corner."
    tips:
      - title: "When, where, who's in"
        body: "Making a plan takes three questions: **¿a qué hora?**, **¿dónde?** and **¿querés?**
          *Nos vemos a las nueve menos cuarto enfrente del cine, ¿podés?*"
      - title: "Vos keeps it short"
        body: "Every stretchy verb stays short with vos: **querés, podés, preferís, volvés**. If you
          hear *quieres* or *puedes*, that's not Buenos Aires."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
