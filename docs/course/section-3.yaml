    register_max: "informal"
    sample:
      es: "Me despierto temprano, pero a veces duermo la siesta."
      en: "I wake up early, but sometimes I have a nap."
    tips:
      - title: "Me despierto, se despiertan"
        body: "Waking up and getting up are two verbs: **me despierto** at seven, **me levanto** at
          seven-thirty. With vos the stem doesn't change: **te despertás**. The little word follows
          the person: *me, te, se, nos* — and **se** again for *ellos*: **se levantan**, **se
          acuestan**."
      - title: "Me voy"
        body: "*Voy* is where you're going; **me voy** is that you're leaving: *me voy a las ocho*. *¿Te
          vas?* — *Sí, me voy.* And when someone is slow to leave: **¡Dale, apurate!** — *come on,
          hurry up!*"
      - title: "La siesta"
        body: "**Dormir** stretches like *poder*: **duermo**, but **dormís**. And **la siesta** after lunch
          is still sacred in much of the country — less so in Buenos Aires. Around five comes the
          fourth meal: to **merendar** — mate or coffee with something sweet."
