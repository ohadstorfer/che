      en: "On Saturdays I get up late."
    tips:
      - title: "Reflexive verbs"
        body: "*Me levanto, te levantás, se levanta* — the pronoun comes before the verb and matches the
          person. **Los sábados** means *on Saturdays*."
    words:
      # A pronominal verb is taught as the chunk, never as the bare stem: a
      # card for "levanto" would have to say "(I) get up" and the parenthesis
      # is the half the Spanish word does not carry. docs/course-spec.md §1.5.
      - lemma: "levantarse"
        pos: "verb"
        en: "to get up"
        forms:
          - form: "me levanto"
            en: "I get up"
            f: "1sg.pres.ind.clitic"
          - form: "te levantás"
            en: "you get up"
            f: "2sg.pres.ind.vos.clitic"
          - form: "se levanta"
            en: "he gets up, she gets up"
            f: "3sg.pres.ind.clitic"
          - form: "nos levantamos"
            en: "we get up"
            f: "1pl.pres.ind.clitic"
          - form: "levanto"
            f: "1sg.pres.ind"
            bound: true
          - form: "levantás"
            f: "2sg.pres.ind.vos"
            bound: true
          - form: "levanta"
            f: "3sg.pres.ind"
            bound: true
          - form: "levantamos"
            f: "1pl.pres.ind"
            bound: true
      - lemma: "acostarse"
        pos: "verb"
        en: "to go to bed"
        forms:
          - form: "me acuesto"
            en: "I go to bed"
            f: "1sg.pres.ind.clitic"
          - form: "te acostás"
            en: "you go to bed"
            f: "2sg.pres.ind.vos.clitic"
          - form: "se acuesta"
            en: "he goes to bed, she goes to bed"
            f: "3sg.pres.ind.clitic"
          - form: "acuesto"
            f: "1sg.pres.ind"
            bound: true
          - form: "acostás"
            f: "2sg.pres.ind.vos"
            bound: true
          - form: "acuesta"
            f: "3sg.pres.ind"
            bound: true
      # Teaching the chunk also settles a collision: "baño" on its own is the
      # bathroom, and the course had two cards for the same string saying
      # different things.
