            en: "I start"
            f: "1sg.pres.ind.irregular"
          - form: "empezás"
            en: "you start"
            f: "2sg.pres.ind.vos"
          - form: "empieza"
            en: "starts (it starts)"
            f: "3sg.pres.ind.irregular"
          - form: "empiezan"
            en: "start (they start)"
            f: "3pl.pres.ind.irregular"
          - form: "empezar"
            en: "to start"
            f: "inf"
      - lemma: "teatro"
        pos: "noun"
        en: "theater"
      - lemma: "museo"
