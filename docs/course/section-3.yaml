  - ordinal: 25
    slug: "en-febrero"
    title: "Talk about the months and the heat"
    summary: "En febrero hay mucha humedad"
    grammar:
      - "hace-calor-frio"
      - "esta-nublado"
      - "llueve"
      - "estaciones"
      - "meses"
    register_max: "informal"
    sample:
      es: "En febrero hace mucho calor y hay mucha humedad."
      en: "In February it's very hot and it's really humid."
    tips:
      - title: "Mucho calor, mucha humedad"
        body: "With weather, *very* is **mucho**, not *muy*, because *calor* and *frío* are nouns: **hace
          mucho calor**, **hay mucha humedad** — *mucha* because *humedad* is feminine."
      - title: "Months and degrees"
        body: "Months have no capital: **en marzo**, **en diciembre**. Temperature is **grados**: *hace
          treinta grados* is a normal January day, and porteños blame everything on **la humedad**.
          Argentina uses Celsius: *35 grados* is very hot (95°F), and *1 grado* is almost freezing.
          With **desde** or **hace** + a time, Spanish uses the present: *vivo acá hace dos meses* —
          I've been living here for two months."
    words:
      - lemma: "mucho"
        pos: "det"
        forms:
          - form: "mucho"
            en: "a lot, a lot of"
            f: "m.sg"
          - form: "mucha"
            en: "a lot of"
            f: "f.sg"
