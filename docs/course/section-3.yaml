    register_max: "informal"
    sample:
      es: "¿Preferís ir al teatro o al cine?"
      en: "Would you rather go to the theatre or the cinema?"
    tips:
      - title: "Prefiero, preferís"
        body: "Same trick as *quiero, querés*: the stem stretches in most forms — **prefiero**,
          **vuelvo**, **empieza** — but vos keeps it short: **preferís**, **volvés**, **empezás**."
      - title: "¿A qué hora empieza?"
        body: "For a film, a show or a party, ask **¿a qué hora empieza?** Porteños go out late: a
          **fiesta** that *empieza a las doce* is a normal Saturday, and you **volvés** at six."
    words:
      - lemma: "preferir"
        pos: "verb"
        en: "to prefer, would rather"
        forms:
          - form: "prefiero"
            en: "I prefer"
            f: "1sg.pres.ind.irregular"
          - form: "preferís"
            en: "you prefer"
            f: "2sg.pres.ind.vos"
          - form: "prefiere"
