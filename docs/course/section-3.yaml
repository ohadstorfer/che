  - ordinal: 22
    slug: "me-interesa"
    title: "Say what interests you and what you hate"
    summary: "Me encanta viajar, a él le gusta nadar"
    grammar:
      - "gustar.infinitivo"
      - "encantar"
      - "tambien-tampoco"
      - "gustar.le-nos-les"
    register_max: "informal"
    sample:
      es: "Me encanta viajar, pero no me interesa la playa."
      en: "I love travelling, but I'm not into the beach."
    tips:
      - title: "Le gusta, nos gusta, les gusta"
        body: "The verb stays the same; only the little word changes with the person: **me** gusta, **te**
          gusta, **le** gusta, **nos** gusta, **les** gusta. *A mi hermano le gusta nadar.*"
      - title: "Me interesa"
        body: "**Interesar** works exactly like *gustar*: **me interesa el tenis**, **no me interesan los
          deportes**. **Odiar** doesn't — it's a normal verb: **odio madrugar**."
    words:
