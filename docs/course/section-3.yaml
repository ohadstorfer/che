      es: "Seguí derecho dos cuadras y doblá a la izquierda."
      en: "Go straight on for two blocks and turn left."
    tips:
      - title: "Directions are commands"
        body: "Same recipe as *mirá* and *vení*: drop the *-r*, stress the end. **Doblá**, **cruzá**,
          **caminá**, **preguntá**. *Seguir* says *sigo*, but its command is regular: **seguí**."
      - title: "Bajate, subite"
        body: "On the bondi, getting on and off carries a *te* on the end: **subite** (get on),
          **bajate en la esquina** (get off at the corner). And **pará** stops anyone: *¡pará, pará!*"
      - title: "¿A qué altura?"
        body: "Porteños give an address as street and number — *Corrientes 1500* — and ask **¿a qué
          altura?** to know which block. The number goes up about a hundred every **cuadra**."
