    register_max: "informal"
    sample:
      es: "Mirá esa campera roja: está en oferta y sale veinte mil."
      en: "Look at that red jacket: it's on sale and it costs twenty thousand."
    tips:
      - title: "Esa campera, ese buzo"
        body: "The word for *that* matches the thing: **esa campera**, **ese buzo**, **esas zapatillas**.
          When you point without naming it, **eso** never changes."
      - title: "Commands in the shop"
        body: "The vos command is everywhere in a shop: **mirá**, **fijate**, **esperame**, **tomá** —
          *tomá, tu vuelto*. Drop the *-r* and stress the last vowel of the verb: *mirá*, *tomá*.
          With *me* or *te* added, the stress stays there: *fijate* (fi-JA-te), *esperame*
          (es-pe-RA-me)."
    review:
      - "seguí"
      - "doblá"
      - "bajate"
