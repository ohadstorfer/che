  - ordinal: 3
    slug: "a-la-vuelta"
    title: "Say what's around the corner"
    summary: "A la vuelta, a la derecha"
    grammar:
      - "preposiciones.lugar"
      - "al-lado-de"
      - "enfrente-de"
      - "entre"
      - "a-la-derecha"
    register_max: "informal"
    sample:
      es: "La carnicería está a la vuelta, al lado del almacén."
      en: "The butcher's is around the corner, next to the corner shop."
    tips:
      - title: "A la derecha, a la izquierda"
        body: "Left and right both take **a la**: **a la derecha**, **a la izquierda**. To say what
          something is left or right of, add **de**: *la farmacia está a la derecha del banco*."
      - title: "A la vuelta"
        body: "**A la vuelta** is *around the corner* — on the next street, not this one. **En la otra
          vereda** is *across the street*: *la panadería está en la otra vereda*."
      - title: "The shops of a barrio"
        body: "Many shops are their product plus **-ería**: *carne* → **carnicería**, *pan* → *panadería*.
          The **almacén** is the old corner shop that sells a bit of everything."
    words:
      - lemma: "derecha"
        pos: "noun"
        en: "right (side)"
      - lemma: "izquierda"
        pos: "noun"
        en: "left (side)"
      - lemma: "a la vuelta"
        pos: "phrase"
        en: "around the corner"
      - lemma: "vereda"
