  - ordinal: 6
    slug: "practica-a-la-vuelta"
    title: "Practice: times, places and plans"
    summary: "Abre a las diez y está a la vuelta"
    grammar:
      - "repaso.hora"
      - "repaso.preposiciones.lugar"
      - "repaso.querer-poder-ir"
    register_max: "informal"
    sample:
      es: "¿Querés ir al museo? Abre a las diez y está a la vuelta."
      en: "Do you want to go to the museum? It opens at ten and it's around the corner."
    tips:
      - title: "When, where, who's in"
        body: "Making a plan takes three questions: **¿a qué hora?**, **¿dónde?** and **¿querés?** *Nos
          vemos a las nueve menos cuarto enfrente del cine, ¿podés?*"
      - title: "Vos keeps it short"
        body: "Every stretchy verb stays short with vos: **querés, podés, preferís, volvés**. If you hear
          *quieres* or *puedes*, that's not Buenos Aires."
    review:
      - "cierra"
      - "mediodía"
      - "cuarto/noun"
      - "izquierda"
      - "vereda"
      - "enfrente"
      - "preferís"
      - "vuelvo"
      - "podés"
      - "teatro"
      - "esquina"
      - "quiere"
      - "lejos"
  - ordinal: 7
    slug: "dale-veni"
    title: "Tell a friend what to do"
    summary: "Dale, vení"
    grammar:
      - "imperativo.vos.afirmativo"
      - "enclitico.me-te"
    register_max: "informal"
    sample:
      es: "Vení, sentate, tomamos unos mates."
      en: "Come on, sit down, let's have some mate."
    tips:
      - title: "Vos commands"
        body: "Drop the final *-r* and stress the last vowel: *mirar* → **mirá**, *venir* → **vení**.
          Pronouns stick to the end: **sentate**, **decime**, **esperame**."
      - title: "The short ones"
        body: "A few commands you will hear all day: *go* is **andá**; *hacer* gives **hacé**; *dar* gives
          **dame** — *give me*. The same recipe makes the rest: **poné** (put), **tené** (have,
          hold), **decí** (say), **salí** (go out). Never *ve, haz, pon, di* — those belong to
          another Spanish."
    words:
      - lemma: "mirar"
        pos: "verb"
        en: "to look, to watch"
        forms:
          - form: "mirá"
            en: "look"
            f: "2sg.imp.vos"
      - lemma: "venir"
        pos: "verb"
        en: "to come"
        forms:
          - form: "vení"
            en: "come"
            f: "2sg.imp.vos"
          - form: "venir"
            en: "to come"
            f: "inf"
      - lemma: "escuchar"
        pos: "verb"
        en: "to listen, to hear"
        forms:
          - form: "escuchá"
            en: "listen"
            f: "2sg.imp.vos"
        note: "In Argentina escuchar is the normal word for 'hear' too: no te escucho = I can't hear
          you."
      - lemma: "hablar"
        pos: "verb"
        forms:
          - form: "hablá"
            en: "speak, talk"
            f: "2sg.imp.vos"
      - lemma: "decir"
        pos: "verb"
        en: "to say, to tell"
        forms:
          - form: "decime"
            en: "tell me"
            f: "2sg.imp.vos.clitic"
          - form: "decir"
            en: "to say, to tell"
            f: "inf"
      - lemma: "andar"
        pos: "verb"
        en: "to go around, to be (lately); to work (machines); to ride"
        forms:
          - form: "andá"
            en: "go"
            f: "2sg.imp.vos"
        note: "No anda = it doesn't work. ¿Cómo andás? = how are you? Andar en bici = to ride a bike."
      - lemma: "esperar"
        pos: "verb"
        en: "to wait, to hope, to expect"
        forms:
          - form: "esperá"
            en: "wait"
            f: "2sg.imp.vos"
          - form: "esperame"
            en: "wait for me"
            f: "2sg.imp.vos.clitic"
          - form: "esperar"
            en: "to wait"
            f: "inf"
      - lemma: "pasar"
        pos: "verb"
        en: "to pass, to happen, to come in, to come by"
        forms:
          - form: "pasá"
            en: "come in"
            f: "2sg.imp.vos"
          - form: "pasar"
            en: "to pass, to come by"
            f: "inf"
        note: "Also 'to send, to give': pasame tu número = give me your number."
      - lemma: "sentarse"
        pos: "verb"
        en: "to sit down"
        forms:
          - form: "sentate"
            en: "sit down"
            f: "2sg.imp.vos.clitic"
      - lemma: "fijarse"
        pos: "verb"
        en: "to check, to notice"
        forms:
          - form: "fijate"
            en: "check, look"
            f: "2sg.imp.vos.clitic"
      - lemma: "tomar"
