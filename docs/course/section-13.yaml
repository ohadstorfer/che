      en: "The neighborhood changed a lot."
    tips:
      - title: "Ya no"
        body: "**Ya no** is *not anymore*: **ya no vivo ahí**. **Cada vez más** — *more and more*: **cada
          vez más caro**; **cada vez menos** — *less and less*."
      - title: "Creció"
        body: "**Crecer** is *to grow* — a city, a kid, a tree: **el barrio creció**, **crecí en
          Rosario** — *I grew up in Rosario*. Porteños also say **me crié**: *me crié en Flores* — *I
          grew up in Flores*. The new towers are **edificios**."
      - title: "Antes… ahora"
        body: "To say how things changed, set **antes** + the *-aba / -ía* past against **ahora** +
          the present: *antes era tranquilo, ahora hay mucho ruido*; *antes costaba poco, ahora es
          carísimo*."
