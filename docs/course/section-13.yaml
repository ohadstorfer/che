  - ordinal: 6
    slug: "el-cuarto-oscuro"
    title: "Go and vote"
    summary: "¿Dónde votás el domingo?"
    grammar:
      - "votar"
      - "politica.sin-politica"
    register_max: "informal"
    sample:
      es: "¿Dónde votás el domingo?"
      en: "Where do you vote on Sunday?"
    tips:
      - title: "¿Dónde votás?"
        body: "Election day is a Sunday, and everyone asks **¿dónde votás?** You check the **padrón** — *the
          voter roll* — for your school and your **mesa**. **Votamos** in the school around the corner;
          **mi abuela votó a las ocho**, first in line."
      - title: "El cuarto oscuro"
        body: "The booth is the **cuarto oscuro** — *the dark room* — where you pick your **boleta** and drop
          it in the **urna**. The **voto** is secret. If nobody wins outright, there's a **balotaje** — *a
          runoff*. Missed it? You have to **justificar** why."
      - title: "Las encuestas"
        body: "Before, the **campaña**, the **debate** on TV and the **encuestas** — *the polls* — that always
          get it wrong. After, the **resultado**. The course stays out of who won."
    words:
      - lemma: "votar"
        pos: "verb"
        forms:
          - form: "votás"
            en: "you vote"
            f: "2sg.pres.ind.vos"
          - form: "votamos"
            en: "we vote"
            f: "1pl.pres.ind"
          - form: "votó"
            en: "voted (he/she)"
            f: "3sg.pret.ind"
      - lemma: "voto"
        pos: "noun"
        en: "vote"
      - lemma: "padrón"
        pos: "noun"
        en: "voter roll, electoral register"
      - lemma: "cuarto oscuro"
        pos: "phrase"
        en: "voting booth"
      - lemma: "boleta"
        pos: "noun"
        en: "ballot paper"
      - lemma: "urna"
