        body: "Things at home break on their own, with **se**: **se tapó el inodoro** — *the toilet's
          blocked*; **se trabó el ascensor** — *the lift got stuck*; **se cortó el agua**. Nobody did it —
          it just **se rompió**."
      - title: "¿A quién llamo?"
        body: "Each problem has its person: the **plomero** for a **canilla** that **gotea** — *a dripping
          tap* — the **gasista** for the calefón, the **encargado** for the **portero eléctrico**. A
          **filtración** from the flat upstairs goes to the **administración**, and takes months."
