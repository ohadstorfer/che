  - ordinal: 25
    slug: "lo-lindo-de-la-ciudad"
    title: "Say what you love about the city"
    summary: "Lo lindo es que siempre hay algo"
    grammar:
      - "lo.adjetivo"
      - "repaso.c1"
    register_max: "informal"
    sample:
      es: "Lo lindo de la ciudad es que siempre hay algo para hacer."
      en: "The nice thing about the city is there's always something to do."
    tips:
      - title: "Lo lindo, lo feo"
        body: "Put **lo** in front of an adjective and it becomes *the … thing*: **lo lindo** — *the nice
          thing*; **lo feo** — *the ugly part*; **lo difícil** — *the hard part*; **lo único** — *the only
          thing*: **lo único que extraño es el mar**."
      - title: "Lo más lindo"
        body: "**Lo más** + adjective is *the most … thing*: **lo más lindo del barrio es la
          plaza**. Weighing it up, porteños say the city **tiene sus cosas** — *has its issues*: the
          **inseguridad**, the **costo de vida** — but the **calidad de vida**, **a la vez**, is hard to
          beat."
    words:
      - lemma: "lo lindo"
        pos: "phrase"
        en: "the nice thing, the great thing"
      - lemma: "lo feo"
        pos: "phrase"
        en: "the ugly part, the bad side"
      - lemma: "lo difícil"
        pos: "phrase"
