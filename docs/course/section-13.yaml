            en: "we hand in, we handed in"
            f: "1pl.pret.ind"
          - form: "entregaste"
            en: "you handed in"
            f: "2sg.pret.ind.vos"
      - lemma: "informe"
        pos: "noun"
        en: "report"
      - lemma: "presentación"
        pos: "noun"
        en: "presentation"
      - lemma: "borrador"
        pos: "noun"
        en: "draft"
      - lemma: "corregir"
        pos: "verb"
        en: "to correct"
        forms:
