        en: "ballot box"
      - lemma: "balotaje"
        pos: "noun"
        en: "runoff (election)"
      - lemma: "justificar"
        pos: "verb"
        en: "to justify, to give a reason (for not voting)"
        forms:
          - form: "justificar"
            f: "inf"
      - lemma: "campaña"
        pos: "noun"
        en: "campaign"
      - lemma: "debate"
        pos: "noun"
        en: "debate"
      - lemma: "encuesta"
        pos: "noun"
        en: "poll, survey"
        forms:
          - form: "encuesta"
            f: "sg"
          - form: "encuestas"
            en: "polls, surveys"
            f: "pl"
      - lemma: "resultado"
        pos: "noun"
        en: "result"
        forms:
          - form: "resultado"
            f: "sg"
          - form: "resultados"
            en: "results"
            f: "pl"

