      - lemma: "versión"
        pos: "noun"
        en: "version, account"
      - lemma: "oficial"
        pos: "adj"
        en: "official"
      - lemma: "cadena"
        pos: "noun"
        en: "chain message"

  - ordinal: 11
    slug: "me-robaron"
    title: "Report a theft"
    summary: "Me robaron el celu"
    grammar:
      - "robar"
      - "seguridad"
    register_max: "lunfardo"
    sample:
      es: "Me robaron el celu en el bondi."
      en: "My phone got stolen on the bus."
    tips:
      - title: "Me robaron"
        body: "**Me robaron el celu** — *my phone got stolen*, literally *they stole the phone from me*.
          The thief is a **chorro** in lunfardo, a **ladrón** in the news."
      - title: "La denuncia"
        body: "To report it you **hacés la denuncia** at the **comisaría**, or online. The **policía**
          rarely finds the phone; the denuncia is for the insurance and the new SIM."
    words:
      - lemma: "robar"
        pos: "verb"
        en: "to steal, to rob"
        forms:
          - form: "me robaron"
            en: "they stole (from me), I got robbed"
            f: "3pl.pret.ind.clitic"
          - form: "robaron"
            f: "3pl.pret.ind"
            bound: true
      - lemma: "chorro"
        pos: "noun"
        en: "thief"
        register: "lunfardo"
        forms:
          - form: "chorro"
            f: "m.sg"
          - form: "chorros"
            en: "thieves"
            f: "m.pl"
      - lemma: "ladrón"
        pos: "noun"
        en: "robber"
      - lemma: "denuncia"
        pos: "noun"
        en: "police report, complaint"
      - lemma: "comisaría"
        pos: "noun"
        en: "police station"

  - ordinal: 12
    slug: "me-afanaron"
    title: "Tell how you got conned"
    summary: "Me afanaron la billetera"
    grammar:
      - "robar"
      - "seguridad"
    register_max: "lunfardo"
    sample:
      es: "Me descuidé un minuto y me afanaron la billetera."
      en: "I looked away for a minute and my wallet got nicked."
    tips:
      - title: "Me afanaron, nos robaron"
        body: "Among friends it's **me afanaron** — *they nicked it* — with the same *they* that nobody
          names. It moves with the victim: **te robaron**, **le robaron a mi vieja**, **nos robaron la
          bici**. The **motochorro** does it from a motorbike."
      - title: "El cuento del tío"
