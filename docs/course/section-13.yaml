  - ordinal: 9
    slug: "sobre-la-hora"
    title: "Move a deadline"
    summary: "Postergaron la fecha: entregamos el lunes"
    grammar:
      - "laburo.proyecto"
    register_max: "informal"
    sample:
      es: "Entregamos el informe sobre la hora."
      en: "We handed in the report right at the deadline."
    tips:
      - title: "Entregamos, entregaste"
        body: "The **plazo** moves: they **postergaron la fecha** — *pushed the date back* — or, worse, **la
          adelantaron**. Then it's **horas extra** until **entregamos** — *we hand it in* (also *we
          handed it in*). And the boss asks: **¿ya lo entregaste?**"
      - title: "Sobre la hora"
        body: "**Sobre la hora** — *right at the deadline, at the very last minute* — is how most porteño
          projects get done. First a **borrador** — *a draft* — then you **corregir** it, and only
          then the **informe** or the **presentación**. **¿Avanzaron?** — *any progress?*"
    words:
      - lemma: "entregar"
        pos: "verb"
        forms:
