        body: "More verbs that take a **la** pointing at nothing: **me la juego** — *I'll go for it*; **la
          pifié** — *I blew it* — and its opposite, **la pegaste** — *you got it right*; **la
          rompe** — *she's amazing at it*; **se la agarró conmigo** — *he took it out on me* (he got
          angry at me, though it wasn't my fault). **Me las tomo** — *I'm out of here*. And to make
          someone stop: **¡cortala!** — *cut it out!*"
      - title: "A las apuradas, a la larga"
        body: "Two fixed phrases to learn whole: **a las apuradas** — *in a rush* — and **a la larga** — *in
          the long run*. Here *las* and *la* are just *the*, not the idiom's *la*: *salí a las
          apuradas y me olvidé las llaves*."
