      en: "I've been a club member since I was a kid."
    tips:
      - title: "Hinchamos por el mismo"
        body: "**Hinchar por** runs in the family: **en casa hinchamos todos por el mismo cuadro**; **de
          chico hinchaba por otro, pero mi viejo no me dejó**. A fan **de toda la vida** never changes
          club — changing wife is easier, they say."
      - title: "Ser socio"
        body: "To go to the **estadio** you're **socio** — *a member* — of the **club**, and pay the cuota.
          The **hinchada** sings its **cantitos** for ninety minutes, under the **banderas**. Away fans?
          Banned for years: you only go **de visitante** on TV."
      - title: "El ídolo"
        body: "Every club has its **ídolo**, the **jugador** whose shirt the kids wear. And every fan fears
          one word: the **descenso** — *relegation*."
