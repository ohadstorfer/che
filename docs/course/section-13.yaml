        body: "**Paro docente**, **suspendieron el servicio**, **hubo desvíos** — and the city **a pie**."
      - title: "Fue clausurado, ¿dónde votás?"
        body: "**Fue clausurado**, **fueron rescatados**: **fue** + a participle that agrees. And on Sunday,
          **¿dónde votás?**"
