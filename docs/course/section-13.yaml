  - ordinal: 13
    slug: "lo-bueno-de-vivir-aca"
    title: "Weigh up the city"
    summary: "Lo bueno de Buenos Aires es la gente"
    grammar:
      - "lo.adjetivo"
      - "repaso.c1"
    register_max: "informal"
    sample:
      es: "Lo bueno de Buenos Aires es la gente."
      en: "The good thing about Buenos Aires is the people."
    tips:
      - title: "Lo bueno, lo malo"
        body: "**Lo** + adjective is *the … thing*: **lo bueno** — *the good thing*; **lo malo** — *the
          bad thing*; **lo mejor** and **lo peor**. **Lo bueno de vivir acá es que…**"
      - title: "No hay nada como…"
        body: "**No hay nada como** — *there's nothing like*: **no hay nada como un asado con amigos**."
    words:
      - lemma: "lo bueno"
        pos: "phrase"
        en: "the good thing"
      - lemma: "lo malo"
        pos: "phrase"
        en: "the bad thing"
      - lemma: "lo mejor"
        pos: "phrase"
        en: "the best thing, the best part"
      - lemma: "lo peor"
        pos: "phrase"
        en: "the worst thing, the worst part"
      - lemma: "no hay nada como"
        pos: "phrase"
        en: "there's nothing like"
