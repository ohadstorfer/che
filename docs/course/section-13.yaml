  - ordinal: 3
    slug: "fue-construido"
    title: "Read the news"
    summary: "El puente fue construido hace un siglo"
    grammar:
      - "voz-pasiva.ser"
      - "noticias"
    register_max: "informal"
    sample:
      es: "El puente fue construido hace un siglo."
      en: "The bridge was built a century ago."
    tips:
      - title: "Fue construido"
        body: "The news likes the passive: **fue** + participle. **El puente fue construido en 1900**;
          **la estación fue inaugurada ayer**. The participle agrees like an adjective: *construido,
          construida*."
      - title: "Fueron detenidos"
        body: "More than one: **fueron detenidos** — *they were arrested*. In conversation porteños turn
          it around: *construyeron el puente*, *los detuvieron*."
    words:
      - lemma: "construir"
        pos: "verb"
        en: "to build"
        forms:
          - form: "construido"
            en: "built"
            f: "part"
          - form: "construida"
            en: "built"
            f: "part.f.sg"
      - lemma: "inaugurar"
        pos: "verb"
        en: "to open, to inaugurate"
        forms:
          - form: "inaugurado"
            en: "opened"
            f: "part"
          - form: "inaugurada"
            en: "opened"
            f: "part.f.sg"
      - lemma: "detener"
        pos: "verb"
        en: "to arrest"
        forms:
          - form: "detenidos"
            en: "arrested"
            f: "part.m.pl"
      - lemma: "puente"
        pos: "noun"
        en: "bridge"
      - lemma: "siglo"
        pos: "noun"
        en: "century"

  - ordinal: 4
    slug: "fue-clausurado"
    title: "Read the headlines"
    summary: "El boliche fue clausurado"
    grammar:
      - "voz-pasiva.ser"
      - "noticias"
    register_max: "informal"
    sample:
      es: "Los vecinos fueron rescatados por los bomberos."
      en: "The neighbors were rescued by the firefighters."
    tips:
      - title: "Fue clausurado, fueron rescatados"
        body: "The headline verb agrees with what it's about: **el boliche fue clausurado**, **la obra fue
          clausurada**, **los vecinos fueron rescatados**, **las vecinas fueron rescatadas**. Whoever did
          it comes after **por**: *por los bomberos*."
      - title: "Hubo un incendio"
        body: "The news opens with **hubo**: **hubo un incendio**, **hubo un accidente en la avenida**, **hubo
          dos heridos** — who then **fueron trasladados al hospital**. At the kitchen table the same story
          loses the passive: *trasladaron a los heridos*."
      - title: "Fue elegida"
        body: "Not only bad news: **la pizzería fue elegida la mejor del barrio**, **la ley fue aprobada**,
          **el chico fue elegido para el equipo**. Same pattern: **fue** + a participle that agrees."
    words:
      - lemma: "clausurar"
        pos: "verb"
        en: "to close down (by order)"
        forms:
          - form: "clausurado"
            en: "closed down"
            f: "part"
          - form: "clausurada"
            en: "closed down"
            f: "part.f.sg"
      - lemma: "rescatar"
        pos: "verb"
        en: "to rescue"
        forms:
