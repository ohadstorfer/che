  - ordinal: 8
    slug: "practica-el-cuarto-oscuro"
    title: "Practice: strikes, headlines and the ballot"
    summary: "Hubo desvíos por la marcha"
    grammar:
      - "repaso.ciudad"
      - "repaso.voz-pasiva"
    register_max: "informal"
    sample:
      es: "Hubo un incendio y dos vecinos fueron trasladados al hospital."
      en: "There was a fire and two neighbors were taken to hospital."
    tips:
