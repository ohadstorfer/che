  - ordinal: 9
    slug: "segun-el-diario"
    title: "Say where you heard it"
    summary: "Según el diario, mañana llueve"
    grammar:
      - "fuentes"
      - "rumor"
    register_max: "informal"
    sample:
      es: "Según el diario, mañana llueve."
      en: "According to the paper, it's raining tomorrow."
    tips:
      - title: "Según"
        body: "**Según** — *according to*: **según el diario**, **según mi vieja**. **Al parecer** and
          **supuestamente** keep a distance from what you're passing on."
      - title: "¿Está confirmado?"
        body: "A **rumor** is just that until someone **confirma**: *el club confirmó la noticia*. Or
          as porteños say about any rumor: **dicen que…**"
    words:
      - lemma: "según"
        pos: "prep"
        en: "according to"
      - lemma: "al parecer"
        pos: "phrase"
        en: "by all accounts"
      - lemma: "supuestamente"
        pos: "adv"
        en: "supposedly"
      - lemma: "confirmar"
        pos: "verb"
        en: "to confirm"
        forms:
          - form: "confirmó"
            en: "confirmed"
            f: "3sg.pret.ind"
          - form: "confirmaron"
            en: "they confirmed"
            f: "3pl.pret.ind"
      - lemma: "rumor"
        pos: "noun"
        en: "rumor"

  - ordinal: 10
    slug: "aparentemente"
    title: "Check whether it's true"
    summary: "Aparentemente es falso"
    grammar:
      - "fuentes"
      - "rumor"
    register_max: "informal"
    sample:
      es: "Aparentemente es falso: lo desmintieron."
      en: "Apparently it's fake: they denied it."
    tips:
      - title: "Según quién"
        body: "**Según** takes people as well as papers: **según él**, **según ellos**, **según la fuente**.
          **Aparentemente** is the neutral *apparently*; **se ve que** is what you conclude from what you
          see: **se ve que llovió** — *it must have rained*."
      - title: "Lo desmintieron"
        body: "A story is **confirmado** or it's **desmentido**: **el gremio desmintió el rumor**, **lo
          desmintieron en el noticiero**. Before you forward it, ask **¿cuál es la fuente?** — the
          **titular** says one thing, the **versión oficial** another."
      - title: "Me llegó una cadena"
        body: "The family WhatsApp group sends a **cadena** — *a chain message* — every morning. **Chequeá la
          fuente** before you believe it."
    words:
      - lemma: "aparentemente"
        pos: "adv"
        en: "seemingly"
      - lemma: "se ve que"
        pos: "phrase"
        en: "it looks like, it must be that"
      - lemma: "desmentir"
        pos: "verb"
        en: "to deny, to refute"
        forms:
          - form: "desmintió"
            en: "denied (he/she/it)"
            f: "3sg.pret.ind.irregular"
          - form: "desmintieron"
            en: "they denied"
            f: "3pl.pret.ind.irregular"
      - lemma: "fuente"
