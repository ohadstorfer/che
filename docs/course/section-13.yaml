# ---------------------------------------------------------------------------
# Che — Section 13 outline: "The news and the street" (C1.2)
#
# Public life in Buenos Aires, told the way porteños tell it: strikes and
# road blocks (hoy hay paro), the passive of the news (fue construido), voting
# without the politics, rumors and sources (según el diario), getting robbed
# and reporting it, the building and its expensas, the team you root for, the
# tango, the parrilla — and a checkpoint that weighs up the city (lo bueno de
# vivir acá).
#
# Plan: docs/course/roadmap.md §Section 13.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 13
  slug: "news-and-the-street"
  title: "The news and the street"
  cefr: "C1.2"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "hay-paro"
    title: "Find out why nothing's running"
    summary: "Hoy hay paro de subte"
    grammar:
      - "ciudad.paro"
      - "funcionar"
    register_max: "informal"
    sample:
      es: "Hoy hay paro de subte."
      en: "There's a subway strike today."
    tips:
      - title: "Hay paro"
        body: "A strike is a **paro**: **hay paro de subte**, **paro de colectivos**. When protesters block
          a street it's a **piquete** or a **corte**, and the street **está cortada**. A **marcha** is a
          march."
      - title: "No funciona"
        body: "**Funcionar** is *to work* for things: **el subte no funciona**, **los semáforos no
          funcionan**. For people, it's still *laburar*."
    words:
      - lemma: "paro"
        pos: "noun"
        en: "strike"
      - lemma: "corte"
        pos: "noun"
        en: "roadblock, road closure; power cut"
      - lemma: "piquete"
        pos: "noun"
        en: "picket, road blockade"
      - lemma: "marcha"
        pos: "noun"
        en: "march, demonstration"
      - lemma: "cortado"
        pos: "adj"
        en: "blocked, closed (a street)"
        forms:
          - form: "cortada"
            f: "f.sg"

  - ordinal: 2
    slug: "paro-docente"
    title: "Plan around a strike"
    summary: "Mañana hay paro docente"
    grammar:
      - "ciudad.paro"
      - "funcionar"
    register_max: "informal"
    sample:
      es: "Mañana hay paro docente y no hay clases."
      en: "There's a teachers' strike tomorrow and no school."
    tips:
      - title: "Paro docente, paro general"
        body: "A strike is named after who stops: **paro docente** — *the teachers*; **paro de
          colectivos** — the **colectiveros**; **paro general** — everyone. The **gremio** — *the union* —
          **anunció un paro** for Thursday, and the news calls it a **medida de fuerza**."
      - title: "¿Funciona o no?"
        body: "The morning after, the question is what still runs: **el subte funciona con normalidad**, or
          **suspendieron el servicio**. **Hubo un apagón** — *there was a blackout* — and the traffic
          lights are out: **embotellamiento**, **desvíos**, and half the city goes **a pie**."
    words:
      - lemma: "docente"
        pos: "noun"
        en: "educator, teaching staff"
        forms:
          - form: "docente"
            f: "sg"
          - form: "docentes"
            en: "teachers, educators"
            f: "pl"
      - lemma: "gremio"
        pos: "noun"
        en: "union, trade union"
      - lemma: "colectivero"
        pos: "noun"
        en: "bus driver"
        forms:
