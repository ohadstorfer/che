            en: "he asked (me) to get, she asked (me) to do"
            f: "3sg.pret.ind"
          - form: "encargar"
            f: "inf"
      - lemma: "portarse"
        pos: "verb"
        en: "to behave"
        forms:
          - form: "portate"
            en: "behave"
            f: "2sg.imp.vos.clitic"
          - form: "me portara"
            en: "(that) I behaved; (to) behave"
            f: "sg.impf.subj.clitic"
          - form: "portara"
            f: "sg.impf.subj"
            bound: true
      - lemma: "de parte de"
        pos: "phrase"
        en: "on behalf of"
  - ordinal: 3
    slug: "me-pregunto-si"
    title: "Ask whether"
    summary: "Me preguntó si venía"
    grammar:
      - "discurso-referido.pregunta"
      - "si.interrogativo"
    register_max: "informal"
    sample:
      es: "Me preguntó si venía."
      en: "He asked me if I was coming."
    tips:
      - title: "Si = whether"
        body: "A yes-or-no question told later hangs on **si**: «¿Venís?» → **me preguntó si venía**. *No sé
          si abre hoy* — *I don't know if it's open today*. **Dudo** — *I doubt it*."
      - title: "A ver si…"
        body: "**A ver si** is *let's see if* — and, just as often, a hope: **a ver si nos juntamos** — *we
          should get together sometime*. To find something out, porteños **averiguan**. After **dudo
          que**, the verb goes in the subjunctive: **dudo que venga** — *I doubt he'll come*."
    words:
      - lemma: "a ver si"
        pos: "phrase"
        en: "let's see if"
      - lemma: "averiguar"
        pos: "verb"
        en: "to find out, to look into"
        forms:
          - form: "averiguar"
            f: "inf"
          - form: "averiguo"
            en: "I'll find out, I find out"
            f: "1sg.pres.ind"
          - form: "averiguá"
            en: "find out"
            f: "2sg.imp.vos"
      - lemma: "dudar"
        pos: "verb"
        en: "to doubt"
        forms:
          - form: "dudo"
            en: "I doubt"
            f: "1sg.pres.ind"
          - form: "dudás"
            en: "you doubt"
            f: "2sg.pres.ind.vos"
      - lemma: "me preguntó si"
        pos: "phrase"
        en: "he asked me if, she asked me if"
      - lemma: "no sé si"
        pos: "phrase"
        en: "I don't know if"
  - ordinal: 4
    slug: "fijate-si-tienen"
    title: "Check before you go"
    summary: "Fijate si tienen stock"
    grammar:
      - "discurso-referido.pregunta"
      - "si.interrogativo"
    register_max: "informal"
    sample:
      es: "Preguntale si tienen stock antes de ir."
      en: "Ask them if they have it in stock before we go."
    tips:
      - title: "Fijate si…"
        body: "Before you cross the city, you check: **fijate si abren el feriado**, **me fijo si hay
          turno**, **preguntale si tienen stock**. The **si** is *whether*; the verb after it stays
          normal."
      - title: "Me preguntaron si…"
        body: "Told later, the question moves into the past with its **si**: «¿Tenés turno?» → **me
          preguntaron si tenía turno**."
    words:
      - lemma: "preguntar"
        pos: "verb"
        forms:
          - form: "preguntale"
            en: "ask him, ask her"
            f: "2sg.imp.vos.clitic"
          - form: "preguntaron"
            en: "they asked"
            f: "3pl.pret.ind"
      - lemma: "fijarse"
        pos: "verb"
        forms:
          - form: "me fijo"
            en: "I'll check, I'll have a look"
            f: "1sg.pres.ind.clitic"
          - form: "te fijás"
            en: "you check, you have a look"
            f: "2sg.pres.ind.vos.clitic"
      - lemma: "averiguar"
        pos: "verb"
        forms:
          - form: "averiguaste"
            en: "you looked into it"
            f: "2sg.pret.ind.vos"
          - form: "averigüé"
            en: "I looked into it"
            f: "1sg.pret.ind"
      - lemma: "consultar"
        pos: "verb"
        en: "to ask about, to check with"
        forms:
          - form: "consultar"
            f: "inf"
          - form: "consulté"
            en: "I consulted, I checked with"
            f: "1sg.pret.ind"
      - lemma: "chequear"
        pos: "verb"
        en: "to check, to double-check"
        forms:
          - form: "chequear"
            f: "inf"
          - form: "chequeá"
            en: "check"
            f: "2sg.imp.vos"
      - lemma: "disponible"
        pos: "adj"
        en: "available"
      - lemma: "stock"
        pos: "noun"
        en: "goods on hand, inventory"
      - lemma: "en persona"
        pos: "phrase"
        en: "in person"
      - lemma: "fijate si"
        pos: "phrase"
        en: "check if, see if"
  - ordinal: 5
    slug: "practica-como-no"
    title: "Practice: errands, checking and being polite"
    summary: "Me preguntaron si tenía turno"
    grammar:
      - "repaso.discurso-referido"
      - "repaso.cortesia"
    register_max: "informal"
    sample:
      es: "Mi vieja me encargó que comprara pan."
      en: "My mum asked me to buy bread."
    tips:
      - title: "Comprara, llegáramos, trajeran"
        body: "The errand told later: **me pidió que comprara pan**, **nos dijo que llegáramos temprano**,
          **les pidió que trajeran algo**. The question: **preguntale si tienen stock**."
      - title: "Cómo no, faltaba más"
        body: "With older neighbors like **don José** and **doña Marta** you still say vos, but warmly:
          **cómo no** — *of course*; **faltaba más** — *of course, don't mention it*; **dejá, te doy
          una mano** — *leave it, I'll give you a hand*."
    review:
