# ---------------------------------------------------------------------------
# Che — Section 12 outline: "In other words" (C1.1)
#
# Passing on what other people said and asked (me pidió que le trajera algo,
# me preguntó si venía), asking strangers and older neighbours politely in vos,
# writing the email that goes with it, telling how a story turned out
# (resulta que, encima), the porteño "la" expressions (se la cree, me la
# banco), what just happened and what usually does (acabo de, suelo), how the
# city has changed, being fed up, and a checkpoint that tells the whole story
# short.
#
# Plan: docs/course/roadmap.md §Section 12.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 13
  slug: "in-other-words"
  title: "In other words"
  cefr: "B2.3"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "me-pidio-que"
    title: "Pass on what someone asked"
    summary: "Me pidió que le trajera algo"
    grammar:
      - "discurso-referido.pedido"
      - "subjuntivo.imperfecto"
    register_max: "informal"
    sample:
      es: "Me pidió que le trajera algo."
      en: "She asked me to bring her something."
    tips:
      - title: "Me pidió que…"
        body: "A request told later takes the past subjunctive: «Traeme pan» → **me pidió que le
          trajera pan**; «Esperen» → **nos dijo que esperáramos**. *Dijo que* + subjunctive is an
          order; *dijo que* + indicative is news. In everyday speech you will also hear the present:
          *me pidió que le **traiga** algo*. Both are fine."
      - title: "Insistió, sugirió"
        body: "**Insistió en que fuera** — *she insisted I go*. **Me sugirió que la llamara** — *he
          suggested I call her*. Same pattern: the verb after **que** in the past subjunctive."
    words:
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "trajera"
            en: "(that) I brought, (that) he brought; (to) bring"
            f: "sg.impf.subj.irregular"
          - form: "trajeras"
            en: "(that) you brought; (to) bring"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejara"
            en: "(that) I left, (that) he let; (to) leave, (to) let"
            f: "sg.impf.subj"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperáramos"
            en: "(that) we waited; (to) wait"
            f: "1pl.impf.subj"
      - lemma: "insistir"
        pos: "verb"
        en: "to insist"
        forms:
          - form: "insistió"
            en: "he insisted, she insisted"
            f: "3sg.pret.ind"
          - form: "insisto"
            en: "I insist"
            f: "1sg.pres.ind"
      - lemma: "sugerir"
        pos: "verb"
        en: "to suggest"
        forms:
          - form: "sugirió"
            en: "he suggested, she suggested"
            f: "3sg.pret.ind.irregular"
          - form: "sugiero"
            en: "I suggest"
            f: "1sg.pres.ind.irregular"
      - lemma: "aclarar"
        pos: "verb"
        en: "to make clear, to clarify"
        forms:
          - form: "aclaró"
            en: "he made clear, she made clear"
            f: "3sg.pret.ind"
          - form: "aclarar"
            f: "inf"

  - ordinal: 2
    slug: "me-encargo-que"
    title: "Pass on a list of errands"
    summary: "Mi vieja me pidió que comprara pan"
    grammar:
      - "discurso-referido.pedido"
      - "subjuntivo.imperfecto"
    register_max: "informal"
    sample:
      es: "Mi vieja me pidió que comprara pan y que sacara la basura."
      en: "My mum asked me to buy bread and take out the trash."
    tips:
      - title: "Comprara, sacara, cerrara"
        body: "Any *-ar* verb works the same way: take the *ellos* past (*compraron*), swap **-ron** for
          **-ra**. «Comprá pan» → **me pidió que comprara pan**; «Cerrá la puerta» → **me dijo que
          cerrara la puerta**; «Apagá la luz» → **que apagara la luz**."
      - title: "Llegáramos, trajeran"
        body: "The other persons follow: **nos pidió que llegáramos temprano** — *she asked us to get there
          early*; **les dijo que trajeran algo** — *he told them to bring something*. **Me encargó que
          le llevara** is the errand version: *she asked me to take her…*"
      - title: "De parte de…"
        body: "Passing on a message ends with who it's from: **saludos de parte de mi vieja**. And the
          classic order from home, told later: «Portate bien» → **me dijo que me portara bien**."
    words:
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "comprara"
            en: "(that) I bought, (that) he bought; (to) buy"
            f: "sg.impf.subj"
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevara"
            en: "(that) I took, (that) he took; (to) take"
            f: "sg.impf.subj"
      - lemma: "sacar"
        pos: "verb"
        forms:
          - form: "sacara"
            en: "(that) I took out, (that) he took out; (to) take out"
            f: "sg.impf.subj"
      - lemma: "apagar"
        pos: "verb"
        forms:
          - form: "apagara"
            en: "(that) I turned off, (that) he turned off; (to) turn off"
            f: "sg.impf.subj"
      - lemma: "cerrar"
        pos: "verb"
        forms:
          - form: "cerrara"
            en: "(that) I closed, (that) he closed; (to) close"
            f: "sg.impf.subj.irregular"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegáramos"
            en: "(that) we arrived; (to) get there"
            f: "1pl.impf.subj"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "trajeran"
            en: "(that) they brought; (to) bring"
            f: "3pl.impf.subj.irregular"
      - lemma: "encargar"
        pos: "verb"
        en: "to ask (someone) to get or do something, to order"
        forms:
          - form: "encargó"
            en: "he asked (me) to get, she asked (me) to do"
            f: "3sg.pret.ind"
          - form: "encargar"
            f: "inf"
      - lemma: "portarse"
        pos: "verb"
        en: "to behave"
        forms:
          - form: "portate"
            en: "behave"
            f: "2sg.imp.vos.clitic"
          - form: "me portara"
            en: "(that) I behaved; (to) behave"
            f: "sg.impf.subj.clitic"
          - form: "portara"
            f: "sg.impf.subj"
            bound: true
      - lemma: "de parte de"
        pos: "phrase"
        en: "on behalf of"

  - ordinal: 3
    slug: "me-pregunto-si"
    title: "Ask whether"
    summary: "Me preguntó si venía"
    grammar:
      - "discurso-referido.pregunta"
      - "si.interrogativo"
    register_max: "informal"
    sample:
      es: "Me preguntó si venía."
      en: "He asked me if I was coming."
    tips:
      - title: "Si = whether"
        body: "A yes-or-no question told later hangs on **si**: «¿Venís?» → **me preguntó si venía**.
          *No sé si abre hoy* — *I don't know if it's open today*. **Dudo** — *I doubt it*."
      - title: "A ver si…"
        body: "**A ver si** is *let's see if* — and, just as often, a hope: **a ver si nos juntamos** —
          *we should get together sometime*. To find something out, porteños **averiguan**."
    words:
      - lemma: "a ver si"
        pos: "phrase"
        en: "let's see if"
      - lemma: "averiguar"
        pos: "verb"
        en: "to find out, to look into"
        forms:
          - form: "averiguar"
            f: "inf"
          - form: "averiguo"
            en: "I'll find out, I find out"
            f: "1sg.pres.ind"
          - form: "averiguá"
            en: "find out"
            f: "2sg.imp.vos"
      - lemma: "dudar"
        pos: "verb"
        en: "to doubt"
        forms:
          - form: "dudo"
            en: "I doubt"
            f: "1sg.pres.ind"
          - form: "dudás"
            en: "you doubt"
            f: "2sg.pres.ind.vos"

  - ordinal: 4
    slug: "fijate-si-tienen"
    title: "Check before you go"
    summary: "Fijate si tienen stock"
    grammar:
      - "discurso-referido.pregunta"
      - "si.interrogativo"
    register_max: "informal"
    sample:
      es: "Preguntale si tienen stock antes de ir."
      en: "Ask them if they have it in stock before we go."
    tips:
      - title: "Fijate si…"
        body: "Before you cross the city, you check: **fijate si abren el feriado**, **me fijo si hay
          turno**, **preguntale si tienen stock**. The **si** is *whether*; the verb after it stays
          normal."
      - title: "Me preguntaron si…"
        body: "Told later, the question moves into the past with its **si**: «¿Tenés turno?» → **me
          preguntaron si tenía turno**."
    words:
      - lemma: "preguntar"
        pos: "verb"
        forms:
          - form: "preguntale"
            en: "ask him, ask her, ask them"
            f: "2sg.imp.vos.clitic"
          - form: "preguntaron"
            en: "they asked"
            f: "3pl.pret.ind"
      - lemma: "fijarse"
        pos: "verb"
        forms:
          - form: "me fijo"
            en: "I'll check, I'll have a look"
            f: "1sg.pres.ind.clitic"
          - form: "te fijás"
            en: "you check, you have a look"
            f: "2sg.pres.ind.vos.clitic"
      - lemma: "averiguar"
        pos: "verb"
        forms:
          - form: "averiguaste"
            en: "you looked into it"
            f: "2sg.pret.ind.vos"
          - form: "averigüé"
            en: "I looked into it"
            f: "1sg.pret.ind"
      - lemma: "consultar"
        pos: "verb"
        en: "to ask about, to check with"
        forms:
          - form: "consultar"
            f: "inf"
          - form: "consulté"
            en: "I consulted, I checked with"
            f: "1sg.pret.ind"
      - lemma: "chequear"
        pos: "verb"
        en: "to double-check"
        forms:
          - form: "chequear"
            f: "inf"
          - form: "chequeá"
            en: "double-check"
            f: "2sg.imp.vos"
      - lemma: "disponible"
        pos: "adj"
        en: "available"
      - lemma: "stock"
        pos: "noun"
        en: "goods on hand, inventory"
      - lemma: "en persona"
        pos: "phrase"
        en: "in person"

  - ordinal: 5
    slug: "practica-como-no"
    title: "Practice: errands, checking and don José"
    summary: "Me preguntaron si tenía turno"
    grammar:
      - "repaso.discurso-referido"
      - "repaso.cortesia"
    register_max: "informal"
    sample:
      es: "Mi vieja me encargó que comprara pan."
      en: "My mum asked me to buy bread."
    tips:
      - title: "Comprara, llegáramos, trajeran"
        body: "The errand told later: **me pidió que comprara pan**, **nos dijo que llegáramos
          temprano**, **les pidió que trajeran algo**. The question: **preguntale si tienen stock**."
      - title: "Cómo no, faltaba más"
        body: "With **don José** and **doña Rosa**: **te doy una mano**, **dejá**, **cómo no**, **faltaba más** — vos, said warmly."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "comprara"
      - "llegáramos"
      - "trajeran"
      - "encargó"
      - "portate"
      - "preguntale"
      - "me fijo"
      - "averigüé"
      - "disponible"
      - "te doy una mano"
      - "faltaba más"
      - "cómo no"
      - "jubilado"
      - "pidió"
      - "dijera"

  - ordinal: 6
    slug: "cualquier-cosa-avisame"
    title: "Write a work email"
    summary: "Te adjunto el contrato"
    grammar:
      - "registro.escrito"
      - "mail"
    register_max: "informal"
    sample:
      es: "Te adjunto el contrato."
      en: "I'm attaching the contract."
    tips:
      - title: "Hola, Juan:"
        body: "Most work emails open with **Hola, Juan:** or **Buen día, Sofi:** and close with
          **Saludos**, **Abrazo** or **Un abrazo**. **Estimado Juan** / **Estimada Sofi** is the
          formal exception, and so is **quedo atento** (a woman: **quedo atenta**) — *I look forward
          to your reply*. **Te adjunto** is *I'm attaching*: *te adjunto mi CV*; **desde ya, gracias**
          is *thanks in advance*."
      - title: "Cualquier cosa, avisame"
        body: "The porteño sign-off, in emails and out of them: **cualquier cosa, avisame** — *if anything
          comes up, let me know*. A **consulta** is a question you send; a **respuesta**, the reply."
    words:
      - lemma: "adjuntar"
        pos: "verb"
        en: "to attach"
        forms:
          - form: "adjunto"
            en: "I'm attaching"
            f: "1sg.pres.ind"
          - form: "adjunté"
            en: "I attached"
            f: "1sg.pret.ind"
      - lemma: "estimado"
        pos: "adj"
        en: "dear (in a letter)"
        forms:
          - form: "estimado"
            f: "m.sg"
          - form: "estimada"
            f: "f.sg"
      - lemma: "desde ya"
        pos: "phrase"
        en: "in advance"
      - lemma: "enviar"
        pos: "verb"
        en: "to send"
        forms:
          - form: "envié"
            en: "I sent"
            f: "1sg.pret.ind"
          - form: "enviás"
            en: "you send (formal)"
            f: "2sg.pres.ind.vos"
      - lemma: "cualquier cosa"
        pos: "phrase"
        en: "if anything comes up"
      - lemma: "quedo atento"
        pos: "phrase"
        en: "I look forward to your reply"
        note: "formal email sign-off; a woman writes quedo atenta"
        forms:
          - form: "quedo atento"
            f: "m.sg"
          - form: "quedo atenta"
            f: "f.sg"
      - lemma: "CV"
        pos: "noun"
        en: "résumé"

  - ordinal: 7
    slug: "te-reenvio-el-archivo"
    title: "Answer a work email"
    summary: "Te reenvío el archivo que me pediste"
    grammar:
      - "registro.escrito"
      - "mail"
    register_max: "informal"
    sample:
      es: "Te reenvío el archivo. Cualquier cosa, avisame."
      en: "I'm forwarding you the file. If anything comes up, let me know."
    tips:
      - title: "Te reenvío, te paso"
        body: "The reply has its own verbs: **te reenvío el mail** — *I'm forwarding you the email*; **te
          paso el link**; **te pongo en copia** — *I'm cc'ing you*. **Revisé la planilla** — *I went
          through the spreadsheet*."
      - title: "Cualquier duda…"
        body: "**Cualquier duda, avisame** — *any questions, let me know* — closes half the emails in
          Buenos Aires. What's still to do is **pendiente**: **me quedó pendiente el archivo**. And if
          it needs a meeting, you **agendás** it."
    words:
      - lemma: "reenviar"
        pos: "verb"
        en: "to forward"
        forms:
          - form: "reenvío"
            en: "I'm forwarding"
            f: "1sg.pres.ind"
          - form: "reenviame"
            en: "forward me"
            f: "2sg.imp.vos.clitic"
      - lemma: "archivo"
        pos: "noun"
        en: "file"
        forms:
          - form: "archivo"
            f: "sg"
          - form: "archivos"
            en: "files"
            f: "pl"
      - lemma: "asunto"
        pos: "noun"
        en: "subject line, matter"
      - lemma: "duda"
        pos: "noun"
        en: "doubt, query"
        forms:
          - form: "duda"
            f: "sg"
          - form: "dudas"
            en: "doubts; questions"
            f: "pl"
      - lemma: "revisar"
        pos: "verb"
        en: "to go over, to review"
        forms:
          - form: "revisar"
            f: "inf"
          - form: "revisé"
            en: "I went over, I reviewed"
            f: "1sg.pret.ind"
          - form: "revisá"
            en: "go over, review"
            f: "2sg.imp.vos"
      - lemma: "pendiente"
        pos: "adj"
        en: "still to do, outstanding"
        forms:
          - form: "pendiente"
            f: "sg"
          - form: "pendientes"
            f: "pl"
      - lemma: "planilla"
        pos: "noun"
        en: "spreadsheet, form"
      - lemma: "link"
        pos: "noun"
        en: "link"
      - lemma: "agendar"
        pos: "verb"
        en: "to schedule, to put in the calendar"
        forms:
          - form: "agendar"
            f: "inf"
          - form: "agendé"
            en: "I scheduled"
            f: "1sg.pret.ind"
      - lemma: "en copia"
        pos: "phrase"
        en: "cc'd, copied in"

  - ordinal: 8
    slug: "la-entrega"
    title: "Meet a deadline"
    summary: "Tenemos que entregar el proyecto el viernes"
    grammar:
      - "laburo.proyecto"
    register_max: "informal"
    sample:
      es: "Tenemos que entregar el proyecto el viernes."
      en: "We have to hand in the project on Friday."
    tips:
      - title: "El plazo"
        body: "At work, a **proyecto** has a **plazo** — *a deadline* — and a **presupuesto** — *a budget*.
          You **entregás** it to the **cliente**, ideally before you're **atrasado**."
      - title: "Estamos atrasados"
        body: "**Estamos atrasados** — *we're behind*. The porteño answer: **no pasa nada, lo sacamos**."
    words:
      - lemma: "proyecto"
        pos: "noun"
        en: "project"
      - lemma: "plazo"
        pos: "noun"
        en: "deadline, time limit"
      - lemma: "presupuesto"
        pos: "noun"
        en: "budget; quote"
      - lemma: "entregar"
        pos: "verb"
        en: "to hand in, to deliver"
        forms:
          - form: "entregar"
            f: "inf"
          - form: "entregué"
            en: "I handed in"
            f: "1sg.pret.ind"
      - lemma: "atrasado"
        pos: "adj"
        en: "behind schedule"
        forms:
          - form: "atrasado"
            f: "m.sg"
          - form: "atrasados"
            f: "m.pl"
      - lemma: "entrega"
        pos: "noun"
        en: "hand-in, submission"

  - ordinal: 9
    slug: "sobre-la-hora"
    title: "Move a deadline"
    summary: "Postergaron la fecha: entregamos el lunes"
    grammar:
      - "laburo.proyecto"
    register_max: "informal"
    sample:
      es: "Entregamos el informe sobre la hora."
      en: "We handed in the report right at the deadline."
    tips:
      - title: "Entregamos, entregaste"
        body: "The **plazo** moves: they **postergaron la fecha** — *pushed the date back* — or, worse,
          **la adelantaron**. Then it's **horas extra** until **entregamos** — *we handed it in*. And the
          boss asks: **¿ya lo entregaste?**"
      - title: "Sobre la hora"
        body: "**Sobre la hora** — *right at the deadline, with seconds to spare* — is how most porteño
          projects get done. First a **borrador** — *a draft* — then you **corregir** it, and only then
          the **informe** or the **presentación**. **¿Avanzaron?** — *any progress?*"
    words:
      - lemma: "entregar"
        pos: "verb"
        forms:
          - form: "entregamos"
            en: "we handed in"
            f: "1pl.pret.ind"
          - form: "entregaste"
            en: "you handed in"
            f: "2sg.pret.ind.vos"
      - lemma: "informe"
        pos: "noun"
        en: "report"
      - lemma: "presentación"
        pos: "noun"
        en: "presentation"
      - lemma: "borrador"
        pos: "noun"
        en: "draft"
      - lemma: "corregir"
        pos: "verb"
        en: "to correct"
        forms:
          - form: "corregir"
            f: "inf"
          - form: "corrigió"
            en: "he corrected, she corrected"
            f: "3sg.pret.ind"
      - lemma: "avanzar"
        pos: "verb"
        en: "to make progress, to move forward"
        forms:
          - form: "avanzar"
            f: "inf"
          - form: "avanzaron"
            en: "they made progress"
            f: "3pl.pret.ind"
      - lemma: "postergar"
        pos: "verb"
        en: "to postpone, to push back"
        forms:
          - form: "postergar"
            f: "inf"
          - form: "postergaron"
            en: "they postponed"
            f: "3pl.pret.ind"
      - lemma: "adelantar"
        pos: "verb"
        en: "to bring forward"
        forms:
          - form: "adelantaron"
            en: "they brought forward"
            f: "3pl.pret.ind"
      - lemma: "fecha"
        pos: "noun"
        en: "date (on the calendar)"
      - lemma: "sobre la hora"
        pos: "phrase"
        en: "at the very last minute, right at the deadline"
        register: "informal"
      - lemma: "horas extra"
        pos: "phrase"
        en: "overtime"

  - ordinal: 10
    slug: "merezco-un-aumento"
    title: "Ask for a raise"
    summary: "Me merezco un aumento"
    grammar:
      - "laburo.negociar"
    register_max: "informal"
    sample:
      es: "Creo que me merezco un aumento."
      en: "I think I deserve a raise."
    tips:
      - title: "Plantear"
        body: "You don't just ask, you **plantear** it — *raise it, put it on the table*: **le planteé lo
          del aumento a mi jefa**. Then you **negociar** the **condiciones**."
      - title: "Merezco"
        body: "**Merecerse** — *to deserve* — comes with its pronoun: **me merezco un aumento**, **te lo merecés**. And a boss who
          **valora** your work says so with the sueldo."
    words:
      - lemma: "plantear"
        pos: "verb"
        en: "to raise, to bring up"
        forms:
          - form: "plantear"
            f: "inf"
          - form: "planteé"
            en: "I raised, I brought up"
            f: "1sg.pret.ind"
      - lemma: "negociar"
        pos: "verb"
        en: "to negotiate"
        forms:
          - form: "negociar"
            f: "inf"
      - lemma: "merecer"
        pos: "verb"
        en: "to deserve"
        forms:
          - form: "me merezco"
            en: "I deserve"
            f: "1sg.pres.ind.clitic.irregular"
          - form: "te merecés"
            en: "you deserve"
