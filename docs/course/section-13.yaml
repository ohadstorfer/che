      - "jubilado"
      - "pidió"
      - "dijera"
  - ordinal: 6
    slug: "cualquier-cosa-avisame"
    title: "Write a work email"
    summary: "Te adjunto el contrato"
    grammar:
      - "registro.escrito"
      - "mail"
    register_max: "informal"
    sample:
      es: "Te adjunto el contrato."
      en: "I'm attaching the contract."
    tips:
      - title: "Hola, Juan:"
        body: "Most work emails open with **Hola, Juan:** or **Buen día, Sofi:** and close with **Saludos**,
          **Abrazo** or **Un abrazo**. **Estimado Juan** / **Estimada Sofi** is the formal
          exception, and so is **quedo atento** (a woman: **quedo atenta**) — *I look forward to
          your reply*. **Te adjunto** is *I'm attaching*: *te adjunto mi CV*; **desde ya, gracias**
          is *thanks in advance*."
      - title: "Cualquier cosa, avisame"
        body: "The porteño sign-off, in emails and out of them: **cualquier cosa, avisame** — *if anything
          comes up, let me know*. A **consulta** is a question you send; a **respuesta**, the
          reply."
    words:
      - lemma: "adjuntar"
        pos: "verb"
        en: "to attach"
        forms:
          - form: "adjunto"
            en: "I'm attaching"
            f: "1sg.pres.ind"
          - form: "adjunté"
            en: "I attached"
            f: "1sg.pret.ind"
      - lemma: "estimado"
        pos: "adj"
        en: "dear (in a letter)"
        forms:
          - form: "estimado"
            f: "m.sg"
          - form: "estimada"
            f: "f.sg"
      - lemma: "desde ya"
        pos: "phrase"
        en: "in advance"
      - lemma: "enviar"
        pos: "verb"
        en: "to send"
        forms:
          - form: "envié"
            en: "I sent"
            f: "1sg.pret.ind"
          - form: "enviás"
            en: "you send"
            f: "2sg.pres.ind.vos"
        note: "A bit formal; in everyday talk Argentines say mandar (te mando el mail)."
      - lemma: "cualquier cosa"
        pos: "phrase"
        en: "if anything comes up"
      - lemma: "quedo atento"
        pos: "phrase"
        en: "I look forward to your reply"
        note: "formal email sign-off; a woman writes quedo atenta"
        forms:
          - form: "quedo atento"
            f: "m.sg"
          - form: "quedo atenta"
            f: "f.sg"
      - lemma: "CV"
        pos: "noun"
