        body: "On the table: **chimichurri** — oil, garlic, parsley, chilli — and **salsa criolla** — onion,
          tomato, pepper. Ketchup is a crime. The meat is cooked **a la leña** at the good places."
      - title: "Bien cocido"
        body: "Jugosa, a punto, or **bien cocido** — *well done*; **vuelta y vuelta** is barely warm. The
          bill has a line for the **cubierto** — *the cover charge*: the bread and the cutlery."
