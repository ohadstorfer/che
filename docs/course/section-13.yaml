      en: "They fired him out of the blue, and to top it off he found out by email."
    tips:
      - title: "De golpe, para colmo"
        body: "The twist arrives **de golpe** — *all of a sudden* — or **de la nada** — *out of nowhere*.
          **Para colmo** stacks one more thing on top, like **encima**: **para colmo, llovía**.
          **Por lo visto** — *apparently* — is what you say when you weren't there. When someone
          loses a job, people say **lo echaron**; **lo despidieron** is the word of the news and of
          HR."
      - title: "Nos enteramos, se enteraron"
        body: "**Enterarse** for everyone: **nos enteramos tarde** — *we found out late*; **se enteraron
          todos** — *everybody found out*. The one who tells it best adds **¡ni te cuento!** — *you
          don't even want to know*."
