        en: "to announce"
        forms:
          - form: "anunció"
            en: "announced"
            f: "3sg.pret.ind"
          - form: "anunciaron"
            en: "they announced"
            f: "3pl.pret.ind"
      - lemma: "suspender"
        pos: "verb"
