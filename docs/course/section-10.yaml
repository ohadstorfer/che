          - form: "canso"
            f: "1sg.pres.ind"
            bound: true

  - ordinal: 4
    slug: "aunque-no-tenga-ganas"
    title: "Keep going even when it's hard"
    summary: "Aunque no tenga ganas, voy igual"
    grammar:
      - "aunque.indicativo-subjuntivo"
      - "a-pesar-de"
      - "servir"
      - "por-mas-que"
    register_max: "informal"
    sample:
      es: "Aunque no tenga ganas, voy igual al gimnasio."
      en: "Even if I don't feel like it, I still go to the gym."
    tips:
      - title: "Por más que"
        body: "**Por más que** — *no matter how much* — is *aunque* turned up: **por más que me cueste,
          sigo** — *however hard it is, I keep going*. A maybe takes the subjunctive, a fact doesn't:
          *por más que **entreno**, engordo* — I do train; it just doesn't show."
      - title: "Aunque sea"
        body: "**Aunque sea** — *at least, even if it's only* — is the deal you make with yourself:
          *hoy no tengo ganas, pero **aunque sea** un rato voy*. And the other half of it:
          **aunque no me dé el tiempo** — *even if I don't have the time*."
      - title: "Sin embargo, así y todo"
        body: "Both start the second half: **sin embargo** — *however* — and the more spoken **así y
          todo** — *even so*: *hice dieta; **así y todo**, engordé*."
    words:
      - lemma: "aunque sea"
        pos: "phrase"
        en: "even if only, even just"
      - lemma: "por más que"
        pos: "phrase"
        en: "no matter how much, however much"
      - lemma: "sin embargo"
        pos: "phrase"
        en: "however"
      - lemma: "así y todo"
        pos: "phrase"
        en: "even so"
      - lemma: "dar"
        pos: "verb"
        forms:
          - form: "dé"
            en: "(that) it gives, (that) I give"
            f: "sg.pres.subj.irregular"
      - lemma: "costar"
        pos: "verb"
        forms:
          - form: "me cuesta"
            en: "it's hard for me"
            f: "3sg.pres.ind.clitic"
      - lemma: "entrenar"
        pos: "verb"
        en: "to train, to work out"
        forms:
          - form: "entrenar"
            f: "inf"
          - form: "entreno"
            en: "I train, I work out"
            f: "1sg.pres.ind"
          - form: "entrene"
            en: "(that) I train, (that) he trains"
            f: "sg.pres.subj"
      - lemma: "ejercicio"
        pos: "noun"
        en: "exercise"
      - lemma: "dieta"
        pos: "noun"
        en: "diet"
      - lemma: "engordar"
        pos: "verb"
        en: "to put on weight"
        forms:
          - form: "engordar"
            f: "inf"
          - form: "engordé"
            en: "I put on weight"
            f: "1sg.pret.ind"

  - ordinal: 5
    slug: "llevo-dos-anos"
    title: "Say how long you've been at it"
    summary: "Llevo dos años acá"
    grammar:
      - "llevar.tiempo.gerundio"
      - "hace-que"
      - "seguir.gerundio"
      - "dejar-de"
    register_max: "informal"
    sample:
      es: "Llevo dos años viviendo en Buenos Aires."
      en: "I've been living in Buenos Aires for two years."
    tips:
      - title: "Llevo dos años"
        body: "**Llevo dos años viviendo acá** — *I've been living here for two years*. Where English
          says *have been …ing*, Spanish stays in the present: **hace dos años que vivo acá** says the
          same."
      - title: "Sigo, dejé de, volví a"
        body: "**Sigo laburando ahí** — *I still work there*. **Dejé de fumar** — *I quit smoking*.
          **Volvió a llamar** — *he called again*."
    words:
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevás"
            en: "you've been (for a time)"
            f: "2sg.pres.ind.vos"
          - form: "lleva"
            en: "he's been, she's been (for a time)"
            f: "3sg.pres.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viviendo"
            en: "living"
            f: "ger"
      - lemma: "seguir"
        pos: "verb"
