            en: "(that) you let know"
            f: "2sg.impf.subj.vos"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperara"
            en: "(that) I waited, (that) he waited"
            f: "sg.impf.subj"

  - ordinal: 2
    slug: "mis-viejos-querian"
    title: "Say what your parents wanted"
    summary: "Mis viejos querían que estudiara"
    grammar:
      - "subjuntivo.imperfecto.querer-que"
      - "correlacion.tiempos"
      - "subjuntivo.imperfecto.personas"
    register_max: "informal"
    sample:
      es: "Mis viejos querían que estudiara una carrera."
      en: "My parents wanted me to get a degree."
    tips:
      - title: "Querían que estudiara"
        body: "Growing up, every wish was in the past: **mis viejos querían que estudiara** — *my parents
          wanted me to study*; **no querían que saliera de noche** — *they didn't want me going out at
          night*. The second verb follows the first into the past."
      - title: "One trick, every verb"
        body: "Take the *ellos* preterite and swap **-ron** for **-ra**: *salieron* → **saliera**,
          *volvieron* → **volviera**, *dijeron* → **dijera**. With vos add an **-s**: **estudiaras,
          dijeras, fueras**. For *ellos*: **querían que vinieran todos**."
      - title: "Pedir permiso"
        body: "A porteño family can be **estricta**: *para salir tenía que pedir **permiso***, and my
          mum **quería que volviera temprano** — which never happened."
    words:
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "querían"
            en: "they wanted"
            f: "3pl.impf.ind"
      - lemma: "estudiar"
        pos: "verb"
        forms:
          - form: "estudiara"
            en: "(that) I studied, (that) he studied"
            f: "sg.impf.subj"
          - form: "estudiaras"
            en: "(that) you studied"
            f: "2sg.impf.subj.vos"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "saliera"
            en: "(that) I went out, (that) he went out"
            f: "sg.impf.subj"
          - form: "salieras"
            en: "(that) you went out"
            f: "2sg.impf.subj.vos"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volviera"
            en: "(that) I came back, (that) he came back"
            f: "sg.impf.subj"
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "dijera"
            en: "(that) I said, (that) he said"
            f: "sg.impf.subj.irregular"
          - form: "dijeras"
            en: "(that) you said"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "ayudar"
        pos: "verb"
        forms:
          - form: "ayudara"
            en: "(that) I helped, (that) he helped"
            f: "sg.impf.subj"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "fueras"
            en: "(that) you were"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vinieran"
            en: "(that) they came"
            f: "3pl.impf.subj.irregular"
      - lemma: "carrera"
        pos: "noun"
        en: "degree (course), career"
      - lemma: "estricto"
