            en: "called"
            f: "part"
      - lemma: "pensar"
        pos: "verb"
        forms:
          - form: "pensado"
            en: "thought"
            f: "part"
      - lemma: "estudiar"
        pos: "verb"
        forms:
          - form: "estudiado"
            en: "studied"
            f: "part"

  - ordinal: 10
    slug: "por-un-lado"
    title: "Weigh both sides"
    summary: "Por un lado sí, por otro no"
    grammar:
      - "conectores.argumentacion"
      - "opinar"
    register_max: "informal"
    sample:
      es: "Por un lado es caro, pero por otro lado vale la pena."
      en: "On the one hand it's expensive, but on the other hand it's worth it."
    tips:
      - title: "Por un lado, por otro lado"
        body: "**Por un lado… por otro lado** weighs two sides. **En cambio** — *whereas* — sets two
          people or things against each other: *yo laburo, en cambio él no*."
      - title: "De hecho, en realidad"
        body: "**De hecho** — *in fact* — backs up what you just said. **En realidad** — *actually* —
          corrects it: *en realidad no es tan caro*. **Por eso** — *that's why*."
    words:
      - lemma: "por un lado"
        pos: "phrase"
        en: "on the one hand"
      - lemma: "por otro lado"
        pos: "phrase"
        en: "on the other hand"
      - lemma: "en cambio"
        pos: "phrase"
        en: "whereas"
      - lemma: "de hecho"
        pos: "phrase"
        en: "in fact"
      - lemma: "en realidad"
        pos: "phrase"
        en: "actually"
      - lemma: "por eso"
        pos: "phrase"
        en: "that's why"
      - lemma: "opinar"
        pos: "verb"
        en: "to think, to have an opinion"
        forms:
          - form: "opino"
            en: "I think"
            f: "1sg.pres.ind"
          - form: "opinás"
            en: "you think"
            f: "2sg.pres.ind.vos"
      - lemma: "convencer"
        pos: "verb"
        en: "to convince"
        forms:
          - form: "convenciste"
            en: "you convinced"
            f: "2sg.pret.ind.vos"
          - form: "convence"
            en: "convinces"
            f: "3sg.pres.ind"

  - ordinal: 11
    slug: "el-tramite"
    title: "Deal with the paperwork"
    summary: "Sacá turno y traé el DNI"
    grammar:
      - "tramites"
      - "vencido"
    register_max: "informal"
    sample:
      es: "Tenés que sacar turno para renovar el pasaporte."
      en: "You have to book an appointment to renew your passport."
    tips:
      - title: "Sacar turno"
        body: "For almost anything official you first **sacás turno** — you book an appointment online —
          and you bring the **DNI**, the national ID card, without which nothing happens."
      - title: "Vencido"
        body: "A document that has run out is **vencido**: *tengo el pasaporte vencido*. You **renovás**
          it, fill in a **formulario**, wait in the **fila**, and **firmás**."
    words:
      - lemma: "DNI"
        pos: "propn"
        en: "national ID card"
      - lemma: "pasaporte"
        pos: "noun"
