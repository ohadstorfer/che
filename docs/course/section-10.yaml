      - "el que"
      - "la que"
      - "donde"
      - "prefiero"
      - "vinieras"
      - "aunque"

  - ordinal: 9
    slug: "si-hubiera-sabido"
    title: "Say what would have happened"
    summary: "Si hubiera sabido…"
    grammar:
      - "subjuntivo.pluscuamperfecto"
      - "si-hipotetico.pasado"
    register_max: "informal"
    sample:
      es: "Si hubiera sabido, te hubiera avisado."
      en: "If I'd known, I would have told you."
    tips:
      - title: "Si hubiera sabido"
        body: "For what didn't happen: **si hubiera sabido, te hubiera avisado** — *if I'd known, I'd
          have told you*. Porteños use **hubiera** + a participle in both halves."
      - title: "The same participles"
        body: "**Hubiera** takes the participles *había* does: **sabido, venido, ido, llamado, dicho,
          hecho**. **Si hubieras venido** — *if you had come*."
    words:
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "hubiera"
            en: "(if) I had, (if) he had; I would have"
            f: "sg.impf.subj.irregular"
          - form: "hubieras"
            en: "(if) you had; you would have"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sabido"
            en: "known"
            f: "part"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avisado"
            en: "let know"
            f: "part"
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "venido"
            en: "come"
            f: "part"
      - lemma: "ir"
        pos: "verb"
        forms:
