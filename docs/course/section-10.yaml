  - ordinal: 10
    slug: "a-la-mesa"
    title: "Call everyone to the table"
    summary: "¡A la mesa! Sírvanse"
    grammar:
      - "imperativo.ustedes"
      - "hospitalidad"
      - "imperativo.ustedes.negativo"
    register_max: "informal"
    sample:
      es: "¡A la mesa, chicos! Sírvanse y prueben el asado."
      en: "Food's ready, guys! Help yourselves and try the asado."
    tips:
      - title: "Coman, prueben, agarren"
        body: "At the table the host never stops: **coman**, **prueben**, **tomen algo**, **agarren
          pan**. Same rule as *pasen*: -ar verbs end in **-en**, the rest in **-an** — **coman**,
          **hagan** lugar, **vayan** sentándose."
      - title: "No se olviden"
        body: "With a *no* in front the verb stays the same and the pronoun jumps ahead: **apúrense**,
          but **no se olviden** — *don't forget*; **no dejen nada** — *don't leave anything*."
      - title: "Buen provecho"
        body: "Before the first bite: **¡buen provecho!** — *enjoy!* And when the host says
          **sírvanse** — *help yourselves* — nobody waits to be asked twice."
    words:
      - lemma: "a la mesa"
        pos: "phrase"
        en: "food's ready!, (come) to the table"
      - lemma: "buen provecho"
        pos: "phrase"
        en: "enjoy your meal"
      - lemma: "servirse"
        pos: "verb"
        en: "to help yourself (to food)"
        forms:
          - form: "sírvanse"
            en: "help yourselves"
            f: "3pl.imp.clitic.irregular"
