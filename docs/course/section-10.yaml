      - "repaso.el-que"
    register_max: "informal"
    sample:
      es: "Pasen, pónganse cómodos."
      en: "Come in, make yourselves comfortable."
    tips:
      - title: "Pasen, siéntense"
        body: "For more than one person: **pasen**, **vengan**, **siéntense**, **no se preocupen**."
      - title: "Como si, el que"
        body: "**Como si** takes the past subjunctive: *como si supiera*. **El que, la que** — *the one that*: *la que prefieras*."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
