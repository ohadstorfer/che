    title: "Talk it through"
    summary: "¿Y vos qué opinás?"
    grammar:
      - "debate"
      - "repaso.b2"
    register_max: "informal"
    sample:
      es: "¿Y vos qué opinás?"
      en: "And what do you think?"
    tips:
      - title: "Arguing like a porteño"
        body: "An argument in Buenos Aires is a sport, not a fight: **discutimos** a lot and stay
          friends. **Me convenciste** — *you've convinced me*; **cambié de idea** — *I changed my
          mind*."
      - title: "¡Ojo!"
        body: "**¡Ojo!** — literally *eye!* — is *careful!, watch out!*: **ojo, que no es tan fácil**.
          **Estoy seguro** — *I'm sure*; **no estoy segura** — *I'm not sure*."
