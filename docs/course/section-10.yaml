  - ordinal: 7
    slug: "practica-llevo-un-rato"
    title: "Practice: what you wanted, even if, how long"
    summary: "Llevo un rato esperando"
    grammar:
      - "repaso.subjuntivo.imperfecto"
      - "repaso.aunque"
      - "repaso.llevar"
    register_max: "informal"
    sample:
      es: "Llevo un rato esperando."
      en: "I've been waiting for a while."
    tips:
      - title: "Quería que, aunque"
        body: "**Quería que vinieras** puts the wish in the past, so the second verb follows it. **Aunque** takes the subjunctive only for a maybe: *aunque llueva*."
      - title: "Llevo, sigo"
        body: "**Llevo un rato esperando** — *I've been waiting a while*. **Sigo esperando** — *I'm still waiting*."
