# ---------------------------------------------------------------------------
# Che — Section 10 outline: "Making your case" (B2.1)
#
# The past subjunctive stops being one fixed phrase and starts following the
# rest of the sentence (quería que vinieras, como si supiera, si hubiera
# sabido), and with it the tools for saying what you mean and holding your
# ground: aunque, how long you've been at something, hosting a table of
# people (pasen, pasen), which one you mean (el que quieras), weighing two
# sides (por un lado… por otro lado), and the paperwork every porteño life
# runs through — ending on a checkpoint that argues it out.
#
# Plan: docs/course/roadmap.md §Section 10.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 10
  slug: "making-your-case"
  title: "Making your case"
  cefr: "B2.1"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "queria-que-vinieras"
    title: "Say what you wanted others to do"
    summary: "Quería que vinieras"
    grammar:
      - "subjuntivo.imperfecto.querer-que"
      - "correlacion.tiempos"
    register_max: "informal"
    sample:
      es: "Quería que vinieras a la juntada."
      en: "I wanted you to come to the get-together."
    tips:
      - title: "Quería que vinieras"
        body: "When the wanting is in the past, the second verb moves into the past too: *quiero que
          vengas* becomes **quería que vinieras** — *I wanted you to come*."
      - title: "Me pidió que"
        body: "**Me pidió que lo llamara** — *she asked me to call him*. The same form follows an order
          told later: **me dijo que esperara** — *he told me to wait*."
    words:
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vinieras"
            en: "(that) you came"
            f: "2sg.impf.subj.vos.irregular"
          - form: "viniera"
            en: "(that) I came, (that) he came"
            f: "sg.impf.subj.irregular"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hicieras"
            en: "(that) you did"
            f: "2sg.impf.subj.vos.irregular"
          - form: "hiciera"
            en: "(that) I did, (that) he did"
            f: "sg.impf.subj.irregular"
      - lemma: "llamar"
