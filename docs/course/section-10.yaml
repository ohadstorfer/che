  - ordinal: 25
    slug: "te-doy-la-razon"
    title: "Admit you were wrong"
    summary: "Pensándolo bien, tenés razón"
    grammar:
      - "debate"
      - "repaso.b2"
    register_max: "informal"
    sample:
      es: "Pensándolo bien, te doy la razón: me equivoqué."
      en: "Thinking about it, you're right: I was wrong."
    tips:
      - title: "Me equivoqué"
        body: "The hardest words in any argument: **me equivoqué** — *I was wrong*. To a friend: **te
          equivocás** — *you're wrong*. Giving ground: **reconozco que** tenés razón, or just **te doy
          la razón**."
      - title: "¡Nada que ver!"
        body: "**¡Nada que ver!** — *that's got nothing to do with it!* — is how porteños throw out a
          point. **En eso** tenés razón concedes just the one. **No seas cabeza dura** — *don't be so
          stubborn*."
      - title: "A ver, pensándolo bien"
        body: "**A ver** — *let's see* — slows an argument down; **pensándolo bien** — *thinking about
          it* — is how you change sides without losing face. **Sos un exagerado** speeds it back up."
    words:
      - lemma: "equivocarse"
        pos: "verb"
        en: "to be wrong, to make a mistake"
        forms:
          - form: "me equivoqué"
            en: "I was wrong, I made a mistake"
            f: "1sg.pret.ind.clitic"
          - form: "te equivocás"
            en: "you're wrong"
            f: "2sg.pres.ind.vos.clitic"
          - form: "equivoqué"
            f: "1sg.pret.ind"
            bound: true
          - form: "equivocás"
            f: "2sg.pres.ind.vos"
            bound: true
      - lemma: "reconocer"
        pos: "verb"
        en: "to admit, to recognise"
        forms:
