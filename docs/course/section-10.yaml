        body: "-ar verbs take **-ado**, the rest **-ido**: **tomado, reservado, quedado, perdido,
          conseguido**. *Traer* keeps its accent: **traído**. *Si hubiera tomado un taxi…*, *si me
          hubiera quedado en casa…*"
      - title: "Qué mala suerte"
