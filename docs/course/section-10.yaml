# ---------------------------------------------------------------------------
# Che — Section 10 outline: "Making your case" (B2.1)
#
# The past subjunctive stops being one fixed phrase and starts following the
# rest of the sentence (quería que vinieras, como si supiera, si hubiera
# sabido), and with it the tools for saying what you mean and holding your
# ground: aunque, how long you've been at something, hosting a table of
# people (pasen, pasen), which one you mean (el que quieras), weighing two
# sides (por un lado… por otro lado), and the paperwork every porteño life
# runs through — ending on a checkpoint that argues it out.
#
# Plan: docs/course/roadmap.md §Section 10.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 10
  slug: "making-your-case"
  title: "Making your case"
  cefr: "B2.1"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "queria-que-vinieras"
    title: "Say what you wanted others to do"
    summary: "Quería que vinieras"
    grammar:
      - "subjuntivo.imperfecto.querer-que"
      - "correlacion.tiempos"
    register_max: "informal"
    sample:
      es: "Quería que vinieras a la juntada."
      en: "I wanted you to come to the get-together."
    tips:
      - title: "Quería que vinieras"
        body: "When the wanting is in the past, the second verb moves into the past too: *quiero que
          vengas* becomes **quería que vinieras** — *I wanted you to come*."
      - title: "Me pidió que"
        body: "**Me pidió que lo llamara** — *she asked me to call him*. The same form follows an order
          told later: **me dijo que esperara** — *he told me to wait*."
    words:
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quería"
            en: "I wanted, he wanted, she wanted"
            f: "sg.impf.ind"
          - form: "querías"
            en: "you wanted"
            f: "2sg.impf.ind.vos"
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vinieras"
            en: "(that) you came"
            f: "2sg.impf.subj.vos.irregular"
          - form: "viniera"
            en: "(that) I came, (that) he came"
            f: "sg.impf.subj.irregular"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hicieras"
            en: "(that) you did"
            f: "2sg.impf.subj.vos.irregular"
          - form: "hiciera"
            en: "(that) I did, (that) he did"
            f: "sg.impf.subj.irregular"
      - lemma: "llamar"
        pos: "verb"
        forms:
          - form: "llamaras"
            en: "(that) you called"
            f: "2sg.impf.subj.vos"
          - form: "llamara"
            en: "(that) I called, (that) he called"
            f: "sg.impf.subj"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avisaras"
            en: "(that) you let know"
            f: "2sg.impf.subj.vos"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperara"
            en: "(that) I waited, (that) he waited"
            f: "sg.impf.subj"
      - lemma: "a tiempo"
        pos: "phrase"
        en: "on time"

  - ordinal: 2
    slug: "aunque-llueva"
    title: "Say even if and even though"
    summary: "Aunque llueva, vamos igual"
    grammar:
      - "aunque.indicativo-subjuntivo"
      - "a-pesar-de"
      - "servir"
    register_max: "informal"
    sample:
      es: "Aunque llueva, vamos igual."
      en: "Even if it rains, we're going anyway."
    tips:
      - title: "Aunque: a fact, or a maybe"
        body: "**Aunque llueve, vamos** — it's raining, and we're going. **Aunque llueva, vamos** —
          whether it rains or not. A fact takes the normal verb; a maybe takes the subjunctive."
      - title: "Igual, a pesar de"
        body: "Porteños close the thought with **igual** — *anyway*: *aunque esté cansada, voy igual*.
          **A pesar de** takes a noun or an infinitive: *a pesar del frío*."
    words:
      - lemma: "aunque"
        pos: "conj"
        en: "even though, even if"
      - lemma: "a pesar de"
        pos: "phrase"
        en: "despite, in spite of"
      - lemma: "servir"
        pos: "verb"
        en: "to be useful, to work"
        forms:
          - form: "sirve"
            en: "is useful, works"
            f: "3sg.pres.ind.irregular"
          - form: "sirven"
            en: "are useful, work"
            f: "3pl.pres.ind.irregular"
      - lemma: "costar"
        pos: "verb"
        forms:
          - form: "cueste"
            en: "(that) it costs, (that) it's hard"
            f: "3sg.pres.subj.irregular"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quieras"
            en: "(that) you want"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "de todos modos"
        pos: "phrase"
        en: "anyway, in any case"
      - lemma: "esfuerzo"
        pos: "noun"
        en: "effort"
      - lemma: "cansarse"
        pos: "verb"
        en: "to get tired"
        forms:
          - form: "me canso"
            en: "I get tired"
            f: "1sg.pres.ind.clitic"
          - form: "canso"
            f: "1sg.pres.ind"
            bound: true

  - ordinal: 3
    slug: "llevo-dos-anos"
    title: "Say how long you've been at it"
    summary: "Llevo dos años acá"
    grammar:
      - "llevar.tiempo.gerundio"
      - "hace-que"
      - "seguir.gerundio"
      - "dejar-de"
    register_max: "informal"
    sample:
      es: "Llevo dos años viviendo en Buenos Aires."
      en: "I've been living in Buenos Aires for two years."
    tips:
      - title: "Llevo dos años"
        body: "**Llevo dos años viviendo acá** — *I've been living here for two years*. Where English
          says *have been …ing*, Spanish stays in the present: **hace dos años que vivo acá** says the
          same."
      - title: "Sigo, dejé de, volví a"
        body: "**Sigo laburando ahí** — *I still work there*. **Dejé de fumar** — *I quit smoking*.
          **Volvió a llamar** — *he called again*."
    words:
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevás"
            en: "you've been (for a time)"
            f: "2sg.pres.ind.vos"
          - form: "lleva"
            en: "he's been, she's been (for a time)"
            f: "3sg.pres.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viviendo"
            en: "living"
            f: "ger"
      - lemma: "seguir"
        pos: "verb"
        en: "to keep on, to still be"
        forms:
          - form: "sigo"
            en: "I keep on, I still"
            f: "1sg.pres.ind.irregular"
          - form: "seguís"
            en: "you keep on, you still"
            f: "2sg.pres.ind.vos"
          - form: "sigue"
            en: "he keeps on, she still"
            f: "3sg.pres.ind.irregular"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejé"
            en: "I stopped, I quit"
            f: "1sg.pret.ind"
          - form: "dejaste"
            en: "you stopped, you quit"
            f: "2sg.pret.ind.vos"
      - lemma: "fumar"
        pos: "verb"
        en: "to smoke"
        forms:
          - form: "fumar"
            f: "inf"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volvió"
            en: "he came back, he did again"
            f: "3sg.pret.ind"
      - lemma: "mes"
        pos: "noun"
        forms:
          - form: "meses"
            f: "m.pl"

  - ordinal: 4
    slug: "practica-llevo-un-rato"
    title: "Practice: what you wanted, even if, how long"
    summary: "Llevo un rato esperando"
    grammar:
      - "repaso.subjuntivo.imperfecto"
      - "repaso.aunque"
      - "repaso.llevar"
    register_max: "informal"
    sample:
      es: "Llevo un rato esperando."
      en: "I've been waiting for a while."
    tips:
      - title: "Quería que, aunque"
        body: "**Quería que vinieras** puts the wish in the past, so the second verb follows it. **Aunque** takes the subjunctive only for a maybe: *aunque llueva*."
      - title: "Llevo, sigo"
        body: "**Llevo un rato esperando** — *I've been waiting a while*. **Sigo esperando** — *I'm still waiting*."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "quería"
      - "vinieras"
      - "hicieras"
      - "llamara"
      - "aunque"
      - "a pesar de"
      - "sirve"
      - "quieras"
      - "llevo"
      - "sigo"
      - "dejé"
      - "viviendo"
      - "tuviera"
      - "había"

  - ordinal: 5
    slug: "pasen-pasen"
    title: "Welcome people into your home"
    summary: "Pasen, pasen"
    grammar:
      - "imperativo.ustedes"
      - "hospitalidad"
    register_max: "informal"
    sample:
      es: "Pasen, pasen, siéntense."
      en: "Come in, come in, sit down."
    tips:
      - title: "Pasen, vengan"
        body: "To more than one person, a command ends in **-en** for -ar verbs and in **-an** for the
          rest: **pasen**, **esperen**, **vengan**, **traigan**. A pronoun sticks to the end:
          **siéntense**."
      - title: "Están en su casa"
        body: "A porteño host says **pasen, pasen** at the door, **pónganse cómodos**, and **no se
          preocupen** when you apologise for being late."
    words:
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasen"
            en: "come in (you all)"
            f: "3pl.imp"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperen"
            en: "wait (you all)"
            f: "3pl.imp"
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vengan"
            en: "come (you all)"
            f: "3pl.imp.irregular"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "traigan"
            en: "bring (you all)"
            f: "3pl.imp.irregular"
      - lemma: "sentarse"
        pos: "verb"
        forms:
          - form: "siéntense"
            en: "sit down (you all)"
            f: "3pl.imp.clitic"
      - lemma: "preocuparse"
        pos: "verb"
        forms:
          - form: "se preocupen"
            en: "(don't) worry (you all)"
            f: "3pl.subj.clitic"
          - form: "preocupen"
            f: "3pl.subj"
            bound: true
      - lemma: "ponerse"
        pos: "verb"
        forms:
          - form: "pónganse"
            en: "make yourselves (comfortable)"
            f: "3pl.imp.clitic.irregular"
      - lemma: "quedarse"
        pos: "verb"
        forms:
          - form: "quédense"
            en: "stay (you all)"
            f: "3pl.imp.clitic"
      - lemma: "cómodo"
        pos: "adj"
        en: "comfortable"
        forms:
          - form: "cómodo"
            f: "m.sg"
          - form: "cómoda"
            f: "f.sg"
          - form: "cómodos"
            f: "m.pl"
      - lemma: "bienvenido"
        pos: "adj"
        en: "welcome"
        forms:
          - form: "bienvenidos"
            f: "m.pl"
          - form: "bienvenida"
            f: "f.sg"

  - ordinal: 6
    slug: "como-si-nada"
    title: "Say as if"
    summary: "Como si nada"
    grammar:
      - "como-si.subjuntivo-imperfecto"
      - "hacerse-el"
      - "ni-que"
    register_max: "informal"
    sample:
      es: "Me habló como si nada."
      en: "He talked to me as if nothing had happened."
    tips:
      - title: "Como si"
        body: "**Como si** — *as if* — always takes the past subjunctive: **habla como si supiera
          todo**, **como si fuera fácil**. **Como si nada** — *as if nothing had happened*. **¡Ni que
          fuera tan difícil!** — *it's not like it's that hard!*"
      - title: "Se hace el vivo"
        body: "**Hacerse el** + a describing word is *to act, to play*: **se hace el vivo** — *he acts
          all clever*; **se hizo el distraído** — *he pretended not to notice*."
    words:
      - lemma: "como si"
        pos: "phrase"
        en: "as if"
      - lemma: "como si nada"
        pos: "phrase"
        en: "as if nothing had happened"
      - lemma: "ni que"
        pos: "phrase"
        en: "it's not like, as if (it were)"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "supiera"
            en: "(that) I knew, (that) he knew"
            f: "sg.impf.subj.irregular"
          - form: "supieras"
            en: "(that) you knew"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "hacerse"
        pos: "verb"
        forms:
          - form: "se hace"
            en: "he acts, she plays (the)"
            f: "3sg.pres.ind.clitic"
          - form: "se hizo"
            en: "he acted, she played (the)"
            f: "3sg.pret.ind.clitic.irregular"
      - lemma: "vivo"
        pos: "adj"
        en: "clever, sly"
        register: "informal"
        forms:
          - form: "vivo"
            f: "m.sg"
          - form: "viva"
            f: "f.sg"
      - lemma: "distraído"
        pos: "adj"
        en: "absent-minded, distracted"
        forms:
          - form: "distraído"
            f: "m.sg"
          - form: "distraída"
            f: "f.sg"
      - lemma: "tonto"
        pos: "adj"
        en: "silly, dumb"
        forms:
          - form: "tonto"
            f: "m.sg"
          - form: "tonta"
            f: "f.sg"
      - lemma: "dormido"
        pos: "adj"
        en: "asleep"
        forms:
          - form: "dormido"
            f: "m.sg"
          - form: "dormida"
            f: "f.sg"

  - ordinal: 7
    slug: "el-que-quieras"
    title: "Say which one you mean"
    summary: "El que quieras"
    grammar:
      - "relativo.el-que"
      - "relativo.donde"
    register_max: "informal"
    sample:
      es: "Elegí el que quieras."
      en: "Pick whichever one you want."
    tips:
      - title: "El que, la que"
        body: "**El que** — *the one that* — matches what it stands for: **el que quieras**, **la que
          está en la esquina**, **los que vinieron**, **las que prefieras**."
      - title: "Donde"
        body: "**Donde** with no accent joins a place to the rest of the sentence: **el bar donde nos
          conocimos** — *the bar where we met*. The question keeps its accent: *¿dónde?*"
    words:
      - lemma: "el que"
        pos: "pron"
        en: "the one that, the one who"
        forms:
          - form: "el que"
            f: "m.sg"
          - form: "la que"
            f: "f.sg"
          - form: "los que"
            f: "m.pl"
          - form: "las que"
            f: "f.pl"
      - lemma: "donde"
        pos: "adv"
        en: "where (the place where)"
      - lemma: "elegir"
        pos: "verb"
        en: "to choose, to pick"
        forms:
          - form: "elegí"
            en: "choose, pick"
            f: "2sg.imp.vos"
          - form: "elijo"
            en: "I choose"
            f: "1sg.pres.ind.irregular"
          - form: "elegiste"
            en: "you chose"
            f: "2sg.pret.ind.vos"
      - lemma: "preferir"
        pos: "verb"
        en: "to prefer"
        forms:
          - form: "prefiero"
            en: "I prefer"
            f: "1sg.pres.ind.irregular"
          - form: "preferís"
            en: "you prefer"
            f: "2sg.pres.ind.vos"
      - lemma: "conocerse"
        pos: "verb"
        en: "to meet (each other)"
        forms:
          - form: "nos conocimos"
            en: "we met"
            f: "1pl.pret.ind.clitic"
          - form: "conocimos"
            f: "1pl.pret.ind"
            bound: true
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vinieron"
            en: "they came"
            f: "3pl.pret.ind.irregular"
      - lemma: "bar"
        pos: "noun"
        en: "bar, café"

  - ordinal: 8
