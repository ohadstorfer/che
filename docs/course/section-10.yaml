  - ordinal: 8
    slug: "practica-aunque-sea"
    title: "Practice: what they wanted, no matter what, how long"
    summary: "Aunque sea un rato, sigo practicando"
    grammar:
      - "repaso.subjuntivo.imperfecto"
      - "repaso.aunque"
      - "repaso.llevar"
    register_max: "informal"
    sample:
      es: "Aunque sea un rato, sigo practicando."
      en: "Even if it's just for a bit, I keep practising."
    tips:
      - title: "Querían que, por más que"
        body: "**Mis viejos querían que estudiara** — the wish is in the past, so the second verb is too.
          **Por más que me cueste** — however hard it is: a maybe takes the subjunctive."
      - title: "¿Hace cuánto?"
        body: "**Hace un año que estudio** says the same as **llevo un año estudiando**. **Seguimos
          buscando**, **volví a empezar**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
