            f: "inf"

  - ordinal: 6
    slug: "llevo-un-ano-aprendiendo"
    title: "Say how long you've been learning"
    summary: "Llevo un año aprendiendo castellano"
    grammar:
      - "llevar.tiempo.gerundio"
      - "hace-que"
      - "seguir.gerundio"
      - "dejar-de"
      - "volver-a"
    register_max: "informal"
    sample:
      es: "Llevo un año aprendiendo castellano y sigo practicando."
      en: "I've been learning Spanish for a year and I'm still practising."
    tips:
      - title: "¿Hace cuánto?"
        body: "Every porteño asks it: **¿hace cuánto que estudiás?** — *how long have you been
          studying?* Answer either way: **hace un año que estudio** or **llevo un año estudiando**.
          Or count from a moment: **desde que llegué** — *since I arrived*."
      - title: "Sigo, seguimos, siguen"
        body: "Everyone can keep at it: **sigo practicando**, **seguimos buscando** laburo, *mis amigos*
          **siguen tratando de** entenderme. And stop: **dejaron de** venir — *they stopped
          coming*."
      - title: "Volví a"
        body: "**Volver a** + an infinitive is *to do it again*: **volví a estudiar** — *I went back to
          studying*; **vuelvo a empezar** — *I'm starting over*."
    words:
      - lemma: "hace cuánto"
        pos: "phrase"
        en: "how long (has it been)"
      - lemma: "desde que"
        pos: "phrase"
        en: "since (the time when)"
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevan"
            en: "they've been (for a time)"
            f: "3pl.pres.ind"
      - lemma: "aprender"
        pos: "verb"
        forms:
          - form: "aprendiendo"
            en: "learning"
            f: "ger"
      - lemma: "buscar"
        pos: "verb"
        forms:
