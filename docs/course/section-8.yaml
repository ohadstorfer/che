            en: "you'd have (to), you ought to"
            f: "2sg.cond.ind.vos.irregular"

  - ordinal: 3
    slug: "si-tuviera"
    title: "Imagine what you'd do"
    summary: "Si tuviera plata…"
    grammar:
      - "subjuntivo.imperfecto"
      - "si-hipotetico"
    register_max: "informal"
    sample:
      es: "Si tuviera plata, viajaría a Bariloche."
      en: "If I had money, I'd travel to Bariloche."
    tips:
      - title: "Si + a past form + would"
        body: "Something that isn't true now: **si tuviera plata, viajaría** — *if I had money, I'd
          travel*. The *si* half uses a new form, **tuviera**, **fuera**, **pudiera**."
      - title: "Only after si"
        body: "You meet this form after *si* and after *ojalá* — **ojalá pudiera** — and almost nowhere
          else at this level."
    words:
      - lemma: "si"
        pos: "conj"
        en: "if"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tuviera"
            en: "had (if I, if he/she had)"
            f: "sg.impf.subj.irregular"
          - form: "tuvieras"
            en: "you had (if you had)"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "fuera"
            en: "were (if I, if he/she were)"
            f: "sg.impf.subj.irregular"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "pudiera"
            en: "could (if I, if he/she could)"
            f: "sg.impf.subj.irregular"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estuviera"
            en: "were (if I, if he/she were)"
            f: "sg.impf.subj.irregular"
      - lemma: "viajar"
        pos: "verb"
        forms:
          - form: "viajaría"
            en: "would travel (I, he/she)"
            f: "sg.cond.ind"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "sería"
            en: "would be"
            f: "sg.cond.ind.irregular"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "harías"
            en: "you would do"
            f: "2sg.cond.ind.vos.irregular"

  - ordinal: 4
    slug: "si-ganara"
    title: "Dream out loud"
    summary: "Si ganara la lotería…"
    grammar:
      - "subjuntivo.imperfecto"
      - "si-hipotetico"
    register_max: "informal"
    sample:
      es: "Si ganara la lotería, viviría en la playa."
      en: "If I won the lottery, I'd live at the beach."
    tips:
      - title: "Any verb after si"
        body: "The *if* form works for every verb: take the *ellos* past and swap **-ron** for **-ra**.
          *Ganaron* → **si ganara**, *vivieron* → **si viviera**. Then *would*: **viviría**,
          **daría**, **sabría**."
      - title: "We and you"
        body: "Dreaming together: **si tuviéramos plata, iríamos a Bariloche** — the *we* form carries an
          accent, **tuviéramos**. Asking a friend: **si pudieras, ¿dónde vivirías?** — *si
          pudieras* is the vos form."
    words:
      - lemma: "ganar"
        pos: "verb"
        forms:
          - form: "ganara"
            en: "won (if I/he/she won)"
            f: "sg.impf.subj"
      - lemma: "lotería"
        pos: "noun"
        en: "lottery"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viviera"
            en: "lived (if I/he/she lived)"
            f: "sg.impf.subj"
          - form: "viviría"
            en: "would live (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tuviéramos"
            en: "we had (if we had)"
            f: "1pl.impf.subj.irregular"
      - lemma: "poder"
        pos: "verb"
        forms:
