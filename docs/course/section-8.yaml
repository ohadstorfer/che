# ---------------------------------------------------------------------------
# Che — Section 8 outline: "If I were you" (B1.2)
#
# Hypotheticals and the city. The conditional for advice the porteño way (yo
# que vos, iría), "si tuviera plata…", wishing politely (me gustaría), then
# the city itself — driving, the avenidas, what things cost in cuotas — the
# news and what people say (dicen que…), describing people (buena onda, pesado),
# the barrios and where they are (¿dónde queda?), telling who said what
# (me preguntó, le contesté), and a checkpoint of the connectors that make it
# sound porteño: por las dudas, de última, en serio.
#
# It also fills words the writers of sections 4–5 kept reaching for and not
# finding: mucha/mucho (mucha gente), llamó, auto, hablando, vino (came).
#
# Plan: docs/course/roadmap.md §Section 8.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 8
  slug: "if-i-were-you"
  title: "If I were you"
  cefr: "B1.2"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "yo-que-vos"
    title: "Give advice with would"
    summary: "Yo que vos, iría"
    grammar:
      - "condicional"
      - "yo-que-vos"
    register_max: "informal"
    sample:
      es: "Yo que vos, iría al médico."
      en: "If I were you, I'd go to the doctor."
    tips:
      - title: "Yo que vos"
        body: "**Yo que vos** — *if I were you* — is how a porteño gives advice, and the conditional follows:
          **yo que vos, iría**, **yo que vos, no diría nada**."
      - title: "-ía on the whole verb"
        body: "The conditional adds **-ía** to the whole infinitive: *comprar* → **compraría**. A few
          shorten first: **haría**, **diría**, **tendría**, **podría**."
    words:
      - lemma: "yo que vos"
        pos: "phrase"
        en: "if I were you"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "iría"
            en: "would go (I, he/she)"
            f: "sg.cond.ind"
          - form: "irías"
            en: "you would go"
            f: "2sg.cond.ind.vos"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "haría"
            en: "would do (I, he/she)"
            f: "sg.cond.ind.irregular"
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "diría"
            en: "would say (I, he/she)"
            f: "sg.cond.ind.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tendría"
            en: "would have (I, he/she)"
            f: "sg.cond.ind.irregular"
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "compraría"
            en: "would buy (I, he/she)"
            f: "sg.cond.ind"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "podría"
            en: "could (I, he/she)"
            f: "sg.cond.ind.irregular"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperaría"
            en: "would wait (I, he/she)"
            f: "sg.cond.ind"

  - ordinal: 2
    slug: "yo-en-tu-lugar"
    title: "Talk a friend through a problem"
    summary: "Yo en tu lugar, hablaría con él"
    grammar:
      - "condicional"
      - "yo-que-vos"
      - "condicional.vos"
    register_max: "informal"
    sample:
      es: "Yo en tu lugar, hablaría con tu jefe."
      en: "If I were you, I'd talk to your boss."
    tips:
      - title: "Yo en tu lugar"
        body: "**Yo en tu lugar** — *in your shoes* — is *yo que vos* with a straighter face. The
          advice after it is still *would*: **yo en tu lugar, hablaría con él**, **yo me quedaría**."
      - title: "Asking back"
        body: "Throw it back at your friend with the vos ending, **-ías**: **¿vos qué le dirías?** —
          *what would you tell him?* **Tendrías que** is advice with gloves on: **tendrías que
          llamarlo**, softer than *tenés que*."
      - title: "Same short stems"
        body: "*Salir* shortens like *tener*: **saldría**, as *tendría*. The rest just add **-ía**:
          **volvería**, **pediría**, **dejaría**, **buscaría**."
    words:
      - lemma: "en tu lugar"
        pos: "phrase"
        en: "in your shoes"
      - lemma: "hablar"
        pos: "verb"
        forms:
          - form: "hablaría"
            en: "would talk (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejaría"
            en: "would leave, would quit (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "pedir"
        pos: "verb"
        forms:
          - form: "pediría"
            en: "would ask for (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volvería"
            en: "would go back (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "saldría"
            en: "would go out, would leave (I/he/she)"
            f: "sg.cond.ind.irregular"
      - lemma: "buscar"
        pos: "verb"
        forms:
          - form: "buscaría"
            en: "would look for (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "quedarse"
        pos: "verb"
        forms:
          - form: "me quedaría"
            en: "I would stay"
            f: "1sg.cond.ind.clitic"
          - form: "quedaría"
            f: "sg.cond.ind"
            bound: true
      - lemma: "decir"
        pos: "verb"
        forms:
