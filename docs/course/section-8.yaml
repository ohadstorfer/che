      - title: "Chanta, cheto, piola"
        body: "People get lunfardo labels: a **chanta** talks big and doesn't deliver, a **cheto** is
          posh, and someone **piola** is cool and easy-going. **No me chamuyes** — *don't give me that*
          — is the subjunctive again."
      - title: "Qué embole"
