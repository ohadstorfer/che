  - ordinal: 17
    slug: "no-se"
    title: "Say what you know and understand"
    summary: "Ni idea"
    grammar:
      - "saber"
      - "entender"
      - "explicar"
    register_max: "informal"
    sample:
      es: "No sé, ni idea."
      en: "I don't know, no idea."
    tips:
      - title: "Sé, sabés"
        body: "**Sé** — *I know* — has an accent to tell it from *se*. **¿Sabés qué?** — *you know what?*
          — opens every piece of gossip."
      - title: "No entiendo"
        body: "**No entiendo** — *I don't understand*. **¿Me explicás?** or **explicame** — *can you
          explain?*"
      - title: "Saber or conocer?"
        body: "**Saber** + a verb is *to know how to*: **¿sabés cocinar?** For people and places use
          **conocer**: **conozco a Juan**, **¿conocés Palermo?** And **qué sé yo** is the porteño
          shrug — *who knows*."
    words:
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sabemos"
            en: "we know"
            f: "1pl.pres.ind"
      - lemma: "explicar"
        pos: "verb"
        en: "to explain"
        forms:
          - form: "explicás"
            en: "you explain"
            f: "2sg.pres.ind.vos"
          - form: "explicame"
            en: "explain to me"
            f: "2sg.imp.vos.clitic"
      - lemma: "pregunta"
        pos: "noun"
        en: "question"

  - ordinal: 18
    slug: "que-significa"
    title: "Ask what something means"
    summary: "¿Qué significa?"
    grammar:
      - "saber"
      - "entender"
      - "explicar"
      - "darse-cuenta"
    register_max: "informal"
    sample:
      es: "Perdón, no entendí. ¿Me lo repetís?"
      en: "Sorry, I didn't get that. Can you say it again?"
    tips:
      - title: "¿Qué significa?"
        body: "Stuck on a word: **¿qué significa?** Too fast? **¿Me lo repetís?** or **repetime, más
          despacio**. Got it wrong? **Perdón, me confundí.**"
      - title: "No sabía, me di cuenta"
        body: "**No sabía** — *I didn't know* — is the imperfect: a state. **Me di cuenta** — *I
          realised* — is the moment it clicked. **¿Sabías que…?** opens half the gossip in Buenos
          Aires."
      - title: "No hace falta que entiendas todo"
        body: "Knowing takes the subjunctive when it's wanted or needed: **quiero que me expliques** —
          *I want you to explain it to me*; **no hace falta que entiendas todo** — *you don't need to
          understand everything*."
    words:
