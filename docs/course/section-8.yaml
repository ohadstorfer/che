      es: "Te aconsejo que lleves efectivo y que tomes el subte."
      en: "My advice: bring cash and take the subway."
    tips:
      - title: "Te aconsejo que, conviene que"
        body: "**Te aconsejo que lleves efectivo** — *my advice: bring cash*. **Conviene que** and
          **es importante que** work like *te recomiendo que*: the advice lands in the subjunctive —
          **conviene que busques un depto cerca del subte**. In everyday speech the short way wins:
          **te conviene** + infinitive — **te conviene buscar un depto cerca del subte**, **te
          conviene tomar el subte**, **te conviene reservar hoy**."
      - title: "Advice for us"
        body: "Advice to the group uses *we*: **es mejor que salgamos temprano**, **conviene que lo
          hagamos mañana**. *Salir* keeps its *g*: *salgo* → **salgamos**."
      - title: "¡Cuidado!"
        body: "**¡Cuidado!** — *careful!* — or the full **tené cuidado**: **tené cuidado con la
          billetera en el subte**. The tips that come with it: **no uses el celu en la calle**, **no
          tomes taxi para todo**, **es mejor que pagues en efectivo**, **te conviene reservar**."
