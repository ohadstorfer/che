# ---------------------------------------------------------------------------
# Che — Section 7 outline: "Wishes and advice" (B1.1)
#
# The subjunctive, in the order a porteño needs it — never as a table. First
# after "quiero que" (quiero que vengas), then the wishes everyone says every day
# (que te vaya bien, que la pases lindo), then "cuando" about the future (avisame
# cuando llegues), opinions (no creo que), the negative commands that are
# nothing but subjunctive (no te preocupes), advice, reactions (qué bueno que),
# knowing and understanding, and a unit of lunfardo proper. The checkpoint is
# saying goodbye well.
#
# Vos in the subjunctive: Buenos Aires says "que vengas", "no te preocupes" —
# the same word as tú — and keeps "vengás" for emphasis. The course teaches the
# everyday form and tags it `vos`, because it is the vos speaker's form.
#
# Plan: docs/course/roadmap.md §Section 7. New feature tag: `subj` (mood).
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 8
  slug: "wishes-and-advice"
  title: "Wishes and advice"
  cefr: "B1.1"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "quiero-que-vengas"
    title: "Say what you want others to do"
    summary: "Quiero que vengas"
    grammar:
      - "subjuntivo.querer-que"
      - "subjuntivo.venir-ir-hacer-llamar"
    register_max: "informal"
    sample:
      es: "Quiero que vengas el sábado."
      en: "I want you to come on Saturday."
    tips:
      - title: "Quiero que + a new verb form"
        body: "When you want *someone else* to do something, the second verb changes: **quiero que
          vengas** — *I want you to come*. This form is the **subjunctive**, and *querer que* is where
          it starts."
      - title: "One word for yo and él"
        body: "**Venga**, **vaya**, **haga** are both *I* and *he/she*: *quiere que venga* — *he wants
          me/him to come*. The *que* and the context tell you who."
    words:
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vengas"
            en: "you come (that you come)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "venga"
            en: "come (that I, that he/she come)"
            f: "sg.pres.subj.irregular"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "vayas"
            en: "you go (that you go)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "vaya"
            en: "go (that I, that he/she go)"
            f: "sg.pres.subj.irregular"
          - form: "vayamos"
            en: "let's go, that we go"
            f: "1pl.pres.subj.irregular"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hagas"
            en: "you do (that you do)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "haga"
            en: "do (that I, that he/she do)"
            f: "sg.pres.subj.irregular"
      - lemma: "llamar"
        pos: "verb"
        forms:
          - form: "llames"
            en: "you call (that you call)"
            f: "2sg.pres.subj.vos"
          - form: "llame"
            en: "call (that I, that he/she call)"
            f: "sg.pres.subj"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "traigas"
            en: "you bring (that you bring)"
            f: "2sg.pres.subj.vos.irregular"

  - ordinal: 2
    slug: "necesito-que-me-ayudes"
    title: "Ask for help, and offer it"
    summary: "Necesito que me ayudes"
    grammar:
      - "subjuntivo.querer-que"
      - "subjuntivo.venir-ir-hacer-llamar"
      - "subjuntivo.necesitar-que"
    register_max: "informal"
    sample:
      es: "Necesito que me ayudes con la mudanza."
      en: "I need you to help me with the move."
    tips:
      - title: "Necesito que, te pido que"
        body: "*Quiero que* has company: **necesito que me ayudes** — *I need you to help me*; **te
          pido que me esperes** — *please wait for me*. Whenever you want something from someone
          else, the verb after *que* goes subjunctive. **No hace falta que** — *you do not need to*
          — works the same way: **no hace falta que traigas nada**. And **que venga** on its own is
          *let him come*, *tell him to come*: **dale, que venga**."
      - title: "-ar takes e, the rest take a"
        body: "**Ayudar → ayudes**, **esperar → esperes**, **mandar → mandes**, **avisar → avises**.
          *Poner* and *traer* keep the *g* of their *yo*: **pongo → pongas**, **traigo → traiga**.
          For *we*: **¿qué querés que hagamos?** The same form, with **no** in front, tells someone
          not to: *esperame* — **no me esperes**; *llamame* — **no me llames**. The pronoun jumps to
          the front."
      - title: "¿Querés que te lleve?"
        body: "The offer is the same pattern turned round: **¿querés que te lleve?** — *want a lift?*;
          **¿querés que traiga algo?** — the guest's question before every *asado*. The *yo* form
          matches *él*: **lleve**, **traiga**, **ponga**."
    words:
      - lemma: "ayudar"
        pos: "verb"
        forms:
          - form: "ayudes"
            en: "you help (that you help)"
            f: "2sg.pres.subj.vos"
          - form: "ayude"
            en: "help (that I, that he/she help)"
            f: "sg.pres.subj"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperes"
            en: "you wait (that you wait)"
            f: "2sg.pres.subj.vos"
      - lemma: "poner"
        pos: "verb"
        forms:
          - form: "pongas"
            en: "you put (that you put)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "ponga"
            en: "put (that I, that he/she put)"
            f: "sg.pres.subj.irregular"
      - lemma: "mandar"
        pos: "verb"
        forms:
          - form: "mandes"
            en: "you send (that you send)"
            f: "2sg.pres.subj.vos"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avises"
            en: "you let know (that you let me know)"
            f: "2sg.pres.subj.vos"
      - lemma: "dar"
        pos: "verb"
        forms:
          - form: "des"
            en: "you give (that you give)"
            f: "2sg.pres.subj.vos"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hagamos"
            en: "we do (that we do), let's do"
            f: "1pl.pres.subj.irregular"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "traiga"
            en: "bring (that I, that he/she bring)"
            f: "sg.pres.subj.irregular"
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "lleve"
            en: "give a lift, take (that I, that he/she take)"
            f: "sg.pres.subj"

  - ordinal: 3
    slug: "que-te-vaya-bien"
    title: "Wish someone well"
    summary: "Que te vaya bien"
    grammar:
      - "subjuntivo.deseos"
      - "ojala"
    register_max: "informal"
    sample:
      es: "¡Que la pases lindo!"
      en: "Have a great time!"
    tips:
      - title: "Que…: a wish"
        body: "A wish is *que* + the subjunctive: **que te vaya bien** — *good luck, hope it goes
          well*; **que la pases lindo** — *have a great time*; **que tengas buen finde**. The answer
          to any wish is **gracias, igualmente** — *thanks, you too*. And afterwards you ask **¿cómo
          te fue?** — *how did it go?*"
      - title: "Ojalá"
        body: "**Ojalá** is *I hope*, and the subjunctive follows it: **ojalá que no llueva** — *I hope
          it doesn't rain*."
    words:
      - lemma: "ojalá"
        pos: "interj"
        en: "I hope, hopefully"
      - lemma: "pasarla"
        pos: "verb"
        forms:
          - form: "la pases"
            en: "you have (a time)"
            f: "2sg.pres.subj.vos.clitic"
          - form: "pases"
            f: "2sg.pres.subj.vos"
            bound: true
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tengas"
            en: "you have (that you have)"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salga"
            en: "turns out, goes (that it go)"
            f: "sg.pres.subj.irregular"
      - lemma: "llover"
        pos: "verb"
        forms:
          - form: "llueva"
            en: "rains (that it rain)"
            f: "3sg.pres.subj.irregular"
      - lemma: "buen"
        pos: "adj"
        en: "good"

  - ordinal: 4
    slug: "que-te-mejores"
    title: "Wish people well on the big days"
    summary: "¡Que te mejores!"
    grammar:
      - "subjuntivo.deseos"
      - "ojala"
    register_max: "informal"
    sample:
      es: "¡Suerte en el parcial! Ojalá que te vaya bien."
      en: "Good luck on the exam! I hope it goes well."
    tips:
      - title: "Que te mejores, que te diviertas"
        body: "The pronoun comes along into the wish: **que te mejores** — *get well soon*; **que te
          diviertas** — *have fun*; **que lo disfrutes** — *enjoy it*. The same *que* + subjunctive as
          *que te vaya bien*."
      - title: "Ojalá, for all of us"
        body: "**Ojalá que ganemos** — *I hope we win* — *-ar* verbs swap to **e** for *we* too. For a
          present: **ojalá que te guste**. On a birthday: **¡feliz cumple, que cumplas muchos más!**"
      - title: "¡Éxitos!"
        body: "Before an interview or an exam porteños say **¡éxitos!** or **¡mucha suerte!** — and before
          a **parcial**, the university exam everyone dreads, both."
    words:
      - lemma: "mejorarse"
        pos: "verb"
        forms:
          - form: "te mejores"
            en: "you get better (get well soon)"
            f: "2sg.pres.subj.vos.clitic"
          - form: "mejores"
            f: "2sg.pres.subj.vos"
            bound: true
      - lemma: "divertirse"
        pos: "verb"
        en: "to have fun"
        forms:
          - form: "te diviertas"
            en: "you have fun (have fun)"
            f: "2sg.pres.subj.vos.clitic.irregular"
          - form: "diviertas"
            f: "2sg.pres.subj.vos.irregular"
            bound: true
      - lemma: "disfrutar"
        pos: "verb"
        en: "to enjoy"
        forms:
          - form: "disfrutes"
            en: "you enjoy (enjoy it)"
            f: "2sg.pres.subj.vos"
          - form: "disfrutar"
            f: "inf"
      - lemma: "cumplir"
        pos: "verb"
        en: "to turn (an age); to keep (a promise)"
        forms:
          - form: "cumplas"
            en: "you turn (many happy returns)"
            f: "2sg.pres.subj.vos"
      - lemma: "ganar"
        pos: "verb"
        forms:
          - form: "ganemos"
            en: "we win (that we win)"
            f: "1pl.pres.subj"
      - lemma: "gustar"
        pos: "verb"
        forms:
          - form: "guste"
            en: "you like it (that it please)"
            f: "3sg.pres.subj"
      - lemma: "parcial"
        pos: "noun"
        en: "midterm exam"
      - lemma: "éxito"
        pos: "noun"
        en: "success"
        forms:
          - form: "éxito"
            f: "m.sg"
          - form: "éxitos"
            en: "all the best, good luck"
            f: "m.pl"

  - ordinal: 5
    slug: "cuando-llegues"
    title: "Talk about when something will happen"
    summary: "Avisame cuando llegues"
    grammar:
      - "subjuntivo.cuando-futuro"
      - "terminar"
    register_max: "informal"
    sample:
      es: "Avisame cuando llegues."
      en: "Let me know when you get there."
    tips:
      - title: "Cuando, looking ahead"
        body: "About something that hasn't happened yet, *cuando* takes the subjunctive: **avisame cuando
          llegues** — *let me know when you get there*. About a habit it doesn't: *cuando llego, tomo
          mate*."
    words:
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegues"
            en: "you get there (when you get there)"
            f: "2sg.pres.subj.vos"
          - form: "llegue"
            en: "get there (when I, when he/she get there)"
            f: "sg.pres.subj"
      - lemma: "terminar"
        pos: "verb"
        en: "to finish"
        forms:
          - form: "termino"
            en: "I finish"
            f: "1sg.pres.ind"
          - form: "terminás"
            en: "you finish"
            f: "2sg.pres.ind.vos"
          - form: "terminar"
            f: "inf"
          - form: "termines"
            en: "you finish (when you finish)"
            f: "2sg.pres.subj.vos"
          - form: "termine"
            en: "finish (when I, when he/she finish)"
            f: "sg.pres.subj"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "puedas"
            en: "you can (when you can)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "pueda"
            en: "can (when I, when he/she can)"
            f: "sg.pres.subj.irregular"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salgas"
            en: "you leave (when you leave)"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "apenas"
        pos: "adv"
        en: "as soon as"

  - ordinal: 6
    slug: "cuando-vuelvas"
    title: "Make plans for when you're back"
    summary: "Cuando vuelvas, avisame"
    grammar:
      - "subjuntivo.cuando-futuro"
      - "terminar"
      - "subjuntivo.hasta-que"
    register_max: "informal"
    sample:
      es: "Cuando vuelvas, avisame y nos vemos."
      en: "When you're back, let me know and we'll meet up."
    tips:
      - title: "Cuando vuelvas"
        body: "Plans hang on *cuando* + the subjunctive: **cuando vuelvas del viaje, nos vemos**; **cuando
          cobre, te invito**; **cuando empieces el laburo nuevo, contame**. The other half stays normal,
          or a command."
      - title: "Hasta que, apenas"
        body: "**Hasta que** — *until* — works the same way: **esperá hasta que te llame**. And the promise
          every porteño makes: **apenas sepa algo, te aviso** — *as soon as I know anything, I'll tell
          you*."
      - title: "Cuando quieras"
        body: "**Cuando quieras** — *whenever you like* — leaves an invitation open. The question keeps
          the normal verb: **¿cuándo nos vemos?** The answer doesn't: **cuando nos veamos, te cuento**."
    words:
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "vuelvas"
            en: "you come back (when you come back)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "vuelva"
            en: "come back (when I, when he/she come back)"
            f: "sg.pres.subj.irregular"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quieras"
            en: "(that) you want"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sepas"
            en: "you know (when you know)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "sepa"
            en: "know (when I, when he/she know)"
            f: "sg.pres.subj.irregular"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "nos veamos"
            en: "we see each other (when we meet)"
            f: "1pl.pres.subj.clitic"
          - form: "veamos"
            f: "1pl.pres.subj"
            bound: true
      - lemma: "hasta que"
        pos: "phrase"
        en: "until"
      - lemma: "cobrar"
        pos: "verb"
        forms:
          - form: "cobre"
            en: "get paid (when I, when he/she get paid)"
            f: "sg.pres.subj"
      - lemma: "mudarse"
        pos: "verb"
        forms:
          - form: "te mudes"
            en: "you move (when you move house)"
            f: "2sg.pres.subj.vos.clitic"
          - form: "mudes"
            f: "2sg.pres.subj.vos"
            bound: true
      - lemma: "empezar"
        pos: "verb"
        forms:
          - form: "empieces"
            en: "you start (when you start)"
            f: "2sg.pres.subj.vos.irregular"
          - form: "empiece"
            en: "start (when I, when he/she start)"
            f: "sg.pres.subj.irregular"

  - ordinal: 7
    slug: "practica-cuando-vuelvas"
    title: "Practice: favours, wishes and plans"
    summary: "Necesito que me ayudes"
    grammar:
      - "repaso.subjuntivo.querer-que"
      - "repaso.subjuntivo.deseos"
      - "repaso.subjuntivo.cuando"
    register_max: "informal"
    sample:
      es: "Ojalá que te guste. Avisame cuando vuelvas."
      en: "I hope you like it. Let me know when you're back."
    tips:
      - title: "Needing, asking, offering"
        body: "**Necesito que me ayudes**, **te pido que me esperes**, **¿querés que te lleve?** When the
          person after *que* is someone else, the verb goes subjunctive."
      - title: "Wishes and not-yet"
        body: "Wishes and the future share the form: **que te diviertas**, **ojalá que ganemos**, **cuando
          vuelvas**, **hasta que sepa algo**."
      - title: "No hace falta que"
        body: "**No hace falta que** + subjunctive is *you do not need to*: **no hace falta que
          vengas hoy**. With a thing, **hace falta** is *we need*: **hace falta pan**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "ayudes"
      - "esperes"
      - "pongas"
      - "hagamos"
      - "te mejores"
      - "te diviertas"
      - "ganemos"
      - "vuelvas"
      - "quieras"
      - "sepa"
      - "hasta que"
      - "me mudé"
      - "hace falta"
      - "extrañás"

  - ordinal: 8
    slug: "no-creo"
    title: "Give your opinion"
    summary: "¿Qué te parece?"
    grammar:
      - "opinion.creo-que"
      - "subjuntivo.no-creo-que"
      - "parecer"
    register_max: "informal"
    sample:
      es: "No creo que venga."
      en: "I don't think he's coming."
    tips:
      - title: "Creo que, no creo que"
        body: "**Creo que viene** — *I think he's coming* — keeps the normal verb. Doubt it and the
          subjunctive comes in: **no creo que venga**."
      - title: "¿Qué te parece?"
        body: "**¿Qué te parece?** — *what do you think?* — and the answer **me parece bien**, **me
          parece que no**. Day to day an opinion starts with **para mí**: **para mí, es caro**;
          **para mí que no viene** — *I reckon he is not coming*. And to dodge the question: **ni
          idea**."
    words:
      - lemma: "parecer"
        pos: "verb"
        en: "to seem"
        forms:
          - form: "me parece"
            en: "I think, it seems to me"
            f: "3sg.pres.ind.clitic"
          - form: "te parece"
            en: "you think, it seems to you"
            f: "3sg.pres.ind.clitic"
          - form: "parece"
            f: "3sg.pres.ind"
            bound: true
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "sea"
            en: "is (that it be)"
            f: "sg.pres.subj.irregular"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "esté"
            en: "is (that he/she be)"
            f: "sg.pres.subj.irregular"
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "haya"
            en: "there is (that there be)"
            f: "3sg.pres.subj.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tenga"
            en: "has (that he/she have)"
            f: "sg.pres.subj.irregular"
      - lemma: "idea"
        pos: "noun"
        en: "idea"
      - lemma: "para mí"
        pos: "phrase"
        en: "in my opinion, if you ask me"
      - lemma: "ni idea"
        pos: "phrase"
        en: "no idea"

  - ordinal: 9
    slug: "puede-ser-que"
    title: "Say how likely something is"
    summary: "Puede ser que llueva"
    grammar:
      - "opinion.creo-que"
      - "subjuntivo.no-creo-que"
      - "parecer"
      - "subjuntivo.puede-ser-que"
    register_max: "informal"
    sample:
      es: "Puede ser que estén cerrados hoy."
      en: "They might be closed today."
    tips:
      - title: "Puede ser que"
        body: "**Puede ser** — *could be* — is the porteño *maybe*. Add *que* and the subjunctive follows:
          **puede ser que llueva**, **puede ser que estén cerrados**. **Es posible que** says the same,
          a little more carefully."
      - title: "No creo que, for them"
        body: "For *they*, add **-n** to the form you know: **no creo que sean**, **no creo que estén**,
          **no creo que tengan**, **no creo que puedan**, **no creo que lleguen a tiempo**."
      - title: "Seguro, or not"
        body: "Sure of it? The normal verb: **seguro que abren**, **creo que viene**. Doubt it, and the
          subjunctive: **no creo que abran hoy**. Even the forecast gets the treatment: **el pronóstico
          es de lluvia, pero no creo que llueva**."
    words:
      - lemma: "puede ser"
        pos: "phrase"
        en: "could be, it might"
      - lemma: "posible"
        pos: "adj"
        en: "possible"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "sean"
            en: "are (that they be)"
            f: "3pl.pres.subj.irregular"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estén"
            en: "are (that they be there, that they be so)"
            f: "3pl.pres.subj.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tengan"
            en: "have (that they have)"
            f: "3pl.pres.subj.irregular"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "puedan"
            en: "can (that they can)"
            f: "3pl.pres.subj.irregular"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "lleguen"
            en: "get there (that they get there)"
