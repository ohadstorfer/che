    sample:
      es: "Vení sí o sí, en serio."
      en: "Come no matter what, seriously."
    tips:
      - title: "Fillers"
        body: "A porteño sentence breathes through its fillers: **ponele** — *let's say*; **digamos**
          — *sort of*; **qué sé yo** — *I dunno*; **bah** — *well, I mean*: *son las ocho, bah,
          ponele*."
      - title: "Yes, no, and no way"
        body: "**¡Más vale!** — *of course!*; **sí o sí** — *no matter what*; **ni loco** — *no way*.
          And when there's too much going on: **estoy a full** — *I'm flat out*."
