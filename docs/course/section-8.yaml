            en: "you could (if you could)"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "ir"
        pos: "verb"
        forms:
          - form: "iríamos"
            en: "we would go"
            f: "1pl.cond.ind"
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "compraríamos"
            en: "we would buy"
            f: "1pl.cond.ind"
      - lemma: "dar"
        pos: "verb"
        forms:
          - form: "daría"
            en: "would give (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sabría"
            en: "would know (I/he/she)"
            f: "sg.cond.ind.irregular"
      - lemma: "millonario"
        pos: "adj"
        en: "rich, a millionaire"
        forms:
          - form: "millonario"
            f: "m.sg"
          - form: "millonaria"
            f: "f.sg"
      - lemma: "la vuelta al mundo"
        pos: "phrase"
        en: "a trip around the world"

  - ordinal: 5
    slug: "me-gustaria"
    title: "Say what you'd like"
    summary: "Me gustaría ir"
    grammar:
      - "condicional.gustar"
      - "cortesia"
    register_max: "informal"
    sample:
      es: "Me gustaría conocer Mendoza."
      en: "I'd like to see Mendoza."
    tips:
      - title: "Me gustaría"
        body: "**Me gustaría** — *I'd like* — is *gustar* in the conditional, with the same *me*: **me
          gustaría ir**, **¿te gustaría venir?**. **Me encantaría** is the enthusiastic yes."
    words:
      - lemma: "gustar"
        pos: "verb"
        forms:
          - form: "gustaría"
            en: "would like"
            f: "3sg.cond.ind"
      - lemma: "encantar"
        pos: "verb"
        forms:
          - form: "encantaría"
            en: "would love"
            f: "3sg.cond.ind"
      - lemma: "conocer"
        pos: "verb"
        forms:
          - form: "conocer"
            en: "to see, to get to know"
            f: "inf"
      - lemma: "aprender"
        pos: "verb"
        forms:
