            f: "inf"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "vivir"
            f: "inf"

  - ordinal: 6
    slug: "preferiria"
    title: "Ask and suggest politely"
    summary: "¿Te molestaría esperar?"
    grammar:
      - "condicional.gustar"
      - "cortesia"
    register_max: "informal"
    sample:
      es: "¿Te molestaría esperar un toque?"
      en: "Would you mind waiting a sec?"
    tips:
      - title: "The polite would"
        body: "The conditional takes the edge off a request: *¿me das una mano?* becomes **¿me darías una
          mano?**, *¿me ayudás?* becomes **¿me ayudarías?**. **¿Te molestaría…?** — *would you
          mind…?* — works like *me gustaría*."
      - title: "Suggest, and say no nicely"
        body: "**Podríamos ir al cine** — *we could go to the movies*. **Nos convendría salir temprano**
          — *we'd better leave early*. Turning it down: **preferiría ir otro día**. Saying yes: **con
          gusto**."
    words:
      - lemma: "preferir"
        pos: "verb"
        forms:
          - form: "preferiría"
            en: "would rather (I/he/she)"
            f: "sg.cond.ind"
      - lemma: "molestar"
        pos: "verb"
        forms:
          - form: "molestaría"
            en: "would bother, would mind"
            f: "3sg.cond.ind"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "podríamos"
            en: "we could"
            f: "1pl.cond.ind.irregular"
      - lemma: "convenir"
        pos: "verb"
        forms:
          - form: "convendría"
            en: "would be better, would suit"
            f: "3sg.cond.ind.irregular"
      - lemma: "dar"
        pos: "verb"
        forms:
          - form: "darías"
            en: "you would give"
            f: "2sg.cond.ind.vos"
      - lemma: "ayudar"
        pos: "verb"
        forms:
          - form: "ayudarías"
            en: "you would help"
            f: "2sg.cond.ind.vos"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasarías"
            en: "you would stop by"
            f: "2sg.cond.ind.vos"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperar"
            en: "to wait"
            f: "inf"
      - lemma: "si no es molestia"
        pos: "phrase"
        en: "if it's no trouble"
      - lemma: "con gusto"
        pos: "phrase"
        en: "gladly, with pleasure"

  - ordinal: 7
    slug: "practica-yo-que-vos"
    title: "Practice: would and if"
    summary: "Si pudiera, iría"
    grammar:
      - "repaso.condicional"
      - "repaso.si-hipotetico"
    register_max: "informal"
    sample:
      es: "Si tuviera tiempo, iría con vos."
      en: "If I had time, I'd go with you."
    tips:
      - title: "If I had, I would"
        body: "**Si tuviera plata, viajaría.** The *if* half takes *tuviera, fuera, pudiera*; the other half takes *-ía*: *iría, haría, sería*."
      - title: "Yo que vos"
        body: "Porteño advice starts with **yo que vos** — *if I were you* — and goes straight to the conditional: **yo que vos, no le diría nada**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "yo que vos"
      - "iría"
      - "haría"
      - "diría"
      - "tuviera"
      - "fuera"
      - "pudiera"
      - "gustaría"
      - "encantaría"
      - "vengas"
      - "ojalá"
      - "era"

  - ordinal: 8
    slug: "practica-si-ganara"
    title: "Practice: in your shoes"
    summary: "Yo en tu lugar, me quedaría"
    grammar:
      - "repaso.condicional"
      - "repaso.si-hipotetico"
    register_max: "informal"
    sample:
      es: "Si tuviéramos plata, iríamos a Bariloche."
      en: "If we had money, we'd go to Bariloche."
    tips:
      - title: "Would, for everyone"
        body: "**Hablaría**, **me quedaría** (I, he, she) · **¿qué dirías?** (vos) · **iríamos**,
          **podríamos** (we). Same *-ía* ending, a different last letter."
      - title: "If we had"
        body: "**Si ganara**, **si viviera**, **si tuviéramos**: the *if* half takes *-ra*, the other half
          *-ía*. Politely, the *-ía* alone is enough: **¿te molestaría esperar?**"
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "en tu lugar"
      - "hablaría"
      - "me quedaría"
      - "tendrías"
      - "ganara"
      - "viviera"
      - "tuviéramos"
      - "iríamos"
      - "preferiría"
      - "podríamos"
      - "podrías"
      - "conviene"
      - "te recomiendo"
      - "tenía"

  - ordinal: 9
    slug: "manejar-en-baires"
    title: "Get around by car"
    summary: "Manejar en Buenos Aires"
    grammar:
      - "ciudad.transito"
      - "manejar"
    register_max: "informal"
    sample:
      es: "No manejo en el centro, hay mucho tránsito."
      en: "I don't drive downtown, there's a lot of traffic."
    tips:
      - title: "Manejar, estacionar"
        body: "A porteño **maneja** (drives) an **auto** and spends half an hour trying to **estacionar**
          (park). *Conducir* and *aparcar* are Spain's."
      - title: "La avenida"
        body: "Buenos Aires is a grid of **avenidas** — Corrientes, Santa Fe, 9 de Julio — and every
          corner has a **semáforo**. Cross when it's green: **cruzá**."
    words:
      - lemma: "manejar"
        pos: "verb"
        en: "to drive"
        forms:
          - form: "manejo"
            en: "I drive"
            f: "1sg.pres.ind"
          - form: "manejás"
            en: "you drive"
            f: "2sg.pres.ind.vos"
          - form: "manejar"
            f: "inf"
      - lemma: "estacionar"
        pos: "verb"
        en: "to park"
        forms:
          - form: "estacionar"
            f: "inf"
          - form: "estacioné"
            en: "I parked"
            f: "1sg.pret.ind"
      - lemma: "tránsito"
        pos: "noun"
        en: "traffic"
      - lemma: "semáforo"
        pos: "noun"
        en: "traffic light"

  - ordinal: 10
    slug: "la-ruta"
    title: "Take the car out of town"
    summary: "Cargá nafta antes de la ruta"
    grammar:
      - "ciudad.transito"
      - "manejar"
    register_max: "informal"
    sample:
      es: "Manejé tres horas por la ruta."
      en: "I drove three hours on the highway."
    tips:
      - title: "Out of the city"
        body: "Leaving Buenos Aires you take **la autopista**, then **la ruta**. First you **cargás
          nafta** — *nafta*, never *gasolina* — and on the way you pay the **peaje**. **La General
          Paz** is the ring road between the Capital and the conurbano."
      - title: "Manejé, ¿manejaste?"
        body: "*Manejar* in the past is regular: **manejé**, **¿manejaste vos?**. **Chocar** swaps *c*
          for *qu* before *é*: **choqué**. Run a red light and it's **una multa**."
      - title: "Papers and parking"
        body: "Your driving licence is the **registro** — *¿tenés registro?*. A paid parking space or
          garage is a **cochera**."
    words:
