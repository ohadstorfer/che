      - title: "Venías, podías"
        body: "Reported, *venís* becomes **venías** and *podés* becomes **podías**: *«¿Venís?»* → **me
          preguntó si venías**; *«No puedo»* → **me dijo que no podía**."
      - title: "Te juro"
        body: "**Te juro** — *I swear* — is how a porteño vouches for the story: **te juro que me dijo
          eso**. A long talk with a friend is **una charla**: **charlé con Sofi**."
