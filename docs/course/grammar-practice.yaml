# ---------------------------------------------------------------------------
# Grammar practice — the extra time the course gives its hard grammar.
#
# A 2026-09-24 review found the course spending its lessons on vocabulary and
# rushing its grammar: a unit of 46 clothes and colours got 16 lessons, "si
# tuviera… viajaría" got 4. This file fixes the balance without touching what
# units teach:
#
#   - every unit listed here gets `lessons` Grammar practice lessons, after its
#     teaching lessons and before its practice and check. They drill the
#     unit's new grammar — its verb forms, pronouns, agreement — in sentences
#     from this unit and from earlier ones (`focus`), to the gap, typed, and
#     built from tiles (scripts/course/lib/course-plan.mjs).
#   - the first of them opens on `tip`: the whole pattern at once, with a table
#     of the forms. The unit's own short tips still open its teaching lessons.
#   - `practice_sections`: teaching units in these sections, which were seeded
#     before practice lessons existed, get `practice_per_unit` of them.
#
# Tables are Markdown pipe rows; the app renders them as a grid (TipCard).
# A table only shows forms the course has taught by that unit.
#
# focus (optional): feature filters for sentences from earlier units that
# belong in this unit's practice, e.g. {tense: pret} brings the preterite back
# next to the imperfect. Without it: the unit's new forms, plus the other forms
# of their lemmas taught before.
#
# Apply: npm run course:grammar -- <migration.sql>   (lessons, tips, ordinals)
#        npm run course:lessons -- --all             (every unit's slots)
# ---------------------------------------------------------------------------

practice_sections: [1, 2, 3]
practice_per_unit: 1

units:
  # ── Section 1 ───────────────────────────────────────────────────────────
  - unit: vos-y-sos
    lessons: 1
    tip:
      title: "Soy, sos"
      body: |
        *Ser* — to be — has a form for each person. So far:

        | yo | **soy** | I am |
        | vos | **sos** | you are |

        Use **vos** with everyone: friends, the waiter, your boss. A question is the same words with a rising voice: *¿Sos Sofi?*

  - unit: sos-turista
    lessons: 1
    tip:
      title: "Soy estudiante, ¿sos turista?"
      body: |
        *Ser* says who you are — a name, or a role with no *un* in front:

        | yo | **soy** | Soy estudiante. |
        | vos | **sos** | ¿Sos turista? |
        | vos | **sos vos** | ¿Sos vos? — Sí, soy yo. |

        *Vos* can go before the verb or after it: *¿Vos sos Juan?* and *¿Sos vos?* are both everyday Buenos Aires.

  - unit: como-te-llamas
    lessons: 1
    tip:
      title: "Me llamo, te llamás"
      body: |
        The little word in front changes with the person, and so does the verb:

        | yo | **me llamo** | my name is |
        | vos | **te llamás** | your name is |

        The question puts *cómo* first: **¿Cómo te llamás?** The vos form ends in **-ás**, with the stress on the end.

  - unit: encantado
    lessons: 1
    tip:
      title: "-o for me, -ás or -és for vos"
      body: |
        The same two endings as *me llamo, te llamás*, on other verbs:

        | | yo | vos |
        | llamarse | **me llamo** | **te llamás** |
        | hablar | **hablo** | **hablás** |
        | entender | **entiendo** | **entendés** |

        The vos form is stressed on the end, and never changes its stem: *entiendo* but **entendés**.

  - unit: el-y-ella
    lessons: 1
    tip:
      title: "Soy, sos, es"
      body: |
        Three people, three forms of *ser*:

        | yo | **soy** |
        | vos | **sos** |
        | él, ella | **es** |

        The verb already tells you who, so the pronoun is usually dropped: *Es de Rosario* — he's (or she's) from Rosario.

  - unit: quien-es
    lessons: 1
    tip:
      title: "Me llamo, te llamás, se llama"
      body: |
        The little word in front of *llamar* changes with the person, just like *soy, sos, es*:

        | yo | **me llamo** | **soy** |
        | vos | **te llamás** | **sos** |
        | él, ella | **se llama** | **es** |

        *¿Quién es ella?* — *Se llama Lucía. Es una amiga.*

  - unit: argentino-argentina
    lessons: 1
    tip:
      title: "The word matches the person"
      body: |
        Words that describe someone change for a man or a woman:

        | a man | a woman |
        | argentin**o** | argentin**a** |
        | uruguay**o** | uruguay**a** |
        | porteñ**o** | porteñ**a** |
        | ingl**és** | ingl**esa** |

        *-o* becomes *-a*. A word ending in a consonant adds *-a*, and *inglés* loses its accent: **inglesa**.

  - unit: de-todos-lados
    lessons: 1
    tip:
      title: "Three kinds of ending"
      body: |
        How a nationality changes for a woman depends on how it ends:

        | a man | a woman |
        | brasileñ**o** | brasileñ**a** |
        | español | español**a** |
        | franc**és** | franc**esa** |
        | alem**án** | alem**ana** |
        | canadiens**e** | canadiens**e** |

        *-o* becomes *-a*; a consonant adds *-a* and loses its accent; *-e* stays the same.

  - unit: la-familia
    lessons: 1
    tip:
      title: "Hermano, hermana"
      body: |
        Most family words come in pairs:

        | man | woman |
        | herman**o** | herman**a** |
        | hij**o** | hij**a** |
        | abuel**o** | abuel**a** |
        | novi**o** | novi**a** |
        | viej**o** | viej**a** |

        **Mi** — *my* — never changes: *mi hermano*, *mi hermana*. And *papá* ends in *-a* but is a man.

  - unit: tios-y-primos
    lessons: 1
    tip:
      title: "Tío, tía"
      body: |
        The rest of the family comes in the same pairs:

        | man | woman |
        | tí**o** | tí**a** |
        | prim**o** | prim**a** |
        | sobrin**o** | sobrin**a** |
        | niet**o** | niet**a** |
        | marido | mujer |

        *Mi* never changes: *mi tío*, *mi tía*. **Bebé** is the same word for a boy or a girl.

  - unit: cuantos-anos-tenes
    lessons: 1
    tip:
      title: "Tengo, tenés, tiene"
      body: |
        *Tener* — to have — is how you give your age:

        | yo | **tengo** | Tengo veinte años. |
        | vos | **tenés** | ¿Cuántos años tenés? |
        | él, ella | **tiene** | Tiene doce años. |

        The *e* of *tener* becomes *ie* in *tiene* — but never in the vos form: **tenés**.

  - unit: tengo-hambre
    lessons: 1
    tip:
      title: "Tengo hambre"
      body: |
        Spanish *has* what English *is*:

        | tengo hambre | I'm hungry |
        | ¿tenés sed? | are you thirsty? |
        | tiene frío | he's (she's) cold |
        | tengo sueño | I'm sleepy |
        | tenés razón | you're right |

        The same **tengo, tenés, tiene** as *tengo veinte años*.

  # ── Section 2 ───────────────────────────────────────────────────────────
  - unit: la-gente
    lessons: 1
    tip:
      title: "Ser and tener, all of them"
      body: |
        With *nosotros* and *ellos*, both verbs are complete:

        | | ser | tener |
        | yo | soy | tengo |
        | vos | sos | tenés |
        | él, ella | es | tiene |
        | nosotros | **somos** | **tenemos** |
        | ellos, ustedes | **son** | **tienen** |

        **Ustedes** — *you all* — uses the *ellos* form. Argentina never uses *vosotros*.

  - unit: altos-y-morochos
    lessons: 1
    tip:
      title: "Son altos, somos morochos"
      body: |
        Describing more than one person is *ser* plus a word with an *-s*:

        | yo | soy alt**o** | soy alt**a** |
        | vos | sos rubi**o** | sos rubi**a** |
        | él, ella | es flac**o** | es flac**a** |
        | nosotros | **somos** alt**os** | **somos** alt**as** |
        | ellos, ustedes | **son** moroch**os** | **son** lind**as** |

        A mixed group takes *-os*. A word in *-e* or a consonant just adds *-s* or *-es*: *joven* → **jóvenes**.

  - unit: donde-esta
    lessons: 1
    tip:
      title: "Estar, and ser or estar"
      body: |
        | yo | **estoy** |
        | vos | **estás** |
        | él, ella | **está** |

        Two verbs mean *to be*. **Ser** says who or what something is, and where it's from: *Soy de Rosario.* **Estar** says where it is right now: *Estoy en el centro.*

  - unit: donde-estan-las-llaves
    lessons: 1
    tip:
      title: "Está, están"
      body: |
        *Estar* for where things are, one or several:

        | one thing | **¿Dónde está** mi celu? | **Está** en la mochila. |
        | several | **¿Dónde están** mis llaves? | **Están** en casa. |

        No *la* before home: **en casa**. *Arriba, abajo, adentro* need nothing after them: *Estoy abajo.*

  - unit: hay-un-kiosco
    lessons: 1
    tip:
      title: "Hay or está"
      body: |
        | something new | something you already know |
        | **Hay** un kiosco. | **El** kiosco **está** en la esquina. |
        | **Hay** una parada acá. | **La** parada **está** lejos. |

        **Hay** goes with *un, una* or a number, and never changes: *hay dos subtes*. **Está** goes with *el, la*.

  - unit: hay-un-tren
    lessons: 1
    tip:
      title: "¿Hay … por acá?"
      body: |
        | asking | **¿Hay** una estación **por acá**? |
        | yes | Sí, **hay** una en la avenida. |
        | no | No, acá no **hay** tren. |
        | where | La estación **está** a dos cuadras. |

        **Hay** never changes: *hay un bar*, *hay dos plazas*, *hay gente*. And *a + el* is still **al**, *de + el* is **del**: *al parque*, *la estación del subte*.

  - unit: como-estas
    lessons: 1
    tip:
      title: "Estar, and four endings"
      body: |
        | yo | estoy | vos | estás |
        | él, ella | está | nosotros | **estamos** |
        | ellos, ustedes | **están** | | |

        The word for the feeling matches the people in number too:

        | one man | cansad**o** | one woman | cansad**a** |
        | men | cansad**os** | women | cansad**as** |

        A word ending in *-e* just adds *-s*: *triste, tristes*. *Feliz* becomes **felices**.

  - unit: esta-cerrado
    lessons: 1
    tip:
      title: "Things have a state too"
      body: |
        *Estar* says how something is right now, and the word matches the thing:

        | el bar | está cerrad**o** | la plaza | está llen**a** |
        | mis hermanos | están apurad**os** | la cerveza | está calient**e** |

        | ¿Por qué estás apurada? | **Porque** el bondi está lleno. |

        *Caliente* and *libre* only add *-s*: *libres*, *calientes*.

  - unit: que-haces
    lessons: 2
    tip:
      title: "Every -ar verb"
      body: |
        Take off *-ar* and add the ending for the person:

        | yo | labur**o** |
        | vos | labur**ás** |
        | él, ella | labur**a** |
        | nosotros | labur**amos** |
        | ellos, ustedes | labur**an** |

        It works for *hablar, tomar, estudiar, caminar* — every regular -ar verb. **Hacer** is irregular in *yo*: **hago**, *hacés, hace*.

  - unit: practico-castellano
    lessons: 1
    tip:
      title: "More -ar verbs, same endings"
      body: |
        | | practicar | necesitar | ayudar |
        | yo | practic**o** | necesit**o** | ayud**o** |
        | vos | practic**ás** | necesit**ás** | ayud**ás** |
        | él, ella | practic**a** | necesit**a** | ayud**a** |
        | nosotros | practic**amos** | necesit**amos** | ayud**amos** |
        | ellos, ustedes | practic**an** | necesit**an** | ayud**an** |

        *Usar, buscar, preguntar, enseñar* work the same way. The vos form always carries the accent: *¿Qué buscás?*

  - unit: mate-y-facturas
    lessons: 1
    tip:
      title: "Gusta or gustan"
      body: |
        The verb matches the thing you like, not you:

        | one thing | more than one |
        | Me **gusta** el mate. | Me **gustan** las facturas. |
        | ¿Te **gusta** la milanesa? | ¿Te **gustan** los mates? |

        **Me** — to me, **te** — to you, **le** — to him or her. For emphasis, add *a mí*: *A mí me gusta amargo.*

  - unit: nos-gustan-los-fideos
    lessons: 1
    tip:
      title: "Me, te, le, nos, les"
      body: |
        The little word says who likes it; *gusta* or *gustan* matches the food:

        | a mí | **me** gusta el pollo |
        | a vos | **te** gusta el pescado |
        | a él, a ella | **le** gusta la fruta |
        | a nosotros | **nos** gustan los fideos |
        | a ellos, a ustedes | **les** gustan los huevos |

        *Les* is *them* or *you all*: add **a ellos** or **a ustedes** when it isn't clear.

  - unit: facu-y-laburo
    lessons: 1
    tip:
      title: "Tener que, and jobs"
      body: |
        **Tener que** + an infinitive — the *-ar, -er, -ir* form — is *to have to*:

        | Tengo que laburar. | I have to work. |
        | ¿Tenés que estudiar? | Do you have to study? |

        Jobs change for a woman: *profesor* → **profesora**, *médico* → **médica**, *jefe* → **jefa**. And no *un, una*: **Soy abogada.**

  - unit: es-enfermera
    lessons: 1
    tip:
      title: "Every person has to"
      body: |
        | yo | **tengo que** laburar |
        | vos | **tenés que** practicar |
        | él, ella | **tiene que** ayudar |
        | nosotros | **tenemos que** estudiar |
        | ellos, ustedes | **tienen que** buscar a sus hijos |

        Jobs: *enfermero* → **enfermera**, *vendedor* → **vendedora**; *periodista* and *policía* stay the same. No *un, una*: **Es contadora.**

  - unit: comes-vivis
    lessons: 2
    tip:
      title: "Every -er and -ir verb"
      body: |
        | | comer | vivir |
        | yo | com**o** | viv**o** |
        | vos | com**és** | viv**ís** |
        | él, ella | com**e** | viv**e** |
        | nosotros | com**emos** | viv**imos** |
        | ellos, ustedes | com**en** | viv**en** |

        -er and -ir are the same except for **vos** and **nosotros**, where each keeps its own vowel.

  - unit: vendo-diarios
    lessons: 1
    tip:
      title: "-er and -ir, only two places apart"
      body: |
        | | leer | compartir | escribir |
        | yo | le**o** | compart**o** | escrib**o** |
        | vos | le**és** | compart**ís** | escrib**ís** |
        | él, ella | le**e** | compart**e** | escrib**e** |
        | nosotros | le**emos** | compart**imos** | escrib**imos** |
        | ellos, ustedes | le**en** | compart**en** | escrib**en** |

        -er keeps **e** and -ir takes **i**, but only for *vos* and *nosotros*: *vend**és**, vend**emos*** but *abr**ís***. *Recibir* and *correr* follow the same pattern: *recibo, recibís, recibe*.

  # ── Section 3 ───────────────────────────────────────────────────────────
  - unit: queres-podes-vas
    lessons: 2
    tip:
      title: "Querer, poder, ir"
      body: |
        | | querer | poder | ir |
        | yo | quiero | puedo | voy |
        | vos | **querés** | **podés** | vas |
        | él, ella | quiere | puede | va |
        | nosotros | **queremos** | **podemos** | vamos |
        | ellos | quieren | pueden | van |

        *e → ie* and *o → ue* everywhere except **vos** and **nosotros**. *Ir* is its own thing. Add an infinitive for plans: *¿Querés salir?*

  - unit: preferis-salir
    lessons: 1
    tip:
      title: "Prefiero, preferís"
      body: |
        More verbs that stretch their stem — but never with vos:

        | | preferir | volver | empezar |
        | yo | pref**ie**ro | v**ue**lvo | emp**ie**zo |
        | vos | **preferís** | **volvés** | **empezás** |
        | él, ella | pref**ie**re | v**ue**lve | emp**ie**za |
        | ellos | | | emp**ie**zan |

        The same as *quiero, querés* and *puedo, podés*. Add an infinitive for the plan: *¿Preferís ir al teatro?*

  - unit: dale-veni
    lessons: 2
    tip:
      title: "How a vos command is made"
      body: |
        Take the infinitive, drop the *-r*, and stress the last vowel:

        | mirar | **mirá** |
        | esperar | **esperá** |
        | venir | **vení** |
        | andar | **andá** |

        A pronoun joins the end, and the accent goes, because the stress doesn't move: *esperá* → **esperame**. *Decir* → **decime**, *sentarse* → **sentate**.

  - unit: segui-derecho
    lessons: 1
    tip:
      title: "Directions in vos"
      body: |
        Every direction is a vos command: drop the *-r*, stress the last vowel.

        | doblar | **doblá** | Doblá a la derecha. |
        | cruzar | **cruzá** | Cruzá la avenida. |
        | caminar | **caminá** | Caminá dos cuadras. |
        | seguir | **seguí** | Seguí derecho. |
        | parar | **pará** | ¡Pará! |

        With a pronoun it joins the end: *bajarse* → **bajate**, *subirse* → **subite**.

  - unit: la-rutina
    lessons: 1
    tip:
      title: "Me levanto, te levantás"
      body: |
        These verbs carry a pronoun that matches the person:

        | yo | **me** levanto | **me** acuesto |
        | vos | **te** levantás | **te** acostás |
        | él, ella | **se** levanta | **se** acuesta |
        | nosotros | **nos** levantamos | |

        The pronoun goes before the verb. *Acostarse* changes *o → ue*, but not with vos: **te acostás**.

  - unit: me-despierto-temprano
    lessons: 1
    tip:
      title: "The whole routine, every person"
      body: |
        | yo | **me** despierto | **me** levanto | **me** acuesto |
        | vos | **te** despertás | **te** levantás | **te** acostás |
        | él, ella | **se** despierta | **se** levanta | **se** acuesta |
        | nosotros | | **nos** levantamos | **nos** acostamos |
        | ellos | | **se** levantan | **se** acuestan |

        *Despertarse* and *acostarse* stretch their stem, but not with vos or nosotros. **Me voy** works the same way: *me voy, te vas, se va*.

  - unit: que-te-gusta-hacer
    lessons: 1
    tip:
      title: "Me gusta + doing something"
      body: |
        With a verb, *gusta* stays singular, even for two activities:

        | Me gusta bailar. | Me gusta leer y cocinar. |
        | Me encanta el fútbol. | Me encantan las series. |

        Agreeing: **A mí también** after a *yes*, **A mí tampoco** after a *no*.

  - unit: me-interesa
    lessons: 1
    tip:
      title: "Le gusta, les interesa"
      body: |
        The thing liked is the subject; the pronoun says who likes it:

        | a mí | **me** gusta nadar | **me** interesa el tenis |
        | a vos | **te** gusta viajar | **te** interesan los deportes |
        | a él, a ella | **le** gusta cantar | **le** interesa la música |
        | a nosotros | **nos** gusta pasear | **nos** encanta la playa |
        | a ellos | **les** gusta el fútbol | **les** encantan las series |

        With a verb it stays singular: *me gusta nadar y cantar*. **Odiar** is a normal verb: *odio, odiás*.

  # ── Section 4 ───────────────────────────────────────────────────────────
  - unit: ayer-labure
    lessons: 2
    tip:
      title: "Present or past: the stress"
      body: |
        | | now | yesterday |
        | yo | labur**o** | labur**é** |
        | vos | labur**ás** | labur**aste** |
        | él, ella | labur**a** | labur**ó** |

        *Laburo* is *I work*; **laburó** is *he worked*. Only the stress, and the accent that marks it, tells them apart. Every regular -ar verb works like this: *hablé, llegaste, compró*.

  - unit: cenamos-afuera
    lessons: 1
    tip:
      title: "The -ar past for everyone"
      body: |
        | | cenar | pagar | llegar |
        | yo | cen**é** | pag**ué** | lleg**ué** |
        | vos | cen**aste** | pag**aste** | lleg**aste** |
        | él, ella | cen**ó** | pag**ó** | lleg**ó** |
        | nosotros | cen**amos** | | lleg**amos** |
        | ellos, ustedes | | | lleg**aron** |

        *-amos* looks like the present, so the time says which: **anoche cenamos afuera**. *-aron* is only ever the past: *hablaron, tomaron*. In *yo*, *-gar* verbs add a *u* to keep the hard *g*: **pagué**, **llegué**.

  - unit: comi-y-sali
    lessons: 2
    focus: [{ tense: pret }]
    tip:
      title: "The past of -er and -ir"
      body: |
        | | -ar | -er, -ir |
        | yo | labur**é** | com**í**, sal**í** |
        | vos | labur**aste** | com**iste**, sal**iste** |
        | él, ella | labur**ó** | com**ió**, sal**ió** |
        | nosotros | | com**imos**, sal**imos** |

        -er and -ir share one set of endings. *Salimos* is both *we go out* and *we went out* — *anoche* or *ayer* tells you which.

  - unit: naci-en
    lessons: 1
    focus: [{ tense: pret }]
    tip:
      title: "-er and -ir, every person"
      body: |
        | | nacer | vivir | volver |
        | yo | nac**í** | viv**í** | volv**í** |
        | vos | nac**iste** | viv**iste** | volv**iste** |
        | él, ella | nac**ió** | viv**ió** | volv**ió** |
        | ellos, ustedes | | viv**ieron** | |

        *Ellos* ends in **-ieron**: *comieron, salieron, vivieron*. **¿Dónde naciste?** — **Nací en Rosario.** And **no entendí** is the past too.

  - unit: fui-a-la-cancha
    lessons: 2
    focus: [{ tense: pret }]
    tip:
      title: "Fui, estuve, tuve"
      body: |
        | | ir, ser | estar | tener |
        | yo | **fui** | **estuve** | **tuve** |
        | vos | **fuiste** | **estuviste** | **tuviste** |
        | él, ella | **fue** | **estuvo** | **tuvo** |
        | nosotros | **fuimos** | | |
        | ellos | **fueron** | | |

        No accents here. *Fui a la cancha* is *went*; *fue bárbaro* is *was*.

  - unit: la-pasamos-barbaro
    lessons: 1
    focus: [{ tense: pret }]
    tip:
      title: "Estuvimos, tuvimos, la pasamos"
      body: |
        | | estar | tener | pasarla |
        | yo | estuve | tuve | **la pasé** |
        | vos | estuviste | tuviste | **la pasaste** |
        | él, ella | estuvo | tuvo | |
        | nosotros | **estuvimos** | **tuvimos** | **la pasamos** |
        | ellos | **estuvieron** | **tuvieron** | |

        The odd stem stays for every person, with no accent. **¿Cómo estuvo?** — *how was it?* — **Estuvo increíble, la pasamos bárbaro.**

  - unit: el-finde
    lessons: 2
    focus: [{ tense: pret }]
    tip:
      title: "The irregular past"
      body: |
        | | hacer | ver | decir | venir | poder |
        | yo | hice | vi | dije | vine | pude |
        | vos | hiciste | viste | dijiste | viniste | pudiste |
        | él, ella | hizo | vio | dijo | | |

        A new stem, then *-e, -iste, -o* — with no accent. Tell the story in order with **primero**, **entonces**, **al final**.

  - unit: vinieron-todos
    lessons: 1
    focus: [{ tense: pret }]
    tip:
      title: "More of the irregular past"
      body: |
        | | traer | querer | venir | poder |
        | yo | traje | quise | vine | pude |
        | vos | trajiste | quisiste | viniste | pudiste |
        | él, ella | trajo | quiso | vino | pudo |
        | nosotros | | | vinimos | pudimos |
        | ellos | trajeron | | vinieron | pudieron |

        Same endings as *hice*: *-e, -iste, -o, -imos, -ieron* — after a *j*, just *-eron*: **dijeron, trajeron**. **No vino nadie.**

  - unit: mas-alto-que
    lessons: 2
    tip:
      title: "Comparing"
      body: |
        | more than | **más** alto **que** yo |
        | less than | **menos** caro **que** |
        | as … as | **tan** lindo **como** |
        | better, worse | **mejor**, **peor** |
        | older, younger | **más grande**, **más chico** |
        | very, very | rico → **riquísimo**, caro → **carísimo** |

        The describing word still matches the person: *mi hermana es más alta que yo*.

  - unit: el-mas-tranquilo
    lessons: 1
    tip:
      title: "The most, the best"
      body: |
        | the most | **el** barrio **más** tranquilo **de** la ciudad |
        | the least | **la** calle **menos** ruidosa |
        | the best, the worst | **el mejor** del mundo, **el peor** |
        | really, very | lindo → **lindísimo**, barato → **baratísimo** |
        | miles away | lejos → **lejísimos** |

        *El* or *la* matches the thing, and the group comes after **de**: *la más linda **de** la ciudad*.

  - unit: te-llamo
    lessons: 2
    tip:
      title: "Lo, la, le — where they go"
      body: |
        | the thing, masculine | **lo**, **los** | ¿El audio? **Lo** mando ahora. |
        | the thing, feminine | **la**, **las** | ¿La tarjeta? **La** tengo. |
        | to him, her, them | **le**, **les** | **Le** doy la llave. |
        | me, you | **me**, **te** | **Te** llamo mañana. |

        Before a normal verb: *la tengo*. Stuck to the end of a command: **llamame**, **dame**, **mandame**.

  - unit: te-llame
    lessons: 1
    tip:
      title: "Lo, la, le in the past"
      body: |
        | the thing | ¿El mensaje? **Lo** recibí. | ¿La foto? **La** mandé. |
        | the person | ¿A Sofi? **La** llamé ayer. | ¿A Juan? **Lo** vi. |
        | to him, her | **Le** di la llave. | **Les** mandé las fotos. |
        | me, you | **Te** llamé. | ¿**Me** llamaste? |

        Before the verb, past or present. Only a command takes it on the end: **mostrame**, **buscame**.

  # ── Section 5 ───────────────────────────────────────────────────────────
  - unit: cuando-era-chico
    lessons: 2
    tip:
      title: "Era, tenía, vivía, iba"
      body: |
        | | ser | tener | vivir | ir |
        | yo, él, ella | era | tenía | vivía | iba |
        | vos | eras | tenías | vivías | ibas |
        | nosotros | éramos | | | íbamos |

        This past describes: how things *were*, what you *had*, where you *lived*. *Yo* and *él* share one form. **Cuando era chico vivía en Rosario.**

  - unit: en-la-primaria
    lessons: 1
    tip:
      title: "Ser, tener, vivir, ir — everyone"
      body: |
        | | ser | tener | vivir | ir |
        | yo, él, ella | era | tenía | vivía | iba |
        | vos | eras | tenías | vivías | ibas |
        | nosotros | éramos | teníamos | vivíamos | íbamos |
        | ellos, ustedes | eran | tenían | vivían | iban |

        *Ellos* just adds **-n**. **Quería** and **podía** work the same way: *de chico quería ser maestro, pero no podía salir solo.*

  - unit: siempre-jugabamos
    lessons: 2
    focus: [{ tense: impf }]
    tip:
      title: "-aba and -ía"
      body: |
        | | -ar | -er, -ir |
        | yo, él, ella | jug**aba** | com**ía** |
        | vos | jug**abas** | com**ías** |
        | nosotros | jug**ábamos** | sal**íamos** |

        Every verb but *ser, ir* and *ver* follows this. It's the *used to* of English: **Los sábados jugábamos a la pelota.**

  - unit: me-encantaba
    lessons: 1
    focus: [{ tense: impf }]
    tip:
      title: "-aba, -ía, and ver"
      body: |
        | | jugar | salir | ver |
        | yo, él, ella | jug**aba** | sal**ía** | ve**ía** |
        | vos | jug**abas** | | ve**ías** |
        | nosotros | jug**ábamos** | sal**íamos** | |
        | ellos, ustedes | jug**aban** | | |

        *Ver* keeps its *e*: **veía**. And *gustar* goes back like any -ar verb: **me gustaba** one thing, **me gustaban** several. **Me encantaba andar en bici.**

  - unit: estaba-lloviendo
    lessons: 2
    focus: [{ tense: impf }, { tense: pret }]
    tip:
      title: "The scene and what happened"
      body: |
        | the scene — imperfect | what happened — preterite |
        | **Estaba** en el subte | cuando me **llamó** Sofi. |
        | **Llovía** mucho | y **llegué** tarde. |
        | **Había** mucha gente | y no **pude** entrar. |

        Ask: was it going on, or did it happen? Going on → *-aba, -ía*. Happened, and finished → the preterite.

  - unit: sono-el-timbre
    lessons: 1
    focus: [{ tense: impf }, { tense: pret }]
    tip:
      title: "Going on, then it happened"
      body: |
        | going on — imperfect | then — preterite |
        | **Estaba** en la ducha | cuando **sonó** el timbre. |
        | **Volvía** a casa | cuando **empezó** a llover. |
        | **Eran** las tres y no **había** luz | cuando **entró** Juan. |

        **Estaba** + *-ando, -iendo* is right in the middle of it: *estaba durmiendo cuando sonó el celu.*

  - unit: me-puse-nervioso
    lessons: 2
    tip:
      title: "Me puse, me enojé"
      body: |
        | | ponerse | enojarse |
        | yo | **me puse** | **me enojé** |
        | vos | **te pusiste** | **te enojaste** |
        | él, ella | **se puso** | **se enojó** |

        The pronoun stays in the past. **Ponerse** + a feeling is *to get*: *me puse nervioso* — *I got nervous*.

  - unit: me-olvide
    lessons: 1
    tip:
      title: "Me olvidé, me sentí, nos pusimos"
      body: |
        | | olvidarse | sentirse | ponerse |
        | yo | **me olvidé** | **me sentí** | **me puse** |
        | vos | | **te sentiste** | **te pusiste** |
        | él, ella | | | **se puso** |
        | nosotros | | | **nos pusimos** |

        The pronoun always comes along. What you forgot takes **de**: *me olvidé de su cumple.* How you were is imperfect (**estaba nervioso**); the moment it hit you is preterite (**me puse nervioso**).

  # ── Section 6 ───────────────────────────────────────────────────────────
  - unit: te-lo-devuelvo
    lessons: 2
    tip:
      title: "Te lo, se lo"
      body: |
        | Te devuelvo **el libro**. | Te **lo** devuelvo. |
        | ¿Me dejás **las llaves**? | ¿Me **las** dejás? |
        | Le regalé **un libro**. | **Se lo** regalé. |

        The person goes first, the thing second. *Le* or *les* before *lo, la* becomes **se**.

  - unit: te-lo-presto
    lessons: 1
    tip:
      title: "Te lo presto, se lo digo"
      body: |
        | Te presto **la bici**. | Te **la** presto. |
        | Te guardo **el cargador**. | Te **lo** guardo. |
        | Te paso **las fotos**. | Te **las** paso. |
        | Le digo **el secreto**. | **Se lo** digo. |
        | ¿Me mostrás **el depto**? | ¿Me **lo** mostrás? |

        Any verb works the same way: the person first, the thing second, and *le* before *lo, la* becomes **se**.

  - unit: donde-estara
    lessons: 1
    tip:
      title: "The future of guessing"
      body: |
        | ser | **será** | ¿Qué hora será? |
        | estar | **estará** | Estará en el laburo. |
        | tener | **tendrá** | Tendrá treinta años. |
        | haber | **habrá** | Habrá mucha gente. |

        For plans, porteños say *voy a*. This future is for wondering and guessing: *I wonder…*, *he's probably…*

  - unit: quien-sera
    lessons: 1
    tip:
      title: "Hará, vendrá, estarán"
      body: |
        | hacer | **hará** | ¿Qué hará a esta hora? |
        | venir | **vendrá** | Vendrá más tarde. |
        | poder | **podrá** | ¿Podrá venir? |
        | querer | **querrá** | ¿Qué querrá? |
        | costar | **costará** | ¿Cuánto costará? |
        | estar | **estarán** | Estarán en el bar. |
        | ser | **serán** | Serán las ocho. |

        Regular verbs just add **-á** to the infinitive (*costar* → **costará**); the irregular ones squeeze it (*hacer* → **hará**, *venir* → **vendrá**). For them, it's **-án**; for vos, **-ás**: *¿estarás cansado?*

  # ── Section 7 ───────────────────────────────────────────────────────────
  - unit: quiero-que-vengas
    lessons: 2
    tip:
      title: "How the subjunctive is made"
      body: |
        Start from the *yo* of the present and swap the vowel: *-ar* verbs take **e**, the rest take **a**.

        | yo (now) | vos | yo, él, ella |
        | llamo | **llames** | **llame** |
        | vengo | **vengas** | **venga** |
        | hago | **hagas** | **haga** |
        | traigo | **traigas** | **traiga** |
        | voy | **vayas** | **vaya** |

        *Ir* is the odd one out. It follows **quiero que**: *quiero que vengas*.

  - unit: necesito-que-me-ayudes
    lessons: 1
    tip:
      title: "Necesito que, ¿querés que…?"
      body: |
        | | vos | yo, él, ella |
        | ayudar | **ayudes** | **ayude** |
        | esperar | **esperes** | |
        | poner | **pongas** | **ponga** |
        | traer | **traigas** | **traiga** |
        | llevar | | **lleve** |
        | dar | **des** | |

        **Necesito que**, **te pido que** and the offer **¿querés que…?** all take the subjunctive: *necesito que me ayudes*, *¿querés que te lleve?* For *we*: **¿qué querés que hagamos?**

  - unit: que-te-vaya-bien
    lessons: 2
    tip:
      title: "Wishes"
      body: |
        | Que te vaya bien. | Good luck. |
        | Que la pases lindo. | Have a great time. |
        | Que tengas buen finde. | Have a good weekend. |
        | Ojalá que no llueva. | I hope it doesn't rain. |
        | Ojalá salga todo bien. | I hope it all works out. |

        A wish is **que** or **ojalá** + the subjunctive. *Tener → tengas, salir → salga*: the *g* of *tengo, salgo* comes along.

  - unit: que-te-mejores
    lessons: 1
    tip:
      title: "Wishes for the big days"
      body: |
        | Que te mejores. | Get well soon. |
        | Que te diviertas. | Have fun. |
        | Que lo disfrutes. | Enjoy it. |
        | Que cumplas muchos más. | Many happy returns. |
        | Ojalá que te guste. | I hope you like it. |
        | Ojalá que ganemos. | I hope we win. |

        The pronoun comes along into the wish: *te mejores*, *te diviertas*. For *we*, **-emos** on *-ar* verbs: *ganar* → **ganemos**.

  - unit: cuando-llegues
    lessons: 2
    tip:
      title: "Cuando: always, or not yet"
      body: |
        | a habit — normal verb | not yet — subjunctive |
        | Cuando **llego**, tomo mate. | Avisame cuando **llegues**. |
        | Cuando **termino**, salgo. | Cuando **termines**, llamame. |

        About the future, *cuando* and **apenas** take the subjunctive: *apenas puedas*.

  - unit: cuando-vuelvas
    lessons: 1
    tip:
      title: "Cuando, hasta que, apenas"
      body: |
        | a habit — normal verb | not yet — subjunctive |
        | Cuando **vuelvo**, te llamo. | Cuando **vuelvas**, avisame. |
        | Cuando **cobro**, pago todo. | Cuando **cobre**, te invito. |
        | Cuando **empiezo**, no hablo. | Cuando **empieces**, contame. |

        **Hasta que** and **apenas** work the same way: *esperá hasta que te llame*, *apenas sepa algo, te aviso*. The open invitation: **cuando quieras**.

  - unit: no-creo
    lessons: 2
    tip:
      title: "Creo que, no creo que"
      body: |
        | Creo que **es** así. | No creo que **sea** así. |
        | Creo que **está** en casa. | No creo que **esté** en casa. |
        | Creo que **tiene** razón. | No creo que **tenga** razón. |
        | Creo que **hay** tiempo. | No creo que **haya** tiempo. |

        Sure → the normal verb. Doubting → the subjunctive.

  - unit: puede-ser-que
    lessons: 1
    tip:
      title: "Puede ser que, for them"
      body: |
        | | él, ella | ellos |
        | ser | sea | **sean** |
        | estar | esté | **estén** |
        | tener | tenga | **tengan** |
        | poder | pueda | **puedan** |
        | llegar | llegue | **lleguen** |

        For *they*, add **-n**. **Puede ser que** and **es posible que** take the subjunctive like *no creo que*: *puede ser que estén cerrados*.

  - unit: no-te-preocupes
    lessons: 2
    tip:
      title: "Do, and don't"
      body: |
        | do | don't |
        | Vení. | No **vengas**. |
        | Andá. | No **vayas**. |
        | Decime. | No **me digas**. |
        | Tocá. | No **toques**. |
        | Olvidate. | No **te olvides**. |

        *No* + the subjunctive, and the pronoun moves in front: *preocupate* → **no te preocupes**.

  - unit: no-seas-asi
    lessons: 1
    tip:
      title: "More don'ts"
      body: |
        | No **dejes** el celu en la mesa. | Don't leave your phone on the table. |
        | No **saques** la billetera. | Don't take your wallet out. |
        | No le **cuentes** a nadie. | Don't tell anyone. |
        | No **te vayas**. | Don't go. |
        | No **te pongas** nervioso. | Don't get nervous. |
        | No **seas** así. | Don't be like that. |

        Every *don't* grows from the *yo* of the present: *dejo* → **dejes**, *cuento* → **cuentes**, *saco* → **saques**. The pronoun goes in front: *me voy* → **no te vayas**.

  - unit: te-recomiendo
    lessons: 2
    tip:
      title: "Advice: probá, or que pruebes"
      body: |
        | straight out | softer |
        | Probá el flan. | Te recomiendo que **pruebes** el flan. |
        | Pedí un taxi. | Es mejor que **pidas** un taxi. |

        **Te recomiendo que** and **es mejor que** take the subjunctive. *Probar* → **pruebes**, *pedir* → **pidas**.

  - unit: te-aconsejo
    lessons: 1
    tip:
      title: "Te aconsejo que, conviene que"
      body: |
        | Te aconsejo que **lleves** efectivo. | My advice: bring cash. |
        | Conviene que **tomes** el subte. | Best to take the subway. |
        | Es mejor que **reserves**. | Better book ahead. |
        | Es importante que **uses** la SUBE. | Use your SUBE card. |
        | Es mejor que **salgamos** temprano. | We'd better leave early. |

        Every way of giving advice takes the subjunctive. *-ar* verbs take **e** (*llevar* → **lleves**), the rest **a** (*salgo* → **salgamos**).

  - unit: que-bueno
    lessons: 1
    tip:
      title: "Reacting"
      body: |
        | ¡Qué bueno que **estés** acá! | So good you're here! |
        | Qué lástima que no **vengas**. | Shame you're not coming. |
        | Me molesta que **llegue** tarde. | It bugs me he's late. |

        A reaction to something + **que** → the subjunctive. **Me alegro** on its own: *I'm glad*.

  - unit: me-preocupa
    lessons: 1
    tip:
      title: "Joys and worries"
      body: |
        | ¡Qué suerte que **vivas** cerca! | How lucky you live nearby! |
        | Me preocupa que **trabajes** tanto. | It worries me you work so much. |
        | Me sorprende que no lo **conozcas**. | I'm surprised you don't know him. |
        | ¡Qué bueno que **estemos** todos! | So good we're all here! |

        A feeling about something + **que** → the subjunctive, for any person. *Me preocupa* and *me sorprende* work like *me molesta*.

  # ── Section 8 ───────────────────────────────────────────────────────────
  - unit: yo-que-vos
    lessons: 2
    tip:
      title: "Would: -ía"
      body: |
        | | regular | shortened |
        | yo, él, ella | comprar**ía**, ir**ía** | **tendría**, **podría**, **haría**, **diría** |
        | vos | ir**ías** | |

        The ending goes on the whole infinitive: *comprar* → **compraría**. **Yo que vos** + would is advice: *yo que vos, esperaría*.

  - unit: yo-en-tu-lugar
    lessons: 1
    tip:
      title: "Yo en tu lugar…"
      body: |
        | | regular | shortened |
        | yo, él, ella | habl**aría**, dej**aría**, ped**iría**, volv**ería** | **saldría**, **tendría**, **diría** |
        | vos | ir**ías** | **tendrías**, **dirías** |
        | with *me* | **me quedaría** | |

        **Yo en tu lugar, hablaría con él.** Vos adds **-s**: *¿vos qué le dirías?* **Tendrías que** is advice too: *tendrías que llamarlo*.

  - unit: si-tuviera
    lessons: 2
    focus: [{ tense: cond }]
    tip:
      title: "Si tuviera, viajaría"
      body: |
        The *if* half has its own form. Take the *ellos* past and swap **-ron** for **-ra**:

        | tuvie-ron | **tuviera** |
        | fue-ron | **fuera** |
        | pudie-ron | **pudiera** |
        | estuvie-ron | **estuviera** |

        Then the other half takes *would*: **si tuviera tiempo, viajaría**. With vos: *si tuvieras*, *¿qué harías?*

  - unit: si-ganara
    lessons: 1
    focus: [{ tense: cond }]
    tip:
      title: "Si ganara, viviría"
      body: |
        | | if… | …would |
        | yo, él, ella | si **ganara**, si **viviera** | **viviría**, **daría**, **sabría** |
        | vos | si **pudieras**, si **tuvieras** | ¿qué **harías**? |
        | nosotros | si **tuviéramos** | **iríamos**, **compraríamos** |

        Any verb: the *ellos* past, **-ron** → **-ra** (*ganaron* → **ganara**). The *we* form takes an accent: **tuviéramos**.

  - unit: me-pregunto
    lessons: 1
    tip:
      title: "Telling what someone said"
      body: |
        | what she said | what you tell |
        | «¿Venís?» | Me preguntó **si venía**. |
        | «Sí.» | Le contesté **que sí**. |

        The question comes back with **si**; what was going on slides into the imperfect: *venís* → **venía**.

  - unit: me-dijo-que
    lessons: 1
    tip:
      title: "Me dijo que no podías"
      body: |
        | what was said | what you tell |
        | «¿Venís?» | Me preguntó **si venías**. |
        | «No puedo.» | Me dijo **que no podía**. |
        | «No podés.» | Me dijo **que no podías**. |

        Reported, the present steps back: *venís* → **venías**, *podés* → **podías**. Asking about it: **¿qué le preguntaste?**, **¿qué le contestaste?**

  # ── Section 9 ───────────────────────────────────────────────────────────
  - unit: se-me-cayo
    lessons: 1
    tip:
      title: "Se me, se te, se le"
      body: |
        | to me | **se me** cayó | I dropped it |
        | to you | **se te** cayó | you dropped it |
        | to him, her | **se le** cayó | he dropped it |

        Same with *rompió, perdió, olvidó*: **se me olvidó** — *I forgot*. The middle word says who it happened to.

  - unit: se-me-quemo
    lessons: 1
    tip:
      title: "Se me quemó, se me quemaron"
      body: |
        | | one thing | more than one |
        | to me | **se me** quemó la comida | **se me** cayeron las llaves |
        | to you | **se te** olvidó | |
        | to us | **se nos** acabó el café | |

        The verb follows the thing: one thing **-ó**, more than one **-aron / -eron**. The middle word says who it happened to: **se me**, **se te**, **se le**, **se nos**.

  - unit: para-que
    lessons: 2
    tip:
      title: "Para, para que"
      body: |
        | same person — infinitive | someone else — subjunctive |
        | Estudio **para aprender**. | Te lo explico **para que entiendas**. |
        | | Te lo mando **para que lo leas**. |
        | | Avisame **antes de que** llegue. |

        **Antes de que** always takes the subjunctive: it hasn't happened yet.

  - unit: para-que-entres
    lessons: 1
    tip:
      title: "Para que, sin que"
      body: |
        | yo form | para que… (vos) |
        | entro | para que **entres** |
        | abro | para que **abras** |
        | cierro | para que **cierres** |
        | encuentro | para que **encuentres** |
        | riego | para que **riegues** |

        For *él, ella*: **para que el gato coma**. **Sin que** and **antes de que** take the same forms: *sin que se escape*, *antes de que vuelva*.

  - unit: ya-habia
    lessons: 2
    focus: [{ tense: pret }]
    tip:
      title: "Había + -ado, -ido"
      body: |
        | yo, él, ella | **había** | comido, llegado, salido |
        | vos | **habías** | hecho, dicho, visto |
        | ellos | **habían** | |

        One past behind another: **Cuando llegué, ya habían comido.** *Hecho, dicho, visto* are the irregular ones.

  - unit: nunca-habia
    lessons: 1
    focus: [{ tense: pret }]
    tip:
      title: "Nunca había + -ado, -ido"
      body: |
        | yo, él, ella | **había** | probado, estado, empezado |
        | vos | **habías** | terminado, escuchado |
        | nosotros | **habíamos** | llamado, avisado |
        | ellos | **habían** | **escrito**, hecho, dicho, visto |

        **Nunca había probado algo así** — never, up to a moment in the past. **Ya habíamos terminado cuando llegaste** — done before the other thing happened.

  - unit: costumbres
    lessons: 1
    tip:
      title: "Se: what people do"
      body: |
        | Acá **se cena** tarde. | People eat late here. |
        | **Se saluda** con un beso. | You greet with a kiss. |

        **Se** + the *él* form talks about everyone in general, no one in particular.

  - unit: se-aplaude-al-asador
    lessons: 1
    tip:
      title: "Se: what everyone does at an asado"
      body: |
        | **Se trae** algo. | You bring something. |
        | **Se pone** la mesa. | The table gets set. |
        | **Se brinda** con todos. | Everyone toasts together. |
        | **Se aplaude** al asador. | Everyone applauds the grill master. |

        **Se** + the *él* form: no subject, because it's everybody. *Acá se come tarde* works the same way.

  # ── Section 10 ──────────────────────────────────────────────────────────
  - unit: queria-que-vinieras
    lessons: 2
    focus: [{ tense: impf, mood: subj }]
    tip:
      title: "Quería que vinieras"
      body: |
        The second verb follows the first into the past:

        | now | then |
        | Quiero que **vengas**. | Quería que **vinieras**. |
        | Te pido que **llames**. | Te pedí que **llamaras**. |
        | Me dice que **espere**. | Me dijo que **esperara**. |

        The past subjunctive is the *ellos* past with **-ra**: *vinieron* → **viniera**, *hicieron* → **hiciera**. With vos: **vinieras, hicieras, llamaras**.

  - unit: mis-viejos-querian
    lessons: 1
    focus: [{ tense: impf, mood: subj }]
    tip:
      title: "Querían que estudiara"
      body: |
        | ellos (preterite) | yo, él, ella | vos |
        | salieron | **saliera** | **salieras** |
        | dijeron | **dijera** | **dijeras** |
        | fueron | **fuera** | **fueras** |
        | vinieron | **viniera** | **vinieras** · ellos **vinieran** |

        Swap **-ron** for **-ra** and it works for every verb: *estudiar* → **estudiara, estudiaras**. **Mis viejos querían que estudiara una carrera** — the wish is in the past, so the second verb is too.

  - unit: aunque-llueva
    lessons: 1
    tip:
      title: "Aunque + fact, aunque + maybe"
      body: |
        | a fact — normal verb | a maybe — subjunctive |
        | Aunque **llueve**, vamos. | Aunque **llueva**, vamos. |
        | Aunque **cuesta**, sigo. | Aunque **cueste**, sigo. |
        | Aunque **querés**, no podés. | Aunque no **quieras**, tenés que ir. |

        Left: it *is* raining. Right: whether or not it rains. **Igual** at the end — *anyway* — often closes it.

  - unit: aunque-no-tenga-ganas
    lessons: 1
    tip:
      title: "Aunque, por más que, aunque sea"
      body: |
        | a fact — normal verb | a maybe — subjunctive |
        | Aunque **llueve**, entreno. | Aunque **llueva**, entreno igual. |
        | Por más que me **cuesta**, sigo. | Por más que me **cueste**, sigo. |
        | Aunque no **tengo** ganas, voy. | Aunque no **tenga** ganas, voy igual. |

        **Por más que** is *aunque* turned up. **Aunque sea** — *even just*: *aunque sea un rato*. **Sin embargo, así y todo** start the other half.

  - unit: llevo-dos-anos
    lessons: 2
    tip:
      title: "How long: llevar, hace, seguir"
      body: |
        | Llevo dos años **viviendo** acá. | I've been living here for two years. |
        | Hace dos años que **vivo** acá. | (the same) |
        | **Sigo** laburando ahí. | I still work there. |
        | **Dejé de** fumar. | I quit smoking. |
        | **Volvió a** llamar. | He called again. |

        English *have been …ing* is the present in Spanish. **Llevar** + time + *-ando, -iendo*.

  - unit: llevo-un-ano-aprendiendo
    lessons: 1
    tip:
      title: "Llevo, sigo, volví a — every person"
      body: |
        | ¿**Hace cuánto** que estudiás? | How long have you been studying? |
        | **Llevo** un año **aprendiendo**. | I've been learning for a year. |
        | Mis amigos **llevan** meses **buscando** laburo. | My friends have been job-hunting for months. |
        | **Seguimos** practicando. / **Siguen** tratando. | We're still practising. / They keep trying. |
        | **Dejaron de** venir. | They stopped coming. |
        | **Volví a** estudiar. | I went back to studying. |

        **Desde que** llegué — *since I arrived* — counts from a moment instead.

  - unit: pasen-pasen
    lessons: 2
    tip:
      title: "Commands for ustedes"
      body: |
        | one person (vos) | more than one (ustedes) |
        | pasá | **pasen** |
        | esperá | **esperen** |
        | vení | **vengan** |
        | traé | **traigan** |
        | sentate | **siéntense** |
        | no te preocupes | **no se preocupen** |

        -ar verbs end in **-en**, the rest in **-an**. The pronoun is **se**, stuck on the end — and then the accent appears: **siéntense, quédense**.

  - unit: a-la-mesa
    lessons: 1
    tip:
      title: "Ustedes at the table"
      body: |
        | one person (vos) | more than one (ustedes) |
        | probá | **prueben** |
        | agarrá | **agarren** |
        | tomá | **tomen** |
        | no te olvides | **no se olviden** |

        Also **coman**, **hagan** lugar, **vayan**, **dejen**. -ar verbs **-en**, the rest **-an**. The pronoun sticks on the end — **sírvanse, apúrense** — and after *no* it goes in front: **no se olviden**.

  - unit: como-si-nada
    lessons: 1
    focus: [{ tense: impf, mood: subj }]
    tip:
      title: "Como si + past subjunctive"
      body: |
        | Habla **como si supiera** todo. | He talks as if he knew everything. |
        | **Como si fuera** fácil. | As if it were easy. |
        | Me saludó **como si nada**. | He said hi as if nothing had happened. |
        | ¡**Ni que fuera** tan difícil! | It's not like it's that hard! |

        After **como si** and **ni que**, always the *-ra* form, whatever the time.

  - unit: no-te-hagas-el-gil
    lessons: 1
    focus: [{ tense: impf, mood: subj }]
    tip:
      title: "Hacerse el, como si no"
      body: |
        | yo | **me hice** el distraído | I pretended not to notice |
        | vos | **te hacés** el sordo | you act like you can't hear |
        | él, ella | **se hace** el canchero | he acts all cool |
        | | como si no **pasara** nada | as if nothing were happening |
        | | como si no me **viera** | as if he didn't see me |

        **No te hagas el gil** — *don't play dumb*. After **como si** and **ni que**, always the *-ra* form: *¡ni que **fueras** mi viejo!*

  - unit: el-que-quieras
    lessons: 1
    tip:
      title: "El que, la que, donde"
      body: |
        | a masculine thing | **el que** quieras |
        | a feminine thing | **la que** está en la esquina |
        | more than one | **los que** vinieron, **las que** prefieras |
        | a place | el bar **donde** nos conocimos |

        It matches what it stands for. *El que quieras* — whichever you want — takes the subjunctive: you haven't chosen yet.

  - unit: el-de-la-vidriera
    lessons: 1
    tip:
      title: "El de, el que"
      body: |
        | the one + a place or a detail | **el de** la vidriera, **la de** la izquierda |
        | the one + a verb | **el que** quieras, **la que** te probaste |
        | more than one | **los de** allá, **las que** prefieras |

        Not chosen yet, so the subjunctive: **el que elijas**; to a group, **elijan los que quieran**. Don't mind? **Como quieras.**

  - unit: si-hubiera-sabido
    lessons: 2
    focus: [{ verb_form: part }]
    tip:
      title: "Si hubiera + participle"
      body: |
        | yo, él, ella | **hubiera** | sabido, venido, ido |
        | vos | **hubieras** | llamado, avisado, pensado |

        For what didn't happen, both halves: **Si hubiera sabido, te hubiera avisado.** *If I'd known, I'd have told you.* Compare *si supiera* — if I knew (now).

  - unit: si-hubieramos-salido
    lessons: 1
    focus: [{ verb_form: part }]
    tip:
      title: "Hubiera, hubiéramos, hubieran"
      body: |
        | yo, él, ella | **hubiera** | tomado, reservado, quedado |
        | vos | **hubieras** | perdido, conseguido, traído |
        | nosotros | **hubiéramos** | salido, llegado |
        | ellos | **hubieran** | avisado, venido |

        **Si hubiéramos salido antes, no hubiéramos perdido el vuelo.** Both halves take *hubiera*, matched to the person.

  # ── Section 11 ──────────────────────────────────────────────────────────
  - unit: un-depto-que-tenga
    lessons: 2
    focus: [{ tense: pres, mood: subj }]
    tip:
      title: "Que tenga, or que tiene"
      body: |
        | not found yet — subjunctive | already found — normal verb |
        | Busco un depto que **tenga** balcón. | Encontré un depto que **tiene** balcón. |
        | Busco algo que **quede** cerca. | Vivo en un depto que **queda** cerca. |
        | ¿Hay un dueño que **acepte** mascotas? | Mi dueño **acepta** mascotas. |

        If it might not even exist, the verb after **que** goes into the subjunctive.


  - unit: conoces-a-alguien-que
    lessons: 1
    focus: [{ tense: pres, mood: subj }]
    tip:
      title: "Alguien que sepa, nadie que sepa"
      body: |
        | maybe nobody — subjunctive | a real person — normal verb |
        | ¿Conocés a alguien que **hable** inglés? | Mi vieja **habla** inglés. |
        | Busco un electricista que **venga** hoy. | El electricista **viene** hoy. |
        | No hay nadie que **sepa** cocinar así. | Mi vieja **sabe** cocinar así. |

        **Nadie que, ningún … que** always take the subjunctive: that person doesn't exist.
  - unit: me-da-bronca
    lessons: 1
    tip:
      title: "Me da + a feeling"
      body: |
        | Me da **bronca**. | It makes me mad. |
        | Me da **vergüenza**. | I'm embarrassed. |
        | Me da **lástima**. | I feel sorry (for him). |
        | Me da **igual**. | I don't care. |

        The cause follows **que** in the subjunctive: **me da bronca que no avise**. In the past, **me dio**: *me dio vergüenza*.


  - unit: me-pone-nervioso-que
    lessons: 1
    tip:
      title: "Me pone, me enoja, me alegra"
      body: |
        | Me **pone nervioso** que llegue tarde. | It drives me crazy that he's late. |
        | Me **enoja** que me **mienta**. | It makes me angry that he lies to me. |
        | Me **alegra** que vengas. | I'm glad you're coming. |
        | Me da bronca que **cancele**. | It makes me mad that he cancels. |

        Feeling first, then **que** + subjunctive. If it's you doing it, no *que*: *me enoja **llegar** tarde*.
  - unit: deberias
    lessons: 1
    tip:
      title: "Soft advice"
      body: |
        | **Deberías** descansar. | You should rest. |
        | **Debería** llamarla. | I should call her. |
        | **Estaría bueno** juntarnos. | It'd be nice to get together. |
        | **Habría que** avisarle. | We ought to let him know. |

        All four take an infinitive. *Tenés que* is an order; *deberías* is advice.


  - unit: deberias-tomarte-unos-dias
    lessons: 1
    tip:
      title: "Deber, the whole family"
      body: |
        | yo, él, ella | **debería** |
        | vos | **deberías** |
        | nosotros | **deberíamos** |
        | ellos, ustedes | **deberían** |

        All take an infinitive: *deberíamos juntarnos*. **Estaría bueno que** + subjunctive when there's a person: *estaría bueno que te tomes unos días*.
  - unit: dijo-que-vendria
    lessons: 2
    focus: [{ tense: cond }]
    tip:
      title: "What he said he'd do"
      body: |
        | what he said | what you tell |
        | «Voy.» | Dijo que **iría**. |
        | «Vengo mañana.» | Dijo que **vendría** mañana. |
        | «Te llamo.» | Dijo que me **llamaría**. |

        A promise told later goes into *would*. Just as porteño: **dijo que iba a venir**.


  - unit: dijo-que-pasaria
    lessons: 1
    focus: [{ tense: cond }]
    tip:
      title: "Any verb + -ía"
      body: |
        | what he said | what you tell |
        | «Paso el martes.» | Dijo que **pasaría** el martes. |
        | «Te la devuelvo.» | Me aseguró que me la **devolvería**. |
        | «Lo arreglo.» | Dijo que lo **arreglaría**. |
        | «Lo pongo.» | Dijo que lo **pondría**. |

        The infinitive + **-ía**. A few bend the stem: *poner* → **pondría**, *venir* → *vendría*, *tener* → *tendría*.
  - unit: a-menos-que
    lessons: 1
    tip:
      title: "Conditions"
      body: |
        | Voy, **a menos que llueva**. | unless |
        | Voy, **siempre y cuando vengas**. | as long as |
        | Llamame **en caso de que haya** un problema. | in case |
        | Llevá paraguas **por si llueve**. | just in case |

        The first three take the subjunctive. **Por si** is the exception: normal verb.


  - unit: con-tal-de-que
    lessons: 1
    tip:
      title: "Con tal de que, salvo que"
      body: |
        | Te lo presto, **con tal de que** me lo **devuelvas**. | on condition that |
        | Te lo presto, **salvo que** lo **necesite**. | unless |
        | Llevá el auto, **siempre y cuando** no lo **choques**. | as long as |
        | Llevá plata **por si** lo **necesitás**. | just in case |

        Every condition takes the subjunctive, except **por si**. For *vos*: **devuelvas, rompas, cuides, manejes, choques**.
  - unit: se-alquila
    lessons: 1
    tip:
      title: "Se + verb on a sign"
      body: |
        | one thing | more than one |
        | **Se vende** auto. | **Se venden** bicis. |
        | **Se alquila** depto. | |
        | **Se necesita** mozo. | |

        **Se** + the *él* form, or the *ellos* form for plurals. Nobody is named: it's what's being sold, rented, needed.


  - unit: se-aceptan-tarjetas
    lessons: 1
    tip:
      title: "Se + one thing, se + several"
      body: |
        | one thing | more than one |
        | **Se busca** perro. | **Se aceptan** tarjetas. |
        | **Se permite** fumar en la terraza. | No **se permiten** mascotas. |
        | **Se prohíbe** hacer ruido. | **Se hacen** envíos. |

        The verb agrees with the thing: one → *se busca*, several → *se arreglan bicis*.
  - unit: voy-entendiendo
    lessons: 1
    tip:
      title: "Ir + -ando, estar por"
      body: |
        | **Voy entendiendo.** | I'm starting to get it. |
        | **Vas aprendiendo** de a poco. | You're learning bit by bit. |
        | **Estoy por** salir. | I'm about to leave. |
        | **Está por** llover. | It's about to rain. |

        **Ir** + gerund is change in progress; **estar por** + infinitive is what's about to happen.


  - unit: ando-buscando
    lessons: 1
    tip:
      title: "Andar, ir, estar por"
      body: |
        | **Ando buscando** laburo. | I'm looking around for work. |
        | **Voy conociendo** gente. | I'm getting to know people. |
        | **Estamos por** arrancar. | We're about to start. |
        | Estoy **a punto de** terminar. | I'm just about to finish. |

        **Andar** + gerund is looser than *estar*; **ir** + gerund grows bit by bit.
  # ── Section 12 ──────────────────────────────────────────────────────────
  - unit: me-pidio-que
    lessons: 2
    focus: [{ tense: impf, mood: subj }]
    tip:
      title: "A request, told later"
      body: |
        | what she said | what you tell |
        | «Traeme algo.» | Me pidió que le **trajera** algo. |
        | «Esperen.» | Nos dijo que **esperáramos**. |
        | «Dejalo acá.» | Me pidió que lo **dejara** acá. |
        | «Vení.» | Quería que **viniera**. |

        A request or an order told later takes the past subjunctive after **que**. News doesn't: *dijo que venía*.

  - unit: me-encargo-que
    lessons: 1
    focus: [{ tense: impf, mood: subj }]
    tip:
      title: "Any errand, told later"
      body: |
        | what she said | what you tell |
        | «Comprá pan.» | Me pidió que **comprara** pan. |
        | «Sacá la basura.» | Me dijo que **sacara** la basura. |
        | «Lleguen temprano.» | Nos pidió que **llegáramos** temprano. |
        | «Traigan algo.» | Les dijo que **trajeran** algo. |
        | «Portate bien.» | Me dijo que **me portara** bien. |

        Take the *ellos* past — *compraron, sacaron, trajeron* — and swap **-ron** for **-ra**: *comprara, sacara, trajera*. Nosotros adds **-ramos** with an accent: *llegáramos*.

  - unit: me-pregunto-si
    lessons: 1
    tip:
      title: "Si = whether"
      body: |
        | «¿Venís?» | Me preguntó **si** venía. |
        | «¿Abre hoy?» | No sé **si** abre hoy. |
        | | **A ver si** nos juntamos. |

        A yes-or-no question told later hangs on **si**, with the normal verb.

  - unit: fijate-si-tienen
    lessons: 1
    tip:
      title: "Check whether"
      body: |
        | the question | asking or telling it |
        | «¿Tienen stock?» | **Preguntale si** tienen stock. |
        | «¿Abren el feriado?» | **Me fijo si** abren el feriado. |
        | «¿Tenés turno?» | **Me preguntaron si** tenía turno. |
        | «¿Está disponible?» | No sé **si** está disponible. |

        **Si** is *whether*, and the verb after it is the normal one. Told later, it moves into the past: *tenés* → *tenía*.

  - unit: usted
    lessons: 1
    tip:
      title: "Vos and usted"
      body: |
        | vos | usted |
        | ¿Vos sos el dueño? | ¿**Usted** es el dueño? |
        | Pasá. | **Pase**. |
        | Sentate. | **Siéntese**. |
        | Disculpá. | **Disculpe**. |

        Usted takes the *él* form. **Quisiera** — *I'd like* — works with both.

  - unit: como-no-dona-rosa
    lessons: 1
    tip:
      title: "Usted commands"
      body: |
        | vos | usted |
        | Mirá. | **Mire**. |
        | Esperá. | **Espere**. |
        | Tomá. | **Tome**. |
        | Firmá acá. | **Firme** acá. |
        | Decime. | **Dígame**. |

        *-ar* verbs end in **-e**, *-er* and *-ir* verbs in **-a** (*venga*). A pronoun sticks on the end: *dígame*, *siéntese*.

  - unit: se-la-cree
    lessons: 1
    tip:
      title: "A la that points at nothing"
      body: |
        | **Se la cree.** | He's full of himself. |
        | **Me la banco.** | I can handle it. |
        | **Se la bancó.** | She put up with it. |
        | **Me las arreglo.** | I get by. |
        | **La tenés clara.** | You know your stuff. |

        The *la* stays *la* whoever you're talking about; only the verb and the first pronoun change.

  - unit: me-la-jugue
    lessons: 1
    tip:
      title: "The la stays, the person changes"
      body: |
        | yo | vos | él, ella |
        | **me la banco** | **te la bancás** | **se la bancó** |
        | **me las arreglo** | **te las arreglás** | **se las arregla** |
        | **me la jugué** | **la pifiaste** | **se la agarró** |
        | **me las tomo** | **la rompiste** | **la rompe** |

        Some verbs carry *me, te, se* plus the *la*; others (*pifiarla, romperla*) just the *la*. The *la* never changes.

  - unit: acabo-de
    lessons: 1
    tip:
      title: "Just, usually, again"
      body: |
        | **Acabo de** llegar. | I just got here. |
        | **Suelo** almorzar tarde. | I usually have lunch late. |
        | **Volví a** perder las llaves. | I lost my keys again. |

        All three take an infinitive. **Soler** has no past you'll need: *antes almorzaba tarde* does the job.

  - unit: deje-de-fumar
    lessons: 1
    tip:
      title: "Just, usually, again, quit"
      body: |
        | **Acabamos de** llegar. | We just got here. |
        | Los porteños **suelen** cenar tarde. | Porteños usually have dinner late. |
        | **Volvió a** fumar. | He started smoking again. |
        | **Dejé de** fumar. | I quit smoking. |
        | **Me puse a** estudiar. | I got down to studying. |

        All five take an infinitive straight after: *acabar de, soler, volver a, dejar de, ponerse a*.

  # ── Section 13 ──────────────────────────────────────────────────────────
  - unit: fue-construido
    lessons: 1
    tip:
      title: "The passive of the news"
      body: |
        | El puente **fue construido** hace un siglo. | was built |
        | La estación **fue inaugurada** ayer. | was opened |
        | Los chorros **fueron detenidos**. | were arrested |

        **Fue** + participle, and the participle agrees like an adjective. In conversation: *construyeron el puente*.

  - unit: fue-clausurado
    lessons: 1
    tip:
      title: "Fue, fueron + a participle that agrees"
      body: |
        | one | more than one |
        | El boliche **fue clausurado**. | Los vecinos **fueron rescatados**. |
        | La obra **fue clausurada**. | Las vecinas **fueron rescatadas**. |
        | La ley **fue aprobada**. | Los heridos **fueron trasladados**. |

        Who did it comes after **por**: *por los bomberos*. The news opens with **hubo**: *hubo un incendio*.

  - unit: me-robaron
    lessons: 1
    tip:
      title: "They, whoever they are"
      body: |
        | **Me robaron** el celu. | My phone got stolen. |
        | ¿Cuánto te **cobraron**? | How much did they charge you? |
        | **Dicen** que mañana llueve. | They say it'll rain tomorrow. |

        The *ellos* form with nobody named is how Spanish says *it got done*: no one to blame, or no one worth naming.

  - unit: me-afanaron
    lessons: 1
    tip:
      title: "They took it — from whom?"
      body: |
        | **me** robaron | they robbed me |
        | **te** robaron | they robbed you |
        | **le** robaron a mi vieja | they robbed my mom |
        | **nos** robaron la bici | they stole our bike |
        | **me** afanaron, **me** estafaron | they nicked it, they scammed me |

        The verb stays *robaron*; the pronoun in front says who lost out.

  - unit: lo-lindo-de-la-ciudad
    lessons: 1
    tip:
      title: "Lo + adjective"
      body: |
        | **Lo lindo** es que siempre hay algo. | The nice thing is there's always something. |
        | **Lo feo** es el tránsito. | The ugly part is the traffic. |
        | **Lo difícil** fue el idioma. | The hard part was the language. |
        | **Lo único** que extraño es el mar. | The only thing I miss is the sea. |
        | **Lo más** lindo es la plaza del barrio. | The nicest thing is the local square. |

        **Lo** + adjective makes *the … thing*, and it never changes: *lo lindo*, even of a plural.

  - unit: lo-bueno-de-vivir-aca
    lessons: 1
    tip:
      title: "Lo + adjective"
      body: |
        | **Lo bueno** es la gente. | The good thing is the people. |
        | **Lo malo** es el tránsito. | The bad thing is the traffic. |
        | **Lo mejor** fue el asado. | The best part was the asado. |
        | **Lo peor** es el calor. | The worst part is the heat. |

        **Lo** + adjective makes *the … thing*. It never changes: *lo bueno*, even of a plural.

  # ── Section 14 ──────────────────────────────────────────────────────────
  - unit: no-es-que
    lessons: 1
    tip:
      title: "No es que…, es que…"
      body: |
        | **No es que** no **quiera**, | It's not that I don't want to, |
        | **es que** no puedo. | it's just that I can't. |
        | **No es que** no **tengamos** ganas. | It's not that we don't feel like it. |

        The reason you deny takes the subjunctive; the real one, after **es que**, the normal verb.

  - unit: no-es-que-no-me-guste
    lessons: 1
    tip:
      title: "No es que… with every verb"
      body: |
        | **No es que** no me **interese**, | It's not that I'm not interested, |
        | **No es que** no me **importe**, | It's not that I don't care, |
        | **No es que** me **caiga** mal, | It's not that I don't like him, |
        | **No es que** no **queramos**, | It's not that we don't want to, |
        | **es que** tengo un compromiso. | it's just that I've got something on. |

        The denied reason is subjunctive in every person; the real one after **es que** is not. Don't push: **no insistas**.

  - unit: si-hubiera-ahorrado
    lessons: 2
    focus: [{ tense: impf, mood: subj }, { tense: cond }]
    tip:
      title: "Then, and what it means now"
      body: |
        | if (then) | now |
        | Si **hubiera ahorrado**, | ahora **tendría** un depto. |
        | Si **hubiéramos** salido antes, | ya **estaríamos** ahí. |
        | Si **hubiera aceptado**, | ahora **sería** otra cosa. |

        *Hubiera* + participle for the past that didn't happen; the plain conditional for today.

  - unit: si-hubieras-estudiado
    lessons: 1
    focus: [{ tense: impf, mood: subj }, { tense: cond }]
    tip:
      title: "The other life, now"
      body: |
        | if (then) | now |
        | Si **hubieras** estudiado medicina, | ahora **serías** médico. |
        | Si me **hubiera** mudado, | a esta altura **estaría** tranquilo. |
        | Si **hubiéramos** invertido, | ahora **tendríamos** ahorros. |
        | Si **hubieras** aprendido inglés, | ahora **sabrías** qué hacer. |

        *Hubiera* + participle for the past that went another way; the conditional for today.

  - unit: tendria-que-haber
    lessons: 1
    tip:
      title: "Should have"
      body: |
        | **Tendría que haber** ido. | I should have gone. |
        | **Tendrías que haber** avisado. | You should have let us know. |
        | **Me arrepiento.** | I regret it. |

        **Tendría que haber** + participle: the porteño regret. Never *he debido*.

  - unit: me-hubiera-gustado
    lessons: 1
    tip:
      title: "Should have, would have liked"
      body: |
        | **Tendría que haber** ido. | I should have gone. |
        | **Tendrías que haber** avisado. | You should have said. |
        | **Tendríamos que haber** salido antes. | We should have left earlier. |
        | **Tendrían que haber** llamado. | They should have called. |
        | **Me hubiera gustado** verte. | I'd have liked to see you. |

        And the feeling: **me arrepiento**, **¿te arrepentís?**, **se arrepintió**.

  - unit: me-hizo-reir
    lessons: 1
    tip:
      title: "Hacer + infinitive"
      body: |
        | **Me hizo reír.** | It made me laugh. |
        | **Me hizo llorar.** | It made me cry. |
        | **Me hace acordar** a vos. | It reminds me of you. |

        **Hacer** + infinitive is *to make someone do it*. The person goes in front: **me**, **te**, **nos**.

  - unit: me-mori-de-risa
    lessons: 1
    tip:
      title: "Hacer + infinitive, every person"
      body: |
        | **Me hizo** reír. | It made me laugh. |
        | **Me hizo** sentir en casa. | It made me feel at home. |
        | Vos **me hacés** reír. | You make me laugh. |
        | **Nos hizo** llorar a todos. | It made us all cry. |

        **Reírse**: me reí, **te reís**, **se rió**, nos reímos.

  - unit: cuanto-mas
    lessons: 1
    tip:
      title: "The more…"
      body: |
        | **Cuanto más** practicás, | The more you practice, |
        | mejor hablás. | the better you speak. |
        | Avisame **cuanto antes**. | Let me know as soon as you can. |

        **Cuanto más** + one thing, then the other with **más**, **menos**, **mejor**.

  - unit: cuanto-antes-lleguemos
    lessons: 1
    tip:
      title: "Cuanto antes + subjunctive"
      body: |
        | **Cuanto antes lleguemos**, mejor. | The sooner we get there, the better. |
        | **Cuanto antes reservemos**, más barato. | The sooner we book, the cheaper. |
        | **Cuanto más** ganás, más gastás. | The more you earn, the more you spend. |

        For what hasn't happened yet, the subjunctive; for what always happens, the normal verb.

  # ── Section 15 ──────────────────────────────────────────────────────────
  - unit: merezco-un-aumento
    lessons: 1
    tip:
      title: "Me lo merezco"
      body: |
        | **Me merezco** un aumento. | I deserve a raise. |
        | **Me lo merezco.** | I deserve it. |
        | **Te lo merecés.** | You deserve it. |

        **Merecerse** comes with its pronoun: the bare *merezco* sounds like a textbook.

  - unit: se-merece-el-ascenso
    lessons: 1
    tip:
      title: "Se lo merece, nos lo merecemos"
      body: |
        | yo | **me lo merezco** | I deserve it |
        | vos | **te lo merecés** | you deserve it |
        | él, ella | **se lo merece** | he, she deserves it |
        | nosotros | **nos lo merecemos** | we deserve it |

        Without *lo*, the thing follows: **se merece el ascenso**. The pronoun never leaves.

  - unit: se-caso
    lessons: 1
    tip:
      title: "Se casó, nació"
      body: |
        | Mi prima **se casó** el sábado. | got married |
        | **Nos casamos** en marzo. | we got married |
        | El bebé **nació** ayer. | was born |
        | ¿Dónde **naciste**? | were you born |

        **Casarse** takes its pronoun; **nacer** doesn't.

  - unit: se-recibio
    lessons: 1
    tip:
      title: "Se recibió, se jubiló"
      body: |
        | Mi hermano **se recibió** de abogado. | graduated |
        | **Me recibí** el año pasado. | I graduated |
        | **Se comprometieron** en marzo. | they got engaged |
        | Mi tía **se jubiló**. | retired |
        | Mi abuelo **se murió** en mayo. | died |

        Life's big steps take the pronoun, like **se casó**: *me*, *se*, always in front.
