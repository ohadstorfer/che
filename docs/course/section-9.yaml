  - ordinal: 3
    slug: "si-tuviera"
    title: "Imagine what you'd do"
    summary: "Si tuviera plata…"
    grammar:
      - "subjuntivo.imperfecto"
      - "si-hipotetico"
    register_max: "informal"
    sample:
      es: "Si tuviera plata, viajaría a Bariloche."
      en: "If I had money, I'd travel to Bariloche."
    tips:
      - title: "Si + a past form + would"
        body: "Something that isn't true now: **si tuviera plata, viajaría** — *if I had money, I'd travel*.
          The *si* half uses a new form, **tuviera**, **fuera**, **pudiera**."
      - title: "Only after si"
        body: "You meet this form after *si* and after *ojalá* — **ojalá pudiera** — and almost nowhere else
          at this level. Mind the difference: **ojalá llueva** — *I hope it rains* (it can happen);
          **ojalá pudiera ir** — *I wish I could go* (it is not real)."
    words:
