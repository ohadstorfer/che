  - ordinal: 10
    slug: "en-cuotas"
    title: "Talk about money"
    summary: "¿En cuántas cuotas?"
    grammar:
      - "plata.gastar-ahorrar"
      - "no-me-alcanza"
    register_max: "informal"
    sample:
      es: "Este mes gasté mucho y no me alcanza."
      en: "I spent a lot this month and I can't make ends meet."
    tips:
      - title: "Cuotas"
        body: "Argentines buy almost anything **en cuotas** — in instalments — and the first question at the
          till is **¿en cuántas cuotas?**"
      - title: "No me alcanza"
        body: "**No me alcanza** — *it's not enough*, *I can't make it last*. **Ahorrar** is to save,
          **gastar** to spend: **gasté todo el sueldo**."
    words:
      - lemma: "gastar"
        pos: "verb"
        forms:
          - form: "gasto"
            en: "I spend"
            f: "1sg.pres.ind"
      - lemma: "ahorrar"
        pos: "verb"
        en: "to save (money)"
        forms:
