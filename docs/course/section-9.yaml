    title: "Practice: the bank, a scare and the customs"
    summary: "¡Qué susto me diste!"
    grammar:
      - "repaso.banco"
      - "repaso.relato"
      - "repaso.costumbres"
    register_max: "informal"
    sample:
      es: "Escuché un ruido y me dio mucho miedo."
      en: "I heard a noise and it really scared me."
    tips:
      - title: "Me dio miedo"
        body: "**Me da miedo** is *it scares me* in general; **me dio miedo** is one scare, over and done. The thing that scares you is the subject: **me dan miedo los perros**."
      - title: "Se saluda con un beso"
        body: "**Acá se saluda con un beso** — *here people greet with a kiss*. **Se** + verb says what everyone does, no subject needed."
