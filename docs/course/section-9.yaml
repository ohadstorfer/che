        body: "One source: **mi vieja dice que…**. Several: **me contaron que…**, **me comentaron que…** —
          *people told me*. Porteño news travels by word of mouth and by **audio**."
      - title: "¿Es cierto?"
        body: "Before you pass it on: **¿es cierto?** — *is it true?* — or **es mentira** — *it's a lie*.
          **Lo leyó en las redes** — *she read it on social media* — is not a source."
      - title: "¿Escuchaste?"
        body: "**¿Escuchaste la radio?** — the vos past, like *leíste*. And a tip from someone who knows is
          **un dato**: *me pasaron el dato*. Gossip opens with **¿viste que…?** — *did you hear
          that…?*: **¿viste que Juan renunció?**"
