    tips:
      - title: "Todo aumenta"
        body: "In Buenos Aires prices **aumentan** so often that the word is small talk: **¿viste cómo
          aumentó el café?** The **aumento** of your salary never quite keeps up with the
          **inflación**."
      - title: "Subir, bajar, cobrar"
        body: "Prices **suben** and, now and then, **bajan**. **¿Cuánto te cobraron?** — *how much did they
          charge you?* **Cobrar** is also *to get paid*: **cobro el viernes** — *I get paid on
          Friday*; **¿ya cobraste?** A **precio** is a price; *está a buen precio* — *it's a good
          price*. When it isn't: **es un afano** — *it's a rip-off*; **está por las nubes** —
          *sky-high*; **sale un ojo de la cara** — *it costs a fortune*."
