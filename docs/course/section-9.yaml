        body: "**Me da asco la cucaracha**, **me dan asco las cucarachas** — the verb follows the thing.
          In the story: **¿te dio miedo?** — **no, me dio risa**."
      - title: "Se trae, se aplaude"
        body: "What everyone does at an asado: **se trae algo**, **se brinda**, **se aplaude al
