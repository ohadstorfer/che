    slug: "yo-que-vos"
    title: "Give advice with would"
    summary: "Yo que vos, iría"
    grammar:
      - "condicional"
      - "yo-que-vos"
    register_max: "informal"
    sample:
      es: "Yo que vos, iría al médico."
      en: "If I were you, I'd go to the doctor."
    tips:
      - title: "Yo que vos"
        body: "**Yo que vos** — *if I were you* — is how a porteño gives advice, and the conditional
          follows: **yo que vos, iría**, **yo que vos, no diría nada**."
      - title: "-ía on the whole verb"
        body: "The conditional adds **-ía** to the whole infinitive: *comprar* → **compraría**. A few
          shorten first: **haría**, **diría**, **tendría**, **podría**."
