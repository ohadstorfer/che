  - ordinal: 22
    slug: "ponele"
    title: "Talk like you're from here"
    summary: "Ponele que sí"
    grammar:
      - "conectores"
      - "repaso.b1"
    register_max: "informal"
    sample:
      es: "Vení sí o sí, en serio."
      en: "Come no matter what, seriously."
    tips:
      - title: "Fillers"
        body: "A porteño sentence breathes through its fillers: **ponele** — *let's say*; **digamos** —
          *sort of*; **qué sé yo** — *I dunno*; **bah** — *well, I mean*: *son las ocho, bah,
          ponele*. The ones you will hear most: **o sea** — *I mean*; **tipo** — *like, around*: *es
          tipo a las nueve*; and **viste** at the end, for *you know*: *estaba cansado, viste*."
      - title: "Yes, no, and no way"
        body: "**¡Más vale!** — *of course!*; **sí o sí** — *no matter what*; **ni loco** — *no way* — and a
          woman says **ni loca**: *¿volver con mi ex? Ni loca.* And when there's too much going on:
          **estoy a full** — *I'm flat out*."
      - title: "The words that glue a conversation"
        body: "**Por las dudas** — *just in case*; **de última** — *if all else fails*; **en serio** —
          *seriously*; **si querés** — *if you like*. Say them and you sound like you're from here."
    words:
      - lemma: "ponele"
        pos: "phrase"
        en: "suppose, for instance"
        register: "informal"
      - lemma: "digamos"
        pos: "phrase"
        en: "so to speak, sort of"
      - lemma: "qué sé yo"
