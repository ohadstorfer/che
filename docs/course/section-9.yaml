        en: "champion"
        forms:
          - form: "campeón"
            f: "m.sg"
          - form: "campeones"
            en: "champions"
            f: "m.pl"
      - lemma: "meter"
        pos: "verb"
        en: "to put in, to score"
        forms:
          - form: "metió"
            en: "scored, put in"
            f: "3sg.pret.ind"
      - lemma: "atajar"
        pos: "verb"
        en: "to save (a shot), to stop"
        forms:
          - form: "atajó"
            en: "saved (he/she saved)"
            f: "3sg.pret.ind"
      - lemma: "golazo"
        pos: "noun"
        en: "great goal, screamer"
        register: "informal"

  - ordinal: 11
