      - "preterito.preguntar-contestar"
      - "venir.vino"
    register_max: "informal"
    sample:
      es: "Le pregunté si venías y me dijo que no podías."
      en: "I asked him if you were coming and he told me you couldn't."
    tips:
      - title: "¿Qué le preguntaste?"
        body: "Now the vos side: **¿qué le preguntaste?**, **¿qué le contestaste?** — the same *-aste* as
          *llamaste*. And for him or her: **me explicó que…**, **me juró que…**, **me gritó**."
      - title: "Venías, podías"
        body: "Reported, *venís* becomes **venías** and *podés* becomes **podías**: *«¿Venís?»* → **me
          preguntó si venías**; *«No puedo»* → **me dijo que no podía**."
      - title: "Te juro"
        body: "**Te juro** — *I swear* — is how a porteño vouches for the story: **te juro que me dijo
          eso**. A long talk with a friend is **una charla**: **charlé con Sofi**."
    words:
      - lemma: "preguntar"
        pos: "verb"
        forms:
          - form: "preguntaste"
            en: "you asked"
            f: "2sg.pret.ind.vos"
      - lemma: "contestar"
        pos: "verb"
        forms:
          - form: "contestaste"
            en: "you answered"
            f: "2sg.pret.ind.vos"
      - lemma: "explicar"
        pos: "verb"
        en: "to explain"
        forms:
