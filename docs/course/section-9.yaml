  - ordinal: 2
    slug: "yo-en-tu-lugar"
    title: "Talk a friend through a problem"
    summary: "Yo en tu lugar, hablaría con él"
    grammar:
      - "condicional"
      - "yo-que-vos"
      - "condicional.vos"
    register_max: "informal"
    sample:
      es: "Yo en tu lugar, hablaría con tu jefe."
      en: "If I were you, I'd talk to your boss."
    tips:
      - title: "Yo en tu lugar"
        body: "**Yo en tu lugar** — *in your shoes* — is *yo que vos* with a straighter face. The advice
          after it is still *would*: **yo en tu lugar, hablaría con él**, **yo me quedaría**."
      - title: "Asking back"
        body: "Throw it back at your friend with the vos ending, **-ías**: **¿vos qué le dirías?** — *what
          would you tell him?* **Tendrías que** is advice with gloves on: **tendrías que llamarlo**,
          softer than *tenés que*."
      - title: "Same short stems"
        body: "*Salir* shortens like *tener*: **saldría**, as *tendría*. The rest just add **-ía**:
          **volvería**, **pediría**, **dejaría**, **buscaría**."
