# ---------------------------------------------------------------------------
# Che — Section 9 outline: "Stories and opinions" (B1.3)
#
# Telling it better and arguing it better. The accidental "se me" that every
# porteño story needs (se me cayó, se me rompió), "para que" and "antes de que",
# the past behind the past (ya había comido), football without a club, how to
# complain, agreeing and disagreeing, the bank and the ATM, a scare, the
# customs a visitor trips over (la previa, la sobremesa, the kiss hello), and
# a checkpoint of gossip: ¿viste lo que pasó?
#
# Plan: docs/course/roadmap.md §Section 9. New feature tag: `part` (participle).
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 9
  slug: "stories-and-opinions"
  title: "Stories and opinions"
  cefr: "B1.3"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "se-me-cayo"
    title: "Say what went wrong by accident"
    summary: "Se me cayó el celu"
    grammar:
      - "se-accidental"
    register_max: "informal"
    sample:
      es: "Se me cayó el celu y se rompió."
      en: "I dropped my phone and it broke."
    tips:
      - title: "It fell on me"
        body: "Spanish tells accidents as if they happened *to* you: **se me cayó** — *I dropped it* (it fell
          on me); **se me rompió** — *it broke on me*; **se me olvidó** — *I forgot*. Nobody is to
          blame, which is the point."
      - title: "Se te, se le"
        body: "Change the middle word for the person: **se te cayó** — *you dropped it*; **se le rompió**
          — *he broke it*."
    words:
      - lemma: "caerse"
        pos: "verb"
        en: "to fall, to drop"
        forms:
          - form: "se me cayó"
            en: "I dropped"
            f: "3sg.pret.ind.clitic.irregular"
          - form: "se te cayó"
            en: "you dropped"
            f: "3sg.pret.ind.clitic.irregular"
          - form: "se le cayó"
            en: "he dropped, she dropped"
            f: "3sg.pret.ind.clitic.irregular"
          - form: "cayó"
            f: "3sg.pret.ind.irregular"
            bound: true
      - lemma: "romperse"
        pos: "verb"
        en: "to break"
        forms:
          - form: "se me rompió"
            en: "I broke (by accident)"
            f: "3sg.pret.ind.clitic"
          - form: "se rompió"
            en: "it broke"
            f: "3sg.pret.ind.clitic"
          - form: "rompió"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "olvidarse"
        pos: "verb"
        forms:
          - form: "se me olvidó"
            en: "I forgot"
            f: "3sg.pret.ind.clitic"
          - form: "olvidó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "perderse"
        pos: "verb"
        en: "to get lost"
        forms:
          - form: "se me perdió"
            en: "I lost (it got lost)"
            f: "3sg.pret.ind.clitic"

  - ordinal: 2
    slug: "se-me-quemo"
    title: "Tell a mishap at home"
    summary: "Se me quemó la comida"
    grammar:
      - "se-accidental"
      - "se-accidental.plural"
    register_max: "informal"
    sample:
      es: "Se nos acabó el café y se me quemó la comida."
      en: "We ran out of coffee and I burnt the food."
    tips:
      - title: "One thing, two things"
        body: "The verb goes with the *thing*, not with you: **se me cayó la taza**, but **se me cayeron
          las llaves**; **se me quemó la comida**, **se me quemaron las tostadas**. The *me* stays put —
          it still happened to you."
      - title: "Se nos, se te"
        body: "When it happened to all of you, the middle word is **nos**: **se nos acabó el café** —
          *we ran out of coffee*; **se nos rompió la heladera**. To a friend: **¿se te olvidó?**"
      - title: "Nobody's fault"
        body: "That's the whole point: **no fue mi culpa, se me cayó**. And the excuse every porteño has
          ready when they're late: **se me hizo tarde**."
    words:
      - lemma: "quemarse"
        pos: "verb"
        en: "to burn, to get burnt"
        forms:
          - form: "se me quemó"
            en: "I burnt (it got burnt)"
            f: "3sg.pret.ind.clitic"
          - form: "se me quemaron"
            en: "I burnt (them)"
            f: "3pl.pret.ind.clitic"
          - form: "quemó"
            f: "3sg.pret.ind"
            bound: true
          - form: "quemaron"
            f: "3pl.pret.ind"
            bound: true
      - lemma: "acabarse"
        pos: "verb"
        en: "to run out"
        forms:
          - form: "se me acabó"
            en: "I ran out of"
            f: "3sg.pret.ind.clitic"
          - form: "se nos acabó"
            en: "we ran out of"
            f: "3sg.pret.ind.clitic"
          - form: "acabó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "mojarse"
        pos: "verb"
        en: "to get wet"
        forms:
          - form: "se me mojó"
            en: "got wet on me"
            f: "3sg.pret.ind.clitic"
          - form: "mojó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "caerse"
        pos: "verb"
        forms:
          - form: "se me cayeron"
            en: "I dropped (them)"
            f: "3pl.pret.ind.clitic.irregular"
          - form: "cayeron"
            f: "3pl.pret.ind.irregular"
            bound: true
      - lemma: "romperse"
        pos: "verb"
        forms:
          - form: "se nos rompió"
            en: "we broke (by accident)"
            f: "3sg.pret.ind.clitic"
      - lemma: "olvidarse"
        pos: "verb"
        forms:
          - form: "se te olvidó"
            en: "you forgot"
            f: "3sg.pret.ind.clitic"
      - lemma: "se me hizo tarde"
        pos: "phrase"
        en: "I lost track of time, I'm running late"
      - lemma: "taza"
        pos: "noun"
        en: "cup, mug"
        forms:
          - form: "taza"
            f: "f.sg"
          - form: "tazas"
            en: "cups, mugs"
            f: "f.pl"
      - lemma: "pava"
        pos: "noun"
        en: "kettle"
      - lemma: "culpa"
        pos: "noun"
        en: "fault, blame"
      - lemma: "desastre"
        pos: "noun"
        en: "disaster"

  - ordinal: 3
    slug: "para-que"
    title: "Say what something is for"
    summary: "Para que entiendas"
    grammar:
      - "subjuntivo.para-que"
      - "subjuntivo.antes-de-que"
    register_max: "informal"
    sample:
      es: "Te lo explico para que entiendas."
      en: "I'll explain it so that you understand."
    tips:
      - title: "Para que"
        body: "**Para** + an infinitive when it's the same person: *estudio para aprender*. **Para que** +
          the subjunctive when it's someone else: **te lo mando para que lo leas**."
      - title: "Antes de que"
        body: "**Antes de que llegue** — *before he gets here* — always takes the subjunctive: it hasn't
          happened yet."
    words:
      - lemma: "para que"
        pos: "phrase"
        en: "so that"
      - lemma: "antes de que"
        pos: "phrase"
        en: "before"
      - lemma: "leer"
        pos: "verb"
        forms:
          - form: "leas"
            en: "you read (so that you read)"
            f: "2sg.pres.subj.vos"
      - lemma: "explicar"
        pos: "verb"
        forms:
          - form: "explico"
            en: "I explain"
            f: "1sg.pres.ind"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "veas"
            en: "you see (so that you see)"
            f: "2sg.pres.subj.vos.irregular"

  - ordinal: 4
    slug: "para-que-entres"
    title: "Leave a friend in charge of your place"
    summary: "Te dejo la llave para que entres"
    grammar:
      - "subjuntivo.para-que"
      - "subjuntivo.antes-de-que"
      - "subjuntivo.sin-que"
    register_max: "informal"
    sample:
      es: "Te dejo la llave para que entres."
      en: "I'm leaving you the key so you can get in."
    tips:
      - title: "While I'm away"
        body: "Going on holiday? Every instruction is a **para que** + what the *other* person does:
          **te dejo la llave para que entres**, **para que riegues las plantas**, **para que el gato
          coma**. Two people, so the second verb is subjunctive."
      - title: "Sin que"
        body: "**Sin que** works the same way: **cerrá la puerta sin que se escape el gato** — *without the
          cat getting out*. And **antes de que vuelva** — *before I'm back* — hasn't happened yet."
      - title: "The stems you know"
        body: "The subjunctive keeps the *yo* stem: *cierro* → **cierres**, *encuentro* → **encuentres**,
          *riego* → **riegues**. The regular ones just swap the vowel: **entres**, **abras**."
    words:
      - lemma: "sin que"
        pos: "phrase"
        en: "without (someone doing something)"
      - lemma: "entrar"
        pos: "verb"
        forms:
          - form: "entres"
            en: "you get in (so that you get in)"
            f: "2sg.pres.subj.vos"
      - lemma: "abrir"
        pos: "verb"
        forms:
          - form: "abras"
            en: "you open (so that you open)"
            f: "2sg.pres.subj.vos"
      - lemma: "cerrar"
        pos: "verb"
        forms:
          - form: "cierres"
            en: "you close (so that you close)"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "encontrar"
        pos: "verb"
        forms:
          - form: "encuentres"
            en: "you find (so that you find)"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "regar"
        pos: "verb"
        forms:
          - form: "riegues"
            en: "you water (so that you water)"
            f: "2sg.pres.subj.vos.irregular"
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "coma"
            en: "eat (so that I, so that he/she eat)"
            f: "sg.pres.subj"
      - lemma: "escaparse"
        pos: "verb"
        en: "to get out, to escape"
        forms:
          - form: "se escape"
            en: "gets out (so that it gets out)"
            f: "3sg.pres.subj.clitic"
          - form: "se escapó"
            en: "got out, escaped"
            f: "3sg.pret.ind.clitic"
          - form: "escape"
            f: "3sg.pres.subj"
            bound: true
          - form: "escapó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "persiana"
        pos: "noun"
        en: "roller blind, shutter"
        forms:
          - form: "persiana"
            f: "f.sg"
          - form: "persianas"
            en: "roller blinds, shutters"
            f: "f.pl"
      - lemma: "alarma"
        pos: "noun"
        en: "alarm"

  - ordinal: 5
    slug: "ya-habia"
    title: "Tell what had already happened"
    summary: "Cuando llegué, ya se había ido"
    grammar:
      - "pluscuamperfecto"
      - "participios"
    register_max: "informal"
    sample:
      es: "Cuando llegué, Juan ya se había ido."
      en: "When I got there, Juan had already left."
    tips:
      - title: "The past before the past"
        body: "**Había** + a participle is the past behind another past: **cuando llegué, ya habían
          comido** — *when I got there, they'd already eaten*. Buenos Aires uses this one freely."
      - title: "Participles"
        body: "Most end in **-ado** or **-ido**: *comido, llegado, salido*. A few don't: **hecho**,
          **dicho**, **visto**, **roto**."
    words:
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "habían"
            en: "they had"
            f: "3pl.impf.ind"
          - form: "habías"
            en: "you had"
            f: "2sg.impf.ind.vos"
      - lemma: "irse"
        pos: "verb"
        forms:
          - form: "se había ido"
            en: "had left"
            f: "3sg.impf.ind.clitic"
          - form: "se fue"
            en: "he left, she left"
            f: "3sg.pret.ind.clitic.irregular"
      - lemma: "comer"
        pos: "verb"
        forms:
          - form: "comido"
            en: "eaten"
            f: "part"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hecho"
            en: "done, made"
            f: "part.irregular"
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "dicho"
            en: "said, told"
            f: "part.irregular"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "visto"
            en: "seen"
            f: "part.irregular"
      - lemma: "llegar"
        pos: "verb"
        forms:
          - form: "llegado"
            en: "arrived"
            f: "part"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "salido"
            en: "left, gone out"
            f: "part"

  - ordinal: 6
    slug: "nunca-habia"
    title: "Say you'd never done it before"
    summary: "Nunca había probado algo así"
    grammar:
      - "pluscuamperfecto"
      - "participios"
    register_max: "informal"
    sample:
      es: "Nunca había probado algo así."
      en: "I'd never tried anything like it."
    tips:
      - title: "Nunca había…"
        body: "A first time is told with **nunca había** + a participle: **nunca había probado el dulce de
          leche** — *I'd never tried dulce de leche* (until that day). **Por primera vez** is the other
          half: **lo probé por primera vez en Buenos Aires**."
      - title: "Habíamos"
        body: "With your friends it's **habíamos**: **ya habíamos terminado cuando llegaste**. The whole
          set is now *había, habías, habíamos, habían* — and the participle never changes."
      - title: "Nobody told me"
        body: "**No me habían avisado** — *nobody had told me*; **ya lo había llamado** — *I'd already
          called him*. One more irregular participle: *escribir* → **escrito**."
    words:
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "habíamos"
            en: "we had (done)"
            f: "1pl.impf.ind"
      - lemma: "probar"
        pos: "verb"
        forms:
          - form: "probado"
            en: "tasted, tried out"
            f: "part"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estado"
            en: "been"
            f: "part"
      - lemma: "empezar"
        pos: "verb"
        forms:
          - form: "empezado"
            en: "started"
            f: "part"
      - lemma: "terminar"
        pos: "verb"
        forms:
          - form: "terminado"
            en: "finished"
            f: "part"
      - lemma: "escuchar"
        pos: "verb"
        forms:
          - form: "escuchado"
            en: "heard, listened to"
            f: "part"
      - lemma: "escribir"
        pos: "verb"
        forms:
          - form: "escrito"
            en: "written"
            f: "part.irregular"
      - lemma: "llamar"
        pos: "verb"
        forms:
          - form: "llamado"
            en: "called"
            f: "part"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avisado"
            en: "let know"
            f: "part"
      - lemma: "por primera vez"
        pos: "phrase"
        en: "for the first time"
      - lemma: "dulce de leche"
        pos: "noun"
        en: "dulce de leche, milk caramel"

  - ordinal: 7
    slug: "practica-se-me-olvido"
    title: "Practice: accidents and what had happened"
    summary: "Se me olvidó que ya había salido"
    grammar:
      - "repaso.se-accidental"
      - "repaso.pluscuamperfecto"
    register_max: "informal"
    sample:
      es: "Cuando llegué, Juan ya se había ido."
      en: "When I got there, Juan had already left."
    tips:
      - title: "It fell on me"
        body: "**Se me cayó el vaso** — the glass fell, and it happened to me. No blame: that is why every porteño story of a mishap starts with **se me**."
      - title: "Ya había"
        body: "**Ya había comido** — *I had already eaten* — puts one past before another: **cuando llegaste, ya había comido**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "se me cayó"
      - "se me rompió"
      - "se me olvidó"
      - "se me perdió"
      - "para que"
      - "antes de que"
      - "sepas"
      - "habían"
      - "se había ido"
      - "iba"
      - "gustaría"
      - "llegues"

  - ordinal: 8
    slug: "practica-nunca-habia"
    title: "Practice: mishaps, favours and first times"
    summary: "Se nos acabó el café, ¡qué desastre!"
    grammar:
      - "repaso.se-accidental"
      - "repaso.para-que"
      - "repaso.pluscuamperfecto"
    register_max: "informal"
    sample:
      es: "Nunca había probado el dulce de leche."
      en: "I'd never tried dulce de leche."
    tips:
      - title: "Se me, se nos"
        body: "The verb agrees with the thing: **se me cayó la taza**, **se me cayeron las llaves**. The
          middle word is who it happened to: **se nos acabó el café**."
      - title: "Para que, nunca había"
        body: "**Te dejo la llave para que entres** — someone else's action takes the subjunctive. **Nunca
          había probado algo así** — one past before another."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "se me quemó"
      - "se nos acabó"
      - "se me cayeron"
      - "culpa"
      - "entres"
      - "riegues"
      - "sin que"
      - "habíamos"
      - "probado"
      - "por primera vez"
      - "así"
      - "me olvidé"
      - "vengas"
      - "iba"

  - ordinal: 9
    slug: "el-partido"
    title: "Talk about football"
    summary: "¿Viste el partido?"
    grammar:
      - "deportes"
      - "preterito.ganar-perder"
    register_max: "informal"
    sample:
      es: "Ganamos dos a uno, ¡qué partido!"
      en: "We won two–one, what a game!"
    tips:
      - title: "Ganamos, perdimos"
        body: "After a match it's **ganamos**, **perdimos** or **empatamos** — *we* won, even if you were
          on the sofa. The course leaves the club to you."
      - title: "El hincha"
        body: "A fan is a **hincha**, and a **gol** is shouted, not said."
    words:
      - lemma: "ganar"
        pos: "verb"
        forms:
          - form: "gano"
            en: "I earn"
            f: "1sg.pres.ind"
      - lemma: "perder"
        pos: "verb"
        forms:
          - form: "perdió"
            en: "lost (he/she lost)"
            f: "3sg.pret.ind"
      - lemma: "empatar"
        pos: "verb"
        en: "to draw, to tie"
        forms:
          - form: "empatamos"
            en: "we drew"
            f: "1pl.pret.ind"
      - lemma: "gol"
        pos: "noun"
        en: "goal"
        forms:
          - form: "gol"
            f: "m.sg"
          - form: "goles"
            en: "goals"
            f: "m.pl"
      - lemma: "hincha"
        pos: "noun"
        en: "fan, supporter"
      - lemma: "selección"
        pos: "noun"
        en: "national team"
      - lemma: "jugar"
        pos: "verb"
        forms:
          - form: "juega"
            en: "plays"
            f: "3sg.pres.ind.irregular"
          - form: "jugamos"
            en: "we play, we played"
            f: "1pl.pres.ind"
          - form: "jugó"
            en: "played"
            f: "3sg.pret.ind"

  - ordinal: 10
    slug: "la-final"
    title: "Watch the final with the whole bar"
    summary: "¡Salimos campeones!"
    grammar:
      - "deportes"
      - "preterito.ganar-perder"
      - "preterito.plural"
    register_max: "informal"
    sample:
      es: "¡Ganamos la final por penales!"
      en: "We won the final on penalties!"
    tips:
      - title: "Ellos ganaron"
        body: "The other team is *they*: **ganaron**, **perdieron**, **empataron**. Yours is always *we*,
          from the bar or the sofa: **¡salimos campeones!**"
      - title: "Penales"
        body: "A **final** that ends level goes to **penales**: the **arquero atajó** one, somebody
          **metió** the last, and the whole city is out in the street in the **camiseta**. A great goal
          is a **golazo**."
    words:
      - lemma: "ganar"
        pos: "verb"
        forms:
          - form: "ganaron"
            en: "they won"
            f: "3pl.pret.ind"
      - lemma: "perder"
        pos: "verb"
        forms:
          - form: "perdieron"
            en: "they lost"
            f: "3pl.pret.ind"
      - lemma: "empatar"
        pos: "verb"
        forms:
          - form: "empataron"
            en: "they drew"
            f: "3pl.pret.ind"
      - lemma: "jugar"
        pos: "verb"
        forms:
          - form: "juegan"
            en: "they play"
            f: "3pl.pres.ind.irregular"
      - lemma: "final"
        pos: "noun"
        en: "title match, last game of a cup"
        note: "la final — the final of a tournament"
      - lemma: "penal"
        pos: "noun"
        en: "penalty (kick)"
        forms:
          - form: "penal"
            f: "m.sg"
          - form: "penales"
            en: "penalties (kicks)"
            f: "m.pl"
      - lemma: "arquero"
