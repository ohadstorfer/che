  - ordinal: 5
    slug: "me-gustaria"
    title: "Say what you'd like"
    summary: "Me gustaría ir"
    grammar:
      - "condicional.gustar"
      - "cortesia"
    register_max: "informal"
    sample:
      es: "Me gustaría conocer Mendoza."
      en: "I'd like to see Mendoza."
    tips:
      - title: "Me gustaría"
        body: "**Me gustaría** — *I'd like* — is *gustar* in the conditional, with the same *me*: **me
          gustaría ir**, **¿te gustaría venir?**. **Me encantaría** is the enthusiastic yes."
      - title: "Not for ordering"
        body: "*Me gustaría* is for wishes and plans. To order or to offer, porteños use **quería** and
          **¿querés?**: **quería dos entradas**, **¿querés unas medialunas?**, **¿querés tomar unos
          mates?**"
    words:
      - lemma: "gustar"
        pos: "verb"
        forms:
