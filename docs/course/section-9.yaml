  - ordinal: 19
    slug: "me-pregunto"
    title: "Tell who said what"
    summary: "Me preguntó y le contesté"
    grammar:
      - "discurso-referido"
      - "preterito.preguntar-contestar"
      - "venir.vino"
    register_max: "informal"
    sample:
      es: "Me preguntó dónde vivía y le contesté."
      en: "He asked me where I lived and I answered him."
    tips:
      - title: "Me preguntó"
        body: "**Me preguntó si venía** — *she asked me if I was coming*. **Le contesté que sí** — *I told
          her yes*. What was said slides into the imperfect. Any verb slides the same way: **me
          preguntó si tenía hambre**, **le pregunté si quería venir**, **nos preguntó si queríamos
          postre**, **me contestó que no podía**."
      - title: "Vino"
        body: "**Vino** is wine, and it is also *he came*: **vino Juan** — *Juan came*. The sentence always
          tells which."
    words:
