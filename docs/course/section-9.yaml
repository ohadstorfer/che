  - ordinal: 7
    slug: "usted"
    title: "Ask a stranger politely"
    summary: "Disculpá que te moleste, ¿no tendrás cambio?"
    grammar:
      - "cortesia"
      - "futuro.cortesia"
      - "subjuntivo.disculpa-que"
    register_max: "informal"
    sample:
      es: "Disculpá que te moleste, ¿no tendrás cambio?"
      en: "Sorry to bother you, you wouldn't have change, would you?"
    tips:
      - title: "Polite, still vos"
        body: "Porteños say **vos** to everyone: the shop owner, a doctor, an old man on the bus. The
          politeness lives in the words around it: **disculpá que te moleste**, **perdón por la
          molestia**, **muy amable**."
      - title: "Quisiera, ¿no tendrás…?"
        body: "Day to day porteños soften a request with **quería**: **quería un turno para mañana**, **te
          quería pedir algo**. **Quisiera** — *I would like* — is the formal one, for the phone or
          an office: **quisiera un turno**; nobody orders food with it. To ask a stranger for
          something, add **no** and the future: **¿no tendrás hora?** — *you would not have the
          time?*"
    words:
      - lemma: "disculpar"
        pos: "verb"
        en: "to excuse"
        forms:
          - form: "disculpame"
            en: "excuse me, sorry"
            f: "2sg.imp.vos.clitic"
      - lemma: "molestar"
        pos: "verb"
        en: "to bother"
        forms:
