      - "si-hipotetico"
    register_max: "informal"
    sample:
      es: "Si ganara la lotería, viviría en la playa."
      en: "If I won the lottery, I'd live at the beach."
    tips:
      - title: "Any verb after si"
        body: "The *if* form works for every verb: take the *ellos* past and swap **-ron** for **-ra**.
          *Ganaron* → **si ganara**, *vivieron* → **si viviera**. Then *would*: **viviría**,
          **daría**, **sabría**."
      - title: "We and you"
        body: "Dreaming together: **si tuviéramos plata, iríamos a Bariloche** — the *we* form carries an
          accent, **tuviéramos**. Asking a friend: **si pudieras, ¿dónde vivirías?** — *si pudieras*
          is the vos form."
