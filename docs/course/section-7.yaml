            en: "I let my guard down"
            f: "1sg.pret.ind.clitic"
          - form: "descuidé"
            f: "1sg.pret.ind"
            bound: true
  - ordinal: 5
    slug: "te-lo-devuelvo"
    title: "Lend, borrow and give back"
    summary: "Mañana te lo devuelvo"
    grammar:
      - "pronombres.dobles"
      - "devolver-dejar"
    register_max: "informal"
    sample:
      es: "Mañana te lo devuelvo."
      en: "I'll give it back to you tomorrow."
    tips:
      - title: "Te lo, se lo"
        body: "Two pronouns go person first, thing second: **te lo devuelvo** — *I'll give it back to you*.
          *Le lo* never happens: it turns into **se lo**."
      - title: "Dejar"
        body: "**Dejame las llaves** — *leave me the keys*; **te dejo** — *I'll leave you (to it)*, the
          porteño way of hanging up."
      - title: "Devolvémelo"
        body: "On a vos command both pronouns join the end, person first, and the stress gets a written
          accent: **devolvémelo** — *give it back to me*; **pasámelo** — *send it to me*;
          **decímelo** — *tell me*. To him or her, *le* turns into *se* again: **mandáselo**."
    words:
      - lemma: "devolver"
        pos: "verb"
        en: "to give back"
        forms:
          - form: "devuelvo"
            en: "I give back"
            f: "1sg.pres.ind.irregular"
          - form: "devolvés"
            en: "you give back"
            f: "2sg.pres.ind.vos"
          - form: "devolveme"
