  - ordinal: 7
    slug: "me-contrataron"
    title: "Talk about hiring and firing"
    summary: "Lo echaron y consiguió otro laburo"
    grammar:
      - "trabajo.entrevista-sueldo"
      - "conseguir"
    register_max: "informal"
    sample:
      es: "Lo echaron el lunes, pero ya consiguió otro laburo."
      en: "He got fired on Monday, but he's already found another job."
    tips:
      - title: "Consiguió, renunció"
        body: "The rest of the story is in the third person: **consiguió laburo** — *she got a job*;
          **renunció** — *he quit*. Nobody says *fue despedido*: it's **lo echaron** — *they fired
          him* — and **me contrataron** — *they hired me*."
      - title: "El aguinaldo"
        body: "Twice a year, in June and December, the **aguinaldo** arrives — half a month's extra pay.
          Ask about it at the *entrevista*, along with the **licencia** — *paid leave*."
      - title: "El currículum"
        body: "You send **el currículum**; they ask about your **experiencia** and tell you about the
          **puesto** — *the position*. **Pagan bien** — *they pay well* — is what everyone wants to
          hear."
    words:
      - lemma: "conseguir"
        pos: "verb"
        forms:
