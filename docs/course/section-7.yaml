            en: "I gave (as a present)"
            f: "1sg.pret.ind"
          - form: "regalaste"
            en: "you gave (as a present)"
            f: "2sg.pret.ind.vos"
      - lemma: "poner"
        pos: "verb"
        en: "to put"
        forms:
          - form: "pongo"
            en: "I put"
            f: "1sg.pres.ind.irregular"
      - lemma: "abrir"
        pos: "verb"
        forms:
          - form: "abrí"
            en: "open"
            f: "2sg.imp.vos"
      - lemma: "cerrar"
        pos: "verb"
        forms:
          - form: "cerrá"
            en: "close"
            f: "2sg.imp.vos"
          - form: "cierro"
            en: "I close"
            f: "1sg.pres.ind.irregular"
      - lemma: "cargador"
        pos: "noun"
