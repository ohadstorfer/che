    title: "Guess and wonder"
    summary: "¿Dónde estará?"
    grammar:
      - "futuro.conjetura"
      - "futuro.ser-estar-tener"
    register_max: "informal"
    sample:
      es: "¿Dónde estará Juan? Estará en el laburo."
      en: "Where can Juan be? He's probably at work."
    tips:
      - title: "The future that guesses"
        body: "For plans porteños say *voy a*. The future tense is for **guessing**: **¿dónde estará?** —
          *where can he be?*; **estará en el laburo** — *he's probably at work*."
      - title: "Será"
        body: "**¿Qué hora será?** — *I wonder what time it is*. **Será** on its own shrugs: *could be*."
      - title: "Debe estar"
        body: "To state a guess, porteños mostly say **debe** + infinitive: **debe estar en el
          laburo** — *he must be at work*; **debe tener cuarenta**; **deben ser las ocho**. The
          future is more for the question: **¿dónde estará?**, **¿qué hora será?**"
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estará"
            en: "will be, is probably"
            f: "3sg.fut.ind"
