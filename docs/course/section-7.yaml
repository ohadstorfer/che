    register_max: "informal"
    sample:
      es: "Mi compañero es re trabajador, pero medio agrandado."
      en: "My coworker is really hard-working, but a bit full of himself."
    tips:
      - title: "Medio, re"
        body: "Porteños grade a person with two little words: **re** turns it up — *es re generosa* — and
          **medio** turns it down — *es medio vago*, *he's a bit lazy*. **Medio** never changes:
          *medio tonta*, *medio serios*. And the verb matters: **es callado** — *he is a quiet guy*
          — is what he is like; **está callado** — *he is quiet today* — is how he is right now.
          Same with **es serio** and **estás serio**."
      - title: "The good and the bad"
        body: "**Macanudo** is the old-school *great guy* — you will hear it from older people; under fifty
          it is **copado** or **piola**, and **es una genia** for a woman who is great at what she
          does; **trabajador** is *hard-working*. **Agrandado** is *full of himself*, **egoísta**
          *selfish* — and *egoísta* is the same for him and for her, like *inteligente*."
      - title: "Plural"
        body: "Describe a group with **son** and a plural ending (**-s**, or **-es** after a consonant):
          **son re trabajadores**, **son medio distraídos**. A mixed group takes the masculine
          form."
    words:
