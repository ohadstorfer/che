units:
  - ordinal: 1
    slug: "no-tengo-senal"
    title: "Sort out tech trouble"
    summary: "No tengo señal"
    grammar:
      - "tecnologia"
      - "se-corto"
    register_max: "informal"
    sample:
      es: "No tengo señal y se apagó el celu."
      en: "I've got no signal and my phone died."
    tips:
      - title: "Se apagó, se colgó"
        body: "A machine that fails on its own takes **se** and the preterite, like **se cortó**:
          **se apagó** — *it switched off*; **se colgó** — *it froze*. Your friend **se quedó sin
          batería**? Now you know why she didn't answer. When anything stops working, porteños say
          it **no anda**: **no anda el wifi**, **no me anda el celu**. The universal fix: **apagalo
          y prendelo**."
      - title: "Sin señal, sin datos"
        body: "**No tengo señal** — *no signal*; **me quedé sin datos** — *I ran out of data*. **¿Tenés
          wifi?** is the first question at any bar."
      - title: "Descargá, borrá"
        body: "Tech orders are plain vos commands: **descargá la app**, **borrá las fotos**. What
          you already did is preterite: **la descargué**, **las borré**. Day to day people say
          **bajá** or **bajate** for *download*: **bajate la app, es gratis**. *Descargá* is what
          the screen says."
    words:
      - lemma: "apagarse"
        pos: "verb"
        en: "to switch off, to die (a device)"
        forms:
          - form: "se apagó"
            en: "it switched off, it died"
            f: "3sg.pret.ind.clitic"
          - form: "apagó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "colgarse"
        pos: "verb"
