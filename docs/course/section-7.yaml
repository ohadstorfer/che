        body: "Leaving Buenos Aires you take **la autopista** (the fast road, with tolls), then **la ruta**
          (the ordinary road between towns). First you **cargás nafta** — *nafta*, never *gasolina*
          — and on the way you pay the **peaje**. **La General Paz** is the ring road between the
          Capital and the conurbano. Porteños *agarran* a road rather than *take* it: **agarrá la
          ruta**, **¿qué ruta agarramos?**"
      - title: "Manejé, ¿manejaste?"
        body: "*Manejar* in the past is regular: **manejé**, **¿manejaste vos?**. **Chocar** swaps *c* for
          *qu* before *é*: **choqué**. Run a red light and it's **una multa**."
      - title: "Papers and parking"
        body: "Your driver's license is the **registro** — *¿tenés registro?*. Your own or rented parking
          space is a **cochera**; a public paid parking lot is an *estacionamiento*."
