  - ordinal: 16
    slug: "quien-sera"
    title: "Wonder who, what and how much"
    summary: "¿Quién será a esta hora?"
    grammar:
      - "futuro.conjetura"
      - "futuro.ser-estar-tener"
      - "futuro.irregulares"
    register_max: "informal"
    sample:
      es: "Sonó el timbre. ¿Quién será a esta hora?"
      en: "The doorbell rang. Who can it be at this hour?"
    tips:
      - title: "Any verb can wonder"
        body: "**¿Qué hará?** — *I wonder what he is up to*; **¿cuánto saldrá?** — *I wonder how
          much it is* (a textbook says *¿cuánto costará?*; porteños ask prices with *salir*);
          **vendrá más tarde** — *she will probably come later*. For a group: **estarán en el bar**,
          **serán las ocho**. To vos, the question is **¿estarás cansado?**; the statement is
          **debés estar cansado** — *you must be tired*. And for a plain future porteños skip this
          tense: **no sé si va a venir**, **seguro que no viene**."
      - title: "Hará, vendrá, podrá"
        body: "The irregular ones squeeze the verb: *hacer* → **hará**, *venir* → **vendrá**, *poder* →
          **podrá**, *querer* → **querrá**. The ending is always **-á** for él and ella."
      - title: "A lo mejor, supongo"
        body: "The same guess in the present: **a lo mejor** — *maybe*; **supongo que sí** — *I suppose
          so*; **probablemente** — *probably*."
    words:
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estarán"
            en: "they'll be, they're probably"
            f: "3pl.fut.ind"
          - form: "estarás"
            en: "you'll be, you must be"
            f: "2sg.fut.ind.vos"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "serán"
            en: "it's probably, they must be"
            f: "3pl.fut.ind"
      - lemma: "hacer"
        pos: "verb"
        forms:
