  - ordinal: 18
    slug: "donde-estara"
    title: "Guess and wonder"
    summary: "¿Dónde estará?"
    grammar:
      - "futuro.conjetura"
      - "futuro.ser-estar-tener"
      - "futuro.irregulares"
    register_max: "informal"
    sample:
      es: "¿Dónde estará Juan? Estará en el laburo."
      en: "Where can Juan be? He's probably at work."
    tips:
      - title: "The future that guesses"
        body: "For plans porteños say *voy a*. The future tense is for **guessing**: **¿dónde estará?** —
          *where can he be?*; **estará en el laburo** — *he's probably at work*."
      - title: "Capaz, a lo mejor"
        body: "**Capaz**, **a lo mejor** and **quizás** all mean *maybe*; **seguro que** is *I bet*;
          **supongo que** is *I guess*; **probablemente** is *probably*. All take the plain present:
          **capaz está en la plaza**, **seguro que es Fede**. In Buenos Aires you will hear
          **capaz** much more than **quizás**."
      - title: "Debe estar"
        body: "To state a guess, porteños mostly say **debe** + infinitive: **debe estar en el laburo** —
          *he must be at work*; **debe tener cuarenta**; **deben ser las ocho**. The future is more
          for the question: **¿dónde estará?**, **¿qué hora será?**"
      - title: "Any verb can wonder"
        body: "**¿Qué hará?** — *I wonder what he is up to*; **¿cuánto saldrá?** — *I wonder how much it is*
          (a textbook says *¿cuánto costará?*; porteños ask prices with *salir*); **vendrá más
          tarde** — *she will probably come later*. For a group: **estarán en el bar**, **serán las
          ocho**. To vos, the question is **¿estarás cansado?**; the statement is **debés estar
          cansado** — *you must be tired*. And for a plain future porteños skip this tense: **no sé
          si va a venir**, **seguro que no viene**."
      - title: "Hará, vendrá, podrá"
        body: "The irregular ones squeeze the verb: *hacer* → **hará**, *venir* → **vendrá**, *poder* →
          **podrá**, *querer* → **querrá**. The ending is always **-á** for él and ella."
      - title: "A lo mejor, supongo"
        body: "The same guess in the present: **a lo mejor** — *maybe*; **supongo que sí** — *I suppose so*;
          **probablemente** — *probably*."
    words:
