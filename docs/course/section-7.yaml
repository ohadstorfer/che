  - ordinal: 9
    slug: "salir-con-alguien"
    title: "Talk about going out with someone"
    summary: "Estoy saliendo con alguien"
    grammar:
      - "relaciones"
      - "alguien-nadie"
      - "reciprocos.nos-peleamos"
    register_max: "informal"
    sample:
      es: "Estoy saliendo con alguien del laburo."
      en: "I'm seeing someone from work."
    tips:
      - title: "Salir con"
        body: "**Estoy saliendo con alguien** — *I'm seeing someone*. When it ends, porteños
          **cortan**: **cortamos** — *we broke up*. Porteños say **con Juan cortamos** — literally
          *with Juan we broke up* — for *Juan and I broke up*. Same with **con Sofi nos peleamos**:
          *Sofi and I had a fight*."
      - title: "Alguien, nadie"
        body: "**Alguien** is *someone*, **nadie** is *nobody* — and Spanish keeps the *no* as well: **no
          vino nadie**."
    words:
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "saliendo"
            en: "going out, seeing"
            f: "ger"
