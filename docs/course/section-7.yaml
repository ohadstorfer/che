    register_max: "informal"
    sample:
      es: "¿Quién ceba?"
      en: "Who's making the mate?"
    tips:
      - title: "Cebar"
        body: "One person **ceba** — pours the water from the **termo** — and passes the mate around the
          **ronda**. You drink it all, through the **bombilla**, and hand it back to the
          **cebador**, the person who pours."
      - title: "Gracias"
        body: "Saying **gracias** when you hand the mate back means *I'm done*. Say it on the first one and
          that's your last."
    words:
