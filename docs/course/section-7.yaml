        body: "Life's big steps take the pronoun, like **se casó**: **se recibió** — *graduated* (from the
          facu, with a title: **se recibió de abogado**) — **me recibí**, **se comprometieron** —
          *they got engaged* — **se jubiló** — *retired*. The sad one too: **se murió** — *died*.
