        body: "**Qué pesado** — *what a pain* — for someone who won't let it go. **Divertido** is *fun*,
          **tímido** *shy*. For a woman: **pesada**, **divertida**, **tímida**. With **estar** it is
          just for now: *Nico está pesado hoy* — *Nico's being annoying today*."
