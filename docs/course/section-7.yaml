      - "conseguir"
    register_max: "informal"
    sample:
      es: "Conseguí laburo en una empresa del centro."
      en: "I got a job at a company downtown."
    tips:
      - title: "Conseguir"
        body: "**Conseguí laburo** — *I got a job*. *Conseguir* is the verb for getting anything that took
          effort: a *turno*, a table, an apartment."
      - title: "Home office"
        body: "Working from home is **hacer home office**: English words, said with a Spanish accent. It
          never means the room: *hoy hago home office* — *I'm working from home today*."
    words:
      - lemma: "conseguir"
        pos: "verb"
        en: "to get, to manage to get"
        forms:
