  - ordinal: 1
    slug: "el-celu"
    title: "Deal with your phone"
    summary: "Me quedé sin batería"
    grammar:
      - "tecnologia"
      - "se-corto"
    register_max: "informal"
    sample:
      es: "Me quedé sin batería, te llamo después."
      en: "My battery died, I'll call you later."
    tips:
      - title: "Me quedé sin batería"
        body: "**Me quedé sin batería** — *my battery died*, literally *I was left without battery*. A call,
          or the power at home, **se cortó** — *it cut out*. Without *sin*, **quedarse** is *to
          stay*: *¿te quedaste en casa?*"
      - title: "El celu, la SUBE"
        body: "The card for the bus and the subte is **la SUBE**: you **cargás** it at a kiosco — the same
          verb as charging **el celu**, the phone (short for **celular**). *Celular* is also the
          phone number: *pasame tu celular* — *give me your number*."
    words:
      - lemma: "celular"
        pos: "noun"
        en: "cell phone"
      - lemma: "batería"
        pos: "noun"
        en: "battery"
      - lemma: "quedarse"
        pos: "verb"
        en: "to be left, to stay"
        forms:
          - form: "me quedé"
            en: "I was left, I stayed"
            f: "1sg.pret.ind.clitic"
          - form: "te quedaste"
            en: "you were left, you stayed"
            f: "2sg.pret.ind.vos.clitic"
          - form: "quedé"
            f: "1sg.pret.ind"
            bound: true
          - form: "quedaste"
            f: "2sg.pret.ind.vos"
            bound: true
      - lemma: "cortarse"
        pos: "verb"
        en: "to cut out, to go out (power)"
        forms:
          - form: "se cortó"
            en: "it cut out, it went out"
            f: "3sg.pret.ind.clitic"
          - form: "cortó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "ubicación"
        pos: "noun"
        en: "location"
      - lemma: "contraseña"
        pos: "noun"
        en: "password"
      - lemma: "llamada"
        pos: "noun"
        en: "call"
      - lemma: "videollamada"
        pos: "noun"
        en: "video call"
  - ordinal: 2
    slug: "no-tengo-senal"
    title: "Sort out tech trouble"
    summary: "No tengo señal"
    grammar:
      - "tecnologia"
      - "se-corto"
    register_max: "informal"
    sample:
      es: "No tengo señal y se apagó el celu."
      en: "I've got no signal and my phone died."
    tips:
      - title: "No anda, se apagó"
        body: "When anything stops working, porteños say it **no anda**: *no anda el wifi*, *no me anda el
          celu*. A machine that fails on its own takes **se**: **se apagó** — *it switched off*;
          **se colgó** — *it froze*. The universal fix: **apagalo y prendelo**."
      - title: "Sin señal, sin datos"
        body: "**No tengo señal** — *no signal*; **me quedé sin datos** — *I ran out of data*. **¿Tenés
          wifi?** is the first question at any bar."
      - title: "Descargá, borrá"
        body: "Tech orders are plain vos commands: **descargá la app**, **borrá las fotos**. What you
          already did is preterite: **la descargué**, **las borré**. Day to day people say **bajá**
          or **bajate** for *download*: **bajate la app, es gratis**. *Descargar* is what the screen
          says."
    words:
      - lemma: "apagarse"
        pos: "verb"
        en: "to switch off, to die (a device)"
        forms:
          - form: "se apagó"
            en: "it switched off, it died"
            f: "3sg.pret.ind.clitic"
          - form: "apagó"
            f: "3sg.pret.ind"
            bound: true
      - lemma: "colgarse"
        pos: "verb"
        en: "to freeze (a device)"
        forms:
          - form: "se colgó"
            en: "it froze"
            f: "3sg.pret.ind.clitic"
          - form: "colgó"
            f: "3sg.pret.ind"
            bound: true
        note: "Also slang for a person: 'me colgué' = I got distracted, I forgot."
      - lemma: "quedarse"
        pos: "verb"
        forms:
          - form: "se quedó"
            en: "he was left, she stayed"
            f: "3sg.pret.ind.clitic"
          - form: "quedó"
            f: "3sg.pret.ind"
            bound: true
