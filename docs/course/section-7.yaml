      en: "Can I offer you a mate with some biscuits?"
    tips:
      - title: "Calentá el agua, no la hiervas"
        body: "The rules for the person who pours: **calentá el agua** in the pava — *heat the water* — but
          **no la hiervas**: water that **hierve** burns the yerba. **Yo cebo**, you drink. When
          there's no taste left, **el mate está lavado** — *washed out* — and it's time to change
          the yerba."
      - title: "¿Te convido?"
        body: "**Convidar** is *to offer, to share what's yours*: **¿te convido un mate?**, **convidame
          uno**. Afternoon **merienda** means mate with **bizcochitos**, or **tortas fritas** when
          it rains. A **matero** drinks it all day; kids get **mate cocido**, the tea-bag version.
          To ask for one, the question is kinder than the order: **¿me convidás un mate?**
          *Convidame* is for close friends."
    words:
      - lemma: "cebar"
        pos: "verb"
        forms:
          - form: "cebo"
            en: "I pour (the mate)"
            f: "1sg.pres.ind"
      - lemma: "calentar"
        pos: "verb"
        en: "to heat, to warm up"
        forms:
          - form: "calentar"
            f: "inf"
          - form: "calentá"
            en: "heat (it)"
            f: "2sg.imp.vos"
        note: "Careful: 'calentarse' can mean to get angry or to get turned on."
      - lemma: "hervir"
        pos: "verb"
        en: "to boil"
        forms:
          - form: "hervir"
            f: "inf"
          - form: "hierve"
            en: "boils"
            f: "3sg.pres.ind"
          - form: "hiervas"
            en: "(don't) boil"
            f: "2sg.pres.subj.vos"
      - lemma: "lavado"
        pos: "adj"
        en: "washed out (mate)"
        forms:
          - form: "lavado"
            f: "m.sg"
        note: "Mate is 'lavado' when the yerba has lost its flavor after many refills; time to change it."
      - lemma: "convidar"
        pos: "verb"
        en: "to offer, to share"
        forms:
          - form: "convido"
            en: "I offer"
            f: "1sg.pres.ind"
          - form: "convidame"
            en: "give me some"
            f: "2sg.imp.vos.clitic"
          - form: "convidás"
            en: "you offer, you share"
            f: "2sg.pres.ind.vos"
      - lemma: "matero"
