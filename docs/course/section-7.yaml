        body: "For someone else it's **se siente**: **mi abuela no se siente bien**. Where it hurts is
          **dolor de** — **tengo dolor de cabeza** — *I've got a headache*."
      - title: "La prepaga"
        body: "Besides the public hospital and the *obra social*, lots of porteños pay a **prepaga** —
          a private health plan. Once a year: a **chequeo**, an *análisis de* **sangre**, **la
          presión** and **la vacuna** for the **gripe**."
      - title: "Reposo"
        body: "The doctor's favourite order: **tenés que hacer reposo** — *you need bed rest*. And a
          **jarabe** for the cough. A plain **resfrío** — *a cold* — needs no doctor, just a
          **remedio** from the pharmacy. Anything serious, straight to the **guardia**."
    words:
