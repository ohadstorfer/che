          talking among friends; to the family you say **falleció** — *passed away*."
      - title: "El velorio"
        body: "When someone dies, family and friends meet at the **velorio** — *the wake*. You hug the
          family and say **te acompaño en el sentimiento** — *I'm sorry for your loss*."
