        body: "Porteño thanks praise the person: **sos un genio**, **me salvaste** — *you saved me*.
          For a present: **¡qué detalle!** — *how thoughtful!* — or **¡te pasaste!** — *you
          shouldn't have!* To a woman it is always **sos una genia**."
      - title: "Ni hablar"
        body: "The answers: *de nada*, **ni hablar** — *don't mention it* — or **lo hice de onda** — *I
          did it to be nice*. **Te agradezco** is warmer and a touch more formal: **te agradezco de
          verdad**."
