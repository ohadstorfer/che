  - ordinal: 5
    slug: "te-lo-presto"
    title: "Lend things and keep secrets"
    summary: "Te lo presto, te lo prometo"
    grammar:
      - "pronombres.dobles"
      - "devolver-dejar"
    register_max: "informal"
    sample:
      es: "Te lo presto, pero me lo devolvés el lunes."
      en: "I'll lend it to you, but you give it back to me on Monday."
    tips:
      - title: "Te lo presto"
        body: "Same order as *te lo devuelvo* — person first, thing second — with new verbs: **te lo
          presto** — *I'll lend it to you*; **te lo guardo** — *I'll keep it for you*; **te lo
          muestro** — *I'll show you*. The thing decides lo or la: *¿la bici?* **te la presto**."
      - title: "Se lo digo"
        body: "To him or her, *le lo* turns into **se lo** again: **se lo digo mañana** — *I'll tell her
          tomorrow*. If it's **un secreto**: **no se lo digo a nadie, te lo prometo**."
      - title: "Te lo paso"
        body: "**Te lo paso** is *I'll send it to you* — a number, a photo, a file. And a loan comes
          back **sin falta** — *without fail*."
    words:
      - lemma: "prestar"
        pos: "verb"
        forms:
          - form: "presto"
            en: "I lend"
            f: "1sg.pres.ind"
      - lemma: "guardar"
        pos: "verb"
        en: "to keep, to put away"
        forms:
          - form: "guardo"
            en: "I keep, I put away"
            f: "1sg.pres.ind"
          - form: "guardame"
            en: "keep for me"
            f: "2sg.imp.vos.clitic"
      - lemma: "mostrar"
        pos: "verb"
        forms:
          - form: "muestro"
            en: "I show"
            f: "1sg.pres.ind.irregular"
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "digo"
            en: "I say"
            f: "1sg.pres.ind.irregular"
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "paso"
            en: "I pass on, I hand over"
            f: "1sg.pres.ind"
      - lemma: "prometer"
        pos: "verb"
        en: "to promise"
        forms:
          - form: "prometo"
            en: "I promise"
            f: "1sg.pres.ind"
      - lemma: "romper"
        pos: "verb"
        en: "to break (something)"
        forms:
          - form: "rompí"
            en: "I broke"
            f: "1sg.pret.ind"
      - lemma: "secreto"
        pos: "noun"
        en: "secret"
      - lemma: "taladro"
        pos: "noun"
        en: "drill"
      - lemma: "sin falta"
        pos: "phrase"
        en: "without fail"

