  - ordinal: 3
    slug: "me-robaron"
    title: "Report a theft"
    summary: "Me robaron el celu"
    grammar:
      - "robar"
      - "seguridad"
    register_max: "lunfardo"
    sample:
      es: "Me robaron el celu en el bondi."
      en: "My phone got stolen on the bus."
    tips:
      - title: "Me robaron"
        body: "**Me robaron el celu** — *my phone got stolen*, literally *they stole the phone from me*. The
          thief is a **chorro** in lunfardo, a **ladrón** in the news. On the subte it is usually a
          **punga** — *a pickpocket* — and you notice later. **Me asaltaron** is worse: they robbed
          you face to face."
      - title: "La denuncia"
        body: "To report it you **hacés la denuncia** at the **comisaría**, or online. The **policía**
          rarely finds the phone; the denuncia is for the insurance. To block the line, call your
          phone company. In an emergency, call **911**."
    words:
      - lemma: "chorro"
        pos: "noun"
        en: "thief"
        register: "lunfardo"
        forms:
          - form: "chorro"
            f: "m.sg"
          - form: "chorros"
            en: "thieves"
            f: "m.pl"
      - lemma: "ladrón"
        pos: "noun"
        en: "thief, robber"
      - lemma: "denuncia"
        pos: "noun"
        en: "police report, complaint"
      - lemma: "comisaría"
        pos: "noun"
        en: "police station"
      - lemma: "asaltar"
        pos: "verb"
        en: "to mug, to hold up"
        forms:
          - form: "me asaltaron"
            en: "they mugged me, I got mugged"
            f: "3pl.pret.ind.clitic"
          - form: "asaltaron"
            f: "3pl.pret.ind"
            bound: true
      - lemma: "punga"
        pos: "noun"
        en: "pickpocket"
        register: "lunfardo"
  - ordinal: 4
    slug: "me-afanaron"
    title: "Say you got robbed or scammed"
    summary: "Me afanaron la billetera"
    grammar:
      - "robar"
      - "seguridad"
    register_max: "lunfardo"
    sample:
      es: "Me descuidé un minuto y me afanaron la billetera."
      en: "I looked away for a minute and my wallet got nicked."
    tips:
      - title: "Me afanaron"
        body: "Among friends it's **me afanaron** — *they stole it* (slang). It is also what you say when
          you were overcharged: *me afanaron con el taxi* — *the taxi overcharged me*. The
          **motochorro** steals from a motorbike. The confession that comes with it: **me descuidé**
          — *I wasn't careful*."
      - title: "El cuento del tío"
        body: "**Me estafaron** — *I got scammed* : nobody grabs anything, they trick you. A fake call from
          the bank, a **billete trucho**, or the **cuento del tío**: a caller pretends to be a
          relative or an official and asks for money. First thing: **bloqueá la tarjeta**. Then the
          denuncia; if you're lucky, the street **cámaras** recorded it."
      - title: "Me descuidé"
        body: "The confession that comes with it: **me descuidé** — *I let my guard down*. Porteños answer
          **¡qué garrón!**"
    words:
      - lemma: "afanar"
        pos: "verb"
        en: "to steal, to swipe"
        register: "lunfardo"
        forms:
          - form: "me afanaron"
            en: "they stole it (from me), I got robbed"
            f: "3pl.pret.ind.clitic"
          - form: "afanaron"
            f: "3pl.pret.ind"
            bound: true
      - lemma: "robar"
        pos: "verb"
        forms:
          - form: "te robaron"
            en: "they stole (from you), you got robbed"
            f: "3pl.pret.ind.clitic"
          - form: "nos robaron"
            en: "they stole (from us), we got robbed"
            f: "3pl.pret.ind.clitic"
          - form: "le robaron"
            en: "they stole (from him/her)"
            f: "3pl.pret.ind.clitic"
      - lemma: "estafar"
        pos: "verb"
        en: "to scam, to swindle"
        forms:
          - form: "me estafaron"
            en: "they scammed me, I got scammed"
            f: "3pl.pret.ind.clitic"
          - form: "estafaron"
            f: "3pl.pret.ind"
            bound: true
      - lemma: "estafa"
        pos: "noun"
        en: "scam, fraud"
      - lemma: "motochorro"
        pos: "noun"
        en: "thief on a motorbike"
        register: "lunfardo"
      - lemma: "trucho"
        pos: "adj"
        en: "fake, shady"
        register: "lunfardo"
        forms:
          - form: "trucho"
            f: "m.sg"
          - form: "trucha"
            f: "f.sg"
      - lemma: "cuento del tío"
        pos: "phrase"
        en: "scam"
        note: "A trick to get your money, often a stranger with a story."
      - lemma: "bloquear"
        pos: "verb"
        en: "to block, to freeze (a card)"
        forms:
          - form: "bloquear"
            f: "inf"
          - form: "bloqueá"
            en: "block, freeze"
            f: "2sg.imp.vos"
          - form: "bloqueé"
