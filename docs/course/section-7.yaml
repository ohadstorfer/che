            f: "3sg.pres.ind"
          - form: "cebás"
            en: "you pour (the mate)"
            f: "2sg.pres.ind.vos"
        note: "One person (the cebador) refills and hands the mate to each person in turn; you give it back
          to them."
      - lemma: "ronda"
        pos: "noun"
        en: "round, circle"
      - lemma: "yerba"
        pos: "noun"
        en: "yerba mate (the dried leaves)"
      - lemma: "termo"
        pos: "noun"
        en: "thermos"
      - lemma: "bombilla"
        pos: "noun"
