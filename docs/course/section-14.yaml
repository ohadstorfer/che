    register_max: "informal"
    sample:
      es: "Lo lindo de la ciudad es que siempre hay algo para hacer."
      en: "The nice thing about the city is there's always something to do."
    tips:
      - title: "Lo lindo, lo feo"
        body: "Put **lo** in front of an adjective and it becomes *the … thing*: **lo lindo** — *the nice
          thing*; **lo feo** — *the ugly part*; **lo difícil** — *the hard part*; **lo único** —
          *the only thing*: **lo único que extraño es el mar**."
      - title: "Lo más lindo"
        body: "**Lo más** + adjective is *the most … thing*: **lo más lindo del barrio es la plaza**.
          Weighing it up, porteños say the city **tiene sus cosas** — *has its issues*: the
          **inseguridad**, the **costo de vida** — but the **calidad de vida**, **a la vez**, is
          hard to beat."
      - title: "Lo que más me gusta"
        body: "The most natural way to say what you love about a place: **lo que más me gusta de Buenos
          Aires es la noche**. And the opposite: **lo que menos me gusta es el ruido**."
      - title: "Lo bueno, lo malo"
        body: "**Lo** + adjective is *the … thing*: **lo bueno** — *the good thing*; **lo malo** — *the bad
          thing*; **lo mejor** and **lo peor**. **Lo bueno de vivir acá es que…**"
      - title: "No hay nada como…"
        body: "**No hay nada como** — *there's nothing like*: **no hay nada como un asado con amigos**."
