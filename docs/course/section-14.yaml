    slug: "hay-paro"
    title: "Find out why nothing's running"
    summary: "Hoy hay paro de subte"
    grammar:
      - "ciudad.paro"
      - "funcionar"
    register_max: "informal"
    sample:
      es: "Hoy hay paro de subte."
      en: "There's a subway strike today."
    tips:
      - title: "Hay paro"
        body: "A strike is a **paro**: **hay paro de subte**, **paro de colectivos**. When protesters block
          a street it's a **piquete** or a **corte**, and the street **está cortada**. A **marcha**
          is a march."
      - title: "No funciona"
        body: "**Funcionar** is *to work* for things: **el subte no funciona**, **los semáforos no
          funcionan**. For people, it's still *laburar*."
