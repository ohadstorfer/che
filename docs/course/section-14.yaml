  - ordinal: 4
    slug: "fue-clausurado"
    title: "Read the headlines"
    summary: "El boliche fue clausurado"
    grammar:
      - "voz-pasiva.ser"
      - "noticias"
    register_max: "informal"
    sample:
      es: "Los vecinos fueron rescatados por los bomberos."
      en: "The neighbors were rescued by the firefighters."
    tips:
      - title: "Fue clausurado, fueron rescatados"
        body: "The headline verb agrees with what it's about: **el boliche fue clausurado**, **la obra fue
          clausurada**, **los vecinos fueron rescatados**, **las vecinas fueron rescatadas**.
          Whoever did it comes after **por**: *por los bomberos*."
      - title: "Hubo un incendio"
        body: "The news opens with **hubo**: **hubo un incendio**, **hubo un accidente en la avenida**,
          **hubo dos heridos** — who then **fueron trasladados al hospital**. At the kitchen table
          the same story loses the passive: *trasladaron a los heridos*."
      - title: "Fue elegida"
        body: "Not only bad news: **la pizzería fue elegida la mejor del barrio**, **la ley fue aprobada**,
          **el chico fue elegido para el equipo**. Same pattern: **fue** + a participle that
          agrees."
