# ---------------------------------------------------------------------------
# Che — Section 14 outline: "Shades of meaning" (C1.3)
#
# The fine grain of the language: turning down gently (no es que no quiera,
# es que…), what would be true now if the past had gone differently (si
# hubiera ahorrado, ahora tendría…), regret (tendría que haber ido), the
# diminutives that soften everything (un ratito), lo que pasa es que, the
# sayings, lunfardo that isn't in section 7, what makes you laugh or cry,
# cuanto más… mejor, and a checkpoint on saying the hard thing kindly.
#
# Plan: docs/course/roadmap.md §Section 14.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 14
  slug: "shades-of-meaning"
  title: "Shades of meaning"
  cefr: "C1.3"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "no-es-que"
    title: "Turn it down gently"
    summary: "No es que no quiera, es que no puedo"
    grammar:
      - "no-es-que.subjuntivo"
      - "es-que"
    register_max: "informal"
    sample:
      es: "No es que no quiera, es que no puedo."
      en: "It's not that I don't want to, it's just that I can't."
    tips:
      - title: "No es que…"
        body: "A reason you deny takes the subjunctive: **no es que no quiera** — *it's not that I don't
          want to*. The real reason follows with **es que** and the normal verb: **es que no puedo**."
      - title: "Es que…"
        body: "On its own, **es que…** is the start of every porteño excuse: **¿no venís? — Es que
          laburo temprano**."
    words:
      - lemma: "no es que"
        pos: "phrase"
        en: "it's not that"
      - lemma: "es que"
        pos: "phrase"
        en: "it's just that"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "quiera"
            en: "(that) I want, (that) he wants"
            f: "sg.pres.subj.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tengamos"
            en: "(that) we have"
            f: "1pl.pres.subj.irregular"

  - ordinal: 2
    slug: "no-es-que-no-me-guste"
    title: "Turn down an invitation"
    summary: "No es que no me interese, es que no llego"
    grammar:
      - "no-es-que.subjuntivo"
      - "es-que"
    register_max: "informal"
    sample:
      es: "Gracias por la invitación, pero no es que no me interese: es que tengo un compromiso."
      en: "Thanks for the invitation, but it's not that I'm not interested: I've just got something on."
    tips:
      - title: "Any verb, any person"
        body: "**No es que** takes the subjunctive with every verb and every person: **no es que no me
          interese**, **no es que no me importe**, **no es que me caiga mal** — *it's not that I don't like
          him*; **no es que no queramos**, **no es que no podamos**."
      - title: "Saying no without quedar mal"
        body: "Nobody wants to **quedar mal** — *come off as rude*. So you thank them for the
          **invitación**, blame a **compromiso** — *something already on*, and leave the door open: **la
          próxima voy**, **otro día**. And if they push: **no insistas, che**."
    words:
      - lemma: "importar"
        pos: "verb"
        forms:
          - form: "importe"
            en: "(that) it matters"
            f: "3sg.pres.subj"
      - lemma: "interesar"
        pos: "verb"
        forms:
          - form: "interese"
            en: "(that) it interests"
            f: "3sg.pres.subj"
      - lemma: "caer"
        pos: "verb"
        forms:
          - form: "caiga"
            en: "(that) he comes across, (that) it sits"
            f: "3sg.pres.subj.irregular"
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "queramos"
            en: "(that) we want"
            f: "1pl.pres.subj.irregular"
      - lemma: "poder"
        pos: "verb"
        forms:
          - form: "podamos"
            en: "(that) we can"
            f: "1pl.pres.subj.irregular"
      - lemma: "insistir"
        pos: "verb"
        forms:
          - form: "insistas"
            en: "you insist (don't insist)"
            f: "2sg.pres.subj.vos"
      - lemma: "rechazar"
        pos: "verb"
        en: "to turn down"
        forms:
          - form: "rechazar"
            f: "inf"
          - form: "rechacé"
            en: "I turned down"
            f: "1sg.pret.ind"
      - lemma: "invitación"
        pos: "noun"
        en: "invitation"
      - lemma: "compromiso"
        pos: "noun"
        en: "prior engagement, commitment"
      - lemma: "quedar mal"
        pos: "phrase"
        en: "to come off as rude, to look bad"
        forms:
          - form: "quedar mal"
            f: "inf"
          - form: "quedo mal"
            en: "I look bad, I come off as rude"
            f: "1sg.pres.ind"
      - lemma: "la próxima"
        pos: "phrase"
        en: "next time"
      - lemma: "otro día"
        pos: "phrase"
        en: "some other day, another time"

  - ordinal: 3
    slug: "si-hubiera-ahorrado"
    title: "Say what would be true now"
    summary: "Si hubiera ahorrado, ahora tendría un depto"
    grammar:
      - "condicional.mixto"
      - "pluscuamperfecto.subjuntivo"
    register_max: "informal"
    sample:
      es: "Si hubiera ahorrado, ahora tendría un depto."
      en: "If I'd saved, I'd have an apartment now."
    tips:
      - title: "Then and now"
        body: "A past that went differently, and what it would mean today: **si hubiera ahorrado** (then),
          **ahora tendría un depto** (now). The first half is *hubiera* + participle, the second the
          plain conditional."
      - title: "Hubiéramos"
        body: "With *we*: **si hubiéramos salido antes, ya estaríamos ahí**. The participles: **ahorrado,
          comprado, vendido, aceptado**."
    words:
      - lemma: "ahorrar"
        pos: "verb"
        forms:
          - form: "ahorrado"
            en: "saved"
            f: "part"
      - lemma: "comprar"
        pos: "verb"
        forms:
          - form: "comprado"
            en: "bought"
            f: "part"
      - lemma: "vender"
        pos: "verb"
        forms:
          - form: "vendido"
            en: "sold"
            f: "part"
      - lemma: "aceptar"
        pos: "verb"
        forms:
          - form: "aceptado"
            en: "accepted"
            f: "part"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estaríamos"
            en: "we would be"
            f: "1pl.cond.ind"

  - ordinal: 4
    slug: "si-hubieras-estudiado"
    title: "Imagine the life you'd have now"
    summary: "Si hubieras estudiado, ahora serías médico"
    grammar:
      - "condicional.mixto"
      - "pluscuamperfecto.subjuntivo"
    register_max: "informal"
    sample:
      es: "Si hubiera invertido en dólares, ahora tendría ahorros."
      en: "If I'd invested in dollars, I'd have savings now."
    tips:
      - title: "Your life, my life"
        body: "The mixed conditional with *you*: **si hubieras estudiado medicina, ahora serías médico**;
          **si me hubieras hecho caso, no estarías así**. With *we*: **si hubiéramos ahorrado, ahora
          tendríamos para las vacaciones**."
      - title: "A esta altura…"
        body: "**A esta altura** — *by now* — is how porteños bring the other life into the present: **si
          me hubiera mudado a Córdoba, a esta altura estaría re tranquilo**. New participles:
          **mudado, aprendido, dejado, invertido**."
    words:
      - lemma: "mudarse"
        pos: "verb"
        forms:
          - form: "mudado"
            en: "moved (house)"
            f: "part"
      - lemma: "aprender"
        pos: "verb"
        forms:
          - form: "aprendido"
            en: "learned"
            f: "part"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejado"
            en: "quit, given up"
            f: "part"
      - lemma: "invertir"
        pos: "verb"
        en: "to invest"
        forms:
          - form: "invertido"
            en: "invested"
            f: "part"
      - lemma: "estar"
        pos: "verb"
        forms:
          - form: "estaría"
            en: "I would be, he would be"
            f: "sg.cond.ind"
          - form: "estarías"
            en: "you would be (somewhere, some way)"
            f: "2sg.cond.ind.vos"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "serías"
            en: "you would be (someone, something)"
            f: "2sg.cond.ind.vos"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "sabrías"
            en: "you would know"
            f: "2sg.cond.ind.vos.irregular"
      - lemma: "tener"
        pos: "verb"
        forms:
          - form: "tendríamos"
            en: "we would have (got)"
            f: "1pl.cond.ind.irregular"
      - lemma: "haber"
        pos: "verb"
        forms:
          - form: "habría"
            en: "there would be"
            f: "3sg.cond.ind.irregular"
      - lemma: "ahorros"
        pos: "noun"
        en: "savings"
      - lemma: "medicina"
        pos: "noun"
        en: "medicine (the degree)"
      - lemma: "a esta altura"
        pos: "phrase"
        en: "by now, at this point"

  - ordinal: 5
    slug: "tendria-que-haber"
    title: "Talk about regrets"
    summary: "Tendría que haber ido"
    grammar:
      - "tendria-que-haber"
      - "arrepentirse"
    register_max: "informal"
    sample:
      es: "Tendría que haber ido."
      en: "I should have gone."
    tips:
      - title: "Tendría que haber…"
        body: "**Tendría que haber** + participle is *I should have*: **tendría que haber ido**,
          **tendrías que haber avisado**. Porteños use it far more than any other past regret."
      - title: "Me arrepiento"
        body: "**Me arrepiento** — *I regret it*; **me arrepentí** — *I regretted it, I changed my
          mind*. A missed chance is a **oportunidad** you didn't **aprovechar**."
    words:
      - lemma: "tendría que haber"
        pos: "phrase"
        en: "I should have, he should have"
      - lemma: "tendrías que haber"
        pos: "phrase"
        en: "you should have"
      - lemma: "arrepentirse"
        pos: "verb"
        en: "to regret; to change one's mind"
        forms:
          - form: "me arrepiento"
            en: "I regret it"
            f: "1sg.pres.ind.clitic.irregular"
          - form: "me arrepentí"
            en: "I regretted it, I changed my mind"
            f: "1sg.pret.ind.clitic"
          - form: "arrepiento"
            f: "1sg.pres.ind.irregular"
            bound: true
          - form: "arrepentí"
            f: "1sg.pret.ind"
            bound: true
      - lemma: "oportunidad"
        pos: "noun"
        en: "chance, opportunity"
      - lemma: "aprovechar"
        pos: "verb"
        en: "to make the most of, to take advantage of"
        forms:
          - form: "aprovechar"
            f: "inf"
          - form: "aproveché"
            en: "I made the most of"
            f: "1sg.pret.ind"
          - form: "aprovechado"
            en: "made the most of"
            f: "part"

  - ordinal: 6
    slug: "me-hubiera-gustado"
    title: "Say what you wish you'd done"
    summary: "Me hubiera gustado ir, pero no pude"
    grammar:
      - "tendria-que-haber"
      - "arrepentirse"
    register_max: "informal"
    sample:
      es: "Me hubiera gustado ir, pero no pude."
      en: "I would have liked to go, but I couldn't."
    tips:
      - title: "We should have, they should have"
        body: "The regret works for everyone: **tendríamos que haber salido antes**, **tendrían que haber
          avisado**. And the softest one of all: **me hubiera gustado** — *I'd have liked to*: **me hubiera
          gustado verte**."
      - title: "¿Te arrepentís?"
        body: "With *vos*: **¿te arrepentís?**; with *him*: **se arrepintió**. A chance you **dejaste
          pasar** — *let slip* — gets a **te lo perdiste** from your friends; a blunder is **metí la pata**.
          **Lamentablemente**, you can't **volver atrás**."
    words:
      - lemma: "tendríamos que haber"
        pos: "phrase"
        en: "we should have"
      - lemma: "tendrían que haber"
        pos: "phrase"
        en: "they should have, you all should have"
      - lemma: "me hubiera gustado"
        pos: "phrase"
        en: "I would have liked (to)"
      - lemma: "arrepentirse"
        pos: "verb"
        forms:
          - form: "te arrepentís"
            en: "you regret it"
            f: "2sg.pres.ind.vos.clitic"
          - form: "se arrepintió"
            en: "he regretted it, she changed her mind"
            f: "3sg.pret.ind.clitic.irregular"
          - form: "arrepentís"
            f: "2sg.pres.ind.vos"
            bound: true
          - form: "arrepintió"
            f: "3sg.pret.ind.irregular"
            bound: true
      - lemma: "te lo perdiste"
        pos: "phrase"
        en: "you missed out"
      - lemma: "meter la pata"
        pos: "phrase"
        en: "to put your foot in it"
        forms:
          - form: "meter la pata"
            f: "inf"
          - form: "metí la pata"
            en: "I put my foot in it"
            f: "1sg.pret.ind"
      - lemma: "dejar pasar"
        pos: "phrase"
        en: "to let (a chance) slip"
        forms:
          - form: "dejar pasar"
            f: "inf"
          - form: "dejé pasar"
            en: "I let slip"
            f: "1sg.pret.ind"
      - lemma: "error"
        pos: "noun"
        en: "mistake"
      - lemma: "volver atrás"
        pos: "phrase"
        en: "to turn back the clock"
      - lemma: "lamentablemente"
        pos: "adv"
        en: "unfortunately"

  - ordinal: 7
    slug: "practica-no-es-que"
    title: "Practice: excuses, what-ifs and regrets"
    summary: "Es que tendría que haber ahorrado"
    grammar:
      - "repaso.no-es-que"
      - "repaso.condicional-mixto"
      - "repaso.arrepentirse"
    register_max: "informal"
    sample:
      es: "Me arrepiento, tendría que haber ido."
      en: "I regret it, I should have gone."
    tips:
      - title: "No es que…, es que…"
        body: "**No es que no quiera** (subjunctive), **es que no puedo** (normal verb)."
      - title: "Hubiera, tendría que haber"
        body: "**Si hubiera ahorrado, ahora tendría…** — and the regret: **tendría que haber ahorrado**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "no es que"
      - "es que"
      - "quiera"
      - "hubiéramos"
      - "ahorrado"
      - "comprado"
      - "vendido"
      - "estaríamos"
      - "tendría que haber"
      - "tendrías que haber"
      - "me arrepiento"
      - "me arrepentí"
      - "oportunidad"
      - "aprovechar"
      - "hubiera"
      - "a menos que"

  - ordinal: 8
    slug: "practica-me-hubiera-gustado"
    title: "Practice: saying no, other lives, missed chances"
    summary: "Me hubiera gustado, pero tengo un compromiso"
    grammar:
      - "repaso.no-es-que"
      - "repaso.condicional-mixto"
      - "repaso.arrepentirse"
    register_max: "informal"
    sample:
      es: "Si hubieras aceptado la invitación, a esta altura estarías en la playa."
      en: "If you'd accepted the invitation, you'd be at the beach by now."
    tips:
      - title: "No es que no me interese"
        body: "Any verb after **no es que** goes subjunctive: **no me interese**, **no queramos**, **me caiga
          mal**."
      - title: "Otra vida, otra oportunidad"
        body: "**Si hubieras estudiado, ahora serías…** — and the one you let slip: **me hubiera gustado**,
          **tendríamos que haber…**, **te lo perdiste**."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "interese"
      - "caiga"
      - "invitación"
      - "compromiso"
      - "la próxima"
      - "quedar mal"
      - "invertido"
      - "estarías"
      - "serías"
      - "a esta altura"
      - "me hubiera gustado"
      - "te lo perdiste"
      - "metí la pata"
      - "error"
      - "hubieras"
      - "ojalá"
      - "de verdad"

  - ordinal: 9
    slug: "un-ratito"
    title: "Soften it with -ito"
    summary: "Esperame un ratito"
    grammar:
      - "diminutivo"
    register_max: "informal"
    sample:
      es: "Esperame un ratito."
      en: "Wait for me a moment."
    tips:
      - title: "-ito, -ita"
        body: "**-ito** makes things small, and requests smaller: **un ratito** — *a sec*; **un cafecito**;
          **un poquito**. It sounds kind rather than childish."
      - title: "Cerquita, despacito"
        body: "It works on adverbs too: **cerquita** — *really close*; **despacito** — *nice and slow*.
          **Chiquito** — *tiny*."
    words:
      - lemma: "ratito"
        pos: "noun"
        en: "a moment, a sec"
      - lemma: "cafecito"
        pos: "noun"
        en: "a little coffee"
      - lemma: "poquito"
        pos: "adv"
        en: "a little bit"
      - lemma: "cerquita"
        pos: "adv"
        en: "really close"
      - lemma: "despacito"
        pos: "adv"
        en: "nice and slow"
      - lemma: "chiquito"
        pos: "adj"
        en: "tiny"
        forms:
          - form: "chiquito"
            f: "m.sg"
          - form: "chiquita"
            f: "f.sg"

  - ordinal: 10
    slug: "hace-fresquito"
    title: "Talk sweet with -ito"
    summary: "Hace fresquito, pero salió el solcito"
    grammar:
      - "diminutivo"
    register_max: "informal"
    sample:
      es: "Hace fresquito, pero salió el solcito."
      en: "It's a bit chilly, but the sun's come out."
    tips:
      - title: "-cito"
        body: "Words ending in *-or*, *-ol*, *-e* take **-cito**: **calor → calorcito**, **sol → solcito**,
          **fresco → fresquito** (the *c* turns *qu*). Porteños talk about the weather almost only in
          diminutives: **hace fresquito**, **qué lindo calorcito**."
      - title: "-ito on everything"
        body: "Nouns: **una cosita**, **un pedacito**, **un besito**. Adjectives: **calentito** — *nice and
          warm*; **cortito**; **igualito a su papá**; **solito** — *all by himself*. Adverbs:
          **tempranito**, **rapidito**. It agrees like any adjective: **una sopa calentita**."
    words:
      - lemma: "fresquito"
        pos: "noun"
        en: "a nip in the air, chilly weather"
      - lemma: "calorcito"
        pos: "noun"
        en: "nice warm weather"
      - lemma: "solcito"
        pos: "noun"
        en: "sunshine (the nice kind)"
      - lemma: "cosita"
        pos: "noun"
        en: "little thing"
        forms:
          - form: "cosita"
            f: "f.sg"
          - form: "cositas"
            f: "f.pl"
      - lemma: "pedacito"
        pos: "noun"
        en: "a little piece"
      - lemma: "besito"
        pos: "noun"
        en: "a little kiss"
        forms:
          - form: "besito"
            f: "m.sg"
          - form: "besitos"
            f: "m.pl"
      - lemma: "calentito"
        pos: "adj"
        en: "nice and warm, fresh from the oven"
        forms:
          - form: "calentito"
            f: "m.sg"
          - form: "calentita"
            f: "f.sg"
      - lemma: "cortito"
        pos: "adj"
        en: "nice and short"
        forms:
          - form: "cortito"
            f: "m.sg"
          - form: "cortita"
            f: "f.sg"
      - lemma: "igualito"
        pos: "adj"
        en: "just like, the spitting image of"
        forms:
          - form: "igualito"
            f: "m.sg"
          - form: "igualita"
            f: "f.sg"
      - lemma: "solito"
        pos: "adj"
        en: "all by yourself, all alone"
        forms:
          - form: "solito"
            f: "m.sg"
          - form: "solita"
            f: "f.sg"
      - lemma: "tempranito"
        pos: "adv"
        en: "nice and early"
      - lemma: "rapidito"
        pos: "adv"
        en: "real quick"

  - ordinal: 11
    slug: "lo-que-pasa-es-que"
    title: "Explain what's really going on"
    summary: "Lo que pasa es que no tengo tiempo"
    grammar:
      - "lo.nominalizacion"
    register_max: "informal"
    sample:
      es: "Lo que pasa es que no tengo tiempo."
      en: "The thing is, I don't have time."
    tips:
      - title: "Lo que pasa es que…"
        body: "**Lo que pasa es que…** — *the thing is* — explains the real reason. **Lo raro es que…**
          — *the weird thing is*; **lo importante es que…** — *what matters is*."
      - title: "Lo de…"
        body: "**Lo de** is *the business with*: **¿qué pasó con lo de Juan?** And **lo de siempre** is
          *the usual*: at the café, at the bar, in life."
    words:
      - lemma: "lo que pasa es que"
        pos: "phrase"
        en: "what's going on is"
      - lemma: "lo raro"
        pos: "phrase"
        en: "the weird thing"
      - lemma: "lo importante"
        pos: "phrase"
        en: "what matters"
      - lemma: "lo de siempre"
        pos: "phrase"
        en: "the usual"
      - lemma: "lo de"
        pos: "phrase"
        en: "the business with, the thing about"

  - ordinal: 12
    slug: "lo-que-paso-fue-que"
    title: "Clear up a misunderstanding"
    summary: "Lo que pasó fue que no te entendí"
    grammar:
      - "lo.nominalizacion"
    register_max: "informal"
    sample:
      es: "Fue un malentendido: lo que pasó fue que no te entendí."
      en: "It was a misunderstanding: what happened was I didn't understand you."
    tips:
      - title: "Lo que pasó fue que…"
        body: "Tell it in the past: **lo que pasó fue que se cortó el subte**. Say what you meant: **lo que
          quiero decir es que…**. **Lo que más** — *what… most*: **lo que más me molestó fue eso**. And
          **en el fondo** — *deep down* — for the real reason under it."
      - title: "Lo mío, lo tuyo"
        body: "**Lo** turns anything into *the thing*: **lo tuyo es la cocina** — *your thing is cooking*;
          **lo mío** — *my thing*; **lo primero** — *the first thing*; **lo justo** — *just enough*. Giving
