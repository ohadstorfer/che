  - ordinal: 2
    slug: "paro-docente"
    title: "Plan around a strike"
    summary: "Mañana hay paro docente"
    grammar:
      - "ciudad.paro"
      - "funcionar"
    register_max: "informal"
    sample:
      es: "Mañana hay paro docente y no hay clases."
      en: "There's a teachers' strike tomorrow and no school."
    tips:
      - title: "Paro docente, paro general"
        body: "A strike is named after who stops: **paro docente** — *the teachers*; **paro de colectivos**
          — the **colectiveros**; **paro general** — everyone. The **gremio** — *the union* —
          **anunció un paro** for Thursday, and the news calls it a **medida de fuerza**."
      - title: "¿Funciona o no?"
        body: "The morning after, the question is what still runs: **el subte funciona con normalidad**, or
          **suspendieron el servicio**. When the strike itself is called off, the fixed phrase is
          **levantaron el paro** / **se levantó el paro**; *suspender* is for classes, an exam, a
          march or a service. **Hubo un apagón** — *there was a blackout* — and the traffic lights
          are out: **embotellamiento**, **desvíos**, and half the city goes **a pie**."
