    register_max: "lunfardo"
    sample:
      es: "Se ve que se tapó un caño."
      en: "A pipe must have got blocked."
    tips:
      - title: "Aparentemente, se ve que"
        body: "**Aparentemente**, **se ve que**, **lo desmintieron** — and always **¿cuál es la fuente?**"
      - title: "Me afanaron, se tapó"
        body: "**Me afanaron la billetera**, **me estafaron**; **se tapó la canilla**, **se trabó el
          ascensor** — the *they* nobody names, and the *se* nobody did."
