  - ordinal: 5
    slug: "las-elecciones"
    title: "Talk about voting"
    summary: "¿A quién votaste?"
    grammar:
      - "votar"
      - "politica.sin-politica"
    register_max: "informal"
    sample:
      es: "¿A quién votaste?"
      en: "Who did you vote for?"
    tips:
      - title: "Votar"
        body: "In Argentina voting is **obligatorio** — *mandatory*. **¿A quién votaste?** is a real
          question, though many answer **eso no se pregunta**. **Votar a** someone: *voté a la misma
          candidata*. **Votar en blanco** is to cast a blank vote. And from the night before there
          is **veda**: no campaigning, and shops and bars can't sell alcohol."
      - title: "Las elecciones"
        body: "**Las elecciones** — *the elections* — decide the **gobierno** and the **presidente**. The
          course stays out of it: the words, not the opinions."
      - title: "¿Dónde votás?"
        body: "Election day is a Sunday, and everyone asks **¿dónde votás?** You check the **padrón** — *the
          voter roll* — for your school and your **mesa**. **Votamos** in the school around the
          corner; **mi abuela votó a las ocho**, first in line."
      - title: "El cuarto oscuro"
        body: "The booth is the **cuarto oscuro** — *the dark room* — where you pick your **boleta** and
          drop it in the **urna**. The **voto** is secret. If nobody wins outright, there's a
          **balotaje** — *a runoff*. Missed it? You have to **justificar** why."
      - title: "Las encuestas"
        body: "Before, the **campaña**, the **debate** on TV and the **encuestas** — *the polls* — that
          always get it wrong. After, the **resultado**. The course stays out of who won."
    words:
