        body: "About what hasn't happened yet, the verb after **cuanto** goes subjunctive: **cuanto antes
          lleguemos, mejor**; **cuanto antes reservemos, más barato**; **cuanto más temprano empecemos,
          antes terminamos**. About what always happens, the normal verb: **cuanto más ganás, más
          gastás**."
