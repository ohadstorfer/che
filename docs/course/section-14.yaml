  - ordinal: 3
    slug: "fue-construido"
    title: "Read the news"
    summary: "El puente fue construido hace un siglo"
    grammar:
      - "voz-pasiva.ser"
      - "noticias"
    register_max: "informal"
    sample:
      es: "El puente fue construido hace un siglo."
      en: "The bridge was built a century ago."
    tips:
      - title: "Fue construido"
        body: "The news likes the passive: **fue** + participle. **El puente fue construido en 1900**; **la
          estación fue inaugurada ayer**. The participle agrees like an adjective: *construido,
          construida*."
      - title: "Fueron detenidos"
        body: "More than one: **fueron detenidos** — *they were arrested*. Just as common, in the news and
          in speech, is **se** + verb: **el puente se construyó hace un siglo**, **se inauguró la
          estación**. In conversation porteños also turn it around: *construyeron el puente*, *los
          detuvieron*."
