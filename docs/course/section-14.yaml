    register_max: "informal"
    sample:
      es: "Fue un malentendido: lo que pasó fue que no te entendí."
      en: "It was a misunderstanding: what happened was I didn't understand you."
    tips:
      - title: "Lo que pasó fue que…"
        body: "Tell it in the past: **lo que pasó fue que se cortó el subte**. Say what you meant: **lo que
          quiero decir es que…**. **Lo que más** — *what… most*: **lo que más me molestó fue eso**.
          And **en el fondo** — *deep down* — for the real reason under it."
      - title: "Lo mío, lo tuyo"
        body: "**Lo** turns anything into *the thing*: **lo tuyo es la cocina** — *your thing is cooking*;
          **lo mío** — *my thing*; **lo primero** — *the first thing*; **lo justo** — *just enough*.
          Giving up an argument: **lo que vos digas** or **lo que sea** — *whatever*."
      - title: "Aclarar"
        body: "To clear it up — **aclarar**: **quiero aclarar algo**. Then: **no quise decir eso** — *I
          didn't mean that*; **me expresé mal** — *I put it badly*; **me entendiste mal** — *you
          misunderstood me*; **no lo dije por vos** — *I didn't say it about you*."
