# ---------------------------------------------------------------------------
# Che — Section 13 outline: "The news and the street" (C1.2)
#
# Public life in Buenos Aires, told the way porteños tell it: strikes and
# road blocks (hoy hay paro), the passive of the news (fue construido), voting
# without the politics, rumors and sources (según el diario), getting robbed
# and reporting it, the building and its expensas, the team you root for, the
# tango, the parrilla — and a checkpoint that weighs up the city (lo bueno de
# vivir acá).
#
# Plan: docs/course/roadmap.md §Section 13.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

