    register_max: "informal"
    sample:
      es: "Me hubiera gustado ir, pero no pude."
      en: "I would have liked to go, but I couldn't."
    tips:
      - title: "We should have, they should have"
        body: "The regret works for everyone: **tendríamos que haber salido antes**, **tendrían que haber
          avisado**. And the softest one of all: **me hubiera gustado** — *I'd have liked to*: **me
          hubiera gustado verte**."
      - title: "¿Te arrepentís?"
        body: "With *vos*: **¿te arrepentís?**; with *him*: **se arrepintió**. A chance you **dejaste
          pasar** — *let slip* — gets a **te lo perdiste** from your friends; a blunder is **metí la
          pata** or, more porteño, **me mandé una macana**. **¡Qué macana!** — *what a shame*.
          **Lamentablemente**, you can't **volver atrás** — so you drop it with **ya fue**."
      - title: "¡Hubieras avisado!"
        body: "On its own, **hubieras** + participle is a reproach — *you should have*: **¡hubieras
          avisado!** — *you should have told me!* As a question it is *would you have…?*:
          **¿hubieras ido?** And for *we shouldn't have*, add **no**: **no tendríamos que haber
          venido**."
    words:
