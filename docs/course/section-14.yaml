  - ordinal: 10
    slug: "tocas-la-guitarra"
    title: "Talk about the music you grew up with"
    summary: "¿Tocás la guitarra?"
    grammar:
      - "cultura.tango"
      - "cantar"
    register_max: "informal"
    sample:
      es: "¿Tocás la guitarra?"
      en: "Do you play the guitar?"
    tips:
      - title: "Tocar, cantar, bailar"
        body: "An instrument is **tocar**: **¿tocás la guitarra?**, **mi abuelo tocaba el bandoneón en una
          orquesta**. **¿Cantás?** **¿Bailás tango?** — and at the milonga, **¿bailamos?**"
      - title: "No todo es tango"
        body: "Porteños grew up on **rock nacional** — *Argentine rock* — sung in Spanish in the stadiums;
          the provinces on **folclore**; every party ends in **cumbia**. A **cantante** is a singer;
          the one who sings tango is a *cantor*."
