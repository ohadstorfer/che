  - ordinal: 7
    slug: "segun-el-diario"
    title: "Say where you heard it"
    summary: "Según el diario, mañana llueve"
    grammar:
      - "fuentes"
      - "rumor"
    register_max: "informal"
    sample:
      es: "Según el diario, mañana llueve."
      en: "According to the paper, it's raining tomorrow."
    tips:
      - title: "Según"
        body: "**Según** — *according to*: **según el diario**, **según mi vieja**. **Al parecer** and
          **supuestamente** keep a distance from what you're passing on; *al parecer* is news
          language. For gossip porteños say **por lo visto** or **parece que**: *por lo visto, Sofi
          tiene novio nuevo*; *parece que no viene*."
      - title: "¿Está confirmado?"
        body: "A **rumor** is just that until someone **confirma**: *el club confirmó la noticia*. Or as
          porteños say about any rumor: **dicen que…**"
      - title: "Según quién"
        body: "**Según** takes people as well as papers: **según él**, **según ellos**, **según la fuente**.
          **Aparentemente** is the neutral *apparently*; **se ve que** is what you conclude from
          what you see: **se ve que llovió** — *it must have rained*."
      - title: "Lo desmintieron"
        body: "A story is **confirmado** or it's **desmentido**: **el gremio desmintió el rumor**, **lo
          desmintieron en el noticiero**. Before you forward it, ask **¿cuál es la fuente?** — the
          **titular** says one thing, the **versión oficial** another."
      - title: "Me llegó una cadena"
        body: "The family WhatsApp group sends a **cadena** — *a chain message* — every morning. **Chequeá
          la fuente** before you believe it — and before **compartirlo**. If it isn't true: **es
          mentira**, **es falso** or, very porteño, **es verso** — *it's made up*."
    words:
