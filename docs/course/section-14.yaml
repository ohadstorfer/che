    title: "Talk about regrets"
    summary: "Tendría que haber ido"
    grammar:
      - "tendria-que-haber"
      - "arrepentirse"
    register_max: "informal"
    sample:
      es: "Tendría que haber ido."
      en: "I should have gone."
    tips:
      - title: "Tendría que haber…"
        body: "**Tendría que haber** + participle is *I should have*: **tendría que haber ido**, **tendrías
          que haber avisado**. With **no** it is *I shouldn't have*: **no tendría que haber dicho
          eso**. Porteños use it far more than any other past regret."
      - title: "Me arrepiento"
        body: "**Me arrepiento** — *I regret it*; **me arrepentí** — *I regretted it, I changed my mind*.
          With what you did or didn't do, **de (no) haber** + participle: **me arrepiento de no
          haber ido** — *I regret not going*; *no me arrepiento de haber venido*. A missed chance is
          a **oportunidad** you didn't **aprovechar**."
    words:
