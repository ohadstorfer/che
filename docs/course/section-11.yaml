      - "nadie-que"
    register_max: "informal"
    sample:
      es: "¿Conocés a algún electricista que venga hoy?"
      en: "Do you know an electrician who can come today?"
    tips:
      - title: "Alguien que sepa"
        body: "People work like flats: if you don't know whether they exist, the subjunctive. **¿Conocés a
          alguien que arregle bicis?** Once you've found one, it's a fact: *tengo un amigo que
          **sabe** arreglar bicis*."
      - title: "No hay nadie que…"
        body: "Nobody, nothing, no one at all — always the subjunctive, because it doesn't exist: **no
          conozco a nadie que hable inglés**, **no hay ningún electricista que venga el domingo**.
          **Algún, ningún** drop the *-o* before a masculine noun (*algún bar*, *ningún
          electricista*); **alguna, ninguna** for feminine ones."
      - title: "De confianza"
        body: "In Buenos Aires you don't google an electrician, you ask around: **¿conocés a alguien de
          confianza?** Same for a flatmate: *busco a alguien **ordenado**, que no **fume** y que
          **comparta** los gastos*."
