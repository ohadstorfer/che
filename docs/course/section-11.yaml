  - ordinal: 26
    slug: "ni-ahi"
    title: "Read between the lines"
    summary: "¿Estás loco? Ni ahí"
    grammar:
      - "ironia"
      - "repaso.b2"
    register_max: "informal"
    sample:
      es: "¿Ir en auto al centro? Ni ahí."
      en: "Drive downtown? No way."
    tips:
      - title: "Ni ahí"
        body: "**Ni ahí** — *no way, not even close* — is how a porteño turns something down. **Tal cual**
          — *exactly* — is how they agree."
      - title: "Es cualquiera"
        body: "**Es cualquiera** — *that's nonsense*. **Flasheaste** — *you're imagining things*. And a
          **¡qué lindo!** can be sincere, or ironic when the rain starts."
