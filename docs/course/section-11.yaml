      en: "The upside is that they pay well; besides, it's close by."
    tips:
      - title: "Además, sobre todo"
        body: "To stack up reasons: **además** — *besides* — adds one more; **sobre todo** — *above all* —
          picks the one that counts: *me gusta, **sobre todo** por la gente*. Porteños also say
          **más que nada** — *mainly*."
      - title: "Por lo menos, la verdad"
        body: "**Por lo menos** — *at least* — finds the good side: *pagan poco, pero **por lo menos** queda
          cerca*. **La verdad** — *honestly* — says what you really think: ***la verdad**, no me
          conviene*. **Conviene** works like *gustar*: **me conviene** — *it's better for me*; **te
          conviene llevar paraguas** — *it's a good idea to take an umbrella*."
