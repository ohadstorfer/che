    sample:
      es: "Elegí el que quieras."
      en: "Pick whichever one you want."
    tips:
      - title: "El que, la que"
        body: "**El que** — *the one that* — matches what it stands for: **el que quieras**, **la que está
          en la esquina**, **los que vinieron**, **las que prefieras**."
      - title: "Donde"
        body: "**Donde** with no accent joins a place to the rest of the sentence: **el bar donde nos
          conocimos** — *the bar where we met*. The question keeps its accent: *¿dónde?*"
      - title: "Elegí: two meanings"
        body: "**Elegí** is the order *choose!* and also *I chose*: **elegí el que quieras** — *pick
          whichever you want*; *ayer **elegí** la roja* — *yesterday I chose the red one*. The rest
          of the sentence tells you which."
