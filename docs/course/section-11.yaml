    sample:
      es: "Si hubiera sabido, te hubiera avisado."
      en: "If I'd known, I would have told you."
    tips:
      - title: "Si hubiera sabido"
        body: "For what didn't happen: **si hubiera sabido, te hubiera avisado** — *if I'd known, I'd have
          told you*. Porteños use **hubiera** + a participle in both halves. In writing and on TV
          you'll also see **habría** in the second half: *te habría avisado* — same meaning."
      - title: "The same participles"
        body: "**Hubiera** takes the participles *había* does: **sabido, venido, ido, llamado, dicho,
          hecho**. **Si hubieras venido** — *if you had come*. On its own it's *would have* — *yo
          hubiera dicho que sí*, *I would have said yes* — or regret, *should have*: **ojalá hubiera
          estudiado** — *I wish I'd studied*; **¡me hubieras llamado!** — *you should have called
          me!*"
