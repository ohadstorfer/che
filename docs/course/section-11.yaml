  - ordinal: 7
    slug: "practica-aunque-sea"
    title: "Practice: what they wanted, no matter what, how long"
    summary: "Aunque sea un rato, sigo practicando"
    grammar:
      - "repaso.subjuntivo.imperfecto"
      - "repaso.aunque"
      - "repaso.llevar"
    register_max: "informal"
    sample:
      es: "Aunque sea un rato, sigo practicando."
      en: "Even if it's just for a bit, I keep practising."
    tips:
      - title: "Querían que, por más que"
        body: "**Mis viejos querían que estudiara** — the wish is in the past, so the second verb is too.
          **Por más que me cueste** — however hard it is. Something not sure or not real yet takes
          the subjunctive: *por más que llueva, vamos igual*. A fact takes the normal verb: *por más
          que ahorro, no me alcanza*."
      - title: "¿Hace cuánto?"
        body: "**Hace un año que estudio** says the same as **llevo un año estudiando**. **Seguimos
          buscando** — *we're still looking*; **volví a empezar** — *I started again*."
    review:
      - "querían"
      - "estudiara"
      - "saliera"
      - "dijera"
      - "permiso/noun"
      - "aunque sea"
      - "por más que"
      - "sin embargo"
      - "me cuesta"
      - "hace cuánto"
      - "practicando"
      - "seguimos"
      - "volví a"
      - "cueste"
      - "llevás"
      - "a pesar de"
  - ordinal: 8
    slug: "como-si-nada"
    title: "Say as if"
    summary: "Como si nada"
    grammar:
      - "como-si.subjuntivo-imperfecto"
      - "hacerse-el"
      - "ni-que"
    register_max: "informal"
    sample:
      es: "Me habló como si nada."
      en: "He talked to me as if nothing had happened."
    tips:
      - title: "Como si"
        body: "**Como si** — *as if* — always takes the past subjunctive: **habla como si supiera todo**,
          **como si fuera fácil**. **Como si nada** — *as if nothing had happened*. **¡Ni que fuera
          tan difícil!** — *it's not like it's that hard!*"
      - title: "Se hace el vivo"
        body: "**Hacerse el** + a describing word is *to act, to play*: **se hace el vivo** — *he acts all
          clever*; **se hizo el distraído** — *he pretended not to notice*. For a woman it's **la**:
          **se hace la tonta**, **se hizo la distraída**."
    words:
      - lemma: "como si"
        pos: "phrase"
        en: "as if"
      - lemma: "como si nada"
        pos: "phrase"
        en: "as if nothing had happened"
      - lemma: "ni que"
        pos: "phrase"
        en: "it's not like, as if (it were)"
      - lemma: "saber"
        pos: "verb"
        forms:
          - form: "supiera"
            en: "(that) I knew, (that) he knew"
            f: "sg.impf.subj.irregular"
          - form: "supieras"
            en: "(that) you knew"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "hacerse"
        pos: "verb"
        forms:
          - form: "se hace"
            en: "he acts, she plays (the)"
            f: "3sg.pres.ind.clitic"
          - form: "se hizo"
            en: "he acted, she played (the)"
            f: "3sg.pret.ind.clitic.irregular"
      - lemma: "vivo"
        pos: "adj"
        en: "clever, sly"
        register: "informal"
        forms:
          - form: "vivo"
            f: "m.sg"
          - form: "viva"
            f: "f.sg"
        note: "Also 'alive'. Hacerse el vivo = try to be smart or take advantage of others."
      - lemma: "dormido"
        pos: "adj"
        en: "asleep"
        forms:
          - form: "dormido"
            f: "m.sg"
          - form: "dormida"
            f: "f.sg"
  - ordinal: 9
    slug: "no-te-hagas-el-gil"
    title: "Call out someone who's pretending"
    summary: "No te hagas el gil"
    grammar:
      - "como-si.subjuntivo-imperfecto"
      - "hacerse-el"
      - "ni-que"
    register_max: "lunfardo"
    sample:
      es: "Se hace el distraído, como si no me viera."
      en: "He's pretending not to notice, as if he couldn't see me."
    tips:
      - title: "Te hacés el, me hice el"
        body: "**Hacerse el** works for everyone: **te hacés el sordo** — *you act like you can't hear*;
          **me hice el distraído** — *I pretended not to notice*. The one who acts like he's seen it
          all **se hace el canchero**. To stop it: **no te hagas el gil** — *don't play dumb*. The
          one porteños say most, among friends only: **no te hagas el boludo** (to a woman: **la
          boluda**)."
      - title: "Como si no…"
        body: "**Como si** with a *no*: **como si no pasara nada**, **como si no me viera**, **como si no le
          importara**. And the comeback: **¡ni que fueras mi viejo!** — *it's not like you're my
          dad!*"
      - title: "¡Qué caradura!"
        body: "A **caradura** has no shame: never pays, asks for too much, lies and doesn't feel bad about
          it. **¡Qué caradura!** — *you've got some nerve!* Between friends it's often a joke."
    words:
      - lemma: "hacerse"
        pos: "verb"
        forms:
          - form: "te hacés"
            en: "you act, you play (the)"
            f: "2sg.pres.ind.vos.clitic"
          - form: "me hice"
            en: "I acted, I played (the)"
            f: "1sg.pret.ind.clitic.irregular"
      - lemma: "gil"
        pos: "noun"
        en: "fool, sucker"
        register: "informal"
      - lemma: "sordo"
        pos: "adj"
        en: "deaf"
        forms:
          - form: "sordo"
            f: "m.sg"
          - form: "sorda"
            f: "f.sg"
      - lemma: "canchero"
        pos: "adj"
        en: "confident, cool"
        register: "informal"
        forms:
          - form: "canchero"
            f: "m.sg"
            en: "confident, cool"
            note: "Hacerse el canchero = to show off, act like you know it all. Ser canchero can also be
              good: skilled, relaxed."
          - form: "canchera"
            f: "f.sg"
            en: "confident, cool"
