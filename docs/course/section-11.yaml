# ---------------------------------------------------------------------------
# Che — Section 10 outline: "Making your case" (B2.1)
#
# The past subjunctive stops being one fixed phrase and starts following the
# rest of the sentence (quería que vinieras, como si supiera, si hubiera
# sabido), and with it the tools for saying what you mean and holding your
# ground: aunque, how long you've been at something, hosting a table of
# people (pasen, pasen), which one you mean (el que quieras), weighing two
# sides (por un lado… por otro lado), and the paperwork every porteño life
# runs through — ending on a checkpoint that argues it out.
#
# Plan: docs/course/roadmap.md §Section 10.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 11
  slug: "making-your-case"
  title: "Making your case"
  cefr: "B2.1"
  practice: 2
units:
  - ordinal: 1
    slug: "queria-que-vinieras"
    title: "Say what you wanted others to do"
    summary: "Quería que vinieras"
    grammar:
      - "subjuntivo.imperfecto.querer-que"
      - "correlacion.tiempos"
    register_max: "informal"
    sample:
      es: "Quería que vinieras a la juntada."
      en: "I wanted you to come to the get-together."
    tips:
      - title: "Quería que vinieras"
        body: "When the wanting is in the past, the second verb moves into the past too: *quiero que vengas*
          becomes **quería que vinieras** — *I wanted you to come*."
      - title: "Me pidió que"
        body: "**Me pidió que lo llamara** — *she asked me to call him*. The same form follows an order told
          later: **me dijo que esperara** — *he told me to wait*."
    words:
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vinieras"
            en: "(that) you came"
            f: "2sg.impf.subj.vos.irregular"
            note: "In fast speech you will also hear 'quería que vengas'. Both are understood;
              'vinieras' is the careful form."
          - form: "viniera"
            en: "(that) I came, (that) he came"
            f: "sg.impf.subj.irregular"
      - lemma: "hacer"
        pos: "verb"
        forms:
          - form: "hicieras"
            en: "(that) you did"
            f: "2sg.impf.subj.vos.irregular"
          - form: "hiciera"
            en: "(that) I did, (that) he did"
            f: "sg.impf.subj.irregular"
      - lemma: "llamar"
        pos: "verb"
        forms:
          - form: "llamaras"
            en: "(that) you called"
            f: "2sg.impf.subj.vos"
          - form: "llamara"
            en: "(that) I called, (that) he called"
            f: "sg.impf.subj"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avisaras"
            en: "(that) you let know"
            f: "2sg.impf.subj.vos"
      - lemma: "esperar"
        pos: "verb"
        forms:
          - form: "esperara"
            en: "(that) I waited, (that) he waited"
            f: "sg.impf.subj"
  - ordinal: 2
    slug: "mis-viejos-querian"
    title: "Say what your parents wanted"
    summary: "Mis viejos querían que estudiara"
    grammar:
      - "subjuntivo.imperfecto.querer-que"
      - "correlacion.tiempos"
      - "subjuntivo.imperfecto.personas"
    register_max: "informal"
    sample:
      es: "Mis viejos querían que estudiara una carrera."
      en: "My parents wanted me to get a degree."
    tips:
      - title: "Querían que estudiara"
        body: "Growing up, every wish was in the past: **mis viejos querían que estudiara** — *my parents
          wanted me to study*; **no querían que saliera de noche** — *they didn't want me going out
          at night*. The second verb follows the first into the past."
      - title: "One trick, every verb"
        body: "Take the *ellos* preterite and swap **-ron** for **-ra**: *salieron* → **saliera**,
          *volvieron* → **volviera**, *dijeron* → **dijera**. With vos add an **-s**: **estudiaras,
          dijeras, fueras**. For *ellos*: **querían que vinieran todos**."
      - title: "Pedir permiso"
        body: "**Estricto, estricta** is *strict*. *Para salir tenía que pedir **permiso*** — *to go out I
          had to ask permission*. *Mi vieja **quería que volviera** temprano* — *my mom wanted me
          back early*."
    words:
      - lemma: "querer"
        pos: "verb"
        forms:
          - form: "querían"
            en: "they wanted"
            f: "3pl.impf.ind"
      - lemma: "estudiar"
        pos: "verb"
        forms:
          - form: "estudiara"
            en: "(that) I studied, (that) he studied"
            f: "sg.impf.subj"
          - form: "estudiaras"
            en: "(that) you studied"
            f: "2sg.impf.subj.vos"
      - lemma: "salir"
        pos: "verb"
        forms:
          - form: "saliera"
            en: "(that) I went out, (that) he went out"
            f: "sg.impf.subj"
          - form: "salieras"
            en: "(that) you went out"
            f: "2sg.impf.subj.vos"
      - lemma: "volver"
        pos: "verb"
        forms:
          - form: "volviera"
            en: "(that) I came back, (that) he came back"
            f: "sg.impf.subj"
      - lemma: "decir"
        pos: "verb"
        forms:
          - form: "dijera"
            en: "(that) I said, (that) he said"
            f: "sg.impf.subj.irregular"
          - form: "dijeras"
            en: "(that) you said"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "ayudar"
        pos: "verb"
        forms:
          - form: "ayudara"
            en: "(that) I helped, (that) he helped"
            f: "sg.impf.subj"
      - lemma: "ser"
        pos: "verb"
        forms:
          - form: "fueras"
            en: "(that) you were"
            f: "2sg.impf.subj.vos.irregular"
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vinieran"
            en: "(that) they came"
            f: "3pl.impf.subj.irregular"
      - lemma: "carrera"
        pos: "noun"
        en: "university degree, course of study"
        note: "False friend: carrera usually means the degree you study at university, not your job
          career."
      - lemma: "estricto"
        pos: "adj"
        en: "strict"
        forms:
          - form: "estricto"
            f: "m.sg"
          - form: "estricta"
            f: "f.sg"
      - lemma: "permiso"
        pos: "noun"
        en: "permission"
        note: "Say \"permiso\" to get past people or when entering a room or someone's home."
  - ordinal: 3
    slug: "aunque-llueva"
    title: "Say even if and even though"
    summary: "Aunque llueva, vamos igual"
    grammar:
      - "aunque.indicativo-subjuntivo"
      - "a-pesar-de"
      - "servir"
    register_max: "informal"
    sample:
      es: "Aunque llueva, vamos igual."
      en: "Even if it rains, we're going anyway."
    tips:
      - title: "Aunque: a fact, or a maybe"
        body: "**Aunque llueve, vamos** — it's raining, and we're going. **Aunque llueva, vamos** — whether
          it rains or not. A fact takes the normal verb; a maybe takes the subjunctive."
      - title: "Igual, a pesar de"
        body: "Porteños close the thought with **igual** — *anyway*: *aunque esté cansada, voy igual*;
          *gracias igual* — *thanks anyway*. **De todos modos** says the same but sounds written:
          *salí de todos modos*. **A pesar de** takes a noun or an infinitive: *a pesar del frío*."
    words:
      - lemma: "aunque"
        pos: "conj"
        en: "even though, even if"
      - lemma: "a pesar de"
        pos: "phrase"
        en: "despite, in spite of"
      - lemma: "servir"
        pos: "verb"
        en: "to be useful, to work"
        forms:
          - form: "sirve"
            en: "is useful, works"
            f: "3sg.pres.ind.irregular"
          - form: "sirven"
            en: "are useful, work"
            f: "3pl.pres.ind.irregular"
      - lemma: "costar"
        pos: "verb"
        forms:
          - form: "cueste"
            en: "(that) it costs, (that) it's hard"
            f: "3sg.pres.subj.irregular"
      - lemma: "de todos modos"
        pos: "phrase"
        en: "anyway, in any case"
      - lemma: "esfuerzo"
        pos: "noun"
        en: "effort"
      - lemma: "cansarse"
        pos: "verb"
        en: "to get tired, to get sick of"
        forms:
          - form: "me canso"
            en: "I get tired"
            f: "1sg.pres.ind.clitic"
          - form: "canso"
            f: "1sg.pres.ind"
            bound: true
  - ordinal: 4
    slug: "aunque-no-tenga-ganas"
    title: "Keep going even when it's hard"
    summary: "Aunque no tenga ganas, voy igual"
    grammar:
      - "aunque.indicativo-subjuntivo"
      - "a-pesar-de"
      - "servir"
      - "por-mas-que"
    register_max: "informal"
    sample:
      es: "Aunque no tenga ganas, voy igual al gimnasio."
      en: "Even if I don't feel like it, I still go to the gym."
    tips:
      - title: "Por más que"
        body: "**Por más que** — *no matter how much* — is a stronger *aunque*: **por más que me cueste,
          sigo** — *however hard it is, I keep going*. A maybe takes the subjunctive, a fact
          doesn't: *por más que **entreno**, engordo* — I do train; it just doesn't show."
      - title: "Aunque sea"
        body: "**Aunque sea** — *at least, even if it's only* — is the deal you make with yourself: *hoy no
          tengo ganas, pero **aunque sea** un rato voy*. And the other half of it: **aunque no me dé
          el tiempo** — *even if I don't have the time*."
      - title: "Sin embargo, así y todo"
        body: "Both start the second half: **sin embargo** — *however*, mostly in writing or formal talk —
          and the more spoken **así y todo** — *even so*: *hice dieta y **así y todo** engordé*."
    words:
      - lemma: "aunque sea"
        pos: "phrase"
        en: "at least, even just"
      - lemma: "por más que"
        pos: "phrase"
        en: "no matter how much, however much"
      - lemma: "sin embargo"
        pos: "phrase"
        en: "however"
      - lemma: "así y todo"
        pos: "phrase"
        en: "even so"
      - lemma: "dar"
        pos: "verb"
        forms:
          - form: "dé"
            en: "(that) it gives, (that) I give"
            f: "sg.pres.subj.irregular"
      - lemma: "costar"
        pos: "verb"
        forms:
          - form: "me cuesta"
            en: "it's hard for me"
            f: "3sg.pres.ind.clitic"
      - lemma: "entrenar"
        pos: "verb"
        en: "to train, to work out"
        forms:
          - form: "entrenar"
            f: "inf"
          - form: "entreno"
            en: "I train, I work out"
            f: "1sg.pres.ind"
          - form: "entrene"
            en: "(that) I train, (that) he trains"
            f: "sg.pres.subj"
      - lemma: "ejercicio"
        pos: "noun"
        en: "exercise"
      - lemma: "dieta"
        pos: "noun"
        en: "diet"
      - lemma: "engordar"
        pos: "verb"
        en: "to put on weight"
        forms:
          - form: "engordar"
            f: "inf"
          - form: "engordé"
            en: "I put on weight"
            f: "1sg.pret.ind"
  - ordinal: 5
    slug: "llevo-dos-anos"
    title: "Say how long you've been at it"
    summary: "Llevo dos años acá"
    grammar:
      - "llevar.tiempo.gerundio"
      - "hace-que"
      - "seguir.gerundio"
      - "dejar-de"
    register_max: "informal"
    sample:
      es: "Llevo dos años viviendo en Buenos Aires."
      en: "I've been living in Buenos Aires for two years."
    tips:
      - title: "Hace dos años que…"
        body: "**Hace dos años que vivo acá** — *I've been living here for two years*. Where English says
          *have been …ing*, Spanish stays in the present. To ask: **¿hace cuánto que vivís acá?** or
          just **¿hace cuánto estás acá?**; **¿hace mucho que esperás?** — *have you been waiting
          long?* You will also hear **llevo dos años viviendo acá** — same meaning, but day to day
          porteños say **hace… que**."
      - title: "Sigo, dejé de, volví a"
        body: "**Sigo laburando ahí** — *I still work there*. **Dejé de fumar** — *I quit smoking*. **Volvió
          a llamar** — *he called again*."
    words:
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevás"
            en: "you've been (for a time)"
            f: "2sg.pres.ind.vos"
          - form: "lleva"
            en: "he's been, she's been (for a time)"
            f: "3sg.pres.ind"
      - lemma: "vivir"
        pos: "verb"
        forms:
          - form: "viviendo"
            en: "living"
            f: "ger"
      - lemma: "seguir"
        pos: "verb"
        forms:
          - form: "sigo"
            en: "I keep on, I still"
            f: "1sg.pres.ind.irregular"
          - form: "seguís"
            en: "you keep on, you still"
            f: "2sg.pres.ind.vos"
      - lemma: "hace años"
        pos: "phrase"
        en: "for years; years ago"
      - lemma: "hace meses"
        pos: "phrase"
        en: "for months; months ago"
  - ordinal: 6
    slug: "llevo-un-ano-aprendiendo"
    title: "Say how long you've been learning"
    summary: "Hace un año que aprendo castellano"
    grammar:
      - "llevar.tiempo.gerundio"
      - "hace-que"
      - "seguir.gerundio"
      - "dejar-de"
      - "volver-a"
    register_max: "informal"
    sample:
      es: "Hace un año que aprendo castellano y sigo practicando."
      en: "I've been learning Spanish for a year and I'm still practising."
    tips:
      - title: "¿Hace cuánto?"
        body: "Every porteño asks it: **¿hace cuánto que estudiás?** — *how long have you been studying?*
          The everyday answer: **hace un año que estudio**; if it's recent, **hace poco que
          estudio**. You will also hear **llevo un año estudiando** — same thing, less common here.
          Or count from a moment: **desde que llegué** — *since I arrived*."
      - title: "Sigo, seguimos, siguen"
        body: "Everyone can keep at it: **sigo practicando**, **seguimos buscando** laburo, *mis amigos*
          **siguen tratando de** entenderme. And stop: **dejaron de** venir — *they stopped
          coming*."
      - title: "Volví a"
        body: "**Volver a** + an infinitive is *to do it again*: **volví a estudiar** — *I went back to
          studying*; **vuelvo a empezar** — *I'm starting over*."
    words:
      - lemma: "desde que"
        pos: "phrase"
        en: "since (the time when)"
      - lemma: "llevar"
        pos: "verb"
        forms:
          - form: "llevan"
            en: "they've been (for a time)"
            f: "3pl.pres.ind"
      - lemma: "aprender"
        pos: "verb"
        forms:
          - form: "aprendiendo"
            en: "learning"
            f: "ger"
      - lemma: "buscar"
        pos: "verb"
        forms:
