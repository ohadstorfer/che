# ---------------------------------------------------------------------------
# Che — Section 11 outline: "Between the lines" (B2.2)
#
# Saying what you mean without saying it outright: the subjunctive for what
# you're looking for but haven't found (un depto que tenga balcón), feelings
# that "give" you something (me da bronca que…), tactful advice (deberías,
# estaría bueno), what someone said they'd do (dijo que vendría), conditions
# (a menos que, por si), the signs on every door (se alquila), money in an
# inflationary city, things happening little by little (voy entendiendo),
# who you get along with (me cae bien), and a checkpoint of porteño irony.
#
# Plan: docs/course/roadmap.md §Section 11.
# Validate:  npm run course:validate -- --yaml
# ---------------------------------------------------------------------------

section:
  id: 11
  slug: "between-the-lines"
  title: "Between the lines"
  cefr: "B2.2"
  practice: 2   # practice lessons per unit, before the unit check (lessons.mjs)
units:
  - ordinal: 1
    slug: "un-depto-que-tenga"
    title: "Describe what you're looking for"
    summary: "Busco un depto que tenga balcón"
    grammar:
      - "subjuntivo.relativo-indefinido"
      - "alquiler"
    register_max: "informal"
    sample:
      es: "Busco un depto que tenga balcón."
      en: "I'm looking for an apartment that has a balcony."
    tips:
      - title: "Que tenga"
        body: "Something you're looking for but haven't found yet takes the subjunctive: **busco un depto
          que tenga balcón**. Once you've found it, it doesn't: *encontré un depto que tiene balcón*."
      - title: "La garantía"
        body: "Renting in Buenos Aires means the **inmobiliaria** asks for a **garantía** — a relative's
          property as a guarantee — and a **contrato**. Some **dueños** don't take **mascotas**."
    words:
      - lemma: "quedar"
        pos: "verb"
        forms:
          - form: "quede"
            en: "(that) it's located, (that) it's"
            f: "3sg.pres.subj"
      - lemma: "aceptar"
        pos: "verb"
        en: "to accept, to allow"
        forms:
          - form: "acepte"
            en: "(that) accepts, (that) allows"
            f: "3sg.pres.subj"
          - form: "acepta"
            en: "accepts, allows"
            f: "3sg.pres.ind"
      - lemma: "mascota"
        pos: "noun"
        en: "pet"
        forms:
          - form: "mascota"
            f: "f.sg"
          - form: "mascotas"
            en: "pets"
            f: "f.pl"
      - lemma: "contrato"
        pos: "noun"
        en: "contract, lease"
      - lemma: "garantía"
        pos: "noun"
        en: "guarantee, guarantor (for a lease)"
        note: "usually a property title a relative or friend puts up for your lease; the person is the garante"
      - lemma: "luminoso"
        pos: "adj"
        en: "bright, full of light"
        forms:
          - form: "luminoso"
            f: "m.sg"
          - form: "luminosa"
            f: "f.sg"

  - ordinal: 2
    slug: "conoces-a-alguien-que"
    title: "Ask around for someone who can help"
    summary: "¿Conocés a alguien que sepa?"
    grammar:
      - "subjuntivo.relativo-indefinido"
      - "nadie-que"
    register_max: "informal"
    sample:
      es: "¿Conocés a algún electricista que venga hoy?"
      en: "Do you know an electrician who can come today?"
    tips:
      - title: "Alguien que sepa"
        body: "People work like flats: if you don't know whether they exist, the subjunctive. **¿Conocés
          a alguien que arregle bicis?** Once you've found one, it's a fact: *tengo un amigo que
          **sabe** arreglar bicis*."
      - title: "No hay nadie que…"
        body: "Nobody, nothing, no one at all — always the subjunctive, because it doesn't exist: **no
          conozco a nadie que hable inglés**, **no hay ningún electricista que venga el domingo**."
      - title: "De confianza"
        body: "In Buenos Aires you don't google an electrician, you ask around: **¿tenés alguien de
          confianza?** Same for a flatmate: *busco a alguien **ordenado**, que no **fume** y que
          **comparta** los gastos*."
    words:
      - lemma: "alguno"
        pos: "det"
        en: "some, any (a … at all)"
        forms:
          - form: "algún"
            f: "m.sg"
          - form: "alguna"
            f: "f.sg"
      - lemma: "ninguno"
        pos: "det"
        en: "not a single, not any"
        forms:
          - form: "ningún"
            f: "m.sg"
          - form: "ninguna"
            f: "f.sg"
      - lemma: "electricista"
        pos: "noun"
        en: "electrician"
      - lemma: "de confianza"
        pos: "phrase"
        en: "trusted, someone you can trust"
      - lemma: "hablar"
        pos: "verb"
        forms:
          - form: "hable"
            en: "(that) he speaks, (that) I speak"
            f: "sg.pres.subj"
      - lemma: "arreglar"
        pos: "verb"
        forms:
          - form: "arregle"
            en: "(that) he fixes, (that) I fix"
            f: "sg.pres.subj"
      - lemma: "cocinar"
        pos: "verb"
        forms:
          - form: "cocine"
            en: "(that) he cooks, (that) I cook"
            f: "sg.pres.subj"
      - lemma: "compartir"
        pos: "verb"
        forms:
          - form: "comparta"
            en: "(that) he shares, (that) I share"
            f: "sg.pres.subj"
      - lemma: "fumar"
        pos: "verb"
        forms:
          - form: "fume"
            en: "(that) he smokes, (that) I smoke"
            f: "sg.pres.subj"
      - lemma: "ordenado"
        pos: "adj"
        en: "tidy, organised"
        forms:
          - form: "ordenado"
            f: "m.sg"
          - form: "ordenada"
            f: "f.sg"
      - lemma: "responsable"
        pos: "adj"
        en: "responsible, reliable"

  - ordinal: 3
    slug: "me-da-bronca"
    title: "Say what gets to you"
    summary: "Me da bronca que no avise"
    grammar:
      - "me-da.emocion"
      - "subjuntivo.emocion"
    register_max: "informal"
    sample:
      es: "Me da bronca que no avise."
      en: "It makes me mad that he doesn't let us know."
    tips:
      - title: "Me da bronca"
        body: "Porteños say a feeling *gives* them something: **me da bronca** — *it makes me mad*; **me da
          vergüenza** — *I'm embarrassed*; **me da lástima** — *I feel sorry*; **me da igual** — *I
          don't care*."
      - title: "Que + subjunctive"
        body: "What causes the feeling follows **que** in the subjunctive: **me da bronca que no
          conteste**, **me da vergüenza que me vean así**."
    words:
      - lemma: "bronca"
        pos: "noun"
        en: "anger"
        register: "informal"
      - lemma: "lástima"
        pos: "noun"
        en: "pity"
      - lemma: "me da igual"
        pos: "phrase"
        en: "I don't care, it's all the same to me"
      - lemma: "avisar"
        pos: "verb"
        forms:
          - form: "avise"
            en: "(that) he lets know, (that) I let know"
            f: "sg.pres.subj"
      - lemma: "contestar"
        pos: "verb"
        forms:
          - form: "conteste"
            en: "(that) he answers, (that) I answer"
            f: "sg.pres.subj"
      - lemma: "ver"
        pos: "verb"
        forms:
          - form: "vean"
            en: "(that) they see"
            f: "3pl.pres.subj.irregular"

  - ordinal: 4
    slug: "me-pone-nervioso-que"
    title: "Say what drives you up the wall"
    summary: "Me pone nervioso que llegue tarde"
    grammar:
      - "me-da.emocion"
      - "subjuntivo.emocion"
      - "poner.emocion"
    register_max: "informal"
    sample:
      es: "Me pone nervioso que cancele a último momento."
      en: "It drives me crazy that he cancels at the last minute."
    tips:
      - title: "Me pone nervioso"
        body: "**Poner** makes feelings too: **me pone nervioso que llegue tarde**, **me pone de mal
          humor que cancele**. Same shape as *me da bronca*: the feeling, then **que** + subjunctive."
      - title: "Me enoja, me alegra"
        body: "They work like *gustar*: **me enoja que me mienta**, **me alegra que vengas**. If you're
          the one doing it, no *que*, just the infinitive: *me enoja **llegar** tarde*."
      - title: "Me clavó el visto"
        body: "The porteño complaint of the WhatsApp age: **me clavó el visto** — *he left me on read*.
          And the friend who forgets everything is **re colgado**."
    words:
      - lemma: "poner"
        pos: "verb"
        forms:
          - form: "me pone"
            en: "it makes me (feel)"
            f: "3sg.pres.ind.clitic"
      - lemma: "enojar"
        pos: "verb"
        en: "to make angry"
        forms:
          - form: "me enoja"
            en: "it makes me angry"
            f: "3sg.pres.ind.clitic"
          - form: "enoja"
            f: "3sg.pres.ind"
            bound: true
      - lemma: "alegrar"
        pos: "verb"
        en: "to make happy"
        forms:
          - form: "me alegra"
            en: "it makes me happy"
            f: "3sg.pres.ind.clitic"
          - form: "alegra"
            f: "3sg.pres.ind"
            bound: true
      - lemma: "cancelar"
        pos: "verb"
        en: "to cancel"
        forms:
          - form: "cancelar"
            f: "inf"
          - form: "cancele"
            en: "(that) he cancels, (that) I cancel"
            f: "sg.pres.subj"
          - form: "canceló"
            en: "he cancelled, she cancelled"
            f: "3sg.pret.ind"
      - lemma: "olvidarse"
        pos: "verb"
        forms:
          - form: "se olvide"
            en: "(that) he forgets"
            f: "3sg.pres.subj.clitic"
      - lemma: "mentir"
        pos: "verb"
        forms:
          - form: "mienta"
            en: "(that) he lies, (that) I lie"
            f: "sg.pres.subj.irregular"
      - lemma: "humor"
        pos: "noun"
        en: "mood"
        note: "de mal humor = in a bad mood"
      - lemma: "a último momento"
        pos: "phrase"
        en: "at the last minute"
      - lemma: "celos"
        pos: "noun"
        en: "jealousy"
      - lemma: "colgado"
        pos: "adj"
        en: "scatterbrained, spaced out"
        register: "informal"
        forms:
          - form: "colgado"
            f: "m.sg"
          - form: "colgada"
            f: "f.sg"
      - lemma: "me clavó el visto"
        pos: "phrase"
        en: "he left me on read"
        register: "informal"

  - ordinal: 5
    slug: "deberias"
    title: "Give advice gently"
    summary: "Deberías descansar"
    grammar:
      - "deber.condicional"
      - "estaria-bueno"
    register_max: "informal"
    sample:
      es: "Deberías descansar un poco."
      en: "You should rest a little."
    tips:
      - title: "Deberías"
        body: "**Deberías** — *you should* — is advice with the edges sanded off: **deberías descansar**.
          **Debería** is *I should* or *he should*: *debería llamar a mi vieja*."
      - title: "Estaría bueno"
        body: "The softest porteño suggestion is **estaría bueno** — *it would be nice*: **estaría bueno
          juntarnos**, **estaría bueno que vengas**. **Habría que** is *we ought to*: *habría que avisarle*."
    words:
      - lemma: "deber"
        pos: "verb"
        forms:
          - form: "deberías"
            en: "you should"
            f: "2sg.cond.ind.vos"
          - form: "debería"
            en: "I should, he should, she should"
            f: "sg.cond.ind"
      - lemma: "estaría bueno"
        pos: "phrase"
        en: "it would be nice, it would be good"
      - lemma: "habría que"
        pos: "phrase"
        en: "we ought to, someone should"
      - lemma: "consejo"
        pos: "noun"
        en: "piece of advice"
      - lemma: "cuidar"
        pos: "verb"
        forms:
          - form: "cuidar"
            f: "inf"
          - form: "cuido"
            en: "I take care of"
            f: "1sg.pres.ind"

  - ordinal: 6
    slug: "deberias-tomarte-unos-dias"
    title: "Talk a stressed friend down"
    summary: "Deberías tomarte unos días"
    grammar:
      - "deber.condicional"
      - "estaria-bueno"
      - "deber.condicional.personas"
    register_max: "informal"
    sample:
      es: "Deberías tomarte unos días, estás re quemado."
      en: "You should take a few days off, you're totally burnt out."
    tips:
      - title: "Deberíamos, deberían"
        body: "The whole family of soft advice: **deberíamos juntarnos más** — *we should get together
          more*; **deberían pagarte más** — *they ought to pay you more*. Advice to *us* is the
          gentlest of all."
      - title: "Estaría bueno que…"
        body: "With a person after it, **que** + subjunctive: **estaría bueno que te tomes unos días**.
          Without one, the infinitive: *estaría bueno **descansar***. And the push: **¡animate!** —
          *go for it!*"
      - title: "Terapia"
        body: "Buenos Aires has more psychologists per person than almost anywhere, so **deberías ir a
          terapia** isn't an insult — it's what a good friend says."
    words:
      - lemma: "deber"
        pos: "verb"
        forms:
          - form: "deberíamos"
            en: "we should"
            f: "1pl.cond.ind"
          - form: "deberían"
            en: "they should, you all should"
            f: "3pl.cond.ind"
      - lemma: "tomarse"
        pos: "verb"
        en: "to take (time off, a break)"
        forms:
          - form: "tomarte"
            en: "(to) take (for yourself)"
            f: "inf.clitic"
          - form: "te tomes"
            en: "(that) you take (for yourself)"
            f: "2sg.pres.subj.vos.clitic"
      - lemma: "animarse"
        pos: "verb"
        en: "to dare, to go for it"
        forms:
          - form: "animate"
            en: "go for it"
            f: "2sg.imp.vos.clitic"
          - form: "me animo"
            en: "I dare, I'm up for it"
            f: "1sg.pres.ind.clitic"
          - form: "animo"
            f: "1sg.pres.ind"
            bound: true
      - lemma: "terapia"
        pos: "noun"
        en: "therapy"
      - lemma: "estresado"
        pos: "adj"
        en: "stressed"
        forms:
          - form: "estresado"
            f: "m.sg"
          - form: "estresada"
            f: "f.sg"
      - lemma: "quemado"
        pos: "adj"
        en: "burnt out, fried"
        register: "informal"
        forms:
          - form: "quemado"
            f: "m.sg"
          - form: "quemada"
            f: "f.sg"
      - lemma: "encarar"
        pos: "verb"
        en: "to face, to tackle (a problem, a person)"
        forms:
          - form: "encarar"
            f: "inf"
      - lemma: "paciencia"
        pos: "noun"
        en: "patience"
      - lemma: "franco"
        pos: "noun"
        en: "day off (from work)"
      - lemma: "sincero"
        pos: "adj"
        en: "honest, sincere"
        forms:
          - form: "sincero"
            f: "m.sg"
          - form: "sincera"
            f: "f.sg"
      - lemma: "hacer caso"
        pos: "phrase"
        en: "to listen to (someone's advice), to do as told"
        forms:
          - form: "hacele caso"
            en: "listen to him, do what he says"
            f: "2sg.imp.vos.clitic"

  - ordinal: 7
    slug: "practica-me-da-igual"
    title: "Practice: what you want, what gets to you, advice"
    summary: "Deberías buscar algo que te guste"
    grammar:
      - "repaso.subjuntivo.relativo"
      - "repaso.me-da"
      - "repaso.deberias"
    register_max: "informal"
    sample:
      es: "Me da igual."
      en: "I don't care."
    tips:
      - title: "Que tenga, que avise"
        body: "The subjunctive after **que** for what you haven't found (*un depto que tenga balcón*) and for what makes you feel something (*me da bronca que no avise*)."
      - title: "Deberías, estaría bueno"
        body: "**Deberías** for advice, **estaría bueno** for a gentle suggestion."
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "quede"
      - "acepte"
      - "mascotas"
      - "dueño"
      - "contrato"
      - "bronca"
      - "vergüenza"
      - "me da igual"
      - "avise"
      - "deberías"
      - "debería"
      - "estaría bueno"
      - "habría que"
      - "quería"
      - "aunque"

  - ordinal: 8
    slug: "practica-alguien-que-sepa"
    title: "Practice: someone who can, what drives you mad, advice"
    summary: "Estaría bueno que te animes"
    grammar:
      - "repaso.subjuntivo.relativo"
      - "repaso.me-da"
      - "repaso.deberias"
    register_max: "informal"
    sample:
      es: "No conozco a nadie que cocine como mi vieja."
      en: "I don't know anyone who cooks like my mum."
    tips:
      - title: "Alguien que, nadie que"
        body: "**¿Conocés a alguien que arregle bicis?** — don't know if they exist, subjunctive. **No hay
          nadie que cocine así** — they don't, subjunctive again. **Me pone nervioso que cancele** — a
          feeling about it, subjunctive too."
      - title: "Deberíamos, estaría bueno que"
        body: "**Deberíamos juntarnos**, **deberían pagarte más**, **estaría bueno que te tomes unos
          días**. And when they're scared: **¡animate!**"
    # A practice unit (roadmap §Practice): no new words, these earlier ones again.
    review:
      - "algún"
      - "ningún"
      - "de confianza"
      - "arregle"
      - "comparta"
      - "me pone"
      - "me enoja"
      - "cancele"
      - "a último momento"
      - "deberíamos"
      - "animate"
      - "terapia"
      - "quemado"
      - "acepte"
      - "me da igual"
      - "estaría bueno"

  - ordinal: 9
    slug: "dijo-que-vendria"
    title: "Say what someone said they'd do"
    summary: "Dijo que vendría"
    grammar:
      - "discurso-referido.condicional"
      - "prometer"
    register_max: "informal"
    sample:
      es: "Juan dijo que vendría, pero no vino."
      en: "Juan said he'd come, but he didn't."
    tips:
      - title: "Vendrá → vendría"
        body: "Reporting a promise moves it into *would*: «voy» → **dijo que iría**; «te llamo» → **dijo que
          me llamaría**. Porteños also say **dijo que iba a venir** — same thing."
      - title: "Me prometiste"
        body: "**Me prometiste que vendrías** — *you promised me you'd come*. And the classic ending:
          **al final no vino**."
    words:
      - lemma: "venir"
        pos: "verb"
        forms:
          - form: "vendría"
            en: "I would come, he would come"
            f: "sg.cond.ind.irregular"
          - form: "vendrías"
            en: "you would come"
            f: "2sg.cond.ind.vos.irregular"
      - lemma: "llamar"
        pos: "verb"
        forms:
          - form: "llamaría"
            en: "I would call, he would call"
            f: "sg.cond.ind"
      - lemma: "prometer"
        pos: "verb"
        forms:
          - form: "prometió"
            en: "he promised, she promised"
            f: "3sg.pret.ind"
          - form: "prometiste"
            en: "you promised"
            f: "2sg.pret.ind.vos"
      - lemma: "promesa"
        pos: "noun"
        en: "promise"
      - lemma: "cumplir"
        pos: "verb"
        en: "to keep (a promise), to fulfil"
        forms:
          - form: "cumplió"
            en: "he kept (his word)"
            f: "3sg.pret.ind"
          - form: "cumplir"
            f: "inf"

  - ordinal: 10
    slug: "dijo-que-pasaria"
    title: "Chase a promise that didn't happen"
    summary: "El técnico dijo que pasaría el martes"
    grammar:
      - "discurso-referido.condicional"
      - "prometer"
      - "asegurar"
    register_max: "informal"
    sample:
      es: "El técnico dijo que pasaría el martes, pero al final no vino."
      en: "The repairman said he'd come by on Tuesday, but in the end he didn't come."
    tips:
      - title: "Pasaría, traería, devolvería"
        body: "Any verb goes into *would* the same way — the infinitive plus **-ía**: *pasar* → **dijo
          que pasaría**; *devolver* → **me juró que me la devolvería**. A few change the stem: *poner*
          → **pondría**, like *tener* → *tendría*."
      - title: "Me aseguró que…"
        body: "Porteños rarely just *say* a promise: **me aseguró que**, **me juró que**. Then comes the
          **excusa** — and you learn not to **confiar** in the **mentiroso**."
    words:
      - lemma: "pasar"
        pos: "verb"
        forms:
          - form: "pasaría"
            en: "I would come by, he would come by"
            f: "sg.cond.ind"
      - lemma: "traer"
        pos: "verb"
        forms:
          - form: "traería"
            en: "I would bring, he would bring"
            f: "sg.cond.ind"
      - lemma: "devolver"
        pos: "verb"
        forms:
          - form: "devolvería"
            en: "I would give back, he would give back"
            f: "sg.cond.ind"
      - lemma: "poner"
        pos: "verb"
        forms:
          - form: "pondría"
            en: "I would put, he would put"
            f: "sg.cond.ind.irregular"
      - lemma: "arreglar"
        pos: "verb"
        forms:
          - form: "arreglaría"
            en: "I would fix, he would fix"
            f: "sg.cond.ind"
      - lemma: "asegurar"
        pos: "verb"
        en: "to assure, to swear (to someone)"
        forms:
          - form: "aseguró"
            en: "he assured, she assured"
            f: "3sg.pret.ind"
      - lemma: "respuesta"
        pos: "noun"
        en: "answer, reply"
      - lemma: "excusa"
        pos: "noun"
        en: "excuse"
      - lemma: "mentiroso"
        pos: "adj"
        en: "liar, lying"
        forms:
          - form: "mentiroso"
            f: "m.sg"
          - form: "mentirosa"
            f: "f.sg"
      - lemma: "confiar"
        pos: "verb"
        forms:
          - form: "confiar"
            f: "inf"
      - lemma: "creer"
        pos: "verb"
        forms:
          - form: "creí"
            en: "I believed"
