      es: "Si hubiéramos salido antes, no hubiéramos perdido el vuelo."
      en: "If we'd left earlier, we wouldn't have missed the flight."
    tips:
      - title: "Hubiéramos, hubieran"
        body: "For *we*: **si hubiéramos salido antes, no hubiéramos perdido el vuelo**. For *they*: **si
          hubieran avisado, hubiéramos venido**. Still **hubiera** in both halves, the porteño way.
          On its own, **hubiéramos** / **hubieran** + participle is a complaint — *we should have,
          they should have*: **¡hubiéramos ido en tren!** — *we should have gone by train!*"
      - title: "More participles"
        body: "-ar verbs take **-ado**, the rest **-ido**: **tomado, reservado, quedado, perdido,
          conseguido**. *Traer* gives **traído**, with an accent. *Si hubiera tomado un taxi…*, *si
          me hubiera quedado en casa…*"
      - title: "Qué mala suerte"
        body: "When nobody's to blame: **¡qué mala suerte!** And at Ezeiza, the international airport, the
          board says what every porteño expects: the flight is **demorado** — *delayed*."
