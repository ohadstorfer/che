            en: "looking for"
            f: "ger"
      - lemma: "practicar"
        pos: "verb"
        forms:
          - form: "practicando"
            en: "practicing"
            f: "ger"
      - lemma: "mejorar"
        pos: "verb"
        en: "to improve, to get better"
        forms:
