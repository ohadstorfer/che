  - ordinal: 25
    slug: "que-novedad"
    title: "Answer with a raised eyebrow"
    summary: "¿Otra vez tarde? ¡Qué novedad!"
    grammar:
      - "ironia"
      - "repaso.b2"
    register_max: "informal"
    sample:
      es: "¿Otra vez llega tarde? ¡Qué novedad!"
      en: "Late again? What a surprise!"
    tips:
      - title: "Sí, claro"
        body: "Said slowly, **sí, claro** means *yeah, right*. **¡Qué novedad!** — *what a surprise* —
          is for the bondi that's late again; **¡lo que faltaba!** — *that's all we needed* — for the
          rain that starts on top of it. The tone does the work."
      - title: "Justo hoy"
        body: "**Justo** makes a complaint: **justo hoy** — *today of all days*. And **ya fue** — *forget
          it, it's done* — closes the subject: *¿no vino? Ya fue.*"
      - title: "Ni a palos"
        body: "**Ni a palos** — *not in a million years*. The opposite shrug: **dale que va** — *good
          enough, let's go*. When something's awful: **está de terror**."
