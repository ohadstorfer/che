  - ordinal: 18
    slug: "te-doy-la-razon"
    title: "Admit you were wrong"
    summary: "Pensándolo bien, tenés razón"
    grammar:
      - "debate"
      - "repaso.b2"
    register_max: "informal"
    sample:
      es: "Pensándolo bien, te doy la razón: me equivoqué."
      en: "Thinking about it, you're right: I was wrong."
    tips:
      - title: "Me equivoqué"
        body: "The hardest words in any argument: **me equivoqué** — *I was wrong*. To a friend: **te
          equivocás** — *you're wrong*. To admit it: **reconozco que** tenés razón — *I admit you're
          right* — or just **te doy la razón** — *you're right*. **En eso** te doy la razón —
          *you're right about that* — admits only one point."
      - title: "¡Nada que ver!"
        body: "An argument in Buenos Aires is a sport, not a fight: **discutimos** a lot and stay friends.
          To reject a point, say **¡nada que ver!** — *not at all!* (it can also mean *nothing
          alike* or *nothing to do with it*). If the other person won't listen: **no seas cabeza
          dura** — *don't be so stubborn*."
      - title: "A ver, pensándolo bien"
        body: "**A ver** — *let's see* — slows an argument down. **Pensándolo bien** — *on second thought* —
          is how you change sides: *pensándolo bien, me convenciste* — *on second thought, you
          convinced me*. To heat it up again: **sos un exagerado** — *you're being dramatic*."
      - title: "Arguing like a porteño"
        body: "An argument in Buenos Aires is a sport, not a fight: **discutimos** a lot and stay friends.
          **Me convenciste** — *you've convinced me*; **cambié de idea** — *I changed my mind*."
      - title: "¡Ojo!"
        body: "**¡Ojo!** — literally *eye!* — is *careful!, watch out!*: **ojo, que no es tan fácil**.
          **Estoy seguro** — *I'm sure*; **no estoy segura** — *I'm not sure*."
    words:
      - lemma: "equivocarse"
        pos: "verb"
        en: "to be wrong, to make a mistake"
        forms:
          - form: "me equivoqué"
            en: "I was wrong, I made a mistake"
