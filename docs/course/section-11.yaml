  - ordinal: 15
    slug: "por-un-lado"
    title: "Weigh both sides"
    summary: "Por un lado sí, por otro no"
    grammar:
      - "conectores.argumentacion"
      - "opinar"
    register_max: "informal"
    sample:
      es: "Por un lado es caro, pero por otro lado vale la pena."
      en: "On the one hand it's expensive, but on the other hand it's worth it."
    tips:
      - title: "Por un lado, por otro lado"
        body: "**Por un lado… por otro lado** weighs two sides. **En cambio** — *but, on the other hand* —
          sets two people or things against each other: *yo laburo, en cambio él no*."
      - title: "De hecho, en realidad"
        body: "**De hecho** — *in fact* — backs up what you just said: *no es caro; de hecho, es barato*.
          **En realidad** — *actually* — corrects it: *en realidad no es tan caro*. **Por eso** —
          *that's why*: *está cerca, por eso me gusta*."
      - title: "Para mí"
        body: "To give your view, porteños say **para mí** or **me parece que**: *para mí conviene esperar*;
          *me parece que es caro*. **¿Qué opinás?** is the natural question; **opino que…** as an
          answer sounds stiff."
    words:
