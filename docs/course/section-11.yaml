      - title: "Que tenga"
        body: "Something you're looking for but haven't found yet takes the subjunctive: **busco un depto
          que tenga balcón**. Once you've found it, it doesn't: *encontré un depto que tiene
          balcón*."
      - title: "La garantía"
        body: "To rent in Buenos Aires you need a **garantía** — *a guarantor*, usually a relative who owns
          property: *mi papá me sale de garantía* — *my dad is my guarantor*. No garantía?
          Foreigners often pay a **seguro de caución** — *rent guarantee insurance* — or take an
          **alquiler temporario amoblado** — *a furnished short-term rental*."
