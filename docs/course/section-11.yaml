            f: "inf"
          - form: "mejorando"
            en: "improving, getting better"
            f: "ger"
      - lemma: "tratar de"
        pos: "phrase"
        en: "to try to"
        forms:
          - form: "trato de"
            en: "I try to"
            f: "1sg.pres.ind"
          - form: "tratando de"
            en: "trying to"
            f: "ger"
      - lemma: "seguir"
        pos: "verb"
        forms:
          - form: "seguimos"
            en: "we keep on, we still"
            f: "1pl.pres.ind"
          - form: "siguen"
            en: "they keep on, they still"
            f: "3pl.pres.ind.irregular"
      - lemma: "dejar"
        pos: "verb"
        forms:
          - form: "dejaron"
            en: "they left, they stopped"
            f: "3pl.pret.ind"
      - lemma: "hace un año"
        pos: "phrase"
